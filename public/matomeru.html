<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🦉 まとめる君 — CoWell</title>
<link rel="icon" href="/img/cowell-favicon-32-v2.png">
<style>
:root { --bg:#f8fafc; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --sub:#64748b; --teal:#0d9488; --teal-d:#0f766e; --amber:#c2410c; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, 'Hiragino Sans', 'Yu Gothic UI', 'Meiryo', sans-serif; min-height: 100vh; }
main { max-width: 820px; margin: 0 auto; padding: 16px; }
.hero { display: flex; align-items: center; gap: 14px; background: linear-gradient(135deg, #fff7ed, #ffedd5); border: 1px solid #fed7aa; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
.hero img { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; }
.hero .t { font-size: 18px; font-weight: 800; color: #9a3412; margin: 0 0 2px; }
.hero .d { font-size: 12.5px; color: #b45309; line-height: 1.5; }
.tabs { display: flex; gap: 8px; margin-bottom: 12px; }
.tab { flex: 1; padding: 10px; border: 2px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--sub); text-align: center; }
.tab.active { border-color: var(--amber); background: #fff7ed; color: #9a3412; }
.tab small { display: block; font-weight: 400; font-size: 10.5px; color: #94a3b8; margin-top: 2px; }
.tab.active small { color: #c2410c; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px; }
textarea { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 14px; font-size: 14px; line-height: 1.6; outline: none; resize: vertical; font-family: inherit; }
textarea:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(194,65,12,0.12); }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 11px 18px; border: none; border-radius: 13px; background: linear-gradient(135deg, #ea580c, #c2410c); color: #fff; font-size: 14px; font-weight: 800; cursor: pointer; }
.btn:hover { opacity: .92; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 700; }
.btn img { width: 20px; height: 20px; object-fit: contain; }
.status { font-size: 12.5px; color: var(--sub); min-height: 18px; }
.count { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 4px; }
.out-card { border: 2px solid #fed7aa; background: #fffbeb; }
.out-card textarea { background: #fff; }
.hint { font-size: 11.5px; color: var(--sub); margin-top: 8px; line-height: 1.6; }
.hint b { color: var(--amber); }
</style>
<script src="/unify-header.js" defer></script>
<script src="/version-check.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style id="biz-udp-global">
html,body,button,input,select,textarea{font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
body :not(code):not(pre):not(kbd):not(samp):not(tt):not([style*="monospace"]):not([style*="Consolas"]):not([style*="SF Mono"]):not([style*="Mincho"]):not([style*="游明朝"]):not([style*="Yu Mincho"]){font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
code,pre,kbd,samp,tt{font-family:ui-monospace,Consolas,"SF Mono","Courier New",monospace!important}
</style>
<style id="cohub-swipe-guard">html,body{overscroll-behavior-x:none}</style>
</head>
<body>
<header>
  <a href="/home" class="back">←</a>
  <h1>🦉 まとめる君</h1>
</header>

<main>
  <div class="hero">
    <img src="/assets/matomeru-owl.png" alt="まとめる君">
    <div>
      <p class="t">文章に翼をさずけよう。</p>
      <div class="d">走り書きのメモを、AIがきれいな報告に。事故・トラブル・業務の報告メモを貼り付けて「整える」を押すだけ。5W1Hに整理します。書いていないことは創作しません。</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-report" onclick="setMode('report')">📋 報告を整える<small>5W1H形式（事故・トラブル等）</small></div>
    <div class="tab" id="tab-weekly" onclick="setMode('weekly')">📊 週報を整える<small>読みやすい週次レポート</small></div>
  </div>

  <div class="card">
    <label>メモ・走り書き（そのままでOK）</label>
    <textarea id="mtm-input" rows="8" maxlength="4000" placeholder="例：きょう14時ごろ海老名の倉庫で2tトラックが後退中にポールに接触。けが人なし。バンパー軽くへこみ。運転は田中さん。所長に報告済み。"></textarea>
    <div class="count"><span id="mtm-cnt">0</span> / 4000字</div>
    <div class="row">
      <button class="btn" id="mtm-format-btn" onclick="doFormat()"><img src="/assets/matomeru-owl.png" alt="">✨ 整える</button>
      <span class="status" id="mtm-status"></span>
    </div>
  </div>

  <div class="card out-card" id="out-wrap" style="display:none;">
    <label>整えた結果（手直しできます）</label>
    <textarea id="mtm-output" rows="12"></textarea>
    <div class="row">
      <button class="btn" onclick="copyOut()">📋 コピー</button>
      <button class="btn ghost" onclick="doFormat()">🔄 もう一度整える</button>
      <span class="status" id="copy-status"></span>
    </div>
    <div class="hint">そのままチャットやメールに貼り付けて報告できます。AIは<b>メモにない情報を勝手に足しません</b>。不足があれば末尾に「※確認したい点」を出します。</div>
  </div>
</main>

<script>
const token = localStorage.getItem('cohub_token');
if (!token) location.replace('/');
let mode = 'report';

function setMode(m) {
  mode = m;
  document.getElementById('tab-report').classList.toggle('active', m === 'report');
  document.getElementById('tab-weekly').classList.toggle('active', m === 'weekly');
  const ph = (m === 'weekly')
    ? '例：今週は配送○○件、稼働率高め。△△様の新規案件スタート。事故クレームなし。来週は人員調整が課題。'
    : '例：きょう14時ごろ海老名の倉庫で2tトラックが後退中にポールに接触。けが人なし。バンパー軽くへこみ。運転は田中さん。所長に報告済み。';
  document.getElementById('mtm-input').placeholder = ph;
}

const inp = document.getElementById('mtm-input');
inp.addEventListener('input', function () { document.getElementById('mtm-cnt').textContent = inp.value.length; });

async function doFormat() {
  const text = inp.value.trim();
  const status = document.getElementById('mtm-status');
  if (!text) { status.style.color = '#dc2626'; status.textContent = 'メモを入力してください'; return; }
  const btn = document.getElementById('mtm-format-btn');
  btn.disabled = true; status.style.color = '#64748b'; status.textContent = '🦉 整えています…（10秒ほど）';
  try {
    const r = await fetch('/api/report/format', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ text: text, mode: mode })
    });
    if (r.status === 401) { localStorage.removeItem('cohub_token'); location.replace('/'); return; }
    const j = await r.json();
    if (!j.success) { status.style.color = '#dc2626'; status.textContent = j.msg || '整形に失敗しました'; return; }
    document.getElementById('mtm-output').value = j.formatted || '';
    document.getElementById('out-wrap').style.display = '';
    status.style.color = '#0f766e'; status.textContent = '✓ 整いました。確認して使ってください';
    document.getElementById('out-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  } catch (e) {
    status.style.color = '#dc2626'; status.textContent = '通信エラー';
  } finally { btn.disabled = false; }
}

async function copyOut() {
  const out = document.getElementById('mtm-output').value;
  const cs = document.getElementById('copy-status');
  if (!out.trim()) return;
  try {
    await navigator.clipboard.writeText(out);
    cs.style.color = '#0f766e'; cs.textContent = '✓ コピーしました';
  } catch (e) {
    // フォールバック
    const ta = document.getElementById('mtm-output');
    ta.select(); document.execCommand('copy');
    cs.style.color = '#0f766e'; cs.textContent = '✓ コピーしました';
  }
  setTimeout(function () { cs.textContent = ''; }, 2500);
}
</script>
  <script src="/translate.js?v=20260622f" defer></script>
<script src="/kiosk-guard.js?v=20260703-idle3" defer></script>
</body>
</html>
