<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>申請・承認 | CoWell</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f5f7fb;margin:0;color:#1f2937}
  .header{background:linear-gradient(135deg,#3730a3,#6d28d9);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .header h1{font-size:18px;margin:0;font-weight:800;flex:1}
  .back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}
  .container{max-width:1100px;margin:14px auto;padding:0 12px 40px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px;margin-bottom:14px}
  .card-title{font-size:16px;font-weight:800;margin-bottom:12px;color:#4338ca}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  label{font-size:12px;font-weight:700;color:#475569}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid #cbd5e1;border-radius:13px;font-size:14px;background:#fff}
  textarea{min-height:64px;resize:vertical}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{border:none;border-radius:13px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:800;color:#fff}
  .btn-primary{background:#4338ca}.btn-blue{background:#2563eb}.btn-green{background:#059669}.btn-gray{background:#7c8797}.btn-orange{background:#d97706}.btn-red{background:#dc2626}
  .btn:active{transform:translateY(1px)}.btn.busy{opacity:.6;pointer-events:none}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:12px}
  .nav-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .nav-btn{border:none;border-radius:14px;padding:9px 16px;cursor:pointer;font-weight:800;background:#e0e7ff;color:#3730a3;font-size:13px}
  .nav-btn.active{background:#4338ca;color:#fff}
  .section{display:none}.section.active{display:block}
  .msg{margin-top:10px;padding:10px 12px;border-radius:13px;font-size:13px;display:none;white-space:pre-wrap}
  .msg.info{display:block;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe}
  .msg.success{display:block;background:#e7f7ee;color:#156d45;border:1px solid #bde3ca}
  .msg.error{display:block;background:#fdeaea;color:#a12a2a;border:1px solid #f2bcbc}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #e4eaf2;padding:8px;text-align:left;vertical-align:top}
  th{background:#f7f9fc;font-size:12px}
  .mono{font-family:Consolas,monospace;font-size:11px}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
  .st-申請中{background:#2563eb}.st-承認済{background:#059669}.st-差戻し{background:#d97706}.st-却下{background:#dc2626}
  .chain-box{background:#eef2ff;border:1px solid #c7d2fe;border-radius:13px;padding:10px 12px;font-size:13px;line-height:1.7;color:#3730a3;margin-top:10px}
  .small{font-size:12px;color:#64748b}
  .step{display:inline-block;padding:2px 8px;border-radius:12px;background:#e2e8f0;color:#475569;margin:2px;font-size:12px;font-weight:700}
  .step.cur{background:#4338ca;color:#fff}
  .step.done{background:#059669;color:#fff}
  .hist{font-size:12px;border-left:3px solid #c7d2fe;padding:4px 0 4px 10px;margin:6px 0;color:#334155}
  /* 詳細ポップアップ (2026-07-29: 最下段カード→モーダル化。一覧のすぐ上に出て確認しやすく)
     ⚠️背景ごとスクロール(align-items:flex-start + overlayにoverflow-y)= タブレット横向きでも下部ボタンに届く
     ⚠️背景クリックでは閉じない(スマホの誤タップで消える事故を避ける)。閉じるのは ✕ / 閉じるボタン / Escのみ */
  .dmodal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:9998;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 12px}
  .dmodal-bg.show{display:flex}
  .dmodal{background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(15,23,42,.28);width:100%;max-width:680px;margin:auto;max-height:none;overflow:visible}
  .dmodal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #e4eaf2;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:1}
  .dmodal-head .t{flex:1;min-width:0;font-size:16px;font-weight:800;color:#4338ca}
  .dmodal-x{border:none;background:#eef2ff;color:#3730a3;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:800;cursor:pointer;flex-shrink:0;line-height:1}
  .dmodal-x:active{transform:translateY(1px)}
  .dmodal-body{padding:16px}
  .dmodal-foot{padding:10px 16px 16px;text-align:right}
  /* コメント欄はiOSの自動ズーム回避のため16px以上にする */
  .dmodal-body input[type="text"],.dmodal-body input:not([type]){font-size:16px}
  @media(max-width:600px){.dmodal-body{padding:13px}.dmodal-head{padding:12px 13px}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay-card{background:#fff;border-radius:14px;padding:20px 26px;text-align:center;min-width:240px}
  .spinner{width:30px;height:30px;border:4px solid #d9e1ec;border-top-color:#4338ca;border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style id="biz-udp-global">
html,body,button,input,select,textarea{font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
body :not(code):not(pre):not(kbd):not(samp):not(tt):not([style*="monospace"]):not([style*="Consolas"]):not([style*="SF Mono"]):not([style*="Mincho"]):not([style*="游明朝"]):not([style*="Yu Mincho"]){font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
code,pre,kbd,samp,tt{font-family:ui-monospace,Consolas,"SF Mono","Courier New",monospace!important}
</style>
<style id="cohub-swipe-guard">html,body{overscroll-behavior-x:none}</style>
</head>
<body>
<div class="header">
  <button class="back" onclick="goBack()">← 戻る</button>
  <h1>📑 申請・承認</h1>
  <span id="whoami" class="small" style="color:#e0e7ff"></span>
</div>
<div class="container">
  <div class="nav-row">
    <button class="nav-btn active" id="navForm" onclick="showSection('form')">申請する</button>
    <button class="nav-btn" id="navPending" onclick="showSection('pending');loadPending()">承認待ち <span id="pending-cnt" class="badge" style="background:#dc2626;display:none;">0</span></button>
    <button class="nav-btn" id="navList" onclick="showSection('list');loadList()">申請一覧</button>
    <button class="nav-btn hidden" id="navAdmin" onclick="showSection('admin');loadAdmin()">ルート管理</button>
  </div>

  <!-- 申請 -->
  <div id="sectionForm" class="section active">
    <div class="card">
      <div class="card-title">新規申請</div>
      <div class="grid">
        <div class="field" style="grid-column:1/-1"><label>件名</label><input id="f_subject" placeholder="例: ノートPC購入"></div>
        <div class="field"><label>申請種別</label><select id="f_type" onchange="clearPreview()"></select></div>
        <div class="field"><label>営業所</label><select id="f_office" onchange="onOfficeChange()"></select></div>
        <div class="field"><label>金額(税抜・円)</label><input id="f_amount" inputmode="numeric" placeholder="0" oninput="clearPreview()"></div>
        <div class="field"><label>添付PDF(最大3)</label><input type="file" id="f_files" accept="application/pdf,.pdf" multiple onchange="addFiles(this)"><div class="small">最大3件まで。まとめて選ぶか、1件ずつ追加できます。</div></div>
      </div>
      <div id="filePreview" class="chain-box hidden"></div>
      <div id="previewBox" class="chain-box hidden"></div>
      <div class="btn-row">
        <button class="btn btn-blue" onclick="confirmApp()">確認</button>
        <button class="btn btn-primary" onclick="submitApp()">申請する</button>
      </div>
      <div id="formMsg" class="msg"></div>
    </div>
  </div>

  <!-- 承認待ち -->
  <div id="sectionPending" class="section">
    <div class="card">
      <div class="card-title">あなたの承認待ち</div>
      <div class="btn-row" style="margin-top:0"><button class="btn btn-blue" onclick="loadPending()">更新</button></div>
      <div id="pendingMsg" class="msg"></div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>申請日</th><th>件名</th><th>種別</th><th>営業所</th><th>金額</th><th>承認ルート</th><th></th></tr></thead><tbody id="pendingBody"><tr><td colspan="7" class="small">読み込み中…</td></tr></tbody></table></div>
    </div>
  </div>

  <!-- 一覧 -->
  <div id="sectionList" class="section">
    <div class="card">
      <div class="card-title">申請一覧</div>
      <div class="btn-row" style="margin-top:0;align-items:center;gap:10px;flex-wrap:wrap">
        <button class="btn btn-blue" onclick="loadList()">更新</button>
        <label class="small" style="margin-left:auto;display:inline-flex;align-items:center;gap:6px">部署で絞り込み
          <select id="f_list_office" onchange="renderList()" style="padding:6px 8px;font-size:13px"></select>
        </label>
      </div>
      <div id="listMsg" class="msg"></div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>申請日</th><th>申請番号</th><th>件名</th><th>種別</th><th>営業所</th><th>金額</th><th>承認ルート</th><th>状態</th><th></th></tr></thead><tbody id="listBody"><tr><td colspan="9" class="small">読み込み中…</td></tr></tbody></table></div>
    </div>
  </div>

  <!-- ルート管理 (管理職) -->
  <div id="sectionAdmin" class="section">
    <div class="card">
      <div class="card-title">役職の担当者割当</div>
      <div class="small">役職コードと営業所（全社=ALL、所長は営業所別）に担当者を割り当てます。組織変更時はここを更新。</div>
      <div class="btn-row" style="margin-top:8px;align-items:flex-end">
        <div class="field" style="min-width:110px"><label>役職</label><select id="a_role"></select></div>
        <div class="field" style="min-width:140px"><label>営業所</label><select id="a_office"></select></div>
        <div class="field" style="min-width:180px"><label>担当者</label><select id="a_user"></select></div>
        <button class="btn btn-primary" onclick="addAssignment()">割当追加</button>
      </div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>役職</th><th>営業所</th><th>担当者</th><th></th></tr></thead><tbody id="asgBody"></tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title">承認ルート</div>
      <div class="small">「申請種別 × 金額帯 × 営業所」ごとに、承認が回る順番（承認の流れ）を決めます。役職は名前で選ぶだけ。営業所「全社」は全営業所に適用されます。</div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>申請種別</th><th>営業所</th><th>金額帯</th><th>承認の流れ</th><th>状態</th><th></th></tr></thead><tbody id="routeBody"></tbody></table></div>

      <div class="card-title" id="routeFormTitle" style="margin-top:18px;font-size:14px">ルートを追加</div>
      <input type="hidden" id="r_edit_id" value="">
      <div class="grid">
        <div class="field"><label>申請種別</label><input id="r_type" list="r_type_list" placeholder="例: 消耗品購入"><datalist id="r_type_list"></datalist></div>
        <div class="field"><label>営業所</label><select id="r_office_sel"></select></div>
        <div class="field"><label>金額下限（円・税抜）</label><input id="r_min" inputmode="numeric" value="0"></div>
        <div class="field"><label>金額上限（0＝上限なし）</label><input id="r_max" inputmode="numeric" value="0"></div>
      </div>
      <div class="field" style="margin-top:10px">
        <label>承認の流れ（左の人から順に承認します）</label>
        <div id="r_chain_chips" style="min-height:42px;border:1px dashed #cbd5e1;border-radius:13px;padding:8px 10px;line-height:2.2;background:#f8fafc;"></div>
        <div class="btn-row" style="margin-top:8px;align-items:flex-end">
          <div class="field" style="min-width:170px;margin:0"><label>追加する役職</label><select id="r_chain_pick"></select></div>
          <button class="btn btn-blue btn-sm" type="button" onclick="addChainStep()">＋ 役職を追加</button>
        </div>
      </div>
      <div class="btn-row" style="align-items:center">
        <button class="btn btn-primary" id="r_save_btn" onclick="saveRoute()">ルートを追加</button>
        <button class="btn btn-gray" id="r_cancel_btn" type="button" onclick="resetRouteForm()" style="display:none">編集をやめる</button>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#475569;font-weight:700;margin-left:6px"><input type="checkbox" id="r_active" checked style="width:auto">このルートを有効にする</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:#475569;font-weight:700"><input type="checkbox" id="r_self" style="width:auto">申請者本人でも承認可（自己承認を許可）</label>
      </div>
      <div id="adminMsg" class="msg"></div>
    </div>
  </div>
</div>
<!-- 申請の詳細ポップアップ (一覧の「詳細」で開く) -->
<div id="detailModal" class="dmodal-bg" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <div class="dmodal">
    <div class="dmodal-head">
      <div class="t" id="detailTitle">詳細</div>
      <button type="button" class="dmodal-x" onclick="closeDetail()" aria-label="閉じる">✕</button>
    </div>
    <div class="dmodal-body" id="detailBody"></div>
    <div class="dmodal-foot"><button type="button" class="btn btn-gray" onclick="closeDetail()">閉じる</button></div>
  </div>
</div>

<div id="overlay" class="overlay"><div class="overlay-card"><div class="spinner"></div><div id="overlayText">処理中…</div></div></div>

<script>
const token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
if (!token) location.href = '/';
let INIT = null, CFG = null;
function goBack(){ var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||''); if(history.length>1){history.back();}else{location.href=m?'/m':'/';} }
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function yen(v){const n=Number(v||0);return isNaN(n)?'':n.toLocaleString();}
function $(id){return document.getElementById(id);}
function val(id){const e=$(id);return e?(e.value||''):'';}
function setVal(id,v){const e=$(id);if(e)e.value=v==null?'':v;}
function busy(on,t){$('overlay').style.display=on?'flex':'none';if(t)$('overlayText').textContent=t;}
function showMsg(id,t,type){const e=$(id);if(!e)return;e.className='msg '+(type||'info');e.textContent=t;}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  if(opts.json!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.json);delete opts.json;}
  const r=await fetch('/api/approval'+path,Object.assign({},opts,{headers}));
  if(r.status===401){location.href='/';return{success:false};}
  return r.json();
}
function showSection(name){
  ['form','pending','list','admin'].forEach(k=>{
    $('section'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);
    $('nav'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);
  });
}
function fillSelect(id,items,withEmpty){const el=$(id);if(!el)return;el.innerHTML=withEmpty?'<option value="">選択</option>':'';items.forEach(it=>{const o=document.createElement('option');o.value=it.value;o.textContent=it.label;el.appendChild(o);});}

/* ===== 会社（大分類）で分類 — 2026-07-28 社長「申請種別を大分類＝会社名で選びやすく」 =====
   営業所コードの頭で会社を判定する（companies表: SU_ とKOJI=スタンダード運輸、IBA_=茨運、SUZUE=スズエ電機）。
   ⚠️会社を増やしたらここに1行足す。判定できないコードは「その他」に落ちるだけで、選べなくはならない。 */
const COMPANY_ORDER=['STD','IBA','SUZUE','OTHER'];
const COMPANY_LABEL={ALL:'共通（全社）',STD:'スタンダード運輸',IBA:'茨運（茨城運輸）',SUZUE:'スズエ電機',OTHER:'その他'};
function companyKeyOf(code){
  if(!code||code==='ALL')return'ALL';
  if(/^SUZUE/.test(code))return'SUZUE';
  if(/^IBA_/.test(code))return'IBA';
  if(/^SU_/.test(code)||code==='KOJI')return'STD';
  return'OTHER';
}
function companyOf(code){const k=companyKeyOf(code);return{key:k,label:COMPANY_LABEL[k]};}
// 「SUZUE:物品購入」のような会社コードの接頭辞は、大分類で分かるので表示から落とす
function typeLabel(t){return String(t||'').replace(/^[A-Za-z_]+\s*[:：]\s*/,'');}
// 営業所名から会社名を落として短く（例「スタンダード運輸 海老名」→「海老名」/「茨運(鹿島)」→「鹿島」）
function officeShort(name){
  return String(name||'')
    .replace(/^(スタンダード運輸|スズエ電機)\s*/,'')
    .replace(/^茨運[（(](.+?)[）)]$/,'$1');
}
// 営業所セレクトを会社ごとのoptgroupで描く
function fillOfficeSelect(id,offices,head){
  const el=$(id);if(!el)return;
  el.innerHTML=head?'<option value="'+esc(head.value)+'">'+esc(head.label)+'</option>':'';
  const groups=new Map();
  (offices||[]).forEach(o=>{
    const c=companyOf(o.code);
    if(!groups.has(c.key))groups.set(c.key,{label:c.label,items:[]});
    groups.get(c.key).items.push(o);
  });
  COMPANY_ORDER.forEach(k=>{
    const g=groups.get(k);if(!g||!g.items.length)return;
    const og=document.createElement('optgroup');og.label=g.label;
    g.items.forEach(o=>{const op=document.createElement('option');op.value=o.code;op.textContent=officeShort(o.name)||o.name;og.appendChild(op);});
    el.appendChild(og);
  });
}
/* 申請種別セレクト: 会社ごとのoptgroupにまとめ、選択中の営業所の会社＋共通だけを出す
   （他社専用の種別を選ぶと承認ルートが見つからないため、そもそも出さない） */
function buildTypeSelect(keep){
  const el=$('f_type');if(!el)return;
  const scopes=(INIT&&INIT.applyTypeScopes)||[];
  const list=scopes.length?scopes:((INIT&&INIT.applyTypes)||[]).map(t=>({type:t,offices:['ALL']}));
  const myKey=companyKeyOf(val('f_office'));
  const groups={};
  list.forEach(s=>{
    // その種別が使える会社（ALL=共通）。複数会社にまたがる種別は各会社に載せる
    const keys=[];
    (s.offices&&s.offices.length?s.offices:['ALL']).forEach(oc=>{const k=companyKeyOf(oc);if(keys.indexOf(k)<0)keys.push(k);});
    const isCommon=keys.indexOf('ALL')>=0;
    // 営業所を選んでいるときは、その会社の種別と共通のみ出す
    if(val('f_office')&&!isCommon&&keys.indexOf(myKey)<0)return;
    (isCommon?['ALL']:keys).forEach(k=>{(groups[k]=groups[k]||[]).push(s.type);});
  });
  const order=[];
  if(myKey&&myKey!=='ALL')order.push(myKey);
  order.push('ALL');
  COMPANY_ORDER.forEach(k=>{if(order.indexOf(k)<0)order.push(k);});
  el.innerHTML='<option value="">選択</option>';
  order.forEach(k=>{
    const items=groups[k];if(!items||!items.length)return;
    const og=document.createElement('optgroup');og.label=COMPANY_LABEL[k]||k;
    items.forEach(t=>{const op=document.createElement('option');op.value=t;op.textContent=typeLabel(t);og.appendChild(op);});
    el.appendChild(og);
  });
  // 営業所を切り替えても、選べる種別なら選択を保つ
  if(keep&&Array.prototype.some.call(el.options,o=>o.value===keep))el.value=keep;
}

/* ⭐2026-08-06: かんたん版(tablet-home)の「仮払金の申請」ボタンのように、
   申請種別を決め打ちで開く導線のためのクエリ受け口。
     /approval.html?type=仮払金追加振込申請  → その種別を選んだ状態で開く
     /approval.html?tab=list               → 申請一覧を開く
   ⚠️選べない種別(他社専用など)が渡されたときは黙って無視する=画面は壊さない。 */
function applyQueryPrefill(){
  try{
    const q=new URLSearchParams(location.search||'');
    const t=q.get('type');
    if(t){ const el=$('f_type'); if(el&&Array.prototype.some.call(el.options,o=>o.value===t)) setVal('f_type',t); }
    const tab=q.get('tab');
    if(tab==='list'){ showSection('list'); loadList(); }
    else if(tab==='pending'){ showSection('pending'); loadPending(); }
  }catch(e){}
}
async function init(){
  const d=await api('/init');
  if(!d.success){showMsg('formMsg','初期化に失敗しました','error');return;}
  INIT=d;
  $('whoami').textContent=(d.user.name||'')+(d.user.is_admin?'（管理職）':'');
  fillOfficeSelect('f_office',d.offices,{value:'',label:'選択'});
  if(d.user.company_code)setVal('f_office',d.user.company_code);
  buildTypeSelect();   // 営業所（＝会社）が決まってから種別を組む
  applyQueryPrefill();   // ?type=…&tab=… で開かれたときの初期選択（かんたん版からの導線）
  if(d.user.is_admin)$('navAdmin').classList.remove('hidden');

}

// ===== 添付ファイル (最大3・1件ずつ追加可) =====
let pickedFiles=[]; let filePreviewUrls=[];
function addFiles(input){
  const incoming=Array.from(input.files||[]);
  for(const f of incoming){ if(pickedFiles.length>=3) break; pickedFiles.push(f); }
  input.value=''; // 次の選択でも change が発火するようリセット
  renderFilePreview();
}
function removeFile(i){ pickedFiles.splice(i,1); renderFilePreview(); }
function renderFilePreview(){
  // 前回のオブジェクトURLを解放
  filePreviewUrls.forEach(u=>{try{URL.revokeObjectURL(u);}catch(e){}}); filePreviewUrls=[];
  const box=$('filePreview');
  if(!pickedFiles.length){box.classList.add('hidden');box.innerHTML='';return;}
  box.classList.remove('hidden');
  let html='<b>添付ファイル（'+pickedFiles.length+'/3件）</b>';
  html+='<div style="margin-top:8px;display:flex;flex-direction:column;gap:10px">';
  pickedFiles.forEach((f,i)=>{
    const url=URL.createObjectURL(f); filePreviewUrls.push(url);
    html+='<div style="border:1px solid #e2e8f0;border-radius:10px;padding:8px;background:#fff">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span style="flex:1;font-size:13px;font-weight:700">📄 '+esc(f.name)+' <span class="small">('+Math.round(f.size/1024)+'KB)</span></span>'
      +'<button class="btn btn-red btn-sm" style="padding:4px 10px" onclick="removeFile('+i+')">外す</button>'
      +'</div>'
      +'<embed src="'+url+'" type="application/pdf" style="width:100%;height:280px;margin-top:8px;border:0;border-radius:6px" />'
      +'</div>';
  });
  html+='</div>';
  box.innerHTML=html;
}

// 申請内容の確認 (件名/種別/営業所/金額 + 承認ルート + 添付ファイルのプレビュー)
async function confirmApp(){

  }else{

async function preview(){
  if(!val('f_type')||!val('f_office')){showMsg('formMsg','申請種別と営業所を選択してください','error');return;}
  busy(true,'ルート判定中…');

  busy(false);
  if(!d.success){showMsg('formMsg',d.msg||'ルートなし','error');clearPreview();return;}
  renderChainPreview(d.chain);
  showMsg('formMsg','承認ルートが見つかりました。','success');

function renderChainPreview(chain){
  const box=$('previewBox');box.classList.remove('hidden');
  if(!chain||!chain.length){box.innerHTML='承認者が未設定です（管理画面で役職割当をご確認ください）';return;}
  box.innerHTML='<b>承認の流れ:</b><br>'+chain.map((s,i)=>'<span class="step">'+(i+1)+'. '+esc(s.role_name)+'（'+esc(s.name)+'）</span>').join(' → ');
}
async function submitApp(){
  if(!val('f_subject').trim()){showMsg('formMsg','件名を入力してください','error');return;}
  if(!val('f_type')||!val('f_office')){showMsg('formMsg','申請種別と営業所を選択してください','error');return;}
  busy(true,'申請中…');
  let attachments=[];
  if(pickedFiles.length){
    const fd=new FormData();
    for(let i=0;i<Math.min(pickedFiles.length,3);i++)fd.append('files',pickedFiles[i]);
    const r=await fetch('/api/approval/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
    const u=await r.json();
    if(u.success)attachments=u.files;
  }
  const d=await api('/',{method:'POST',json:{subject:val('f_subject'),apply_type:val('f_type'),office_code:val('f_office'),amount:val('f_amount'),attachments}});
  busy(false);
  if(!d.success){showMsg('formMsg',d.msg||'申請失敗','error');return;}
  showMsg('formMsg','申請しました（番号: '+d.id+'）。最初の承認者に通知しました。','success');
  renderChainPreview(d.chain);
  ['f_subject','f_amount'].forEach(id=>setVal(id,''));$('f_files').value='';
  pickedFiles=[];renderFilePreview();
  loadPendingCount();
}

// 一覧行に表示する承認ルート列 (フル承認者の流れ・現在段階をハイライト)
function chainCol(x){
  const chain=x._chain||[];
  if(!chain.length)return '<span class="small">未設定</span>';
  const cells=chain.map((s,i)=>{
    const done=i<x.cur_step;
    const cur=(i===x.cur_step)&&(x.status==='申請中');
    const cls='step '+(done?'done':cur?'cur':'');
    return '<span class="'+cls+'" title="'+esc(s.name)+'">'+esc(s.role_name)+(cur?' ◀今ここ':'')+'</span>';
  }).join(' → ');
  return '<div style="max-width:340px">'+cells+'</div>';
}

var _listItems=[];
async function loadList(){
  const tb=$('listBody');tb.innerHTML='<tr><td colspan="9" class="small">読み込み中…</td></tr>';

// 一覧に実在する営業所だけを候補に(件数付き・名前順)。選択は更新後も維持。
function fillListOfficeFilter(){
  const sel=$('f_list_office'); if(!sel) return;
  const seen={},list=[],counts={};
  _listItems.forEach(function(x){ counts[x.office_code]=(counts[x.office_code]||0)+1;
    if(!seen[x.office_code]){ seen[x.office_code]=1; list.push({code:x.office_code,name:x.office_name}); } });
  list.sort(function(a,b){ return String(a.name).localeCompare(String(b.name),'ja'); });
  const cur=sel.value||'';
  var opts='<option value="">すべての部署 ('+_listItems.length+')</option>';
  list.forEach(function(o){ opts+='<option value="'+esc(o.code)+'">'+esc(o.name)+' ('+counts[o.code]+')</option>'; });
  sel.innerHTML=opts;
  if(cur && counts[cur]) sel.value=cur;
}
// 選択中の部署で一覧を絞り込み表示 (フロント側フィルタ)
function renderList(){

  const items=off? _listItems.filter(function(x){ return x.office_code===off; }) : _listItems;
  if(!items.length){tb.innerHTML='<tr><td colspan="9" class="small">'+(off?'この部署の申請はありません。':'申請はありません。')+'</td></tr>';return;}
  tb.innerHTML=items.map(x=>'<tr><td>'+esc((x.created_at||'').slice(0,10))+'</td><td class="mono">'+esc(x.id)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.apply_type)+'</td><td>'+esc(x.office_name)+'</td><td>'+esc(yen(x.amount))+'</td><td>'+chainCol(x)+'</td><td><span class="badge st-'+esc(x.status)+'">'+esc(x.status)+'</span></td><td style="white-space:nowrap">'+rowActionsBtn(x.id,'List')+(x.can_delete?' <button class="btn btn-gray btn-sm" title="削除" onclick="delAppRow(\''+String(x.id).replace(/\x27/g,"\\\x27")+'\')">🗑</button>':'')+'</td></tr>').join('');
}
/* ⭐2026-07-28 添付PDFはアプリ内ビューア(/pdf-view.html)で開く。
   端末標準のPDFビューアは「デジタル押印(PDFのスタンプ注釈)」を描画せず、
   スマホでは印が消えて見えていたため。原本ファイルは一切変更しない。 */
function attLink(url,name){
  const u=String(url||''), nm=String(name||u.split('/').pop()||'PDF');
  if(/\.pdf(\?|#|$)/i.test(u) && u.indexOf('/uploads/')===0){
    const v='/pdf-view.html?file='+encodeURIComponent(u)+'&name='+encodeURIComponent(nm);
    return '<a href="'+esc(v)+'" target="_blank" rel="noopener">📄 '+esc(nm)+'</a>';
  }
  return '<a href="'+esc(u)+'" target="_blank" rel="noopener">📄 '+esc(nm)+'</a>';
}
// ===== 詳細ポップアップ (2026-07-29: 最下段カード→モーダル化) =====
// 一覧の「詳細」を押すたびに画面最下部までスクロールして探すのが手間だったため、その場でポップアップ表示にする。
function openDetail(){ document.getElementById('detailModal').classList.add('show'); document.body.style.overflow='hidden'; }
function closeDetail(){ document.getElementById('detailModal').classList.remove('show'); document.body.style.overflow=''; }
// Escで閉じる (背景クリックでは閉じない=入力中の誤タップ事故を避ける)
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&document.getElementById('detailModal').classList.contains('show')) closeDetail(); });

async function showDetail(id,target){
  const box=$('detailBody');
  $('detailTitle').textContent='詳細';
  box.innerHTML='<div class="small">読み込み中…</div>';
  openDetail();
  const d=await api('/'+encodeURIComponent(id));
  if(!d.success){box.innerHTML='<div class="small">取得失敗</div>';return;}
  const x=d.item;
  $('detailTitle').textContent=x.subject||'詳細';
  const steps=(x._chain||[]).map((s,i)=>'<span class="step '+(i<x.cur_step?'done':i===x.cur_step&&x.status==='申請中'?'cur':'')+'">'+(i+1)+'.'+esc(s.role_name)+'('+esc(s.name)+')</span>').join(' → ');
  const att=(x.attachments||[]).map(a=>attLink(a.url,a.name)).join(' / ');
  const hist=(d.history||[]).map(h=>'<div class="hist"><b>'+esc(h.action)+'</b> '+esc(h.role||'')+' '+esc(h.actor_name||'')+' <span class="small">'+esc((h.created_at||'').slice(0,16))+'</span>'+(h.note?'<br>'+esc(h.note):'')+'</div>').join('');
  let actions='';
  if(x.can_act){
    actions='<div class="btn-row"><input id="act-note" placeholder="コメント(任意/差戻・却下は理由)" style="flex:1;min-width:160px">'
      +'<button class="btn btn-green" onclick="act(\''+id+'\',\'approve\',\''+target+'\')">承認</button>'
      +'<button class="btn btn-orange" onclick="act(\''+id+'\',\'return\',\''+target+'\')">差戻し</button>'
      +'<button class="btn btn-red" onclick="act(\''+id+'\',\'reject\',\''+target+'\')">却下</button></div>';
  } else if(x.is_applicant&&x.status==='差戻し'){
    actions='<div class="btn-row"><button class="btn btn-primary" onclick="act(\''+id+'\',\'resubmit\',\''+target+'\')">再申請</button></div>';
  }
  const delBtn=x.can_delete
    ?'<div style="margin-top:14px;border-top:1px dashed #e2e8f0;padding-top:10px"><button class="btn btn-gray btn-sm" onclick="delApp(\''+id+'\',\''+target+'\')">🗑 この申請を削除</button> <span class="small">'+(x.status==='申請中'?'承認者へ取消を通知します':'記録を完全に削除します')+'</span></div>'
    :'';
  box.innerHTML='<div><b>'+esc(x.subject)+'</b> <span class="badge st-'+esc(x.status)+'">'+esc(x.status)+'</span></div>'
    +'<div class="small" style="margin:6px 0">番号 '+esc(x.id)+' ／ '+esc(x.apply_type)+' ／ '+esc(x.office_name)+' ／ '+esc(yen(x.amount))+'円 ／ 申請者 '+esc(x.applicant_name)+'</div>'
    +'<div style="margin:8px 0">'+steps+'</div>'
    +(att?'<div class="small" style="margin:6px 0">添付: '+att+'</div>':'')
    +actions
    +'<div style="margin-top:12px"><div class="small" style="font-weight:700">履歴</div>'+(hist||'<div class="small">なし</div>')+'</div>'
    +delBtn
    +'<div id="actMsg" class="msg"></div>';
}
async function act(id,action,target){
  if((action==='return'||action==='reject')&&!confirm(action==='return'?'差戻しますか？':'却下しますか？'))return;
  const note=val('act-note');
  busy(true,'処理中…');
  const d=await api('/'+encodeURIComponent(id)+'/'+action,{method:'POST',json:{note}});
  busy(false);
  if(!d.success){showMsg('actMsg',d.msg||'失敗','error');return;}
  showDetail(id,target);
  if(target==='Pending')loadPending(); else loadList();
  loadPendingCount();
}

// ===== 管理(ルート/割当) =====
let routeChain=[];  // ルート編集中の「承認の流れ」(役職コードの配列)
function roleNameByCode(code){const r=(CFG&&CFG.roles||[]).find(x=>x.code===code);return r?r.name:code;}
function officeLabel(code){if(code==='ALL'||!code)return'全社';const o=(CFG&&CFG.offices||[]).find(x=>x.code===code);return o?o.name:code;}
function chainToNames(chain){const n=String(chain||'').split(',').map(s=>s.trim()).filter(Boolean).map(c=>roleNameByCode(c));return n.length?n.join(' → '):'(未設定)';}
function amountBand(min,max){min=Number(min)||0;max=Number(max)||0;if(!min&&!max)return'指定なし';return (min?yen(min):'0')+' 〜 '+(max?yen(max)+'円':'∞');}

  // --- 承認ルート: 選択肢 ---

    +'</tr>').join('')||'<tr><td colspan="6" class="small">なし</td></tr>';
  renderChainChips();

// 「承認の流れ」ビルダー
function renderChainChips(){
  const box=$('r_chain_chips');if(!box)return;
  if(!routeChain.length){box.innerHTML='<span class="small" style="color:#94a3b8">下で役職を選んで「＋ 役職を追加」してください</span>';return;}
  box.innerHTML=routeChain.map((c,i)=>'<span class="step" style="display:inline-flex;align-items:center;gap:5px;">'
    +'<b>'+(i+1)+'.</b>'+esc(roleNameByCode(c))
    +'<button type="button" title="左へ" onclick="moveChainStep('+i+',-1)" style="border:none;background:none;cursor:pointer;font-weight:800;'+(i===0?'opacity:.25;':'')+'">←</button>'
    +'<button type="button" title="右へ" onclick="moveChainStep('+i+',1)" style="border:none;background:none;cursor:pointer;font-weight:800;'+(i===routeChain.length-1?'opacity:.25;':'')+'">→</button>'
    +'<button type="button" title="外す" onclick="removeChainStep('+i+')" style="border:none;background:none;color:#dc2626;cursor:pointer;font-weight:800;">×</button>'
    +'</span>').join('<span style="color:#94a3b8;margin:0 2px;">→</span>');
}
function addChainStep(){const c=val('r_chain_pick');if(!c)return;if(routeChain.indexOf(c)>=0){showMsg('adminMsg','「'+roleNameByCode(c)+'」は既に流れに入っています','error');return;}routeChain.push(c);renderChainChips();showMsg('adminMsg','','info');$('adminMsg').className='msg';}
function removeChainStep(i){routeChain.splice(i,1);renderChainChips();}
function moveChainStep(i,dir){const j=i+dir;if(j<0||j>=routeChain.length)return;const t=routeChain[i];routeChain[i]=routeChain[j];routeChain[j]=t;renderChainChips();}
function editRoute(id){
  const r=(CFG&&CFG.routes||[]).find(x=>x.id===id);if(!r)return;
  setVal('r_edit_id',r.id);setVal('r_type',r.apply_type);setVal('r_office_sel',r.office_code||'ALL');
  setVal('r_min',r.amount_min||0);setVal('r_max',r.amount_max||0);
  if($('r_active'))$('r_active').checked=!!r.active;
  if($('r_self'))$('r_self').checked=!!r.allow_self_approve;
  routeChain=String(r.chain||'').split(',').map(s=>s.trim()).filter(Boolean);renderChainChips();
  $('routeFormTitle').textContent='ルートを編集（#'+r.id+'）';
  $('r_save_btn').textContent='この内容で更新';$('r_cancel_btn').style.display='';
  $('routeFormTitle').scrollIntoView({behavior:'smooth',block:'center'});
}
function resetRouteForm(){
  setVal('r_edit_id','');setVal('r_type','');setVal('r_office_sel','ALL');setVal('r_min','0');setVal('r_max','0');
  if($('r_active'))$('r_active').checked=true;if($('r_self'))$('r_self').checked=false;routeChain=[];renderChainChips();
  $('routeFormTitle').textContent='ルートを追加';$('r_save_btn').textContent='ルートを追加';$('r_cancel_btn').style.display='none';
  $('adminMsg').className='msg';$('adminMsg').textContent='';
}
async function addAssignment(){
  if(!val('a_role')||!val('a_user')){showMsg('adminMsg','役職と担当者を選択してください','error');return;}
  busy(true,'追加中…');
  const d=await api('/admin/assignment',{method:'POST',json:{role_code:val('a_role'),office_code:val('a_office'),user_login_id:val('a_user')}});
  busy(false);if(!d.success){showMsg('adminMsg',d.msg||'失敗','error');return;}loadAdmin();
}
async function delAssignment(id){if(!confirm('削除しますか？'))return;busy(true,'削除中…');const d=await api('/admin/assignment/'+id,{method:'DELETE'});busy(false);if(!d.success){showMsg('adminMsg',d.msg||'失敗','error');return;}loadAdmin();}
async function saveRoute(){
  if(!val('r_type').trim()){showMsg('adminMsg','申請種別を入力してください','error');return;}
  if(!routeChain.length){showMsg('adminMsg','「承認の流れ」に役職を1つ以上追加してください','error');return;}
  const id=val('r_edit_id');
  const body={apply_type:val('r_type').trim(),office_code:val('r_office_sel')||'ALL',amount_min:Number(val('r_min'))||0,amount_max:Number(val('r_max'))||0,chain:routeChain.join(','),active:$('r_active')?$('r_active').checked:true,allow_self_approve:$('r_self')?$('r_self').checked:false};
  busy(true,id?'更新中…':'追加中…');
  const d=id?await api('/admin/route/'+id,{method:'PATCH',json:body}):await api('/admin/route',{method:'POST',json:body});
  busy(false);if(!d.success){showMsg('adminMsg',d.msg||'失敗','error');return;}
  resetRouteForm();loadAdmin();init();
}
async function delRoute(id){if(!confirm('このルートを削除しますか？'))return;busy(true,'削除中…');const d=await api('/admin/route/'+id,{method:'DELETE'});busy(false);if(!d.success){showMsg('adminMsg',d.msg||'失敗','error');return;}loadAdmin();init();}

init();
</script>
