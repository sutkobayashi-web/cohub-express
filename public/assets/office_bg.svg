<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5e6d0"/>
      <stop offset="1" stop-color="#e8d3b0"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3e2"/>
      <stop offset="1" stop-color="#f5e6d0"/>
    </linearGradient>
    <radialGradient id="light" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#fff9e6" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff9e6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 壁（上半分） -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#wall)"/>
  <!-- 床（下半分） -->
  <rect x="0" y="300" width="1200" height="420" fill="url(#floor)"/>
  <!-- 天井ライト -->
  <rect x="0" y="0" width="1200" height="200" fill="url(#light)"/>

  <!-- 床のライン -->
  <path d="M 0 300 L 1200 300" stroke="#d4b989" stroke-width="2"/>
  <path d="M 0 500 L 1200 500 M 0 600 L 1200 600 M 0 680 L 1200 680" stroke="#e8d3b0" stroke-width="1" stroke-dasharray="3,6" opacity="0.5"/>

  <!-- 窓 -->
  <g transform="translate(100,60)">
    <rect width="220" height="140" fill="#87ceeb" stroke="#8b6f47" stroke-width="4"/>
    <line x1="110" y1="0" x2="110" y2="140" stroke="#8b6f47" stroke-width="3"/>
    <line x1="0" y1="70" x2="220" y2="70" stroke="#8b6f47" stroke-width="3"/>
    <!-- 雲 -->
    <ellipse cx="60" cy="40" rx="28" ry="10" fill="#fff" opacity="0.9"/>
    <ellipse cx="170" cy="90" rx="22" ry="8" fill="#fff" opacity="0.8"/>
  </g>

  <!-- 時計 -->
  <g transform="translate(560,90)">
    <circle r="38" fill="#fff" stroke="#8b6f47" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#333" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="8" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <circle r="3" fill="#333"/>
  </g>

  <!-- 観葉植物（左） -->
  <g transform="translate(80,420)">
    <rect x="-30" y="40" width="60" height="50" fill="#a0522d" rx="4"/>
    <path d="M 0 40 C -40 20, -50 -30, -20 -60 M 0 40 C 40 20, 50 -30, 20 -60 M 0 40 C 0 0, -10 -40, 0 -70 M 0 40 C 20 0, 30 -30, 10 -50 M 0 40 C -20 10, -30 -20, -10 -40" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="-20" cy="-30" rx="12" ry="6" fill="#16a34a" transform="rotate(-30 -20 -30)"/>
    <ellipse cx="20" cy="-30" rx="12" ry="6" fill="#16a34a" transform="rotate(30 20 -30)"/>
    <ellipse cx="0" cy="-50" rx="14" ry="7" fill="#22c55e"/>
  </g>

  <!-- 観葉植物（右） -->
  <g transform="translate(1100,440)">
    <rect x="-28" y="35" width="56" height="48" fill="#8b4513" rx="4"/>
    <path d="M 0 35 C -35 15, -45 -25, -15 -55 M 0 35 C 35 15, 45 -25, 15 -55 M 0 35 C 0 -5, -8 -35, 0 -65" stroke="#16a34a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="-15" cy="-30" rx="11" ry="6" fill="#22c55e" transform="rotate(-30 -15 -30)"/>
    <ellipse cx="15" cy="-25" rx="11" ry="6" fill="#22c55e" transform="rotate(30 15 -25)"/>
  </g>

  <!-- カフェコーナー（右上）テーブル -->
  <g transform="translate(950,280)">
    <ellipse cx="0" cy="20" rx="70" ry="14" fill="#6b4423" opacity="0.4"/>
    <rect x="-60" y="-40" width="120" height="60" fill="#d4a373" stroke="#8b6f47" stroke-width="2" rx="6"/>
    <rect x="-60" y="-40" width="120" height="10" fill="#8b6f47" rx="4"/>
    <!-- カップ -->
    <ellipse cx="-30" cy="-50" rx="10" ry="4" fill="#fff"/>
    <path d="M -40 -50 L -38 -30 L -22 -30 L -20 -50" fill="#fff" stroke="#94a3b8" stroke-width="1"/>
    <ellipse cx="-30" cy="-50" rx="10" ry="4" fill="#92400e"/>
    <!-- 小さな植物 -->
    <rect x="20" y="-55" width="16" height="15" fill="#a0522d"/>
    <circle cx="28" cy="-60" r="10" fill="#22c55e"/>
  </g>

  <!-- ソファ（左下） -->
  <g transform="translate(200,580)">
    <ellipse cx="0" cy="20" rx="130" ry="16" fill="#6b4423" opacity="0.3"/>
    <rect x="-120" y="-30" width="240" height="50" fill="#64748b" rx="10"/>
    <rect x="-120" y="-55" width="240" height="30" fill="#475569" rx="10"/>
    <rect x="-130" y="-50" width="18" height="70" fill="#334155" rx="6"/>
    <rect x="112" y="-50" width="18" height="70" fill="#334155" rx="6"/>
    <!-- クッション -->
    <ellipse cx="-60" cy="-20" rx="22" ry="10" fill="#fbbf24" opacity="0.8"/>
    <ellipse cx="60" cy="-20" rx="22" ry="10" fill="#f87171" opacity="0.8"/>
  </g>

  <!-- ミーティングテーブル（中央） -->
  <g transform="translate(600,450)">
    <ellipse cx="0" cy="30" rx="140" ry="20" fill="#6b4423" opacity="0.3"/>
    <ellipse cx="0" cy="0" rx="130" ry="40" fill="#e8d3b0" stroke="#8b6f47" stroke-width="3"/>
    <ellipse cx="0" cy="-5" rx="130" ry="40" fill="#f5e6d0"/>
    <!-- 本/ノート -->
    <rect x="-40" y="-15" width="30" height="22" fill="#dc2626" rx="2"/>
    <rect x="10" y="-20" width="35" height="24" fill="#0891b2" rx="2"/>
    <circle cx="60" cy="-10" r="8" fill="#fbbf24"/>
  </g>

  <!-- 絵画（壁中央） -->
  <g transform="translate(440,130)">
    <rect width="100" height="80" fill="#fef3c7" stroke="#8b6f47" stroke-width="3"/>
    <circle cx="30" cy="30" r="15" fill="#fbbf24"/>
    <path d="M 0 60 Q 25 40 50 55 T 100 50 L 100 80 L 0 80 Z" fill="#22c55e"/>
    <path d="M 60 25 L 70 15 L 80 25" stroke="#64748b" stroke-width="2" fill="none"/>
  </g>

  <!-- 中央エリア ラグマット -->
  <ellipse cx="600" cy="560" rx="260" ry="50" fill="#d4a373" opacity="0.5"/>
  <ellipse cx="600" cy="560" rx="200" ry="38" fill="#e8d3b0" opacity="0.7"/>

  <!-- 右下 窓（カフェ窓） -->
  <g transform="translate(870,70)">
    <rect width="160" height="110" fill="#bfdbfe" stroke="#8b6f47" stroke-width="4" rx="2"/>
    <line x1="80" y1="0" x2="80" y2="110" stroke="#8b6f47" stroke-width="3"/>
    <path d="M 10 40 L 30 30 L 50 45 L 70 35 L 70 50 L 10 50 Z" fill="#fff" opacity="0.6"/>
  </g>

  <!-- ウェルカムメッセージ -->
  <text x="600" y="250" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#64748b" opacity="0.4">Welcome to CoHub Express</text>
</svg>
