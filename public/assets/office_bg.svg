<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 床: 木目フローリング -->
    <linearGradient id="floorBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e4cc"/>
      <stop offset="1" stop-color="#e4d2b1"/>
    </linearGradient>
    <pattern id="floorPlank" width="180" height="28" patternUnits="userSpaceOnUse">
      <rect width="180" height="28" fill="url(#floorBase)"/>
      <line x1="0" y1="0" x2="180" y2="0" stroke="#caa97e" stroke-width="0.8" opacity="0.5"/>
      <line x1="0" y1="28" x2="180" y2="28" stroke="#caa97e" stroke-width="0.8" opacity="0.5"/>
      <line x1="60" y1="0" x2="60" y2="28" stroke="#caa97e" stroke-width="0.6" opacity="0.35"/>
      <line x1="150" y1="0" x2="150" y2="28" stroke="#caa97e" stroke-width="0.6" opacity="0.35"/>
    </pattern>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece3d3"/>
      <stop offset="1" stop-color="#d6c9b2"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#bcd8f0"/>
    </linearGradient>
    <radialGradient id="lampSpot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4c9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff4c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="3" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- デスクトップ用アイコン -->
    <g id="monitor">
      <rect x="0" y="0" width="42" height="26" rx="3" fill="#2c3648" stroke="#1a2131" stroke-width="1"/>
      <rect x="3" y="3" width="36" height="20" rx="1" fill="#6db3d9"/>
      <rect x="3" y="3" width="36" height="20" rx="1" fill="url(#windowLight)" opacity="0.4"/>
      <rect x="18" y="26" width="6" height="4" fill="#1a2131"/>
      <rect x="12" y="30" width="18" height="2" rx="1" fill="#2c3648"/>
    </g>
    <g id="laptop">
      <rect x="0" y="0" width="36" height="22" rx="2" fill="#3a4558"/>
      <rect x="2" y="2" width="32" height="18" rx="1" fill="#7ec0e0"/>
      <rect x="-2" y="22" width="40" height="3" rx="1" fill="#2a3345"/>
    </g>
    <g id="chair">
      <ellipse cx="14" cy="14" rx="14" ry="12" fill="#3e4a63"/>
      <ellipse cx="14" cy="13" rx="10" ry="8" fill="#5a6b85"/>
      <rect x="12" y="2" width="4" height="6" rx="1" fill="#3e4a63"/>
    </g>
    <g id="plant">
      <rect x="8" y="24" width="18" height="18" rx="2" fill="#7b4f2a"/>
      <rect x="8" y="24" width="18" height="4" fill="#5c3a1f"/>
      <circle cx="17" cy="18" r="14" fill="#6d9a4e"/>
      <circle cx="10" cy="14" r="9" fill="#8cc066"/>
      <circle cx="24" cy="16" r="9" fill="#5d8a42"/>
      <circle cx="17" cy="8" r="8" fill="#a3d57a"/>
    </g>
    <g id="plantSmall">
      <rect x="4" y="14" width="12" height="10" rx="2" fill="#7b4f2a"/>
      <circle cx="10" cy="10" r="9" fill="#6d9a4e"/>
      <circle cx="6" cy="8" r="5" fill="#8cc066"/>
      <circle cx="14" cy="9" r="5" fill="#5d8a42"/>
    </g>
    <g id="cup">
      <ellipse cx="7" cy="9" rx="6" ry="2" fill="#6b3a1a"/>
      <rect x="1" y="2" width="12" height="8" rx="1" fill="#ffffff"/>
      <path d="M 13 3 Q 17 5 13 7" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <ellipse cx="7" cy="3" rx="5" ry="1.2" fill="#6b3a1a"/>
    </g>
    <g id="book">
      <rect x="0" y="0" width="20" height="4" fill="#c0392b"/>
      <rect x="0" y="4" width="20" height="4" fill="#2980b9"/>
      <rect x="0" y="8" width="20" height="4" fill="#27ae60"/>
      <rect x="0" y="12" width="20" height="4" fill="#f39c12"/>
      <rect x="0" y="16" width="20" height="4" fill="#8e44ad"/>
    </g>
  </defs>

  <!-- 外壁（部屋全体の背景） -->
  <rect width="1200" height="720" fill="#c9bca3"/>

  <!-- 室内の床（壁の内側） -->
  <rect x="70" y="70" width="1060" height="580" fill="url(#floorPlank)"/>

  <!-- 壁（上下左右の厚み） -->
  <rect x="0" y="0" width="1200" height="70" fill="url(#wallGrad)"/>
  <rect x="0" y="650" width="1200" height="70" fill="url(#wallGrad)"/>
  <rect x="0" y="0" width="70" height="720" fill="url(#wallGrad)"/>
  <rect x="1130" y="0" width="70" height="720" fill="url(#wallGrad)"/>
  <!-- 壁の影（内側） -->
  <rect x="70" y="70" width="1060" height="6" fill="rgba(0,0,0,0.12)"/>
  <rect x="70" y="70" width="6" height="580" fill="rgba(0,0,0,0.1)"/>
  <rect x="1124" y="70" width="6" height="580" fill="rgba(0,0,0,0.08)"/>
  <rect x="70" y="644" width="1060" height="6" fill="rgba(0,0,0,0.06)"/>

  <!-- 窓（上の壁を中心に3枚） -->
  <g>
    <rect x="180" y="14" width="180" height="46" rx="3" fill="url(#windowLight)" stroke="#8daec7" stroke-width="2"/>
    <line x1="270" y1="16" x2="270" y2="58" stroke="#8daec7" stroke-width="2"/>
    <line x1="182" y1="37" x2="358" y2="37" stroke="#8daec7" stroke-width="1.5" opacity="0.7"/>

    <rect x="410" y="14" width="180" height="46" rx="3" fill="url(#windowLight)" stroke="#8daec7" stroke-width="2"/>
    <line x1="500" y1="16" x2="500" y2="58" stroke="#8daec7" stroke-width="2"/>
    <line x1="412" y1="37" x2="588" y2="37" stroke="#8daec7" stroke-width="1.5" opacity="0.7"/>

    <rect x="640" y="14" width="180" height="46" rx="3" fill="url(#windowLight)" stroke="#8daec7" stroke-width="2"/>
    <line x1="730" y1="16" x2="730" y2="58" stroke="#8daec7" stroke-width="2"/>
    <line x1="642" y1="37" x2="818" y2="37" stroke="#8daec7" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- 壁時計 -->
  <g transform="translate(900, 20)">
    <circle cx="20" cy="20" r="20" fill="#ffffff" stroke="#2c3648" stroke-width="2"/>
    <circle cx="20" cy="20" r="2" fill="#2c3648"/>
    <line x1="20" y1="20" x2="20" y2="8" stroke="#2c3648" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="30" y2="20" stroke="#2c3648" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="6" r="1" fill="#2c3648"/>
    <circle cx="34" cy="20" r="1" fill="#2c3648"/>
    <circle cx="20" cy="34" r="1" fill="#2c3648"/>
    <circle cx="6" cy="20" r="1" fill="#2c3648"/>
  </g>

  <!-- 社名サイン板 -->
  <g transform="translate(990, 20)">
    <rect width="120" height="36" rx="4" fill="#1e293b"/>
    <text x="60" y="23" font-family="sans-serif" font-size="14" fill="#06b6d4" font-weight="800" text-anchor="middle" letter-spacing="3">CoHub</text>
  </g>

  <!-- ドア（下の壁中央） -->
  <g>
    <rect x="560" y="644" width="90" height="76" rx="2" fill="#7b4f2a" stroke="#5c3a1f" stroke-width="2"/>
    <rect x="566" y="652" width="78" height="6" fill="#5c3a1f"/>
    <rect x="566" y="670" width="78" height="30" fill="#8a5d36"/>
    <circle cx="638" cy="685" r="3" fill="#ffd166"/>
    <!-- ドア前マット -->
    <rect x="545" y="638" width="120" height="8" rx="2" fill="#c0392b"/>
    <rect x="545" y="638" width="120" height="8" rx="2" fill="none" stroke="#8e1f12" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- 天井ライトスポット -->
  <ellipse cx="280" cy="260" rx="220" ry="140" fill="url(#lampSpot)"/>
  <ellipse cx="700" cy="240" rx="240" ry="140" fill="url(#lampSpot)"/>
  <ellipse cx="980" cy="480" rx="200" ry="140" fill="url(#lampSpot)"/>
  <ellipse cx="380" cy="520" rx="240" ry="160" fill="url(#lampSpot)"/>

  <!-- ======== 家具配置 (室内) ======== -->

  <!-- 左上: 応接ソファコーナー -->
  <g transform="translate(110,110)" filter="url(#sh)">
    <!-- ラグ -->
    <rect x="-6" y="-6" width="300" height="180" rx="16" fill="#e4c9a0" opacity="0.6"/>
    <rect x="-6" y="-6" width="300" height="180" rx="16" fill="none" stroke="#b98f5e" stroke-width="1" stroke-dasharray="3,4" opacity="0.6"/>
    <!-- 3人掛けソファ -->
    <rect x="20" y="10" width="200" height="48" rx="12" fill="#6b89ae"/>
    <rect x="20" y="10" width="200" height="18" rx="8" fill="#4f6c90"/>
    <rect x="20" y="10" width="16" height="60" rx="6" fill="#4f6c90"/>
    <rect x="204" y="10" width="16" height="60" rx="6" fill="#4f6c90"/>
    <!-- 1人掛けソファ -->
    <rect x="240" y="70" width="50" height="50" rx="10" fill="#6b89ae"/>
    <rect x="240" y="70" width="50" height="18" rx="8" fill="#4f6c90"/>
    <!-- ローテーブル -->
    <rect x="60" y="95" width="140" height="60" rx="10" fill="#d9b38a"/>
    <rect x="60" y="95" width="140" height="10" rx="5" fill="#b98f5e"/>
    <!-- カップ＆本 -->
    <use href="#cup" x="90" y="110"/>
    <use href="#cup" x="160" y="108"/>
    <g transform="translate(115,120)"><use href="#book"/></g>
    <!-- フロアランプ -->
    <circle cx="10" cy="80" r="4" fill="#2c3648"/>
    <rect x="9" y="80" width="2" height="48" fill="#2c3648"/>
    <path d="M -4 50 L 24 50 L 20 78 L 0 78 Z" fill="#fff2b3" stroke="#d4a84a" stroke-width="1.2"/>
  </g>

  <!-- 中央上〜中央: 長机会議テーブル + PC席 -->
  <g transform="translate(440,140)" filter="url(#sh)">
    <!-- 会議用長机 -->
    <rect x="0" y="0" width="320" height="120" rx="12" fill="#d9b38a"/>
    <rect x="0" y="0" width="320" height="14" rx="6" fill="#b98f5e"/>
    <rect x="0" y="0" width="320" height="120" rx="12" fill="none" stroke="#a67545" stroke-width="1.2"/>
    <!-- モニター4台 -->
    <g transform="translate(30,40)"><use href="#monitor"/></g>
    <g transform="translate(100,40)"><use href="#monitor"/></g>
    <g transform="translate(180,40)"><use href="#monitor"/></g>
    <g transform="translate(250,40)"><use href="#monitor"/></g>
    <!-- 書類/小物 -->
    <rect x="40" y="88" width="22" height="16" rx="1" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="120" y="92" width="18" height="14" rx="1" fill="#fde68a"/>
    <rect x="200" y="90" width="26" height="16" rx="1" fill="#ffffff" stroke="#cbd5e1"/>
    <use href="#cup" x="272" y="90"/>
    <!-- 椅子（下側4脚） -->
    <g transform="translate(24,128)"><use href="#chair"/></g>
    <g transform="translate(94,128)"><use href="#chair"/></g>
    <g transform="translate(174,128)"><use href="#chair"/></g>
    <g transform="translate(244,128)"><use href="#chair"/></g>
  </g>

  <!-- 右上: 個人デスク2席 -->
  <g transform="translate(830,120)" filter="url(#sh)">
    <!-- デスク -->
    <rect x="0" y="0" width="240" height="70" rx="8" fill="#e0cba0"/>
    <rect x="0" y="0" width="240" height="10" rx="4" fill="#b89872"/>
    <g transform="translate(20,22)"><use href="#monitor"/></g>
    <g transform="translate(140,22)"><use href="#monitor"/></g>
    <use href="#cup" x="80" y="42"/>
    <rect x="100" y="38" width="24" height="20" rx="1" fill="#ffffff" stroke="#cbd5e1"/>
    <use href="#cup" x="210" y="42"/>
    <!-- 椅子 -->
    <g transform="translate(18,78)"><use href="#chair"/></g>
    <g transform="translate(138,78)"><use href="#chair"/></g>
    <!-- デスク下配線トレー -->
    <rect x="10" y="70" width="220" height="3" fill="#8b7355" opacity="0.5"/>
  </g>

  <!-- 右側中〜下: ホワイトボード + 立ち話スペース -->
  <g transform="translate(830,240)" filter="url(#sh)">
    <!-- ホワイトボード -->
    <rect x="0" y="0" width="250" height="110" rx="4" fill="#ffffff" stroke="#9ca3af" stroke-width="2.5"/>
    <rect x="0" y="0" width="250" height="110" rx="4" fill="none" stroke="#475569" stroke-width="0.8"/>
    <rect x="4" y="108" width="242" height="4" fill="#6b7280"/>
    <!-- 手書き線 -->
    <line x1="20" y1="22" x2="100" y2="22" stroke="#dc2626" stroke-width="2.2"/>
    <line x1="20" y1="36" x2="140" y2="36" stroke="#1e293b" stroke-width="1.6"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#2563eb" stroke-width="1.6"/>
    <line x1="140" y1="22" x2="230" y2="22" stroke="#16a34a" stroke-width="2.2"/>
    <line x1="140" y1="38" x2="220" y2="38" stroke="#1e293b" stroke-width="1.4"/>
    <circle cx="190" cy="70" r="16" fill="none" stroke="#1e293b" stroke-width="1.4"/>
    <circle cx="206" cy="78" r="16" fill="none" stroke="#ef4444" stroke-width="1.4"/>
    <line x1="40" y1="78" x2="86" y2="78" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="86" y1="78" x2="86" y2="94" stroke="#2563eb" stroke-width="1.4"/>
    <line x1="86" y1="94" x2="130" y2="94" stroke="#2563eb" stroke-width="1.4"/>
    <polygon points="130,90 140,94 130,98" fill="#2563eb"/>
    <!-- マーカー -->
    <rect x="70" y="112" width="6" height="14" fill="#dc2626"/>
    <rect x="80" y="112" width="6" height="14" fill="#2563eb"/>
    <rect x="90" y="112" width="6" height="14" fill="#16a34a"/>
  </g>

  <!-- 右下: 本棚 -->
  <g transform="translate(1030,380)" filter="url(#sh)">
    <rect x="0" y="0" width="80" height="230" rx="4" fill="#8b6b43"/>
    <rect x="4" y="4" width="72" height="222" rx="2" fill="#a98458"/>
    <line x1="4" y1="60" x2="76" y2="60" stroke="#6b4f2b" stroke-width="2"/>
    <line x1="4" y1="118" x2="76" y2="118" stroke="#6b4f2b" stroke-width="2"/>
    <line x1="4" y1="176" x2="76" y2="176" stroke="#6b4f2b" stroke-width="2"/>
    <!-- 本 棚1 -->
    <rect x="8" y="14" width="6" height="44" fill="#c0392b"/>
    <rect x="16" y="18" width="6" height="40" fill="#2980b9"/>
    <rect x="24" y="12" width="6" height="46" fill="#27ae60"/>
    <rect x="32" y="20" width="6" height="38" fill="#f39c12"/>
    <rect x="40" y="14" width="6" height="44" fill="#8e44ad"/>
    <rect x="48" y="18" width="6" height="40" fill="#e74c3c"/>
    <rect x="56" y="14" width="6" height="44" fill="#16a085"/>
    <rect x="64" y="20" width="6" height="38" fill="#f1c40f"/>
    <!-- 棚2 -->
    <rect x="8" y="72" width="6" height="44" fill="#e67e22"/>
    <rect x="16" y="76" width="6" height="40" fill="#9b59b6"/>
    <rect x="24" y="70" width="6" height="46" fill="#34495e"/>
    <rect x="32" y="78" width="6" height="38" fill="#1abc9c"/>
    <rect x="42" y="82" width="28" height="34" rx="1" fill="#f4d03f"/>
    <rect x="46" y="86" width="20" height="4" fill="#b7950b"/>
    <!-- 棚3: 雑貨 -->
    <use href="#plantSmall" x="10" y="126"/>
    <rect x="36" y="134" width="20" height="40" rx="1" fill="#ecf0f1" stroke="#95a5a6"/>
    <rect x="38" y="138" width="16" height="4" fill="#34495e"/>
    <rect x="38" y="146" width="16" height="3" fill="#7f8c8d"/>
    <rect x="58" y="128" width="14" height="46" fill="#e74c3c"/>
    <!-- 棚4 -->
    <rect x="8" y="184" width="64" height="38" rx="1" fill="#ecf0f1"/>
    <rect x="10" y="186" width="60" height="4" fill="#bdc3c7"/>
    <rect x="10" y="194" width="40" height="3" fill="#95a5a6"/>
    <rect x="10" y="200" width="54" height="3" fill="#95a5a6"/>
    <rect x="10" y="206" width="30" height="3" fill="#95a5a6"/>
  </g>

  <!-- 中央下: ミーティングソファコーナー（丸テーブル） -->
  <g transform="translate(440,400)" filter="url(#sh)">
    <!-- ラグ -->
    <ellipse cx="160" cy="110" rx="180" ry="110" fill="#a4c2a5" opacity="0.5"/>
    <ellipse cx="160" cy="110" rx="160" ry="92" fill="none" stroke="#6e9b75" stroke-width="1.2" stroke-dasharray="3,4" opacity="0.7"/>
    <!-- 丸テーブル -->
    <circle cx="160" cy="110" r="42" fill="#d9b38a"/>
    <circle cx="160" cy="110" r="42" fill="none" stroke="#a67545" stroke-width="2"/>
    <circle cx="160" cy="110" r="34" fill="none" stroke="#b98f5e" stroke-width="1" opacity="0.5"/>
    <!-- カップ -->
    <use href="#cup" x="140" y="96"/>
    <use href="#cup" x="170" y="112"/>
    <use href="#plantSmall" x="150" y="100"/>
    <!-- 椅子4脚 -->
    <g transform="translate(86,96)"><use href="#chair"/></g>
    <g transform="translate(220,96)"><use href="#chair"/></g>
    <g transform="translate(146,28)"><use href="#chair"/></g>
    <g transform="translate(146,170)"><use href="#chair"/></g>
  </g>

  <!-- 左下: カフェカウンター -->
  <g transform="translate(110,410)" filter="url(#sh)">
    <!-- キッチンカウンター -->
    <rect x="0" y="60" width="280" height="60" rx="6" fill="#8b6b43"/>
    <rect x="0" y="60" width="280" height="14" rx="4" fill="#6b4f2b"/>
    <rect x="0" y="60" width="280" height="60" rx="6" fill="none" stroke="#5c3a1f" stroke-width="1"/>
    <!-- シンク -->
    <rect x="14" y="80" width="64" height="32" rx="3" fill="#bfc8d1" stroke="#7c8792" stroke-width="1.2"/>
    <circle cx="46" cy="78" r="2.5" fill="#7c8792"/>
    <rect x="44" y="70" width="4" height="10" fill="#7c8792"/>
    <!-- コーヒーマシン -->
    <rect x="100" y="36" width="44" height="40" rx="4" fill="#2c3648"/>
    <rect x="104" y="40" width="36" height="16" rx="2" fill="#1a2131"/>
    <circle cx="122" cy="48" r="3" fill="#ef4444"/>
    <rect x="116" y="62" width="12" height="14" fill="#1a2131"/>
    <rect x="108" y="76" width="28" height="4" fill="#475569"/>
    <!-- カップ棚 -->
    <g transform="translate(160,80)">
      <use href="#cup"/>
    </g>
    <g transform="translate(180,80)">
      <use href="#cup"/>
    </g>
    <g transform="translate(200,80)">
      <use href="#cup"/>
    </g>
    <!-- 冷蔵庫 -->
    <rect x="228" y="8" width="48" height="110" rx="4" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1.5"/>
    <line x1="228" y1="54" x2="276" y2="54" stroke="#bdc3c7" stroke-width="1.5"/>
    <rect x="268" y="26" width="3" height="8" rx="1" fill="#7f8c8d"/>
    <rect x="268" y="72" width="3" height="8" rx="1" fill="#7f8c8d"/>
    <!-- 吊戸棚 -->
    <rect x="0" y="0" width="220" height="30" rx="3" fill="#a98458"/>
    <line x1="74" y1="0" x2="74" y2="30" stroke="#6b4f2b" stroke-width="1"/>
    <line x1="148" y1="0" x2="148" y2="30" stroke="#6b4f2b" stroke-width="1"/>
    <circle cx="68" cy="22" r="1.5" fill="#2c3648"/>
    <circle cx="142" cy="22" r="1.5" fill="#2c3648"/>
    <circle cx="214" cy="22" r="1.5" fill="#2c3648"/>
    <!-- スツール -->
    <circle cx="60" cy="160" r="14" fill="#c67e52"/>
    <circle cx="60" cy="160" r="10" fill="#e0a47a"/>
    <circle cx="140" cy="160" r="14" fill="#c67e52"/>
    <circle cx="140" cy="160" r="10" fill="#e0a47a"/>
    <circle cx="220" cy="160" r="14" fill="#c67e52"/>
    <circle cx="220" cy="160" r="10" fill="#e0a47a"/>
  </g>

  <!-- 観葉植物（隅） -->
  <g transform="translate(86,90)" filter="url(#sh)">
    <use href="#plant"/>
  </g>
  <g transform="translate(1080,88)" filter="url(#sh)">
    <use href="#plant"/>
  </g>
  <g transform="translate(86,600)" filter="url(#sh)">
