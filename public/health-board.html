<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みんなの健康月間ボード - CoWell</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif; background: linear-gradient(180deg,#f0fdfa 0%,#f0f9ff 45%,#ecfdf5 100%); background-attachment: fixed; color: #0f172a; min-height: 100vh; }
  header { background: linear-gradient(135deg, #0284c7, #0369a1); color:#fff; padding: 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:10; }
  header .back { background: rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.5); color:#fff; width:34px; height:34px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0; }
  header h1 { font-size: 17px; margin:0; font-weight:800; flex:1; }
  header .mo { font-size:12px; opacity:.9; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 40px; }
  .tabs { display:flex; gap:8px; margin: 12px 0 10px; }
  .tab { flex:1; padding:12px; border-radius:14px; border:2px solid #d1fae5; background:#fff; font-size:16px; font-weight:800; cursor:pointer; color:#64748b; }
  .tab.on { border-color:#059669; background:#ecfdf5; color:#065f46; }
  .period { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .period button { border:1px solid #a7f3d0; background:#fff; border-radius:10px; height:38px; font-size:15px; font-weight:800; cursor:pointer; color:#059669; }
  .period .nav { width:44px; }
  .period button:disabled { opacity:.35; cursor:default; }
  .period .plabel { flex:1; text-align:center; font-size:16px; font-weight:900; color:#065f46; }
  .period .cumbtn { padding:0 12px; background:#ecfdf5; }
  .period .cumbtn.on { background:#059669; color:#fff; border-color:#059669; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(16,185,129,.08); border:1px solid #e2e8f0; }
  .card h2 { font-size:14px; margin:0 0 10px; color:#065f46; font-weight:800; }
  .big { text-align:center; }
  .big .n { font-size:42px; font-weight:900; color:#059669; line-height:1; }
  .big .u { font-size:15px; font-weight:800; color:#059669; }
  .big .sub { font-size:13px; color:#64748b; margin-top:6px; }
  .bar { height:14px; background:#e2e8f0; border-radius:999px; overflow:hidden; margin:12px 0 4px; }
  .bar > div { height:100%; background:linear-gradient(90deg,#34d399,#059669); border-radius:999px; transition:width .6s; }
  .hl { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:999px; padding:5px 12px; font-size:13px; font-weight:700; color:#166534; }
  .rank-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #f1f5f9; }
  .rank-row:last-child { border-bottom:none; }
  .rank-row .pos { width:28px; font-weight:900; font-size:15px; text-align:center; flex-shrink:0; color:#94a3b8; }
  .rank-row .nk { flex:1; font-weight:700; font-size:15px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank-row .ct { font-weight:800; color:#059669; font-size:15px; }
  .me { background:linear-gradient(135deg,#ecfdf5,#d1fae5); border:2px solid #6ee7b7; }
  .me .row { display:flex; justify-content:space-around; text-align:center; margin-bottom:12px; }
  .me .row .n { font-size:26px; font-weight:900; color:#047857; }
  .me .row .l { font-size:12px; color:#065f46; }
  .cta { display:block; text-align:center; background:linear-gradient(135deg,#059669,#047857); color:#fff; text-decoration:none; font-size:17px; font-weight:900; padding:15px; border-radius:14px; box-shadow:0 4px 14px rgba(5,150,105,.3); }
  .empty { text-align:center; color:#94a3b8; font-size:13px; padding:10px; }
  .nudge { text-align:center; font-size:13px; color:#059669; font-weight:800; margin:8px 0 4px; }
</style>
</head>
<body>
<header>
  <button class="back" onclick="history.length>1?history.back():location.href='/home'">‹</button>
  <div style="flex:1;"><h1>🏅 みんなの健康ボード</h1><div class="mo">運動・食事をみんなで応援</div></div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" id="tab-ex" onclick="switchTab('exercise')">🏃 運動</button>
    <button class="tab" id="tab-fo" onclick="switchTab('food')">🍱 食事</button>
  </div>
  <div class="period">
    <button class="nav" id="pv" onclick="navMonth(-1)">◀</button>
    <div class="plabel" id="plabel">—</div>
    <button class="nav" id="nx" onclick="navMonth(1)">▶</button>
    <button class="cumbtn" id="cum" onclick="toggleCum()">📊 累計</button>
  </div>
  <div id="board"></div>
</div>
<script>
  var TOKEN = localStorage.getItem('cohub_token') || '';
  if (!TOKEN) location.replace('/');
  var KIND = 'exercise', MODE = 'month', MONTH = null, CURRENT = null, EARLIEST = null;
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var VERB = { exercise: { act:'運動', unit:'回', cta:'＋ いま運動を記録する', href:'/myactivity.html' },
               food:     { act:'食事', unit:'品', cta:'＋ いま食事を投稿する', href:'/plaza.html?tab=食事' } };

  function ymAdd(ym, d){ var y=+ym.slice(0,4), m=+ym.slice(5,7)-1+d; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+String(m+1).padStart(2,'0'); }
  function switchTab(k){ KIND=k; document.getElementById('tab-ex').classList.toggle('on',k==='exercise'); document.getElementById('tab-fo').classList.toggle('on',k==='food'); load(); }
  function navMonth(d){ if(MODE!=='month') return; MONTH = ymAdd(MONTH||CURRENT, d); load(); }
  function toggleCum(){ MODE = (MODE==='cumulative')?'month':'cumulative'; if(MODE==='month') MONTH=null; load(); }

  function updatePeriodBar(d){
    var cum = document.getElementById('cum');
    cum.classList.toggle('on', MODE==='cumulative');
    cum.textContent = MODE==='cumulative' ? '📅 月別へ' : '📊 累計';
    var pv=document.getElementById('pv'), nx=document.getElementById('nx'), lbl=document.getElementById('plabel');
    if (MODE==='cumulative') { lbl.textContent='累計（全期間）'; pv.disabled=true; nx.disabled=true; return; }
    lbl.textContent = d.year + '年 ' + d.monthName;
    nx.disabled = (d.month >= (CURRENT||d.current));
    pv.disabled = (EARLIEST && d.month <= EARLIEST);
  }

  async function load(){
    var box = document.getElementById('board');
    box.innerHTML = '<div class="empty">読み込み中…</div>';
    var url = '/api/health-board?kind=' + KIND + (MODE==='cumulative' ? '&mode=cumulative' : (MONTH ? '&month='+MONTH : ''));
    try {
      var r = await fetch(url, { headers: { Authorization: 'Bearer ' + TOKEN } });
      if (r.status === 401) { location.replace('/'); return; }
      var d = await r.json();
      if (!d.success) throw new Error(d.msg || 'error');
      CURRENT = d.current; EARLIEST = d.earliest; if (MODE==='month') MONTH = d.month;
      updatePeriodBar(d);
      render(d);
    } catch(e) { box.innerHTML = '<div class="empty">読み込みに失敗しました</div>'; }
  }

  function render(d){
    var v = VERB[d.kind];
    var html = '';
    if (d.cumulative) {
      html += '<div class="card big"><h2>🌍 これまでの合計（全期間）</h2>'
        + '<div><span class="n">'+d.total+'</span> <span class="u">'+v.unit+'</span></div>'
        + '<div class="sub">のべ '+d.participants+'人が'+v.act+'を記録してきました</div></div>';
      html += '<div class="card"><h2>🏅 累計ランキング</h2>';
    } else {
      var target = Math.max(d.lastTotal, d.participants*4, 20);
      var pct = Math.min(100, target ? Math.round(d.total/target*100) : 0);
      html += '<div class="card big"><h2>🌍 みんなの合計</h2>'
        + '<div><span class="n">'+d.total+'</span> <span class="u">'+v.unit+'</span></div>'
        + '<div class="sub">'+d.participants+'人が参加'+(d.lastTotal?'　/　先月の実績 '+d.lastTotal+v.unit:'')+'</div>'
        + '<div class="bar"><div style="width:'+pct+'%"></div></div>'
        + '<div class="sub">目標まで '+Math.max(0,target-d.total)+v.unit+'！みんなで達成しよう</div></div>';
      var hl='';
      if (d.newcomers && d.newcomers.length) hl += '<div style="margin-bottom:8px;"><span style="font-size:13px;font-weight:800;color:#166534;">🌱 今月デビュー</span><div class="hl" style="margin-top:5px;">'+d.newcomers.map(function(x){return '<span class="chip">'+esc(x.nick)+'</span>';}).join('')+'</div></div>';
      if (d.streakTop) hl += '<div><span style="font-size:13px;font-weight:800;color:#166534;">🔥 継続がんばり中</span> <span class="chip" style="margin-left:6px;">'+esc(d.streakTop.nick)+' ('+d.streakTop.days+'日連続)</span></div>';
      if (hl) html += '<div class="card"><h2>✨ この月のハイライト</h2>'+hl+'</div>';
      html += '<div class="card"><h2>🏅 '+v.act+'ランキング</h2>';
    }
    // ranking (共通)
    if (d.ranking && d.ranking.length) {
      var medal=['🥇','🥈','🥉'];
      html += d.ranking.map(function(x,i){ return '<div class="rank-row"><span class="pos">'+(medal[i]||(i+1))+'</span><span class="nk">'+esc(x.nick)+'</span><span class="ct">'+x.count+v.unit+'</span></div>'; }).join('');
    } else html += '<div class="empty">この期間はまだ記録がありません。'+(d.cumulative?'':'あなたが最初の一人になろう！')+'</div>';
    html += '</div>';
    // me + CTA
    html += '<div class="card me"><h2>🙌 あなたの'+(d.cumulative?'累計':'今月')+'</h2><div class="row">';
    if (d.cumulative) {
      html += '<div><div class="n">'+d.me.count+'</div><div class="l">累計'+v.unit+'数</div></div>'
        + '<div><div class="n">'+(d.me.days||0)+'</div><div class="l">活動日数</div></div>'
        + '<div><div class="n">'+(d.me.months||0)+'</div><div class="l">参加月数</div></div>';
    } else {
      html += '<div><div class="n">'+d.me.count+'</div><div class="l">'+v.unit+'数</div></div>'
        + '<div><div class="n">'+(d.me.streak||0)+'</div><div class="l">連続日数</div></div>'
        + '<div><div class="n">'+d.me.lastCount+'</div><div class="l">先月の'+v.unit+'数</div></div>';
    }
    html += '</div>';
    if (!d.cumulative && d.me.count===0) html += '<div class="nudge">1回でランキングに参加できます！</div>';
    html += '<a class="cta" href="'+v.href+'">'+v.cta+'</a></div>';
    document.getElementById('board').innerHTML = html;
  }
  load();
</script>
</body>
</html>
