<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>PDFを見る | CoWell</title>
<!-- ⭐2026-07-28 アプリ内PDFビューア (社長B案)
     目的: 申請書の「デジタル押印」はPDFの“注釈(スタンプ)”として貼られており、
     スマホの標準PDFビューアは注釈を描画しないため印だけ消えていた。
     PDF.jsは注釈の見た目(AppearanceStream)をそのまま描くので、原本を一切変更せずに
     どの端末でも印が見える。過去に提出済みの書類にもそのまま効く。
     ⚠️日本語の注釈(90msp-RKSJ-H等)を正しく出すには cmaps の同梱が必須 (無いと日付が豆腐□になる)。-->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#525659;color:#f8fafc;font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif}
  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#312e81;color:#fff;flex-wrap:wrap}
  .bar .name{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button,.bar a{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:11px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;font-family:inherit}
  .bar button:active{transform:translateY(1px)}
  .bar .sp{font-size:12px;opacity:.9;min-width:66px;text-align:center}
  #pages{padding:12px 8px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .pg{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);max-width:100%}
  .msg{padding:26px 18px;text-align:center;font-size:14px;line-height:1.9}
  .msg a{color:#c7d2fe}
  .spin{width:30px;height:30px;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;margin:0 auto 12px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bar">
  <button onclick="goBack()">← 戻る</button>
  <span class="name" id="fname">PDF</span>
  <button onclick="zoom(-1)">−</button>
  <span class="sp" id="zlabel">幅に合わせる</span>
  <button onclick="zoom(1)">＋</button>
  <a id="dl" href="#" download>保存</a>
</div>
<div id="pages"><div class="msg"><div class="spin"></div>読み込んでいます…</div></div>

<script type="module">
import * as pdfjsLib from '/vendor/pdfjs/pdf.min.mjs?v=20260728';
pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/pdfjs/pdf.worker.min.mjs?v=20260728';

const q = new URLSearchParams(location.search);
const rawFile = q.get('file') || '';
const name = q.get('name') || rawFile.split('/').pop() || 'PDF';
const token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';

// 同一オリジンの /uploads 配下だけを開く (外部URLの読み込み・パストラバーサルを防ぐ)
function safeFile(u){
  if(!u || u.indexOf('/uploads/') !== 0) return '';
  if(u.indexOf('..') >= 0 || u.indexOf('//') >= 0) return '';
  return u;
}
const file = safeFile(rawFile);
document.getElementById('fname').textContent = name;
const dl = document.getElementById('dl');
if(file){ dl.href = file; dl.setAttribute('download', name); } else { dl.style.display='none'; }

window.goBack = function(){ if(history.length>1) history.back(); else location.href='/approval.html'; };

let pdfDoc=null, scaleMode='fit', userScale=1;
window.zoom = function(d){
  if(scaleMode==='fit'){ scaleMode='manual'; userScale=1; }
  userScale = Math.min(4, Math.max(0.4, userScale + d*0.25));
  document.getElementById('zlabel').textContent = Math.round(userScale*100)+'%';
  renderAll();
};

function showMsg(html){ document.getElementById('pages').innerHTML = '<div class="msg">'+html+'</div>'; }

async function main(){
  if(!file){ showMsg('表示するファイルが指定されていません。'); return; }
  // /uploads はログイン済みCookie(cohub_s)で認可されるため、先に認証APIを叩いてCookieを確実に配ってもらう
  try{
    if(token) await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}});
  }catch(e){}
  try{
    const task = pdfjsLib.getDocument({
      url: file,
      withCredentials: true,              // Cookie を付けて /uploads を取得
      cMapUrl: '/vendor/pdfjs/cmaps/',    // ⚠️日本語(CIDフォント)の描画に必須
      cMapPacked: true,
      standardFontDataUrl: '/vendor/pdfjs/standard_fonts/',
    });
    pdfDoc = await task.promise;
    await renderAll();
  }catch(e){
    const unauth = String(e && (e.status||e.message||'')).indexOf('401')>=0;
    showMsg(unauth
      ? 'この書類を表示する権限がないか、ログインの有効期限が切れています。<br>お手数ですが、ログインし直してから開いてください。'
      : 'PDFを表示できませんでした。<br><a href="'+file+'" target="_blank" rel="noopener">元のファイルを開く</a>');
  }
}

let rendering=false;
async function renderAll(){
  if(!pdfDoc || rendering) return;
  rendering=true;
  const box=document.getElementById('pages');
  box.innerHTML='';
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  const avail=Math.min(document.documentElement.clientWidth-16, 1000);
  for(let n=1;n<=pdfDoc.numPages;n++){
    const page=await pdfDoc.getPage(n);
    const base=page.getViewport({scale:1});
    const scale=(scaleMode==='fit'? avail/base.width : (avail/base.width)*userScale);
    const vp=page.getViewport({scale:scale*dpr});
    const cv=document.createElement('canvas');
    cv.className='pg';
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    cv.style.width=Math.floor(vp.width/dpr)+'px'; cv.style.height=Math.floor(vp.height/dpr)+'px';
    box.appendChild(cv);
    await page.render({
      canvasContext: cv.getContext('2d'),
      viewport: vp,
      annotationMode: pdfjsLib.AnnotationMode.ENABLE,   // ★押印(スタンプ注釈)を紙面に描く
    }).promise;
  }
  rendering=false;
}

let rt=null;
window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(renderAll,250); });
main();
</script>
</body>
</html>
