<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400">
<title>配車ルート地図 | LogiHub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E🗺️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; background: #f1f5f9; color: #0f172a; font-size: 13px; height: 100vh; overflow: hidden; }
header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
header h1 { font-size: 16px; font-weight: 700; }
header select, header button { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; font-size: 12px; cursor: pointer; }
header button.primary { background: #1e40af; color: #fff; border-color: #1e40af; }
header button:hover { background: #f1f5f9; }
header button.primary:hover { background: #1e3a8a; }
header .spacer { flex: 1; }
header .geo-status { font-size: 11px; color: #64748b; padding: 4px 10px; background: #f1f5f9; border-radius: 6px; }
.layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 50px); }
.sidebar { background: #fff; border-right: 1px solid #e2e8f0; overflow-y: auto; padding: 10px; }
.veh-card { padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
.veh-card:hover { background: #f8fafc; }
.veh-card.active { border-color: var(--c, #7c3aed); background: #f8fafc; }
.veh-card.hidden { opacity: .35; }
.veh-row1 { display: flex; align-items: center; gap: 6px; }
.veh-no { font-weight: 800; font-size: 14px; }
.co-badge { padding: 1px 6px; border-radius: 8px; font-size: 10px; font-weight: 700; color: #fff; }
.day-badge { padding: 1px 5px; border-radius: 8px; font-size: 10px; background: #fef3c7; color: #92400e; font-weight: 600; }
.veh-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
.veh-stat { font-size: 11px; color: #475569; }
.veh-stat .geo-warn { color: #dc2626; }
.color-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; }
#map { width: 100%; height: 100%; }
.map-marker {
  background: var(--c, #7c3aed); color: #fff; border-radius: 50%;
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px; border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,.3);
}
.map-marker.depot { background: #0f172a; width: 36px; height: 36px; font-size: 14px; border-radius: 6px; }
.popup-stop { font-size: 12px; min-width: 200px; }
.popup-stop .pn { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.popup-stop .pa { color: #64748b; font-size: 11px; margin-bottom: 4px; }
.popup-stop .pinfo { display: flex; justify-content: space-between; font-size: 11px; }
.popup-stop .badge-time { background: #fee2e2; color: #991b1b; padding: 1px 6px; border-radius: 8px; font-size: 10px; }
.toggle-row { display: flex; gap: 4px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; margin-bottom: 6px; }
.toggle-row button { flex: 1; padding: 4px; font-size: 11px; }
.empty { padding: 30px; text-align: center; color: #94a3b8; }
.toast { position: fixed; bottom: 20px; right: 20px; background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 6px; font-size: 12px; opacity: 0; transition: opacity .2s; z-index: 1000; max-width: 420px; }
.toast.show { opacity: 1; }
.toast.error { background: #dc2626; }
</style>
</head>
<body>
<header>
  <h1>🗺️ 配車ルート地図</h1>
  <select id="dateSel"></select>
  <select id="coFilter"><option value="">全業者</option><option value="スタ運">スタ運</option><option value="昭栄">昭栄</option><option value="ｶｰﾚﾝﾄ">ｶｰﾚﾝﾄ</option></select>
  <select id="dayFilter"><option value="">全配送日</option><option value="平日">平日</option><option value="土曜">土曜</option></select>
  <button id="geoBtn" onclick="runGeocode(false)">📍 ジオコード実行</button>
  <button id="geoBtnForce" onclick="runGeocode(true)" style="background:#fef3c7;color:#92400e;border-color:#fcd34d">♻️ 全件再取得</button>
  <span id="geoStatus" class="geo-status">-</span>
  <div class="spacer"></div>
  <button onclick="location.href='/takara/admin.html'">← 配車一覧へ</button>
</header>
<div class="layout">
  <div class="sidebar">
    <div class="toggle-row">
      <button onclick="toggleAll(true)">全表示</button>
      <button onclick="toggleAll(false)">全非表示</button>
    </div>
    <div id="veh-list"><div class="empty">読み込み中…</div></div>
  </div>
  <div id="map"></div>
</div>
<div id="toast" class="toast"></div>
<script>
const token = localStorage.getItem('cohub_token') || '';
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers||{}) } });
  if (!r.ok) { const t = await r.text(); toast('エラー: ' + t.slice(0,100), true); throw new Error(t); }
  return r.json();
}
function toast(m, err = false) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' error' : ''); setTimeout(() => t.className = 'toast', 2500); }

let map;
let depotMarkers = {};  // depot_key → marker
let layers = {};       // vehicle_no → L.LayerGroup
let visible = {};      // vehicle_no → bool
let curDate = null;
let curData = null;
let dates = [];

function vehColor(vehNo, idx) {
  const h = (idx * 47) % 360;
  return `hsl(${h}, 70%, 45%)`;
}

function initMap() {
  map = L.map('map').setView([35.495, 139.59], 10);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 18,
  }).addTo(map);
}

function renderDepots(depots) {
  // 既存depotマーカー削除
  for (const k of Object.keys(depotMarkers)) map.removeLayer(depotMarkers[k]);
  depotMarkers = {};
  if (!depots) return;
  for (const [key, d] of Object.entries(depots)) {
    const icon = L.divIcon({ className: '', html: `<div class="map-marker depot">${d.icon || '🏢'}</div>`, iconSize: [36,36], iconAnchor: [18,18] });
    depotMarkers[key] = L.marker([d.lat, d.lng], { icon }).addTo(map).bindPopup(`<b>${d.name}</b><br>${d.address}`);
  }
}

async function loadDates() {
  const r = await api('/api/takara/dates');
  dates = r.dates || [];
  const sel = document.getElementById('dateSel');
  const wd = ['日','月','火','水','木','金','土'];
  const fmt = (s) => {
    const y = s.slice(0,4), m = s.slice(4,6), d = s.slice(6,8);
    const dt = new Date(+y, +m - 1, +d);
    return `${y}/${m}/${d} (${wd[dt.getDay()]})`;
  };
  sel.innerHTML = dates.map(d => `<option value="${d.load_date}">${fmt(d.load_date)} ${d.kind || ''}</option>`).join('');
  curDate = dates[0]?.load_date;
  if (curDate) await loadAll();
}

async function loadAll() {
  if (!curDate) return;
  await checkGeoStatus();
  const r = await api('/api/takara/route-map/' + curDate);
  curData = r;
  render();
}

async function checkGeoStatus() {
  try {
    const r = await api('/api/takara/geocode-status/' + curDate);
    const el = document.getElementById('geoStatus');
    if (r.pending > 0) {
      el.textContent = `🟡 未取得 ${r.pending}件 / 完了 ${r.hit}/${r.total}`;
      el.style.background = '#fef3c7';
    } else {
      el.textContent = `✅ 完了 ${r.hit}/${r.total}件 ${r.fail ? '(失敗' + r.fail + ')' : ''}`;
      el.style.background = '#dcfce7';
    }
  } catch(e) {}
}

function render() {
  const co = document.getElementById('coFilter').value;
  const day = document.getElementById('dayFilter').value;
  const vehicles = (curData?.vehicles || []).filter(v =>
    (!co || v.company === co) && (!day || v.delivery_day === day)
  );
  renderDepots(curData?.depots || {});

  for (const k of Object.keys(layers)) { map.removeLayer(layers[k]); }
  layers = {}; visible = {};

  const list = document.getElementById('veh-list');
  if (!vehicles.length) {
    list.innerHTML = '<div class="empty">該当する号車がありません</div>';
    return;
  }
  let html = '';
  const allBounds = [];
  // 拠点を境界に含める
  if (curData?.depots) for (const d of Object.values(curData.depots)) allBounds.push([d.lat, d.lng]);
  vehicles.forEach((v, i) => {
    const color = vehColor(v.vehicle_no, i);
    const stops = v.stops.filter(s => s.lat != null);
    const noGeo = v.stops.length - stops.length;
    visible[v.vehicle_no] = true;

    // この号車の depot
    const dep = v.depot || (curData?.depots && curData.depots[v.depot_key]) || { lat: 35.4869, lng: 139.4061, name: '座間積替倉庫', icon: '🏢' };

    const layer = L.layerGroup().addTo(map);
    // ルート線: depot → 各stop → depot
    const path = [[dep.lat, dep.lng], ...stops.map(s => [s.lat, s.lng]), [dep.lat, dep.lng]];
    L.polyline(path, { color, weight: 3, opacity: 0.7 }).addTo(layer);
    // マーカー
    stops.forEach(s => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="map-marker" style="--c:${color}">${s.sequence}</div>`,
        iconSize: [28, 28], iconAnchor: [14, 14],
      });
      const m = L.marker([s.lat, s.lng], { icon }).addTo(layer);
      m.bindPopup(`
        <div class="popup-stop">
          <div class="pn">${s.sequence}. ${s.site_name || '-'}</div>
          <div class="pa">${s.address || '住所不明'}</div>
          <div class="pinfo">
            <span>🚚 ${v.vehicle_no}</span>
            <span>⏰ ${s.eta || '--:--'}${s.time_spec ? ' <span class="badge-time">' + s.time_spec + '</span>' : ''}</span>
          </div>
          <div class="pinfo">
            <span>📦 ${Math.round(s.sai||0)}才 / ${s.qty||0}個</span>
            <span style="color:#94a3b8">${s.geo_accuracy === 'ward' ? '(区中心)' : ''}</span>
          </div>
        </div>
      `);
      allBounds.push([s.lat, s.lng]);
    });
    layers[v.vehicle_no] = layer;

    const bgColor = v.company === 'スタ運' ? '#1e40af' : v.company === '昭栄' ? '#ea580c' : v.company === 'ｶｰﾚﾝﾄ' ? '#dc2626' : '#64748b';
    html += `<div class="veh-card" data-veh="${v.vehicle_no}" style="--c:${color}" onclick="toggleVeh('${v.vehicle_no}', this)">
      <div class="veh-row1">
        <span class="color-dot" style="background:${color}"></span>
        <span class="veh-no">${v.vehicle_no}</span>
        <span class="co-badge" style="background:${bgColor}">${v.company || ''}</span>
        ${v.delivery_day === '土曜' ? '<span class="day-badge">土曜</span>' : ''}
        <span style="margin-left:auto;font-size:11px;color:#475569;">${dep.icon || '🏢'} ${dep.name?.replace(/積替倉庫|\(.*\)/g,'').trim() || ''}</span>
      </div>
      <div class="veh-meta">${v.vehicle_type || '-'} / ${v.driver_name || '未割当'}</div>
      <div class="veh-stat">${v.stops.length}件 / ${Math.round(v.total_sai||0)}才 ${noGeo > 0 ? `<span class="geo-warn">⚠️ 未測位${noGeo}</span>` : ''}</div>
    </div>`;
  });
  list.innerHTML = html;
  if (allBounds.length > 1) map.fitBounds(allBounds, { padding: [40, 40] });
}

function toggleVeh(vehNo, el) {
  visible[vehNo] = !visible[vehNo];
  if (visible[vehNo]) { layers[vehNo].addTo(map); el.classList.remove('hidden'); }
  else { map.removeLayer(layers[vehNo]); el.classList.add('hidden'); }
}

function toggleAll(show) {
  for (const k of Object.keys(visible)) {
    if (show && !visible[k]) layers[k].addTo(map);
    else if (!show && visible[k]) map.removeLayer(layers[k]);
    visible[k] = show;
  }
  document.querySelectorAll('.veh-card').forEach(c => c.classList.toggle('hidden', !show));
}

async function runGeocode(force) {
  if (!curDate) return;
  if (force && !confirm('全キャッシュを削除して再ジオコードします。1件1秒で全件取り直すため数分かかります。続行しますか？')) return;
  const btn = document.getElementById(force ? 'geoBtnForce' : 'geoBtn');
  btn.disabled = true; btn.textContent = '⏳ 実行中…';
  try {
    const r = await api('/api/takara/geocode/' + curDate, { method: 'POST', body: JSON.stringify({ force }) });
    toast(`📍 ${r.msg} - 1件1秒なので完了まで時間かかります。30秒ごとに状況確認`, false);
    // ポーリング
    const poll = async () => {
      await checkGeoStatus();
      const r2 = await api('/api/takara/geocode-status/' + curDate);
      if (r2.pending > 0) {
        setTimeout(poll, 30000);
      } else {
        document.getElementById('geoBtn').disabled = false;
        document.getElementById('geoBtn').textContent = '📍 ジオコード実行';
        document.getElementById('geoBtnForce').disabled = false;
        document.getElementById('geoBtnForce').textContent = '♻️ 全件再取得';
        toast('✅ ジオコード完了。地図再読込');
        await loadAll();
      }
    };
    setTimeout(poll, 5000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = force ? '♻️ 全件再取得' : '📍 ジオコード実行';
  }
}

document.getElementById('dateSel').onchange = e => { curDate = e.target.value; loadAll(); };
document.getElementById('coFilter').onchange = render;
document.getElementById('dayFilter').onchange = render;

if (!token) location.href = '/login.html';
initMap();
loadDates();
</script>
</body>
</html>
