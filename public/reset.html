<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>CoWell リセット</title>
<style>
  body { margin:0; font-family:-apple-system,'Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif; background:#f1f5f9; color:#0f172a; }
  .wrap { max-width:520px; margin:0 auto; padding:28px 18px; }
  .card { background:#fff; border-radius:16px; padding:22px; box-shadow:0 4px 16px rgba(0,0,0,.08); }
  h1 { font-size:1.2rem; margin:0 0 6px; }
  .sub { color:#64748b; font-size:.85rem; margin-bottom:16px; }
  .log { background:#0f172a; color:#a7f3d0; font-size:.8rem; border-radius:14px; padding:12px 14px; min-height:120px; white-space:pre-wrap; line-height:1.6; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .ok { color:#86efac; }
  .err { color:#fca5a5; }
  .btn { display:block; width:100%; border:none; border-radius:16px; padding:15px; font-size:1rem; font-weight:800; color:#fff; background:linear-gradient(135deg,#0ea5e9,#0369a1); cursor:pointer; margin-top:14px; text-align:center; text-decoration:none; }
  .btn.danger { background:linear-gradient(135deg,#ef4444,#dc2626); }
  .btn.ghost { background:#fff; color:#0f172a; border:1px solid #e2e8f0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style id="biz-udp-global">
html,body,button,input,select,textarea{font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
body :not(code):not(pre):not(kbd):not(samp):not(tt):not([style*="monospace"]):not([style*="Consolas"]):not([style*="SF Mono"]):not([style*="Mincho"]):not([style*="游明朝"]):not([style*="Yu Mincho"]){font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
code,pre,kbd,samp,tt{font-family:ui-monospace,Consolas,"SF Mono","Courier New",monospace!important}
</style>
<style id="cohub-swipe-guard">html,body{overscroll-behavior-x:none}</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>🧹 CoWell を初期化</h1>
    <div class="sub">古いアプリ（旧版）が残って起動しない場合の修復ページです。下のログが「完了」になったら「ホームを開く」を押してください。</div>
    <div class="log" id="log">開始しています…\n</div>
    <button class="btn" id="go" onclick="goHome()" style="display:none;">✅ ホームを開く</button>
    <button class="btn ghost" onclick="run(false)">もう一度クリーンアップ</button>
    <button class="btn danger" onclick="run(true)">ログイン情報も消して完全リセット</button>
  </div>
</div>
<script>
var logEl = document.getElementById('log');
function log(m, cls){ var s = document.createElement('span'); if(cls) s.className = cls; s.textContent = m + '\n'; logEl.appendChild(s); }
function goHome(){ location.replace('/home'); }
async function run(wipeLogin){
  logEl.textContent = '';
  log('クリーンアップを開始します…');
  // 1) Service Worker を全解除
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      log('Service Worker: ' + regs.length + ' 件を解除します');
      for (var i = 0; i < regs.length; i++) { try { await regs[i].unregister(); log('  ・解除OK', 'ok'); } catch(e){ log('  ・解除失敗: ' + e.message, 'err'); } }
    } else { log('Service Worker 非対応ブラウザ（スキップ）'); }
  } catch(e){ log('SW解除エラー: ' + e.message, 'err'); }
  // 2) CacheStorage を全削除
  try {
    if ('caches' in window) {
      var ks = await caches.keys();
      log('キャッシュ: ' + ks.length + ' 件を削除します');
      for (var j = 0; j < ks.length; j++) { try { await caches.delete(ks[j]); log('  ・' + ks[j] + ' 削除OK', 'ok'); } catch(e){ log('  ・削除失敗: ' + e.message, 'err'); } }
    } else { log('CacheStorage 非対応（スキップ）'); }
  } catch(e){ log('キャッシュ削除エラー: ' + e.message, 'err'); }
  // 3) バージョン情報をリセット（リロードループ防止）
  try { localStorage.removeItem('cohub_app_version'); localStorage.removeItem('cohub_version_just_reloaded'); log('バージョン情報リセットOK', 'ok'); } catch(e){}
  // 4) 完全リセット時はログイン情報も消す
  if (wipeLogin) {
    try { localStorage.clear(); sessionStorage.clear(); log('ログイン情報を含む全データを削除しました（再ログインが必要です）', 'ok'); } catch(e){ log('全削除エラー: ' + e.message, 'err'); }
  }
  log('完了しました ✔', 'ok');
  log('「ホームを開く」を押してください。');
  document.getElementById('go').style.display = '';
}
run(false);
</script>
<script src="/kiosk-guard.js?v=20260703-idle3" defer></script>
</body>
</html>
