<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store">
<title>マンスリー栄養レポート | CoWell</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f5f7fb;margin:0;color:#1f2937}
  .header{background:linear-gradient(135deg,#0d9488,#0ea5a3);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .header h1{font-size:18px;margin:0;font-weight:800;flex:1}
  .back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}
  .container{max-width:860px;margin:14px auto;padding:0 12px 48px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px;margin-bottom:14px}
  .card-title{font-size:15px;font-weight:800;margin-bottom:10px;color:#0f766e}
  .nav-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .nav-btn{border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:800;background:#ccfbf1;color:#0f766e;font-size:13px}
  .nav-btn.active{background:#0d9488;color:#fff}
  .section{display:none}.section.active{display:block}
  label{font-size:12px;font-weight:700;color:#475569}
  select,input{padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;background:#fff}
  .btn{border:none;border-radius:9px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:800;color:#fff;background:#0d9488}
  .btn.sec{background:#6366f1}.btn.gray{background:#7c8797}
  .btn.busy{opacity:.6;pointer-events:none}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .msg{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:13px;display:none;white-space:pre-wrap}
  .msg.info{display:block;background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}
  .msg.error{display:block;background:#fdeaea;color:#a12a2a;border:1px solid #f2bcbc}
  .rep-sec{margin:14px 0}
  .rep-sec h3{font-size:14px;margin:0 0 6px;color:#0f766e;font-weight:800;border-left:4px solid #0d9488;padding-left:8px}
  .rep-sec p{margin:0;font-size:14px;line-height:1.8;white-space:pre-wrap}
  .warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:12px 14px}
  .warn h3{color:#b45309;border-left-color:#f59e0b}
  .cheer{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:12px 14px;font-weight:700;color:#0f766e}
  .nextlist{margin:0;padding-left:0;list-style:none}
  .nextlist li{background:#eef2ff;border:1px solid #c7d2fe;border-radius:9px;padding:9px 12px;margin-bottom:7px;font-size:14px;line-height:1.6;color:#3730a3}
  .nextlist li b{color:#4338ca}
  .bar-row{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12px}
  .bar-track{background:#eef2f7;border-radius:7px;height:16px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:7px}
  .bar-good{background:#10b981}.bar-warn{background:#f59e0b}.bar-bad{background:#ef4444}
  .bar-val{font-weight:700;white-space:nowrap}
  .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;color:#fff;margin-left:4px}
  .chip-good{background:#10b981}.chip-warn{background:#f59e0b}.chip-bad{background:#ef4444}
  /* 栄養イラスト(塗り絵風)グリッド */
  .nut-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px}
  @media(max-width:520px){.nut-grid{grid-template-columns:repeat(2,1fr)}}
  .nut-cell{border:1px solid #e4eaf2;border-radius:14px;padding:10px 8px 9px;text-align:center;background:#fbfdff}
  .nut-cell.good{border-color:#a7f3d0;background:#f0fdf9}
  .nut-cell.warn{border-color:#fde68a;background:#fffbeb}
  .nut-cell.bad{border-color:#fecaca;background:#fef2f2}
  .nut-ico{position:relative;width:58px;height:58px;margin:0 auto 6px}
  .nut-ico .g{position:absolute;left:0;bottom:0;width:58px;height:58px;font-size:46px;line-height:58px;text-align:center}
  .nut-ico .base{filter:grayscale(1);opacity:.20}
  .nut-ico .clip{position:absolute;left:0;bottom:0;width:58px;overflow:hidden;transition:height .5s ease}
  .nut-name{font-size:13px;font-weight:800;color:#334155}
  .nut-val{font-size:15px;font-weight:800;color:#0f172a;margin-top:3px}
  .nut-val .t{font-size:11px;font-weight:600;color:#94a3b8}
  .nut-pct{font-size:12px;font-weight:800;margin-top:3px;padding:1px 8px;border-radius:999px;display:inline-block}
  .nut-pct.good{color:#0f9d63;background:#dcfce7}
  .nut-pct.warn{color:#b45309;background:#fef3c7}
  .nut-pct.bad{color:#dc2626;background:#fee2e2}
  /* 逸脱レベル別の段階強調 (超過/不足ほど 注意→危険→重大) */
  .nut-cell.sev1{border-color:#fcd34d;background:#fffbeb}
  .nut-cell.sev2{border-color:#fdba74;background:#fff7ed}
  .nut-cell.sev3{border-color:#fca5a5;background:#fef2f2}
  .nut-cell.sev4{border-color:#ef4444;background:#fee2e2}
  .nut-pct.sev1{color:#b45309;background:#fef3c7;font-size:12.5px}
  .nut-pct.sev2{color:#c2410c;background:#ffedd5;font-size:14px;font-weight:900}
  .nut-pct.sev3{color:#dc2626;background:#fee2e2;font-size:15.5px;font-weight:900;box-shadow:0 1px 5px rgba(220,38,38,.3)}
  .nut-pct.sev4{color:#991b1b;background:#fee2e2;font-size:17.5px;font-weight:900;letter-spacing:.5px;box-shadow:0 2px 9px rgba(153,27,27,.45);animation:nutAlarm 1s ease-in-out infinite}
  @keyframes nutAlarm{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  .meta{font-size:12px;color:#64748b;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #e4eaf2;padding:8px;text-align:left}
  th{background:#f7f9fc;font-size:12px}
  .small{font-size:12px;color:#64748b}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay-card{background:#fff;border-radius:14px;padding:22px 26px;text-align:center;min-width:240px}
  .spinner{width:30px;height:30px;border:4px solid #d9e1ec;border-top-color:#0d9488;border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>
<script src="/font-zoom.js" defer></script>
<script src="/version-check.js" defer></script>
</head>
<body>
<div class="header">
  <button class="back" onclick="goBack()">← 戻る</button>
  <h1>📊 マンスリー栄養レポート</h1>
  <span id="fz-slot"></span>
</div>
<div class="container">
  <div class="nav-row">
    <button class="nav-btn active" id="navMine" onclick="showSection('mine')">自分のレポート</button>
    <button class="nav-btn hidden" id="navMembers" onclick="showSection('members');loadMembers()">メンバー（見守り）</button>
  </div>

  <div id="sectionMine" class="section active">
    <div class="card">
      <div class="card-title">対象の月</div>
      <div class="row">
        <div style="display:flex;flex-direction:column;gap:5px"><label>月を選ぶ</label><select id="mySel"></select></div>
        <button class="btn" id="btnShowMine" onclick="showMine()">表示</button>
        <button class="btn sec" id="btnGenMine" onclick="genMine()">この月のレポートを作成/更新</button>
      </div>
      <div class="small" style="margin-top:8px">※ その月の食事投稿が <b id="minMeals">10</b> 件以上で作成できます。</div>
      <div id="mineMsg" class="msg"></div>
    </div>
    <div id="mineReport"></div>
  </div>

  <div id="sectionMembers" class="section">
    <div class="card">
      <div class="card-title">メンバーの食事記録（推進メンバー向け）</div>
      <div class="small">本人の健康情報です。見守り・声かけの目的でご利用ください。</div>
      <div id="membersMsg" class="msg"></div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>氏名</th><th>今月</th><th>先月</th><th>レポート</th><th></th></tr></thead><tbody id="membersBody"><tr><td colspan="5" class="small">読み込み中…</td></tr></tbody></table></div>
    </div>
    <div id="memberReport"></div>
  </div>
</div>
<div id="overlay" class="overlay"><div class="overlay-card"><div class="spinner"></div><div id="overlayText">AIが分析中…（10〜30秒）</div></div></div>

<script>
const token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
if (!token) location.href = '/';
let INIT = null;
function goBack(){ var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||''); if(history.length>1){history.back();}else{location.href=m?'/m':'/';} }
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function busy(on,t){$('overlay').style.display=on?'flex':'none';if(t)$('overlayText').textContent=t;}
function showMsg(id,t,type){const e=$(id);if(!e)return;if(!t){e.className='msg';e.textContent='';return;}e.className='msg '+(type||'info');e.textContent=t;}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  if(opts.json!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.json);delete opts.json;}
  const r=await fetch('/api/food-report'+path,Object.assign({},opts,{headers}));
  if(r.status===401){location.href='/';return{success:false};}
  return r.json();
}
function showSection(name){
  ['mine','members'].forEach(k=>{$('section'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);$('nav'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);});
}
function ymLabel(ym){const p=String(ym).split('-');return p[0]+'年'+Number(p[1])+'月';}

// 栄養バー定義
const NUTRIENTS=[
  {k:'kcal',label:'カロリー',unit:'kcal',min:450,max:650},
  {k:'protein',label:'たんぱく質',unit:'g',min:20},
  {k:'fat',label:'脂質',unit:'g',min:12,max:18},
  {k:'carbs',label:'炭水化物',unit:'g',min:69,max:89},
  {k:'veg',label:'野菜',unit:'g',min:120},
  {k:'ca',label:'カルシウム',unit:'mg',min:227},
  {k:'salt',label:'食塩',unit:'g',max:2.5},
  {k:'fiber',label:'食物繊維',unit:'g',min:7},
];
const NUT_ICON={kcal:'🔥',protein:'🍗',fat:'🧈',carbs:'🍚',veg:'🥬',ca:'🥛',salt:'🧂',fiber:'🌾'};
// 実際値を基準と比較 → {cls,pctText,fill%}
function evalNut(n,v){
  let cls='good', bad=false, over=false, dev=0, lbl='適正';
  if(n.max!=null && v>n.max){ bad=true; over=true; lbl='超過'; dev=Math.round((v-n.max)/n.max*100); }
  else if(n.min!=null && v<n.min){ bad=true; lbl='不足'; dev=Math.round((n.min-v)/n.min*100); }
  let warn='';
  if(bad){
    if(dev<25){cls='sev1';}
    else if(dev<60){cls='sev2';warn='⚠ ';}
    else if(dev<120){cls='sev3';warn='⚠ ';}
    else{cls='sev4';warn='‼ ';}
  }
  const pctText = bad ? (warn+(over?'▲':'▼')+dev+'% '+lbl) : '✓ 適正';
  const ref=(n.max!=null?n.max:n.min);
  const fill=Math.max(8,Math.min(100,Math.round(v/ref*100)));
  return {cls,pctText,fill};
}
function tgtNum(n){
  if(n.min!=null&&n.max!=null)return n.min+'〜'+n.max+n.unit;
  if(n.max!=null)return n.max+n.unit+'まで';
  return n.min+n.unit+'以上';
}
function chartHtml(avg){
  const cells=NUTRIENTS.map(n=>{
    const v=Number(avg[n.k]||0), e=evalNut(n,v), ico=NUT_ICON[n.k]||'🍽';
    return '<div class="nut-cell '+e.cls+'">'
      +'<div class="nut-ico"><div class="g base">'+ico+'</div><div class="clip" style="height:'+e.fill+'%"><div class="g">'+ico+'</div></div></div>'
      +'<div class="nut-name">'+n.label+'</div>'
      +'<div class="nut-val">'+v+'<span class="t">'+n.unit+' / 基準 '+tgtNum(n)+'</span></div>'
      +'<div class="nut-pct '+e.cls+'">'+e.pctText+'</div>'
      +'</div>';
  }).join('');
  return '<div class="nut-grid">'+cells+'</div>'
    +'<div class="small" style="margin-top:8px">イラストは基準値に対する量を下から塗って表現（満タン＝基準到達）。数値は1食あたりの平均で、基準と比べた超過／不足を表示しています。</div>';
}
function reportHtml(data, name){
  const r=data.report||{}, m=data.metrics||{}, avg=m.avg||{}, c=m.counts||{};
  const next=(Array.isArray(r.next_month)?r.next_month:[]).map(x=>'<li>'+esc(x)+'</li>').join('');
  const alcStat='<div class="meta">飲酒した日 '+(c.alcohol_days||0)+'日／記録'+(m.days_logged||0)+'日中　飲酒した食事 '+(c.alcohol_meals||0)+'件　純アルコール 約'+(c.alcohol_total_g||0)+'g（飲酒日あたり平均 約'+(c.alcohol_per_drink_day||0)+'g/日・目安は20g/日まで・週2日は休肝日）</div>';
  return '<div class="card">'
    +'<div class="card-title">'+esc(name?name+'さんの':'')+ymLabel(data.ym)+' のレポート</div>'
    +'<div class="meta">食事記録 '+(m.meal_count||0)+'件 / '+(m.days_logged||0)+'日　作成日 '+esc((data.created_at||'').slice(0,10))+'</div>'
    +'<div class="rep-sec"><h3>今月のまとめ</h3><p>'+esc(r.summary||'')+'</p></div>'
    +'<div class="rep-sec"><h3>栄養バランス（1食あたり平均）</h3>'+chartHtml(avg)+'</div>'
    +'<div class="rep-sec"><h3>栄養分析</h3><p>'+esc(r.nutrition_analysis||'')+'</p></div>'
    +'<div class="rep-sec"><h3>🍶 飲酒（お酒）について</h3>'+alcStat+'<p>'+esc(r.alcohol||'')+'</p></div>'
    +'<div class="rep-sec"><h3>あなたの食習慣の傾向</h3><p>'+esc(r.tendencies||'')+'</p></div>'
    +'<div class="rep-sec"><h3>来月、心がけたいこと</h3><ul class="nextlist">'+next+'</ul></div>'
    +'<div class="rep-sec warn"><h3>⚠️ このまま続くと…（将来への注意）</h3><p>'+esc(r.future_warning||'')+'</p></div>'
    +'<div class="rep-sec cheer">'+esc(r.cheer||'')+'</div>'
    +'</div>';
}

async function init(){
  const d=await api('/init');
  if(!d.success){showMsg('mineMsg','初期化に失敗しました','error');return;}
  INIT=d;
  $('minMeals').textContent=d.min_meals;
  const sel=$('mySel');sel.innerHTML='';
  (d.my_months||[]).forEach(mm=>{const o=document.createElement('option');o.value=mm.ym;o.textContent=ymLabel(mm.ym)+'（'+mm.n+'件）'+((d.my_reports||[]).includes(mm.ym)?' ✓作成済':'');sel.appendChild(o);});
  if(!sel.options.length){const o=document.createElement('option');o.value='';o.textContent='食事の記録がまだありません';sel.appendChild(o);}
  if(d.me.is_promoter)$('navMembers').classList.remove('hidden');
  // 最新の作成済みレポートがあれば表示
  if((d.my_reports||[]).length){sel.value=d.my_reports[0];showMine();}
}
async function showMine(){
  const ym=$('mySel').value;if(!ym){showMsg('mineMsg','対象の月がありません','error');return;}
  showMsg('mineMsg','');$('mineReport').innerHTML='';
  busy(true,'読み込み中…');
  const d=await api('/get?ym='+encodeURIComponent(ym));
  busy(false);
  if(!d.success){showMsg('mineMsg','この月のレポートはまだありません。「作成/更新」を押してください。','info');return;}
  $('mineReport').innerHTML=reportHtml(d.report,'');
}
async function genMine(){
  const ym=$('mySel').value;if(!ym){showMsg('mineMsg','対象の月がありません','error');return;}
  busy(true,'AIが分析中…（10〜30秒）');
  const d=await api('/generate',{method:'POST',json:{ym}});
  busy(false);
  if(!d.success){showMsg('mineMsg',d.msg||'作成に失敗しました','error');return;}
  showMsg('mineMsg','レポートを作成しました。','info');
  const out=d.report;  // {id, metrics, report}
  const rep={ym:ym,created_at:'',meal_count:(out.metrics&&out.metrics.meal_count)||0,metrics:out.metrics,report:out.report};
  $('mineReport').innerHTML=reportHtml(rep,'');
  init();
}

// ===== メンバー (推進) =====
async function loadMembers(){
  const tb=$('membersBody');tb.innerHTML='<tr><td colspan="5" class="small">読み込み中…</td></tr>';
  const d=await api('/members');
  if(!d.success){tb.innerHTML='<tr><td colspan="5" class="small">取得失敗</td></tr>';return;}
  if(!d.items.length){tb.innerHTML='<tr><td colspan="5" class="small">対象メンバーがいません。</td></tr>';return;}
  tb.innerHTML=d.items.map(it=>{
    const has=(it.reports||[]).length;
    return '<tr><td>'+esc(it.name)+'</td><td>'+it.this_month+'件</td><td>'+it.last_month+'件</td>'
      +'<td>'+(has?'<span class="small">'+it.reports.map(ymLabel).join('・')+'</span>':'<span class="small">未作成</span>')+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn sec btn-sm" onclick="genMember(\''+it.uid+'\',\''+d.last_ym+'\',\''+esc(it.name)+'\')">先月分を作成</button> '
      +'<button class="btn gray btn-sm" onclick="genMember(\''+it.uid+'\',\''+d.this_ym+'\',\''+esc(it.name)+'\')">今月分を作成</button>'
      +(has?' <button class="btn btn-sm" onclick="viewMember(\''+it.uid+'\',\''+it.reports[0]+'\',\''+esc(it.name)+'\')">最新を表示</button>':'')
      +(has?' <button class="btn btn-sm" style="background:#0891b2" onclick="notifyMember(\''+it.uid+'\',\''+it.reports[0]+'\',\''+esc(it.name)+'\')">本人へ通知</button>':'')
      +'</td></tr>';
  }).join('');
}
async function viewMember(uid,ym,name){
  showMsg('membersMsg','');$('memberReport').innerHTML='';
  busy(true,'読み込み中…');
  const d=await api('/get?user_id='+encodeURIComponent(uid)+'&ym='+encodeURIComponent(ym));
  busy(false);
  if(!d.success){showMsg('membersMsg',d.msg||'未作成','error');return;}
  $('memberReport').innerHTML=reportHtml(d.report,name);
}
async function genMember(uid,ym,name){
  busy(true,'AIが分析中…（10〜30秒）');
  const d=await api('/generate',{method:'POST',json:{user_id:uid,ym}});
  busy(false);
  if(!d.success){showMsg('membersMsg',name+'さん「'+ymLabel(ym)+'」: '+(d.msg||'作成に失敗'),'error');return;}
  showMsg('membersMsg',name+'さんの'+ymLabel(ym)+'レポートを作成しました。','info');
  const rep={ym:ym,created_at:(d.report.created_at||''),meal_count:(d.report.metrics&&d.report.metrics.meal_count)||0,metrics:d.report.metrics,report:d.report.report};
  $('memberReport').innerHTML=reportHtml(rep,name);
  loadMembers();
}
async function notifyMember(uid,ym,name){
  if(!confirm(name+'さんに「'+ymLabel(ym)+'のレポートができました」と通知を送ります。よろしいですか？'))return;
  busy(true,'通知中…');
  const d=await api('/notify',{method:'POST',json:{user_id:uid,ym}});
  busy(false);
  showMsg('membersMsg',d.success?(name+'さんへ通知を送りました。'):(d.msg||'通知に失敗しました'),d.success?'info':'error');
}
init();
</script>
</body>
</html>
