<title>マンスリー栄養レポート | CoWell</title>
<style>
  *{box-sizing:border-box}
  body{font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#f5f7fb;margin:0;color:#1f2937}
  .header{background:linear-gradient(135deg,#0d9488,#0ea5a3);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
  .header h1{font-size:18px;margin:0;font-weight:800;flex:1}
  .back{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:12px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700}
  .container{max-width:860px;margin:14px auto;padding:0 12px 48px}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);padding:16px;margin-bottom:14px}
  .card-title{font-size:15px;font-weight:800;margin-bottom:10px;color:#0f766e}
  .nav-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .nav-btn{border:none;border-radius:14px;padding:9px 16px;cursor:pointer;font-weight:800;background:#ccfbf1;color:#0f766e;font-size:13px}
  .nav-btn.active{background:#0d9488;color:#fff}
  .section{display:none}.section.active{display:block}
  label{font-size:12px;font-weight:700;color:#475569}
  select,input{padding:9px 11px;border:1px solid #cbd5e1;border-radius:13px;font-size:14px;background:#fff}
  .btn{border:none;border-radius:13px;padding:10px 16px;cursor:pointer;font-size:14px;font-weight:800;color:#fff;background:#0d9488}
  .btn.sec{background:#6366f1}.btn.gray{background:#7c8797}
  .btn.busy{opacity:.6;pointer-events:none}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .msg{margin-top:10px;padding:10px 12px;border-radius:13px;font-size:13px;display:none;white-space:pre-wrap}
  .msg.info{display:block;background:#f0fdfa;color:#0f766e;border:1px solid #99f6e4}
  .msg.error{display:block;background:#fdeaea;color:#a12a2a;border:1px solid #f2bcbc}
  .rep-sec{margin:14px 0}
  .rep-sec h3{font-size:14px;margin:0 0 6px;color:#0f766e;font-weight:800;border-left:4px solid #0d9488;padding-left:8px}
  .rep-sec p{margin:0;font-size:14px;line-height:1.8;white-space:pre-wrap}
  .warn{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px}
  .warn h3{color:#b45309;border-left-color:#f59e0b}
  .cheer{background:#f0fdfa;border:1px solid #99f6e4;border-radius:14px;padding:12px 14px;font-weight:700;color:#0f766e}
  .nextlist{margin:0;padding-left:0;list-style:none}
  .nextlist li{background:#eef2ff;border:1px solid #c7d2fe;border-radius:13px;padding:9px 12px;margin-bottom:7px;font-size:14px;line-height:1.6;color:#3730a3}
  .nextlist li b{color:#4338ca}
  .bar-row{display:grid;grid-template-columns:84px 1fr auto;gap:8px;align-items:center;margin:5px 0;font-size:12px}
  .bar-track{background:#eef2f7;border-radius:11px;height:16px;position:relative;overflow:hidden}
  .bar-fill{height:100%;border-radius:11px}
  .bar-good{background:#10b981}.bar-warn{background:#f59e0b}.bar-bad{background:#ef4444}
  .bar-val{font-weight:700;white-space:nowrap}
  .chip{display:inline-block;padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800;color:#fff;margin-left:4px}
  .chip-good{background:#10b981}.chip-warn{background:#f59e0b}.chip-bad{background:#ef4444}
  /* 結論1行 + 共通軸ゲージ (2026-07-30・plaza.html と同設計) */
  .nv{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1px solid #e2e8e5}
  .nv-sig{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff;flex:none}
  .nv-tx{min-width:0}
  .nv-hl{font-size:17px;font-weight:900;line-height:1.35;color:#14211c}
  .nv-hl .nv-sub{color:#7b8b84;font-weight:800;font-size:13px}
  .nv-act{font-size:14px;color:#41514a;line-height:1.5;margin-top:2px}
  .ng-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 2px 9px}
  .ng-head b{font-size:13px;font-weight:800;color:#41514a}
  .ng-head span{font-size:11px;color:#8b9a93;white-space:nowrap}
  .ng-rows{display:grid;gap:16px}
  .ng-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
  .ng-name{font-size:17px;font-weight:900;color:#14211c;display:flex;align-items:center;gap:8px;min-width:0}
  .ng-name .ng-ico{font-size:27px;line-height:1.1}
  .ng-val{font-size:14px;font-weight:800;color:#41514a;font-variant-numeric:tabular-nums;white-space:nowrap}
  .ng-val i{font-style:normal;font-weight:600;color:#8b9a93;font-size:12px}
  /* スライダーは短く固定幅。3領域を色で分け、針の位置に過不足%を出す */
  .ng-line2{grid-column:1/-1;display:flex;align-items:center;gap:11px;margin-top:2px}
  .ng-gauge{flex:none;position:relative;width:196px;padding-top:22px}
  .ng-track{display:flex;height:14px;border-radius:4px;overflow:hidden}
  .ng-z{height:100%}
  .ng-z-low{background:#f6dfb4}
  .ng-z-ok{background:#b9e3b9}
  .ng-z-hi{background:#f4c3c1}
  .ng-z-mute{background:#e2e7e2}
  .ng-needle{position:absolute;left:0;top:20px;height:18px;width:4px;margin-left:-2px;border-radius:3px;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.3)}
  .ng-zlbl{display:flex;margin-top:4px}
  .ng-zlbl span{font-size:11px;font-weight:800;text-align:center;line-height:1.2}
  .ng-zlbl .l-low{color:#97640f} .ng-zlbl .l-ok{color:#0a7a0a} .ng-zlbl .l-hi{color:#a32e2e} .ng-zlbl .l-mute{color:#79887f}
  .ng-pt{position:absolute;top:0;font-size:12.5px;font-weight:900;padding:1px 8px;border-radius:999px;background:#fff;border:1.5px solid currentColor;white-space:nowrap;line-height:1.4;font-variant-numeric:tabular-nums}
  .ng-cmt{flex:1;min-width:0;font-size:14px;font-weight:800;line-height:1.35;color:#2b3a33;padding:7px 11px;border-radius:10px;border-left:3px solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ng-oks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:11px;border-top:1px solid #eaefe9}
  .ng-chip{font-size:14px;font-weight:800;color:#41514a;background:rgba(12,163,12,.07);border:1px solid #e2e8e5;border-radius:999px;padding:4px 12px}
  .ng-chip b{color:#0ca30c;font-weight:900}
  .ng-more{margin-top:12px;width:100%;font-family:inherit;font-size:12.5px;font-weight:800;color:#1b4034;background:#fff;border:1px dashed #cfdad4;border-radius:10px;padding:8px 10px;cursor:pointer}
  .ng-more:hover{background:rgba(12,163,12,.06)}
  .ng-tbl{overflow-x:auto;margin-top:8px}
  .ng-tbl table{border-collapse:collapse;width:100%;font-size:12.5px}
  .ng-tbl th,.ng-tbl td{text-align:right;padding:5px 7px;border-bottom:1px solid #eaefe9;white-space:nowrap}
  .ng-tbl th:first-child,.ng-tbl td:first-child{text-align:left}
  .ng-tbl thead th{font-size:11px;color:#8b9a93;font-weight:800}
  .ng-tbl td.n{font-variant-numeric:tabular-nums;font-weight:700}
  .ng-basis{font-size:11.5px;color:#7b8b84;margin-top:10px}
  .meta{font-size:12px;color:#64748b;margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid #e4eaf2;padding:8px;text-align:left}
  th{background:#f7f9fc;font-size:12px}
  .small{font-size:12px;color:#64748b}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:9999}
  .overlay-card{background:#fff;border-radius:14px;padding:22px 26px;text-align:center;min-width:240px}
  .spinner{width:30px;height:30px;border:4px solid #d9e1ec;border-top-color:#0d9488;border-radius:50%;margin:0 auto 10px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hidden{display:none!important}
</style>

<body>
<div class="header">
  <button class="back" onclick="goBack()">← 戻る</button>
  <h1>📊 マンスリー栄養レポート</h1>
</div>
<div class="container">
  <div class="nav-row">
    <button class="nav-btn active" id="navMine" onclick="showSection('mine')">自分のレポート</button>
    <button class="nav-btn hidden" id="navMembers" onclick="showSection('members');loadMembers()">メンバー（見守り）</button>
  </div>

  <div id="sectionMine" class="section active">
    <div class="card">
      <div class="card-title">対象の月</div>
      <div class="row">
        <div style="display:flex;flex-direction:column;gap:5px"><label>月を選ぶ</label><select id="mySel"></select></div>
        <button class="btn" id="btnShowMine" onclick="showMine()">表示</button>
        <button class="btn sec" id="btnGenMine" onclick="genMine()">この月のレポートを作成/更新</button>
      </div>
      <div class="small" style="margin-top:8px">※ その月の食事投稿が <b id="minMeals">10</b> 件以上で作成できます。</div>
      <div id="mineMsg" class="msg"></div>
    </div>
    <div id="mineReport"></div>
  </div>

  <div id="sectionMembers" class="section">
    <div class="card">
      <div class="card-title">メンバーの食事記録（推進メンバー向け）</div>
      <div class="small">本人の健康情報です。見守り・声かけの目的でご利用ください。</div>
      <div id="membersMsg" class="msg"></div>
      <div style="overflow:auto;margin-top:10px"><table><thead><tr><th>氏名</th><th>今月</th><th>先月</th><th>レポート</th><th></th></tr></thead><tbody id="membersBody"><tr><td colspan="5" class="small">読み込み中…</td></tr></tbody></table></div>
    </div>
    <div id="memberReport"></div>
  </div>
</div>
<div id="overlay" class="overlay"><div class="overlay-card"><div class="spinner"></div><div id="overlayText">AIが分析中…（10〜30秒）</div></div></div>

<script>
const token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
if (!token) location.href = '/';
let INIT = null;
function goBack(){ var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||''); if(history.length>1){history.back();}else{location.href=m?'/m':'/';} }
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function busy(on,t){$('overlay').style.display=on?'flex':'none';if(t)$('overlayText').textContent=t;}
function showMsg(id,t,type){const e=$(id);if(!e)return;if(!t){e.className='msg';e.textContent='';return;}e.className='msg '+(type||'info');e.textContent=t;}
async function api(path,opts){
  opts=opts||{};
  const headers=Object.assign({'Authorization':'Bearer '+token},opts.headers||{});
  if(opts.json!==undefined){headers['Content-Type']='application/json';opts.body=JSON.stringify(opts.json);delete opts.json;}
  const r=await fetch('/api/food-report'+path,Object.assign({},opts,{headers}));
  if(r.status===401){location.href='/';return{success:false};}
  return r.json();
}
function showSection(name){
  ['mine','members'].forEach(k=>{$('section'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);$('nav'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===name);});
}
function ymLabel(ym){const p=String(ym).split('-');return p[0]+'年'+Number(p[1])+'月';}

// ===== 栄養: 結論1行 + 共通軸ゲージ (2026-07-30) =====
// 全項目を同じ横軸に載せ、中央 B0〜B1 を「適量帯」として固定する。判定は「●が帯に入っているか」だけ。
// 基準は metrics.targets (本人の体格に合わせた個別目安) を優先し、無い月は一律の参考値を使う。
var B0=36, B1=64;
var NUT_DEF=[
  {k:'kcal',   ico:'🔥',label:'カロリー',  unit:'kcal',type:'range',lo:450,hi:650,tk:'kcal'},
  {k:'protein',ico:'🍖',label:'たんぱく質',unit:'g',   type:'min',  lo:20,        tk:'protein'},
  {k:'fat',    ico:'🧈',label:'脂質',      unit:'g',   type:'range',lo:12,hi:18,  tk:'fat'},
  {k:'carbs',  ico:'🍚',label:'炭水化物',  unit:'g',   type:'range',lo:69,hi:89,  tk:'carbs'},
  {k:'veg',    ico:'🥬',label:'野菜',      unit:'g',   type:'min',  lo:120,       tk:'veg'},
  {k:'ca',     ico:'🦴',label:'カルシウム',unit:'mg',  type:'min',  lo:227,       tk:'ca'},
  {k:'fiber',  ico:'🌾',label:'食物繊維',  unit:'g',   type:'min',  lo:7,         tk:'fiber'},
  {k:'salt',   ico:'🧂',label:'食塩',      unit:'g',   type:'max',        hi:2.5, tk:'salt'}
];
var NG_TAG={in:'適量',plenty:'しっかり',low:'足りない',high:'多い'};
var NG_GLY={in:'✓',plenty:'✓',low:'◀',high:'▶'};
var NG_COL=['#0ca30c','#d98411','#cf3b3b'];
// スライダー右に1行で収める長さにする (全角10文字程度まで)
var NG_HINT={
  kcal:['おにぎり1個ぶん','少し量を減らす'],
  protein:['卵1個か納豆1パック',''],
  fat:['ナッツや魚の脂を少し','揚げ物を半分に'],
  carbs:['ごはんをもう半分','ごはんを一口残す'],
  veg:['野菜をもう1品',''],
  ca:['牛乳かヨーグルト1つ',''],
  fiber:['海藻かきのこを1品',''],
  salt:['','汁物の汁を残す']
};
// コメントの背景は針がある領域の色 (少ない=橙 / 適量=緑 / 過剰=赤)。枠線は重さの色。
var NG_ZBG={low:'#f6dfb4',ok:'#b9e3b9',hi:'#f4c3c1',mute:'#e2e7e2'};
var NG_ZIDX={low:0,in:1,plenty:2,high:2};
// metrics.targets から基準を取る (min/max のあるキーだけ上書き)
function nutBounds(d,tgt){
  var lo=d.lo, hi=d.hi, t=(tgt&&tgt[d.tk])||null;
  if(t){
    if(t.min!=null && d.lo!=null) lo=Math.round(t.min*10)/10;
    if(t.max!=null && d.hi!=null) hi=Math.round(t.max*10)/10;
  }
  return {lo:lo,hi:hi};
}
function nutEval(d,v,tgt){
  var b=nutBounds(d,tgt), lo=b.lo, hi=(d.type==='min')?b.lo*1.5:b.hi;
  var x, dir='in', dev=0;
  if(d.type==='max'){
    if(v<=hi){ x=B1*(hi?v/hi:0); }
    else { dev=(v-hi)/hi; x=B1+(100-B1)*Math.min(1,dev); dir='high'; }
  } else if(v<lo){ dev=lo?(lo-v)/lo:0; x=B0*(lo?v/lo:0); dir='low'; }
  else if(v<=hi){ x=B0+(B1-B0)*((v-lo)/((hi-lo)||1)); }
  else if(d.type==='min'){ x=B1+(100-B1)*Math.min(1,v/(hi||1)-1); dir='plenty'; }
  else { dev=(v-hi)/hi; x=B1+(100-B1)*Math.min(1,dev); dir='high'; }
  var sev=(dir==='low'||dir==='high')?(dev<0.25?1:2):0;
  return {lo:lo,hi:hi,dir:dir,sev:sev,dev:Math.round(dev*100),x:Math.max(2,Math.min(98,x))};
}
function nutTgtText(d,e){
  if(d.type==='range') return e.lo+'〜'+e.hi+d.unit;
  if(d.type==='max')   return e.hi+d.unit+'まで';
  return e.lo+d.unit+'以上';
}
function nutNum(v){ return (v%1===0)?String(v):Number(v).toFixed(1); }
function nutHint(d,e){ return e.sev===0?'':((NG_HINT[d.k]||['',''])[e.dir==='low'?0:1]||''); }
// 3領域のラベルと色。どちら側が問題かは物差しで変わるので、問題にならない側は無彩色にする。
var NG_ZLBL={range:['少ない','適量','多い'],min:['少ない','適量','しっかり'],max:['控えめ','適量','多い']};
var NG_ZCLS={range:['low','ok','hi'],min:['low','ok','mute'],max:['mute','ok','hi']};
var NG_ZW=[B0,B1-B0,100-B1];
function nutRowHtml(r){
  var d=r.d, e=r.e, c=NG_COL[e.sev], z=NG_ZCLS[d.type], zl=NG_ZLBL[d.type];
  var pt=e.sev===0?('✓ '+NG_TAG[e.dir]):((e.dir==='high'?'▲ +':'▼ −')+e.dev+'%');
  // 針が端に寄ったときはバッジを内側に寄せてはみ出しを防ぐ
  var tf=e.x<24?'translateX(0)':(e.x>76?'translateX(-100%)':'translateX(-50%)');
  var cmt=nutHint(d,e), zones='', labels='';
  for(var zi=0;zi<3;zi++){
    zones+='<div class="ng-z ng-z-'+z[zi]+'" style="width:'+NG_ZW[zi]+'%"></div>';
    labels+='<span class="l-'+z[zi]+'" style="width:'+NG_ZW[zi]+'%">'+zl[zi]+'</span>';
  }
  return '<div class="ng-row">'
    +'<div class="ng-name"><span class="ng-ico">'+d.ico+'</span>'+d.label+'</div>'
    +'<div class="ng-val">'+nutNum(r.v)+'<i>'+d.unit+' ／ 目安 '+nutTgtText(d,e)+'</i></div>'
    +'<div class="ng-line2"><div class="ng-gauge">'
      +'<div class="ng-pt" style="left:'+e.x+'%;transform:'+tf+';color:'+c+';">'+pt+'</div>'
      +'<div class="ng-track">'+zones+'</div>'
      +'<div class="ng-needle" style="left:'+e.x+'%;background:'+c+';"></div>'
      +'<div class="ng-zlbl">'+labels+'</div></div>'
    +(cmt?'<div class="ng-cmt" style="background:'+NG_ZBG[z[NG_ZIDX[e.dir]]]+';border-left-color:'+c+';">💡 '+esc(cmt)+'</div>':'')
    +'</div></div>';
}
function ngToggleTable(btn){
  var t=btn.nextElementSibling; if(!t) return;
  var open=t.style.display==='none';
  t.style.display=open?'block':'none';
  btn.textContent=open?'数値を閉じる ▴':'数値で見る ▾';
}
function chartHtml(avg,tgt){
  var rs=NUT_DEF.map(function(d){ var v=Number(avg[d.k]||0); return {d:d,v:v,e:nutEval(d,v,tgt)}; });
  var bad=rs.filter(function(r){return r.e.sev===2;}), warn=rs.filter(function(r){return r.e.sev===1;});
  var worst=bad.concat(warn).sort(function(a,b){return b.e.dev-a.e.dev;})[0];
  var vCls,vSig,vHl;
  if(bad.length){ vCls='#cf3b3b'; vSig='!'; vHl='今月、直したいのは '+bad.length+'つ'+(warn.length?'<span class="nv-sub"> ＋気になる '+warn.length+'つ</span>':''); }
  else if(warn.length){ vCls='#d98411'; vSig='△'; vHl='おしい。気になるのは '+warn.length+'つ'; }
  else { vCls='#0ca30c'; vSig='◎'; vHl='今月はよい食べ方でした'; }
  var vAct=worst?('<b>'+esc(worst.d.label)+'が'+NG_TAG[worst.e.dir]+'</b>'+(nutHint(worst.d,worst.e)?' — '+nutHint(worst.d,worst.e):''))
    :(rs.length+'項目すべて目安の範囲でした。この食べ方を続けられると理想的です。');
  var h='<div class="nv"><div class="nv-sig" style="background:'+vCls+';">'+vSig+'</div>'
    +'<div class="nv-tx"><div class="nv-hl">'+vHl+'</div><div class="nv-act">'+vAct+'</div></div></div>';
  var ng=rs.filter(function(r){return r.e.sev>0;}).sort(function(a,b){return (b.e.sev-a.e.sev)||(b.e.dev-a.e.dev);});
  var ok=rs.filter(function(r){return r.e.sev===0;});
  var LEG='<span>針の位置＝いまの量</span>';
  if(ng.length){
    h+='<div class="ng-head"><b>気になる項目（1食あたりの平均）</b>'+LEG+'</div>';
    h+='<div class="ng-rows">'+ng.map(nutRowHtml).join('')+'</div>';
    if(ok.length){
      h+='<div class="ng-oks"><span class="ng-chip"><b>◎</b> 適量 '+ok.length+'項目</span>'
        +ok.map(function(r){return '<span class="ng-chip">'+r.d.ico+' '+r.d.label+'</span>';}).join('')+'</div>';
    }
  } else {
    h+='<div class="ng-head"><b>すべて適量（1食あたりの平均）</b>'+LEG+'</div>';
    h+='<div class="ng-rows">'+ok.map(nutRowHtml).join('')+'</div>';
  }
  h+='<button type="button" class="ng-more" onclick="ngToggleTable(this)">数値で見る ▾</button>'
    +'<div class="ng-tbl" style="display:none;"><table><thead><tr><th>項目</th><th>1食平均</th><th>目安</th><th>判定</th></tr></thead><tbody>'
    +rs.map(function(r){ return '<tr><td>'+r.d.ico+' '+r.d.label+'</td><td class="n">'+nutNum(r.v)+r.d.unit+'</td>'
      +'<td class="n">'+nutTgtText(r.d,r.e)+'</td><td style="color:'+NG_COL[r.e.sev]+';font-weight:800;">'
      +NG_GLY[r.e.dir]+' '+NG_TAG[r.e.dir]+(r.e.sev===0?'':' '+(r.e.dir==='high'?'+':'−')+r.e.dev+'%')+'</td></tr>'; }).join('')
    +'</tbody></table></div>';
  h+='<div class="ng-basis">'+((tgt&&tgt.personalized)
    ? '目安は<b>あなたの体格に合わせた個別の値</b>です（マイページの「からだの情報」から算出）。'
    : '目安は一般の参考値です。マイページの「からだの情報」を入れると、あなたの体格に合わせた目安に切り替わります。')
    +'</div>';
  return h;
}
function reportHtml(data, name){
  const r=data.report||{}, m=data.metrics||{}, avg=m.avg||{}, c=m.counts||{};
  const next=(Array.isArray(r.next_month)?r.next_month:[]).map(x=>'<li>'+esc(x)+'</li>').join('');
  const alcStat='<div class="meta">飲酒した日 '+(c.alcohol_days||0)+'日／記録'+(m.days_logged||0)+'日中　飲酒した食事 '+(c.alcohol_meals||0)+'件　純アルコール 約'+(c.alcohol_total_g||0)+'g（飲酒日あたり平均 約'+(c.alcohol_per_drink_day||0)+'g/日・目安は20g/日まで・週2日は休肝日）</div>';
  return '<div class="card">'
    +'<div class="card-title">'+esc(name?name+'さんの':'')+ymLabel(data.ym)+' のレポート</div>'
    +'<div class="meta">食事記録 '+(m.meal_count||0)+'件 / '+(m.days_logged||0)+'日　作成日 '+esc((data.created_at||'').slice(0,10))+'</div>'
    +'<div class="rep-sec"><h3>今月のまとめ</h3><p>'+esc(r.summary||'')+'</p></div>'
    +'<div class="rep-sec"><h3>栄養バランス（1食あたり平均）</h3>'+chartHtml(avg,m.targets)+'</div>'
    +'<div class="rep-sec"><h3>栄養分析</h3><p>'+esc(r.nutrition_analysis||'')+'</p></div>'
    +'<div class="rep-sec"><h3>🍶 飲酒（お酒）について</h3>'+alcStat+'<p>'+esc(r.alcohol||'')+'</p></div>'
    +'<div class="rep-sec"><h3>あなたの食習慣の傾向</h3><p>'+esc(r.tendencies||'')+'</p></div>'
    +'<div class="rep-sec"><h3>来月、心がけたいこと</h3><ul class="nextlist">'+next+'</ul></div>'
    +'<div class="rep-sec warn"><h3>⚠️ このまま続くと…（将来への注意）</h3><p>'+esc(r.future_warning||'')+'</p></div>'
    +'<div class="rep-sec cheer">'+esc(r.cheer||'')+'</div>'
    +'</div>';
}

async function init(){
  const d=await api('/init');
  if(!d.success){showMsg('mineMsg','初期化に失敗しました','error');return;}
  INIT=d;
  $('minMeals').textContent=d.min_meals;
  const sel=$('mySel');sel.innerHTML='';
  (d.my_months||[]).forEach(mm=>{const o=document.createElement('option');o.value=mm.ym;o.textContent=ymLabel(mm.ym)+'（'+mm.n+'件）'+((d.my_reports||[]).includes(mm.ym)?' ✓作成済':'');sel.appendChild(o);});
  if(!sel.options.length){const o=document.createElement('option');o.value='';o.textContent='食事の記録がまだありません';sel.appendChild(o);}
  if(d.me.is_promoter)$('navMembers').classList.remove('hidden');
  // 最新の作成済みレポートがあれば表示
  if((d.my_reports||[]).length){sel.value=d.my_reports[0];showMine();}
}
async function showMine(){
  const ym=$('mySel').value;if(!ym){showMsg('mineMsg','対象の月がありません','error');return;}
  showMsg('mineMsg','');$('mineReport').innerHTML='';
  busy(true,'読み込み中…');
  const d=await api('/get?ym='+encodeURIComponent(ym));
  busy(false);
  if(!d.success){showMsg('mineMsg','この月のレポートはまだありません。「作成/更新」を押してください。','info');return;}
  $('mineReport').innerHTML=reportHtml(d.report,'');
}
async function genMine(){
  const ym=$('mySel').value;if(!ym){showMsg('mineMsg','対象の月がありません','error');return;}
  busy(true,'AIが分析中…（10〜30秒）');
  const d=await api('/generate',{method:'POST',json:{ym}});
  busy(false);
  if(!d.success){showMsg('mineMsg',d.msg||'作成に失敗しました','error');return;}
  showMsg('mineMsg','レポートを作成しました。','info');
  const out=d.report;  // {id, metrics, report}
  const rep={ym:ym,created_at:'',meal_count:(out.metrics&&out.metrics.meal_count)||0,metrics:out.metrics,report:out.report};
  $('mineReport').innerHTML=reportHtml(rep,'');
  init();
}

// ===== メンバー (推進) =====
async function loadMembers(){
  const tb=$('membersBody');tb.innerHTML='<tr><td colspan="5" class="small">読み込み中…</td></tr>';
  const d=await api('/members');
  if(!d.success){tb.innerHTML='<tr><td colspan="5" class="small">取得失敗</td></tr>';return;}
  if(!d.items.length){tb.innerHTML='<tr><td colspan="5" class="small">対象メンバーがいません。</td></tr>';return;}
  tb.innerHTML=d.items.map(it=>{
    const has=(it.reports||[]).length;
    return '<tr><td>'+esc(it.name)+'</td><td>'+it.this_month+'件</td><td>'+it.last_month+'件</td>'
      +'<td>'+(has?'<span class="small">'+it.reports.map(ymLabel).join('・')+'</span>':'<span class="small">未作成</span>')+'</td>'
      +'<td style="white-space:nowrap">'
      +'<button class="btn sec btn-sm" onclick="genMember(\''+it.uid+'\',\''+d.last_ym+'\',\''+esc(it.name)+'\')">先月分を作成</button> '
      +'<button class="btn gray btn-sm" onclick="genMember(\''+it.uid+'\',\''+d.this_ym+'\',\''+esc(it.name)+'\')">今月分を作成</button>'
      +(has?' <button class="btn btn-sm" onclick="viewMember(\''+it.uid+'\',\''+it.reports[0]+'\',\''+esc(it.name)+'\')">最新を表示</button>':'')
      +(has?' <button class="btn btn-sm" style="background:#0891b2" onclick="notifyMember(\''+it.uid+'\',\''+it.reports[0]+'\',\''+esc(it.name)+'\')">本人へ通知</button>':'')
      +'</td></tr>';
  }).join('');
}
async function viewMember(uid,ym,name){
  showMsg('membersMsg','');$('memberReport').innerHTML='';
  busy(true,'読み込み中…');
  const d=await api('/get?user_id='+encodeURIComponent(uid)+'&ym='+encodeURIComponent(ym));
  busy(false);
  if(!d.success){showMsg('membersMsg',d.msg||'未作成','error');return;}
  $('memberReport').innerHTML=reportHtml(d.report,name);
}
async function genMember(uid,ym,name){
  busy(true,'AIが分析中…（10〜30秒）');
  const d=await api('/generate',{method:'POST',json:{user_id:uid,ym}});
  busy(false);
  if(!d.success){showMsg('membersMsg',name+'さん「'+ymLabel(ym)+'」: '+(d.msg||'作成に失敗'),'error');return;}
  showMsg('membersMsg',name+'さんの'+ymLabel(ym)+'レポートを作成しました。','info');
  const rep={ym:ym,created_at:(d.report.created_at||''),meal_count:(d.report.metrics&&d.report.metrics.meal_count)||0,metrics:d.report.metrics,report:d.report.report};
  $('memberReport').innerHTML=reportHtml(rep,name);
  loadMembers();
}
async function notifyMember(uid,ym,name){
  if(!confirm(name+'さんに「'+ymLabel(ym)+'のレポートができました」と通知を送ります。よろしいですか？'))return;
  busy(true,'通知中…');
  const d=await api('/notify',{method:'POST',json:{user_id:uid,ym}});
  busy(false);
  showMsg('membersMsg',d.success?(name+'さんへ通知を送りました。'):(d.msg||'通知に失敗しました'),d.success?'info':'error');
}
init();
</script>
