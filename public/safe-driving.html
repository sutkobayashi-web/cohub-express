<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🚚 安全運転レポート — CoWell</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body { font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }
header { position: sticky; top: 0; z-index: 30; background: linear-gradient(135deg, #0284c7, #0369a1); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.12); }
header h1 { margin: 0; font-size: 16px; font-weight: 800; }
header .spacer { flex: 1; }
header select, header button { background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.5); color: #fff; padding: 6px 12px; border-radius: 16px; font-size: 12px; font-weight: 700; cursor: pointer; }
header select option { color: #0f172a; }
main { max-width: 880px; margin: 0 auto; padding: 14px 12px 60px; }

.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
.kpi { background: #fff; border-radius: 14px; padding: 12px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); text-align: center; }
.kpi .v { font-size: 22px; font-weight: 900; line-height: 1.1; }
.kpi .l { font-size: 10.5px; color: #64748b; font-weight: 700; margin-top: 3px; }
.kpi.rate .v { color: #059669; } .kpi.viol .v { color: #dc2626; }
@media (max-width: 560px) { .cards { grid-template-columns: repeat(2, 1fr); } }

.sec { background: #fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(15,23,42,0.06); margin-bottom: 14px; }
.sec h2 { font-size: 14px; margin: 0 0 10px; color: #1e3a8a; display: flex; align-items: center; gap: 6px; }
.breakdown { font-size: 12px; color: #475569; margin-top: 6px; }
.chip { display: inline-block; background: #fee2e2; color: #b91c1c; border-radius: 10px; padding: 1px 9px; font-size: 11px; font-weight: 800; margin: 2px 4px 2px 0; }
.chip.ok { background: #dcfce7; color: #15803d; }

.viol-card { border: 1px solid #fecaca; background: #fff5f5; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.viol-card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.viol-card .nm { font-weight: 800; font-size: 14px; }
.viol-card .of { font-size: 11px; color: #64748b; }
.viol-card .sc { margin-left: auto; font-weight: 900; color: #dc2626; }
.viol-card .vt { background: #dc2626; color: #fff; border-radius: 8px; padding: 1px 8px; font-size: 11px; font-weight: 800; }
.viol-card .det { font-size: 12px; color: #475569; margin-top: 5px; }
.hidden-note { font-size: 12px; color: #94a3b8; padding: 8px; text-align: center; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.tab { font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 14px; border: 1px solid #cbd5e1; background: #fff; color: #475569; cursor: pointer; }
.tab.active { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }

table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #eef2f7; white-space: nowrap; }
th { color: #64748b; font-size: 11px; font-weight: 700; position: sticky; top: 52px; background: #fff; }
td.r, th.r { text-align: right; }
tr.viol td { background: #fff5f5; }
tr.top1 .rk { color: #b45309; } tr.top2 .rk, tr.top3 .rk { color: #64748b; }
.rk { font-weight: 800; }
.medal { font-size: 13px; }
.up { color: #059669; font-weight: 800; } .down { color: #dc2626; font-weight: 800; } .same { color: #94a3b8; } .new { color: #2563eb; font-weight: 800; font-size: 10px; }
.sc100 { color: #059669; font-weight: 700; } .sclow { color: #dc2626; font-weight: 800; }

.trend-wrap { position: relative; margin-top: 6px; padding: 16px 0 2px 34px; }
.trend-ax { position: absolute; left: 0; top: 16px; bottom: 22px; width: 34px; }
.trend-ax .t { position: absolute; right: 6px; font-size: 9px; color: #cbd5e1; transform: translateY(-50%); }
.trend-grid { position: absolute; left: 34px; right: 0; top: 16px; bottom: 22px; pointer-events: none; }
.trend-grid i { position: absolute; left: 0; right: 0; border-top: 1px dashed #eef2f7; }
.trend-grid i.base { border-top: 1px solid #cbd5e1; }
.trend { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 120px; }
.trend .col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.trend .bar { width: 100%; max-width: 24px; background: linear-gradient(180deg,#34d399,#059669); border-radius: 3px 3px 0 0; position: relative; min-height: 2px; }
.trend .bar.hasv { background: linear-gradient(180deg,#fbbf24,#d97706); }
.trend .bar .pv { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 8px; font-weight: 800; color: #475569; white-space: nowrap; }
.trend .dt { font-size: 8px; color: #94a3b8; margin-top: 4px; white-space: nowrap; }
.trend-leg { display: flex; gap: 12px; font-size: 10px; color: #94a3b8; margin-top: 8px; padding-left: 34px; }
.trend-leg b { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; }
.trend-leg .g b { background: #059669; } .trend-leg .v b { background: #d97706; }

.upload-panel { background: #fff; border: 1px dashed #93c5fd; border-radius: 14px; padding: 14px; margin-bottom: 14px; }
.upload-panel h3 { margin: 0 0 4px; font-size: 14px; color: #1e3a8a; }
.upload-panel .hint { font-size: 11px; color: #94a3b8; margin: 0 0 10px; }
.upload-panel label { display: block; font-size: 11px; font-weight: 700; color: #475569; margin: 8px 0 4px; }
.upload-panel input { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; font-family: inherit; }
.upload-panel .btn-up { margin-top: 12px; background: linear-gradient(135deg,#1e3a8a,#0891b2); color: #fff; border: none; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 14px; width: 100%; cursor: pointer; }
.upload-panel .btn-up:disabled { opacity: 0.5; }
.dist-bar { margin: 0 0 14px; }
.btn-dist { width: 100%; padding: 12px; border: none; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; background: linear-gradient(135deg,#dc2626,#f97316); color: #fff; }
.btn-dist.done { background: linear-gradient(135deg,#0891b2,#0ea5e9); }
.btn-dist:disabled { opacity: 0.5; }
.dist-note { font-size: 11px; color: #94a3b8; margin-top: 5px; text-align: center; }
.up-msg { font-size: 12px; font-weight: 700; margin-top: 8px; min-height: 16px; }

.gate, .empty { max-width: 460px; margin: 70px auto; background: #fff; border-radius: 14px; padding: 26px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.gate h2 { color: #b45309; } .empty h2 { color: #1e3a8a; }
.foot { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 18px; }
.cal-panel { background:#fff; border-radius:14px; padding:14px; box-shadow:0 2px 10px rgba(15,23,42,0.06); margin-bottom:14px; }
.cal-nav { background:#1e3a8a; color:#fff; border:none; border-radius:8px; width:34px; height:30px; font-size:14px; cursor:pointer; }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-dow { text-align:center; font-size:11px; font-weight:700; color:#64748b; padding:2px 0; }
.cal-dow.sun { color:#dc2626; } .cal-dow.sat { color:#2563eb; }
.cal-day { min-height:46px; border-radius:8px; padding:3px; position:relative; background:#f8fafc; }
.cal-day .cd { font-size:11px; color:#94a3b8; }
.cal-day.has { background:#ecfdf5; border:1px solid #a7f3d0; cursor:pointer; }
.cal-day.has .cd { color:#0f172a; font-weight:700; }
.cal-day.has:hover { background:#d1fae5; }
.cal-day.has.sel { background:#1e3a8a; border-color:#1e3a8a; }
.cal-day.has.sel .cd, .cal-day.has.sel .cr { color:#fff; }
.cal-day .cr { display:block; font-size:10px; font-weight:800; color:#059669; line-height:1.1; margin-top:2px; }
.cal-day .cv { position:absolute; top:2px; right:3px; background:#dc2626; color:#fff; font-size:9px; font-weight:800; border-radius:8px; padding:0 5px; }
</style>
</head>
<body>
<header>
  <h1>🚚 安全運転レポート</h1>
  <div class="spacer"></div>
  <button id="cal-btn" onclick="toggleCal()" title="カレンダーで過去データを見る" style="display:none;">📅 カレンダー</button>
  <select id="date-sel" onchange="loadReport(this.value)" style="display:none;"></select>
  <button onclick="goBack()">✕</button>
</header>
<main>
  <div id="gate" class="gate" style="display:none;"><h2>⛔ ログインが必要です</h2><p>トップからログインしてください。</p></div>
  <div id="app" style="display:none;">
    <div id="upload-panel" class="upload-panel" style="display:none;">
      <h3>＋ 日次データをアップロード（須貝さん／管理職・運行管理者）</h3>
      <p class="hint">「個人別安全運転順位表（CSV）」と「違反指導書（PDF）」をアップすると、安全運転集計を自動生成します。</p>
      <label>対象日</label><input type="date" id="up-date">
      <label>① 個人別安全運転順位表（CSV・必須）</label><input type="file" id="up-csv" accept=".csv,text/csv">
      <label>② 違反指導書（PDF・任意。違反があれば）</label><input type="file" id="up-pdf" accept="application/pdf,.pdf">
      <button class="btn-up" id="up-btn" onclick="doUpload()">📤 集計を作成する</button>
      <div class="up-msg" id="up-msg"></div>
    </div>

    <div id="cal-panel" class="cal-panel" style="display:none;"></div>
    <div id="report"></div>
    <div class="foot">須貝さんが毎日アップロード。順位は全社員、違反の詳細は管理職・運行管理者のみ表示されます。</div>
  </div>
</main>
<script>
let token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
let canEdit = false, curOffice = 'all', curData = null;
function goBack(){ if(history.length>1&&document.referrer&&document.referrer.includes(location.host)) history.back(); else location.href='/'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function arrow(rank, prev){
  if(prev==null) return '<span class="new">NEW</span>';
  if(prev>rank) return '<span class="up">▲'+(prev-rank)+'</span>';
  if(prev<rank) return '<span class="down">▼'+(rank-prev)+'</span>';
  return '<span class="same">→</span>';
}
const VLABEL = { '速度超過':'速度超過','エンジン回転オーバー':'エンジン回転','急加速':'急加速','急減速':'急減速','急旋回':'急旋回','アイドリング':'アイドリング','長時間運転':'長時間運転' };

async function loadDates(){
  const r = await fetch('/api/safe-driving/list',{headers:{Authorization:'Bearer '+token}});
  const j = await r.json(); if(!j.success) return;
  canEdit = !!j.can_edit;
  document.getElementById('upload-panel').style.display = canEdit ? 'block' : 'none';
  const sel = document.getElementById('date-sel');
  window._dateMap = {};
  (j.dates||[]).forEach(d=>{ window._dateMap[d.date]=d; });
  if(j.dates && j.dates.length){
    sel.style.display=''; sel.innerHTML = j.dates.map(d=>`<option value="${d.date}">${d.date}（達成${d.rate!=null?d.rate+'%':'-'}・違反${d.violationCount||0}）</option>`).join('');
    document.getElementById('cal-btn').style.display='';
    const lt=j.dates[0].date.split('-'); if(!window._calYM) window._calYM={y:+lt[0],m:+lt[1]-1};
  }
  window._dates = (j.dates||[]).slice().reverse(); // 古→新 for trend
  if(document.getElementById('cal-panel').style.display!=='none') renderCalendar();
  loadReport('');
}

async function loadReport(date){
  const r = await fetch('/api/safe-driving/report'+(date?('?date='+encodeURIComponent(date)):''),{headers:{Authorization:'Bearer '+token}});
  const j = await r.json();
  const box = document.getElementById('report');
  if(!j.success){ box.innerHTML='<div class="empty"><h2>読み込みに失敗しました</h2></div>'; return; }
  canEdit = !!j.can_edit;
  if(j.empty){ box.innerHTML='<div class="empty"><h2>📭 まだデータがありません</h2><p>'+(canEdit?'上のフォームからCSV・PDFをアップロードしてください。':'担当者のアップロードをお待ちください。')+'</p></div>'; return; }
  curData = j; curOffice='all'; window._curDate = j.date;
  const sel=document.getElementById('date-sel'); if(sel && j.date) sel.value=j.date;
  if(document.getElementById('cal-panel').style.display!=='none') renderCalendar();
  render(j);
}

function render(j){
  const d = j.data, s = d.summary || {};
  const offices = [...new Set((d.drivers||[]).map(x=>x.office).filter(Boolean))];
  let h = '';
  // KPI
  h += '<div class="cards">'
    + '<div class="kpi"><div class="v">'+esc(j.date)+'</div><div class="l">対象日</div></div>'
    + '<div class="kpi"><div class="v">'+(s.total||0)+'</div><div class="l">運行ドライバー</div></div>'
    + '<div class="kpi rate"><div class="v">'+(s.rate!=null?s.rate+'%':'-')+'</div><div class="l">安全運転達成率<br>('+(s.perfect||0)+'/'+(s.total||0)+'名)</div></div>'
    + '<div class="kpi viol"><div class="v">'+(s.violationCount||0)+'</div><div class="l">違反件数</div></div>'
    + '</div>';
  // 配信ボタン (管理職・運行管理者のみ): 運行・品質管理メンバー全員へDM
  if(j.can_edit){
    const done = !!j.distributed_at;
    h += '<div class="dist-bar">'
      + '<button id="dist-btn" class="btn-dist'+(done?' done':'')+'" onclick="distribute()">'+(done?'✅ 配信済み（もう一度配信）':'📣 運行・品質管理グループに配信')+'</button>'
      + '<div class="dist-note">'+(done?'最終配信: '+esc(String(j.distributed_at).replace('T',' ').slice(0,16))+'（UTC）':'押すと運行・品質管理グループのチャットに要約を投稿します（全員に通知）')+'</div>'
      + '</div>';
  }
  // 内訳
  const bt = s.byType||{};
  let chips = Object.keys(bt).length ? Object.entries(bt).map(([k,n])=>'<span class="chip">'+esc(VLABEL[k]||k)+' '+n+'</span>').join('') : '<span class="chip ok">違反なし 👍</span>';
  h += '<div class="sec"><h2>📋 違反内訳</h2><div class="breakdown">'+chips+'</div></div>';

  // トレンド
  if(window._dates && window._dates.length>1){
    const days = window._dates.slice(-21);
    const grid = '<div class="trend-grid"><i class="base" style="top:0"></i><i style="top:50%"></i><i class="base" style="bottom:0"></i></div>';
    const axis = '<div class="trend-ax"><span class="t" style="top:2px">100%</span><span class="t" style="top:50%">50</span><span class="t" style="bottom:0px">0</span></div>';
    const bars = days.map(x=>{
      const r = x.rate!=null ? x.rate : 0;
      const hh = Math.max(2, Math.round(r/100*120));
      const v = (x.violationCount||0) > 0;
      const tip = x.date+' '+r+'%'+(v?'・違反'+x.violationCount+'件':'');
      return '<div class="col"><div class="bar'+(v?' hasv':'')+'" style="height:'+hh+'px" title="'+tip+'"><span class="pv">'+r+'</span></div><div class="dt">'+x.date.slice(5)+'</div></div>';
    }).join('');
    h += '<div class="sec"><h2>📈 安全運転達成率の推移</h2>'
      + '<div class="trend-wrap">'+axis+grid+'<div class="trend">'+bars+'</div></div>'
      + '<div class="trend-leg"><span class="g"><b></b>違反なし</span><span class="v"><b></b>違反あり</span></div>'
      + '</div>';
  }

  // 違反者(要指導)
  if(d.violations_hidden){
    h += '<div class="sec"><h2>⚠️ 本日の違反</h2><div class="hidden-note">違反の詳細（氏名・地点・種別）は管理職・運行管理者のみ表示されます。</div></div>';
  } else if(d.violations && d.violations.length){
    h += '<div class="sec"><h2>⚠️ 本日の違反（要指導）</h2>';
    h += d.violations.map(v=>{
      const types = Object.entries(v.types||{}).map(([k,n])=>'<span class="vt">'+esc(VLABEL[k]||k)+(n>1?'×'+n:'')+'</span>').join(' ');
      const det = (v.details||[]).map(x=>esc((x.road?x.road+' ':'')+(x.place||'')+(x.time?'　'+x.time:''))).join('<br>');
      return '<div class="viol-card"><div class="top"><span class="nm">'+esc(v.name)+'</span><span class="of">'+esc(v.office)+'</span>'+types+'<span class="sc">'+(v.score!=null?v.score+'点':'')+(v.rank?' / '+v.rank+'位':'')+'</span></div>'+(det?'<div class="det">'+det+'</div>':'')+'</div>';
    }).join('');
    h += '</div>';
  } else {
    h += '<div class="sec"><h2>✅ 本日の違反</h2><div class="hidden-note">違反はありません。全員が安全運転でした。</div></div>';
  }

  // ランキング
  h += '<div class="sec"><h2>🏆 安全運転ランキング</h2>'
    + '<div style="font-size:11px;color:#94a3b8;margin:-4px 0 8px;">順位＝①得点 ②稼働時間 ③走行距離 の順。<span style="color:#dc2626;font-weight:700;">稼働15時間以上は赤 ⚠</span></div>'
    + '<div class="tabs" id="tabs">'
    + '<span class="tab'+(curOffice==='all'?' active':'')+'" onclick="setOffice(\'all\')">全社</span>'
    + offices.map(o=>'<span class="tab'+(curOffice===o?' active':'')+'" onclick="setOffice(\''+esc(o)+'\')">'+esc(o)+'</span>').join('')
    + '</div><div id="rank-table"></div></div>';

  document.getElementById('report').innerHTML = h;
  renderTable();
}

function setOffice(o){ curOffice=o; render(curData); }

async function distribute(){
  const date = window._curDate; if(!date) return;
  const done = !!(curData && curData.distributed_at);
  if(!confirm((done?'再配信します。':'運行・品質管理グループのチャットに要約を投稿します（全員に通知）。')+'\n対象日: '+date+'\nよろしいですか？')) return;
  const btn=document.getElementById('dist-btn'); if(btn){ btn.disabled=true; btn.textContent='配信中…'; }
  try{
    const r=await fetch('/api/safe-driving/distribute',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({date})});
    const j=await r.json();
    if(j.success){ alert('✅ '+j.count+'名へ配信しました'); loadReport(date); }
    else { alert(j.msg||'配信に失敗しました'); if(btn){ btn.disabled=false; } }
  }catch(e){ alert('通信エラー'); if(btn){ btn.disabled=false; } }
}

function renderTable(){
  const d = curData.data;
  let rows = (d.drivers||[]).slice().sort((a,b)=>(a.rank||999)-(b.rank||999));
  if(curOffice!=='all') rows = rows.filter(x=>x.office===curOffice);
  let h = '<table><thead><tr><th>順位</th><th>前回</th><th>氏名</th><th>営業所</th><th class="r">得点</th><th class="r">距離</th><th class="r">時間</th></tr></thead><tbody>';
  h += rows.map((x,i)=>{
    const medal = x.rank===1?'🥇':x.rank===2?'🥈':x.rank===3?'🥉':'';
    const low = x.score<100;
    return '<tr class="'+(low?'viol ':'')+(x.rank<=3?('top'+x.rank):'')+'">'
      + '<td class="rk">'+(medal?'<span class="medal">'+medal+'</span> ':'')+(x.rank||'-')+'</td>'
      + '<td>'+arrow(x.rank,x.prevRank)+'</td>'
      + '<td>'+esc(x.name)+'</td>'
      + '<td style="font-size:11px;color:#64748b;">'+esc(x.office)+'</td>'
      + '<td class="r '+(low?'sclow':'sc100')+'">'+x.score+'</td>'
      + '<td class="r">'+(x.distance?x.distance.toFixed(0)+'km':'-')+'</td>'
      + '<td class="r"'+(x.longHours?' style="color:#dc2626;font-weight:800;"':'')+'>'+esc(x.time||'-')+(x.longHours?' ⚠':'')+'</td></tr>';
  }).join('');
  h += '</tbody></table>';
  document.getElementById('rank-table').innerHTML = h;
}

function toggleCal(){
  const p=document.getElementById('cal-panel');
  if(p.style.display==='none'){ p.style.display='block'; renderCalendar(); } else { p.style.display='none'; }
}
function calNav(delta){
  const ym=window._calYM||{y:new Date().getFullYear(),m:new Date().getMonth()};
  let y=ym.y, m=ym.m+delta; if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  window._calYM={y,m}; renderCalendar();
}
function renderCalendar(){
  const panel=document.getElementById('cal-panel'); if(!panel) return;
  const ym=window._calYM||{y:new Date().getFullYear(),m:new Date().getMonth()};
  const y=ym.y, m=ym.m, map=window._dateMap||{};
  const startDow=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  let h='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    +'<button class="cal-nav" onclick="calNav(-1)">◀</button>'
    +'<b style="font-size:14px;color:#1e3a8a;">'+y+'年 '+(m+1)+'月</b>'
    +'<button class="cal-nav" onclick="calNav(1)">▶</button></div><div class="cal-grid">';
  ['日','月','火','水','木','金','土'].forEach((w,i)=>{ h+='<div class="cal-dow'+(i===0?' sun':i===6?' sat':'')+'">'+w+'</div>'; });
  for(let i=0;i<startDow;i++) h+='<div></div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const sm=map[ds];
    if(sm){
      const sel=(window._curDate===ds)?' sel':''; const vc=sm.violationCount||0;
      h+='<div class="cal-day has'+sel+'" onclick="loadReport(\''+ds+'\')" title="達成'+(sm.rate!=null?sm.rate+'%':'-')+'・違反'+vc+'件">'
        +'<span class="cd">'+d+'</span>'+(vc>0?'<span class="cv">'+vc+'</span>':'')
        +'<span class="cr">'+(sm.rate!=null?sm.rate+'%':'')+'</span></div>';
    } else { h+='<div class="cal-day"><span class="cd">'+d+'</span></div>'; }
  }
  panel.innerHTML=h+'</div>';
}

async function doUpload(){
  const msg=document.getElementById('up-msg'); const csv=document.getElementById('up-csv').files[0]; const pdf=document.getElementById('up-pdf').files[0]; const date=document.getElementById('up-date').value;
  if(!csv){ msg.style.color='#dc2626'; msg.textContent='順位表CSVを選択してください'; return; }
  if(!date){ msg.style.color='#dc2626'; msg.textContent='対象日を選択してください'; return; }
  const fd=new FormData(); fd.append('report_date',date); fd.append('csv',csv); if(pdf) fd.append('pdf',pdf);
  const btn=document.getElementById('up-btn'); btn.disabled=true; msg.style.color='#64748b'; msg.textContent='解析中...';
  try{
    const r=await fetch('/api/safe-driving/upload',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
    const j=await r.json();
    if(!j.success){ msg.style.color='#dc2626'; msg.textContent=j.msg||'失敗しました'; btn.disabled=false; return; }
    msg.style.color='#059669'; msg.textContent='✅ '+j.date+' の集計を作成しました（達成率'+(j.summary.rate)+'%・違反'+j.summary.violationCount+'件）';
    document.getElementById('up-csv').value=''; document.getElementById('up-pdf').value=''; btn.disabled=false;
    loadDates();
  }catch(e){ msg.style.color='#dc2626'; msg.textContent='通信エラー'; btn.disabled=false; }
}

(async function init(){
  if(!token){ document.getElementById('gate').style.display='block'; return; }
  try{
    const r=await fetch('/api/auth/me',{headers:{Authorization:'Bearer '+token}}); const j=await r.json();
    if(!j.success||!j.user){ document.getElementById('gate').style.display='block'; return; }
    document.getElementById('app').style.display='block';
    const t=new Date(); const y=t.getFullYear(),m=String(t.getMonth()+1).padStart(2,'0'),da=String(t.getDate()).padStart(2,'0');
    document.getElementById('up-date').value=y+'-'+m+'-'+da;
    loadDates();
  }catch(e){ document.getElementById('gate').style.display='block'; }
})();
</script>
