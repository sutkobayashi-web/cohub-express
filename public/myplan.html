<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>今日の一歩、明日の自分 — CoWell</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<meta name="theme-color" content="#3b82f6">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-min-height: 100vh; overscroll-behavior: contain; overflow-x: hidden; max-width: 100%; }
body { font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: linear-gradient(180deg,#eff6ff,#f0f9ff); color: #0f172a; padding-bottom: 40px; }
header { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg,#3b82f6,#1e3a8a); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
header h1 { margin: 0; font-size: 16px; font-weight: 800; }
header .close { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 14px; }

/* 挨拶 */
.advisor { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(59,130,246,0.08); }
.advisor img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(59,130,246,0.18); flex-shrink: 0; background: #fff; }
.advisor-text { flex: 1; }
.advisor-name { font-weight: 800; font-size: 14px; color: #1e3a8a; }
.advisor-msg { font-size: 12.5px; color: #475569; margin-top: 4px; line-height: 1.6; }

/* 現在のプラン */
.cur-plan { background: linear-gradient(135deg,#fef3c7,#fde68a); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 3px 12px rgba(245,158,11,0.15); }
.cur-head { display: flex; align-items: flex-start; gap: 12px; }
.cur-icon { font-size: 36px; line-height: 1; flex-shrink: 0; }
.cur-title { font-size: 17px; font-weight: 800; color: #78350f; line-height: 1.3; }
.cur-cat { font-size: 11px; color: #92400e; margin-top: 2px; font-weight: 700; }
.cur-action { background: #fff; border-radius: 10px; padding: 10px 12px; margin-top: 10px; font-size: 13.5px; color: #78350f; line-height: 1.6; font-weight: 600; }

.cur-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.cur-stat { background: rgba(255,255,255,0.7); border-radius: 10px; padding: 8px 6px; text-align: center; }
.cur-stat .v { font-size: 22px; font-weight: 900; color: #78350f; line-height: 1; }
.cur-stat .l { font-size: 10px; color: #92400e; margin-top: 4px; font-weight: 700; }

/* 進捗バー */
.cur-progress { margin-top: 12px; }
.cur-progress .bar { height: 8px; background: rgba(255,255,255,0.6); border-radius: 4px; overflow: hidden; }
.cur-progress .fill { height: 100%; background: linear-gradient(90deg,#f59e0b,#d97706); border-radius: 4px; transition: width 0.4s ease; }
.cur-progress .lbl { font-size: 11px; color: #78350f; margin-top: 4px; text-align: right; font-weight: 700; }

/* 今日の記録 */
.today-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.today-head { font-size: 14px; font-weight: 800; color: #1e3a8a; margin-bottom: 10px; }
.today-head .today-date { font-size: 11px; color: #64748b; font-weight: 600; margin-left: 8px; }
.status-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
.status-btn { padding: 14px 4px; border-radius: 10px; border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.status-btn .ic { font-size: 24px; line-height: 1; }
.status-btn .lb { font-size: 11px; font-weight: 700; color: #475569; }
.status-btn.sel { background: linear-gradient(135deg,#dbeafe,#bfdbfe); border-color: #1e40af; box-shadow: 0 2px 6px rgba(59,130,246,0.25); }
.status-btn.sel .lb { color: #1e3a8a; }
.status-btn[data-key="done"].sel { background: linear-gradient(135deg,#dcfce7,#bbf7d0); border-color: #15803d; }
.status-btn[data-key="done"].sel .lb { color: #166534; }
.status-btn[data-key="partial"].sel { background: linear-gradient(135deg,#fef3c7,#fde68a); border-color: #b45309; }
.status-btn[data-key="partial"].sel .lb { color: #78350f; }
.status-btn[data-key="miss"].sel { background: linear-gradient(135deg,#fee2e2,#fecaca); border-color: #b91c1c; }
.status-btn[data-key="miss"].sel .lb { color: #991b1b; }
.status-btn[data-key="rest"].sel { background: linear-gradient(135deg,#ede9fe,#ddd6fe); border-color: #6d28d9; }
.status-btn[data-key="rest"].sel .lb { color: #5b21b6; }
.cmt-row { display: flex; gap: 6px; }
.cmt-row input { flex: 1; padding: 10px 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; font-size: 13.5px; outline: none; }
.cmt-row input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
.btn-record { padding: 11px 18px; background: linear-gradient(135deg,#3b82f6,#1e40af); color: #fff; border: none; border-radius: 10px; font-size: 13.5px; font-weight: 800; cursor: pointer; box-shadow: 0 2px 6px rgba(59,130,246,0.3); }
.btn-record:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }

/* AI返答 */
.ai-reply { background: linear-gradient(135deg,#eff6ff,#dbeafe); border-left: 4px solid #3b82f6; border-radius: 8px; padding: 12px 14px; margin-top: 12px; font-size: 13px; line-height: 1.7; color: #1e3a8a; white-space: pre-wrap; word-wrap: break-word; display: none; }
.ai-reply.show { display: block; animation: slidein 0.3s ease; }
.ai-reply.axis-change { background: linear-gradient(135deg,#fef3c7,#fde68a); border-color: #f59e0b; color: #78350f; }
.ai-reply-head { font-size: 11px; font-weight: 800; margin-bottom: 4px; opacity: 0.85; }
.ai-reply .axis-action { margin-top: 10px; }
.ai-reply .axis-action button { padding: 8px 14px; background: linear-gradient(135deg,#f59e0b,#d97706); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

/* カレンダー */
.cal-card { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.cal-head .ti { font-size: 14px; font-weight: 800; color: #1e3a8a; }
.cal-grid { display: grid; gap: 4px; }
.cal-row { display: grid; gap: 4px; grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr; }
.cal-cell { aspect-ratio: 1; border-radius: 8px; background: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #94a3b8; cursor: pointer; position: relative; min-height: 40px; }
.cal-cell.today { box-shadow: 0 0 0 2px #3b82f6; }
.cal-cell.future { background: #fafafa; }
.cal-cell .dn { font-size: 10px; opacity: 0.6; }
.cal-cell .st { font-size: 18px; line-height: 1; }
.cal-cell.s-done { background: linear-gradient(135deg,#dcfce7,#bbf7d0); color: #166534; }
.cal-cell.s-partial { background: linear-gradient(135deg,#fef3c7,#fde68a); color: #78350f; }
.cal-cell.s-miss { background: linear-gradient(135deg,#fee2e2,#fecaca); color: #991b1b; }
.cal-cell.s-rest { background: linear-gradient(135deg,#ede9fe,#ddd6fe); color: #5b21b6; }
.cal-cell.has-comment::after { content: '💬'; position: absolute; bottom: 2px; right: 3px; font-size: 9px; }
.cal-legend { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; font-size: 10.5px; color: #64748b; }
.cal-legend span { display: inline-flex; align-items: center; gap: 3px; }

/* 履歴コメントモーダル */
.day-modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
.day-modal-bg.show { display: flex; }
@media (min-width: 560px) { .day-modal-bg { align-items: center; padding: 16px; } }
.day-modal { background: #fff; border-radius: 16px 16px 0 0; max-width: 480px; width: 100%; padding: 18px; max-height: 70vh; overflow-y: auto; }
@media (min-width: 560px) { .day-modal { border-radius: 16px; } }
.day-modal h3 { margin: 0 0 10px; font-size: 16px; color: #1e3a8a; }
.day-modal .item { padding: 10px 0; border-bottom: 1px dashed #e2e8f0; font-size: 13px; line-height: 1.6; }
.day-modal .item:last-child { border-bottom: none; }
.day-modal .it-cmt { color: #1f2937; }
.day-modal .it-ai { color: #1e40af; background: #eff6ff; padding: 8px 10px; border-radius: 6px; margin-top: 6px; font-size: 12.5px; }

/* 操作ボタン */
.actions { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.act-btn { flex: 1; min-width: 130px; padding: 11px; border: none; border-radius: 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.act-btn.primary { background: linear-gradient(135deg,#3b82f6,#1e40af); color: #fff; }
.act-btn.secondary { background: #fff; color: #475569; border: 1px solid #cbd5e1 !important; }
.act-btn.danger { background: #fff; color: #b91c1c; border: 1px solid #fecaca !important; }

/* 完走バッジ */
.completed-card { background: linear-gradient(135deg,#fef9c3,#fde68a); border: 3px solid #f59e0b; border-radius: 16px; padding: 18px; margin-bottom: 14px; text-align: center; }
.completed-card .badge { font-size: 56px; margin-bottom: 6px; }
.completed-card .title { font-size: 18px; font-weight: 900; color: #78350f; margin-bottom: 4px; }
.completed-card .sub { font-size: 12.5px; color: #92400e; line-height: 1.6; }

/* 空状態 */
.empty-state { background: #fff; border-radius: 14px; padding: 40px 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
.empty-state .ico { font-size: 56px; margin-bottom: 12px; }
.empty-state .msg { font-size: 14px; color: #475569; line-height: 1.7; margin-bottom: 16px; }
.empty-state .start-btn { padding: 14px 28px; background: linear-gradient(135deg,#10b981,#059669); color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.3); }

.err-msg { background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
.err-msg.show { display: block; }
.loading { padding: 40px; text-align: center; color: #64748b; font-size: 13px; }

/* ログイン */
.login-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
.login-overlay.show { display: flex; }
.login-card { background: #fff; border-radius: 14px; padding: 24px; max-width: 320px; width: 90%; }
.login-card h2 { margin: 0 0 16px; font-size: 16px; color: #1e3a8a; }
.login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
.login-card .btn { width: 100%; padding: 11px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.login-err { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body data-app-version="20260520-1">

<header>
  <div style="flex:1;line-height:1.2;">
    <h1>🩺 今日の一歩、明日の自分</h1>
    <div style="font-size:10px;font-weight:600;opacity:0.85;margin-top:2px;">マイカレンダー</div>
  </div>
  <button class="close" onclick="closePage()">閉じる</button>
</header>

<main>

  <!-- 挨拶 -->
  <div class="advisor">
    <img src="/assets/concierge_health_avatar.png?v=8" alt="ヘルスアドバイザー">
    <div class="advisor-text">
      <div class="advisor-name">🩺 ヘルスアドバイザー</div>
      <div class="advisor-msg" id="advisor-msg">読み込み中…</div>
    </div>
  </div>

  <div class="err-msg" id="err"></div>
  <div id="content" class="loading">読み込み中…</div>

</main>

<!-- 日付詳細モーダル -->
<div class="day-modal-bg" id="day-modal-bg" onclick="if(event.target===this)closeDayModal()">
  <div class="day-modal" id="day-modal"></div>
</div>

<!-- ログイン -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>🩺 健康管理室にログイン</h2>
    <input type="text" id="li-id" placeholder="社員ID">
    <input type="password" id="li-pw" placeholder="パスワード">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="li-err"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('cohub_token') || '';
let me = null; try { me = JSON.parse(localStorage.getItem('cohub_user') || 'null'); } catch {}
let activePlan = null;
let logs = [];
let selectedStatus = null;

async function api(p, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(p, opts);
  if (r.status === 401) { showLogin(); throw new Error('401'); }
  return r.json();
}

function showLogin(err) {
  document.getElementById('login-overlay').classList.add('show');
  if (err) document.getElementById('li-err').textContent = err;
}
async function doLogin() {
  const id = document.getElementById('li-id').value.trim();
  const pw = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  err.textContent = '';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login_id: id, password: pw }) });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || '失敗'; return; }
    token = d.token;
    localStorage.setItem('cohub_token', token);
    localStorage.setItem('cohub_user', JSON.stringify(d.user));
    me = d.user;
    document.getElementById('login-overlay').classList.remove('show');
    init();
  } catch (e) { err.textContent = '通信エラー'; }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function closePage() { if (history.length > 1) history.back(); else location.replace('/'); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const CAT_ICON = { move: '🏃', meal: '🍱', sleep: '😴', rest: '💤', drink: '🍺', mind: '🧠' };

async function init() {
  try {
    const r = await api('/api/myplan/active');
    if (!r.success) throw new Error(r.msg || '失敗');
    activePlan = r.plan;
    logs = r.logs || [];
    render();
  } catch (e) {
    if (String(e.message) !== '401') {
      document.getElementById('err').textContent = '通信エラー: ' + e.message;
      document.getElementById('err').classList.add('show');
      document.getElementById('content').innerHTML = '';
    }
  }
}

function render() {
  const msg = document.getElementById('advisor-msg');
  const cont = document.getElementById('content');
  cont.classList.remove('loading');

  if (!activePlan) {
    msg.textContent = '進行中のプランがありません。1つ選んで始めてみよう。';
    cont.innerHTML = `
      <div class="empty-state">
        <div class="ico">🌱</div>
        <div class="msg">まだプランがありません。<br>15個の基本プランから1つ選ぼう。<br>3日間からでOK。</div>
        <button class="start-btn" onclick="location.href='/consult.html'">プランを選ぶ →</button>
      </div>`;
    return;
  }

  const p = activePlan;
  const isCompleted = p.status === 'completed';
  const today = todayStr();
  const todayLog = logs.find(l => l.log_date === today);

  msg.textContent = isCompleted
    ? `${p.period_days}日プランを完走したね、おめでとう! 次のプランも選べるよ。`
    : `${p.title} の ${p.day_index}日目 (残り ${p.remaining}日)。今日もお疲れさま。`;

  const completedBlock = isCompleted ? `
    <div class="completed-card">
      <div class="badge">🎊</div>
      <div class="title">${esc(p.period_days)}日プラン完走!</div>
      <div class="sub">「${esc(p.title)}」を ${p.positive}日達成。<br>次は1週間〜3ヶ月の長期プランも選べます。</div>
    </div>` : '';

  const progressPct = Math.round(p.day_index / p.period_days * 100);
  const headBlock = `
    <div class="cur-plan">
      <div class="cur-head">
        <div class="cur-icon">${esc(CAT_ICON[p.category] || '🌱')}</div>
        <div style="flex:1;">
          <div class="cur-title">${esc(p.title)}</div>
          <div class="cur-cat">${esc(p.category_label || '')} ・ ${esc(p.period_days)}日プラン</div>
        </div>
      </div>
      <div class="cur-action">→ ${esc(p.action)}</div>
      <div class="cur-stats">
        <div class="cur-stat"><div class="v">${p.day_index}/${p.period_days}</div><div class="l">日目</div></div>
        <div class="cur-stat"><div class="v">${p.positive}</div><div class="l">達成 ○△</div></div>
        <div class="cur-stat"><div class="v">${p.streak}</div><div class="l">連続</div></div>
      </div>
      <div class="cur-progress">
        <div class="bar"><div class="fill" style="width:${progressPct}%"></div></div>
        <div class="lbl">${progressPct}%</div>
      </div>
    </div>`;

  // 今日の記録 (完走済みでも表示しない/最終日後の入力は除外)
  const todayBlock = isCompleted ? '' : `
    <div class="today-card">
      <div class="today-head">📝 今日の記録 <span class="today-date">${today}</span></div>
      <div class="status-btns">
        <button class="status-btn ${todayLog && todayLog.status==='done' ? 'sel' : ''}" data-key="done">
          <div class="ic">○</div><div class="lb">できた</div>
        </button>
        <button class="status-btn ${todayLog && todayLog.status==='partial' ? 'sel' : ''}" data-key="partial">
          <div class="ic">△</div><div class="lb">半分</div>
        </button>
        <button class="status-btn ${todayLog && todayLog.status==='miss' ? 'sel' : ''}" data-key="miss">
          <div class="ic">✕</div><div class="lb">できず</div>
        </button>
        <button class="status-btn ${todayLog && todayLog.status==='rest' ? 'sel' : ''}" data-key="rest">
          <div class="ic">休</div><div class="lb">あえて休</div>
        </button>
      </div>
      <div class="cmt-row">
        <input type="text" id="cmt" maxlength="200" placeholder="一言コメント (任意)" value="${esc(todayLog && todayLog.comment || '')}">
        <button class="btn-record" id="btn-record" disabled>記録</button>
      </div>
      <div class="ai-reply ${todayLog && todayLog.ai_axis_change ? 'axis-change' : ''} ${todayLog && todayLog.ai_reply ? 'show' : ''}" id="ai-reply">
        <div class="ai-reply-head">🩺 ヘルスアドバイザーから</div>
        ${todayLog && todayLog.ai_reply ? esc(todayLog.ai_reply).replace(/\n/g, '<br>') : ''}
        ${todayLog && todayLog.ai_axis_change ? `<div class="axis-action"><button onclick="abandonPlan()">プランを変える</button></div>` : ''}
      </div>
    </div>`;

  // カレンダー
  const calBlock = `
    <div class="cal-card">
      <div class="cal-head">
        <div class="ti">📅 ${p.period_days}日カレンダー</div>
        <div style="font-size:11px;color:#64748b;">開始: ${(p.started_at || '').slice(5, 10)}</div>
      </div>
      ${buildCalendar(p, logs)}
      <div class="cal-legend">
        <span>○ できた</span><span>△ 半分</span><span>✕ できず</span><span>休 休む</span><span>💬 コメントあり</span>
      </div>
    </div>`;

  // アクション
  const actionBlock = `
    <div class="actions">
      <button class="act-btn primary" onclick="location.href='/consult.html'">📋 ${isCompleted ? '次のプランを選ぶ' : '別のプランに変える'}</button>
      ${isCompleted ? '' : `<button class="act-btn danger" onclick="abandonPlan()">プランを中止</button>`}
    </div>`;

  cont.innerHTML = completedBlock + headBlock + todayBlock + calBlock + actionBlock;

  if (!isCompleted) bindTodayButtons(todayLog);
}

function buildCalendar(plan, logs) {
  const start = new Date((plan.started_at || todayStr()).slice(0, 10) + 'T00:00:00');
  const period = plan.period_days;
  const today = todayStr();
  const logMap = {}; for (const l of logs) logMap[l.log_date] = l;
  let html = '<div class="cal-grid">';
  for (let i = 0; i < period; i += 7) {
    html += '<div class="cal-row">';
    for (let j = 0; j < 7; j++) {
      const idx = i + j;
      if (idx >= period) { html += '<div></div>'; continue; }
      const d = new Date(start.getTime() + idx * 86400000);
      const dateStr = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const log = logMap[dateStr];
      const isToday = dateStr === today;
      const isFuture = dateStr > today;
      const stClass = log ? 's-' + log.status : '';
      const stMark = log ? ({done:'○',partial:'△',miss:'✕',rest:'休'})[log.status] : (isFuture ? '·' : '');
      const cmtClass = (log && log.comment) ? 'has-comment' : '';
      const cellClass = ['cal-cell', stClass, isToday?'today':'', isFuture?'future':'', cmtClass].filter(x=>x).join(' ');
      html += `<div class="${cellClass}" data-date="${dateStr}">
        <div class="dn">${idx + 1}日</div>
        <div class="st">${stMark}</div>
      </div>`;
    }
    html += '</div>';
  }
  html += '</div>';
  setTimeout(() => {
    document.querySelectorAll('.cal-cell[data-date]').forEach(c => {
      c.addEventListener('click', () => openDayDetail(c.getAttribute('data-date')));
    });
  }, 50);
  return html;
}

function bindTodayButtons(todayLog) {
  selectedStatus = todayLog ? todayLog.status : null;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.status-btn').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      selectedStatus = b.getAttribute('data-key');
      document.getElementById('btn-record').disabled = false;
    });
  });
  const btn = document.getElementById('btn-record');
  if (todayLog) btn.disabled = false;
  btn.addEventListener('click', recordToday);
  const cmt = document.getElementById('cmt');
  cmt.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !btn.disabled) recordToday();
  });
}

async function recordToday() {
  if (!selectedStatus) return;
  const cmt = document.getElementById('cmt').value.trim();
  const btn = document.getElementById('btn-record');
  btn.disabled = true; btn.textContent = '送信中…';
  try {
    const r = await api('/api/myplan/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ log_date: todayStr(), status: selectedStatus, comment: cmt }),
    });
    if (!r.success) { alert(r.msg || '記録失敗'); btn.disabled = false; btn.textContent = '記録'; return; }
    // AI返答を即表示
    const replyEl = document.getElementById('ai-reply');
    replyEl.classList.add('show');
    if (r.axis_change) replyEl.classList.add('axis-change');
    else replyEl.classList.remove('axis-change');
    replyEl.innerHTML = `<div class="ai-reply-head">🩺 ヘルスアドバイザーから</div>${esc(r.ai_reply || '').replace(/\n/g,'<br>')}${r.axis_change ? '<div class="axis-action"><button onclick="abandonPlan()">プランを変える</button></div>' : ''}`;
    btn.textContent = '記録';
    btn.disabled = false;
    // ログ更新で再描画
    setTimeout(init, 400);
  } catch (e) {
    if (String(e.message) !== '401') alert('通信エラー');
    btn.disabled = false; btn.textContent = '記録';
  }
}

function openDayDetail(dateStr) {
  const log = logs.find(l => l.log_date === dateStr);
  if (!log) return;
  const map = { done: '○ できた', partial: '△ 半分', miss: '✕ できず', rest: '休 あえて休む' };
  let html = `<h3>${dateStr} の記録</h3>`;
  html += `<div class="item"><b>${esc(map[log.status] || log.status)}</b></div>`;
  if (log.comment) html += `<div class="item"><div class="it-cmt">💬 ${esc(log.comment)}</div></div>`;
  if (log.ai_reply) html += `<div class="item"><div class="it-ai">🩺 ${esc(log.ai_reply).replace(/\n/g,'<br>')}</div></div>`;
  html += `<div style="text-align:center;margin-top:14px;"><button class="act-btn secondary" onclick="closeDayModal()">閉じる</button></div>`;
  document.getElementById('day-modal').innerHTML = html;
  document.getElementById('day-modal-bg').classList.add('show');
}
function closeDayModal() { document.getElementById('day-modal-bg').classList.remove('show'); }

async function abandonPlan() {
  if (!confirm('現在のプランを中止して、新しいプランを選びますか?')) return;
  try {
    await api('/api/myplan/abandon', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
    location.replace('/consult.html');
  } catch (e) { alert('通信エラー'); }
}

// 起動
if (!token) showLogin();
else init();
</script>
