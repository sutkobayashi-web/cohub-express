<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎙 ミーティング</title>
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg: #f8fafc; --fg: #0f172a; --mute: #64748b;
  --card: #ffffff; --border: #e2e8f0;
  --accent: #4f46e5; --accent-d: #3730a3;
  --danger: #ef4444; --warn: #f59e0b; --ok: #10b981;
  --zoom: #2D8CFF; --zoom-d: #1f6fcc;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; }

/* === ヘッダー === */
.hd { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #4f46e5, #4338ca); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.hd a.back { color: #fff; text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.16); }
.hd .title { flex: 1; font-weight: 700; font-size: 16px; }

.body { padding: 18px; max-width: 760px; margin: 0 auto; }
.intro { color: var(--mute); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }

/* === Zoom メイン会議カード === */
.room-card {
  background: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
  border: 1px solid #bfdbfe; border-radius: 18px;
  padding: 28px 22px; text-align: center;
  box-shadow: 0 6px 20px rgba(45,140,255,0.10);
}
.zoom-logo { font-size: 50px; margin-bottom: 4px; }
.room-card .name { font-size: 22px; font-weight: 800; color: #1e3a8a; margin-bottom: 2px; }
.room-card .sub { color: var(--mute); font-size: 12px; margin-bottom: 18px; }
.room-card .count {
  color: #1e3a8a; font-size: 13px; margin-bottom: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.6); padding: 4px 12px; border-radius: 999px;
  border: 1px solid #bfdbfe;
}
.room-card .count b { color: var(--zoom); font-size: 16px; }
.room-card .count.empty { color: var(--mute); }
.room-card .members {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin-bottom: 22px; min-height: 0;
}
.room-card .members .ava {
  width: 40px; height: 40px; border-radius: 50%; background: #fff;
  border: 2px solid var(--zoom); overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: var(--zoom);
}
.room-card .members .ava img { width: 100%; height: 100%; object-fit: cover; }
.room-card .members .ava.me { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.30); }

/* メイン Zoom入室ボタン */
.zoom-btn {
  background: var(--zoom); color: #fff; border: none;
  padding: 16px 40px; border-radius: 12px;
  font-size: 17px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; gap: 10px;
  box-shadow: 0 6px 18px rgba(45,140,255,0.45);
  transition: transform 0.12s, box-shadow 0.12s, background 0.12s;
}
.zoom-btn:hover { background: var(--zoom-d); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(45,140,255,0.55); }
.zoom-btn .ic { font-size: 22px; }
.zoom-btn.leave { background: var(--danger); box-shadow: 0 6px 18px rgba(239,68,68,0.40); }
.zoom-btn.leave:hover { background: #b91c1c; box-shadow: 0 8px 22px rgba(239,68,68,0.50); }
.zoom-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

.hint {
  margin-top: 14px; font-size: 11px; color: var(--mute); line-height: 1.6;
}
.hint .ok { color: var(--ok); font-weight: 700; }

.no-zoom {
  margin-top: 14px; font-size: 13px; color: #92400e;
  background: #fffbeb; border: 1px solid #fde68a;
  border-radius: 10px; padding: 12px;
}

/* === Toast === */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(15,23,42,0.92); color: #fff; padding: 10px 18px;
  border-radius: 8px; font-size: 13px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  z-index: 20000; max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.toast.err { background: #b91c1c; }

/* ============ 時刻表（かいぎ出太郎） ============ */
.kaigi-section {
  background: linear-gradient(135deg, #fff8e6, #fef3c7);
  border: 2px solid #fbbf24; border-radius: 16px;
  padding: 16px 18px; margin: 18px 0;
  box-shadow: 0 6px 18px rgba(251,191,36,0.18);
}
.tt-title-bar {
  font-size: 14px; font-weight: 800; color: #92400e;
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1.5px solid #fbbf24;
  letter-spacing: 0.5px;
}
.tt-group { margin-bottom: 14px; }
.tt-group:last-child { margin-bottom: 0; }
.tt-group-title {
  font-size: 12px; font-weight: 800; color: #92400e;
  margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
  letter-spacing: 0.5px;
}
.tt-card {
  background: #fff; border: 1px solid #fde68a; border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
  transition: transform 0.12s, box-shadow 0.12s;
  cursor: pointer;
  border-left-width: 5px;
}
.tt-card:last-child { margin-bottom: 0; }
.tt-card:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,0.10); }
/* 開催形式で全体の背景を差別化 */
.tt-card.f-online   { background: linear-gradient(135deg, #eff6ff 0%, #fff 65%); border-left-color: #3b82f6; }
.tt-card.f-inperson { background: linear-gradient(135deg, #fffbeb 0%, #fff 65%); border-left-color: #d97706; }
/* status (live/soon/open) で上ボーダー強調 + 状態バッジ。背景はformatに譲る */
.tt-card.live { border-top-color: #dc2626; border-right-color: #dc2626; border-bottom-color: #dc2626; }
.tt-card.soon { border-top-color: #f59e0b; border-right-color: #f59e0b; border-bottom-color: #f59e0b; }
.tt-card.open { border-top-color: #94a3b8; border-right-color: #94a3b8; border-bottom-color: #94a3b8; border-top-style: dashed; border-right-style: dashed; border-bottom-style: dashed; }
.tt-when {
  flex-shrink: 0; min-width: 80px; text-align: center;
  font-family: ui-monospace, monospace; font-size: 13px; font-weight: 800;
  color: #1f2937; line-height: 1.2;
}
.tt-when .date { font-size: 10px; color: #64748b; font-weight: 600; }
.tt-when .live-badge { display: inline-block; background: #dc2626; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; animation: live-blink 1.2s ease-in-out infinite; }
.tt-when .soon-badge { display: inline-block; background: #f59e0b; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
.tt-when .open-badge { display: inline-block; background: #64748b; color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px; }
@keyframes live-blink {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(220,38,38,0.5); }
  50% { opacity: 0.85; box-shadow: 0 0 0 6px rgba(220,38,38,0); }
}
.tt-body { flex: 1; min-width: 0; }
.tt-title { font-size: 14px; font-weight: 800; color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-meta { font-size: 11px; color: #64748b; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.fmt-chip { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.fmt-chip.online { background: #dbeafe; color: #1d4ed8; }
.fmt-chip.inperson { background: #fef3c7; color: #92400e; }
.tt-avatars { display: flex; flex-shrink: 0; }
.tt-avatars img, .tt-avatars .ph {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid #fff; margin-left: -6px;
  object-fit: cover; background: #cbd5e1;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.tt-avatars img:first-child, .tt-avatars .ph:first-child { margin-left: 0; }
.tt-room-now {
  margin-top: 6px; display: flex; align-items: center; gap: 8px;
  padding: 4px 8px; background: rgba(34,197,94,0.10);
  border-radius: 6px; border: 1px solid rgba(34,197,94,0.30);
}
.tt-room-now .rn-label { font-size: 10px; font-weight: 800; color: #15803d; white-space: nowrap; }
.tt-room-now .tt-avatars img, .tt-room-now .tt-avatars .ph { width: 22px; height: 22px; }
.tt-empty { background: #fff; border: 1px dashed #fde68a; border-radius: 10px; padding: 14px; text-align: center; color: #92400e; font-size: 12px; font-weight: 600; }
.tt-cta { text-align: right; margin-top: 10px; }
.tt-cta a {
  display: inline-block; background: #f59e0b; color: #fff;
  padding: 6px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 800; text-decoration: none;
  box-shadow: 0 2px 6px rgba(245,158,11,0.30);
}
.tt-cta a:hover { background: #d97706; }

@media (max-width: 600px) {
  .body { padding: 14px; }
  .room-card { padding: 22px 16px; }
  .zoom-btn { padding: 14px 28px; font-size: 16px; }
  .tt-when { min-width: 64px; font-size: 12px; }
  .tt-card { padding: 8px 10px; gap: 8px; }
  .tt-avatars img, .tt-avatars .ph { width: 22px; height: 22px; }
}
</style>
<script src="/version-check.js" defer></script>
</head>
<body>
<div class="hd">
  <a href="/home" class="back">←</a>
  <div class="title">🎙 ミーティング</div>
</div>
<div class="body">
  <div class="intro">
    Zoom で会議に参加します。入室するとアバターで「集合中」が CoWell にも表示され、他のメンバーに見えるようになります。
  </div>
  <div class="room-card">
    <div class="zoom-logo">📹</div>
    <div class="name" id="room-name">Zoom 会議室</div>
    <div class="sub">CoWell 共通ミーティングルーム</div>
    <div id="count-pill" class="count empty"><span id="count-text">まだ誰もいません</span></div>
    <div class="members" id="room-members"></div>
    <button id="zoom-btn" class="zoom-btn" onclick="onZoomBtn()">
      <span class="ic">📹</span><span id="zoom-btn-label">Zoom で入室する</span>
    </button>
    <div id="zoom-hint" class="hint" style="display:none;">
      ボタンを押すと Zoom が新しいタブで開きます。<br>
      CoWell の「退室」を押すと Zoom タブも自動で閉じます。
    </div>
    <div id="no-zoom" class="no-zoom" style="display:none;">
      ⚠️ Zoom 会議室が未設定です。管理者にお問い合わせください。
    </div>
  </div>

  <!-- ━━━ ミーティング時刻表 ━━━ -->
  <div class="kaigi-section">
    <div class="tt-title-bar">🎬 ミーティング予定</div>
    <div id="timetable">
      <div class="tt-empty">読み込み中…</div>
    </div>
    <div class="tt-cta">
      <a href="/poll.html">📅 日程調整一覧 / 新規予約</a>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const ROOM_ID = 'main';
const token = localStorage.getItem('cohub_token') || '';
let me = null;
let socket = null;
let inRoom = false;
let zoomUrl = '';
let zoomWindow = null;
const participants = new Map(); // uid -> {uid, display_name, avatar_url}

function $(id) { return document.getElementById(id); }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  if (r.status === 401) { location.replace('/'); return null; }
  return r.json();
}
function showToast(msg, ms, isErr) {
  const t = $('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._tm);
  t._tm = setTimeout(() => { t.className = 'toast'; }, ms || 2000);
}

function renderMembers() {
  const root = $('room-members');
  const list = Array.from(participants.values());
  $('count-text').textContent = list.length > 0 ? list.length + ' 名が集合中' : 'まだ誰もいません';
  $('count-pill').classList.toggle('empty', list.length === 0);
  if (!list.length) { root.innerHTML = ''; return; }
  root.innerHTML = list.map(p => {
    const isMe = me && p.uid === me.id;
    const initial = escapeHtml((p.display_name || '?').slice(0, 1));
    const avatar = p.avatar_url
      ? `<img src="${escapeHtml(p.avatar_url)}" alt="${escapeHtml(p.display_name||'')}" title="${escapeHtml(p.display_name||'')}">`
      : initial;
    return `<div class="ava${isMe ? ' me' : ''}" title="${escapeHtml(p.display_name||'')}">${avatar}</div>`;
  }).join('');
}

function setBtnState(state) {
  const btn = $('zoom-btn');
  const lbl = $('zoom-btn-label');
  btn.disabled = false;
  if (state === 'in') {
    btn.classList.add('leave');
    lbl.textContent = '退室する';
  } else if (state === 'disabled') {
    btn.disabled = true;
    btn.classList.remove('leave');
    lbl.textContent = 'Zoom 未設定';
  } else {
    btn.classList.remove('leave');
    lbl.textContent = 'Zoom で入室する';
  }
}

async function refreshRoomStatus() {
  const r = await api('/api/meeting/rooms/status');
  if (!r || !r.success) return;
  if (typeof r.zoomUrl === 'string') zoomUrl = r.zoomUrl;
  const rm = (r.rooms || [])[0];
  if (!rm) return;
  $('room-name').textContent = rm.name + ' (Zoom 会議室)';
  // 参加者初期スナップショット (自分が在室の場合はサーバ側にもう載っている)
  participants.clear();
  for (const p of (rm.participants || [])) {
    participants.set(p.uid, { uid: p.uid, display_name: p.display_name, avatar_url: p.avatar_url });
  }
  renderMembers();
  if (!zoomUrl) {
    $('no-zoom').style.display = '';
    $('zoom-hint').style.display = 'none';
    setBtnState('disabled');
  } else {
    $('no-zoom').style.display = 'none';
    $('zoom-hint').style.display = '';
  }
}

function setupSocket() {
  socket = io({ auth: { token } });
  socket.on('connect', () => {
    if (inRoom) {
      // 再接続時: 自動で部屋に戻る
      socket.emit('meeting:join', { roomId: ROOM_ID });
    }
  });
  socket.on('meeting:peers', () => {
    // server側からのpeers配列はuidのみ。プロファイル付き一覧はAPIから取得
    refreshRoomStatus();
  });
  socket.on('meeting:peer-joined', (data) => {
    if (!data || !data.uid) return;
    participants.set(data.uid, { uid: data.uid, display_name: data.display_name, avatar_url: data.avatar_url });
    renderMembers();
  });
  socket.on('meeting:peer-left', (data) => {
    if (!data || !data.uid) return;
    participants.delete(data.uid);
    renderMembers();
  });
  socket.on('meeting:join-denied', (data) => {
    inRoom = false;
    setBtnState('out');
    showToast('入室できませんでした: ' + (data && data.reason || '不明'), 3000, true);
  });
}

function openZoom() {
  if (!zoomUrl) return false;
  try {
    if (zoomWindow && !zoomWindow.closed) { zoomWindow.focus(); return true; }
    zoomWindow = window.open(zoomUrl, 'cohub_zoom_tab');
    if (!zoomWindow) {
      showToast('ポップアップがブロックされました。ブラウザ設定を確認してください', 3500, true);
      return false;
    }
    return true;
  } catch (e) {
    showToast('Zoom 起動失敗: ' + e.message, 3000, true);
    return false;
  }
}

function closeZoomTab() {
  try { if (zoomWindow && !zoomWindow.closed) zoomWindow.close(); } catch (e) {}
  zoomWindow = null;
}

function enterRoom() {
  if (!zoomUrl) { showToast('Zoom URL が設定されていません', 2500, true); return; }
  if (!openZoom()) return;
  inRoom = true;
  setBtnState('in');
  // 自分を即時にメンバー表示
  if (me) participants.set(me.id, { uid: me.id, display_name: me.display_name, avatar_url: me.avatar_url });
  renderMembers();
  if (socket && socket.connected) socket.emit('meeting:join', { roomId: ROOM_ID });
  showToast('📹 Zoom を開きました');
}

function leaveRoom() {
  inRoom = false;
  setBtnState('out');
  if (me) participants.delete(me.id);
  renderMembers();
  if (socket && socket.connected) socket.emit('meeting:leave');
  closeZoomTab();
  showToast('退室しました');
}

function onZoomBtn() {
  if (inRoom) leaveRoom();
  else enterRoom();
}

window.addEventListener('beforeunload', () => {
  if (inRoom && socket && socket.connected) socket.emit('meeting:leave');
});

async function init() {
  const r = await api('/api/auth/me');
  if (!r || !r.success) { location.replace('/'); return; }
  me = r.user;
  await refreshRoomStatus();
  setupSocket();
  loadTimetable();
  setInterval(loadTimetable, 30000);
  setInterval(refreshRoomStatus, 60000);
}

// ============ 時刻表 ============
const DOWS_TT = ['日','月','火','水','木','金','土'];
function _ttFmtTime(iso) {
  if (!iso) return '';
  const s = String(iso).length === 16 ? iso + ':00' : iso;
  const d = new Date(s);
  if (isNaN(d.getTime())) return iso;
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
function _ttFmtDate(iso) {
  if (!iso) return '';
  const s = String(iso).length === 16 ? iso + ':00' : iso;
  const d = new Date(s);
  if (isNaN(d.getTime())) return '';
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  const diffDays = Math.round((target - today) / (24*3600*1000));
  if (diffDays === 0) return '本日';
  if (diffDays === 1) return '明日';
  if (diffDays === -1) return '昨日';
  return (d.getMonth()+1) + '/' + d.getDate() + '(' + DOWS_TT[d.getDay()] + ')';
}
function _ttAvatarHtml(participants) {
  const visible = participants.slice(0, 5);
  const rest = Math.max(0, participants.length - visible.length);
  let html = '<div class="tt-avatars">';
  for (const p of visible) {
    const initial = escapeHtml((p.name || '?').slice(0, 1));
    html += p.avatar
      ? `<img src="${escapeHtml(p.avatar)}" alt="" title="${escapeHtml(p.name||'')}">`
      : `<span class="ph" title="${escapeHtml(p.name||'')}">${initial}</span>`;
  }
  if (rest > 0) html += `<span class="ph" style="background:#9ca3af;">+${rest}</span>`;
  html += '</div>';
  return html;
}
function _ttRoomBadge(currentRoom) {
  if (!currentRoom || !currentRoom.length) return '';
  const visible = currentRoom.slice(0, 6);
  const rest = Math.max(0, currentRoom.length - visible.length);
  let inner = '';
  for (const p of visible) {
    const initial = escapeHtml((p.name || '?').slice(0, 1));
    inner += p.avatar
      ? `<img src="${escapeHtml(p.avatar)}" alt="" title="${escapeHtml(p.name||'')}">`
      : `<span class="ph" title="${escapeHtml(p.name||'')}">${initial}</span>`;
  }
  if (rest > 0) inner += `<span class="ph" style="background:#9ca3af;">+${rest}</span>`;
  return `<div class="tt-room-now"><span class="rn-label">🟢 入室中</span><div class="tt-avatars">${inner}</div></div>`;
}
function _ttFmtChip(d) {
  if (d && d.format === 'inperson') {
    const loc = d.location ? ' ' + escapeHtml(d.location) : '';
    return '<span class="fmt-chip inperson">📍 対面' + loc + '</span>';
  }
  return '<span class="fmt-chip online">📹 オンライン</span>';
}
function _ttDecidedCard(d, serverNow, currentRoom) {
  const start = new Date(d.starts_at.length === 16 ? d.starts_at + ':00' : d.starts_at);
  const dur = (d.duration_minutes || 30) * 60000;
  const end = new Date(start.getTime() + dur);
  const now = serverNow ? new Date(serverNow) : new Date();
  const minsUntil = Math.round((start - now) / 60000);
  let klass = '', badge = '', metaExtra = '';
  if (now >= start && now < end) {
    klass = 'live';
    badge = '<div class="live-badge">🔴 会議中</div>';
    metaExtra = '残り' + Math.max(0, Math.round((end - now) / 60000)) + '分';
  } else if (minsUntil <= 30 && minsUntil > 0) {
    klass = 'soon'; badge = '<div class="soon-badge">⏰ もうすぐ</div>';
    metaExtra = 'あと' + minsUntil + '分';
  } else if (minsUntil > 0) {
    metaExtra = (minsUntil < 60*24 ? Math.round(minsUntil/60) + '時間後' : Math.round(minsUntil/60/24) + '日後');
  }
  const dateLbl = _ttFmtDate(d.starts_at);
  const timeLbl = _ttFmtTime(d.starts_at);
  const roomBadge = (klass === 'live' && d.format !== 'inperson') ? _ttRoomBadge(currentRoom) : '';
  const fClass = (d.format === 'inperson') ? 'f-inperson' : 'f-online';
  return `<div class="tt-card ${klass} ${fClass}" onclick="location.href='/poll.html?id=${d.id}'">
    <div class="tt-when">
      <div class="date">${escapeHtml(dateLbl)}</div>
      <div>${timeLbl}</div>
      ${badge}
    </div>
    <div class="tt-body">
      <div class="tt-title">${escapeHtml(d.title || '(無題)')}</div>
      <div class="tt-meta">
        <span>主催: ${escapeHtml(d.organizer_name || '')}</span>
        <span>${d.duration_minutes||30}分</span>
        ${_ttFmtChip(d)}
        ${metaExtra ? '<span>' + metaExtra + '</span>' : ''}
      </div>
      ${roomBadge}
    </div>
    ${_ttAvatarHtml(d.participants || [])}
  </div>`;
}
function _ttOpenCard(p) {
  const dateLbl = p.earliest_candidate ? _ttFmtDate(p.earliest_candidate) : '';
  const timeLbl = p.earliest_candidate ? _ttFmtTime(p.earliest_candidate) : '';
  const voted = p.voted_count || 0;
  const total = p.invitee_count || 0;
  const fClass = (p.format === 'inperson') ? 'f-inperson' : 'f-online';
  return `<div class="tt-card open ${fClass}" onclick="location.href='/poll.html?id=${p.id}'">
    <div class="tt-when">
      <div class="date">${escapeHtml(dateLbl || '日程未定')}</div>
      <div style="color:#64748b;">${timeLbl ? '〜' + timeLbl : ''}</div>
      <div class="open-badge">📋 調整中</div>
    </div>
    <div class="tt-body">
      <div class="tt-title">${escapeHtml(p.title || '(無題)')}</div>
      <div class="tt-meta">
        <span>主催: ${escapeHtml(p.organizer_name || '')}</span>
        ${_ttFmtChip(p)}
        <span>候補${p.slot_count || 0}件</span>
        <span>回答 ${voted}/${total}名</span>
      </div>
    </div>
    ${_ttAvatarHtml(p.participants || [])}
  </div>`;
}
async function loadTimetable() {
  const root = $('timetable');
  if (!root) return;
  try {
    const r = await api('/api/poll/timetable');
    if (!r || !r.success) { root.innerHTML = '<div class="tt-empty">読み込み失敗</div>'; return; }
    const decided = r.decided || [];
    const open = r.open || [];
    const serverNow = r.server_now;
    const now = serverNow ? new Date(serverNow) : new Date();
    const live = [], soon = [], today = [], later = [];
    const todayKey = (() => { const x = new Date(now); x.setHours(0,0,0,0); return x.getTime(); })();
    for (const d of decided) {
      const start = new Date(d.starts_at.length === 16 ? d.starts_at + ':00' : d.starts_at);
      const dur = (d.duration_minutes || 30) * 60000;
      const end = new Date(start.getTime() + dur);
      if (now >= end) continue;  // 終了済み(過去)の会議は表示しない
      const minsUntil = Math.round((start - now) / 60000);
      const dayKey = (() => { const x = new Date(start); x.setHours(0,0,0,0); return x.getTime(); })();
      if (now >= start && now < end) live.push(d);
      else if (minsUntil <= 30 && minsUntil > 0) soon.push(d);
      else if (dayKey === todayKey) today.push(d);
      else later.push(d);
    }
    // 日程調整中: 候補日時がすべて過去のポール(過ぎた週)は表示しない
    const openLive = open.filter(p => {
      if (!p.latest_candidate) return true;  // 候補未設定は残す
      const last = new Date(p.latest_candidate.length === 16 ? p.latest_candidate + ':00' : p.latest_candidate);
      return last >= now;
    });
    let html = '';
    const currentRoom = r.current_room || [];
    if (live.length) html += '<div class="tt-group"><div class="tt-group-title">🔴 会議中</div>' + live.map(d => _ttDecidedCard(d, serverNow, currentRoom)).join('') + '</div>';
    if (soon.length) html += '<div class="tt-group"><div class="tt-group-title">⏰ もうすぐ (30分以内)</div>' + soon.map(d => _ttDecidedCard(d, serverNow, currentRoom)).join('') + '</div>';
    if (today.length) html += '<div class="tt-group"><div class="tt-group-title">📅 本日この後</div>' + today.map(d => _ttDecidedCard(d, serverNow, currentRoom)).join('') + '</div>';
    if (later.length) html += '<div class="tt-group"><div class="tt-group-title">📆 今後の予定</div>' + later.map(d => _ttDecidedCard(d, serverNow, currentRoom)).join('') + '</div>';
    if (openLive.length) html += '<div class="tt-group"><div class="tt-group-title">📋 日程調整中</div>' + openLive.map(p => _ttOpenCard(p)).join('') + '</div>';
    if (!html) html = '<div class="tt-empty">予定はまだありません。「+ 日程調整一覧 / 新規予約」から作成できます。</div>';
    root.innerHTML = html;
  } catch (e) {
    root.innerHTML = '<div class="tt-empty">読み込みエラー</div>';
  }
}

init();
</script>
  <script src="/translate.js" defer></script>
