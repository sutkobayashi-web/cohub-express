<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🎙 ミーティング</title>
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg: #f8fafc; --fg: #0f172a; --mute: #64748b;
  --card: #ffffff; --border: #e2e8f0;
  --accent: #4f46e5; --accent-d: #3730a3;
  --danger: #ef4444; --warn: #f59e0b; --ok: #10b981;
  --zoom-bg: #1c1c1e; --zoom-tile: #2c2c2e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; }

/* === ロビー === */
.hd { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #4f46e5, #4338ca); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.hd a.back { color: #fff; text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.16); }
.hd .title { flex: 1; font-weight: 700; font-size: 16px; }
.hd .archive-btn { background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 12px; }

.body { padding: 18px; max-width: 760px; margin: 0 auto; }
.intro { color: var(--mute); font-size: 13px; line-height: 1.6; margin-bottom: 16px; }
.room-card {
  background: linear-gradient(135deg, #eef2ff, #e0e7ff);
  border: 1px solid #c7d2fe; border-radius: 16px; padding: 24px;
  text-align: center;
}
.room-card .ic { font-size: 48px; margin-bottom: 8px; }
.room-card .name { font-size: 20px; font-weight: 800; color: var(--accent-d); margin-bottom: 6px; }
.room-card .count { color: var(--mute); font-size: 14px; margin-bottom: 16px; }
.room-card .count b { color: var(--accent-d); font-size: 18px; }
.room-card .members {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  margin-bottom: 16px; min-height: 44px;
}
.room-card .members .ava {
  width: 36px; height: 36px; border-radius: 50%; background: #fff;
  border: 2px solid #c7d2fe; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.room-card .members .ava img { width: 100%; height: 100%; object-fit: cover; }
.room-card .members .empty { color: var(--mute); font-size: 12px; padding: 12px; }
.room-card .enter-btn {
  background: var(--accent); color: #fff; border: none;
  padding: 14px 36px; border-radius: 10px; font-size: 16px; font-weight: 800;
  cursor: pointer; box-shadow: 0 4px 12px rgba(79,70,229,0.35);
}
.room-card .enter-btn:hover { background: var(--accent-d); }

/* === 全画面ミーティングオーバーレイ === */
.fs-overlay {
  display: none; position: fixed; inset: 0; z-index: 9000;
  background: var(--zoom-bg); color: #fff;
  flex-direction: column;
}
.fs-overlay.show { display: flex; }
.fs-hd {
  background: rgba(0,0,0,0.4); padding: 8px 14px;
  display: flex; align-items: center; gap: 10px;
  font-size: 13px;
}
.fs-hd .room-name { flex: 1; font-weight: 700; }
.fs-hd .timer { font-family: ui-monospace, monospace; font-weight: 600; color: #cbd5e1; }
.fs-hd .stage-label { background: rgba(255,255,255,0.12); padding: 2px 8px; border-radius: 4px; font-size: 11px; }

.stage {
  flex: 1; overflow: hidden; padding: 10px;
  background: var(--zoom-bg);
}
/* グリッド（通常モード） */
.grid {
  height: 100%; display: grid; gap: 8px;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  grid-auto-rows: minmax(160px, 1fr);
  align-content: center; justify-content: center;
}
/* 画面共有モード: メイン画面1枚 + サムネ列 */
.stage.screen-mode { display: flex; gap: 8px; }
.stage.screen-mode .main-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 10px; overflow: hidden; }
.stage.screen-mode .main-area video { width: 100%; height: 100%; object-fit: contain; }
.stage.screen-mode .thumbs { width: 180px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; }
.stage.screen-mode .thumbs .tile { aspect-ratio: 4/3; min-height: 0; }

.tile {
  background: var(--zoom-tile); border-radius: 10px;
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.tile video { width: 100%; height: 100%; object-fit: cover; background: #000; }
.tile .placeholder {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #2c2c2e, #3c3c3e);
}
.tile .placeholder .ava-big {
  width: 90px; height: 90px; border-radius: 50%; background: #475569;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-size: 36px; color: #cbd5e1;
  border: 3px solid rgba(255,255,255,0.2);
}
.tile .placeholder .ava-big img { width: 100%; height: 100%; object-fit: cover; }
.tile .name {
  position: absolute; bottom: 6px; left: 8px; right: 8px;
  background: rgba(0,0,0,0.55); color: #fff; padding: 3px 8px;
  border-radius: 6px; font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: flex; align-items: center; gap: 4px;
}
.tile .name .icons { color: #fbbf24; }
.tile .badge-host { position: absolute; top: 6px; left: 8px; background: var(--accent); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
.tile.speaking { box-shadow: inset 0 0 0 3px var(--ok); }

.fs-controls {
  background: rgba(0,0,0,0.6); padding: 10px 14px;
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  align-items: center;
}
.ctrl-btn {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  background: #334155; color: #fff; border: none; padding: 8px 14px;
  border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
  min-width: 64px;
}
.ctrl-btn .ico { font-size: 18px; }
.ctrl-btn.on { background: #4338ca; }
.ctrl-btn.off { background: #7f1d1d; }
.ctrl-btn.start { background: var(--ok); padding: 10px 22px; min-width: 140px; }
.ctrl-btn.start:hover { background: #059669; }
.ctrl-btn.danger { background: #dc2626; }
.ctrl-btn:hover { filter: brightness(1.15); }
.ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* 議事録パネル (折り畳み) */
.transcript-panel {
  background: rgba(255,255,255,0.05); border-top: 1px solid rgba(255,255,255,0.1);
  padding: 10px 14px; max-height: 30vh; overflow-y: auto;
  display: none;
}
.transcript-panel.show { display: block; }
.transcript-panel .turn { font-size: 12px; line-height: 1.6; padding: 4px 0; color: #e5e7eb; }
.transcript-panel .turn .who { color: #a5b4fc; font-weight: 700; margin-right: 4px; }
.transcript-panel .empty { color: #94a3b8; font-size: 12px; text-align: center; padding: 20px; }

.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.92); color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 9500; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.err { background: var(--danger); }
.lock-state { background: rgba(220,38,38,0.18); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; color: #fca5a5; }
.lock-state.unlocked { background: rgba(16,185,129,0.18); color: #86efac; }
.dlg-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 9800; padding: 20px; }
.dlg-bg.show { display: flex; }
.dlg { background: #fff; color: var(--fg); border-radius: 12px; padding: 18px; width: 100%; max-width: 360px; }
.dlg h3 { margin: 0 0 8px 0; font-size: 16px; }
.dlg .desc { color: var(--mute); font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
.dlg input { width: 100%; padding: 10px 12px; font-size: 18px; border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, monospace; letter-spacing: 4px; text-align: center; }
.dlg .row { display: flex; gap: 8px; margin-top: 12px; }
.dlg button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
.dlg .btn-cancel { background: #e2e8f0; color: var(--fg); }
.dlg .btn-ok { background: var(--accent); color: #fff; }
.dlg .err-msg { color: var(--danger); font-size: 12px; margin-top: 6px; min-height: 14px; }
.passcode-display {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  border: 2px solid #f59e0b; border-radius: 10px;
  padding: 14px; text-align: center;
  font-family: ui-monospace, monospace; font-size: 28px; font-weight: 800;
  letter-spacing: 6px; color: #92400e;
  margin: 10px 0;
}

@media (max-width: 600px) {
  .body { padding: 14px; }
  .room-card { padding: 18px; }
  .stage.screen-mode { flex-direction: column; }
  .stage.screen-mode .thumbs { flex-direction: row; width: auto; height: 80px; overflow-x: auto; }
  .stage.screen-mode .thumbs .tile { flex: 0 0 auto; width: 100px; }
  .ctrl-btn { padding: 6px 10px; min-width: 54px; font-size: 10px; }
  .ctrl-btn .ico { font-size: 16px; }
}
</style>
</head>
<body>
<!-- ロビー -->
<div id="lobby">
  <div class="hd">
    <a href="/home" class="back">←</a>
    <div class="title">🎙 ミーティング</div>
    <a href="/meeting-archive" class="archive-btn">📚 議事録</a>
  </div>
  <div class="body">
    <div class="intro">
      会議室に入室すると、まずアバターで参加します。「会議開始」を押すとビデオ会議が始まり、画面共有や議事録も使えます。
    </div>
    <div class="room-card" id="room-card">
      <div class="ic">🎙</div>
      <div class="name" id="room-name">会議室</div>
      <div class="count">参加中: <b id="room-count">0</b>名</div>
      <div class="members" id="room-members"></div>
      <button class="enter-btn" onclick="enterRoom()">▶ 入室する</button>
    </div>
  </div>
</div>

<!-- 全画面ミーティング画面 -->
<div class="fs-overlay" id="fs">
  <div class="fs-hd">
    <span class="stage-label" id="stage-label">待機中</span>
    <div class="room-name" id="fs-name">🎙 会議室</div>
    <span class="lock-state unlocked" id="lock-state">🔓 未ロック</span>
    <div class="timer" id="fs-timer">00:00</div>
  </div>
  <div class="stage" id="stage">
    <div class="grid" id="grid"></div>
  </div>
  <div class="transcript-panel" id="ts-panel"></div>
  <div class="fs-controls" id="ctrls">
    <!-- 待機中: ビデオ開始ボタン中央 / 会議中: マイク・カメラ・共有・議事録・退室 -->
  </div>
</div>

<!-- パスコード入力ダイアログ (入室時) -->
<div class="dlg-bg" id="dlg-enter">
  <div class="dlg">
    <h3>🔒 鍵がかかっています</h3>
    <div class="desc">主催者から教えてもらった入室パスコードを入力してください。</div>
    <input id="enter-pass" type="text" inputmode="numeric" maxlength="20" placeholder="0000">
    <div class="err-msg" id="enter-err"></div>
    <div class="row">
      <button class="btn-cancel" onclick="closeEnterDlg()">キャンセル</button>
      <button class="btn-ok" onclick="submitEnterPass()">入室</button>
    </div>
  </div>
</div>

<!-- ロック設定ダイアログ (主催者) -->
<div class="dlg-bg" id="dlg-lock">
  <div class="dlg">
    <h3>🔒 入室パスコードを設定</h3>
    <div class="desc">参加者にこのパスコードを伝えてください。設定後の新規入室にロックがかかります。</div>
    <div class="passcode-display" id="lock-pass-disp">0000</div>
    <input id="lock-pass" type="text" inputmode="numeric" maxlength="20" placeholder="自動生成 (編集可)">
    <div class="row">
      <button class="btn-cancel" onclick="closeLockDlg()">キャンセル</button>
      <button class="btn-ok" onclick="confirmLock()">🔒 ロック</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const ROOM_ID = 'main';
const token = localStorage.getItem('cohub_token') || '';
let me = null;
let socket = null;
let stage = 'lobby';        // 'lobby' | 'waiting' | 'live'
let inRoom = false;
let localStream = null;
let screenStream = null;     // 画面共有時の MediaStream
let micOn = false, camOn = false, screenOn = false, recOn = false;
let peerConnections = new Map();   // uid → {pc, profile, stream, screenStream, hasScreen}
let peerProfiles = new Map();      // uid → profile (uid/display_name/avatar_url)
let peerStates = new Map();        // uid → {video_on, mic_on, screen_on}
let recognition = null;
let transcript = [];
let interimText = '';
let startedAt = null;
let timerHandle = null;
let mainScreenUid = null;    // 現在「メイン画面」に表示している画面共有のuid
let hostUid = null;           // 現在の主催者uid
let roomLocked = false;       // 部屋ロック状態
let pendingPasscode = '';     // 鍵をかけた状態で入室拒否されたとき再入力

const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }];

async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  if (r.status === 401) { location.replace('/'); return null; }
  return r.json();
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg, ms, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  setTimeout(() => t.classList.remove('show'), ms || 2200);
}
function $(id) { return document.getElementById(id); }

async function init() {
  if (!token) { location.replace('/'); return; }
  const r = await api('/api/auth/me');
  if (!r || !r.success) { location.replace('/'); return; }
  me = r.user;
  await refreshRoomStatus();
  setupSocket();
  // ロビー状態は10秒ごとに更新
  setInterval(() => { if (stage === 'lobby') refreshRoomStatus(); }, 10000);
}

async function refreshRoomStatus() {
  const r = await api('/api/meeting/rooms/status');
  if (!r || !r.success) return;
  const rm = r.rooms[0];
  if (!rm) return;
  $('room-name').textContent = rm.name;
  $('room-count').textContent = rm.count || 0;
  // 既存メンバーのアバター取得は API では返していないので、省略 (入室後にリアルタイムで見える)
  $('room-members').innerHTML = rm.count > 0
    ? '<div class="empty">' + rm.count + '名が参加中</div>'
    : '<div class="empty">まだ誰もいません</div>';
}

function setupSocket() {
  socket = io({ auth: { token } });
  socket.on('meeting:peers', async (data) => {
    // 既存メンバーのprofileは初期では空。peer-joined で来るのを待つ。
    for (const peerUid of data.peers) {
      if (!peerProfiles.has(peerUid)) peerProfiles.set(peerUid, { uid: peerUid, display_name: '...', avatar_url: '' });
    }
    hostUid = data.host_uid || null;
    roomLocked = !!data.locked;
    updateLockUI();
    renderTiles();
    renderControls();
  });
  socket.on('meeting:join-denied', (data) => {
    if (data.reason === 'passcode') {
      // 入室処理途中でロビーに戻す
      inRoom = false;
      stage = 'lobby';
      $('fs').classList.remove('show');
      $('lobby').style.display = '';
      if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }
      $('enter-err').textContent = 'パスコードが違います';
      $('enter-pass').value = '';
      $('dlg-enter').classList.add('show');
      setTimeout(() => $('enter-pass').focus(), 100);
    }
  });
  socket.on('meeting:lock-state', (data) => {
    roomLocked = !!data.locked;
    updateLockUI();
    renderControls();
    showToast(roomLocked ? '🔒 部屋がロックされました' : '🔓 ロックが解除されました', 1800);
  });
  socket.on('meeting:host-change', (data) => {
    hostUid = data.host_uid || null;
    const myUid = me.uid || me.id;
    if (hostUid === myUid) showToast('🎤 あなたが主催者になりました', 2000);
    renderControls();
    renderTiles();
  });
  socket.on('meeting:peer-joined', (profile) => {
    peerProfiles.set(profile.uid, profile);
    renderTiles();
    showToast('👤 ' + profile.display_name + ' が入室しました', 1500);
  });
  socket.on('meeting:peer-left', (data) => {
    const pc = peerConnections.get(data.uid);
    if (pc) { try { pc.pc.close(); } catch (e) {} peerConnections.delete(data.uid); }
    const name = (peerProfiles.get(data.uid) || {}).display_name || '';
    peerProfiles.delete(data.uid);
    peerStates.delete(data.uid);
    if (mainScreenUid === data.uid) mainScreenUid = null;
    renderTiles();
    if (name) showToast('👋 ' + name + ' が退室しました', 1500);
  });
  socket.on('meeting:state', (data) => {
    peerStates.set(data.uid, { video_on: data.video_on, mic_on: data.mic_on, screen_on: data.screen_on });
    // 自分がビデオONなら、ビデオONした相手とpeer接続を確立 (offerを送る)
    if (data.video_on && (camOn || micOn) && !peerConnections.has(data.uid)) {
      callPeer(data.uid, true);
    }
    // 画面共有モード判定
    updateScreenMode();
    renderTiles();
  });
  socket.on('meeting:signal', async (data) => {
    const peerUid = data.from;
    let entry = peerConnections.get(peerUid);
    if (!entry) entry = await callPeer(peerUid, false);
    if (!entry) return;
    const pc = entry.pc;
    try {
      if (data.type === 'offer') {
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        socket.emit('meeting:signal', { to: peerUid, type: 'answer', payload: ans });
      } else if (data.type === 'answer') {
        await pc.setRemoteDescription(new RTCSessionDescription(data.payload));
      } else if (data.type === 'ice') {
        await pc.addIceCandidate(new RTCIceCandidate(data.payload));
      }
    } catch (e) { console.error('signal error', e); }
  });
}

async function callPeer(peerUid, isOfferer) {
  if (peerConnections.has(peerUid)) return peerConnections.get(peerUid);
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  // 自分が持っているトラックを追加
  const senderTracks = [];
  if (localStream) for (const t of localStream.getTracks()) senderTracks.push(pc.addTrack(t, localStream));
  if (screenStream) for (const t of screenStream.getTracks()) senderTracks.push(pc.addTrack(t, screenStream));
  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('meeting:signal', { to: peerUid, type: 'ice', payload: e.candidate });
  };
  pc.ontrack = (e) => {
    let entry = peerConnections.get(peerUid);
    if (!entry) return;
    // ストリーム識別: 単一trackで判別不能なので、相手のscreen_on状態を見て screenStream か localStream を区別する
    const peerState = peerStates.get(peerUid) || {};
    const stream = e.streams[0];
    if (peerState.screen_on && !entry.screenStream) {
      // 2本目のストリーム来たら screenStream とみなす (簡易判定)
      if (entry.stream && entry.stream !== stream) {
        entry.screenStream = stream;
      } else {
        entry.stream = stream;
      }
    } else {
      entry.stream = stream;
    }
    updateScreenMode();
    renderTiles();
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'closed'].includes(pc.connectionState)) {
      peerConnections.delete(peerUid);
      renderTiles();
    }
  };
  const entry = { pc, profile: peerProfiles.get(peerUid) || { uid: peerUid, display_name: '...', avatar_url: '' }, stream: null, screenStream: null, senderTracks };
  peerConnections.set(peerUid, entry);
  if (isOfferer) {
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
    await pc.setLocalDescription(offer);
    socket.emit('meeting:signal', { to: peerUid, type: 'offer', payload: offer });
  }
  return entry;
}

// ロビー → 入室 (アバター待機)
async function enterRoom() {
  // 部屋のロック状態を事前に問い合わせ
  socket.emit('meeting:peek', { roomId: ROOM_ID });
  const peek = await new Promise((resolve) => {
    const handler = (data) => { resolve(data); };
    socket.once('meeting:peek', handler);
    setTimeout(() => resolve(null), 1500);
  });
  if (peek && peek.locked && peek.count > 0) {
    pendingPasscode = '';
    $('enter-err').textContent = '';
    $('enter-pass').value = '';
    $('dlg-enter').classList.add('show');
    setTimeout(() => $('enter-pass').focus(), 100);
    return;
  }
  doJoin('');
}

function doJoin(passcode) {
  inRoom = true;
  stage = 'waiting';
  socket.emit('meeting:join', { roomId: ROOM_ID, passcode });
  $('lobby').style.display = 'none';
  $('fs').classList.add('show');
  $('stage-label').textContent = '⌛ 待機中 (ビデオOFF)';
  startedAt = Date.now();
  startTimer();
  renderTiles();
  renderControls();
}

function submitEnterPass() {
  const pass = $('enter-pass').value.trim();
  if (!pass) { $('enter-err').textContent = 'パスコードを入力してください'; return; }
  pendingPasscode = pass;
  $('dlg-enter').classList.remove('show');
  doJoin(pass);
}
function closeEnterDlg() {
  $('dlg-enter').classList.remove('show');
}

function updateLockUI() {
  const el = $('lock-state');
  if (!el) return;
  if (roomLocked) {
    el.textContent = '🔒 ロック中';
    el.className = 'lock-state';
  } else {
    el.textContent = '🔓 未ロック';
    el.className = 'lock-state unlocked';
  }
}

function isHost() { return hostUid === (me.uid || me.id); }

function openLockDlg() {
  // 自動生成パスコード (4桁)
  const auto = String(Math.floor(1000 + Math.random() * 9000));
  $('lock-pass').value = auto;
  $('lock-pass-disp').textContent = auto;
  $('lock-pass').oninput = () => { $('lock-pass-disp').textContent = $('lock-pass').value || '0000'; };
  $('dlg-lock').classList.add('show');
}
function closeLockDlg() { $('dlg-lock').classList.remove('show'); }
function confirmLock() {
  const pass = $('lock-pass').value.trim();
  if (!pass) { showToast('パスコードを入力してください', 1500, true); return; }
  socket.emit('meeting:lock', { locked: true, passcode: pass });
  $('dlg-lock').classList.remove('show');
  // 主催者本人にもパスコードを表示しておく
  showToast('🔒 パスコード: ' + pass, 4500);
}
function unlockRoom() {
  socket.emit('meeting:lock', { locked: false });
}

// アバター待機 → ビデオ開始
async function startVideoMeeting() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { width: 640, height: 480 } });
  } catch (e) {
    showToast('マイク/カメラの取得失敗: ' + e.message, 3500, true);
    return;
  }
  micOn = true; camOn = true;
  stage = 'live';
  $('stage-label').textContent = '🔴 会議中';
  // 既存メンバー全員と接続 (自分がofferer)
  for (const [uid] of peerProfiles) {
    if (!peerConnections.has(uid)) await callPeer(uid, true);
  }
  // 状態通知
  socket.emit('meeting:state', { video_on: true, mic_on: micOn, screen_on: false });
  renderTiles();
  renderControls();
}

function startTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (!startedAt) return;
    const sec = Math.floor((Date.now() - startedAt) / 1000);
    const mm = String(Math.floor(sec / 60)).padStart(2, '0');
    const ss = String(sec % 60).padStart(2, '0');
    $('fs-timer').textContent = mm + ':' + ss;
  }, 1000);
}

function renderControls() {
  const c = $('ctrls');
  const lockBtn = isHost()
    ? (roomLocked
        ? `<button class="ctrl-btn on" onclick="unlockRoom()"><span class="ico">🔓</span><span>ロック解除</span></button>`
        : `<button class="ctrl-btn" onclick="openLockDlg()"><span class="ico">🔒</span><span>鍵をかける</span></button>`)
    : '';
  if (stage === 'waiting') {
    c.innerHTML = `
      <button class="ctrl-btn start" onclick="startVideoMeeting()"><span class="ico">🎥</span><span>会議開始 (ビデオON)</span></button>
      ${lockBtn}
      <button class="ctrl-btn danger" onclick="leaveRoom()"><span class="ico">⏏</span><span>退室</span></button>`;
  } else if (stage === 'live') {
    c.innerHTML = `
      <button class="ctrl-btn ${micOn ? 'on' : 'off'}" onclick="toggleMic()"><span class="ico">${micOn ? '🎤' : '🔇'}</span><span>${micOn ? 'マイク' : 'マイクOFF'}</span></button>
      <button class="ctrl-btn ${camOn ? 'on' : 'off'}" onclick="toggleCam()"><span class="ico">${camOn ? '🎥' : '📷'}</span><span>${camOn ? 'カメラ' : 'カメラOFF'}</span></button>
      <button class="ctrl-btn ${screenOn ? 'on' : ''}" onclick="toggleScreenShare()"><span class="ico">🖥️</span><span>${screenOn ? '共有中' : '画面共有'}</span></button>
      <button class="ctrl-btn ${recOn ? 'on' : ''}" onclick="toggleRec()"><span class="ico">📝</span><span>${recOn ? '議事録ON' : '議事録'}</span></button>
      ${lockBtn}
      <button class="ctrl-btn danger" onclick="leaveRoom()"><span class="ico">⏏</span><span>退室</span></button>`;
  }
}

function avatarPlaceholder(profile) {
  if (profile.avatar_url) return `<img src="${escapeHtml(profile.avatar_url)}" alt="">`;
  return '👤';
}

function tileHtml(uid, profile, stream, isSelf, isHost, mySpeaking) {
  const idAttr = isSelf ? 'vid-self' : 'vid-' + uid;
  const placeholder = `<div class="placeholder"><div class="ava-big">${avatarPlaceholder(profile)}</div></div>`;
  const showVideo = !!stream;
  const peerState = peerStates.get(uid) || {};
  const camFlag = isSelf ? camOn : peerState.video_on;
  const micFlag = isSelf ? micOn : peerState.mic_on;
  const icons = (!micFlag ? '🔇' : '');
  const hostBadge = isHost ? '<span class="badge-host">主催</span>' : '';
  return `<div class="tile">
    ${hostBadge}
    ${(showVideo && camFlag) ? `<video id="${idAttr}" autoplay playsinline${isSelf ? ' muted' : ''}></video>` : placeholder}
    <div class="name">${escapeHtml(profile.display_name || '...')}${isSelf ? ' (自分)' : ''} <span class="icons">${icons}</span></div>
  </div>`;
}

function updateScreenMode() {
  // 誰かがscreen_on=true なら画面共有モード
  let screenUid = null;
  if (screenOn) screenUid = me.uid || me.id;
  else for (const [uid, st] of peerStates) if (st.screen_on) { screenUid = uid; break; }
  mainScreenUid = screenUid;
  if (screenUid) {
    $('stage').classList.add('screen-mode');
  } else {
    $('stage').classList.remove('screen-mode');
  }
}

function renderTiles() {
  if (stage === 'lobby') return;
  const stageEl = $('stage');
  const myUid = me.uid || me.id;
  const myProf = { uid: myUid, display_name: me.display_name, avatar_url: me.avatar_url };

  // 全タイル定義 (自分 + ピア)
  const tiles = [];
  tiles.push({ uid: myUid, profile: myProf, stream: localStream, isSelf: true });
  for (const [uid, prof] of peerProfiles) {
    const entry = peerConnections.get(uid);
    tiles.push({ uid, profile: prof, stream: entry ? entry.stream : null, isSelf: false });
  }

  if (mainScreenUid) {
    // 画面共有モード: メイン領域 + サムネ
    let mainStream = null;
    if (mainScreenUid === myUid) mainStream = screenStream;
    else {
      const entry = peerConnections.get(mainScreenUid);
      if (entry) mainStream = entry.screenStream || entry.stream;
    }
    const mainHtml = mainStream ? '<video id="main-screen-video" autoplay playsinline></video>' : '<div style="color:#94a3b8;">画面共有準備中…</div>';
    let html = '<div class="main-area">' + mainHtml + '</div>';
    html += '<div class="thumbs">';
    for (const t of tiles) html += tileHtml(t.uid, t.profile, t.stream, t.isSelf);
    html += '</div>';
    stageEl.innerHTML = html;
    if (mainStream) {
      const v = document.getElementById('main-screen-video');
      if (v) v.srcObject = mainStream;
    }
  } else {
    let html = '<div class="grid">';
    for (const t of tiles) html += tileHtml(t.uid, t.profile, t.stream, t.isSelf);
    html += '</div>';
    stageEl.innerHTML = html;
  }
  // 各タイルの video.srcObject を再アタッチ
  if (localStream) {
    const v = document.getElementById('vid-self');
    if (v) { v.srcObject = localStream; v.muted = true; }
  }
  for (const [uid, entry] of peerConnections) {
    if (entry.stream) {
      const v = document.getElementById('vid-' + uid);
      if (v) v.srcObject = entry.stream;
    }
  }
}

function toggleMic() {
  micOn = !micOn;
  if (localStream) for (const t of localStream.getAudioTracks()) t.enabled = micOn;
  socket.emit('meeting:state', { video_on: camOn, mic_on: micOn, screen_on: screenOn });
  renderControls();
  renderTiles();
}

function toggleCam() {
  camOn = !camOn;
  if (localStream) for (const t of localStream.getVideoTracks()) t.enabled = camOn;
  socket.emit('meeting:state', { video_on: camOn, mic_on: micOn, screen_on: screenOn });
  renderControls();
  renderTiles();
}

async function toggleScreenShare() {
  if (!screenOn) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    } catch (e) {
      showToast('画面共有がキャンセルされました', 2000);
      return;
    }
    screenOn = true;
    // 既存ピアに画面共有trackを追加
    for (const [, entry] of peerConnections) {
      for (const t of screenStream.getTracks()) entry.pc.addTrack(t, screenStream);
      // 再ネゴシエーションが必要だが簡略化のため省略 (新規参加者には callPeer 時に渡る)
      // 既存接続には offer を再送
      try {
        const offer = await entry.pc.createOffer();
        await entry.pc.setLocalDescription(offer);
        socket.emit('meeting:signal', { to: entry.profile.uid, type: 'offer', payload: offer });
      } catch (e) {}
    }
    // 共有停止イベント
    screenStream.getVideoTracks()[0].onended = () => stopScreenShare();
    socket.emit('meeting:state', { video_on: camOn, mic_on: micOn, screen_on: true });
    updateScreenMode();
    renderControls();
    renderTiles();
  } else {
    stopScreenShare();
  }
}

function stopScreenShare() {
  if (screenStream) {
    for (const t of screenStream.getTracks()) t.stop();
    screenStream = null;
  }
  screenOn = false;
  socket.emit('meeting:state', { video_on: camOn, mic_on: micOn, screen_on: false });
  updateScreenMode();
  renderControls();
  renderTiles();
}

function toggleRec() {
  recOn = !recOn;
  if (recOn) startRecognition(); else stopRecognition();
  $('ts-panel').classList.toggle('show', recOn);
  renderControls();
}

function startRecognition() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) {
    showToast('このブラウザは文字起こし非対応 (Chrome推奨)', 3000, true);
    recOn = false;
    return;
  }
  recognition = new SpeechRec();
  recognition.lang = 'ja-JP';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        const txt = r[0].transcript.trim();
        if (txt) {
          transcript.push({ at: new Date().toISOString(), who: me.display_name, text: txt });
          renderTranscript();
        }
      } else interim += r[0].transcript;
    }
    interimText = interim;
    renderTranscript();
  };
  recognition.onerror = (e) => {
    if (['no-speech','aborted'].includes(e.error)) return;
    console.warn('SpeechRecognition error:', e.error);
  };
  recognition.onend = () => { if (recOn) try { recognition.start(); } catch (e) {} };
  try { recognition.start(); } catch (e) {}
}

function stopRecognition() {
  if (recognition) { try { recognition.stop(); } catch (e) {} recognition = null; }
  interimText = '';
}

function renderTranscript() {
  const el = $('ts-panel');
  if (!transcript.length && !interimText) { el.innerHTML = '<div class="empty">議事録ON: 自分の発話が記録されます</div>'; return; }
  let html = transcript.map(t => `<div class="turn"><span class="who">${escapeHtml(t.who)}</span>${escapeHtml(t.text)}</div>`).join('');
  if (interimText) html += `<div class="turn" style="opacity:0.5;font-style:italic;"><span class="who">${escapeHtml(me.display_name)}</span>${escapeHtml(interimText)}…</div>`;
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

async function leaveRoom() {
  const endedAt = new Date().toISOString();
  const startedAtIso = startedAt ? new Date(startedAt).toISOString() : null;
  const myUid = me.uid || me.id;
  const participants = [myUid, ...peerProfiles.keys()];
  const fullText = transcript.map(t => `[${new Date(t.at).toLocaleTimeString('ja-JP')}] ${t.who}: ${t.text}`).join('\n');

  // クリーンアップ
  if (socket) socket.emit('meeting:leave');
  for (const [, entry] of peerConnections) try { entry.pc.close(); } catch (e) {}
  peerConnections.clear();
  peerProfiles.clear();
  peerStates.clear();
  if (localStream) for (const t of localStream.getTracks()) t.stop();
  if (screenStream) for (const t of screenStream.getTracks()) t.stop();
  localStream = null; screenStream = null;
  micOn = false; camOn = false; screenOn = false;
  stopRecognition();
  recOn = false;
  if (timerHandle) { clearInterval(timerHandle); timerHandle = null; }

  // 議事録保存
  if (fullText.length > 0) {
    showToast('議事録を保存中…', 2000);
    try {
      const r = await api('/api/meeting/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ room_id: ROOM_ID, started_at: startedAtIso, ended_at: endedAt, participants, transcript: fullText }),
      });
      if (r && r.success) showToast('✅ 議事録を保存しました');
    } catch (e) { showToast('保存エラー: ' + e.message, 3000, true); }
  }

  inRoom = false; stage = 'lobby';
  transcript = []; interimText = ''; mainScreenUid = null;
  hostUid = null; roomLocked = false;
  updateLockUI();
  $('fs').classList.remove('show');
  $('lobby').style.display = '';
  $('fs-timer').textContent = '00:00';
  $('ts-panel').classList.remove('show');
  await refreshRoomStatus();
}

window.addEventListener('beforeunload', () => {
  if (inRoom && socket) socket.emit('meeting:leave');
});

init();
</script>
