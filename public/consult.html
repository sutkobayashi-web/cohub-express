<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>今日の一歩、明日の自分 — プランを選ぶ — CoWell</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<meta name="theme-color" content="#3b82f6">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; min-height: 100%; overscroll-behavior: contain; overflow-x: hidden; max-width: 100%; }
body { font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: linear-gradient(180deg,#eff6ff,#f0f9ff); color: #0f172a; padding-bottom: 24px; }
header { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg,#3b82f6,#1e3a8a); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
header h1 { margin: 0; font-size: 16px; font-weight: 800; }
header .close { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
main { max-width: 720px; margin: 0 auto; padding: 14px; }

/* 挨拶 */
.intro { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(59,130,246,0.08); }
.intro img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(59,130,246,0.18); flex-shrink: 0; background: #fff; }
.intro-text { flex: 1; }
.intro-name { font-weight: 800; font-size: 14px; color: #1e3a8a; }
.intro-msg { font-size: 13px; color: #475569; margin-top: 4px; line-height: 1.6; }

/* セクションタイトル */
.sec-title { font-size: 13px; font-weight: 800; color: #1e3a8a; margin: 16px 4px 8px; display: flex; align-items: center; gap: 6px; }
.sec-title .pill { font-size: 10px; background: #dbeafe; color: #1e3a8a; padding: 2px 8px; border-radius: 8px; font-weight: 700; }

/* カテゴリフィルタ */
.cat-bar { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cat-chip { padding: 6px 12px; border-radius: 18px; border: 1.5px solid #cbd5e1; background: #fff; font-size: 12px; font-weight: 700; color: #475569; cursor: pointer; transition: all 0.15s; }
.cat-chip.active { background: linear-gradient(135deg,#3b82f6,#1e40af); color: #fff; border-color: #1e40af; box-shadow: 0 2px 6px rgba(59,130,246,0.3); }

/* プランギャラリー */
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 560px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
.plan-card { background: #fff; border-radius: 14px; padding: 14px 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer; border: 2px solid transparent; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px; min-height: 130px; text-align: left; }
.plan-card:hover { border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(59,130,246,0.15); }
.plan-card:active { transform: translateY(0); }
.plan-card .icon { font-size: 30px; line-height: 1; }
.plan-card .title { font-size: 13.5px; font-weight: 800; color: #1e3a8a; line-height: 1.35; }
.plan-card .action { font-size: 11.5px; color: #64748b; line-height: 1.5; flex: 1; }
.plan-card .cat-tag { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 8px; align-self: flex-start; }
.cat-tag.move  { background: #dcfce7; color: #047857; }
.cat-tag.meal  { background: #fef3c7; color: #92400e; }
.cat-tag.sleep { background: #e0e7ff; color: #3730a3; }
.cat-tag.rest  { background: #ede9fe; color: #6b21a8; }
.cat-tag.drink { background: #fee2e2; color: #991b1b; }
.cat-tag.mind  { background: #cffafe; color: #155e75; }

/* モーダル */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.65); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 0; }
.modal-bg.show { display: flex; }
@media (min-width: 560px) { .modal-bg { align-items: center; padding: 16px; } }
.modal { background: #fff; border-radius: 18px 18px 0 0; max-width: 480px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 16px 18px 20px; }
@media (min-width: 560px) { .modal { border-radius: 18px; } }
.modal h2 { margin: 0 0 4px; font-size: 18px; color: #1e3a8a; display: flex; align-items: center; gap: 8px; }
.modal .why { font-size: 12px; color: #64748b; background: #f1f5f9; padding: 8px 10px; border-radius: 8px; margin: 8px 0 14px; line-height: 1.6; }
.modal .action-line { background: linear-gradient(135deg,#dbeafe,#bfdbfe); border-left: 4px solid #3b82f6; padding: 10px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: #1e3a8a; margin-bottom: 14px; line-height: 1.6; }
.modal .lbl { font-size: 12px; font-weight: 800; color: #1e3a8a; margin: 6px 0 8px; }

/* 期間選択 */
.periods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.period { padding: 12px 6px; border-radius: 10px; background: #f8fafc; border: 2px solid #e2e8f0; cursor: pointer; text-align: center; transition: all 0.15s; }
.period.selected { background: linear-gradient(135deg,#dbeafe,#bfdbfe); border-color: #1e40af; box-shadow: 0 2px 6px rgba(59,130,246,0.2); }
.period.locked { opacity: 0.45; cursor: not-allowed; background: #f8fafc; }
.period .pd { font-size: 18px; font-weight: 800; color: #1e3a8a; }
.period .ps { font-size: 10.5px; color: #64748b; margin-top: 2px; }
.period.locked .ps { color: #94a3b8; }
.period .lk { font-size: 14px; color: #94a3b8; }
.lock-hint { font-size: 11px; color: #64748b; background: #fef3c7; padding: 8px 10px; border-radius: 6px; line-height: 1.5; margin-bottom: 12px; }
.lock-hint.success { background: #dcfce7; color: #166534; }

.modal-btns { display: flex; gap: 8px; margin-top: 14px; }
.modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; }
.modal-btn.start { background: linear-gradient(135deg,#10b981,#059669); color: #fff; box-shadow: 0 2px 8px rgba(16,185,129,0.3); }
.modal-btn.start:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
.modal-btn.cancel { background: #f1f5f9; color: #475569; flex: 0 0 100px; }

/* 既存プランの警告 */
.warn-existing { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 10px 12px; border-radius: 8px; font-size: 12px; color: #78350f; margin-bottom: 12px; line-height: 1.6; }

/* エラー / ローディング */
.err-msg { background: #fef2f2; border-left: 4px solid #ef4444; color: #991b1b; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; display: none; }
.err-msg.show { display: block; }
.loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: none; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 12px; }
.loading-overlay.show { display: flex; }
.spin { width: 48px; height: 48px; border: 4px solid #dbeafe; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ログインオーバーレイ */
.login-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
.login-overlay.show { display: flex; }
.login-card { background: #fff; border-radius: 14px; padding: 24px; max-width: 320px; width: 90%; }
.login-card h2 { margin: 0 0 16px; font-size: 16px; color: #1e3a8a; }
.login-card input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
.login-card .btn { width: 100%; padding: 11px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
.login-err { color: #ef4444; font-size: 12px; margin-top: 8px; min-height: 16px; }
</style>
</head>
<body data-app-version="20260520-1">

<header>
  <div style="flex:1;line-height:1.2;">
    <h1>🩺 今日の一歩、明日の自分</h1>
    <div style="font-size:10px;font-weight:600;opacity:0.85;margin-top:2px;">プランを選ぶ</div>
  </div>
  <button class="close" onclick="closePage()">閉じる</button>
</header>

<main>

  <!-- 挨拶 -->
  <div class="intro">
    <img src="/assets/concierge_health_avatar.png?v=8" alt="ヘルスアドバイザー">
    <div class="intro-text">
      <div class="intro-name">🩺 ヘルスアドバイザー</div>
      <div class="intro-msg" id="intro-msg">15個のシンプルなプランから1つ選んで、3日間から始めよう。毎日「○△✕休」をタップするだけで、私が翌日まで一緒に走るよ。</div>
    </div>
  </div>

  <div class="err-msg" id="err"></div>

  <!-- カテゴリフィルタ -->
  <div class="sec-title">📚 ジャンルで絞る <span class="pill" id="plan-count">15件</span></div>
  <div class="cat-bar" id="cat-bar"></div>

  <!-- プランギャラリー -->
  <div class="gallery" id="gallery"></div>

</main>

<!-- プラン詳細モーダル -->
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-body"></div>
</div>

<div class="loading-overlay" id="loading-overlay">
  <div class="spin"></div>
  <p style="font-size:13px;color:#475569;">プランを開始しています…</p>
</div>

<!-- ログインオーバーレイ -->
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>🩺 健康管理室にログイン</h2>
    <input type="text" id="li-id" placeholder="社員ID">
    <input type="password" id="li-pw" placeholder="パスワード">
    <button class="btn" onclick="doLogin()">ログイン</button>
    <div class="login-err" id="li-err"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('cohub_token') || '';
let me = null; try { me = JSON.parse(localStorage.getItem('cohub_user') || 'null'); } catch {}
let basicData = null;     // { plans, categories, periods, first_cycle_done, allowed_period_kinds }
let activePlan = null;    // 現在進行中があれば
let selectedCat = 'all';

async function api(p, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(p, opts);
  if (r.status === 401) { showLogin(); throw new Error('401'); }
  return r.json();
}

function showLogin(err) {
  document.getElementById('login-overlay').classList.add('show');
  if (err) document.getElementById('li-err').textContent = err;
}
async function doLogin() {
  const id = document.getElementById('li-id').value.trim();
  const pw = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  err.textContent = '';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login_id: id, password: pw }) });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || '失敗'; return; }
    token = d.token;
    localStorage.setItem('cohub_token', token);
    localStorage.setItem('cohub_user', JSON.stringify(d.user));
    me = d.user;
    document.getElementById('login-overlay').classList.remove('show');
    init();
  } catch (e) { err.textContent = '通信エラー'; }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function closePage() {
  if (window.history.length > 1) window.history.back();
  else location.replace('/');
}

async function init() {
  try {
    const [bd, ap] = await Promise.all([
      api('/api/myplan/basic_plans'),
      api('/api/myplan/active'),
    ]);
    if (!bd.success) throw new Error(bd.msg || 'プラン取得失敗');
    basicData = bd;
    activePlan = ap && ap.plan;
    renderCategories();
    renderGallery();
  } catch (e) {
    if (String(e.message) !== '401') {
      document.getElementById('err').textContent = '通信エラー: ' + e.message;
      document.getElementById('err').classList.add('show');
    }
  }
}

function renderCategories() {
  const bar = document.getElementById('cat-bar');
  const cats = basicData.categories || {};
  const counts = { all: basicData.plans.length };
  for (const p of basicData.plans) counts[p.cat] = (counts[p.cat] || 0) + 1;
  let html = `<button class="cat-chip ${selectedCat==='all'?'active':''}" data-cat="all">すべて (${counts.all})</button>`;
  for (const key of Object.keys(cats)) {
    if (!counts[key]) continue;
    html += `<button class="cat-chip ${selectedCat===key?'active':''}" data-cat="${key}">${esc(cats[key].label)} (${counts[key]})</button>`;
  }
  bar.innerHTML = html;
  bar.querySelectorAll('.cat-chip').forEach(b => {
    b.addEventListener('click', () => {
      selectedCat = b.getAttribute('data-cat');
      renderCategories();
      renderGallery();
    });
  });
}

function renderGallery() {
  const gallery = document.getElementById('gallery');
  const filt = (selectedCat === 'all') ? basicData.plans : basicData.plans.filter(p => p.cat === selectedCat);
  document.getElementById('plan-count').textContent = filt.length + '件';
  let html = '';
  for (const p of filt) {
    const cm = (basicData.categories && basicData.categories[p.cat]) || { label: p.cat };
    html += `<button class="plan-card" data-id="${p.id}">
      <div class="icon">${esc(p.icon || '🌱')}</div>
      <div class="title">${esc(p.title)}</div>
      <div class="action">${esc(p.action)}</div>
      <span class="cat-tag ${esc(p.cat)}">${esc(cm.label)}</span>
    </button>`;
  }
  gallery.innerHTML = html;
  gallery.querySelectorAll('.plan-card').forEach(b => {
    b.addEventListener('click', () => openDetail(b.getAttribute('data-id')));
  });
}

function openDetail(planId) {
  const plan = basicData.plans.find(p => p.id === planId);
  if (!plan) return;
  const cm = (basicData.categories && basicData.categories[plan.cat]) || { label: plan.cat };
  const allowed = basicData.allowed_period_kinds || ['starter'];
  const firstDone = basicData.first_cycle_done;
  const periods = basicData.periods || [];
  // 選択中の期間 (デフォルトは starter)
  let selectedDays = 3;
  const periodsHtml = periods.map(p => {
    const locked = !allowed.includes(p.kind);
    return `<button class="period ${locked?'locked':''} ${p.days===selectedDays?'selected':''}"
      data-days="${p.days}" data-locked="${locked?1:0}">
      <div class="pd">${p.days}日</div>
      <div class="ps">${esc(p.short)}</div>
      ${locked ? '<div class="lk">🔒</div>' : ''}
    </button>`;
  }).join('');

  const existingWarn = (activePlan && activePlan.status === 'active') ? `
    <div class="warn-existing">
      ⚠️ 現在「<b>${esc(activePlan.title)}</b>」(${activePlan.period_days}日プラン, ${activePlan.day_index}日目) が進行中です。<br>
      新しいプランを始めると、現在のプランは <b>中止</b> されカレンダーから外れます。完走履歴は残ります。
    </div>` : '';

  const lockHint = firstDone
    ? `<div class="lock-hint success">✅ 初回プラン完走済み。すべての期間が選べます。</div>`
    : `<div class="lock-hint">🔒 まず <b>3日プラン</b> から始めましょう。完走すると 1週間〜3ヶ月のプランが解放されます。</div>`;

  document.getElementById('modal-body').innerHTML = `
    <h2><span style="font-size:28px;">${esc(plan.icon)}</span> ${esc(plan.title)}</h2>
    <div style="font-size:11px;color:#64748b;margin-bottom:6px;">${esc(cm.label)}</div>
    <div class="action-line">→ ${esc(plan.action)}</div>
    <div class="why">💡 <b>なぜこれが効くか</b>: ${esc(plan.why)}</div>
    ${existingWarn}
    <div class="lbl">📅 期間を選ぶ</div>
    ${lockHint}
    <div class="periods" id="period-grid">${periodsHtml}</div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeModal()">戻る</button>
      <button class="modal-btn start" id="btn-start">このプランを始める</button>
    </div>
  `;
  document.getElementById('modal').classList.add('show');

  const grid = document.getElementById('period-grid');
  grid.querySelectorAll('.period').forEach(b => {
    b.addEventListener('click', () => {
      if (b.getAttribute('data-locked') === '1') return;
      selectedDays = parseInt(b.getAttribute('data-days'));
      grid.querySelectorAll('.period').forEach(x => x.classList.remove('selected'));
      b.classList.add('selected');
    });
  });
  document.getElementById('btn-start').addEventListener('click', () => startPlan(plan.id, selectedDays));
}

function closeModal() { document.getElementById('modal').classList.remove('show'); }

async function startPlan(planId, days) {
  if (activePlan && activePlan.status === 'active') {
    if (!confirm('現在のプランを中止して、新しいプランを始めますか?')) return;
  }
  document.getElementById('loading-overlay').classList.add('show');
  try {
    const r = await api('/api/myplan/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ basic_plan_id: planId, period_days: days }),
    });
    if (!r.success) {
      document.getElementById('loading-overlay').classList.remove('show');
      alert(r.msg || '開始失敗');
      return;
    }
    location.replace('/myplan.html');
  } catch (e) {
    document.getElementById('loading-overlay').classList.remove('show');
    if (String(e.message) !== '401') alert('通信エラー');
  }
}

// 起動
if (!token) showLogin();
else init();
</script>
</body>
</html>
