<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📚 議事録</title>
<style>
:root { --bg:#f8fafc; --fg:#0f172a; --mute:#64748b; --card:#fff; --border:#e2e8f0; --accent:#4f46e5; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; }
.hd { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #4f46e5, #4338ca); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.hd a.back { color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,0.16); font-weight: 600; }
.hd .title { flex: 1; font-weight: 700; }
.body { max-width: 800px; margin: 0 auto; padding: 16px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; cursor: pointer; }
.item:hover { border-color: var(--accent); }
.item .title-row { display: flex; align-items: center; gap: 8px; }
.item .room { background: #eef2ff; color: var(--accent); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 700; }
.item .ttl { flex: 1; font-weight: 700; font-size: 14px; }
.item .when { color: var(--mute); font-size: 11px; }
.item .summary { color: var(--mute); font-size: 12px; line-height: 1.6; margin-top: 8px; white-space: pre-wrap; }
.empty { padding: 60px 20px; text-align: center; color: var(--mute); }
.detail-bg { position: fixed; inset: 0; background: rgba(15,23,42,0.7); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.detail-bg.show { display: flex; }
.detail { background: #fff; border-radius: 14px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 18px; }
.detail h2 { margin: 0 0 8px; font-size: 18px; }
.detail .meta { color: var(--mute); font-size: 12px; margin-bottom: 14px; }
.detail .summary-block { background: #eef2ff; border-left: 3px solid var(--accent); padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; white-space: pre-wrap; font-size: 13px; line-height: 1.7; }
.detail .transcript-block { background: #f8fafc; border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; max-height: 360px; overflow-y: auto; font-size: 12px; line-height: 1.6; white-space: pre-wrap; font-family: ui-monospace, monospace; }
.detail .close-btn { display: block; width: 100%; margin-top: 14px; padding: 10px; background: #1e293b; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="hd">
  <a href="/meeting" class="back">←</a>
  <div class="title">📚 ミーティング議事録</div>
</div>
<div class="body">
  <div class="list" id="list"></div>
</div>

<div class="detail-bg" id="detail-bg" onclick="if(event.target.id==='detail-bg') closeDetail()">
  <div class="detail" id="detail">
    <h2 id="d-title">-</h2>
    <div class="meta" id="d-meta"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px;">📋 AI要約</div>
    <div class="summary-block" id="d-summary"></div>
    <div style="font-weight:700;font-size:13px;margin-bottom:6px;">📝 文字起こし全文</div>
    <div class="transcript-block" id="d-transcript"></div>
    <button class="close-btn" onclick="closeDetail()">閉じる</button>
  </div>
</div>

<script>
const token = localStorage.getItem('cohub_token') || '';
async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  if (r.status === 401) { location.replace('/'); return null; }
  return r.json();
}
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init() {
  if (!token) { location.replace('/'); return; }
  const r = await api('/api/meeting/list?limit=50');
  if (!r || !r.success) return;
  const el = document.getElementById('list');
  if (!r.meetings.length) { el.innerHTML = '<div class="empty">まだ議事録はありません</div>'; return; }
  const ROOM_NAMES = { main: '会議室', meeting_a: '会議室A', meeting_b: '会議室B', meeting_c: '会議室C' };
  el.innerHTML = r.meetings.map(m => {
    const when = m.started_at ? new Date(m.started_at + (m.started_at.endsWith('Z')?'':'Z')).toLocaleString('ja-JP') : '-';
    const sumPreview = (m.summary || '').slice(0, 120);
    return `<div class="item" onclick="openDetail(${m.id})">
      <div class="title-row">
        <span class="room">${escapeHtml(ROOM_NAMES[m.room_id] || m.room_id)}</span>
        <div class="ttl">${escapeHtml(m.title || '(無題)')}</div>
      </div>
      <div class="when">${escapeHtml(when)} / 開始: ${escapeHtml(m.started_by_name || '-')}</div>
      ${sumPreview ? `<div class="summary">${escapeHtml(sumPreview)}${m.summary && m.summary.length > 120 ? '…' : ''}</div>` : ''}
    </div>`;
  }).join('');
}

async function openDetail(id) {
  const r = await api('/api/meeting/' + id);
  if (!r || !r.success) return;
  const m = r.meeting;
  document.getElementById('d-title').textContent = m.title || '(無題)';
  const when = m.started_at ? new Date(m.started_at + (m.started_at.endsWith('Z')?'':'Z')).toLocaleString('ja-JP') : '-';
  const dur = (m.started_at && m.ended_at) ? Math.floor((new Date(m.ended_at) - new Date(m.started_at)) / 60000) + '分' : '';
  document.getElementById('d-meta').textContent = `${when} ${dur ? '/ 所要 ' + dur : ''} / 開始: ${m.started_by_name || '-'} / 参加: ${(m.participant_names||[]).join(', ')}`;
  document.getElementById('d-summary').textContent = m.summary || '(要約なし)';
  document.getElementById('d-transcript').textContent = m.transcript || '(発話なし)';
  document.getElementById('detail-bg').classList.add('show');
}

function closeDetail() { document.getElementById('detail-bg').classList.remove('show'); }
init();
</script>
</body>
</html>
