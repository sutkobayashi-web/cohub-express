<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>点呼・健康点検 - CoWell</title>
<link rel="icon" href="/img/cowell-favicon-32-v2.png">
<link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#f1f5f9;--card:#fff;--line:#e2e8f0;--ink:#0f172a;--sub:#64748b;--accent:#0d9488;--accent2:#0f766e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,'Segoe UI',Hiragino Sans,system-ui,sans-serif}
header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg, #0284c7, #0369a1);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(15,118,110,.25)}
header .back{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;cursor:pointer;border-radius:14px;padding:6px 12px}
header h1{font-size:19px;font-weight:800;margin:0;flex:1}
.toolbar{max-width:1100px;margin:0 auto;padding:14px 16px 4px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.sel{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px}
.sel select{border:none;outline:none;font-size:16px;font-weight:700;background:transparent;color:var(--ink)}
.prog{margin-left:auto;font-size:15px;font-weight:800;color:var(--accent2);background:#ccfbf1;padding:8px 16px;border-radius:999px}
.brief{max-width:1100px;margin:8px auto 0;padding:0 16px}
.brief .box{background:#fffbeb;border:1px solid #fde68a;border-radius:14px;padding:12px 14px}
.brief .ttl{font-size:13px;font-weight:800;color:#92400e;margin-bottom:6px}
.brief textarea{width:100%;border:1px solid #fcd34d;border-radius:14px;padding:9px 11px;font-size:15px;min-height:48px;resize:vertical;font-family:inherit}
.brief .save{margin-top:8px;background:#d97706;color:#fff;border:none;border-radius:14px;padding:8px 16px;font-weight:800;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:12px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mem{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 10px 14px;text-align:center;cursor:pointer;position:relative;transition:transform .1s,border-color .15s}
.mem:active{transform:scale(.97)}
.mem.done{border-color:var(--accent);background:linear-gradient(180deg,#f0fdfa,#fff)}
.mem.urgent{border-color:#f59e0b}
.mem.urgent-hi{border-color:#dc2626}
.mem .ava{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#64748b;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 6px rgba(15,23,42,.1)}
.mem .ava img{width:100%;height:100%;object-fit:cover}
.mem .nm{font-size:15px;font-weight:800;line-height:1.25;word-break:break-all}
.mem .mode{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.mode.tenko{background:#dbeafe;color:#1d4ed8}.mode.chorei{background:#dcfce7;color:#15803d}
.mem .status{position:absolute;top:8px;right:8px;font-size:18px}
.mem .ubadge{position:absolute;top:7px;left:7px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff}
.empty{padding:60px 20px;text-align:center;color:var(--sub)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
.ov.show{display:flex}
.modal{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 18px 26px;max-height:92vh;overflow:auto}
@media(min-width:560px){.ov{align-items:center}.modal{border-radius:20px}}
.modal h2{margin:0 0 4px;font-size:20px}
.modal .who{color:var(--sub);font-size:13px;font-weight:700;margin-bottom:14px}
.fld{margin-bottom:16px}
.fld>label{display:block;font-size:14px;font-weight:800;color:#334155;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1;min-width:80px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer;text-align:center}
.opt.on{border-color:var(--accent);background:#ccfbf1;color:var(--accent2)}
.opt.warn.on{border-color:#dc2626;background:#fee2e2;color:#b91c1c}
.chk{display:flex;align-items:center;gap:12px;border:2px solid #bfdbfe;background:#eff6ff;border-radius:14px;padding:14px;cursor:pointer}
.chk.on{border-color:#2563eb;background:#dbeafe}
.chk .bx{width:28px;height:28px;border-radius:12px;border:2px solid #2563eb;display:flex;align-items:center;justify-content:center;font-size:18px;color:#2563eb;flex:none}
.chk .tx{font-size:14px;font-weight:800;color:#1e3a8a;line-height:1.35}
.note{width:100%;border:1px solid var(--line);border-radius:16px;padding:11px;font-size:15px;min-height:54px;resize:vertical;font-family:inherit}
.bprow{display:flex;gap:10px;align-items:center}
.bp{flex:1;min-width:0;border:2px solid var(--line);border-radius:16px;padding:13px 8px;font-size:20px;font-weight:800;text-align:center;font-family:inherit}
.bp:focus{outline:none;border-color:var(--accent)}
.bpslash{font-size:22px;font-weight:800;color:#94a3b8}
/* ダイヤル(ホイール)式 血圧入力 — タブレットでタップ/フリック入力 */
.bpdial{display:flex;gap:12px;align-items:flex-start;justify-content:center;margin-top:6px}
.bpcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bpcol .cap{font-size:13px;font-weight:800;color:#475569}
.bpcol .unit{font-size:11px;font-weight:700;color:#94a3b8;margin-top:-2px}
.bpwrap{position:relative;width:100%;max-width:96px}
.bpwheel{position:relative;height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;border:2px solid var(--line);border-radius:16px;background:#f8fafc;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bpwheel::-webkit-scrollbar{display:none}
.bpwheel .it{height:44px;line-height:44px;text-align:center;font-size:22px;font-weight:800;color:#cbd5e1;scroll-snap-align:center;cursor:pointer;transition:color .1s,font-size .1s}
.bpwheel .it.sel{color:#0f172a;font-size:27px}
.bpwheel .it.pad{cursor:default}
.bpband{position:absolute;left:0;right:0;top:44px;height:44px;border-top:2px solid var(--accent);border-bottom:2px solid var(--accent);background:rgba(20,184,166,.06);pointer-events:none;border-radius:6px}
.bpnudge{width:100%;max-width:96px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 0;font-size:18px;font-weight:800;color:var(--accent);cursor:pointer;line-height:1}
.bpnudge:active{background:#f1f5f9}
.submit{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:800;cursor:pointer;margin-top:6px}
.cancel{width:100%;background:#fff;color:var(--sub);border:1px solid var(--line);border-radius:16px;padding:11px;font-weight:700;cursor:pointer;margin-top:10px}
.note-ttl{font-size:14px;font-weight:800;color:#334155;margin-bottom:8px}
.deny{max-width:560px;margin:40px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--sub)}
.briefshow{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:10px 12px;font-size:14px;color:#92400e;font-weight:700;margin-bottom:16px;white-space:pre-wrap}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style id="biz-udp-global">
html,body,button,input,select,textarea{font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
body :not(code):not(pre):not(kbd):not(samp):not(tt):not([style*="monospace"]):not([style*="Consolas"]):not([style*="SF Mono"]):not([style*="Mincho"]):not([style*="游明朝"]):not([style*="Yu Mincho"]){font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
code,pre,kbd,samp,tt{font-family:ui-monospace,Consolas,"SF Mono","Courier New",monospace!important}
</style>
<style id="cohub-swipe-guard">html,body{overscroll-behavior-x:none}</style>
</head>
<body>
<header>
  <button class="back" onclick="location.href='/home'">←</button>
  <h1>🚦 点呼・健康点検</h1>
  <span id="today" style="font-size:13px;opacity:.9"></span>
</header>

<div id="denyBox" class="deny" style="display:none"></div>

<div id="appWrap" style="display:none">
  <div class="toolbar">
    <div class="sel">🏢 <select id="companySel" onchange="reload()"></select></div>
    <div class="prog" id="prog">0 / 0</div>
  </div>
  <div class="brief">
    <div class="box">
      <div class="ttl">📢 今日の連絡・安全一言（この営業所の全員に表示）</div>
      <textarea id="briefText" placeholder="例：本日強風注意。横転事故防止のため空車時は特に減速を。"></textarea>
      <button class="save" onclick="saveBrief()">連絡を保存</button>
    </div>
  </div>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" style="display:none">この営業所に対象メンバーがいません</div>
  </main>
</div>

<!-- 記録モーダル -->
<div class="ov" id="ov">
  <div class="modal" id="modal"></div>
</div>

<script>
const token = localStorage.getItem('cohub_token');
if (!token) { location.href = '/'; }
let state = { date:'', company:'', items:[], me:null };

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path, opt){
  const tk = localStorage.getItem('cohub_token') || token || '';
  opt = opt || {};
  opt.headers = Object.assign({ Authorization:'Bearer '+tk }, opt.headers||{});
  const r = await fetch('/api/tenko'+path, opt);
  if (r.status === 401){
    // セッション切れ(別端末ログイン等)で入力が消える事故を防ぐ: 送信中の内容を保存してから再ログインへ
    if (pendingDraft){
      try { localStorage.setItem('tenko_draft_v1', JSON.stringify(pendingDraft)); } catch(e){}
      alert('別の端末で同じアカウントがログインされたため、セッションが切れました。\n入力内容は保存しました。再ログイン後に「点呼・健康点検」を開くと自動で復元されます。');
    }
    localStorage.removeItem('cohub_token'); location.href='/'; return null;
  }
  return r;
}

async function init(){
  const r = await api('/roster');
  if (!r) return;
  if (r.status === 403){
    document.getElementById('denyBox').style.display='block';
    document.getElementById('denyBox').innerHTML='🔒 点呼・朝礼は<b>点呼者・管理者</b>のみ利用できます。<br>担当に設定が必要な場合は管理者にご連絡ください。';
    return;
  }
  const j = await r.json();
  if (!j.success) return;
  state.me = j.me;
  document.getElementById('appWrap').style.display='block';
  const sel = document.getElementById('companySel');
  sel.innerHTML = j.companies.map(c=>`<option value="${esc(c.code)}">${esc(c.name)}</option>`).join('');
  // 操作者の所属が営業所(branch)ならそれを既定に、ADMIN等なら先頭の営業所に
  const codes = j.companies.map(c=>c.code);
  const eff = codes.includes(j.company) ? j.company : (codes[0] || j.company);
  sel.value = eff;
  if (eff !== j.company) { await reload(); } else { applyData(j); loadBrief(); }
  restoreDraft();
}

function applyData(j){
  state.date = j.date; state.company = j.company; state.items = j.items;
  document.getElementById('today').textContent = j.date;
  document.getElementById('prog').textContent = j.done + ' / ' + j.total + ' 完了';
  const grid = document.getElementById('grid');
  document.getElementById('empty').style.display = j.items.length ? 'none' : 'block';
  grid.innerHTML = j.items.map(m=>{
    const initial = (m.name||'?').trim().charAt(0);
    const ava = m.avatar ? `<img src="${esc(m.avatar)}" onerror="this.replaceWith(document.createTextNode('${esc(initial)}'))">` : esc(initial);
    const hasRec = m.done || m.self_done;
    const uCls = hasRec && m.urgency==='高' ? 'urgent-hi' : (hasRec && m.urgency==='中' ? 'urgent' : '');
    const ub = hasRec && (m.urgency==='高'||m.urgency==='中') ? `<span class="ubadge" style="background:${m.urgency==='高'?'#dc2626':'#f59e0b'}">${m.urgency==='高'?'要対応':'注意'}</span>` : '';
    // 本人が自己申告済み(運管の点呼はまだ)。運管が開いて内容確認→点呼記録する対象。
    const selfB = (!m.done && m.self_done && !(m.urgency==='高'||m.urgency==='中')) ? `<span class="ubadge" style="background:#0ea5e9">🩸申告済</span>` : '';
    // 未読の通達が残っている人は点呼で口頭伝達すべき → 件数を出す
    const nb = m.unread_notices ? `<div style="margin-top:5px;font-size:11px;font-weight:800;color:#b45309;background:#fef3c7;border-radius:999px;padding:2px 8px;display:inline-block">📣 未読通達 ${m.unread_notices}</div>` : '';
    return `<div class="mem ${m.done?'done':''} ${uCls}" onclick='openCard(${JSON.stringify(m)})'>
      ${m.done?'<span class="status">✅</span>':''}${ub}${selfB}
      <div class="ava">${ava}</div>
      <div class="nm">${esc(m.name)}</div>
      <span class="mode ${m.mode}">${m.mode==='tenko'?'点呼':'朝礼'}</span>${nb}
    </div>`;
  }).join('');
}

async function reload(){
  const company = document.getElementById('companySel').value;
  const r = await api('/roster?company='+encodeURIComponent(company));
  if (!r) return; const j = await r.json(); if (j.success) applyData(j);
  loadBrief();
}
async function loadBrief(){
  const company = document.getElementById('companySel').value;
  const r = await api('/brief?company='+encodeURIComponent(company));
  if (!r) return; const j = await r.json();
  if (j.success) document.getElementById('briefText').value = j.message || '';
}
async function saveBrief(){
  const company = document.getElementById('companySel').value;
  const message = document.getElementById('briefText').value;
  const r = await api('/brief', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ company, message }) });
  if (r && (await r.json()).success){ const b=event.target; b.textContent='保存しました ✓'; setTimeout(()=>b.textContent='連絡を保存',1500); }
}

// ---- 記録モーダル ----
let form = {};
let pendingDraft = null;   // 送信中の入力内容(401時の保全用)
let curName = '';          // 対象者名(ドラフト復元の表示用)
let RECENT = null;         // 対象者の直近2週間の平均血圧 (/bp-recent)
function openCard(m){
  curName = m.name || '';
  const self = m.self || null;   // 本人がタブレットで自己申告済みの内容(あれば)
  form = { target_id:m.id, mode:m.mode, tokai_done:false,
    condition: (self && self.condition) ? self.condition : (m.mode==='chorei'?'good':null),
    health: (self && self.health) ? Object.assign({}, self.health) : {},
    note:'', health_state:'good' };
  const brief = document.getElementById('briefText').value.trim();
  const briefHtml = brief ? `<div class="briefshow">📢 ${esc(brief)}</div>` : '';
  // 点呼は健康点検だけでなく「指示・伝達」も法定要件。未読通達が残っていれば点呼者に伝達を促す。
  const noticeHtml = m.unread_notices ? `<div class="briefshow" style="background:#fff7ed;border-color:#fed7aa;color:#9a3412">📣 この方は<b>未読の通達が ${m.unread_notices}件</b>あります。点呼で内容を伝え、後で本人にも確認してもらってください。</div>` : '';
  const selfHtml = self ? `<div class="briefshow" style="background:#e0f2fe;border-color:#7dd3fc;color:#075985">🩸 本人がタブレットで自己申告済み${self.at?`（${esc(String(self.at).slice(11,16))}）`:''}。下の内容は本人の申告です。確認・修正して点呼を記録してください。</div>` : '';
  const legal = m.mode==='tenko' ? tenkoLegal() : '';            // 点呼の法定部(東海電子+血圧)は常時表示
  const detail = m.mode==='tenko' ? tenkoDetail() : choreiDetail(); // 「気になる」時だけ展開
  document.getElementById('modal').innerHTML =
    `<h2>${m.mode==='tenko'?'🚦 点呼・健康点検':'📣 朝礼・健康点検'}</h2>
     <div class="who">${esc(m.name)} さん</div>
     ${briefHtml}${noticeHtml}${selfHtml}${legal}
     <div class="fld" style="margin-bottom:2px;">
       <label>健康点検（8項目）</label>
       <div style="font-size:11px;color:#94a3b8;margin-top:4px;">本日の状態をタップで選んでください。問題なければ「はい／なし」でOK。</div>
     </div>
     <div id="healthDetail">${detail}</div>
     <div class="fld"><div class="note-ttl">📝 メモ（任意）</div><textarea class="note" id="f_note" placeholder="気づいたことがあれば記入"></textarea></div>
     <button class="submit" onclick="submitCard()">${m.mode==='tenko'?'点呼・点検を記録':'記録（出席・点検）'}</button>
     <button class="cancel" onclick="closeOv()">キャンセル</button>`;
  document.getElementById('ov').classList.add('show');
  buildBpWheels(self ? self.bp : null);
  if (self) prefillHealth();   // 自己申告の該当ボタンを選択状態に
  if (m.mode==='tenko') loadBpRecent(m.id);
}
// 直近2週間の平均血圧を点呼カードに出す (2026-08-03 社長指示)。
// ⚠️⚠️目的は「いつもは基準内なのに今日だけ高い＝急変の可能性」を拾うこと。
//    平均が高いことは今日の高値を見逃す理由にならない。その旨を必ず画面に併記する。
async function loadBpRecent(uid){
  const box = document.getElementById('bp_recent'); if (!box) return;
  box.style.display='none'; RECENT = null;
  const r = await api('/bp-recent?uid=' + encodeURIComponent(uid));
  if (!r) return;
  const j = await r.json().catch(()=>null);
  if (!j || !j.success) return;
  if (!j.n){ box.style.display='block';
    box.innerHTML = '<b>直近2週間の記録なし</b>　今日の数値だけで判断することになります。'; return; }
  RECENT = j;
  const lvTxt = j.avg_level>=2 ? '<span style="color:#b91c1c;font-weight:800">平均の時点で基準を超えています</span>'
              : j.avg_level===1 ? '<span style="color:#854d0e;font-weight:800">平均が高めです</span>'
              : '<span style="color:#047857;font-weight:800">平均は基準内</span>';
  box.style.display='block';
  box.innerHTML = '📊 <b>直近2週間の平均 ' + j.avg_s + '／' + j.avg_d + '</b>（' + j.n + '回・最高 ' + j.max_s + '／' + j.max_d + '）　' + lvTxt
    + '<div style="margin-top:4px;color:#64748b;font-size:11.5px;line-height:1.6">'
    + '※ 普段の値と比べて<b>今日だけ大きく高い</b>ときは、急な変化の可能性があります。<br>'
    + '※ <b>平均が高いことは、今日の数値を見逃してよい理由にはなりません。</b>「この人はいつも高いから」で通さないでください。</div>';
  bpCheck();
}
// 本人の自己申告(form.health)を点呼モーダルの該当ボタンにプリフィル
function prefillHealth(){
  const d = document.getElementById('healthDetail'); if (!d) return;
  Object.keys(form.health||{}).forEach(k=>{
    const v = form.health[k];
    const btn = d.querySelector('.opt[data-k="'+k+'"][data-v="'+v+'"]');
    if (btn){ btn.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); }
  });
}

// ===== ダイヤル(ホイール)式 血圧入力 =====
// 値は hidden input (#f_bp_sys/#f_bp_dia/#f_pulse) に入れるので submitCard/bpCheck は無改修。
const BP_ROW = 44;
function buildWheel(wid, hid, min, max, onChange, def){
  const w = document.getElementById(wid); if (!w) return;
  const vals = ['']; for (let n = min; n <= max; n++) vals.push(String(n)); // 先頭は「—」(未測定=null)
  let html = '<div class="it pad"></div>';
  vals.forEach((v, i) => { html += '<div class="it" data-i="' + i + '">' + (v === '' ? '—' : v) + '</div>'; });
  html += '<div class="it pad"></div>';
  w.innerHTML = html;
  const hidden = document.getElementById(hid);
  const items = w.querySelectorAll('.it[data-i]');
  function apply(){
    let idx = Math.round(w.scrollTop / BP_ROW);
    if (idx < 0) idx = 0; if (idx > vals.length - 1) idx = vals.length - 1;
    items.forEach(el => el.classList.remove('sel'));
    if (items[idx]) items[idx].classList.add('sel');
    hidden.value = vals[idx] || '';
    if (onChange) onChange();
  }
  let t; w.addEventListener('scroll', () => { clearTimeout(t); t = setTimeout(apply, 80); }, { passive: true });
  items.forEach(el => el.addEventListener('click', () => { w.scrollTo({ top: (+el.dataset.i) * BP_ROW, behavior: 'smooth' }); }));
  let di = (def != null && def !== '') ? vals.indexOf(String(def)) : 0; // 既定値の位置 (無指定は「—」)
  if (di < 0) di = 0;
  w.scrollTop = di * BP_ROW; apply();
}
function bpNudge(wid, d){
  const w = document.getElementById(wid); if (!w) return;
  const idx = Math.round(w.scrollTop / BP_ROW) + d;
  w.scrollTo({ top: Math.max(0, idx * BP_ROW), behavior: 'smooth' });
}
function buildBpWheels(bp){
  if (!document.getElementById('w_bp_sys')) return; // 点呼モードのみ
  const dSys = (bp && bp.sys) ? bp.sys : 120;    // 本人が自己申告で血圧を入れていればその値を初期表示
  const dDia = (bp && bp.dia) ? bp.dia : 70;
  const dPulse = (bp && bp.pulse) ? bp.pulse : '';
  buildWheel('w_bp_sys', 'f_bp_sys', 70, 220, bpCheck, dSys);
  buildWheel('w_bp_dia', 'f_bp_dia', 40, 140, bpCheck, dDia);
  buildWheel('w_bp_pulse', 'f_pulse', 35, 160, null, dPulse);
}

// 聞き取り8項目 (投票決定5項目[Yes/No] + 観察3項目) — 点呼・朝礼で共通

  ${optFld('💭 気になる','concern',[['なし','no'],['体調','health'],['家族','family'],['職場','work'],['お金','money'],['その他','other']])}`;

// C方式: 良好=詳細スキップ / 気になる=詳細展開
function pickHealth(el){
  el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const s = el.dataset.s; form.health_state = s;
  const d = document.getElementById('healthDetail');
  if (d) d.style.display = (s==='concern') ? 'block' : 'none';
  if (s==='good'){ form.health={}; form.condition = (form.mode==='chorei') ? 'good' : null; }
}
function optFld(label,key,opts,isCondition){
  const btns = opts.map(o=>`<button class="opt ${o[2]?'warn':''}" data-k="${key}" data-v="${o[1]}" data-cond="${isCondition?1:0}" onclick="pick(this)">${o[0]}</button>`).join('');
  return `<div class="fld"><label>${label}</label><div class="opts">${btns}</div></div>`;
}
function pick(el){
  const k=el.dataset.k, v=el.dataset.v;
  el.parentElement.querySelectorAll('.opt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  if (el.dataset.cond==='1') form.condition=v; else form.health[k]=v;
}
function toggleTokai(){ form.tokai_done=!form.tokai_done;
  document.getElementById('chk_tokai').classList.toggle('on',form.tokai_done);
  document.getElementById('bx_tokai').textContent=form.tokai_done?'✓':''; }
function closeOv(){ document.getElementById('ov').classList.remove('show'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeOv(); });

// 乗務ゲート (2026-08-03 社長判断)。数値を回した瞬間に、その場で何をすべきかを出す。
//  180/110以上 = 当日乗務見合わせ / 160/100以上 = 15分安静後に再測
//  ⚠️サーバー側 routes/tenko.js の bpGateLevel と同じ基準。片方だけ変えないこと。
function gateOf(sys, dia){
  if (sys>=180 || dia>=110) return { lv:3, bg:'#fee2e2', fg:'#7f1d1d',
    msg:'🚫 180/110以上です。15分安静にしてから1回だけ再測してください。再測でも超える場合は本日の乗務を見合わせてください。' };
  if (sys>=160 || dia>=100) return { lv:2, bg:'#ffedd5', fg:'#9a3412',
    msg:'⚠️ 15分安静にしてから再測してください。再測でも超えている場合は長距離・夜間の乗務から外してください。' };
  if (sys>=140 || dia>=90) return { lv:1, bg:'#fefce8', fg:'#854d0e',
    msg:'数値が高めです。体調を確認してください。' };
  return { lv:0 };
}
function bpCheck(){
  const sys = parseInt((document.getElementById('f_bp_sys')||{}).value)||0;
  const dia = parseInt((document.getElementById('f_bp_dia')||{}).value)||0;
  const w = document.getElementById('bp_warn');
  if (!w) return;
  const g = gateOf(sys, dia);
  // 普段の値から大きく外れた日は、レベルに関わらず「急な変化」として伝える(直近2週間の平均と比較)
  let jump = '';
  if (RECENT && RECENT.n >= 3 && sys && dia
      && (sys - RECENT.avg_s >= 30 || dia - RECENT.avg_d >= 15)) {
    jump = '<div style="margin-top:5px;font-weight:800">📈 普段（' + RECENT.avg_s + '／' + RECENT.avg_d
         + '）より大きく高い値です。急な変化の可能性があります。安静にして再測し、体調も確かめてください。</div>';
  }
  if (!g.lv && !jump){ w.style.display='none'; return; }
  const st = g.lv ? g : { bg:'#fefce8', fg:'#854d0e', msg:'' };
  w.style.display='block'; w.style.background=st.bg; w.style.color=st.fg;
  w.innerHTML = esc(st.msg) + jump;
}
async function submitCard(){
  form.note = document.getElementById('f_note').value;
  const sys = document.getElementById('f_bp_sys');
  if (sys) {
    form.bp_systolic = sys.value || null;
    form.bp_diastolic = (document.getElementById('f_bp_dia')||{}).value || null;
    form.pulse = (document.getElementById('f_pulse')||{}).value || null;
  }
  // 送信直前にドラフトを確保 (401でセッションが切れても入力を失わない)
  pendingDraft = Object.assign({}, form, { _name: curName });
  const r = await api('/checkin', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
  if (!r) return;            // 401時: api()内でドラフト保存&再ログインへ
  pendingDraft = null;
  const j = await r.json();
  if (!j.success){ alert(j.msg||'記録に失敗しました'); return; }
  try { localStorage.removeItem('tenko_draft_v1'); } catch(e){}  // 記録成功 → ドラフト破棄
  closeOv();
  if (j.escalated) { /* 不調を現場の声へ連携した旨は静かに */ }
  // 乗務ゲート該当は記録後に必ず一度止めて知らせる (点呼者が見落とさないように)
  if (j.gate && j.gate.driver && j.gate.level >= 2) {
    alert(j.gate.pill + '\n' + curName + ' さん（' + (j.gate.reasons||[]).join(' ／ ') + '）\n\n'
      + j.gate.action + '\n\n※これは判断の目安です。乗務可否は運行管理者が判断してください。');
  }
  reload();
}

// ---- セッション切れで保存したドラフトを再ログイン後に復元 ----
function applyDraftToModal(d){
  Object.entries(d.health||{}).forEach(([k,v])=>{
    const b = document.querySelector('.opt[data-k="'+k+'"][data-v="'+v+'"]');
    if (b){ b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('on')); b.classList.add('on'); }
  });
  if (d.tokai_done){ const c=document.getElementById('chk_tokai'); if(c){ c.classList.add('on'); const bx=document.getElementById('bx_tokai'); if(bx) bx.textContent='✓'; } }
  const n=document.getElementById('f_note'); if(n) n.value = d.note||'';
  if (document.getElementById('w_bp_sys')){
    buildWheel('w_bp_sys','f_bp_sys',70,220,bpCheck, (d.bp_systolic!=null&&d.bp_systolic!=='')?d.bp_systolic:120);
    buildWheel('w_bp_dia','f_bp_dia',40,140,bpCheck, (d.bp_diastolic!=null&&d.bp_diastolic!=='')?d.bp_diastolic:70);
    buildWheel('w_bp_pulse','f_pulse',35,160,null, (d.pulse!=null&&d.pulse!=='')?d.pulse:'');
  }
}
function restoreDraft(){
  let d; try { d = JSON.parse(localStorage.getItem('tenko_draft_v1')||'null'); } catch(e){ d=null; }
  if (!d || !d.target_id) return;
  const m = (state.items||[]).find(x=>x.id===d.target_id) || { id:d.target_id, name:d._name||'対象者', mode:d.mode||'tenko' };
  openCard(m);
  form = Object.assign(form, d); delete form._name;
  applyDraftToModal(d);
  bpCheck();
  setTimeout(()=>alert('前回セッションが切れたため、入力内容を復元しました。\n内容をご確認のうえ「記録」を押してください。'), 50);
}
