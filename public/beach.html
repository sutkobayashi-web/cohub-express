<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌊 浜辺さんぽ — CoHub</title>
<style>
  :root { --teal: #0d9488; --ink: #0f172a; --sub: #64748b; --line: #e2e8f0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: var(--ink); }
  body { display: flex; flex-direction: column; background: #0b1220; }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: rgba(255,255,255,.78); backdrop-filter: blur(8px); z-index: 30; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
  header .back { text-decoration: none; color: var(--ink); font-size: 20px; font-weight: 800; }
  header h1 { margin: 0; font-size: 16px; font-weight: 800; }
  header .times { margin-left: auto; display: flex; gap: 4px; }
  header .times button { border: none; background: #f1f5f9; color: #475569; font-size: 15px; width: 32px; height: 32px; border-radius: 9px; cursor: pointer; }
  header .times button.on { background: var(--teal); color: #fff; }

  /* ===== 風景 (一人称POV・生成背景画像) ===== */
  .scene { position: relative; flex: 1; overflow: hidden; }
  .bg { position: absolute; inset: -4%; background-size: cover; background-position: center bottom;
        transition: background-image .6s ease, transform .7s cubic-bezier(.4,0,.2,1);
        animation: kenburns 38s ease-in-out infinite alternate; will-change: transform; }
  @keyframes kenburns { from { transform: scale(1.04); } to { transform: scale(1.12); } }
  .scene.stepping .bg { transform: scale(1.16); }   /* 歩く＝前へ一歩ぶん寄る */
  /* 水面の光のゆらぎ (静止画の上に重ねて生命感) */
  .sheen { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light; opacity: .5;
           background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
           background-size: 220% 100%; animation: sheen 9s linear infinite; }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  /* 周辺減光で写真的な締まり */
  .vignette { position: absolute; inset: 0; pointer-events: none;
              box-shadow: inset 0 0 120px 30px rgba(0,0,0,.18), inset 0 -40px 80px rgba(0,0,0,.12); }

  /* 流れ着くボトル (手前=自分の足元側に寄ってくる) */
  .bottle-drift { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); font-size: 44px; z-index: 12; cursor: pointer;
                  filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation: bottleBob 2.4s ease-in-out infinite; }
  @keyframes bottleBob { 0%,100% { transform: translateX(-50%) translateY(0) rotate(-7deg); } 50% { transform: translateX(-50%) translateY(-8px) rotate(7deg); } }

  /* 吹き出し */
  .speech { position: absolute; left: 50%; bottom: 26%; transform: translateX(-50%); z-index: 20;
            background: rgba(255,255,255,.96); color: var(--ink); padding: 11px 18px; border-radius: 16px; font-size: 13.5px; font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,.22); max-width: 80%; text-align: center; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .speech.show { opacity: 1; }

  /* ===== 操作バー ===== */
  .controls { display: flex; gap: 8px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); backdrop-filter: blur(8px); z-index: 30; box-shadow: 0 -1px 0 rgba(0,0,0,.05); }
  .controls .btn { border: none; border-radius: 12px; padding: 13px 8px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .btn.walk { background: var(--teal); color: #fff; flex: 1.5; }
  .btn.walk:active { background: #0f766e; }
  .btn.sub { background: #f1f5f9; color: #334155; flex: 1; }
  .btn.sub:active { background: #e2e8f0; }
  .btn.icon { background: #f1f5f9; color: #334155; flex: 0 0 46px; font-size: 18px; }

  /* ===== モーダル ===== */
  .ov { position: fixed; inset: 0; background: rgba(8,20,40,.5); backdrop-filter: blur(4px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 22px; }
  .ov.show { display: flex; }
  .card { background: #fff; border-radius: 18px; width: 100%; max-width: 380px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .card h2 { margin: 0 0 4px; font-size: 17px; }
  .card .who { display: flex; align-items: center; gap: 10px; margin: 10px 0 12px; }
  .card .who .av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: #cbd5e1; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; }
  .card .who .av img { width: 100%; height: 100%; object-fit: cover; }
  .card .who .nm { font-weight: 800; font-size: 14px; }
  .card .who .tm { font-size: 11px; color: var(--sub); }
  .card .msg { background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 12px; padding: 14px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #134e4a; }
  .card textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 15px; resize: vertical; min-height: 90px; font-family: inherit; }
  .card .row { display: flex; gap: 8px; margin-top: 14px; }
  .card .row .btn { flex: 1; border: none; border-radius: 12px; padding: 12px; font-size: 14px; font-weight: 800; cursor: pointer; }
  .btn.primary { background: var(--teal); color: #fff; }
  .btn.ghost { background: #f1f5f9; color: #475569; }
  .card .cc { text-align: right; font-size: 11px; color: var(--sub); margin-top: 4px; }
  .mine-list { max-height: 50vh; overflow-y: auto; }
  .mine-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .mine-item .mc { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .mine-item .mf { font-size: 11px; color: var(--teal); font-weight: 700; margin-top: 4px; }
  .empty { text-align: center; color: var(--sub); font-size: 13px; padding: 18px; }
</style>
</head>
<body>
<header>
  <a href="/home" class="back">←</a>
  <h1>🌊 浜辺さんぽ</h1>
  <div class="times">
    <button id="t-dawn"   onclick="setTime('dawn')"   title="朝">🌅</button>
    <button id="t-calm"   onclick="setTime('calm')"   title="昼">☀️</button>
    <button id="t-golden" onclick="setTime('golden')" title="夕">🌇</button>
  </div>
</header>

<div class="scene" id="scene">
  <div class="bg" id="bg"></div>
  <div class="sheen"></div>
  <div class="vignette"></div>
  <div class="speech" id="speech"></div>
</div>

<div class="controls">
  <button class="btn walk" id="walk-btn" onclick="walk()">🚶 歩く</button>
  <button class="btn sub" onclick="openCompose()">✉️ 流す</button>
  <button class="btn sub" onclick="openMine()">🧴 自分</button>
  <button class="btn icon" onclick="keeperSpeak()" title="灯台守に話す">🗼</button>
</div>

<!-- ボトルを読む -->
<div class="ov" id="ov-read">
  <div class="card">
    <h2>🍾 ボトルメールが流れ着きました</h2>
    <div class="who" id="read-who"></div>
    <div class="msg" id="read-msg"></div>
    <div class="row">
      <button class="btn ghost" onclick="closeOv('ov-read')">そっと閉じる</button>
      <button class="btn primary" onclick="replyToBottle()">🌊 返事を流す</button>
    </div>
  </div>
</div>

<!-- ボトルを流す -->
<div class="ov" id="ov-compose">
  <div class="card">
    <h2 id="compose-title">✉️ ボトルメールを流す</h2>
    <p style="font-size:12px;color:#64748b;margin:4px 0 10px;">誰かが、いつか拾います。気軽な一言でどうぞ。</p>
    <textarea id="compose-text" maxlength="300" placeholder="例: 今日は良い天気ですね。どこかで、おつかれさまです。"></textarea>
    <div class="cc"><span id="compose-count">0</span>/300</div>
    <div class="row">
      <button class="btn ghost" onclick="closeOv('ov-compose')">やめる</button>
      <button class="btn primary" id="compose-send" onclick="sendBottle()">🌊 流す</button>
    </div>
  </div>
</div>

<!-- 流したボトル一覧 -->
<div class="ov" id="ov-mine">
  <div class="card">
    <h2>🧴 流したボトル</h2>
    <div class="mine-list" id="mine-list">読み込み中...</div>
    <div class="row"><button class="btn ghost" onclick="closeOv('ov-mine')">閉じる</button></div>
  </div>
</div>

<script>
const token = localStorage.getItem('cohub_token');
if (!token) location.replace('/');
let me = null;
let steps = 0;
let currentBottle = null;
let driftEl = null;

function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body === 'object') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.body); }
  const r = await fetch(path, opts);
  if (r.status === 401) { localStorage.removeItem('cohub_token'); location.replace('/'); return null; }
  return r.json();
}

// 時間帯(背景)切替。本人の気分で選べる
const TIMES = ['dawn', 'calm', 'golden'];
function setTime(key) {
  if (!TIMES.includes(key)) key = 'golden';
  document.getElementById('bg').style.backgroundImage = "url('/assets/beach/bg_" + key + ".png')";
  TIMES.forEach(t => document.getElementById('t-' + t).classList.toggle('on', t === key));
  try { localStorage.setItem('beach_time', key); } catch (e) {}
}

// 灯台守(BOT)の静かな一言
const KEEPER_LINES = [
  'やあ。今日もよく来たね。',
  'のんびりでいい。波の音でも聞いていきなさい。',
  '無理に誰かと話さなくていい。ここは君の時間だ。',
  '疲れたら、ただ座って海を見るのもいい。',
  '遠くで、同じ海を見ている人がいるよ。',
  'ボトルを流してごらん。いつか、誰かが拾う。',
  '今日のことは今日でおしまい。よく頑張ったね。',
  '焦らなくていい。波は、いつも戻ってくる。',
];
let keeperIdx = 0;
function keeperSpeak() { showSpeech('🗼 ' + KEEPER_LINES[keeperIdx++ % KEEPER_LINES.length], 5000); }

let speechTimer = null;
function showSpeech(text, ms) {
  const el = document.getElementById('speech');
  el.textContent = text; el.classList.add('show');
  clearTimeout(speechTimer);
  speechTimer = setTimeout(() => el.classList.remove('show'), ms || 4200);
}

const AMBIENT = [
  '…波の音だけが聞こえる。',
  'かもめが、ゆっくり横切っていった。',
  '足あとが、砂についていく。',
  '潮風が気持ちいい。',
  '遠くの水平線が、きらきら光っている。',
];

// 歩く: 一人称で一歩ぶん前へ寄り、たまにボトルが流れ着く
async function walk() {
  steps++;
  const scene = document.getElementById('scene');
  scene.classList.add('stepping');
  setTimeout(() => scene.classList.remove('stepping'), 700);

  if (driftEl) { showSpeech('🍾 足元にボトルが流れ着いている。タップして開けてみよう。'); return; }
  if (Math.random() < 0.4) {
    const r = await api('/api/beach/bottles/pick');
    if (r && r.success && r.bottle) { washUpBottle(r.bottle); return; }
  }
  showSpeech(AMBIENT[Math.floor(Math.random() * AMBIENT.length)]);
}

function washUpBottle(bottle) {
  currentBottle = bottle;
  if (driftEl) driftEl.remove();
  driftEl = document.createElement('div');
  driftEl.className = 'bottle-drift';
  driftEl.textContent = '🍾';
  driftEl.onclick = () => openRead();
  document.getElementById('scene').appendChild(driftEl);
  showSpeech('🍾 足元に、何かが流れ着いた…');
}

function openRead() {
  if (!currentBottle) return;
  const b = currentBottle;
  const initial = (b.author_name || '?').trim().charAt(0);
  const av = b.author_avatar ? '<img src="' + escapeHtml(b.author_avatar) + '" alt="">' : escapeHtml(initial);
  document.getElementById('read-who').innerHTML =
    '<div class="av">' + av + '</div><div><div class="nm">' + escapeHtml(b.author_name || '名もなき誰か') + '</div>'
    + '<div class="tm">' + fmtTime(b.created_at) + ' に流された</div></div>';
  document.getElementById('read-msg').textContent = b.content || '';
  openOv('ov-read');
}

function replyToBottle() { closeOv('ov-read'); openCompose('🌊 返事のボトルを流す'); }

function fmtTime(s) {
  if (!s) return '';
  const d = new Date(String(s).replace(' ', 'T') + 'Z');
  if (isNaN(d)) return '';
  return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function openCompose(title) {
  document.getElementById('compose-title').textContent = title || '✉️ ボトルメールを流す';
  document.getElementById('compose-text').value = '';
  document.getElementById('compose-count').textContent = '0';
  openOv('ov-compose');
}
document.getElementById('compose-text').addEventListener('input', e => {
  document.getElementById('compose-count').textContent = e.target.value.length;
});
async function sendBottle() {
  const t = document.getElementById('compose-text').value.trim();
  if (!t) { showSpeech('一言だけでも、どうぞ。'); return; }
  const btn = document.getElementById('compose-send');
  btn.disabled = true;
  const r = await api('/api/beach/bottles', { method: 'POST', body: { content: t } });
  btn.disabled = false;
  if (!r || !r.success) { alert('流せませんでした: ' + ((r && r.msg) || '通信エラー')); return; }
  closeOv('ov-compose');
  const fly = document.createElement('div');
  fly.className = 'bottle-drift'; fly.textContent = '🍾';
  fly.style.transition = 'all 2.4s ease-in';
  document.getElementById('scene').appendChild(fly);
  requestAnimationFrame(() => { fly.style.bottom = '52%'; fly.style.opacity = '0'; fly.style.fontSize = '16px'; });
  setTimeout(() => fly.remove(), 2500);
  showSpeech('🌊 ボトルを流した。いつか、誰かが拾うよ。');
  if (driftEl) { driftEl.remove(); driftEl = null; currentBottle = null; }
}

async function openMine() {
  openOv('ov-mine');
  const list = document.getElementById('mine-list');
  list.innerHTML = '読み込み中...';
  const r = await api('/api/beach/mine');
  if (!r || !r.success) { list.innerHTML = '<div class="empty">読み込めませんでした</div>'; return; }
  if (!r.bottles.length) { list.innerHTML = '<div class="empty">まだ流したボトルはありません。<br>「✉️ 流す」から、一言どうぞ。</div>'; return; }
  list.innerHTML = r.bottles.map(b =>
    '<div class="mine-item"><div class="mc">' + escapeHtml(b.content) + '</div>'
    + '<div class="mf">' + (b.found_count > 0 ? '🍾 ' + b.found_count + '人が拾いました' : 'まだ漂流中…') + '</div></div>'
  ).join('');
}

function openOv(id){ document.getElementById(id).classList.add('show'); }
function closeOv(id){ document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.ov').forEach(ov => ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); }));

async function init() {
  let saved = 'golden';
  try { saved = localStorage.getItem('beach_time') || 'golden'; } catch (e) {}
  setTime(saved);
  const r = await api('/api/auth/me');
  if (r && r.success) me = r.user;
  setTimeout(() => showSpeech('誰もいない、静かな浜辺です。ゆっくり歩いてみましょう。', 5000), 700);
}
init();
</script>
</body>
</html>
