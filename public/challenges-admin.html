<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙ チャレンジ管理 — CoWell</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<meta name="theme-color" content="#d97706">
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #fff7ed; color: #0f172a; }
header { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg, #d97706, #b45309); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
header h1 { margin: 0; font-size: 16px; }
header .spacer { flex: 1; }
main { max-width: 1100px; margin: 0 auto; padding: 18px; }
.card { background: #fff; border-radius: 10px; padding: 18px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
.btn { padding: 8px 16px; background: #f59e0b; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
.btn-success { background: #10b981; }
.btn-ghost { background: #e2e8f0; color: #0f172a; }
.btn-danger { background: #ef4444; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
th { background: #fffbeb; font-weight: 700; color: #78350f; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row input, .row select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
.kpi-item { display: grid; grid-template-columns: 1.4fr 2fr 80px 100px 1fr 32px; gap: 6px; margin-bottom: 6px; align-items: center; }
.kpi-item input, .kpi-item select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; width: 100%; }
.dash-stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.dash-card { background: linear-gradient(135deg,#fef3c7,#fde68a); border-radius: 10px; padding: 12px; text-align: center; }
.dash-card .n { font-size: 26px; font-weight: 800; color: #92400e; }
.dash-card .l { font-size: 11px; color: #78350f; font-weight: 700; }
.no-access { max-width: 480px; margin: 60px auto; text-align: center; }
</style>
<script src="/font-zoom.js?v=20260728a" defer></script>
</head>
<body>
<header>
  <h1>⚙ チャレンジ管理</h1>
  <div class="spacer"></div>
  <div id="who" style="font-size:13px;"></div>
  <button onclick="location.href='/challenges.html'" style="margin-left:14px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.5);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;">← チャレンジへ</button>
  <button onclick="goBackHome()" style="margin-left:8px;background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.5);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;">✕ 閉じる</button>
  <script>function goBackHome(){var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||'');if(history.length>1){history.back();}else{location.href=m?'/m':'/';}}</script>
</header>
<main>
  <div id="loading" class="card" style="text-align:center;color:#94a3b8;">読み込み中…</div>
  <div id="no-access" class="card no-access" style="display:none;">
    <div style="font-size:48px;margin-bottom:12px;">🔒</div>
    <h2 style="color:#dc2626;">管理職または推進メンバーのみ</h2>
  </div>
  <div id="panel" style="display:none;">

  <div class="card" style="background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid #d97706;">
    <h2 style="margin:0 0 10px 0;">+ 新しいチャレンジ</h2>
    <div class="row" style="margin-bottom:8px;">
      <input type="text" id="new-icon" value="💪" style="max-width:60px;text-align:center;font-size:18px;" maxlength="4" title="アイコン">
      <input type="text" id="new-title" placeholder="タイトル (例: 11月歩く健康チャレンジ)" style="flex:1;min-width:200px;">
    </div>
    <textarea id="new-desc" placeholder="説明・目的 (任意)" style="width:100%;min-height:60px;padding:9px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;font-family:inherit;margin-bottom:8px;"></textarea>
    <div class="row" style="margin-bottom:10px;">
      <label style="font-size:12px;">期間</label>
      <input type="date" id="new-start">
      <span>〜</span>
      <input type="date" id="new-end">
      <select id="new-status">
        <option value="draft">📝 下書き</option>
        <option value="active" selected>🔥 即開催</option>
      </select>
    </div>
    <div style="font-size:12px;font-weight:700;color:#78350f;margin-bottom:6px;">📊 KPI項目 (社員が日々入力)</div>
    <div id="kpi-list">
      <div class="kpi-item">
        <input type="text" placeholder="key (英数字)" data-f="key" value="steps">
        <input type="text" placeholder="表示名" data-f="label" value="歩数">
        <input type="text" placeholder="単位" data-f="unit" value="歩">
        <input type="number" placeholder="目標値" data-f="target" value="8000">
        <select data-f="type"><option value="number" selected>数値</option><option value="bool">チェック</option></select>
        <button class="btn-danger" style="font-size:11px;padding:3px 6px;border:none;border-radius:4px;color:#fff;cursor:pointer;" onclick="this.parentElement.remove()">×</button>
      </div>
    </div>
    <button class="btn-ghost btn" style="font-size:11px;padding:5px 10px;margin-top:6px;" onclick="addKpiItem()">+ KPI追加</button>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button class="btn" onclick="createChallenge()">作成</button>
      <span id="create-msg" style="font-size:12px;align-self:center;"></span>
    </div>
  </div>

  <div class="card">
    <h2>📋 チャレンジ一覧</h2>
    <div id="cha-tbody"></div>
  </div>

  <div class="card" id="dash-area" style="display:none;">
    <h2 id="dash-title">📊 ダッシュボード</h2>
    <div class="dash-stat" id="dash-stat"></div>
    <div style="margin-top:14px;">
      <table>
        <thead><tr><th>参加者</th><th>所属</th><th>記録日数</th><th>最終記録</th></tr></thead>
        <tbody id="dash-tbody"></tbody>
      </table>
    </div>
  </div>

  </div>
</main>
<script>
let token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
function escapeHtml(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init() {
  if (!token) { location.href = '/'; return; }
  try {
    const u = JSON.parse(localStorage.getItem('cohub_user') || '{}');
    const isMgr = u && (u.employee_type === 'admin' || u.is_field_promoter || u.role === 'admin');
    document.getElementById('loading').style.display = 'none';
    document.getElementById('who').textContent = (u.display_name || '');
    if (!isMgr) { document.getElementById('no-access').style.display = 'block'; return; }
    document.getElementById('panel').style.display = 'block';
    await loadList();
  } catch (e) { document.getElementById('loading').textContent = e.message; }
}
async function api(p, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(p, opts);
  return r.json();
}

function addKpiItem() {
  document.getElementById('kpi-list').insertAdjacentHTML('beforeend', `
    <div class="kpi-item">
      <input type="text" placeholder="key (英数字)" data-f="key">
      <input type="text" placeholder="表示名" data-f="label">
      <input type="text" placeholder="単位" data-f="unit">
      <input type="number" placeholder="目標値" data-f="target">
      <select data-f="type"><option value="number">数値</option><option value="bool">チェック</option></select>
      <button class="btn-danger" style="font-size:11px;padding:3px 6px;border:none;border-radius:4px;color:#fff;cursor:pointer;" onclick="this.parentElement.remove()">×</button>
    </div>`);
}

async function createChallenge() {
  const title = document.getElementById('new-title').value.trim();
  const msg = document.getElementById('create-msg');
  if (!title) { msg.textContent = '❌ タイトル必須'; msg.style.color = '#dc2626'; return; }
  const items = [];
  document.querySelectorAll('#kpi-list .kpi-item').forEach(row => {
    const o = {};
    row.querySelectorAll('[data-f]').forEach(el => { if (el.value) o[el.dataset.f] = el.value; });
    if (o.key && o.label) {
      if (o.target && o.type === 'number') o.target = Number(o.target);
      items.push(o);
    }
  });
  const r = await api('/api/challenges', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      title,
      description: document.getElementById('new-desc').value,
      icon: document.getElementById('new-icon').value || '💪',
      period_start: document.getElementById('new-start').value || null,
      period_end: document.getElementById('new-end').value || null,
      kpi_items: items,
      status: document.getElementById('new-status').value,
    }),
  });
  if (!r.success) { msg.textContent = '❌ ' + (r.msg || '失敗'); msg.style.color = '#dc2626'; return; }
  msg.textContent = '✓ 作成: #' + r.id;
  msg.style.color = '#10b981';
  document.getElementById('new-title').value = '';
  document.getElementById('new-desc').value = '';
  loadList();
}

async function loadList() {
  const d = await api('/api/challenges?limit=100');
  if (!d.success) return;
  const tbody = document.getElementById('cha-tbody');
  if (!d.challenges.length) { tbody.innerHTML = '<div style="color:#94a3b8;padding:14px;text-align:center;">チャレンジ未作成</div>'; return; }
  tbody.innerHTML = '<table><thead><tr><th>#</th><th>タイトル</th><th>期間</th><th>参加者</th><th>状態</th><th>操作</th></tr></thead><tbody>' +
    d.challenges.map(c => {
      const sLbl = { active: '🔥 開催中', draft: '📝 下書き', closed: '✅ 終了' }[c.status] || c.status;
      return `<tr>
        <td style="font-size:11px;color:#94a3b8;">${c.id}</td>
        <td><b>${c.icon || ''} ${escapeHtml(c.title)}</b></td>
        <td style="font-size:11px;">${escapeHtml(c.period_start || '-')} 〜 ${escapeHtml(c.period_end || '-')}</td>
        <td>${c.participant_count}名</td>
        <td><span style="background:${c.status==='active'?'#10b981':'#94a3b8'};color:#fff;padding:2px 6px;border-radius:6px;font-size:10px;">${sLbl}</span></td>
        <td>
          <button class="btn" style="font-size:11px;padding:3px 8px;" onclick="openDash(${c.id})">📊</button>
          ${c.status === 'draft' ? `<button class="btn btn-success" style="font-size:11px;padding:3px 8px;" onclick="changeStatus(${c.id}, 'active')">▶開催</button>` : ''}
          ${c.status === 'active' ? `<button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;" onclick="changeStatus(${c.id}, 'closed')">⏹終了</button>` : ''}
          <button class="btn btn-danger" style="font-size:11px;padding:3px 8px;" onclick="delChallenge(${c.id})">🗑</button>
        </td>
      </tr>`;
    }).join('') + '</tbody></table>';
}

async function changeStatus(id, status) {
  await api('/api/challenges/' + id, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }) });
  loadList();
}
async function delChallenge(id) {
  if (!confirm('このチャレンジを削除しますか？(参加データも見えなくなります)')) return;
  await api('/api/challenges/' + id, { method: 'DELETE' });
  loadList();
}

async function openDash(id) {
  const d = await api('/api/challenges/' + id + '/dashboard');
  if (!d.success) { alert(d.msg || '失敗'); return; }
  const da = document.getElementById('dash-area');
  da.style.display = 'block';
  document.getElementById('dash-title').textContent = '📊 ' + d.challenge.icon + ' ' + d.challenge.title;
  // KPI集計
  let kpiItems = []; try { kpiItems = JSON.parse(d.challenge.kpi_items || '[]'); } catch(e) {}
  const totalP = d.participants.length;
  const activeP = d.participants.filter(p => p.record_count > 0).length;
  const totalRecords = d.records.length;
  const partRate = totalP ? Math.round((activeP / totalP) * 100) : 0;
  // KPI平均
  const kpiSum = {};
  for (const r of d.records) {
    let v = {}; try { v = JSON.parse(r.values || '{}'); } catch(e) {}
    for (const k of Object.keys(v)) {
      const n = Number(v[k]);
      if (!isNaN(n)) {
        if (!kpiSum[k]) kpiSum[k] = { sum: 0, count: 0 };
        kpiSum[k].sum += n; kpiSum[k].count++;
      }
    }
  }
  const kpiCards = kpiItems.map(k => {
    const s = kpiSum[k.key];
    const avg = s ? (s.sum / s.count).toFixed(1) : '-';
    return `<div class="dash-card"><div class="n">${avg}</div><div class="l">${escapeHtml(k.label||k.key)} 平均 ${escapeHtml(k.unit||'')}</div></div>`;
  }).join('');
  document.getElementById('dash-stat').innerHTML = `
    <div class="dash-card"><div class="n">${totalP}</div><div class="l">参加者数</div></div>
    <div class="dash-card"><div class="n">${activeP} <span style="font-size:14px;">(${partRate}%)</span></div><div class="l">記録した人</div></div>
    <div class="dash-card"><div class="n">${totalRecords}</div><div class="l">総記録数</div></div>
    ${kpiCards}
  `;
  document.getElementById('dash-tbody').innerHTML = d.participants.map(p => {
    const last = p.last_record_date || '-';
    return `<tr>
      <td>${escapeHtml(p.display_name || '-')}</td>
      <td style="font-size:11px;color:#64748b;">${escapeHtml(p.company_code || '-')}</td>
      <td>${p.record_count}日</td>
      <td style="font-size:11px;">${escapeHtml(last)}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="4" style="color:#94a3b8;text-align:center;">参加者なし</td></tr>';
  da.scrollIntoView({ behavior: 'smooth' });
}

init();
</script>
  <script src="/translate.js" defer></script>
</body>
</html>
