<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🩺 聞き取りカードPOST</title>
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg: #f8fafc; --fg: #0f172a; --mute: #64748b;
  --card: #ffffff; --border: #e2e8f0;
  --accent: #14b8a6; --accent-d: #0f766e;
  --warn: #f59e0b; --danger: #ef4444;
  --chip: #f1f5f9; --chip-on: #ccfbf1; --chip-on-fg: #115e59;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; }
.hd { position: sticky; top: 0; z-index: 10; background: linear-gradient(180deg, #f0fdfa, #ecfeff); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
.hd a.back { color: var(--accent-d); text-decoration: none; font-weight: 600; padding: 6px 10px; border-radius: 8px; background: rgba(20,184,166,.1); }
.hd .title { flex: 1; font-weight: 700; font-size: 16px; }
.hd .meta { color: var(--mute); font-size: 12px; }
.intro { padding: 12px 16px; color: var(--mute); font-size: 13px; line-height: 1.6; background: #fff; border-bottom: 1px solid var(--border); }
.intro b { color: var(--accent-d); }
.progress { padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; font-size: 13px; }
.progress .bar { flex: 1; height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
.progress .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.list { padding: 12px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.subj { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 30px 8px 10px; cursor: pointer; transition: all .15s; display: flex; flex-direction: column; gap: 4px; align-items: center; text-align: center; position: relative; min-height: 140px; }
.subj:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(20,184,166,.15); }
.subj .av { width: 48px; height: 48px; border-radius: 50%; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
.subj .av img { width: 100%; height: 100%; object-fit: cover; }
.subj .name { font-weight: 600; font-size: 14px; line-height: 1.3; }
.subj .co { color: var(--mute); font-size: 11px; }
.subj .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
.subj .badge { background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 10px; font-weight: 600; }
.subj.posted { background: #f0fdfa; border-color: #5eead4; }
/* 2つの調査結果バッジを左上(HL)/右上(聞き取り)に配置 */
.subj .stat-mark {
  position: absolute; top: 5px; font-size: 10px; padding: 2px 6px;
  border-radius: 6px; max-width: 47%; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-weight: 600;
}
.subj .stat-hl { left: 5px; background: #f1f5f9; color: var(--mute); }
.subj .stat-hl.recent { background: #ccfbf1; color: var(--accent-d); }
.subj .stat-hl.stale { background: #fef3c7; color: #92400e; }
.subj .stat-hl.none { background: #fee2e2; color: #991b1b; }
.subj .stat-post { right: 5px; background: #f1f5f9; color: var(--mute); }
.subj .stat-post.today { background: #ccfbf1; color: var(--accent-d); }
.subj .stat-post.recent { background: #e0f2fe; color: #075985; }
.subj .stat-post.old { background: #f1f5f9; color: var(--mute); }
.subj .stat-post.high { background: #fee2e2; color: #991b1b; }
.subj .stat-post.mid { background: #fef3c7; color: #92400e; }
.subj .stat-post.none { background: #fee2e2; color: #991b1b; }
.empty { padding: 40px 20px; text-align: center; color: var(--mute); }
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.5); backdrop-filter: blur(4px); display: none; align-items: flex-end; justify-content: center; z-index: 100; }
.modal-bg.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 18px 0 18px; -webkit-overflow-scrolling: touch; }
@media (min-width: 600px) { .modal-bg { align-items: center; } .modal { border-radius: 16px; max-height: 85vh; } }
.modal h2 { margin: 0 0 4px 0; font-size: 18px; }
.modal .sub { color: var(--mute); font-size: 13px; margin-bottom: 14px; }
.field { margin: 14px 0; }
.field .lbl { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--chip); border: 1px solid var(--border); border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; user-select: none; transition: all .12s; }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--chip-on); border-color: var(--accent); color: var(--chip-on-fg); font-weight: 600; }
.chip.sev1.on { background: #fef3c7; border-color: var(--warn); color: #92400e; }
.chip.sev2.on { background: #fee2e2; border-color: var(--danger); color: #991b1b; }
textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical; }
.fixed-foot { position: sticky; bottom: 0; background: #fff; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)) 18px; margin: 16px -18px 0 -18px; display: flex; gap: 10px; border-top: 1px solid var(--border); box-shadow: 0 -6px 14px rgba(15,23,42,.06); z-index: 1; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
.btn-cancel { background: #f1f5f9; color: var(--fg); }
.btn-submit { background: var(--accent); color: #fff; }
.btn-submit:disabled { opacity: .5; cursor: not-allowed; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 8px; z-index: 200; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.summary { background: #f0fdfa; border: 1px solid #5eead4; border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 10px 0; }
.summary .urg { font-weight: 700; }
.hl-section { margin-top: 18px; padding-top: 14px; border-top: 2px dashed var(--border); }
.hl-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.hl-head .ttl { font-weight: 700; font-size: 14px; }
.hl-head .hint { font-size: 11px; color: var(--mute); }
.hl-status { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #f1f5f9; color: var(--mute); }
.hl-status.recent { background: #ccfbf1; color: var(--accent-d); font-weight: 700; }
.hl-status.stale { background: #fef3c7; color: #92400e; font-weight: 700; }
.hl-status.none { background: #fee2e2; color: #991b1b; font-weight: 700; }
.q-card { margin: 10px 0; }
.q-text { font-size: 12px; font-weight: 600; line-height: 1.55; margin-bottom: 6px; display: flex; gap: 6px; align-items: flex-start; color: var(--fg); }
.q-num { background: var(--accent); color: #fff; border-radius: 50%; min-width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 10px; font-weight: 800; flex-shrink: 0; }
.scale { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.scale-opt { background: var(--chip); border: 2px solid var(--border); border-radius: 8px; padding: 6px 2px; text-align: center; cursor: pointer; font-size: 10px; line-height: 1.25; color: #475569; user-select: none; }
.scale-opt .v { display: block; font-size: 15px; font-weight: 800; color: var(--mute); margin-bottom: 1px; }
.scale-opt:active { transform: scale(.96); }
.scale-opt.on { background: var(--chip-on); border-color: var(--accent); color: var(--chip-on-fg); font-weight: 700; }
.scale-opt.on .v { color: var(--accent-d); }
.hl-actions { display: flex; gap: 8px; margin-top: 6px; }
.hl-clear { font-size: 11px; color: var(--mute); background: none; border: none; cursor: pointer; padding: 2px 6px; text-decoration: underline; }
</style>
</head>
<body>
<div class="hd">
  <a href="/home" class="back">←</a>
  <div>
    <div class="title">🩺 聞き取りカード POST</div>
    <div class="meta" id="hd-co">…</div>
  </div>
</div>
<div class="intro">
  <b>原則は社員自身の投稿</b>から悩み・相談を吸い上げます。
  このカードはそのバックアップとして、点呼や朝礼・昼礼で <b>1人1枚</b> 様子を記録します。<br>
  <b>全項目必須ではありません</b>。気になった項目だけ選んで提出してOK。
  健康アクションプランの元情報として食事傾向・偏食もまとめて拾えます。<br>
  <b>📊 ヘルスリテラシー5問</b> も同じカードから入力可能（90日に1回でOK・未回答/古い人を優先）。
</div>
<div class="progress" id="prog-wrap" style="display:none;">
  <div>本日 <b id="prog-cnt">0</b> / <b id="prog-tot">0</b></div>
  <div class="bar"><span id="prog-bar" style="width:0%"></span></div>
</div>
<div id="list" class="list"></div>

<div id="modal-bg" class="modal-bg" onclick="if (event.target.id==='modal-bg') closeModal()">
  <div class="modal" id="modal">
    <h2 id="m-title">聞き取りカード</h2>
    <div class="sub" id="m-sub"></div>
    <div id="m-fields"></div>
    <div class="field">
      <div class="lbl">📝 メモ (任意・200字)</div>
      <textarea id="m-memo" maxlength="200" placeholder="気になる一言があれば"></textarea>
    </div>
    <div class="hl-section" id="m-hl-section">
      <div class="hl-head">
        <span class="ttl">📊 ヘルスリテラシー (任意・5問4択)</span>
        <span class="hl-status" id="m-hl-status">…</span>
      </div>
      <div class="hl-head">
        <span class="hint">CCHL尺度 / 90日に1回程度でOK。5問すべて答えると保存されます。</span>
      </div>
      <div id="m-hl-questions"></div>
      <div class="hl-actions">
        <button type="button" class="hl-clear" onclick="clearHL()">この5問の回答をクリア</button>
      </div>
    </div>
    <div class="summary" id="m-summary" style="display:none;"></div>
    <div class="fixed-foot">
      <button class="btn btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-submit" id="m-submit" onclick="submitCard()">提出</button>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const SOURCE_TYPE = '聞き取り';
const HL_RECENT_DAYS = 90;
const token = localStorage.getItem('cohub_token') || '';
let me = null;
let meta = null;
let cardConf = null;
let subjects = [];
let postedToday = new Set();
let currentSubject = null;
let answers = {};
// ヘルスリテラシー関連
let hlQuestions = [];
let hlScale = [];
let hlBySubject = new Map(); // user_id -> { last_answered_at, last_avg_score }
let hlAnswers = [null, null, null, null, null];

async function api(path, opts = {}) {
  opts.headers = opts.headers || {};
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(path, opts);
  if (r.status === 401) { location.replace('/'); return null; }
  return r.json();
}

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function showToast(msg, ms = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

async function init() {
  if (!token) { location.replace('/'); return; }
  const meR = await api('/api/auth/me');
  if (!meR || !meR.success) { location.replace('/'); return; }
  me = meR.user;
  if (!me.is_field_promoter && !me.is_warehouse_promoter && !me.is_ops_manager && !me.is_branch_head && me.employee_type !== 'admin' && me.role !== 'admin') {
    document.getElementById('list').innerHTML = '<div class="empty">聞き取り記録の権限がありません。</div>';
    return;
  }
  document.getElementById('hd-co').textContent = me.display_name + 'さん / ' + (me.company_code || '-');
  const m = await api('/api/wellness/meta');
  meta = m;
  cardConf = (m.card_options && m.card_options[SOURCE_TYPE]) || null;
  if (!cardConf) {
    document.getElementById('list').innerHTML = '<div class="empty">カード設定の取得に失敗しました。</div>';
    return;
  }
  await loadHlMeta();
  await loadSubjects();
  await loadHlSubjects();
  recomputePostedToday();
  renderList();
  updateProgress();
  // 新規登録に追従するため60秒ごとに対象者を自動更新 (モーダル表示中はスキップ)
  setInterval(async () => {
    if (document.getElementById('modal-bg').classList.contains('show')) return;
    if (document.hidden) return;
    await loadSubjects();
    await loadHlSubjects();
    recomputePostedToday();
    renderList();
    updateProgress();
  }, 60000);
}

function recomputePostedToday() {
  const today = new Date().toISOString().slice(0, 10);
  postedToday = new Set();
  for (const s of subjects) {
    if (s.last_post_at && s.last_post_at.slice(0, 10) === today) postedToday.add(s.id);
  }
}

async function loadHlMeta() {
  const r = await api('/api/health-literacy/meta');
  if (r && r.success) {
    hlQuestions = r.questions || [];
    hlScale = r.scale || [];
  }
}

async function loadHlSubjects() {
  const r = await api('/api/health-literacy/subjects');
  if (!r || !r.success) return;
  hlBySubject = new Map();
  for (const s of (r.subjects || [])) {
    hlBySubject.set(s.id, {
      last_answered_at: s.last_answered_at || null,
      last_avg_score: s.last_avg_score || null,
    });
  }
  renderList();
}

function hlStatusFor(uid) {
  const h = hlBySubject.get(uid);
  if (!h || !h.last_answered_at) return { state: 'none', label: '📊 未', days: null, score: null };
  const ts = h.last_answered_at + (h.last_answered_at.endsWith('Z') ? '' : 'Z');
  const dt = new Date(ts);
  const days = Math.floor((Date.now() - dt.getTime()) / 86400000);
  const score = (h.last_avg_score == null) ? null : Number(h.last_avg_score);
  const scoreLabel = score == null ? '' : ' ' + score.toFixed(1);
  const dayLabel = days === 0 ? '本日' : days + '日前';
  if (days < HL_RECENT_DAYS) {
    return { state: 'recent', label: '📊 ' + dayLabel + scoreLabel, days, score };
  }
  return { state: 'stale', label: '📊 ' + dayLabel + scoreLabel, days, score };
}

function postStatusFor(s) {
  if (!s.last_post_at) return { state: 'none', label: '🩺 未', days: null };
  const ts = s.last_post_at + (s.last_post_at.endsWith('Z') ? '' : 'Z');
  const dt = new Date(ts);
  const days = Math.floor((Date.now() - dt.getTime()) / 86400000);
  const urgMark = s.last_urgency === '高' ? '🔴' : s.last_urgency === '中' ? '🟡' : '🟢';
  const dayLabel = days === 0 ? '本日' : days + '日前';
  let state = 'old';
  if (days === 0) state = (s.last_urgency === '高' ? 'high' : s.last_urgency === '中' ? 'mid' : 'today');
  else if (days < 7) state = 'recent';
  return { state, label: '🩺 ' + dayLabel + urgMark, days, urgency: s.last_urgency };
}

async function loadSubjects() {
  const r = await api('/api/wellness/subjects');
  if (!r || !r.success) {
    document.getElementById('list').innerHTML = '<div class="empty">対象者の取得に失敗しました。</div>';
    return;
  }
  subjects = r.subjects || [];
  renderList();
}


function updateProgress() {
  const wrap = document.getElementById('prog-wrap');
  if (!subjects.length) { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const tot = subjects.length;
  const cnt = subjects.filter(s => postedToday.has(s.id)).length;
  document.getElementById('prog-cnt').textContent = cnt;
  document.getElementById('prog-tot').textContent = tot;
  const pct = tot ? Math.round(cnt / tot * 100) : 0;
  document.getElementById('prog-bar').style.width = pct + '%';
}

function renderList() {
  const el = document.getElementById('list');
  if (!subjects.length) {
    el.innerHTML = '<div class="empty">対象者が登録されていません。</div>';
    return;
  }
  // (1)本日聞き取り済みを後ろへ (2)HL未/古い人を前へ (3)聞き取り古い人を前へ (4)名前順
  const sorted = subjects.slice().sort((a, b) => {
    const pa = postedToday.has(a.id) ? 1 : 0;
    const pb = postedToday.has(b.id) ? 1 : 0;
    if (pa !== pb) return pa - pb;
    const ha = hlStatusFor(a.id);
    const hb = hlStatusFor(b.id);
    const rank = { none: 0, stale: 1, recent: 2 };
    if (rank[ha.state] !== rank[hb.state]) return rank[ha.state] - rank[hb.state];
    const pad = a.last_post_at ? new Date(a.last_post_at).getTime() : 0;
    const pbd = b.last_post_at ? new Date(b.last_post_at).getTime() : 0;
    if (pad !== pbd) return pad - pbd; // 古い/未を先頭へ
    return (a.display_name || '').localeCompare(b.display_name || '', 'ja');
  });
  const html = sorted.map(s => {
    const posted = postedToday.has(s.id);
    const ic = s.avatar_url ? `<img src="${escapeHtml(s.avatar_url)}" alt="">` : '👤';
    const hl = hlStatusFor(s.id);
    const ps = postStatusFor(s);
    return `<div class="subj ${posted ? 'posted' : ''}" onclick="openCard('${escapeHtml(s.id)}')">
      <div class="stat-mark stat-hl ${hl.state}" title="ヘルスリテラシー">${escapeHtml(hl.label)}</div>
      <div class="stat-mark stat-post ${ps.state}" title="聞き取り (最新${ps.urgency ? ' / 緊急度: '+ps.urgency : ''})">${escapeHtml(ps.label)}</div>
      <div class="av">${ic}</div>
      <div class="name">${escapeHtml(s.display_name)}</div>
      <div class="co">${escapeHtml(s.company_code || '-')}</div>
      <div class="badges">
        ${posted ? '<div class="badge">本日聞済</div>' : ''}
      </div>
    </div>`;
  }).join('');
  el.innerHTML = html;
}

function openCard(uid) {
  currentSubject = subjects.find(s => s.id === uid);
  if (!currentSubject) return;
  answers = {};
  hlAnswers = [null, null, null, null, null];
  document.getElementById('m-title').textContent = cardConf.title + ': ' + currentSubject.display_name;
  document.getElementById('m-sub').textContent = currentSubject.company_code + ' / 聞き取り: ' + me.display_name;
  document.getElementById('m-memo').value = '';
  document.getElementById('m-summary').style.display = 'none';
  const fwrap = document.getElementById('m-fields');
  fwrap.innerHTML = cardConf.fields.map(f => {
    const chips = f.options.map(o =>
      `<button class="chip sev${o.s}" data-key="${escapeHtml(f.key)}" data-val="${escapeHtml(o.v)}" data-sev="${o.s}" onclick="pickChip(this)">${escapeHtml(o.v)}</button>`
    ).join('');
    return `<div class="field"><div class="lbl">${f.label}</div><div class="chips">${chips}</div></div>`;
  }).join('');
  renderHlSection();
  document.getElementById('modal-bg').classList.add('show');
}

function renderHlSection() {
  const sect = document.getElementById('m-hl-section');
  if (!hlQuestions.length || !hlScale.length) {
    sect.style.display = 'none';
    return;
  }
  sect.style.display = '';
  const hl = currentSubject ? hlStatusFor(currentSubject.id) : { state: 'none', label: '📊 未回答' };
  const statEl = document.getElementById('m-hl-status');
  statEl.className = 'hl-status ' + hl.state;
  statEl.textContent = hl.label;
  const ql = document.getElementById('m-hl-questions');
  ql.innerHTML = hlQuestions.map((q, i) => {
    const opts = hlScale.map(s =>
      `<div class="scale-opt" data-q="${i}" data-v="${s.v}" onclick="pickHl(${i}, ${s.v})">
        <span class="v">${s.v}</span>${escapeHtml(s.label)}
      </div>`
    ).join('');
    return `<div class="q-card">
      <div class="q-text"><span class="q-num">${i+1}</span><span>${escapeHtml(q)}</span></div>
      <div class="scale">${opts}</div>
    </div>`;
  }).join('');
}

function pickHl(qi, v) {
  hlAnswers[qi] = v;
  document.querySelectorAll(`#m-hl-questions [data-q="${qi}"]`).forEach(el => el.classList.remove('on'));
  const el = document.querySelector(`#m-hl-questions [data-q="${qi}"][data-v="${v}"]`);
  if (el) el.classList.add('on');
  refreshSummary();
}

function clearHL() {
  hlAnswers = [null, null, null, null, null];
  document.querySelectorAll('#m-hl-questions .scale-opt.on').forEach(el => el.classList.remove('on'));
  refreshSummary();
}

function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
  currentSubject = null;
  answers = {};
  hlAnswers = [null, null, null, null, null];
}

function pickChip(btn) {
  const key = btn.dataset.key;
  const val = btn.dataset.val;
  document.querySelectorAll(`.chip[data-key="${key}"]`).forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
  answers[key] = val;
  refreshSummary();
}

function refreshSummary() {
  let maxSev = 0; let cat = null;
  for (const f of cardConf.fields) {
    const v = answers[f.key];
    if (!v) continue;
    const opt = f.options.find(o => o.v === v);
    if (!opt) continue;
    if (opt.s > maxSev) { maxSev = opt.s; cat = f.category; }
    else if (opt.s > 0 && cat === null) cat = f.category;
  }
  const filled = Object.keys(answers).length;
  const hlFilled = hlAnswers.filter(v => v !== null).length;
  const sumEl = document.getElementById('m-summary');
  const parts = [];
  if (filled > 0) {
    const urg = maxSev >= 2 ? '高 🔴' : maxSev >= 1 ? '中 🟡' : '低 🟢';
    parts.push(`聞き取り: <span class="urg">${urg}</span>${cat ? ' / ' + escapeHtml(cat) : ''} (${filled}/${cardConf.fields.length})`);
  }
  if (hlFilled > 0) {
    if (hlFilled === 5) {
      const total = hlAnswers.reduce((a, b) => a + (b || 0), 0);
      parts.push(`HL: 平均 <b>${(total / 5).toFixed(2)}</b> / 4.00 (5/5)`);
    } else {
      parts.push(`HL: ${hlFilled}/5 (5問すべて答えると保存)`);
    }
  }
  if (!parts.length) { sumEl.style.display = 'none'; return; }
  sumEl.style.display = 'block';
  sumEl.innerHTML = parts.join('　');
}

async function submitCard() {
  if (!currentSubject) return;
  const memo = document.getElementById('m-memo').value.trim();
  const cardFilled = Object.keys(answers).length > 0 || !!memo;
  const hlFilled = hlAnswers.filter(v => v !== null).length;
  const hlComplete = hlFilled === 5;
  if (hlFilled > 0 && !hlComplete) {
    showToast('ヘルスリテラシーは5問すべて答えてください（または全クリア）');
    return;
  }
  if (!cardFilled && !hlComplete) {
    showToast('聞き取り1項目/メモ、またはHL5問のどれかを記入してください');
    return;
  }
  const btn = document.getElementById('m-submit');
  btn.disabled = true;
  btn.textContent = '送信中…';
  const msgs = [];
  let anyFail = false;
  const subjectId = currentSubject.id;
  try {
    if (cardFilled) {
      const r = await api('/api/wellness/post-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject_user_id: subjectId,
          answers,
          memo,
        }),
      });
      if (r && r.success) {
        msgs.push(`🩺#${r.post_id} ${r.urgency}/${r.category}`);
        postedToday.add(subjectId);
        // タイル即時反映用に subject の最新聞き取り情報を更新
        const subj = subjects.find(x => x.id === subjectId);
        if (subj) {
          subj.last_post_at = new Date().toISOString();
          subj.last_urgency = r.urgency;
          subj.last_category = r.category;
        }
      } else {
        anyFail = true;
        msgs.push('🩺❌ ' + (r && r.msg || '送信失敗'));
      }
    }
    if (hlComplete) {
      const r = await api('/api/health-literacy/proxy-submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          subject_user_id: subjectId,
          q1: hlAnswers[0], q2: hlAnswers[1], q3: hlAnswers[2], q4: hlAnswers[3], q5: hlAnswers[4],
        }),
      });
      if (r && r.success) {
        msgs.push(`📊#${r.id} 平均${r.avg_score.toFixed(2)}点`);
        hlBySubject.set(subjectId, {
          last_answered_at: new Date().toISOString(),
          last_avg_score: r.avg_score,
        });
      } else {
        anyFail = true;
        msgs.push('📊❌ ' + (r && r.msg || 'HL送信失敗'));
      }
    }
    showToast((anyFail ? '⚠️ ' : '✅ ') + msgs.join(' / '), 3000);
    if (!anyFail) {
      closeModal();
      renderList();
      updateProgress();
    }
  } catch (e) {
    showToast('❌ 通信エラー');
  } finally {
    btn.disabled = false;
    btn.textContent = '提出';
  }
}

init();
</script>
