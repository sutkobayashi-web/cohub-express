<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoHub Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f1f5f9">
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #e2e8f0; color: #0f172a; overflow: hidden; height: 100vh; -webkit-tap-highlight-color: transparent; }
.screen { display: none; }

/* ===== Login ===== */
#login-screen { align-items: center; justify-content: center; height: 100vh; padding: 16px; background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%); }
#login-screen.active { display: flex; }
#space-screen.active { display: block; }
.login-card { background: #fff; color: #0f172a; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
.login-card .tag { text-align: center; color: #64748b; font-size: 12px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
.btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #06b6d4, #0891b2); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }
.err { color: #dc2626; font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }

/* ===== Space Layout (oVice風) ===== */
#space-screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #e2e8f0; }

/* 左サイドバー（アイコン縦列） */
#left-rail { position: absolute; top: 0; left: 0; bottom: 0; width: 64px; background: #0f172a; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
#left-rail .brand { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #06b6d4, #0891b2); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; }
#left-rail .rail-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: rgba(255,255,255,0.7); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 18px; transition: all 0.15s; position: relative; }
#left-rail .rail-btn .lbl { font-size: 9px; line-height: 1; }
#left-rail .rail-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
#left-rail .rail-btn.active { background: rgba(6,182,212,0.25); color: #06b6d4; }
#left-rail .spacer { flex: 1; }

/* 右サイドバー（メンバーリスト） */
#right-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 280px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); z-index: 18; display: flex; flex-direction: column; border-left: 1px solid rgba(15,23,42,0.08); box-shadow: -4px 0 16px rgba(15,23,42,0.08); transition: transform 0.25s ease; }
#right-panel.hidden { transform: translateX(100%); }
.panel-head { padding: 16px 16px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(15,23,42,0.08); }
.panel-head .ttl { font-weight: 700; font-size: 14px; flex: 1; color: #0f172a; }
.panel-head .count { background: #06b6d4; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
.panel-head .close { width: 28px; height: 28px; border-radius: 6px; background: transparent; border: none; cursor: pointer; color: #64748b; font-size: 18px; }
.panel-head .close:hover { background: rgba(15,23,42,0.06); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
.member-group { padding: 10px 12px 4px; font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; }
.member-row { padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.12s; }
.member-row:hover { background: rgba(6,182,212,0.08); }
.member-row.me { background: rgba(6,182,212,0.12); }
.member-avatar { width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; position: relative; overflow: hidden; border: 2px solid #333; }
.member-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.member-avatar .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #0f172a; }
.member-avatar .st-dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.member-meta { flex: 1; min-width: 0; }
.member-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0f172a; }
.member-sub { font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 4px; }

/* キャンバス領域 */
#space-canvas-wrap { position: absolute; top: 0; left: 64px; right: 280px; bottom: 88px; background: #e2e8f0; overflow: hidden; transition: right 0.25s ease; }
#right-panel.hidden ~ #space-canvas-wrap { right: 0; }
#space-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
#space-canvas.dragging { cursor: grabbing; }

/* フロアヘッダー（キャンバス上部にフロート） */
#floor-head { position: absolute; top: 12px; left: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #0f172a; box-shadow: 0 4px 12px rgba(15,23,42,0.08); display: flex; align-items: center; gap: 8px; z-index: 5; }
#floor-head .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

/* ミニマップ */
#minimap { position: absolute; right: 12px; bottom: 12px; width: 180px; height: 108px; background: rgba(255,255,255,0.9); border: 1px solid rgba(15,23,42,0.12); border-radius: 10px; box-shadow: 0 8px 20px rgba(15,23,42,0.12); backdrop-filter: blur(6px); overflow: hidden; z-index: 6; cursor: pointer; }
#minimap canvas { display: block; width: 100%; height: 100%; }
#minimap .mm-label { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; pointer-events: none; }

/* 下部コントロールバー */
#dock { position: absolute; bottom: 0; left: 64px; right: 0; height: 88px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(15,23,42,0.08); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 20px; z-index: 15; }
.dock-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #fff; color: #334155; box-shadow: 0 4px 12px rgba(15,23,42,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; position: relative; transition: all 0.15s; }
.dock-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15,23,42,0.16); }
.dock-btn:active { transform: translateY(0); }
.dock-btn.on { background: #06b6d4; color: #fff; }
.dock-btn.off { background: #fef2f2; color: #dc2626; }
.dock-btn .sub { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #64748b; font-weight: 600; white-space: nowrap; }
.dock-sep { width: 1px; height: 36px; background: rgba(15,23,42,0.1); margin: 0 4px; }
#dock-chat-wrap { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 28px; padding: 6px 8px 6px 16px; }
#dock-chat-wrap input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: #0f172a; }
#dock-chat-wrap input::placeholder { color: #94a3b8; }
#dock-chat-send { width: 40px; height: 40px; border-radius: 50%; border: none; background: #06b6d4; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

/* リアクションピッカー */
#reaction-pop { position: absolute; bottom: 100px; background: #fff; border-radius: 32px; padding: 10px 14px; display: none; gap: 6px; box-shadow: 0 12px 32px rgba(15,23,42,0.18); z-index: 30; }
#reaction-pop.show { display: flex; }
#reaction-pop button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; font-size: 20px; transition: all 0.12s; }
#reaction-pop button:hover { background: #06b6d4; transform: scale(1.1); }

/* ステータスメニュー */
#status-menu { position: absolute; bottom: 100px; background: #fff; border: 1px solid rgba(15,23,42,0.1); border-radius: 12px; padding: 6px; display: none; z-index: 30; min-width: 140px; box-shadow: 0 12px 28px rgba(15,23,42,0.15); }
#status-menu.show { display: block; }
#status-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; background: none; border: none; color: #0f172a; text-align: left; cursor: pointer; border-radius: 8px; font-size: 13px; }
#status-menu button:hover { background: #f1f5f9; }
#status-menu button .stdot { width: 10px; height: 10px; border-radius: 50%; }

/* メニューポップ（左レールから） */
#rail-menu { position: absolute; left: 72px; background: #fff; border-radius: 10px; padding: 6px; display: none; z-index: 30; min-width: 180px; box-shadow: 0 12px 28px rgba(15,23,42,0.18); }
#rail-menu.show { display: block; }
#rail-menu button { display: block; width: 100%; padding: 10px 12px; background: none; border: none; color: #0f172a; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px; }
#rail-menu button:hover { background: #f1f5f9; }

/* ===== Avatar Setup Modal ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; color: #0f172a; border: 1px solid rgba(15,23,42,0.08); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal .tag { color: #64748b; font-size: 12px; margin-bottom: 16px; }
.photo-picker { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 12px; position: relative; }
.photo-picker img { max-height: 240px; border-radius: 10px; margin-top: 10px; }
.photo-frame { position: relative; display: inline-block; }
.photo-frame .guide { position: absolute; inset: 0; pointer-events: none; }
.cand-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 10px 0 14px; }
.cand-card { background: #f1f5f9; border: 3px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; text-align: center; transition: all 0.15s; position: relative; }
.cand-card:hover { border-color: #7dd3fc; transform: translateY(-2px); }
.cand-card.active { border-color: #06b6d4; background: rgba(6,182,212,0.12); }
.cand-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: #e2e8f0; }
.cand-card .lbl { font-size: 11px; margin-top: 4px; color: #334155; font-weight: 600; }
.cand-card.active::after { content: '✓'; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: #06b6d4; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(6,182,212,0.4); }
.btn-ghost { padding: 8px 14px; background: transparent; border: 1px solid #cbd5e1; border-radius: 8px; color: #334155; cursor: pointer; font-size: 13px; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

/* ===== Chat bubble ===== */
.chat-bubble { position: absolute; background: #fff; color: #0f172a; padding: 6px 12px; border-radius: 14px; font-size: 13px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); pointer-events: none; max-width: 220px; word-break: break-word; animation: bubbleIn 0.2s ease; }
.chat-bubble::after { content: ''; position: absolute; bottom: -6px; left: 14px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.95); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

/* モバイル対応 */
@media (max-width: 800px) {
  #right-panel { width: 260px; }
  #right-panel.hidden { transform: translateX(100%); }
  #space-canvas-wrap { right: 0; }
  #space-canvas-wrap.with-panel { right: 260px; }
  #dock { gap: 8px; padding: 0 10px; }
  .dock-btn { width: 48px; height: 48px; font-size: 20px; }
  #dock-chat-wrap { display: none; }
  #minimap { width: 140px; height: 84px; }
  #left-rail .rail-btn .lbl { display: none; }
}
</style>
</head>
<body>

<!-- ログイン -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <h1>🏢 CoHub Express</h1>
    <div class="tag">グループ統合バーチャルオフィス</div>
    <div class="field"><label>ログインID</label><input type="text" id="login-id" autocomplete="username" value="taketake"></div>
    <div class="field"><label>パスワード</label><input type="password" id="login-pw" autocomplete="current-password" value="1234"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">ログイン</button>
    <div class="err" id="login-err"></div>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:#94a3b8;">
      <a href="/admin" style="color:#64748b;">管理画面</a>
    </div>
  </div>
</div>

<!-- 空間 -->
<div id="space-screen" class="screen">
  <!-- 左レール -->
  <div id="left-rail">
    <div class="brand" title="CoHub">🏢</div>
    <button class="rail-btn active" id="rail-members" onclick="togglePanel()" title="メンバー">
      <span>👥</span><span class="lbl">メンバー</span>
    </button>
    <button class="rail-btn" id="rail-minimap" onclick="toggleMinimap()" title="ミニマップ">
      <span>🗺️</span><span class="lbl">マップ</span>
    </button>
    <button class="rail-btn" onclick="openAvatarModal()" title="アバター">
      <span>🎨</span><span class="lbl">アバター</span>
    </button>
    <button class="rail-btn" onclick="location.href='/mylog'" title="自分のログ">
      <span>📜</span><span class="lbl">ログ</span>
    </button>
    <div class="spacer"></div>
    <button class="rail-btn" onclick="toggleRailMenu(event)" title="メニュー">
      <span>⚙️</span><span class="lbl">設定</span>
    </button>
  </div>

  <!-- 右サイドバー -->
  <div id="right-panel">
    <div class="panel-head">
      <div class="ttl">メンバー</div>
      <div class="count" id="member-count">0</div>
      <button class="close" onclick="togglePanel()" title="閉じる">×</button>
    </div>
    <div class="panel-body" id="member-list"></div>
  </div>

  <!-- キャンバス領域 -->
  <div id="space-canvas-wrap">
    <canvas id="space-canvas"></canvas>
    <div id="floor-head">
      <span class="dot"></span>
      <span>Main Floor</span>
      <span style="color:#94a3b8;font-weight:500;">・<span id="online-count">0</span>人オンライン</span>
    </div>
    <div id="minimap">
      <canvas id="minimap-canvas"></canvas>
      <div class="mm-label">MAP</div>
    </div>
  </div>

  <!-- 下部ドック -->
  <div id="dock">
    <button class="dock-btn" id="dock-mic" onclick="toggleMic()" title="マイク">🎤<div class="sub">マイク</div></button>
    <button class="dock-btn" id="dock-speaker" onclick="toggleSpeaker()" title="スピーカー">🔊<div class="sub">音量</div></button>
    <div class="dock-sep"></div>
    <button class="dock-btn" id="dock-react" onclick="toggleReactions(event)" title="リアクション">😊<div class="sub">リアクション</div></button>
    <button class="dock-btn" id="dock-status" onclick="toggleStatusMenu(event)" title="ステータス">
      <span id="status-dot-big" style="width:16px;height:16px;border-radius:50%;background:#10b981;display:inline-block;border:3px solid #fff;box-shadow:0 0 0 1px #10b981;"></span>
      <div class="sub" id="status-label">在席中</div>
    </button>
    <div class="dock-sep"></div>
    <div id="dock-chat-wrap">
      <input type="text" id="chat-input" placeholder="近くの人に話しかける…" maxlength="500">
      <button id="dock-chat-send" onclick="sendChat()" title="送信">➤</button>
    </div>
    <button class="dock-btn" id="dock-leave" onclick="doLogout()" title="退席" style="background:#fef2f2;color:#dc2626;">🚪<div class="sub">退席</div></button>
  </div>

  <!-- リアクションピッカー -->
  <div id="reaction-pop">
    <button onclick="sendReaction('👍')">👍</button>
    <button onclick="sendReaction('❤️')">❤️</button>
    <button onclick="sendReaction('😂')">😂</button>
    <button onclick="sendReaction('👏')">👏</button>
    <button onclick="sendReaction('🙏')">🙏</button>
    <button onclick="sendReaction('🎉')">🎉</button>
    <button onclick="sendReaction('☕')">☕</button>
  </div>

  <!-- ステータスメニュー -->
  <div id="status-menu">
    <button onclick="setStatus('online')"><span class="stdot" style="background:#10b981;"></span>在席中</button>
    <button onclick="setStatus('退席中')"><span class="stdot" style="background:#eab308;"></span>退席中</button>
    <button onclick="setStatus('会議中')"><span class="stdot" style="background:#ef4444;"></span>会議中</button>
  </div>

  <!-- レールメニュー -->
  <div id="rail-menu">
    <button onclick="location.href='/admin'">🛠 管理画面</button>
    <button onclick="openAvatarModal()">🎨 アバター作り直し</button>
    <button onclick="doLogout()">🚪 ログアウト</button>
  </div>
</div>

<!-- アバター設定モーダル -->
<div id="avatar-modal" style="display:none;"></div>

<script>
let currentUser = null;
let token = localStorage.getItem('cohub_token') || '';
let userData = null;
try { userData = JSON.parse(localStorage.getItem('cohub_user') || 'null'); } catch(e) {}

const COMPANY_NAMES = {
  SU_HQ: 'SU本社', SU_SAITAMA: 'SU埼玉', SU_MKANTO: 'SU南関東', SU_ZAMA: 'SU座間',
  IBA_KASHIMA: 'IBA鹿島', IBA_SANWA: 'IBA三和', SUZUE: 'スズエ', ADMIN: '管理職'
};

// ===== 認証 =====
async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.textContent = '';
  if (!id || !pw) { err.textContent = 'IDとパスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ login_id: id, password: pw })
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg; btn.disabled = false; btn.textContent = 'ログイン'; return; }
    token = d.token;
    userData = d.user;
    localStorage.setItem('cohub_token', token);
    localStorage.setItem('cohub_user', JSON.stringify(userData));
    enterSpace();
  } catch(e) {
    err.textContent = '通信エラー'; btn.disabled = false; btn.textContent = 'ログイン';
  }
}

function doLogout() {
  fetch('/api/auth/logout', { method:'POST', headers:{'Authorization':'Bearer '+token} });
  localStorage.removeItem('cohub_token');
  localStorage.removeItem('cohub_user');
  location.reload();
}

// ===== 空間 =====
let socket = null;
let users = {};           // uid → user state
let targets = {};          // uid → 補間目標座標 { x, y }
let me = null;
let myX = 600, myY = 400;
let proximityRadius = 220;
let canvas, ctx, mmCanvas, mmCtx;
let bgImage = null;
let avatarImages = {}; // uid → Image
const bubbles = []; // { uid, content, at, isEmoji }

// ワールド座標系: 1200 × 720
const WORLD_W = 1200;
const WORLD_H = 720;
let viewScale = 1; // 実表示に対するスケール

// ドラッグ状態
let dragging = false;
let dragStart = null;
let dragEmitTimer = 0;
const DRAG_EMIT_INTERVAL = 80;

function enterSpace() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('space-screen').classList.add('active');
  currentUser = userData;
  initCanvas();
  loadBackground();
  connectSocket();
  // 初回ログインでアバター未設定なら促す
  if (!currentUser.avatar_url) {
    setTimeout(openAvatarModal, 600);
  }
  // パネル初期表示: モバイルは閉じ
  if (window.innerWidth <= 800) togglePanel(true);
}

function initCanvas() {
  canvas = document.getElementById('space-canvas');
  ctx = canvas.getContext('2d');
  mmCanvas = document.getElementById('minimap-canvas');
  mmCtx = mmCanvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  // ポインタ（マウス/タッチ統一）
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  // ミニマップクリックで視点/自分移動
  document.getElementById('minimap').addEventListener('click', onMinimapClick);

  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendChat();
  });

  // 外クリックでメニューを閉じる
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#reaction-pop') && !e.target.closest('#dock-react')) {
      document.getElementById('reaction-pop').classList.remove('show');
    }
    if (!e.target.closest('#status-menu') && !e.target.closest('#dock-status')) {
      document.getElementById('status-menu').classList.remove('show');
    }
    if (!e.target.closest('#rail-menu') && !e.target.closest('#left-rail')) {
      document.getElementById('rail-menu').classList.remove('show');
    }
  });

  requestAnimationFrame(render);
}

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * window.devicePixelRatio;
  canvas.height = r.height * window.devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // スケール: ワールド1200×720を表示領域にフィット（cover）
  viewScale = Math.max(r.width / WORLD_W, r.height / WORLD_H);

  const mmR = mmCanvas.getBoundingClientRect();
  mmCanvas.width = mmR.width * window.devicePixelRatio;
  mmCanvas.height = mmR.height * window.devicePixelRatio;
  mmCtx.setTransform(1,0,0,1,0,0);
  mmCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function loadBackground() {
  bgImage = new Image();
  bgImage.src = '/assets/office_bg.svg?v=3';
}

// スクリーン座標 → ワールド座標
function screenToWorld(sx, sy) {
  const r = canvas.getBoundingClientRect();
  // cover: viewScaleでcanvas表示。中央基準で配置
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (r.width - dw) / 2;
  const oy = (r.height - dh) / 2;
  return {
    x: (sx - ox) / viewScale,
    y: (sy - oy) / viewScale,
  };
}

// ワールド座標 → スクリーン座標
function worldToScreen(wx, wy) {
  const r = canvas.getBoundingClientRect();
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (r.width - dw) / 2;
  const oy = (r.height - dh) / 2;
  return {
    x: wx * viewScale + ox,
    y: wy * viewScale + oy,
  };
}

function connectSocket() {
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => console.warn('socket err', e.message));
  socket.on('snapshot', (data) => {
    me = data.me;
    proximityRadius = data.proximity || 220;
    users = {};
    targets = {};
    for (const u of data.users) {
      users[u.uid] = u;
      users[u.uid].cx = u.x || WORLD_W / 2;
      users[u.uid].cy = u.y || WORLD_H / 2;
      targets[u.uid] = { x: users[u.uid].cx, y: users[u.uid].cy };
      if (u.uid === me) { myX = users[u.uid].cx; myY = users[u.uid].cy; }
      if (u.avatar && !avatarImages[u.uid]) loadAvatar(u);
    }
    renderMemberList();
  });
  socket.on('user:update', (u) => {
    if (!users[u.uid]) users[u.uid] = { uid: u.uid, name: '...', ring: '#333', cx: u.x, cy: u.y };
    targets[u.uid] = { x: u.x, y: u.y };
    users[u.uid].status = u.status;
    if (u.uid === me) { myX = u.x; myY = u.y; }
    if (users[u.uid].avatar && !avatarImages[u.uid]) loadAvatar(users[u.uid]);
    renderMemberList();
  });
  socket.on('chat:msg', (m) => {
    const isEmoji = isSingleEmoji(m.content);
    bubbles.push({ uid: m.uid, content: m.content, at: Date.now(), isEmoji });
    while (bubbles.length > 40) bubbles.shift();
  });
}

function isSingleEmoji(s) {
  if (!s) return false;
  const trimmed = s.trim();
  if (trimmed.length > 6) return false;
  return /^(\p{Extended_Pictographic}|\p{Emoji}|\s)+$/u.test(trimmed);
}

function loadAvatar(u) {
  if (!u.avatar) return;
  const img = new Image();
  img.src = u.avatar;
  avatarImages[u.uid] = img;
}

// ===== ドラッグ&クリック移動 =====
function onPointerDown(e) {
  canvas.setPointerCapture(e.pointerId);
  dragging = true;
  canvas.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  const world = screenToWorld(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
  moveTo(world.x, world.y);
}

function onPointerMove(e) {
  if (!dragging) return;
  const r = canvas.getBoundingClientRect();
  const world = screenToWorld(e.clientX - r.left, e.clientY - r.top);
  const now = Date.now();
  if (now - dragEmitTimer > DRAG_EMIT_INTERVAL) {
    moveTo(world.x, world.y);
    dragEmitTimer = now;
  } else {
    // ローカルだけ先行補間
    if (users[me]) targets[me] = { x: clampX(world.x), y: clampY(world.y) };
  }
}

function onPointerUp(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
}

// 壁の内側のみ歩行可（外周70px壁+アバター半径）
function clampX(x) { return Math.max(105, Math.min(WORLD_W - 105, x)); }
function clampY(y) { return Math.max(105, Math.min(WORLD_H - 105, y)); }

function moveTo(x, y) {
  const cx = clampX(x), cy = clampY(y);
  targets[me] = { x: cx, y: cy };
  myX = cx; myY = cy;
  if (users[me]) { users[me].x = cx; users[me].y = cy; }
  if (socket) socket.emit('move', { x: cx, y: cy });
}

function onMinimapClick(e) {
  const r = mmCanvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const wx = (mx / r.width) * WORLD_W;
  const wy = (my / r.height) * WORLD_H;
  moveTo(wx, wy);
}

// ===== レンダリング =====
function render() {
  if (!ctx) return;

  // 補間: targets → users[uid].cx/cy に近づける
  for (const uid in targets) {
    if (!users[uid]) continue;
    const t = targets[uid];
    const u = users[uid];
    if (u.cx == null) { u.cx = t.x; u.cy = t.y; continue; }
    const dx = t.x - u.cx;
    const dy = t.y - u.cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 0.5) { u.cx = t.x; u.cy = t.y; continue; }
    // 最大速度 20px/frame 程度、距離に応じたeasing
    const speed = Math.min(Math.max(dist * 0.2, 2), 20);
    u.cx += (dx / dist) * speed;
    u.cy += (dy / dist) * speed;
  }

  const r = canvas.getBoundingClientRect();
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);

  // 背景: ワールドをcoverで描画
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (w - dw) / 2;
  const oy = (h - dh) / 2;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(viewScale, viewScale);

  if (bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, WORLD_W, WORLD_H);
  } else {
    // フォールバック
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }

  // 近接範囲（自分中心）
  if (me && users[me]) {
    const u = users[me];
    ctx.beginPath();
    ctx.arc(u.cx, u.cy, proximityRadius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(6,182,212,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,182,212,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // アバター群
  for (const uid in users) {
    const u = users[uid];
    if (u.cx == null) continue;
    if (u.status === 'offline') continue;
    drawAvatar(u);
  }

  // 吹き出し
  const now = Date.now();
  const bubbleLife = 5000;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (now - b.at > bubbleLife) { bubbles.splice(i, 1); continue; }
    const u = users[b.uid];
    if (!u || u.cx == null) continue;
    if (b.isEmoji) drawEmojiBubble(u.cx, u.cy, b.content, (now - b.at) / bubbleLife);
    else drawBubble(u.cx, u.cy - 50, b.content, Math.max(0, 1 - (now - b.at) / bubbleLife));
  }

  ctx.restore();

  // ミニマップ描画
  drawMinimap();

  requestAnimationFrame(render);
}

function drawAvatar(u) {
  const r = 28;
  ctx.save();
  // ステータスリング
  ctx.beginPath();
  ctx.arc(u.cx, u.cy, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = u.ring || '#333';
  ctx.fill();

  // ドロップシャドウ
  ctx.shadowColor = 'rgba(15,23,42,0.2)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;

  // アバター画像 / イニシャル
  const img = avatarImages[u.uid];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(u.cx, u.cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, u.cx - r, u.cy - r, r * 2, r * 2);
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.arc(u.cx, u.cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.name ? u.name.slice(0, 2) : '?', u.cx, u.cy);
  }
  ctx.shadowColor = 'transparent';

  // 名前バッジ
  ctx.font = '600 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const label = (u.name || '') + (u.status && u.status !== 'online' ? ' (' + u.status + ')' : '');
  const tw = ctx.measureText(label).width + 14;
  ctx.fillStyle = 'rgba(15,23,42,0.85)';
  roundRect(u.cx - tw/2, u.cy + r + 4, tw, 20, 10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(label, u.cx, u.cy + r + 14);

  // ステータスドット
  const dotColor = u.status === '会議中' ? '#ef4444' : u.status === '退席中' ? '#eab308' : '#10b981';
  ctx.beginPath();
  ctx.arc(u.cx + r - 4, u.cy - r + 4, 6, 0, Math.PI * 2);
  ctx.fillStyle = dotColor;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawBubble(x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '13px sans-serif';
  const maxW = 200;
  const lines = wrapText(text, maxW);
  const lineH = 16;
  const padding = 8;
  let bubbleW = 0;
  for (const l of lines) bubbleW = Math.max(bubbleW, ctx.measureText(l).width);
  bubbleW += padding * 2;
  const bubbleH = lines.length * lineH + padding * 2;
  const bx = x - bubbleW / 2;
  const by = y - bubbleH;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  roundRect(bx, by, bubbleW, bubbleH, 10);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 6, by + bubbleH);
  ctx.lineTo(x, by + bubbleH + 8);
  ctx.lineTo(x + 6, by + bubbleH);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + padding, by + padding + i * lineH);
  ctx.restore();
}

function drawEmojiBubble(cx, cy, emoji, progress) {
  // 下から上へフワッと浮かび、最後にフェード
  ctx.save();
  const rise = Math.min(progress * 2, 1) * 60;
  const alpha = progress < 0.75 ? 1 : (1 - (progress - 0.75) / 0.25);
  ctx.globalAlpha = alpha;
  ctx.font = '36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy - 40 - rise);
  ctx.restore();
}

function wrapText(text, maxW) {
  const out = [];
  let cur = '';
  for (const ch of text) {
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur) {
      out.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) out.push(cur);
  return out;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawMinimap() {
  if (!mmCtx) return;
  const r = mmCanvas.getBoundingClientRect();
  const mw = r.width, mh = r.height;
  mmCtx.clearRect(0, 0, mw, mh);

  // 壁（外枠） + 床
  mmCtx.fillStyle = '#c9bca3';
  mmCtx.fillRect(0, 0, mw, mh);
  const wall = Math.max(mw, mh) * 0.05;
  mmCtx.fillStyle = '#f2e4cc';
  mmCtx.fillRect(wall, wall, mw - wall * 2, mh - wall * 2);

  // 家具の大まかな矩形（SVGのレイアウトに対応）
  mmCtx.fillStyle = '#c8b48a';
  const sx = mw / WORLD_W;
  const sy = mh / WORLD_H;
  // 応接ソファ(左上)
  mmCtx.fillRect(110 * sx, 120 * sy, 290 * sx, 160 * sy);
  // 会議机(中央上)
  mmCtx.fillRect(440 * sx, 140 * sy, 320 * sx, 120 * sy);
  // 個人デスク(右上)
  mmCtx.fillRect(830 * sx, 120 * sy, 240 * sx, 70 * sy);
  // ホワイトボード(右中)
  mmCtx.fillRect(830 * sx, 240 * sy, 250 * sx, 16 * sy);
  // カフェ(左下)
  mmCtx.fillRect(110 * sx, 470 * sy, 280 * sx, 100 * sy);
  // 丸テーブル(中央下)
  mmCtx.beginPath();
  mmCtx.arc(600 * sx, 510 * sy, 42 * Math.min(sx, sy), 0, Math.PI * 2);
  mmCtx.fill();
  // 本棚(右下)
  mmCtx.fillRect(1030 * sx, 380 * sy, 80 * sx, 230 * sy);
  // ドア(下中央)
  mmCtx.fillStyle = '#7b4f2a';
  mmCtx.fillRect(560 * sx, (mh - wall), 90 * sx, wall);

  // ユーザー dot
  const sx = mw / WORLD_W;
  const sy = mh / WORLD_H;
  for (const uid in users) {
    const u = users[uid];
    if (u.cx == null) continue;
    if (u.status === 'offline') continue;
    mmCtx.beginPath();
    mmCtx.arc(u.cx * sx, u.cy * sy, uid === me ? 4 : 3, 0, Math.PI * 2);
    mmCtx.fillStyle = uid === me ? '#06b6d4' : (u.ring || '#334155');
    mmCtx.fill();
    if (uid === me) {
      mmCtx.strokeStyle = '#fff';
      mmCtx.lineWidth = 1.5;
      mmCtx.stroke();
    }
  }
}

// ===== メンバーリスト =====
function renderMemberList() {
  const list = document.getElementById('member-list');
  if (!list) return;

  const online = [];
  const offline = [];
  for (const uid in users) {
    const u = users[uid];
    if (u.status === 'offline') offline.push(u);
    else online.push(u);
  }
  online.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  offline.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  document.getElementById('member-count').textContent = online.length;
  document.getElementById('online-count').textContent = online.length;

  let html = '';
  if (online.length > 0) {
    html += '<div class="member-group">オンライン</div>';
    for (const u of online) html += memberRowHtml(u);
  }
  if (offline.length > 0) {
    html += '<div class="member-group">オフライン</div>';
    for (const u of offline) html += memberRowHtml(u);
  }
  list.innerHTML = html;
}

function memberRowHtml(u) {
  const dotColor = u.status === 'offline' ? '#94a3b8' : u.status === '会議中' ? '#ef4444' : u.status === '退席中' ? '#eab308' : '#10b981';
  const companyName = COMPANY_NAMES[u.company] || u.company || '';
  const avatarHtml = u.avatar
    ? `<img src="${u.avatar}" alt="">`
    : `<div class="ini">${(u.name || '?').slice(0, 2)}</div>`;
  const isMe = u.uid === me;
  return `
    <div class="member-row ${isMe ? 'me' : ''}" onclick="walkTo('${u.uid}')">
      <div class="member-avatar" style="border-color:${u.ring || '#333'};">
        ${avatarHtml}
        <div class="st-dot" style="background:${dotColor};"></div>
      </div>
      <div class="member-meta">
        <div class="member-name">${escapeHtml(u.name || '')}${isMe ? ' <span style="color:#06b6d4;font-size:10px;">(自分)</span>' : ''}</div>
        <div class="member-sub">${companyName}${u.status && u.status !== 'online' && u.status !== 'offline' ? ' · ' + u.status : ''}</div>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// メンバーをクリック → その人の近くに歩いていく
function walkTo(uid) {
  const u = users[uid];
  if (!u || u.cx == null) return;
  if (uid === me) return;
  // 少しずらして隣に
  const angle = Math.random() * Math.PI * 2;
  const offset = 80;
  moveTo(u.cx + Math.cos(angle) * offset, u.cy + Math.sin(angle) * offset);
}

// ===== UIトグル =====
function togglePanel(forceHide) {
  const p = document.getElementById('right-panel');
  const wrap = document.getElementById('space-canvas-wrap');
  const btn = document.getElementById('rail-members');
  if (forceHide === true) {
    p.classList.add('hidden');
    wrap.classList.remove('with-panel');
    btn.classList.remove('active');
    return;
  }
  p.classList.toggle('hidden');
  if (p.classList.contains('hidden')) {
    wrap.classList.remove('with-panel');
    btn.classList.remove('active');
  } else {
    wrap.classList.add('with-panel');
    btn.classList.add('active');
  }
  setTimeout(resize, 280);
}

function setStatus(s) {
  if (!socket) return;
  socket.emit('status', { status: s });
  const label = s === 'online' ? '在席中' : s;
  document.getElementById('status-label').textContent = label;
  const color = s === '会議中' ? '#ef4444' : s === '退席中' ? '#eab308' : '#10b981';
  const dot = document.getElementById('status-dot-big');
  dot.style.background = color;
  dot.style.boxShadow = '0 0 0 1px ' + color;
  document.getElementById('status-menu').classList.remove('show');
}

// ===== アバター設定 =====
let avatarPhoto = null;
let currentCandidates = [];
let selectedCandidate = null;

// 顔+胴体ガイドSVG（カメラ/プレビューに重ねる）
const GUIDE_SVG = `<svg class="guide" viewBox="0 0 100 100" preserveAspectRatio="none">
  <ellipse cx="50" cy="32" rx="20" ry="23" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 2"/>
  <path d="M 22 70 Q 22 58 35 55 L 65 55 Q 78 58 78 70 L 78 98 L 22 98 Z" fill="none" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="2 2"/>
  <text x="50" y="35" text-anchor="middle" font-size="4.5" fill="#06b6d4" font-weight="700" opacity="0.85">顔</text>
  <text x="50" y="82" text-anchor="middle" font-size="4.5" fill="#06b6d4" font-weight="700" opacity="0.85">肩・胴体</text>
</svg>`;

function openAvatarModal() {
  const modal = document.getElementById('avatar-modal');
  modal.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeAvatarModal()">
      <div class="modal">
        <h2>🎨 アバターを作る</h2>
        <div class="tag">アニメ調に3パターン自動生成し、お気に入りを選べます。元の写真はサーバーに保存されません。</div>
        <div class="photo-picker" id="photo-picker-area">
          <div id="photo-placeholder">
            <div style="margin-bottom:10px;color:#64748b;font-size:13px;">顔と胴体がガイドの点線に収まるように撮影してください</div>
            <button class="btn-primary btn-small" style="width:auto;padding:8px 14px;margin:4px;" onclick="openCamera()">📷 カメラで撮る</button>
            <button class="btn-ghost btn-small" style="margin:4px;" onclick="document.getElementById('avatar-file').click()">📁 ファイルから</button>
          </div>
          <div id="camera-frame" class="photo-frame" style="display:none;width:100%;max-width:320px;margin:0 auto;">
            <video id="camera-video" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;background:#000;display:block;" autoplay playsinline></video>
            ${GUIDE_SVG}
          </div>
          <div id="camera-controls" style="display:none;margin-top:10px;">
            <button class="btn-primary btn-small" style="width:auto;padding:8px 14px;" onclick="takePhoto()">📸 撮影</button>
            <button class="btn-ghost btn-small" onclick="switchCamera()">🔄 切替</button>
            <button class="btn-ghost btn-small" onclick="closeCamera()">キャンセル</button>
          </div>
          <div id="preview-frame" class="photo-frame" style="display:none;max-width:240px;margin:0 auto;">
            <img id="photo-preview" style="width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border-radius:10px;">
            ${GUIDE_SVG}
          </div>
          <div id="photo-actions" style="display:none;margin-top:8px;">
            <button class="btn-ghost btn-small" onclick="retakePhoto()">🔁 撮り直し</button>
          </div>
        </div>
        <canvas id="camera-canvas" style="display:none;"></canvas>
        <input type="file" id="avatar-file" accept="image/*" capture="user" style="display:none;" onchange="onPhotoPick(this)">

        <div id="cand-section" style="display:none;">
          <div style="font-size:12px;color:#64748b;margin:10px 0 4px;">3パターンから選択</div>
          <div class="cand-grid" id="cand-grid"></div>
        </div>

        <div style="display:flex;gap:8px;">
          <button class="btn-primary" id="avatar-gen-btn" onclick="doGenerateSet()" disabled>3パターン自動生成 (約40秒)</button>
          <button class="btn-primary" id="avatar-confirm-btn" onclick="doConfirmAvatar()" style="display:none;">これにする</button>
          <button class="btn-ghost" onclick="closeAvatarModal()">閉じる</button>
        </div>
        <div id="avatar-err" class="err"></div>
        <div style="margin-top:12px;font-size:11px;color:#94a3b8;text-align:center;">
          <a href="javascript:removeAvatar()" style="color:#ef4444;">アバターを削除</a>
        </div>
      </div>
    </div>`;
  modal.style.display = 'block';
}

async function closeAvatarModal() {
  if (cameraStream) closeCamera();
  // 未確定候補が残っていればサーバー側を掃除
  if (currentCandidates && currentCandidates.length && !selectedCandidate) {
    try {
      await fetch('/api/avatar/discard', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ candidates: currentCandidates })
      });
    } catch (e) {}
  }
  currentCandidates = [];
  selectedCandidate = null;
  avatarPhoto = null;
  document.getElementById('avatar-modal').style.display = 'none';
}

function onPhotoPick(input) {
  if (!input.files || !input.files[0]) return;
  setPhoto(input.files[0]);
}

function setPhoto(fileOrBlob) {
  avatarPhoto = fileOrBlob;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = document.getElementById('photo-preview');
    img.src = e.target.result;
    document.getElementById('preview-frame').style.display = 'block';
    document.getElementById('photo-placeholder').style.display = 'none';
    document.getElementById('photo-actions').style.display = 'block';
    document.getElementById('avatar-gen-btn').disabled = false;
  };
  reader.readAsDataURL(fileOrBlob);
}

// ===== カメラ撮影 =====
let cameraStream = null;
let cameraFacing = 'user';

async function openCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('お使いのブラウザはカメラに対応していません');
      return;
    }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: cameraFacing, width: { ideal: 720 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.getElementById('camera-video');
    video.srcObject = cameraStream;
    document.getElementById('camera-frame').style.display = 'block';
    document.getElementById('camera-controls').style.display = 'block';
    document.getElementById('photo-placeholder').style.display = 'none';
    document.getElementById('preview-frame').style.display = 'none';
    document.getElementById('photo-actions').style.display = 'none';
  } catch (e) {
    console.error('camera error', e);
    alert('カメラにアクセスできません: ' + (e.message || e.name));
  }
}

async function switchCamera() {
  cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
  closeCamera();
  await openCamera();
}

function takePhoto() {
  const video = document.getElementById('camera-video');
  const c = document.getElementById('camera-canvas');
  const size = Math.min(video.videoWidth, video.videoHeight);
  c.width = size; c.height = size;
  const cctx = c.getContext('2d');
  const sx = (video.videoWidth - size) / 2;
  const sy = (video.videoHeight - size) / 2;
  if (cameraFacing === 'user') {
    cctx.save();
    cctx.scale(-1, 1);
    cctx.drawImage(video, sx, sy, size, size, -size, 0, size, size);
    cctx.restore();
  } else {
    cctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
  }
  c.toBlob((blob) => {
    if (!blob) return;
    const file = new File([blob], 'camera_' + Date.now() + '.jpg', { type: 'image/jpeg' });
    closeCamera();
    setPhoto(file);
  }, 'image/jpeg', 0.9);
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('camera-video');
  if (video) video.srcObject = null;
  const frame = document.getElementById('camera-frame');
  if (frame) frame.style.display = 'none';
  const ctrl = document.getElementById('camera-controls');
  if (ctrl) ctrl.style.display = 'none';
  const ph = document.getElementById('photo-placeholder');
  if (ph) ph.style.display = 'block';
}

function retakePhoto() {
  avatarPhoto = null;
  document.getElementById('preview-frame').style.display = 'none';
  document.getElementById('photo-actions').style.display = 'none';
  document.getElementById('photo-placeholder').style.display = 'block';
  document.getElementById('avatar-gen-btn').disabled = true;
  document.getElementById('cand-section').style.display = 'none';
  document.getElementById('avatar-confirm-btn').style.display = 'none';
  document.getElementById('avatar-gen-btn').style.display = 'inline-block';
  currentCandidates = [];
  selectedCandidate = null;
}

async function doGenerateSet() {
  const btn = document.getElementById('avatar-gen-btn');
  const err = document.getElementById('avatar-err');
  if (!avatarPhoto) return;
  btn.disabled = true; btn.textContent = '3パターン生成中... (最大60秒)'; err.textContent = '';
  const fd = new FormData();
  fd.append('photo', avatarPhoto);
  try {
    const r = await fetch('/api/avatar/generate-set', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: fd
    });
    const d = await r.json();
    if (!d.success || !d.candidates || !d.candidates.length) {
      err.textContent = d.msg || '生成に失敗しました';
      btn.disabled = false; btn.textContent = '3パターン自動生成 (約40秒)';
      return;
    }
    currentCandidates = d.candidates;
    selectedCandidate = d.candidates[0];
    renderCandidates();
    document.getElementById('cand-section').style.display = 'block';
    btn.style.display = 'none';
    document.getElementById('avatar-confirm-btn').style.display = 'inline-block';
  } catch(e) {
    err.textContent = '通信エラー';
    btn.disabled = false; btn.textContent = '3パターン自動生成 (約40秒)';
  }
}

function renderCandidates() {
  const grid = document.getElementById('cand-grid');
  if (!grid) return;
  grid.innerHTML = '';
  for (const c of currentCandidates) {
    const el = document.createElement('div');
    const isActive = selectedCandidate && selectedCandidate.avatar_url === c.avatar_url;
    el.className = 'cand-card' + (isActive ? ' active' : '');
    el.onclick = () => { selectedCandidate = c; renderCandidates(); };
    el.innerHTML = `<img src="${c.avatar_url}" alt=""><div class="lbl">${c.label || c.variant}</div>`;
    grid.appendChild(el);
  }
}

async function doConfirmAvatar() {
  if (!selectedCandidate) return;
  const btn = document.getElementById('avatar-confirm-btn');
  const err = document.getElementById('avatar-err');
  btn.disabled = true; btn.textContent = '確定中...'; err.textContent = '';
  try {
    const r = await fetch('/api/avatar/select', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        avatar_url: selectedCandidate.avatar_url,
        candidates: currentCandidates
      })
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || '確定に失敗しました'; btn.disabled = false; btn.textContent = 'これにする'; return; }
    currentUser.avatar_url = d.avatar_url;
    userData.avatar_url = d.avatar_url;
    localStorage.setItem('cohub_user', JSON.stringify(userData));
    if (users[me]) users[me].avatar = d.avatar_url;
    delete avatarImages[me];
    loadAvatar({ uid: me, avatar: d.avatar_url });
    // 掃除済みなので closeAvatarModal の discard はスキップ
    currentCandidates = [];
    selectedCandidate = { avatar_url: d.avatar_url }; // discard回避
    closeAvatarModal();
    renderMemberList();
    showToast('アバター完成！');
  } catch(e) {
    err.textContent = '通信エラー'; btn.disabled = false; btn.textContent = 'これにする';
  }
}

async function removeAvatar() {
  if (!confirm('アバターを削除しますか？')) return;
  await fetch('/api/avatar/remove', { method:'POST', headers:{'Authorization':'Bearer '+token} });
  currentUser.avatar_url = '';
  userData.avatar_url = '';
  localStorage.setItem('cohub_user', JSON.stringify(userData));
  if (users[me]) users[me].avatar = '';
  delete avatarImages[me];
  closeAvatarModal();
  renderMemberList();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// 自動ログイン
if (token && userData) {
  enterSpace();
}
</script>
