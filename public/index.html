<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoHub Express</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='80' font-size='90'%3E%F0%9F%8F%A2%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f1f5f9">
<script src="/socket.io/socket.io.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #e2e8f0; color: #0f172a; overflow: hidden; height: 100vh; -webkit-tap-highlight-color: transparent; }
.screen { display: none; }

/* ===== Login ===== */
#login-screen { align-items: center; justify-content: center; height: 100vh; padding: 16px; background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%); }
#login-screen.active { display: flex; }
#space-screen.active { display: block; }
.login-card { background: #fff; color: #0f172a; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(15,23,42,0.25); }
.login-card h1 { margin: 0 0 4px; font-size: 22px; text-align: center; }
.login-card .tag { text-align: center; color: #64748b; font-size: 12px; margin-bottom: 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
.field input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
.btn-primary { width: 100%; padding: 12px; background: linear-gradient(135deg, #06b6d4, #0891b2); border: none; border-radius: 8px; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px; }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }
.err { color: #dc2626; font-size: 12px; margin-top: 8px; text-align: center; min-height: 16px; }

/* ===== Space Layout (oVice風) ===== */
#space-screen { position: relative; width: 100vw; height: 100vh; overflow: hidden; background: #e2e8f0; }

/* 左サイドバー（アイコン縦列） */
#left-rail { position: absolute; top: 0; left: 0; bottom: 0; width: 64px; background: #0f172a; z-index: 20; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px; box-shadow: 2px 0 12px rgba(0,0,0,0.15); }
#left-rail .brand { width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #06b6d4, #0891b2); display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 12px; }
#left-rail .rail-btn { width: 44px; height: 44px; border-radius: 10px; background: transparent; border: none; color: rgba(255,255,255,0.7); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 18px; transition: all 0.15s; position: relative; }
#left-rail .rail-btn .lbl { font-size: 9px; line-height: 1; }
#left-rail .rail-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
#left-rail .rail-btn.active { background: rgba(6,182,212,0.25); color: #06b6d4; }
#left-rail .spacer { flex: 1; }

/* 右サイドバー（メンバーリスト） */
#right-panel { position: absolute; top: 0; right: 0; bottom: 0; width: 280px; background: rgba(255,255,255,0.92); backdrop-filter: blur(10px); z-index: 18; display: flex; flex-direction: column; border-left: 1px solid rgba(15,23,42,0.08); box-shadow: -4px 0 16px rgba(15,23,42,0.08); transition: transform 0.25s ease; }
#right-panel.hidden { transform: translateX(100%); }
.panel-head { padding: 6px 4px 0 8px; display: flex; align-items: stretch; gap: 4px; border-bottom: 1px solid rgba(15,23,42,0.08); }
.panel-head .panel-tabs { flex: 1; display: flex; gap: 2px; }
.ptab { flex: 1; padding: 12px 6px; background: none; border: none; color: #64748b; font-weight: 700; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; display: flex; align-items: center; justify-content: center; gap: 4px; transition: color 0.12s; }
.ptab:hover { color: #334155; }
.ptab.active { color: #06b6d4; border-bottom-color: #06b6d4; }
.ptab .count { background: #cbd5e1; color: #475569; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 700; min-width: 18px; text-align: center; }
.ptab.active .count { background: #06b6d4; color: #fff; }
.ptab .badge { background: #ef4444; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 800; min-width: 18px; text-align: center; }
.panel-head .close { width: 32px; border-radius: 6px; background: transparent; border: none; cursor: pointer; color: #64748b; font-size: 18px; align-self: center; height: 32px; }
.panel-head .close:hover { background: rgba(15,23,42,0.06); }
.panel-body { flex: 1; overflow-y: auto; padding: 8px 8px 16px; }
.panel-body.hidden { display: none; }

/* チャットログ */
.chat-list { padding: 12px 12px 20px; }
.chat-empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 40px 0; }
.chat-msg { margin-bottom: 10px; display: flex; flex-direction: column; }
.chat-msg.self { align-items: flex-end; }
.chat-msg .meta { font-size: 10px; color: #94a3b8; margin-bottom: 2px; padding: 0 4px; display: flex; gap: 4px; align-items: center; }
.chat-msg .meta .nm { font-weight: 700; color: #475569; }
.chat-msg .bubble { max-width: 85%; padding: 7px 12px; border-radius: 14px; background: #f1f5f9; font-size: 13px; color: #0f172a; word-break: break-word; line-height: 1.4; }
.chat-msg.self .bubble { background: #06b6d4; color: #fff; }
.chat-msg .read-mark { font-size: 10px; color: #06b6d4; margin-top: 2px; padding: 0 4px; }
.chat-msg.self .read-mark { text-align: right; }
.member-group { padding: 10px 12px 4px; font-size: 11px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; }
.member-row { padding: 8px 10px; border-radius: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.12s; }
.member-row:hover { background: rgba(6,182,212,0.08); }
.member-row.me { background: rgba(6,182,212,0.12); }
.member-avatar { width: 36px; height: 36px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; position: relative; overflow: hidden; border: 2px solid #333; }
.member-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.member-avatar .ini { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #0f172a; }
.member-avatar .st-dot { position: absolute; right: -2px; bottom: -2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.member-meta { flex: 1; min-width: 0; }
.member-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #0f172a; }
.member-sub { font-size: 11px; color: #64748b; display: flex; align-items: center; gap: 4px; }

/* キャンバス領域 */
#space-canvas-wrap { position: absolute; top: 0; left: 64px; right: 280px; bottom: 88px; background: #c9bca3; overflow: hidden; transition: right 0.25s ease; }
#right-panel.hidden ~ #space-canvas-wrap { right: 0; }
#space-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; }
#space-canvas.dragging { cursor: grabbing; }

/* フロアヘッダー（キャンバス上部にフロート） */
#floor-head { position: absolute; top: 12px; left: 16px; background: rgba(255,255,255,0.85); backdrop-filter: blur(6px); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #0f172a; box-shadow: 0 4px 12px rgba(15,23,42,0.08); display: flex; align-items: center; gap: 8px; z-index: 5; }
#floor-head .dot { width: 6px; height: 6px; border-radius: 50%; background: #10b981; }

/* ミニマップ */
#minimap { position: absolute; right: 12px; bottom: 12px; width: 180px; height: 108px; background: rgba(255,255,255,0.9); border: 1px solid rgba(15,23,42,0.12); border-radius: 10px; box-shadow: 0 8px 20px rgba(15,23,42,0.12); backdrop-filter: blur(6px); overflow: hidden; z-index: 6; cursor: pointer; }
#minimap canvas { display: block; width: 100%; height: 100%; }
#minimap .mm-label { position: absolute; top: 4px; left: 8px; font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.5px; pointer-events: none; }

/* 下部コントロールバー */
#dock { position: absolute; bottom: 0; left: 64px; right: 0; height: 88px; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid rgba(15,23,42,0.08); display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 20px; z-index: 15; }
.dock-btn { width: 56px; height: 56px; border-radius: 50%; border: none; background: #fff; color: #334155; box-shadow: 0 4px 12px rgba(15,23,42,0.12); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; position: relative; transition: all 0.15s; }
.dock-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15,23,42,0.16); }
.dock-btn:active { transform: translateY(0); }
.dock-btn.on { background: #06b6d4; color: #fff; }
.dock-btn.off { background: #fef2f2; color: #dc2626; }
.dock-btn.speaking { box-shadow: 0 0 0 4px rgba(16,185,129,0.55), 0 4px 12px rgba(16,185,129,0.3); animation: dockPulse 1s ease-in-out infinite; }
@keyframes dockPulse { 0%,100% { box-shadow: 0 0 0 4px rgba(16,185,129,0.55); } 50% { box-shadow: 0 0 0 8px rgba(16,185,129,0.15); } }
.dock-btn .vol-bar { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); width: 40px; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
.dock-btn .vol-bar i { display: block; height: 100%; width: 0%; background: #10b981; transition: width 0.06s linear; }
.dock-btn .sub { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #64748b; font-weight: 600; white-space: nowrap; }
.dock-sep { width: 1px; height: 36px; background: rgba(15,23,42,0.1); margin: 0 4px; }
#dock-chat-wrap { flex: 1; max-width: 420px; display: flex; align-items: center; gap: 8px; background: #f1f5f9; border-radius: 28px; padding: 6px 8px 6px 16px; }
#dock-chat-wrap input { flex: 1; background: transparent; border: none; outline: none; font-size: 14px; color: #0f172a; }
#dock-chat-wrap input::placeholder { color: #94a3b8; }
#dock-chat-send { width: 40px; height: 40px; border-radius: 50%; border: none; background: #06b6d4; color: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

/* リアクションピッカー */
#reaction-pop { position: absolute; bottom: 100px; background: #fff; border-radius: 32px; padding: 10px 14px; display: none; gap: 6px; box-shadow: 0 12px 32px rgba(15,23,42,0.18); z-index: 30; }
#reaction-pop.show { display: flex; }
#reaction-pop button { width: 40px; height: 40px; border-radius: 50%; border: none; background: #f1f5f9; cursor: pointer; font-size: 20px; transition: all 0.12s; }
#reaction-pop button:hover { background: #06b6d4; transform: scale(1.1); }

/* ステータスメニュー */
#status-menu { position: absolute; bottom: 100px; background: #fff; border: 1px solid rgba(15,23,42,0.1); border-radius: 12px; padding: 6px; display: none; z-index: 30; min-width: 140px; box-shadow: 0 12px 28px rgba(15,23,42,0.15); }
#status-menu.show { display: block; }
#status-menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; background: none; border: none; color: #0f172a; text-align: left; cursor: pointer; border-radius: 8px; font-size: 13px; }
#status-menu button:hover { background: #f1f5f9; }
#status-menu button .stdot { width: 10px; height: 10px; border-radius: 50%; }

/* メニューポップ（左レールから） */
#rail-menu { position: absolute; left: 72px; background: #fff; border-radius: 10px; padding: 6px; display: none; z-index: 30; min-width: 180px; box-shadow: 0 12px 28px rgba(15,23,42,0.18); }
#rail-menu.show { display: block; }
#rail-menu button { display: block; width: 100%; padding: 10px 12px; background: none; border: none; color: #0f172a; text-align: left; cursor: pointer; border-radius: 6px; font-size: 13px; }
#rail-menu button:hover { background: #f1f5f9; }

/* フロア切替ポップ */
#floor-menu { position: absolute; left: 72px; background: #fff; border-radius: 12px; padding: 6px; display: none; z-index: 30; min-width: 220px; box-shadow: 0 12px 28px rgba(15,23,42,0.2); }
#floor-menu.show { display: block; }
#floor-menu .fmhead { padding: 8px 12px 4px; font-size: 10px; color: #94a3b8; font-weight: 800; letter-spacing: 1px; }
#floor-menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; background: none; border: none; color: #0f172a; text-align: left; cursor: pointer; border-radius: 8px; font-size: 13px; font-weight: 600; }
#floor-menu button:hover { background: #f1f5f9; }
#floor-menu button.current { background: #ecfeff; color: #0891b2; cursor: default; }
#floor-menu button .ficon { font-size: 18px; }
#floor-menu button .fname { flex: 1; }
#floor-menu button .fcount { background: #cbd5e1; color: #475569; font-size: 10px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
#floor-menu button.current .fcount { background: #06b6d4; color: #fff; }

/* ===== Avatar Setup Modal ===== */
.modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: #fff; color: #0f172a; border: 1px solid rgba(15,23,42,0.08); border-radius: 16px; padding: 24px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal .tag { color: #64748b; font-size: 12px; margin-bottom: 16px; }
.photo-picker { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 12px; position: relative; }
.photo-picker img { max-height: 240px; border-radius: 10px; margin-top: 10px; }
.photo-frame { position: relative; display: inline-block; }
.photo-frame .guide { position: absolute; inset: 0; pointer-events: none; }
.cand-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; margin: 10px 0 14px; }
.cand-card { background: #f1f5f9; border: 3px solid transparent; border-radius: 12px; padding: 8px; cursor: pointer; text-align: center; transition: all 0.15s; position: relative; }
.cand-card:hover { border-color: #7dd3fc; transform: translateY(-2px); }
.cand-card.active { border-color: #06b6d4; background: rgba(6,182,212,0.12); }
.cand-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: #e2e8f0; }
.cand-card .lbl { font-size: 11px; margin-top: 4px; color: #334155; font-weight: 600; }
.cand-card.active::after { content: '✓'; position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 50%; background: #06b6d4; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(6,182,212,0.4); }
@keyframes btnPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(6,182,212,0.5); } 50% { box-shadow: 0 0 0 10px rgba(6,182,212,0); } }
#avatar-confirm-btn.pulse-hint { animation: btnPulse 1.2s ease-in-out 3; }
.btn-ghost { padding: 8px 14px; background: transparent; border: 1px solid #cbd5e1; border-radius: 8px; color: #334155; cursor: pointer; font-size: 13px; }
.btn-small { padding: 6px 12px; font-size: 12px; border-radius: 6px; }

/* ===== Chat bubble ===== */
.chat-bubble { position: absolute; background: #fff; color: #0f172a; padding: 6px 12px; border-radius: 14px; font-size: 13px; box-shadow: 0 6px 16px rgba(0,0,0,0.3); pointer-events: none; max-width: 220px; word-break: break-word; animation: bubbleIn 0.2s ease; }
.chat-bubble::after { content: ''; position: absolute; bottom: -6px; left: 14px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
@keyframes bubbleIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: rgba(15,23,42,0.95); color: #fff; padding: 10px 18px; border-radius: 24px; font-size: 13px; z-index: 200; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

/* ===== カード型メッセージ通知 (画面上部) ===== */
#notif-stack { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 250; pointer-events: none; max-width: 440px; width: calc(100% - 96px); }
.notif-card { pointer-events: auto; background: #fff; border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: flex-start; box-shadow: 0 12px 32px rgba(15,23,42,0.22); border: 1px solid rgba(15,23,42,0.08); cursor: pointer; animation: notifIn 0.25s ease, notifOut 0.35s 3.4s ease forwards; }
.notif-card.mention { border: 2px solid #ef4444; background: #fff1f2; animation-duration: 0.3s, 0.3s; animation-delay: 0s, 5.5s; }
.notif-card:hover { transform: translateY(-1px); }
.notif-card .nc-avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; background: #e2e8f0; overflow: hidden; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(15,23,42,0.1); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #334155; font-size: 13px; }
.notif-card .nc-avatar img { width: 100%; height: 100%; object-fit: cover; }
.notif-card .nc-body { flex: 1; min-width: 0; }
.notif-card .nc-name { font-size: 12px; color: #475569; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.notif-card .nc-msg { font-size: 14px; color: #0f172a; line-height: 1.4; word-break: break-word; margin-top: 2px; }
.notif-card .nc-badge { background: #ef4444; color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 800; }
@keyframes notifIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
@keyframes notifOut { from { opacity: 1; } to { opacity: 0; transform: translateY(-16px); } }

/* メンションサジェスト */
#mention-pop { position: absolute; bottom: 64px; background: #fff; border: 1px solid rgba(15,23,42,0.1); border-radius: 10px; padding: 4px; min-width: 200px; box-shadow: 0 12px 28px rgba(15,23,42,0.15); display: none; z-index: 30; max-height: 220px; overflow-y: auto; }
#mention-pop.show { display: block; }
#mention-pop .mopt { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #0f172a; }
#mention-pop .mopt:hover, #mention-pop .mopt.active { background: #ecfeff; color: #0891b2; }
#mention-pop .mopt .m-av { width: 22px; height: 22px; border-radius: 50%; background: #e2e8f0; overflow: hidden; flex-shrink: 0; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(15,23,42,0.1); }
#mention-pop .mopt .m-av img { width: 100%; height: 100%; object-fit: cover; }

/* メンション入力中バッジ */
#dock-chat-wrap.has-mention { box-shadow: 0 0 0 2px rgba(239,68,68,0.4); }

/* モバイル対応 */
@media (max-width: 800px) {
  #right-panel { width: 260px; }
  #right-panel.hidden { transform: translateX(100%); }
  #space-canvas-wrap { right: 0; }
  #space-canvas-wrap.with-panel { right: 260px; }
  #dock { gap: 8px; padding: 0 10px; }
  .dock-btn { width: 48px; height: 48px; font-size: 20px; }
  #dock-chat-wrap { display: none; }
  #minimap { width: 140px; height: 84px; }
  #left-rail .rail-btn .lbl { display: none; }
}
</style>
</head>
<body>

<!-- ログイン -->
<div id="login-screen" class="screen active">
  <div class="login-card">
    <h1>🏢 CoHub Express</h1>
    <div class="tag">グループ統合バーチャルオフィス</div>
    <div class="field"><label>ログインID</label><input type="text" id="login-id" autocomplete="username"></div>
    <div class="field"><label>パスワード</label><input type="password" id="login-pw" autocomplete="current-password"></div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">ログイン</button>
    <div class="err" id="login-err"></div>
    <div style="text-align:center;margin-top:14px;font-size:11px;color:#94a3b8;">
      <a href="/admin" style="color:#64748b;">管理画面</a>
    </div>
  </div>
</div>

<!-- 空間 -->
<div id="space-screen" class="screen">
  <!-- 左レール -->
  <div id="left-rail">
    <div class="brand" title="CoHub">🏢</div>
    <button class="rail-btn active" id="rail-members" onclick="togglePanel()" title="メンバー">
      <span>👥</span><span class="lbl">メンバー</span>
    </button>
    <button class="rail-btn" id="rail-floor" onclick="toggleFloorMenu(event)" title="フロア">
      <span>🏬</span><span class="lbl">フロア</span>
    </button>
    <button class="rail-btn" id="rail-minimap" onclick="toggleMinimap()" title="ミニマップ">
      <span>🗺️</span><span class="lbl">マップ</span>
    </button>
    <button class="rail-btn" onclick="openAvatarModal()" title="アバター">
      <span>🎨</span><span class="lbl">アバター</span>
    </button>
    <button class="rail-btn" onclick="location.href='/mylog'" title="自分のログ">
      <span>📜</span><span class="lbl">ログ</span>
    </button>
    <div class="spacer"></div>

<div id="avatar-modal" style="display:none;"></div>

<script>
let currentUser = null;
let token = localStorage.getItem('cohub_token') || '';
let userData = null;
try { userData = JSON.parse(localStorage.getItem('cohub_user') || 'null'); } catch(e) {}

const COMPANY_NAMES = {
  SU_HQ: 'SU本社', SU_SAITAMA: 'SU埼玉', SU_MKANTO: 'SU南関東', SU_ZAMA: 'SU座間',
  IBA_KASHIMA: 'IBA鹿島', IBA_SANWA: 'IBA三和', SUZUE: 'スズエ', ADMIN: '管理職'
};

// ===== 認証 =====
async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  const btn = document.getElementById('login-btn');
  err.textContent = '';
  if (!id || !pw) { err.textContent = 'IDとパスワードを入力してください'; return; }
  btn.disabled = true; btn.textContent = '...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ login_id: id, password: pw })
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg; btn.disabled = false; btn.textContent = 'ログイン'; return; }
    token = d.token;
    userData = d.user;
    localStorage.setItem('cohub_token', token);
    localStorage.setItem('cohub_user', JSON.stringify(userData));
    enterSpace();
  } catch(e) {
    err.textContent = '通信エラー'; btn.disabled = false; btn.textContent = 'ログイン';
  }
}

function doLogout() {
  fetch('/api/auth/logout', { method:'POST', headers:{'Authorization':'Bearer '+token} });
  localStorage.removeItem('cohub_token');
  localStorage.removeItem('cohub_user');
  location.reload();
}

// ===== 空間 =====
let socket = null;
let users = {};           // uid → user state
let targets = {};          // uid → 補間目標座標 { x, y }
let me = null;
let myX = 600, myY = 400;
let proximityRadius = 220;
let canvas, ctx, mmCanvas, mmCtx;
let bgImage = null;
let avatarImages = {}; // uid → Image
const bubbles = []; // { uid, content, at, isEmoji }

// チャットログ (受信したメッセージを永続化)
let chatLog = [];          // { id, uid, name, content, at, self, isEmoji, readBy[] }
let chatUnread = 0;
let currentTab = 'members'; // 'members' | 'chat'
try { chatLog = JSON.parse(localStorage.getItem('cohub_chat_log') || '[]'); } catch(e) { chatLog = []; }
// 72時間より古いログは自動削除
const CHAT_LOG_TTL = 72 * 3600 * 1000;
{
  const now = Date.now();
  chatLog = chatLog.filter(m => now - (new Date(m.at).getTime() || 0) < CHAT_LOG_TTL);
}
function saveChatLog() {
  try { localStorage.setItem('cohub_chat_log', JSON.stringify(chatLog.slice(-300))); } catch(e) {}
}

// ワールド座標系 (フロアごとに可変。snapshotで上書きされる)
let WORLD_W = 1344;
let WORLD_H = 768;
let currentFloor = null;   // { code, name, bg_image, world_w, world_h, icon }
let allFloors = [];
let floorCounts = {};
let viewScale = 1; // 実表示に対するスケール

// ドラッグ状態
let dragging = false;
let dragStart = null;
let dragEmitTimer = 0;
const DRAG_EMIT_INTERVAL = 80;

function enterSpace() {
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('space-screen').classList.add('active');
  currentUser = userData;
  initCanvas();
  connectSocket();
  // 初回ログインでアバター未設定なら促す
  if (!currentUser.avatar_url) {
    setTimeout(openAvatarModal, 600);
  }
  // パネル初期表示: モバイルは閉じ
  if (window.innerWidth <= 800) togglePanel(true);
  // OS通知の許可取得 (ユーザージェスチャー直後)
  requestNotifPermission();
  updateFaviconBadge(0);
}

// サーバーから指定フロアの直近100件を取得
async function loadRecentChat(roomCode) {
  try {
    const room = roomCode || (currentFloor && currentFloor.code) || 'lobby';
    const r = await fetch('/api/chat/recent?limit=100&room=' + encodeURIComponent(room), { headers: { 'Authorization': 'Bearer ' + token } });
    const d = await r.json();
    if (!d.success || !Array.isArray(d.messages)) return;
    const myUid = (currentUser && currentUser.uid) || me;
    chatLog = d.messages.map(m => ({
      id: 's_' + m.id,
      uid: m.sender_id,
      name: m.sender_name || '',
      content: m.content,
      at: m.created_at + 'Z',
      self: m.sender_id === myUid,
      mention: !!m.has_mention,
    }));
    saveChatLog();
    if (currentTab === 'chat') renderChatLog();
  } catch (e) {}
}

function initCanvas() {
  canvas = document.getElementById('space-canvas');
  ctx = canvas.getContext('2d');
  mmCanvas = document.getElementById('minimap-canvas');
  mmCtx = mmCanvas.getContext('2d');
  resize();
  window.addEventListener('resize', resize);

  // ポインタ（マウス/タッチ統一）
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  // ミニマップクリックで視点/自分移動
  document.getElementById('minimap').addEventListener('click', onMinimapClick);

  document.getElementById('chat-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const pop = document.getElementById('mention-pop');
      if (pop && pop.classList.contains('show')) {
        const active = pop.querySelector('.mopt.active');
        if (active) { e.preventDefault(); active.click(); return; }
      }
      sendChat();
    }
  });
  setupMentionSuggest();

  // 外クリックでメニューを閉じる
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#reaction-pop') && !e.target.closest('#dock-react')) {
      document.getElementById('reaction-pop').classList.remove('show');
    }
    if (!e.target.closest('#status-menu') && !e.target.closest('#dock-status')) {
      document.getElementById('status-menu').classList.remove('show');
    }
    if (!e.target.closest('#rail-menu') && !e.target.closest('#left-rail')) {
      document.getElementById('rail-menu').classList.remove('show');
    }
    if (!e.target.closest('#floor-menu') && !e.target.closest('#rail-floor')) {
      document.getElementById('floor-menu').classList.remove('show');
    }
  });

  requestAnimationFrame(render);
}

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * window.devicePixelRatio;
  canvas.height = r.height * window.devicePixelRatio;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

  // スケール: ワールド1024×1024 を必ず画面内に収める(contain)、余白は壁外扱い
  viewScale = Math.min(r.width / WORLD_W, r.height / WORLD_H);

  const mmR = mmCanvas.getBoundingClientRect();
  mmCanvas.width = mmR.width * window.devicePixelRatio;
  mmCanvas.height = mmR.height * window.devicePixelRatio;
  mmCtx.setTransform(1,0,0,1,0,0);
  mmCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
}

function loadBackground(src) {
  bgImage = new Image();
  bgImage.src = (src || '/assets/office_bg.png') + '?v=7';
}

// スクリーン座標 → ワールド座標
function screenToWorld(sx, sy) {
  const r = canvas.getBoundingClientRect();
  // cover: viewScaleでcanvas表示。中央基準で配置
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (r.width - dw) / 2;
  const oy = (r.height - dh) / 2;
  return {
    x: (sx - ox) / viewScale,
    y: (sy - oy) / viewScale,
  };
}

// ワールド座標 → スクリーン座標
function worldToScreen(wx, wy) {
  const r = canvas.getBoundingClientRect();
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (r.width - dw) / 2;
  const oy = (r.height - dh) / 2;
  return {
    x: wx * viewScale + ox,
    y: wy * viewScale + oy,
  };
}

function connectSocket() {
  socket = io({ auth: { token } });
  socket.on('connect_error', (e) => console.warn('socket err', e.message));
  socket.on('snapshot', (data) => {
    me = data.me;
    proximityRadius = data.proximity || 220;
    // フロア情報
    if (data.floor) {
      const prevCode = currentFloor && currentFloor.code;
      currentFloor = data.floor;
      // フロアが変わったら音声は自動OFF(改めてマイクONで再参加)
      if (prevCode && prevCode !== data.floor.code && voice.enabled) {
        disableVoice();
      }
      WORLD_W = data.floor.world_w || 1344;
      WORLD_H = data.floor.world_h || 768;
      const fname = document.getElementById('floor-name');
      if (fname) fname.textContent = (data.floor.icon ? data.floor.icon + ' ' : '') + data.floor.name;
      loadBackground(data.floor.bg_image);
      resize();
    }
    if (Array.isArray(data.floors)) allFloors = data.floors;
    if (data.floor_counts) floorCounts = data.floor_counts;
    // ユーザー
    users = {};
    targets = {};
    for (const u of data.users) {
      users[u.uid] = u;
      users[u.uid].cx = u.x != null ? u.x : WORLD_W / 2;
      users[u.uid].cy = u.y != null ? u.y : WORLD_H / 2;
      targets[u.uid] = { x: users[u.uid].cx, y: users[u.uid].cy };
      if (u.uid === me) { myX = users[u.uid].cx; myY = users[u.uid].cy; }
      if (u.avatar && !avatarImages[u.uid]) loadAvatar(u);
    }
    renderMemberList();
    // フロア切替時はログも再取得
    if (currentFloor) loadRecentChat(currentFloor.code);
    chatUnread = 0; updateChatBadge(); updateTitleBadge(0); updateFaviconBadge(0);
  });

  socket.on('user:leave', (u) => {
    // 別フロアに移った人は自フロアから消す
    if (users[u.uid]) {
      delete users[u.uid];
      delete targets[u.uid];
      renderMemberList();
    }
  });

  // ===== 音声シグナリング =====
  socket.on('voice:peers', async (data) => {
    // 自分が join した時、既に参加中の同フロアユーザー一覧 → 自分から offer を送る
    if (!voice.enabled || !Array.isArray(data.peers)) return;
    for (const peerUid of data.peers) {
      if (peerUid !== me) await callPeerAsOfferer(peerUid);
    }
  });

  socket.on('voice:state', (data) => {
    if (!data || !data.uid) return;
    if (users[data.uid]) users[data.uid].voice = !!data.on;
    // 相手が leave した -> peer を閉じる
    if (!data.on) {
      const peer = voice.peers.get(data.uid);
      if (peer) {
        try { peer.pc.close(); } catch (e) {}
        try { if (peer.audio) { peer.audio.pause(); peer.audio.srcObject = null; } } catch (e) {}
        voice.peers.delete(data.uid);
      }
      if (users[data.uid]) users[data.uid].speaking = false;
    }
  });

  socket.on('voice:signal', async (data) => {
    if (!voice.enabled || !data) return;
    const { from, type, payload } = data;
    if (!from) return;
    try {
      if (type === 'offer') {
        const peer = await getOrCreatePeer(from);
        await peer.pc.setRemoteDescription(payload);
        const answer = await peer.pc.createAnswer();
        await peer.pc.setLocalDescription(answer);
        socket.emit('voice:signal', { to: from, type: 'answer', payload: peer.pc.localDescription });
      } else if (type === 'answer') {
        const peer = voice.peers.get(from);
        if (peer) await peer.pc.setRemoteDescription(payload);
      } else if (type === 'ice') {
        const peer = voice.peers.get(from);
        if (peer && payload) await peer.pc.addIceCandidate(payload).catch(() => {});
      }
    } catch (e) { console.warn('voice signal err', type, e); }
  });

  socket.on('voice:speaking', (data) => {
    if (!data || !data.uid) return;
    if (users[data.uid]) users[data.uid].speaking = !!data.on;
  });

  socket.on('floor:counts', (counts) => {
    floorCounts = counts || {};
    // フロアメニューが開いていれば件数更新
    if (document.getElementById('floor-menu').classList.contains('show')) renderFloorMenu();
    // フロアヘッダーのオンライン数
    if (currentFloor) {
      const el = document.getElementById('online-count');
      if (el) el.textContent = counts[currentFloor.code] || 0;
    }
  });
  socket.on('user:join', (u) => {
    // 新規接続者のフル情報（name, company, ring, avatar 付き）
    users[u.uid] = u;
    users[u.uid].cx = u.x != null ? u.x : WORLD_W / 2;
    users[u.uid].cy = u.y != null ? u.y : WORLD_H / 2;
    targets[u.uid] = { x: users[u.uid].cx, y: users[u.uid].cy };
    if (u.avatar) loadAvatar(u);
    renderMemberList();
  });
  socket.on('user:update', (u) => {
    if (!users[u.uid]) users[u.uid] = { uid: u.uid, name: '...', ring: '#333', cx: u.x, cy: u.y };
    targets[u.uid] = { x: u.x, y: u.y };
    users[u.uid].status = u.status;
    if (u.uid === me) { myX = u.x; myY = u.y; }
    if (users[u.uid].avatar && !avatarImages[u.uid]) loadAvatar(users[u.uid]);
    renderMemberList();
  });
  socket.on('chat:msg', (m) => {
    const isEmoji = isSingleEmoji(m.content);
    const isMentioned = Array.isArray(m.mentions) && m.mentions.includes(me);
    bubbles.push({ uid: m.uid, content: m.content, at: Date.now(), isEmoji });
    while (bubbles.length > 40) bubbles.shift();

    // チャットログに追加
    const entry = {
      id: (m.at || new Date().toISOString()) + '_' + m.uid,
      uid: m.uid,
      name: (users[m.uid] && users[m.uid].name) || '',
      content: m.content,
      at: m.at || new Date().toISOString(),
      self: m.uid === me,
      isEmoji,
      mention: isMentioned,
      readBy: m.uid === me ? [] : undefined,
    };
    chatLog.push(entry);
    while (chatLog.length > 300) chatLog.shift();
    saveChatLog();

    if (m.uid !== me) {
      if (speakerOn) playBeep(isMentioned);
      const sender = users[m.uid] || {};
      showNotifCard({
        name: sender.name || '誰か',
        content: m.content,
        avatar: sender.avatar || '',
        mention: isMentioned
      });
      const title = (isMentioned ? '[メンション] ' : '') + (sender.name || 'CoHub');
      fireOSNotif(title, m.content, () => { switchTab('chat'); if (document.getElementById('right-panel').classList.contains('hidden')) togglePanel(); });
      const panelHidden = document.getElementById('right-panel').classList.contains('hidden');
      const notReading = currentTab !== 'chat' || panelHidden || document.visibilityState !== 'visible';
      if (notReading) {
        chatUnread++;
        updateChatBadge();
        updateTitleBadge(chatUnread);
        updateFaviconBadge(chatUnread);
      } else {
        if (socket) socket.emit('chat:read', { from: m.uid });
      }
    }
    if (currentTab === 'chat') renderChatLog();
  });

  socket.on('chat:read-receipt', (r) => {
    // 自分の送信メッセージを、r.reader が読んだ
    let changed = false;
    for (const m of chatLog) {
      if (!m.self) continue;
      if (!m.readBy) m.readBy = [];
      if (!m.readBy.includes(r.reader)) { m.readBy.push(r.reader); changed = true; }
    }
    if (changed) {
      saveChatLog();
      if (currentTab === 'chat') renderChatLog();
    }
  });
}

function isSingleEmoji(s) {
  if (!s) return false;
  const trimmed = s.trim();
  if (trimmed.length > 6) return false;
  return /^(\p{Extended_Pictographic}|\p{Emoji}|\s)+$/u.test(trimmed);
}

function loadAvatar(u) {
  if (!u.avatar) return;
  const img = new Image();
  img.src = u.avatar;
  avatarImages[u.uid] = img;
}

// ===== ドラッグ&クリック移動 =====
function onPointerDown(e) {
  canvas.setPointerCapture(e.pointerId);
  dragging = true;
  canvas.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY, t: Date.now() };
  const world = screenToWorld(e.clientX - canvas.getBoundingClientRect().left, e.clientY - canvas.getBoundingClientRect().top);
  moveTo(world.x, world.y);
}

function onPointerMove(e) {
  if (!dragging) return;
  const r = canvas.getBoundingClientRect();
  const world = screenToWorld(e.clientX - r.left, e.clientY - r.top);
  const now = Date.now();
  if (now - dragEmitTimer > DRAG_EMIT_INTERVAL) {
    moveTo(world.x, world.y);
    dragEmitTimer = now;
  } else {
    // ローカルだけ先行補間
    if (users[me]) targets[me] = { x: clampX(world.x), y: clampY(world.y) };
  }
}

function onPointerUp(e) {
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
}

// 壁の内側のみ歩行可 (壁厚~80px想定)
function clampX(x) { return Math.max(90, Math.min(WORLD_W - 90, x)); }
function clampY(y) { return Math.max(90, Math.min(WORLD_H - 90, y)); }

function moveTo(x, y) {
  const cx = clampX(x), cy = clampY(y);
  targets[me] = { x: cx, y: cy };
  myX = cx; myY = cy;
  if (users[me]) { users[me].x = cx; users[me].y = cy; }
  if (socket) socket.emit('move', { x: cx, y: cy });
}

function onMinimapClick(e) {
  const r = mmCanvas.getBoundingClientRect();
  const mx = e.clientX - r.left;
  const my = e.clientY - r.top;
  const wx = (mx / r.width) * WORLD_W;
  const wy = (my / r.height) * WORLD_H;
  moveTo(wx, wy);
}

// ===== レンダリング =====
function render() {
  if (!ctx) return;

  // 補間: targets → users[uid].cx/cy に近づける (ease-out、ゴール付近スナップで発振防止)
  for (const uid in targets) {
    if (!users[uid]) continue;
    const t = targets[uid];
    const u = users[uid];
    if (u.cx == null) { u.cx = t.x; u.cy = t.y; continue; }
    const dx = t.x - u.cx;
    const dy = t.y - u.cy;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < 0.4) { u.cx = t.x; u.cy = t.y; continue; }
    const step = Math.min(dist * 0.22, 22);
    // step >= dist なら通り越すので直接スナップ
    if (step >= dist) { u.cx = t.x; u.cy = t.y; continue; }
    u.cx += (dx / dist) * step;
    u.cy += (dy / dist) * step;
  }

  const r = canvas.getBoundingClientRect();
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);

  // 背景: ワールドをcoverで描画
  const dw = WORLD_W * viewScale;
  const dh = WORLD_H * viewScale;
  const ox = (w - dw) / 2;
  const oy = (h - dh) / 2;

  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(viewScale, viewScale);

  if (bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
    ctx.drawImage(bgImage, 0, 0, WORLD_W, WORLD_H);
  } else {
    // フォールバック
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, WORLD_W, WORLD_H);
  }

  // 近接範囲（自分中心）
  if (me && users[me]) {
    const u = users[me];
    ctx.beginPath();
    ctx.arc(u.cx, u.cy, proximityRadius, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(6,182,212,0.08)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(6,182,212,0.3)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 6]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // アバター群
  for (const uid in users) {
    const u = users[uid];
    if (u.cx == null) continue;
    if (u.status === 'offline') continue;
    drawAvatar(u);
  }

  // 吹き出し
  const now = Date.now();
  const bubbleLife = 10000;
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (now - b.at > bubbleLife) { bubbles.splice(i, 1); continue; }
    const u = users[b.uid];
    if (!u || u.cx == null) continue;
    if (b.isEmoji) drawEmojiBubble(u.cx, u.cy, b.content, (now - b.at) / bubbleLife);
    else drawBubble(u.cx, u.cy - 50, b.content, Math.max(0, 1 - (now - b.at) / bubbleLife));
  }

  ctx.restore();

  // ミニマップ描画
  drawMinimap();

  requestAnimationFrame(render);
}

function drawAvatar(u) {
  const r = 28;
  // 描画座標は整数化してサブピクセルのにじみを防ぐ
  const cx = Math.round(u.cx);
  const cy = Math.round(u.cy);
  ctx.save();
  // 話者パルスリング (voice.speaking時)
  if (u.speaking) {
    const phase = (Date.now() % 900) / 900;
    const prr = r + 8 + phase * 12;
    ctx.beginPath();
    ctx.arc(cx, cy, prr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(16,185,129,' + (0.6 * (1 - phase)) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(16,185,129,0.7)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // ステータスリング
  ctx.beginPath();
  ctx.arc(cx, cy, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = u.ring || '#333';
  ctx.fill();

  // ドロップシャドウ
  ctx.shadowColor = 'rgba(15,23,42,0.2)';
  ctx.shadowBlur = 8;
  ctx.shadowOffsetY = 2;

  // アバター画像 / イニシャル
  const img = avatarImages[u.uid];
  if (img && img.complete && img.naturalWidth > 0) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, cx - r, cy - r, r * 2, r * 2);
    ctx.restore();
  } else {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#0f172a';
    ctx.font = '600 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(u.name ? u.name.slice(0, 2) : '?', cx, cy);
  }
  ctx.shadowColor = 'transparent';

  // 名前バッジ
  ctx.font = '600 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const label = (u.name || '') + (u.status && u.status !== 'online' ? ' (' + u.status + ')' : '');
  const tw = Math.round(ctx.measureText(label).width + 14);
  ctx.fillStyle = 'rgba(15,23,42,0.85)';
  roundRect(cx - Math.round(tw / 2), cy + r + 4, tw, 20, 10);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(label, cx, cy + r + 14);

  // ステータスドット
  const dotColor = u.status === '会議中' ? '#ef4444' : u.status === '退席中' ? '#eab308' : '#10b981';
  ctx.beginPath();
  ctx.arc(cx + r - 4, cy - r + 4, 6, 0, Math.PI * 2);
  ctx.fillStyle = dotColor;
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
  // マイクON マーク (voice=true)
  if (u.voice) {
    ctx.beginPath();
    ctx.arc(cx - r + 4, cy - r + 4, 9, 0, Math.PI * 2);
    ctx.fillStyle = '#10b981';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '700 10px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎤', cx - r + 4, cy - r + 5);
  }
  ctx.restore();
}

function drawBubble(x, y, text, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.font = '13px sans-serif';
  const maxW = 200;
  const lines = wrapText(text, maxW);
  const lineH = 16;
  const padding = 8;
  let bubbleW = 0;
  for (const l of lines) bubbleW = Math.max(bubbleW, ctx.measureText(l).width);
  bubbleW += padding * 2;
  const bubbleH = lines.length * lineH + padding * 2;
  const bx = x - bubbleW / 2;
  const by = y - bubbleH;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  roundRect(bx, by, bubbleW, bubbleH, 10);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 6, by + bubbleH);
  ctx.lineTo(x, by + bubbleH + 8);
  ctx.lineTo(x + 6, by + bubbleH);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.fillStyle = '#0f172a';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], bx + padding, by + padding + i * lineH);
  ctx.restore();
}

function drawEmojiBubble(cx, cy, emoji, progress) {
  // 下から上へフワッと浮かび、最後にフェード
  ctx.save();
  const rise = Math.min(progress * 2, 1) * 60;
  const alpha = progress < 0.75 ? 1 : (1 - (progress - 0.75) / 0.25);
  ctx.globalAlpha = alpha;
  ctx.font = '36px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy - 40 - rise);
  ctx.restore();
}

function wrapText(text, maxW) {
  const out = [];
  let cur = '';
  for (const ch of text) {
    const test = cur + ch;
    if (ctx.measureText(test).width > maxW && cur) {
      out.push(cur);
      cur = ch;
    } else {
      cur = test;
    }
  }
  if (cur) out.push(cur);
  return out;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function drawMinimap() {
  if (!mmCtx) return;
  const r = mmCanvas.getBoundingClientRect();
  const mw = r.width, mh = r.height;
  mmCtx.clearRect(0, 0, mw, mh);

  // 背景画像の縮小版
  if (bgImage && bgImage.complete && bgImage.naturalWidth > 0) {
    mmCtx.drawImage(bgImage, 0, 0, mw, mh);
    // 暗化オーバーレイで dot を見やすく
    mmCtx.fillStyle = 'rgba(255,255,255,0.15)';
    mmCtx.fillRect(0, 0, mw, mh);
  } else {
    mmCtx.fillStyle = '#f1f5f9';
    mmCtx.fillRect(0, 0, mw, mh);
  }
  const sx = mw / WORLD_W;
  const sy = mh / WORLD_H;

  // ユーザー dot
  for (const uid in users) {
    const u = users[uid];
    if (u.cx == null) continue;
    if (u.status === 'offline') continue;
    mmCtx.beginPath();
    mmCtx.arc(u.cx * sx, u.cy * sy, uid === me ? 4 : 3, 0, Math.PI * 2);
    mmCtx.fillStyle = uid === me ? '#06b6d4' : (u.ring || '#334155');
    mmCtx.fill();
    if (uid === me) {
      mmCtx.strokeStyle = '#fff';
      mmCtx.lineWidth = 1.5;
      mmCtx.stroke();
    }
  }
}

function renderMemberList() {
  const list = document.getElementById('member-list');
  if (!list) return;

  const online = [];
  const offline = [];
  for (const uid in users) {
    const u = users[uid];
    if (u.status === 'offline') offline.push(u);
    else online.push(u);
  }
  online.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
  offline.sort((a, b) => (a.name || '').localeCompare(b.name || ''));

  document.getElementById('member-count').textContent = online.length;
  document.getElementById('online-count').textContent = online.length;

  let html = '';
  if (online.length > 0) {
    html += '<div class="member-group">オンライン</div>';
    for (const u of online) html += memberRowHtml(u);
  }
  if (offline.length > 0) {
    html += '<div class="member-group">オフライン</div>';
    for (const u of offline) html += memberRowHtml(u);
  }
  list.innerHTML = html;
}

function memberRowHtml(u) {
  const dotColor = u.status === 'offline' ? '#94a3b8' : u.status === '会議中' ? '#ef4444' : u.status === '退席中' ? '#eab308' : '#10b981';
  const companyName = COMPANY_NAMES[u.company] || u.company || '';
  const avatarHtml = u.avatar
    ? `<img src="${u.avatar}" alt="">`
    : `<div class="ini">${(u.name || '?').slice(0, 2)}</div>`;
  const isMe = u.uid === me;
  return `
    <div class="member-row ${isMe ? 'me' : ''}" onclick="walkTo('${u.uid}')">
      <div class="member-avatar" style="border-color:${u.ring || '#333'};">
        ${avatarHtml}
        <div class="st-dot" style="background:${dotColor};"></div>
      </div>
      <div class="member-meta">
        <div class="member-name">${escapeHtml(u.name || '')}${isMe ? ' <span style="color:#06b6d4;font-size:10px;">(自分)</span>' : ''}</div>
        <div class="member-sub">${companyName}${u.status && u.status !== 'online' && u.status !== 'offline' ? ' · ' + u.status : ''}</div>
      </div>
    </div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== 通知系 (favicon / タイトル / OS通知 / カードトースト) =====
const ORIGINAL_TITLE = 'CoHub Express';
let faviconLink = null;

if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    this.beginPath();
    this.moveTo(x + r[0], y);
    this.arcTo(x + w, y, x + w, y + h, r[1]);
    this.arcTo(x + w, y + h, x, y + h, r[2]);
    this.arcTo(x, y + h, x, y, r[3]);
    this.arcTo(x, y, x + w, y, r[0]);
    this.closePath();
    return this;
  };
}

function ensureFavicon() {
  if (faviconLink) return faviconLink;
  faviconLink = document.querySelector("link[rel~='icon']");
  if (!faviconLink) {
    faviconLink = document.createElement('link');
    faviconLink.rel = 'icon';
    document.head.appendChild(faviconLink);
  }
  return faviconLink;
}

function updateFaviconBadge(n) {
  try {
    const link = ensureFavicon();
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const cx = c.getContext('2d');
    cx.fillStyle = '#0f172a';
    cx.roundRect(4, 4, 56, 56, 14);
    cx.fill();
    cx.fillStyle = '#06b6d4';
    cx.font = 'bold 40px sans-serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('C', 32, 36);
    if (n > 0) {
      cx.fillStyle = '#ef4444';
      cx.beginPath(); cx.arc(48, 16, 16, 0, Math.PI * 2); cx.fill();
      cx.strokeStyle = '#0f172a'; cx.lineWidth = 2; cx.stroke();
      cx.fillStyle = '#fff';
      cx.font = 'bold 20px sans-serif';
      cx.fillText(n > 9 ? '9+' : String(n), 48, 18);
    }
    link.href = c.toDataURL('image/png');

}

function updateTitleBadge(n) {
  document.title = n > 0 ? '💬(' + (n > 99 ? '99+' : n) + ') ' + ORIGINAL_TITLE : ORIGINAL_TITLE;
}

let notifPermTried = false;
async function requestNotifPermission() {
  if (!('Notification' in window)) return 'unsupported';
  if (Notification.permission === 'granted' || Notification.permission === 'denied') return Notification.permission;
  if (notifPermTried) return Notification.permission;
  notifPermTried = true;
  try { return await Notification.requestPermission(); } catch (e) { return 'default'; }
}

function fireOSNotif(title, body, onClick) {
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'granted') return;
  if (document.visibilityState === 'visible' && document.hasFocus()) return;
  try {
    const n = new Notification(title, { body, tag: 'cohub-chat', icon: '/assets/office_bg.png' });
    n.onclick = () => { window.focus(); if (onClick) onClick(); n.close(); };
    setTimeout(() => { try { n.close(); } catch(e) {} }, 8000);
  } catch (e) {}
}

function showNotifCard(o) {
  let stack = document.getElementById('notif-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.id = 'notif-stack';
    document.body.appendChild(stack);
  }
  const card = document.createElement('div');
  card.className = 'notif-card' + (o.mention ? ' mention' : '');
  const avatarHtml = o.avatar
    ? '<img src="' + o.avatar + '" alt="">'
    : escapeHtml((o.name || '?').slice(0, 2));
  const mentionBadge = o.mention ? '<span class="nc-badge">メンション</span>' : '';
  card.innerHTML =
    '<div class="nc-avatar">' + avatarHtml + '</div>' +
    '<div class="nc-body">' +
      '<div class="nc-name"><span>' + escapeHtml(o.name) + '</span>' + mentionBadge + '</div>' +
      '<div class="nc-msg">' + escapeHtml(o.content) + '</div>' +
    '</div>';
  card.onclick = () => {
    switchTab('chat');
    if (document.getElementById('right-panel').classList.contains('hidden')) togglePanel();
    try { card.remove(); } catch(e) {}
  };
  stack.appendChild(card);
  const lifespan = o.mention ? 5800 : 3800;
  setTimeout(() => { try { card.remove(); } catch(e) {} }, lifespan);
  while (stack.children.length > 6) stack.removeChild(stack.firstChild);
}

// ===== メンション解析 =====
function parseMentions(content) {
  const out = new Set();
  if (!content) return [];
  if (/@(全員|everyone|all)/.test(content)) {
    for (const uid in users) if (uid !== me && users[uid].status !== 'offline') out.add(uid);
  }
  for (const uid in users) {
    if (uid === me) continue;
    const nm = users[uid].name || '';
    if (!nm) continue;
    if (content.indexOf('@' + nm) !== -1) out.add(uid);
  }
  return Array.from(out);
}

// ===== メンションサジェスト =====
function setupMentionSuggest() {
  const input = document.getElementById('chat-input');
  if (!input) return;
  let pop = document.getElementById('mention-pop');
  if (!pop) {
    pop = document.createElement('div');
    pop.id = 'mention-pop';
    document.body.appendChild(pop);
  }
  const wrap = document.getElementById('dock-chat-wrap');

  function hide() {
    pop.classList.remove('show');
    wrap.classList.remove('has-mention');
  }

  input.addEventListener('input', () => {
    const v = input.value;
    const caret = input.selectionStart || v.length;
    const head = v.slice(0, caret);
    const atIdx = head.lastIndexOf('@');
    if (atIdx === -1) { hide(); return; }
    const term = head.slice(atIdx + 1);
    if (term.includes(' ') || term.length > 20) { hide(); return; }
    // 候補作成
    const items = [];
    if (!term || '全員'.startsWith(term) || 'everyone'.startsWith(term.toLowerCase())) {
      items.push({ key: '全員', name: '全員 (online)', avatar: '', everyone: true });
    }
    for (const uid in users) {
      if (uid === me) continue;
      const nm = users[uid].name || '';
      if (!nm) continue;
      if (!term || nm.includes(term)) items.push({ key: nm, name: nm, avatar: users[uid].avatar || '' });
      if (items.length >= 8) break;
    }
    if (!items.length) { hide(); return; }
    // レンダ
    pop.innerHTML = items.map((it, i) =>
      '<div class="mopt' + (i === 0 ? ' active' : '') + '" data-key="' + escapeHtml(it.key) + '">' +
        '<div class="m-av">' + (it.avatar ? '<img src="' + it.avatar + '">' : '') + '</div>' +
        '<span>@' + escapeHtml(it.name) + '</span>' +
      '</div>'
    ).join('');
    // 位置
    const r = wrap.getBoundingClientRect();
    pop.style.left = r.left + 'px';
    pop.style.bottom = (window.innerHeight - r.top + 6) + 'px';
    pop.style.width = Math.min(280, r.width) + 'px';
    pop.classList.add('show');
    wrap.classList.add('has-mention');
    // クリックで補完
    pop.querySelectorAll('.mopt').forEach(el => {
      el.onclick = () => {
        const key = el.getAttribute('data-key');
        const before = v.slice(0, atIdx);
        const after = v.slice(caret);
        input.value = before + '@' + key + ' ' + after;
        input.focus();
        const newPos = (before + '@' + key + ' ').length;
        input.setSelectionRange(newPos, newPos);
        hide();
      };
    });
  });

  input.addEventListener('blur', () => setTimeout(hide, 150));
  input.addEventListener('keydown', (e) => {
    if (!pop.classList.contains('show')) return;
    if (e.key === 'Tab' || e.key === 'Enter') {
      const active = pop.querySelector('.mopt.active');
      if (active && e.key === 'Tab') { e.preventDefault(); active.click(); }
    } else if (e.key === 'Escape') { hide(); }
  });
}

// ===== チャットログ描画 =====
function renderChatLog() {
  const list = document.getElementById('chat-list');
  if (!list) return;
  if (!chatLog.length) {
    list.innerHTML = '<div class="chat-empty">近くの人のチャットがここに表示されます</div>';
    return;
  }
  let html = '';
  let prevAuthor = null;
  let prevTime = 0;
  for (const m of chatLog) {
    const t = new Date(m.at);
    const hhmm = (t.getHours() + '').padStart(2,'0') + ':' + (t.getMinutes() + '').padStart(2,'0');
    const showMeta = prevAuthor !== m.uid || (t.getTime() - prevTime) > 3 * 60 * 1000;
    const nm = m.self ? '自分' : (m.name || (users[m.uid] && users[m.uid].name) || '誰か');
    const readStr = m.self && m.readBy && m.readBy.length
      ? '既読 ' + m.readBy.length
      : '';
    html += '<div class="chat-msg ' + (m.self ? 'self' : '') + '">';
    if (showMeta) html += '<div class="meta"><span class="nm">' + escapeHtml(nm) + '</span><span>' + hhmm + '</span></div>';
    html += '<div class="bubble">' + escapeHtml(m.content) + '</div>';
    if (readStr) html += '<div class="read-mark">' + readStr + '</div>';
    html += '</div>';
    prevAuthor = m.uid;
    prevTime = t.getTime();
  }
  list.innerHTML = html;
  list.scrollTop = list.scrollHeight;
}

// タブ切替
function switchTab(name) {
  currentTab = name;
  document.getElementById('tab-members').classList.toggle('active', name === 'members');
  document.getElementById('tab-chat').classList.toggle('active', name === 'chat');
  document.getElementById('member-list').classList.toggle('hidden', name !== 'members');
  document.getElementById('chat-list').classList.toggle('hidden', name !== 'chat');
  if (name === 'chat') {
    // 未読クリア + 全送信者に既読通知
    if (chatUnread > 0) {
      const senders = new Set();
      for (const m of chatLog) {
        if (!m.self && m.uid !== me) senders.add(m.uid);
      }
      for (const from of senders) {
        if (socket) socket.emit('chat:read', { from });
      }
    }
    chatUnread = 0;
    updateChatBadge();
    renderChatLog();
  }
}

function updateChatBadge() {
  const b = document.getElementById('chat-badge');

// 通知音（Web Audio。メンション時は3音パターン＆大音量）
let _audioCtx = null;
function playBeep(mention) {
  try {
    if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    const beep = (freq, startOffset, dur, vol) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + startOffset;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    };
    if (mention) {
      beep(1175, 0, 0.12, 0.32);
      beep(1396, 0.14, 0.12, 0.32);
      beep(1760, 0.28, 0.25, 0.38);
    } else {
      beep(880, 0, 0.15, 0.18);
      beep(1175, 0.12, 0.18, 0.18);
    }
  } catch (e) {}
}

  const u = users[uid];

  // 少しずらして隣に
  const angle = Math.random() * Math.PI * 2;
  const offset = 80;
  moveTo(u.cx + Math.cos(angle) * offset, u.cy + Math.sin(angle) * offset);
}

// ===== 音声モード (WebRTC 近接メッシュ) =====
const voice = {
  enabled: false,
  localStream: null,
  audioContext: null,
  masterGain: null,
  analyser: null,
  analyserData: null,
  peers: new Map(),      // uid => { pc, audio, gain, src }
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
  ],
  speakingSent: false,
};

function updateMicUI() {
  const btn = document.getElementById('dock-mic');
  if (!btn) return;
  btn.classList.toggle('on', voice.enabled);
  btn.classList.toggle('off', false);
  btn.innerHTML = (voice.enabled ? '🎤' : '🎙️') +
    '<div class="sub">' + (voice.enabled ? 'マイクON' : 'マイク') + '</div>' +
    '<div class="vol-bar"><i id="mic-volbar-fill"></i></div>';
}

async function toggleMic() {
  if (voice.enabled) await disableVoice();
  else await enableVoice();
}

async function enableVoice() {
  try {
    voice.localStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
  } catch (e) {
    showToast('マイクの許可が必要です');
    return;
  }
  if (!voice.audioContext) {
    voice.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    voice.masterGain = voice.audioContext.createGain();
    voice.masterGain.gain.value = speakerOn ? 1 : 0;
    voice.masterGain.connect(voice.audioContext.destination);
    voice.analyser = voice.audioContext.createAnalyser();
    voice.analyser.fftSize = 512;
    voice.analyserData = new Uint8Array(voice.analyser.frequencyBinCount);
  }
  if (voice.audioContext.state === 'suspended') { try { await voice.audioContext.resume(); } catch (e) {} }
  try {
    const src = voice.audioContext.createMediaStreamSource(voice.localStream);
    src.connect(voice.analyser);
  } catch (e) {}
  voice.enabled = true;
  updateMicUI();
  if (socket) socket.emit('voice:join');
  startVoiceLoops();
  showToast('マイクON (近接音声)');
}

async function disableVoice() {
  voice.enabled = false;
  stopVoiceLoops();
  for (const [, peer] of voice.peers) {
    try { peer.pc.close(); } catch (e) {}
    try { if (peer.audio) { peer.audio.pause(); peer.audio.srcObject = null; } } catch (e) {}
  }
  voice.peers.clear();
  if (voice.localStream) {
    try { voice.localStream.getTracks().forEach(t => t.stop()); } catch (e) {}
    voice.localStream = null;
  }
  if (socket) socket.emit('voice:leave');
  if (users[me]) users[me].voice = false;
  updateMicUI();
}

async function getOrCreatePeer(peerUid) {
  if (voice.peers.has(peerUid)) return voice.peers.get(peerUid);
  const pc = new RTCPeerConnection({ iceServers: voice.iceServers });
  // 自分のストリームを送信
  if (voice.localStream) {
    for (const t of voice.localStream.getTracks()) pc.addTrack(t, voice.localStream);
  }
  const audio = document.createElement('audio');
  audio.autoplay = true;
  audio.muted = true; // Web Audioで再生するので要素側は無音
  const gain = voice.audioContext.createGain();
  gain.gain.value = 1;
  gain.connect(voice.masterGain);
  let src = null;
  pc.ontrack = (e) => {
    const stream = e.streams[0];
    audio.srcObject = stream;
    try {
      if (src) try { src.disconnect(); } catch (err) {}
      src = voice.audioContext.createMediaStreamSource(stream);
      src.connect(gain);
    } catch (err) {
      // フォールバック: audio要素で直接再生
      audio.muted = false;
    }
  };
  pc.onicecandidate = (e) => {
    if (e.candidate && socket) socket.emit('voice:signal', { to: peerUid, type: 'ice', payload: e.candidate });
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'closed'].includes(pc.connectionState)) {
      const p = voice.peers.get(peerUid);
      if (p) {
        try { p.pc.close(); } catch (e) {}
        try { if (p.audio) { p.audio.pause(); p.audio.srcObject = null; } } catch (e) {}
        voice.peers.delete(peerUid);
      }
    }
  };
  const obj = { pc, audio, gain, uid: peerUid };
  voice.peers.set(peerUid, obj);
  return obj;
}

async function callPeerAsOfferer(peerUid) {
  if (!voice.enabled || !voice.localStream) return;
  const peer = await getOrCreatePeer(peerUid);
  try {
    const offer = await peer.pc.createOffer();
    await peer.pc.setLocalDescription(offer);
    socket.emit('voice:signal', { to: peerUid, type: 'offer', payload: peer.pc.localDescription });
  } catch (e) { console.warn('offer error', e); }
}

// 距離減衰ループ + 自分の音量検知
let _voiceLoopTimer = null;
let _voiceVolTimer = null;
function startVoiceLoops() {
  if (!_voiceLoopTimer) _voiceLoopTimer = setInterval(updateVoiceDistance, 220);
  if (!_voiceVolTimer) _voiceVolTimer = setInterval(updateMicVolume, 120);
}
function stopVoiceLoops() {
  if (_voiceLoopTimer) { clearInterval(_voiceLoopTimer); _voiceLoopTimer = null; }
  if (_voiceVolTimer) { clearInterval(_voiceVolTimer); _voiceVolTimer = null; }
  const fill = document.getElementById('mic-volbar-fill'); if (fill) fill.style.width = '0%';
}

function updateVoiceDistance() {
  if (!voice.enabled) return;
  const myU = users[me];
  if (!myU || myU.cx == null) return;
  const nearR = proximityRadius || 220;
  const farR = nearR * 2;
  for (const [peerUid, peer] of voice.peers) {
    const u = users[peerUid];
    let g = 0;
    if (u && u.cx != null && u.status !== 'offline' && u.floor === (currentFloor && currentFloor.code)) {
      const dx = u.cx - myU.cx, dy = u.cy - myU.cy;
      const d = Math.sqrt(dx*dx + dy*dy);
      if (d <= nearR) g = 1;
      else if (d >= farR) g = 0;
      else g = 1 - (d - nearR) / (farR - nearR);
    }
    try { peer.gain.gain.value = g; } catch (e) {}
  }
}

function updateMicVolume() {
  if (!voice.enabled || !voice.analyser) return;
  voice.analyser.getByteFrequencyData(voice.analyserData);
  let sum = 0;
  for (let i = 0; i < voice.analyserData.length; i++) sum += voice.analyserData[i];
  const avg = sum / voice.analyserData.length;  // 0..255
  const vol = Math.min(1, avg / 80);
  const fill = document.getElementById('mic-volbar-fill');
  if (fill) fill.style.width = Math.round(vol * 100) + '%';
  const btn = document.getElementById('dock-mic');
  const speaking = avg > 22;
  if (speaking !== voice.speakingSent) {
    voice.speakingSent = speaking;
    if (btn) btn.classList.toggle('speaking', speaking);
    if (socket) socket.emit('voice:speaking', { on: speaking });
    if (users[me]) users[me].speaking = speaking;
  }
}

let cameraStream = null;
let cameraFacing = 'user';

async function openCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert('お使いのブラウザはカメラに対応していません');
      return;
    }
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: cameraFacing, width: { ideal: 720 }, height: { ideal: 720 } },
      audio: false
    });
    const video = document.getElementById('camera-video');
    video.srcObject = cameraStream;
    document.getElementById('camera-frame').style.display = 'block';
    document.getElementById('camera-controls').style.display = 'block';
    document.getElementById('photo-placeholder').style.display = 'none';
    document.getElementById('preview-frame').style.display = 'none';
    document.getElementById('photo-actions').style.display = 'none';
  } catch (e) {
    console.error('camera error', e);
    alert('カメラにアクセスできません: ' + (e.message || e.name));
  }
}

async function switchCamera() {
  cameraFacing = cameraFacing === 'user' ? 'environment' : 'user';
  closeCamera();
  await openCamera();
}

function takePhoto() {
  const video = document.getElementById('camera-video');
  const c = document.getElementById('camera-canvas');
  const size = Math.min(video.videoWidth, video.videoHeight);
  c.width = size; c.height = size;
  const cctx = c.getContext('2d');
  const sx = (video.videoWidth - size) / 2;
  const sy = (video.videoHeight - size) / 2;
  if (cameraFacing === 'user') {
    cctx.save();
    cctx.scale(-1, 1);
    cctx.drawImage(video, sx, sy, size, size, -size, 0, size, size);
    cctx.restore();
  } else {
    cctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
  }
  c.toBlob((blob) => {
    if (!blob) return;
    const file = new File([blob], 'camera_' + Date.now() + '.jpg', { type: 'image/jpeg' });
    closeCamera();
    setPhoto(file);
  }, 'image/jpeg', 0.9);
}

function closeCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  const video = document.getElementById('camera-video');
  if (video) video.srcObject = null;
  const frame = document.getElementById('camera-frame');
  if (frame) frame.style.display = 'none';
  const ctrl = document.getElementById('camera-controls');
  if (ctrl) ctrl.style.display = 'none';
  const ph = document.getElementById('photo-placeholder');
  if (ph) ph.style.display = 'block';
}

async function doGenerateSet() {
  const btn = document.getElementById('avatar-gen-btn');
  const err = document.getElementById('avatar-err');
  if (!avatarPhoto) return;
  btn.disabled = true; btn.textContent = '3パターン生成中... (最大60秒)'; err.textContent = '';
  const fd = new FormData();
  fd.append('photo', avatarPhoto);
  try {
    const r = await fetch('/api/avatar/generate-set', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token },
      body: fd
    });
    const d = await r.json();
    if (!d.success || !d.candidates || !d.candidates.length) {
      err.textContent = d.msg || '生成に失敗しました';
      btn.disabled = false; btn.textContent = '3パターン自動生成 (約40秒)';
      return;
    }
    currentCandidates = d.candidates;
    selectedCandidate = d.candidates[0];
    renderCandidates();
    document.getElementById('cand-section').style.display = 'block';
    btn.style.display = 'none';
    const confirmBtn = document.getElementById('avatar-confirm-btn');
    confirmBtn.style.display = 'inline-block';
    confirmBtn.textContent = 'これにする (' + d.candidates.length + '枚から選択)';
    // モーダル内を下までスクロールして候補＆ボタンを見える位置へ
    setTimeout(() => {
      const candSec = document.getElementById('cand-section');
      if (candSec && candSec.scrollIntoView) candSec.scrollIntoView({ behavior: 'smooth', block: 'center' });
      confirmBtn.classList.add('pulse-hint');
      setTimeout(() => confirmBtn.classList.remove('pulse-hint'), 3000);
    }, 100);
  } catch(e) {
    err.textContent = '通信エラー';
    btn.disabled = false; btn.textContent = '3パターン自動生成 (約40秒)';
  }
}

function renderCandidates() {
  const grid = document.getElementById('cand-grid');
  if (!grid) return;
  grid.innerHTML = '';
  for (const c of currentCandidates) {
    const el = document.createElement('div');
    const isActive = selectedCandidate && selectedCandidate.avatar_url === c.avatar_url;
    el.className = 'cand-card' + (isActive ? ' active' : '');
    el.onclick = () => { selectedCandidate = c; renderCandidates(); };
    el.innerHTML = `<img src="${c.avatar_url}" alt=""><div class="lbl">${c.label || c.variant}</div>`;
    grid.appendChild(el);
  }
}

async function doConfirmAvatar() {
  if (!selectedCandidate) return;
  const btn = document.getElementById('avatar-confirm-btn');
  const err = document.getElementById('avatar-err');
  btn.disabled = true; btn.textContent = '確定中...'; err.textContent = '';
  try {
    const r = await fetch('/api/avatar/select', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        avatar_url: selectedCandidate.avatar_url,
        candidates: currentCandidates
      })
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || '確定に失敗しました'; btn.disabled = false; btn.textContent = 'これにする'; return; }
    currentUser.avatar_url = d.avatar_url;
    userData.avatar_url = d.avatar_url;
    localStorage.setItem('cohub_user', JSON.stringify(userData));
    if (users[me]) users[me].avatar = d.avatar_url;
    delete avatarImages[me];
    loadAvatar({ uid: me, avatar: d.avatar_url });
    // 掃除済みなので closeAvatarModal の discard はスキップ
    currentCandidates = [];
    selectedCandidate = { avatar_url: d.avatar_url }; // discard回避
    closeAvatarModal();
    renderMemberList();
    showToast('アバター完成！');
  } catch(e) {
    err.textContent = '通信エラー'; btn.disabled = false; btn.textContent = 'これにする';
  }
}

async function removeAvatar() {
  if (!confirm('アバターを削除しますか？')) return;
  await fetch('/api/avatar/remove', { method:'POST', headers:{'Authorization':'Bearer '+token} });
  currentUser.avatar_url = '';
  userData.avatar_url = '';
  localStorage.setItem('cohub_user', JSON.stringify(userData));
  if (users[me]) users[me].avatar = '';
  delete avatarImages[me];
  closeAvatarModal();
  renderMemberList();
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// 自動ログイン
if (token && userData) {
  enterSpace();
}
</script>
</body>
</html>
