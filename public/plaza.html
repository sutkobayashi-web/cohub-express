<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🌳 みんなの投稿 — CoWell</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<meta name="theme-color" content="#0d9488">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overscroll-behavior-y: contain; }
body { font-family: -apple-system, 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: #f0fdfa; color: #0f172a; }
header { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg, #0d9488, #0f766e); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
header h1 { margin: 0; font-size: 16px; font-weight: 800; }
header .spacer { flex: 1; }
main { max-width: 720px; margin: 0 auto; padding: 12px; padding-bottom: 100px; }

/* イベント */
.events { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scroll-snap-type: x mandatory; }
.evt { flex: 0 0 240px; background: linear-gradient(135deg, #ecfeff, #cffafe); border: 1px solid #99f6e4; border-radius: 14px; padding: 14px; cursor: pointer; scroll-snap-align: start; box-shadow: 0 1px 4px rgba(0,0,0,0.04); transition: transform 0.15s; }
.evt:hover { transform: translateY(-2px); }
.evt-icon { font-size: 32px; line-height: 1; margin-bottom: 6px; }
.evt-title { font-weight: 800; font-size: 14px; color: #0f766e; margin-bottom: 2px; }
.evt-desc { font-size: 11px; color: #475569; line-height: 1.5; }
.evt-tag { display: inline-block; background: #14b8a6; color: #fff; font-size: 10px; padding: 1px 8px; border-radius: 8px; font-weight: 700; margin-bottom: 6px; }

/* タブ (カテゴリ切替) */
/* カテゴリタブ — 画面下部に固定 (ボトムナビ風) */
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 4px; background: #fff; border-top: 1px solid #e2e8f0; border-radius: 0; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); margin: 0; box-shadow: 0 -4px 14px rgba(15,23,42,0.10); overflow-x: auto; z-index: 50; max-width: 640px; margin-left: auto; margin-right: auto; }
body { padding-bottom: 80px !important; }
.tab { flex: 1 0 auto; padding: 10px 12px; border: none; background: transparent; font-size: 13px; font-weight: 700; color: #64748b; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.tab:hover { background: #f1f5f9; }
.tab.active.t-all { background: #475569; color: #fff; }
.tab.active.t-食事 { background: #f59e0b; color: #fff; }
.tab.active.t-相談 { background: #ef4444; color: #fff; }
.tab.active.t-雑談 { background: #06b6d4; color: #fff; }
.tab.active.t-健康Tips { background: #10b981; color: #fff; }

/* 投稿フォーム */
.composer { background: #fff; border-radius: 14px; padding: 12px; margin-bottom: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: background 0.2s, box-shadow 0.2s; }
/* 食事モード: 食欲そそる暖色調＋枠強調＋写真CTA優先 */
.composer.is-food { background: linear-gradient(180deg,#fffbeb 0%, #fff 65%); border: 2px solid #fcd34d; padding: 14px; box-shadow: 0 4px 14px rgba(245,158,11,0.18); }
.composer.is-food textarea { background: #fffef9; border-color: #fde68a; }
.composer.is-food textarea:focus { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,0.18); }
/* カテゴリ別の投稿エディタ色違い (相談=赤系/雑談=シアン系/Tips=緑系) */
.composer.is-相談 { background: linear-gradient(180deg,#fef2f2 0%,#fff 65%); border: 2px solid #fca5a5; padding: 14px; box-shadow: 0 4px 14px rgba(239,68,68,0.15); }
.composer.is-相談 textarea { background: #fffafa; border-color: #fecaca; }
.composer.is-相談 textarea:focus { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.18); }
.composer.is-雑談 { background: linear-gradient(180deg,#ecfeff 0%,#fff 65%); border: 2px solid #67e8f9; padding: 14px; box-shadow: 0 4px 14px rgba(6,182,212,0.15); }
.composer.is-雑談 textarea { background: #fafffe; border-color: #a5f3fc; }
.composer.is-雑談 textarea:focus { border-color: #06b6d4; box-shadow: 0 0 0 3px rgba(6,182,212,0.18); }
.composer.is-健康Tips { background: linear-gradient(180deg,#f0fdf4 0%,#fff 65%); border: 2px solid #6ee7b7; padding: 14px; box-shadow: 0 4px 14px rgba(16,185,129,0.15); }
.composer.is-健康Tips textarea { background: #fafffd; border-color: #a7f3d0; }
.composer.is-健康Tips textarea:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.18); }
.composer textarea { width: 100%; min-height: 64px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; font-family: inherit; resize: vertical; outline: none; }
.composer textarea:focus { border-color: #0d9488; box-shadow: 0 0 0 3px rgba(13,148,136,0.12); }
.composer-bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.anon-toggle { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; background: #f8fafc; border-radius: 16px; font-size: 12px; cursor: pointer; user-select: none; color: #475569; font-weight: 600; }
.anon-toggle input { margin: 0; cursor: pointer; }
.anon-toggle:has(input:checked) { background: #fef3c7; color: #78350f; }
.anon-bdg { display: inline-block; background: #475569; color: #fff; font-size: 9px; padding: 2px 6px; border-radius: 6px; font-weight: 700; margin-left: 4px; }
.mine-anon-tag { display: inline-block; background: #fef3c7; color: #78350f; font-size: 9px; padding: 1px 6px; border-radius: 6px; font-weight: 700; margin-left: 4px; }
.btn { padding: 9px 16px; background: #0d9488; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 700; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-icon { padding: 8px; background: #f1f5f9; color: #475569; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; }
.composer-meta { flex: 1; font-size: 11px; color: #94a3b8; }
.preview-img-wrap { position: relative; margin-top: 10px; display: inline-block; }
.preview-img { max-width: 240px; max-height: 240px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
.preview-clear { position: absolute; top: -6px; right: -6px; background: #ef4444; color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; cursor: pointer; font-size: 11px; line-height: 1; }
.ai-tip { background: linear-gradient(135deg,#fef3c7,#fde68a); border-left: 4px solid #f59e0b; padding: 10px 12px; font-size: 13px; color: #78350f; border-radius: 8px; margin: 4px 0 10px; line-height: 1.6; font-weight: 600; display: none; }
.ai-tip.show { display: block; }
.ai-tip b { color: #92400e; }
/* 食事モード: 大きな写真CTA (撮影/選択を一発で) */
.food-photo-cta { display: none; width: 100%; padding: 16px; margin: 4px 0 10px; background: linear-gradient(135deg,#f59e0b,#ef4444); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 12px rgba(245,158,11,0.35); align-items: center; justify-content: center; gap: 10px; transition: transform 0.1s, box-shadow 0.2s; text-align: left; }
.food-photo-cta:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(245,158,11,0.45); }
.food-photo-cta:active { transform: translateY(0); }
.food-photo-cta .ico { font-size: 28px; line-height: 1; }
.food-photo-cta .sub { display: block; font-size: 11px; font-weight: 600; opacity: 0.9; margin-top: 2px; }
.composer.is-food:not(.has-image) .food-photo-cta { display: flex; }

/* 投稿カード */
.post { background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
.post.archive { background: #f8fafc; border-left: 3px solid #cbd5e1; }
.post-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: #e2e8f0; flex-shrink: 0; }
.avatar-fallback { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #99f6e4, #5eead4); color: #115e59; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
.post-meta { flex: 1; min-width: 0; }
.post-author { font-weight: 700; font-size: 14px; }
.post-time { font-size: 11px; color: #94a3b8; }
.cat-bdg { font-size: 10px; padding: 2px 8px; border-radius: 8px; font-weight: 800; }
.cat-bdg.食事 { background: #fef3c7; color: #b45309; }
.cat-bdg.相談 { background: #fee2e2; color: #b91c1c; }
.cat-bdg.雑談 { background: #ecfeff; color: #0e7490; }
.cat-bdg.健康Tips { background: #ecfdf5; color: #047857; }
.post-content { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; }
.post-image { margin-top: 10px; max-width: 100%; max-height: 480px; border-radius: 10px; cursor: pointer; }
.del-btn { background: transparent; border: none; color: #cbd5e1; font-size: 16px; cursor: pointer; padding: 4px 8px; }
.del-btn:hover { color: #ef4444; }

/* 栄養エビデンス対比バーチャート (CoWell 移植) */
.nutri-card { margin: 10px 0; padding: 12px; background: #f8faf9; border-radius: 10px; border: 1px solid #e0f0e8; }
.nutri-card .nutri-title { font-size: 12px; font-weight: 800; color: #1a3c34; margin-bottom: 10px; }
.nutri-row { margin-bottom: 8px; }
.nutri-row .bar-wrap { position: relative; height: 32px; background: #e9ecef; border-radius: 8px; margin-bottom: 6px; overflow: visible; }
.nutri-row .bar-zone { position: absolute; top: 0; height: 100%; background: rgba(32,201,151,0.18); border-radius: 8px; z-index: 0; }
.nutri-row .bar-zone-strong { position: absolute; top: 0; height: 100%; background: rgba(13,148,136,0.22); z-index: 0; }
.nutri-row .bar-fill { position: relative; height: 100%; border-radius: 8px; z-index: 1; transition: width 0.4s ease; }
/* 全項目共通の左端ラベル (黒文字+白ハローでバーの上でも背景でも読める) */
.nutri-row .bar-label { position: absolute; top: 50%; left: 12px; right: 90px; transform: translateY(-50%); z-index: 3; font-weight: 800; font-size: 14px; color: #1f2937; white-space: nowrap; display: flex; align-items: baseline; gap: 6px; pointer-events: none; overflow: hidden; text-shadow: 0 0 3px rgba(255,255,255,0.95), 0 0 6px rgba(255,255,255,0.85), 0 0 2px rgba(255,255,255,1); letter-spacing: 0.3px; }
.nutri-row .bar-label .bf-val { font-size: 16px; font-weight: 900; margin-left: 4px; }
.nutri-row .bar-label .bf-unit { font-size: 11px; font-weight: 700; opacity: 0.7; margin-left: 1px; }
.nutri-row .bar-status-fixed { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 900; padding: 3px 10px; border-radius: 6px; background: #fff; letter-spacing: 0.4px; box-shadow: 0 1px 2px rgba(0,0,0,0.18); border: 1.5px solid currentColor; z-index: 6; white-space: nowrap; }
.nutri-row .bar-target { position: absolute; top: 0; bottom: 0; width: 2.5px; background: rgba(15,23,42,0.55); transform: translateX(-50%); z-index: 4; box-shadow: 0 0 0 1px rgba(255,255,255,0.4); }
.nutri-row .bar-target-lbl { position: absolute; top: 50%; padding: 0; font-size: 11px; color: #1f2937; font-weight: 900; white-space: nowrap; z-index: 5; letter-spacing: 0.3px; text-shadow: 0 0 3px rgba(255,255,255,0.95), 0 0 5px rgba(255,255,255,0.85); }
.nutri-conf { margin-top: 6px; text-align: center; }
.nutri-conf .badge { font-size: 10px; padding: 2px 8px; border-radius: 6px; font-weight: 700; }
.nutri-foot { text-align: right; font-size: 9px; color: #aaa; margin-top: 6px; }
/* 追加飲酒記録 (写真未反映分の自己申告) */
.alc-extra { margin: 8px 0; }
.alc-toggle { width: 100%; text-align: left; background: linear-gradient(135deg,#fef3c7,#fde68a); border: 1px solid #fbbf24; border-radius: 10px; padding: 8px 12px; font-size: 12px; font-weight: 700; color: #92400e; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.alc-toggle:hover { background: linear-gradient(135deg,#fde68a,#fbbf24); }
.alc-caret { font-size: 14px; }
.alc-panel { background: #fffbeb; border: 1px solid #fde68a; border-top: none; border-radius: 0 0 10px 10px; padding: 10px 12px; margin-top: -2px; }
.alc-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.alc-preset { background: #fff; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer; text-align: left; color: #92400e; }
.alc-preset:hover { background: #fef3c7; border-color: #fbbf24; }
.alc-preset b { color: #b45309; font-size: 11px; margin-left: 4px; }
.alc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #fde68a; font-size: 11px; color: #78350f; }
.alc-current b { color: #92400e; font-size: 13px; }
.alc-reset { background: #fff; border: 1px solid #fca5a5; color: #b91c1c; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 700; }
.alc-reset:hover { background: #fee2e2; }
@media (max-width: 480px) { .alc-presets { grid-template-columns: 1fr; } }
.ai-cmt-block { font-size: 12px; color: #1a3c34; margin-top: 6px; padding: 8px 10px; background: linear-gradient(135deg,#f0faf4,#edf4ff); border-radius: 8px; line-height: 1.6; border-left: 3px solid #20c997; white-space: pre-wrap; word-wrap: break-word; }
.ai-cmt-pair { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.ai-cmt-card { padding: 10px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.65; word-wrap: break-word; }
.ai-cmt-card:nth-child(1) { background: linear-gradient(135deg,#f0faf4,#e8f5e9); border-left: 3px solid #20c997; color: #1a3c34; }
.ai-cmt-card:nth-child(2) { background: linear-gradient(135deg,#eff6ff,#e0f2fe); border-left: 3px solid #3b82f6; color: #1e3a8a; }
.ai-cmt-hdr { font-weight: 700; font-size: 12px; margin-bottom: 4px; letter-spacing: 0.3px; }
.ai-cmt-body { font-size: 12.5px; }
/* AIヘルスアドバイザー (5セクション) */
.ai-advisor-card { margin-top: 8px; padding: 12px; background: linear-gradient(180deg,#f8fafc,#f1f5f9); border-radius: 12px; border: 1px solid #e2e8f0; }
.ai-advisor-hdr-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px dashed #cbd5e1; }
.ai-advisor-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; object-position: center top; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(59,130,246,0.18); flex-shrink: 0; background: #fff; }
.ai-advisor-hdr-text { line-height: 1.2; }
.ai-advisor-hdr-name { font-weight: 800; font-size: 13px; color: #1e3a8a; letter-spacing: 0.3px; }
.ai-advisor-hdr-sub { font-size: 10px; color: #64748b; margin-top: 3px; letter-spacing: 0.2px; }
.ai-sec { margin-bottom: 10px; padding: 8px 10px 8px 12px; background: #ffffff; border-left: 3px solid #94a3b8; border-radius: 6px; }
.ai-sec:last-child { margin-bottom: 0; }
.ai-sec-hdr { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; letter-spacing: 0.2px; }
.ai-sec-body { font-size: 12.5px; line-height: 1.7; color: #1f2937; word-wrap: break-word; }
.ai-emph { color: #0f766e; font-weight: 700; }

.post-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f1f5f9; align-items: stretch; }
.react-btn {
  position: relative;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
  min-width: 54px; padding: 6px 8px 5px;
  background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px;
  cursor: pointer; line-height: 1;
  transition: transform 0.1s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
  box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.react-btn .em { font-size: 20px; line-height: 1; }
.react-btn .lb { font-size: 10px; color: #64748b; font-weight: 700; margin-top: 3px; letter-spacing: 0.2px; white-space: nowrap; }
.react-btn:hover { background: #e2e8f0; border-color: #cbd5e1; }
.react-btn:active { transform: scale(0.94); }
.react-btn.mine { background: #ccfbf1; border-color: #0d9488; box-shadow: 0 2px 6px rgba(13,148,136,0.20); }
.react-btn.mine .lb { color: #0f766e; }
.react-btn .ct {
  position: absolute; top: -6px; right: -6px;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: #0f172a; color: #fff;
  border-radius: 999px; font-size: 11px; font-weight: 900;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1.5px solid #fff;
}
.react-btn.mine .ct { background: #0d9488; }
.cmt-btn { margin-left: auto; padding: 8px 14px; min-height: 40px; background: transparent; border: 1.5px solid transparent; color: #475569; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; align-self: center; }
.cmt-btn:hover { background: #f1f5f9; border-color: #e2e8f0; }
.cmt-btn:hover { background: #f1f5f9; }
.comments { margin-top: 10px; padding: 8px 10px; background: #f8fafc; border-radius: 10px; display: none; }
.comments.open { display: block; }
/* 推進メンバー専用コメント (健康管理室向け、AI凝縮の補強材料) */
.pcmt-btn { background: #fdf2f8; border: 1px solid #fbcfe8; color: #be185d; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; margin-left: 4px; }
.pcmt-btn:hover { background: #fce7f3; }
.pcmts { margin-top: 8px; padding: 10px 12px; background: linear-gradient(135deg,#fdf2f8,#fff1f2); border: 1px solid #fbcfe8; border-radius: 12px; display: none; }
.pcmts.open { display: block; }
.pcmts .pcmt-head { font-size: 11px; font-weight: 700; color: #9d174d; margin-bottom: 6px; }
.pcmts .pcmt-item { background: #fff; border-left: 3px solid #f9a8d4; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; }
.pcmts .pcmt-author { font-size: 10px; color: #be185d; font-weight: 700; }
.pcmts .pcmt-input { display: flex; gap: 6px; margin-top: 6px; }
.pcmts .pcmt-input input { flex: 1; padding: 6px 10px; border: 1px solid #fbcfe8; border-radius: 8px; font-size: 12px; background: #fff; }
.pcmts .pcmt-input button { background: linear-gradient(135deg,#f472b6,#ec4899); color: #fff; border: none; border-radius: 8px; padding: 4px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
.cmt { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
.cmt:last-child { border-bottom: 0; }
.cmt .avatar, .cmt .avatar-fallback { width: 28px; height: 28px; font-size: 11px; }
.cmt-body { flex: 1; min-width: 0; }
.cmt-author { font-size: 12px; font-weight: 700; }
.cmt-time { font-size: 10px; color: #94a3b8; margin-left: 6px; }
.cmt-text { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
.cmt-form { display: flex; gap: 6px; margin-top: 8px; }
.cmt-form input { flex: 1; padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 18px; font-size: 13px; outline: none; }
.cmt-form button { padding: 7px 14px; background: #0d9488; color: #fff; border: none; border-radius: 18px; cursor: pointer; font-size: 12px; font-weight: 700; }

.section-ttl { font-size: 11px; font-weight: 800; color: #475569; padding: 4px 4px; margin-top: 14px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
.empty { padding: 60px 20px; text-align: center; color: #94a3b8; }
.empty .ico { font-size: 48px; margin-bottom: 12px; }
.archive-tag { display: inline-block; background: #94a3b8; color: #fff; font-size: 9px; padding: 1px 6px; border-radius: 4px; font-weight: 700; margin-left: 4px; }

#img-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; }
#img-modal.open { display: flex; }
#img-modal img { max-width: 100%; max-height: 100%; }
#img-modal .close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.2); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; }

<script>
// 栄太郎アバター表示トグル (localStorage 永続)
function hideEitaro() {

  document.getElementById('eitaro-restore').classList.add('show');

let token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
let me = null;
let _imageFile = null;
let _curCat = '雑談';
let _curTab = 'all';
let _socket = null;
let _categories = [];
// 反応セット (8種ラベル付き) — AI評議のシグナル源
const REACTIONS = [
  { e: '👍', label: 'いいね' },
  { e: '❤️', label: '推し' },
  { e: '😊', label: '共感' },
  { e: '💪', label: '応援' },
  { e: '👏', label: 'すごい' },
  { e: '💡', label: '参考' },
  { e: '🙏', label: 'ありがとう' },
  { e: '😢', label: '心配' },
];
const EMOJIS = REACTIONS.map(r => r.e);
const REACTION_LABEL = Object.fromEntries(REACTIONS.map(r => [r.e, r.label]));
const NUTRI_KEYS = ['protein', 'fat', 'carb', 'vitamin', 'mineral', 'salt'];
const NUTRI_LABELS = { protein: 'タンパク', fat: '脂質', carb: '糖質', vitamin: 'ビタミン', mineral: 'ミネラル', salt: '塩分' };

function escapeHtml(s) { return (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function avatarHtml(url, name) {
  if (url) return `<img class="avatar" src="${escapeHtml(url)}" alt="">`;
  const init = (name || '?').slice(0, 2);
  return `<div class="avatar-fallback">${escapeHtml(init)}</div>`;
}
function relTime(iso) {
  const t = new Date((iso || '').replace(' ', 'T') + 'Z').getTime();
  if (!t) return '';
  const diff = (Date.now() - t) / 1000;
  if (diff < 60) return 'たった今';
  if (diff < 3600) return Math.floor(diff / 60) + '分前';
  if (diff < 86400) return Math.floor(diff / 3600) + '時間前';
  if (diff < 86400 * 7) return Math.floor(diff / 86400) + '日前';
  const d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

// CoWell 栄養エビデンス対比バーチャート (admin-food.js 移植)
function buildNutritionBar(sc) {
  if (!sc) return '';
  // 旧形式 (1〜5 int) 検出 → 推定値に変換
  const isLegacy = (typeof sc.protein === 'number' && sc.protein <= 5 && !sc.calories);
  if (isLegacy) {
    sc = {
      calories: { value: 300 + (sc.protein || 3) * 70, unit: 'kcal' },
      protein: { value: (sc.protein || 3) * 5, unit: 'g' },
      fat: { value: 5 + (sc.fat || 3) * 2.5, unit: 'g' },
      carbs: { value: 40 + (sc.carbs || sc.carb || 3) * 10, unit: 'g' },
      vitamin: { value: (sc.vitamin || 3) * 30, unit: 'g' },
      mineral: { value: (sc.mineral || 3) * 55, unit: 'mg' },
      fiber: { value: (sc.vitamin || 3) * 1.5, unit: 'g' },
      salt: { value: 4.0 - (sc.salt || 3) * 0.5, unit: 'g' },
      alcohol: { value: 0, unit: 'g' },
    };
  }
  // 栄養素の性格を3グループに分類
  // - positive: 多いほど良い (不足=赤、目標達成=緑、超過も緑/濃緑「優秀」)
  // - range:    適量範囲 (低すぎも高すぎもNG)
  // - reverse:  少ないほど良い (超過=赤)
  const items = [
    { key: 'calories', icon: '🔥', label: 'カロリー',     unit: 'kcal', target: 550, min: 450, max: 650, range: true },
    { key: 'protein',  icon: '🍖', label: 'たんぱく質',   unit: 'g',    target: 20,  positive: true },
    { key: 'fat',      icon: '🫒', label: '脂質',         unit: 'g',    target: 15, min: 12, max: 18, range: true },
    { key: 'carbs',    icon: '🍚', label: '炭水化物',     unit: 'g',    target: 79, min: 69, max: 89, range: true },
    { key: 'vitamin',  icon: '🥬', label: '野菜量',       unit: 'g',    target: 120, positive: true },
    { key: 'mineral',  icon: '🦴', label: 'カルシウム',   unit: 'mg',   target: 227, positive: true },
    { key: 'fiber',    icon: '🌾', label: '食物繊維',     unit: 'g',    target: 7,   positive: true },
    { key: 'salt',     icon: '🧂', label: '塩分',         unit: 'g',    target: 2.5, reverse: true },
    { key: 'alcohol',  icon: '🍺', label: 'アルコール',   unit: 'g',    target: 20, reverse: true, optional: true },
  ];
  let html = '<div class="nutri-card">';
  html += '<div class="nutri-title">📊 栄養バランス（エビデンス対比）</div>';
  // calories の値を fat/carbs %→g 変換に使う
  const calRaw = sc.calories;
  const calV = (calRaw && typeof calRaw === 'object') ? Number(calRaw.value) : (typeof calRaw === 'number' ? calRaw : 550);
  for (const item of items) {
    const raw = sc[item.key];
    let val = 0;
    if (raw && typeof raw === 'object' && raw.value !== undefined) val = Number(raw.value);
    else if (typeof raw === 'number') val = raw;
    if (item.optional && val === 0) continue;
    // 旧データ互換: fat/carbs が % で保存されている場合 → g に変換
    if (item.key === 'fat' && val > 0 && val <= 50) val = Math.round(val * calV / 100 / 9 * 10) / 10;
    if (item.key === 'carbs' && val > 0 && val <= 70) val = Math.round(val * calV / 100 / 4 * 10) / 10;
    // positive 栄養素は超過時のバー溢れを防ぐため barMax を 2.0 に拡張
    const barMax = item.positive ? item.target * 2.0 : item.target * 1.5;
    const pct = Math.min(100, (val / barMax) * 100);
    let status, color;
    if (item.reverse) {
      if (val <= item.target * 0.8) { status = '良好'; color = '#20c997'; }
      else if (val <= item.target) { status = '適量'; color = '#f59e0b'; }
      else { status = '超過'; color = '#ef4444'; }
    } else if (item.range) {
      if (val >= item.min && val <= item.max) { status = '適量'; color = '#20c997'; }
      else if (val < item.min) { status = '不足'; color = '#f59e0b'; }
      else { status = '超過'; color = '#ef4444'; }
    } else if (item.positive) {
      // 多いほど良い栄養素 — 目標到達で「達成」、超過は「優秀」
      const ratio = val / item.target;
      if (ratio >= 1.3) { status = '優秀'; color = '#0d9488'; }       // 濃緑 (130%超)
      else if (ratio >= 1.0) { status = '達成'; color = '#20c997'; }  // 緑 (目標到達)
      else if (ratio >= 0.7) { status = 'もう一歩'; color = '#f59e0b'; } // 黄 (70-99%)
      else if (ratio >= 0.4) { status = '不足'; color = '#fb923c'; }  // オレンジ
      else { status = '不足'; color = '#ef4444'; }                    // 赤 (40%未満)
    } else {
      // フォールバック (旧 default 動作)
      const ratio = val / item.target;
      if (ratio >= 0.8 && ratio <= 1.3) { status = '適量'; color = '#20c997'; }
      else if (ratio < 0.8) { status = '不足'; color = '#f59e0b'; }
      else { status = '超過'; color = '#ef4444'; }
    }
    const targetPct = Math.min(100, (item.target / barMax) * 100);
    const dispVal = (val % 1 === 0) ? val : val.toFixed(1);
    // 達成ゾーン (緑背景帯): 各タイプ別に算出
    let zoneHtml = '';
    if (item.positive) {
      // 達成ゾーン (100-130%) と優秀ゾーン (130%+ → barMax)
      const z1L = Math.min(100, (item.target * 1.0 / barMax) * 100);
      const z1R = Math.min(100, (item.target * 1.3 / barMax) * 100);
      const z2L = z1R;
      const z2R = 100;
      zoneHtml = `<div class="bar-zone" style="left:${z1L}%;width:${z1R - z1L}%;"></div>` +
                 `<div class="bar-zone-strong" style="left:${z2L}%;width:${z2R - z2L}%;"></div>`;
    } else if (item.range) {
      const zL = Math.min(100, (item.min / barMax) * 100);
      const zR = Math.min(100, (item.max / barMax) * 100);
      zoneHtml = `<div class="bar-zone" style="left:${zL}%;width:${zR - zL}%;"></div>`;
    } else if (item.reverse) {
      // 良好ゾーン (≦80% of target)
      const zR = Math.min(100, (item.target * 0.8 / barMax) * 100);
      zoneHtml = `<div class="bar-zone" style="left:0;width:${zR}%;"></div>`;
    }
    // 全項目: ラベルを左端に固定、ステータスバッジを右端に固定 (黒文字+白ハローで読みやすく)
    const labelHtml = `${item.icon} ${escapeHtml(item.label)}<span class="bf-val">${dispVal}<span class="bf-unit">${item.unit}</span></span>`;
    const bgStyle = `width:${pct}%;background:${color};`;
    html += `<div class="nutri-row">
      <div class="bar-wrap">
        ${zoneHtml}
        <div class="bar-fill" style="${bgStyle}"></div>
        <div class="bar-label">${labelHtml}</div>
        <div class="bar-target-lbl" style="left:${targetPct}%;transform:translate(${targetPct >= 70 ? '-104%' : '6px'},-50%);">目標 ${item.target}${item.unit}</div>
        <span class="bar-status-fixed" style="color:${color};">${status}</span>
      </div>
    </div>`;
  }
  // 信憑性バッジ (基準物検出時は緑「★★★ 基準物あり」)
  const conf = sc.confidence;
  if (conf && conf.level) {
    const stars = conf.level === 3 ? '★★★' : conf.level === 2 ? '★★☆' : '★☆☆';
    const cc = conf.level === 3 ? '#20c997' : conf.level === 2 ? '#f59e0b' : '#ef4444';
    const refObj = conf.reference_object;
    const lbl = conf.reason || (conf.level === 3 ? '成分表示' : conf.level === 2 ? '定番料理' : '目視推定');
    const refIco = refObj ? '📐' : '🔍';
    const refTag = refObj ? `<span style="background:#fff;color:${cc};padding:1px 6px;border-radius:4px;margin-left:4px;font-size:10px;font-weight:900;">📐 ${escapeHtml(refObj)}</span>` : '';
    html += `<div class="nutri-conf"><span class="badge" style="background:${cc}18;color:${cc};">${refIco} 信憑性 ${stars}（${escapeHtml(lbl)}）${refTag}</span></div>`;
  }
  // 基準物の使い方ヒント (信憑性 ★☆☆ の時のみ表示)
  if (conf && conf.level === 1) {
    html += `<div class="nutri-conf" style="margin-top:6px;"><span class="badge" style="background:#fef3c7;color:#92400e;font-size:10px;">💡 次回ヒント: 🥢お箸・🍚茶碗・☕コップ・🪙 500円玉 など大きさの基準を一緒に写すと精度が上がります</span></div>`;
  }
  html += '<div class="nutri-foot">▮ 基準値｜食事摂取基準2025・スマートミール基準</div>';
  html += '</div>';
  return html;
}

const ALC_PRESETS = [
  ['beer_can_350', '🍺 ビール缶 350', 14],
  ['beer_mug_500', '🍺 中ジョッキ',   20],
  ['sake_1go',     '🍶 日本酒 1合',    22],
  ['wine_glass',   '🍷 ワイン グラス', 12],
  ['highball',     '🥃 ハイボール',     14],
  ['shochu_mizu',  '🍑 焼酎 水割り',   20],
];
function buildAlcExtraBar(p) {
  const extra = Number(p.extra_alcohol_g || 0);
  const hasAlc = (function() {
    try {
      const ns = typeof p.nutrition_scores === 'string' ? JSON.parse(p.nutrition_scores) : p.nutrition_scores;
      if (!ns) return false;
      const a = ns.alcohol;
      const v = (a && typeof a === 'object') ? Number(a.value) : (typeof a === 'number' ? a : 0);
      return v > 0 || ns.has_alcohol === true;
    } catch (e) { return false; }
  })();
  // アルコール未検出 & 追加もなし → 「飲んだ記録を追加」だけの最小UI (折り畳み)
  const summary = extra > 0
    ? `🍺 追加飲酒記録 <b style="color:#92400e;">+${extra}g</b> (写真未反映分)`
    : (hasAlc ? `🍺 もう一杯飲んだ場合はここから追加` : `🍺 写真に写ってないドリンクを記録`);
  const presetBtns = ALC_PRESETS.map(([k, lbl, g]) =>
    `<button type="button" class="alc-preset" onclick="event.stopPropagation();addAlcohol(${p.id}, '${k}')">${lbl} <b>+${g}g</b></button>`
  ).join('');
  return `<div class="alc-extra" id="alc-extra-${p.id}">
    <button type="button" class="alc-toggle" onclick="toggleAlcPanel(${p.id})">${summary}<span class="alc-caret">▾</span></button>
    <div class="alc-panel" id="alc-panel-${p.id}" style="display:none;">
      <div class="alc-presets">${presetBtns}</div>
      <div class="alc-foot">
        <span class="alc-current" id="alc-current-${p.id}">合計追加: <b>+${extra}g</b></span>
        <button type="button" class="alc-reset" onclick="resetAlcohol(${p.id})">リセット</button>
      </div>
    </div>
  </div>`;
}

async function addAlcohol(postId, presetKey) {

  });

function applyAlcoholUpdate(postId, r) {

// AI ヘルスアドバイザーのコメント整形
// 新形式 (5セクション: 良い点/悪い点/改善点/あなたの傾向/やってみよう！) のときだけ
// アドバイザーカードで表示。旧形式 (CoWell Classic アーカイブの 食事/ヘルスアドバイザー
// 2人形式や、本文中に【】強調が散在するもの) は単一バブルで【】を <strong> 化して表示
function renderAdvisorComment(cmt) {
  if (!cmt) return '';
  const text = String(cmt);
  // 新形式の5セクションヘッダーホワイトリスト
  const SEC_META = {
    '良い点':       { icon: '✅', color: '#10b981' },
    '悪い点':       { icon: '⚠️', color: '#f59e0b' },
    '改善点':       { icon: '🔧', color: '#3b82f6' },
    'あなたの傾向': { icon: '📈', color: '#8b5cf6' },
    'やってみよう!': { icon: '🎯', color: '#ef4444' },
  };
  const sections = [];
  const re = /【([^】]+)】([\s\S]*?)(?=【[^】]+】|$)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const hdr = m[1].trim().replace(/[!！]+$/, '!');  // 「やってみよう！」を正規化
    const body = m[2].trim();
    if (body && SEC_META[hdr]) sections.push({ hdr, body, meta: SEC_META[hdr] });
  }
  // 5セクション中3つ以上検出できたときだけ新形式カード表示
  if (sections.length >= 3) {
    return '<div class="ai-advisor-card">' +
      '<div class="ai-advisor-hdr-row">' +
        '<img class="ai-advisor-avatar" src="/assets/concierge_health_avatar.png?v=8" alt="ヘルスアドバイザー" loading="lazy">' +
        '<div class="ai-advisor-hdr-text">' +
          '<div class="ai-advisor-hdr-name">🩺 AIヘルスアドバイザー</div>' +
          '<div class="ai-advisor-hdr-sub">健康管理室より</div>' +
        '</div>' +
      '</div>' +
      sections.map(s =>
        `<div class="ai-sec" style="border-left-color:${s.meta.color};">
          <div class="ai-sec-hdr" style="color:${s.meta.color};">${s.meta.icon} ${escapeHtml(s.hdr)}</div>
          <div class="ai-sec-body">${escapeHtml(s.body).replace(/\n/g, '<br>')}</div>
        </div>`
      ).join('') + '</div>';
  }
  // 旧形式または単発テキスト: 本文中の【XX】を <strong> 化して単一バブル
  let safe = escapeHtml(text);
  safe = safe.replace(/【([^】]+)】/g, '<strong class="ai-emph">【$1】</strong>');
  safe = safe.replace(/\n/g, '<br>');
  return `<div class="ai-cmt-block">💬 ${safe}</div>`;
}

async function api(p, opts) {
  opts = opts || {}; opts.headers = opts.headers || {};
  opts.headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(p, opts);
  if (r.status === 401) { showLogin('セッション切れ'); throw new Error('401'); }
  return r.json();
}
function showLogin(err) {
  document.getElementById('login').style.display = 'block';
  document.getElementById('app').style.display = 'none';
  if (err) document.getElementById('li-err').textContent = err;
}
async function doLogin() {
  const id = document.getElementById('li-id').value.trim();
  const pw = document.getElementById('li-pw').value;
  const err = document.getElementById('li-err');
  err.textContent = '';
  try {
    const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login_id: id, password: pw }) });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || '失敗'; return; }
    token = d.token;
    localStorage.setItem('cohub_token', token);

}

  const composer = document.getElementById('composer');

function setupSocket() {
  if (_socket || !window.io) return;
  try {
    _socket = io({ auth: { token } });
    _socket.on('plaza:new', payload => prependPost(payload.post));
    _socket.on('plaza:delete', payload => removePost(payload.id));
    _socket.on('plaza:react', payload => {
      // 自分のリアクションは toggleReact で即時反映済 → サーバー echo は無視 (ダブルカウント防止)
      if (me && payload && payload.user_id === me.uid) return;
      applyReact(payload);
    });
    _socket.on('plaza:comment', payload => bumpCmt(payload.post_id));
  } catch (e) {}
}

async function submitPost() {
  const errEl = document.getElementById('cmp-err');
  errEl.textContent = '';
  const text = document.getElementById('cmp-text').value.trim();
  if (!text && !_imageFile) { errEl.textContent = '本文か画像を入力してください'; return; }
  if (_curCat === '食事' && !_imageFile && !text) { errEl.textContent = '食事カテゴリは写真付きをおすすめ'; return; }
  const btn = document.getElementById('cmp-submit');
  const isAI = _curCat === '食事' && _imageFile;
  btn.disabled = true; btn.textContent = isAI ? '🧠 AI分析中…' : '投稿中…';
  try {
    const fd = new FormData();
    fd.append('category', _curCat);
    fd.append('content', text);
    if (document.getElementById('cmp-anon').checked) fd.append('is_anonymous', '1');
    if (_imageFile) fd.append('image', _imageFile);
    const r = await fetch('/api/plaza/posts', { method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd });
    if (!r.ok) {
      let msg = 'HTTP ' + r.status;
      try { const j = await r.json(); msg = j.msg || msg; } catch(e){}
      errEl.textContent = '送信失敗: ' + msg;
      return;
    }
    const d = await r.json();
    if (!d.success) { errEl.textContent = d.msg || '保存失敗'; return; }
    document.getElementById('cmp-text').value = '';
    document.getElementById('cmp-count').textContent = '0';
    document.getElementById('cmp-anon').checked = true;
    clearImage();
    // 食事+AI が成功してれば nutrition_scores が入っている
    if (_curCat === '食事' && _imageFile && !d.post.nutrition_scores) {
      errEl.style.color = '#b45309';
      errEl.textContent = '⚠ AI栄養分析に失敗しました(投稿は保存済)。画像が食事と認識されなかった可能性。';
      setTimeout(() => { errEl.textContent = ''; errEl.style.color = '#dc2626'; }, 6000);
    }
    // 投稿カテゴリと合うタブにいれば即表示。違うタブなら教える
    if (_curTab === 'all' || _curTab === _curCat) {
      prependPost(d.post);
    } else {
      errEl.style.color = '#0f766e';
      errEl.textContent = '✓ 投稿しました ([' + _curCat + ']タブで確認)';
      setTimeout(() => { errEl.textContent = ''; errEl.style.color = '#dc2626'; }, 4000);
    }
  } catch (e) {
    errEl.textContent = '通信エラー: ' + (e.message || e);
  } finally { btn.disabled = false; btn.textContent = '投稿'; }
}

  if (!d.posts.length) {
    const tabName = (window._TAB_META && window._TAB_META[_curTab] && window._TAB_META[_curTab].label) || _curTab;
    const msg = _curTab === 'all' ? 'まだ投稿がありません。<br>最初の一投目を!' : tabName + ' の投稿はまだありません';
    feed.innerHTML = '<div class="empty"><div class="ico">🌳</div><div>' + msg + '</div></div>';
    return;
  }
  feed.innerHTML = d.posts.map(postHtml).join('');
  // 投稿データを DOM 要素に紐付け (追加飲酒記録の再レンダリング用)
  for (const p of d.posts) {
    const el = document.getElementById('post-' + p.id);
    if (el) el.__postData = p;
  }
}

function postHtml(p) {
  // 食事投稿は 👍 のみ (マウント防止ルール維持)
  const reactionSet = p.category === '食事' ? REACTIONS.filter(r => r.e === '👍') : REACTIONS;
  const reactions = reactionSet.map(r => {
    const e = r.e;
    const ct = (p.reactions && p.reactions[e]) || 0;
    const mine = !!(p.my_reactions && p.my_reactions[e]);
    return `<button class="react-btn ${mine ? 'mine' : ''}" onclick="toggleReact(${p.id}, '${e}')" title="${r.label}">` +
      `<span class="em">${e}</span><span class="lb">${r.label}</span>` +
      (ct ? `<span class="ct">${ct}</span>` : '') +
      `</button>`;
  }).join('');
  const img = p.image_url ? `<img class="post-image" src="${escapeHtml(p.image_url)}" onclick="openImgModal('${escapeHtml(p.image_url)}')">` : '';
  const delBtn = p.can_delete ? `<button class="del-btn" onclick="deletePost(${p.id})" title="削除">🗑</button>` : '';
  const cnt = p.comment_count || 0;
  const isArchive = p.kind === 'archive';
  let nutri = '';
  if (p.nutrition_scores) {
    try {
      let ns = typeof p.nutrition_scores === 'string' ? JSON.parse(p.nutrition_scores) : p.nutrition_scores;
      nutri = buildNutritionBar(ns);
      // AI コメント (CoWell Classic の analysis or 新規の ai_comment)
      let cmt = p.ai_comment;
      if (cmt && typeof cmt === 'object') cmt = Object.values(cmt).filter(v => typeof v === 'string').join(' / ');
      if (cmt === '[object Object]' || cmt === 'undefined' || cmt === 'null') cmt = '';
      if (cmt) nutri += renderAdvisorComment(cmt);
    } catch (e) { console.warn('nutri parse fail', e.message, p.nutrition_scores); }
  }
  // 自分の食事投稿に「追加飲酒記録」UI を出す (写真に写ってない後続のドリンクを足す)
  const alcExtraBlock = (!isArchive && p.is_mine && p.category === '食事') ? buildAlcExtraBar(p) : '';
  const archiveTag = isArchive ? '<span class="archive-tag">📦 過去アーカイブ</span>' : '';
  const anonBadge = p.is_anonymous ? (p.is_mine ? '<span class="mine-anon-tag">🎭 ニックネームで投稿中</span>' : '') : '';
  const author = p.author_name || (isArchive ? '(過去ユーザー)' : '不明');
  // 匿名投稿は他人にはアバター隠す (本人には自分のアバター見える)
  const showAvatar = !(p.is_anonymous && !p.is_mine);
  const avatarBlock = showAvatar ? avatarHtml(p.author_avatar, author) : `<div class="avatar-fallback" style="background:linear-gradient(135deg,#94a3b8,#64748b);">🎭</div>`;
  const cat = p.category || '雑談';
  // 推進メンバー専用: 健康管理室向けコメント (柱への注釈、AI凝縮の補強材料)
  const isPromoter = !!(me && (me.is_field_promoter || me.employee_type === 'admin'));
  const promoterBlock = (!isArchive && isPromoter) ? `
    <button class="pcmt-btn" onclick="togglePromoterComments(${p.id})" title="健康管理室向け推進メンバーコメント">🩺 推進コメント</button>
    <div class="pcmts" id="pcmts-${p.id}"></div>` : '';
  return `<article class="post ${isArchive ? 'archive' : ''}" id="post-${p.id}" data-id="${p.id}">
    <div class="post-head">
      ${avatarBlock}
      <div class="post-meta">
        <div class="post-author">${escapeHtml(author)} ${archiveTag}${anonBadge}</div>
        <div class="post-time"><span class="cat-bdg ${escapeHtml(cat)}">${escapeHtml(cat)}</span> · ${relTime(p.created_at)}</div>
      </div>
      ${delBtn}
    </div>
    ${p.content ? `<div class="post-content">${escapeHtml(p.content)}</div>` : ''}
    ${img}
    ${nutri}
    ${alcExtraBlock}
    ${!isArchive ? `<div class="post-actions">
      ${reactions}
      ${p.category === '食事' ? '<span style="font-size:10px;color:#94a3b8;margin-left:auto;">食事投稿は👍のみ (マウント防止)</span>' : `<button class="cmt-btn" onclick="toggleComments(${p.id})">💬 <span class="cmt-ct" id="cmt-ct-${p.id}">${cnt || ''}</span></button>`}
      ${isPromoter ? `<button class="pcmt-btn" onclick="togglePromoterComments(${p.id})" title="健康管理室向け推進コメント">🩺<span class="cmt-ct" id="pcmt-ct-${p.id}"></span></button>` : ''}
    </div>
    <div class="comments" id="cmts-${p.id}"></div>
    <div class="pcmts" id="pcmts-${p.id}"></div>` : ''}
  </article>`;
}

function prependPost(p) {
  if (document.getElementById('post-' + p.id) && p.kind !== 'archive') return;
  // タブフィルタ: 全部以外は同じカテゴリのみ
  if (_curTab !== 'all' && p.category !== _curTab) return;
  document.getElementById('feed').insertAdjacentHTML('afterbegin', postHtml(p));
  const el = document.getElementById('post-' + p.id);
  if (el) el.__postData = p;
}
function removePost(id) {
  const el = document.getElementById('post-' + id);
  if (el) el.remove();
}

async function toggleReact(id, emoji) {
  const r = await api('/api/plaza/posts/' + id + '/react', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ emoji })
  });
  if (!r.success) return;
  applyReact({ post_id: id, emoji, user_id: me.uid, added: r.added });
}

function applyReact(payload) {
  const article = document.getElementById('post-' + payload.post_id);
  if (!article) return;
  const btns = article.querySelectorAll('.react-btn');
  for (const b of btns) {
    const emEl = b.querySelector('.em');
    const emText = emEl ? emEl.textContent.trim() : b.textContent.trim();
    if (emText === payload.emoji || emText.startsWith(payload.emoji)) {
      let ctEl = b.querySelector('.ct');
      let ct = ctEl ? parseInt(ctEl.textContent) || 0 : 0;
      ct = ct + (payload.added ? 1 : -1);
      if (ct < 0) ct = 0;
      if (ct > 0) {
        if (!ctEl) {
          ctEl = document.createElement('span');
          ctEl.className = 'ct';
          b.appendChild(ctEl);
        }
        ctEl.textContent = ct;
      } else if (ctEl) {
        ctEl.remove();
      }
      if (payload.user_id === me.uid) {
        if (payload.added) b.classList.add('mine'); else b.classList.remove('mine');
      }
      break;
    }
  }
}

async function deletePost(id) {
  if (!confirm('この投稿を削除しますか？')) return;
  const r = await api('/api/plaza/posts/' + id, { method: 'DELETE' });
  if (r.success) removePost(id);
}

async function togglePromoterComments(id) {
  const box = document.getElementById('pcmts-' + id);
  if (box.classList.contains('open')) { box.classList.remove('open'); return; }
  box.classList.add('open');
  box.innerHTML = '<div style="font-size:12px;color:#9d174d;padding:6px;">読み込み中…</div>';
  try {
    const d = await api('/api/wellness/plaza-comments/' + id);
    if (!d.success) { box.innerHTML = '<div style="font-size:12px;color:#dc2626;">' + escapeHtml(d.msg || '取得失敗') + '</div>'; return; }
    const list = (d.comments || []).map(c => `<div class="pcmt-item">
      <div class="pcmt-author">🩺 ${escapeHtml(c.author_name||'')} · ${relTime(c.created_at)}</div>
      <div style="color:#3f3f46;margin-top:2px;">${escapeHtml(c.content)}</div>
    </div>`).join('');
    box.innerHTML = `<div class="pcmt-head">🩺 推進メンバー専用コメント (健康管理室向け、AI凝縮の補強材料)</div>
      ${list || '<div style="font-size:11px;color:#a78bfa;padding:6px;">まだコメントはありません</div>'}
      <form class="pcmt-input" onsubmit="postPromoterComment(event, ${id});return false;">
        <input type="text" placeholder="この投稿への気付きを書く…" maxlength="1000" id="pcmt-input-${id}">
        <button type="submit">送信</button>
      </form>`;
    const cnt = (d.comments || []).length;
    const ct = document.getElementById('pcmt-ct-' + id);
    if (ct) ct.textContent = cnt ? ' ' + cnt : '';
  } catch (e) { box.innerHTML = '<div style="font-size:12px;color:#dc2626;">通信エラー</div>'; }
}

async function postPromoterComment(ev, id) {
  ev.preventDefault();
  const inp = document.getElementById('pcmt-input-' + id);
  const content = inp.value.trim();
  if (!content) return;
  const r = await api('/api/wellness/plaza-comments/' + id, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
  });
  if (!r.success) { alert(r.msg || '失敗'); return; }
  inp.value = '';
  togglePromoterComments(id); togglePromoterComments(id); // 閉じて再展開で反映
}

async function toggleComments(id) {
  const box = document.getElementById('cmts-' + id);
  if (box.classList.contains('open')) { box.classList.remove('open'); return; }
  box.classList.add('open');
  box.innerHTML = '<div style="font-size:12px;color:#94a3b8;padding:6px;">読み込み中…</div>';
  const d = await api('/api/plaza/posts/' + id + '/comments');
  if (!d.success) { box.innerHTML = '取得失敗'; return; }
  const list = (d.comments || []).map(c => `<div class="cmt">
    ${avatarHtml(c.author_avatar, c.author_name)}
    <div class="cmt-body">
      <span class="cmt-author">${escapeHtml(c.author_name || '')}</span><span class="cmt-time">${relTime(c.created_at)}</span>
      <div class="cmt-text">${escapeHtml(c.content)}</div>
    </div>
  </div>`).join('');
  box.innerHTML = list + `<form class="cmt-form" onsubmit="postComment(event, ${id});return false;">
    <input type="text" placeholder="コメント…" maxlength="500" id="cmt-input-${id}">
    <button type="submit">送信</button>
  </form>`;
  document.getElementById('cmt-input-' + id).focus();
}

async function postComment(ev, id) {
  ev.preventDefault();
  const inp = document.getElementById('cmt-input-' + id);
  const content = inp.value.trim();
  if (!content) return;
  const r = await api('/api/plaza/posts/' + id + '/comments', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ content })
  });
  if (!r.success) { alert(r.msg || '失敗'); return; }
  inp.value = '';
  const c = r.comment;
  inp.closest('form').insertAdjacentHTML('beforebegin', `<div class="cmt">
    ${avatarHtml(c.author_avatar, c.author_name)}
    <div class="cmt-body">
      <span class="cmt-author">${escapeHtml(c.author_name || '')}</span><span class="cmt-time">たった今</span>
      <div class="cmt-text">${escapeHtml(c.content)}</div>
    </div>
  </div>`);
  bumpCmt(id);
}

function bumpCmt(id) {
  const el = document.getElementById('cmt-ct-' + id);
  if (!el) return;
  const cur = parseInt(el.textContent) || 0;
  el.textContent = (cur + 1).toString();
}

function openImgModal(url) { document.getElementById('img-modal-img').src = url; document.getElementById('img-modal').classList.add('open'); }
function closeImgModal() { document.getElementById('img-modal').classList.remove('open'); }

(async function() {
  if (!token) { showLogin(''); return; }
  try {
    const u = JSON.parse(localStorage.getItem('cohub_user') || localStorage.getItem('cohub_admin_user') || '{}');
    if (u && u.uid) { me = u; initApp(); }
    else showLogin('');
  } catch (e) { showLogin(''); }
})();
</script>
