<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoWell — 会社メール</title>
<link rel="manifest" href="/manifest.json">
<script src="/version-check.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; background: #f1f5f9; color: #0f172a; }
  header { background: linear-gradient(135deg,#0f766e,#0d9488); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
  header .back { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  header .title { font-weight: 800; font-size: 16px; }
  header .addr { margin-left: auto; font-size: 11px; opacity: 0.9; }
  header .gear { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(15,23,42,0.05); }
  .setup h2 { margin: 0 0 6px; font-size: 16px; }
  .setup p { color: #475569; font-size: 13px; margin: 4px 0 14px; }
  .setup label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin: 10px 0 4px; }
  .setup input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  .setup .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .btn { background: #0d9488; color: #fff; border: none; border-radius: 8px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 16px; }
  .btn:disabled { opacity: 0.6; }
  .btn-sec { background: #eef2f7; color: #475569; }
  .compose label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin: 10px 0 4px; }
  .compose input, .compose textarea { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .compose textarea { resize: vertical; line-height: 1.5; }
  .err { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .ok { color: #047857; font-size: 12px; margin-top: 8px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toolbar button { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .toolbar .cnt { margin-left: auto; font-size: 12px; color: #64748b; }
  .mlist { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .mrow { display: flex; gap: 10px; padding: 11px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; align-items: center; }
  .mrow:last-child { border-bottom: none; }
  .mrow:hover { background: #f8fafc; }
  .mrow.unseen { background: #f0fdfa; }
  .m-av { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e2e8f0; }
  .m-av-gen { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 15px; }
  .m-main { flex: 1; min-width: 0; }
  .m-top { display: flex; align-items: baseline; gap: 8px; }
  .m-top .who { flex: 1; font-size: 13px; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .m-top .dt { font-size: 11px; color: #94a3b8; white-space: nowrap; flex-shrink: 0; }
  .mrow.unseen .who, .mrow.unseen .subj { font-weight: 800; color: #0f172a; }
  .mrow .subj { font-size: 13px; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .mrow .pin { color: #0d9488; font-size: 11px; }
  .m-badge { font-size: 9px; background: #0d9488; color: #fff; border-radius: 4px; padding: 1px 5px; font-weight: 700; vertical-align: middle; margin-left: 4px; }
  .empty { padding: 40px 16px; text-align: center; color: #94a3b8; font-size: 14px; }
  /* detail overlay */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; z-index: 50; }
  .overlay.show { display: block; }
  .sheet { position: absolute; inset: 0; background: #fff; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; }
  .sheet .shead { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 8px; }
  .sheet .shead button { background: #eef2f7; border: 1px solid #cbd5e1; border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .shead-actions { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .shead-actions::-webkit-scrollbar { height: 0; }
  .sheet .shead .act { white-space: nowrap; flex-shrink: 0; font-size: 12px; font-weight: 700; }
  .sheet .shead .act-primary { background: #0d9488; color: #fff; border-color: #0d9488; }
  .mtrans { margin: 12px 16px; padding: 12px 14px; background: #f0fdfa; border: 1px solid #99f6e4; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .mtrans .mtrans-hd { font-size: 11px; font-weight: 800; color: #0f766e; margin-bottom: 6px; }
  .sheet .meta { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
  .sheet .meta .s { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .sheet .meta .row { font-size: 12px; color: #475569; margin: 2px 0; }
  .sheet #msgArea { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet .body { }
  .sheet .body pre { white-space: pre-wrap; word-break: break-word; padding: 14px 16px; font-family: inherit; font-size: 14px; line-height: 1.6; margin: 0; }
  .sheet iframe { width: 100%; border: none; display: block; }
  .att { padding: 8px 16px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #475569; }
  .att .a { display: inline-block; background: #eef2f7; border-radius: 6px; padding: 3px 8px; margin: 2px 4px 2px 0; }
  .loading { padding: 30px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>
<header>
  <button class="back" onclick="location.href='/home'">← 戻る</button>
  <span class="title">📧 会社メール</span>
  <span class="addr" id="addr"></span>
  <button class="gear" id="gear" title="差出人名・署名の設定" onclick="showSettings()" style="display:none;">⚙️</button>
</header>

<div class="wrap">
  <!-- 設定 -->
  <div class="card setup" id="setup" style="display:none;">
    <h2>会社メールの設定</h2>
    <p>あなたの会社メール（@stdun.co.jp）のアドレスとパスワードを入力してください。パスワードはサーバーで<b>暗号化して保存</b>されます。</p>
    <label>メールアドレス</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@stdun.co.jp">
    <label>パスワード</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="メールのパスワード">
    <div class="hint">サーバー: z114.secure.ne.jp（IMAP 993 / SMTP 465・SSL）</div>
    <div class="err" id="setupMsg"></div>
    <button class="btn" id="saveBtn" onclick="saveCred()">接続して保存</button>
    <button class="btn btn-sec" id="cancelBtn" onclick="hideSetup()" style="display:none;">キャンセル</button>
  </div>

  <!-- 差出人名・署名 -->
  <div class="card setup compose" id="mailSettings" style="display:none;">
    <h2>差出人名・署名</h2>
    <p>送信時の差出人名（送付名）と、本文へ自動挿入する署名を設定します。</p>
    <label>差出人名（送付名）</label>
    <input id="set-name" type="text" placeholder="例: 小林 猛（スタンダード運輸）">
    <div class="hint">空欄ならメールアドレスのみが差出人になります。</div>
    <label style="margin-top:12px;">署名</label>
    <textarea id="set-sig" rows="6" placeholder="例:&#10;──────────&#10;スタンダード運輸株式会社　小林 猛&#10;TEL: 000-000-0000 / t_kobayashi@stdun.co.jp"></textarea>
    <div class="hint">新規作成・返信のとき本文末尾へ自動で入ります（その場で編集可）。</div>
    <div class="err" id="setMsg"></div>
    <button class="btn" id="setSaveBtn" onclick="saveSettings()">保存</button>
    <button class="btn btn-sec" onclick="hideSettings()">閉じる</button>
    <div style="margin-top:14px;text-align:center;"><a href="#" onclick="showSetup();return false;" style="font-size:12px;color:#64748b;">メールアドレス／パスワードを再設定する</a></div>
  </div>

  <!-- 受信箱 -->
  <div id="mailUi" style="display:none;">
    <div class="toolbar">
      <button onclick="loadInbox()">🔄 更新</button>
      <button onclick="openCompose()" style="background:#0d9488;color:#fff;border-color:#0d9488;">✏️ 新規作成</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="mlist" id="mlist"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<!-- 本文オーバーレイ -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeMsg()">
  <div class="sheet">
    <div class="shead shead-actions">
      <button onclick="closeMsg()" title="一覧へ">←</button>
      <button class="act act-primary" onclick="openReply()">↩ 返信</button>
      <button class="act" onclick="replyAll()">👥 全員に返信</button>
      <button class="act" onclick="openForward()">↪ 転送</button>
      <button class="act" onclick="translateBody()">🌐 翻訳</button>
      <button class="act" onclick="copyLink()">🔗 リンク</button>
    </div>
    <div id="msgArea"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<!-- 作成/返信オーバーレイ -->
<div class="overlay" id="composeOverlay" onclick="if(event.target===this)closeCompose()">
  <div class="sheet">
    <div class="shead"><button onclick="closeCompose()">✕ 閉じる</button><b id="c-title" style="font-size:13px;color:#64748b;">メール作成</b></div>
    <div class="compose" style="flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px;">
      <label>宛先 (To)</label>
      <input id="c-to" type="text" placeholder="someone@example.com（複数はカンマ区切り）">
      <label>Cc <span style="color:#94a3b8;font-weight:400;">(任意)</span></label>
      <input id="c-cc" type="text">
      <label>件名</label>
      <input id="c-subj" type="text">
      <label>本文</label>
      <textarea id="c-body" rows="12"></textarea>
      <label>添付ファイル <span style="color:#94a3b8;font-weight:400;">(任意・複数可・1件20MBまで)</span></label>
      <input id="c-files" type="file" multiple style="font-size:13px;padding:6px 0;border:none;">
      <div class="err" id="c-msg"></div>
      <button class="btn" id="c-send" onclick="sendMail()">送信</button>
    </div>
  </div>
</div>

<script>
const token = localStorage.getItem('cohub_token') || '';
if (!token) location.href = '/';
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { localStorage.removeItem('cohub_token'); location.href = '/'; return null; }
  return r.json();
}
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    return (d.getMonth()+1) + '/' + d.getDate();
  } catch (e) { return ''; }
}

let mailSig = '';   // 署名
let mailName = '';  // 差出人名
let myEmail = '';   // 自分のメール (全員に返信で自分を除外)
async function init() {
  const s = await api('/api/mail/status');
  if (!s) return;
  if (s.configured) {
    mailSig = s.signature || '';
    mailName = s.display_name || '';
    myEmail = (s.email || '').toLowerCase();
    $('addr').textContent = s.email;
    $('gear').style.display = '';
    $('mailUi').style.display = '';
    $('setup').style.display = 'none';
    loadInbox();
  } else {
    showSetup(true);
  }
}
function showSetup(first) {
  $('setup').style.display = '';
  $('mailSettings').style.display = 'none';
  $('mailUi').style.display = 'none';
  $('cancelBtn').style.display = first ? 'none' : '';
  $('setupMsg').textContent = '';
}
function hideSetup() { $('setup').style.display = 'none'; $('mailUi').style.display = ''; }

function showSettings() {
  $('set-name').value = mailName;
  $('set-sig').value = mailSig;
  $('setMsg').textContent = '';
  $('mailSettings').style.display = '';
  $('setup').style.display = 'none';
  $('mailUi').style.display = 'none';
}
function hideSettings() { $('mailSettings').style.display = 'none'; $('mailUi').style.display = ''; }
async function saveSettings() {
  $('setSaveBtn').disabled = true; $('setMsg').className = 'ok'; $('setMsg').textContent = '保存中…';
  const r = await api('/api/mail/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ display_name: $('set-name').value, signature: $('set-sig').value }) });
  $('setSaveBtn').disabled = false;
  if (r && r.success) {
    mailName = $('set-name').value; mailSig = $('set-sig').value;
    $('setMsg').className = 'ok'; $('setMsg').textContent = '保存しました';
    setTimeout(() => hideSettings(), 700);
  } else { $('setMsg').className = 'err'; $('setMsg').textContent = (r && r.msg) || '保存に失敗しました'; }
}

async function saveCred() {
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || !password) { $('setupMsg').className = 'err'; $('setupMsg').textContent = 'アドレスとパスワードを入力してください'; return; }
  $('saveBtn').disabled = true; $('setupMsg').className = 'ok'; $('setupMsg').textContent = '接続を確認しています…';
  const r = await api('/api/mail/credentials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
  $('saveBtn').disabled = false;
  if (r && r.success) {
    $('pass').value = '';
    $('addr').textContent = email; $('gear').style.display = '';
    hideSetup(); loadInbox();
  } else {
    $('setupMsg').className = 'err';
    $('setupMsg').textContent = ((r && r.msg) || '保存に失敗しました') + (r && r.detail ? '  ［' + r.detail + '］' : '');
  }
}

const PAGE = 30;
let mailItems = [];
let mailTotal = 0;
let mailHasMore = false;
// 送信者アバター: CoHubメンバーは同じアバター、それ以外はメール由来の色+頭文字を生成
function avColor(key) {
  key = String(key || ''); let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return 'hsl(' + (h % 360) + ',52%,46%)';
}
function avInitial(name, addr) {
  const s = String(name || addr || '?').trim();
  const ch = s.charAt(0);
  return /[A-Za-z]/.test(ch) ? ch.toUpperCase() : ch;
}
function mailAvatarHtml(m) {
  if (m.avatar_url) return '<img class="m-av" src="' + esc(m.avatar_url) + '" alt="">';
  return '<div class="m-av m-av-gen" style="background:' + avColor(m.from_addr || m.from_name) + ';">' + esc(avInitial(m.from_name, m.from_addr)) + '</div>';
}
function rowHtml(m) {
  const who = esc(m.from_name || m.from_addr || '');
  return '<div class="mrow' + (m.seen ? '' : ' unseen') + '" id="mrow-' + m.uid + '" onclick="openMsg(' + m.uid + ')">'
    + mailAvatarHtml(m)
    + '<div class="m-main">'
    +   '<div class="m-top"><span class="who">' + (m.seen ? '' : '● ') + who + (m.is_member ? '<span class="m-badge">社内</span>' : '') + '</span><span class="dt">' + fmtDate(m.date) + '</span></div>'
    +   '<div class="subj">' + esc(m.subject) + (m.attach ? ' <span class="pin">📎</span>' : '') + '</div>'
    + '</div></div>';
}
function renderInbox() {
  $('cnt').textContent = '全 ' + mailTotal + ' 件中 ' + mailItems.length + ' 件';
  if (!mailItems.length) { $('mlist').innerHTML = '<div class="empty">受信メールはありません</div>'; return; }
  let html = mailItems.map(rowHtml).join('');
  if (mailHasMore) html += '<div style="padding:12px;text-align:center;"><button id="moreBtn" onclick="loadMore()" style="background:#eef2f7;border:1px solid #cbd5e1;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;">🔽 もっと見る（古いメール）</button></div>';
  $('mlist').innerHTML = html;
}
async function loadInbox() {
  $('mlist').innerHTML = '<div class="loading">読み込み中…</div>';
  mailItems = [];
  const r = await api('/api/mail/inbox?limit=' + PAGE + '&offset=0');
  if (!r) return;
  if (!r.success) {
    if (r.need_setup) { showSetup(true); return; }
    $('mlist').innerHTML = '<div class="empty">取得に失敗しました<br><span style="font-size:11px;">' + esc(r.detail || r.msg || '') + '</span></div>';
    return;
  }
  mailItems = r.items || [];
  mailTotal = r.total || 0;
  mailHasMore = !!r.has_more;
  renderInbox();
}
async function loadMore() {
  const btn = $('moreBtn'); if (btn) { btn.disabled = true; btn.textContent = '読み込み中…'; }
  const r = await api('/api/mail/inbox?limit=' + PAGE + '&offset=' + mailItems.length);
  if (r && r.success) {
    mailItems = mailItems.concat(r.items || []);
    mailTotal = r.total || mailTotal;
    mailHasMore = !!r.has_more;
    renderInbox();
  } else if (btn) { btn.disabled = false; btn.textContent = '🔽 もっと見る（古いメール）'; }
}

let curMsg = null; // 表示中メール (返信用)
async function openMsg(uid) {
  $('overlay').classList.add('show');
  $('msgArea').innerHTML = '<div class="loading">読み込み中…</div>';
  const r = await api('/api/mail/message/' + uid);
  if (!r) return;
  if (!r.success) { $('msgArea').innerHTML = '<div class="empty">' + esc(r.msg || '取得失敗') + '</div>'; curMsg = null; return; }
  curMsg = { uid, from_addr: r.from_addr, from: r.from, subject: r.subject, message_id: r.message_id, references: r.references, text: r.text, date: r.date, to_addrs: r.to_addrs || [], cc_addrs: r.cc_addrs || [] };
  let bodyHtml;
  if (r.html) {
    // HTMLメールはサンドボックスiframeで安全に表示 (スクリプト無効)
    bodyHtml = '<iframe sandbox="allow-same-origin" id="mbody"></iframe>';
  } else {
    bodyHtml = '<div class="body"><pre>' + esc(r.text || '(本文なし)') + '</pre></div>';
  }
  const att = (r.attachments && r.attachments.length)
    ? '<div class="att">📎 添付: ' + r.attachments.map(a => '<span class="a" style="cursor:pointer;" onclick="dlAttach(' + uid + ',' + a.index + ',\'' + esc(a.filename).replace(/'/g, "\\'") + '\')">⬇ ' + esc(a.filename) + ' <span style="color:#94a3b8;">(' + Math.max(1, Math.round((a.size || 0) / 1024)) + 'KB)</span></span>').join('') + '</div>' : '';
  $('msgArea').innerHTML =
    '<div class="meta"><div class="s">' + esc(r.subject) + '</div>'
    + '<div class="row">From: ' + esc(r.from) + '</div>'
    + (r.to ? '<div class="row">To: ' + esc(r.to) + '</div>' : '')
    + '<div class="row">' + (r.date ? new Date(r.date).toLocaleString('ja-JP') : '') + '</div></div>'
    + bodyHtml + att;
  if (r.html) {
    const ifr = $('mbody');
    ifr.srcdoc = '<base target="_blank"><div style="font-family:sans-serif;font-size:14px;padding:8px;">' + r.html + '</div>';
    ifr.onload = () => { try { ifr.style.height = Math.min(ifr.contentWindow.document.body.scrollHeight + 24, 4000) + 'px'; } catch (e) { ifr.style.height = '70vh'; } };
  }
}
function closeMsg() {
  $('overlay').classList.remove('show');
  // 開いたメールを既読表示に（再取得せずページ状態を保持）
  if (curMsg && curMsg.uid != null) {
    const it = mailItems.find(x => x.uid === curMsg.uid);
    if (it && !it.seen) { it.seen = true; renderInbox(); }
  }
}

// 添付ダウンロード (Bearer認証のためfetch→blob→保存)
async function dlAttach(uid, idx, filename) {
  try {
    const r = await fetch('/api/mail/message/' + uid + '/attachment/' + idx, { headers: { 'Authorization': 'Bearer ' + token } });
    if (!r.ok) { alert('添付の取得に失敗しました'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename || 'attachment';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { alert('ダウンロードに失敗しました'); }
}

// ===== 作成 / 返信 / 送信 =====
let composeCtx = {};
function openCompose(pre) {
  pre = pre || {};
  composeCtx = { in_reply_to: pre.in_reply_to || '', references: pre.references || '', forward_uid: pre.forward_uid || '' };
  $('c-title').textContent = pre.title || 'メール作成';
  $('c-to').value = pre.to || '';
  $('c-cc').value = pre.cc || '';
  $('c-subj').value = pre.subject || '';
  // 本文未指定(新規作成)なら署名を入れる。返信時はpre.bodyに署名+引用を渡す
  $('c-body').value = (pre.body !== undefined && pre.body !== null) ? pre.body : (mailSig ? '\n\n' + mailSig : '');
  try { $('c-files').value = ''; } catch (e) {}
  $('c-msg').textContent = '';
  $('composeOverlay').classList.add('show');
}
function openReply() {
  if (!curMsg) return;
  const orig = curMsg;
  const quoted = '\n\n--------------------\n'
    + (orig.date ? new Date(orig.date).toLocaleString('ja-JP') + ' ' : '') + (orig.from || '') + ' wrote:\n'
    + String(orig.text || '').split('\n').map(l => '> ' + l).join('\n');
  openCompose({
    title: '返信',
    to: orig.from_addr || '',
    subject: /^re:/i.test(orig.subject || '') ? orig.subject : ('Re: ' + (orig.subject || '')),
    body: (mailSig ? '\n\n' + mailSig : '') + quoted,
    in_reply_to: orig.message_id || '',
    references: ((orig.references ? (Array.isArray(orig.references) ? orig.references.join(' ') : orig.references) + ' ' : '') + (orig.message_id || '')).trim(),
  });
}
// 👥 全員に返信: 差出人 + 他の宛先(To/Cc)から自分を除外して Cc に
function replyAll() {
  if (!curMsg) return;
  const orig = curMsg;
  const others = [].concat(orig.to_addrs || [], orig.cc_addrs || [])
    .map(a => (a || '').toLowerCase())
    .filter(a => a && a !== myEmail && a !== (orig.from_addr || '').toLowerCase());
  const ccList = Array.from(new Set(others)).join(', ');
  const quoted = '\n\n--------------------\n'
    + (orig.date ? new Date(orig.date).toLocaleString('ja-JP') + ' ' : '') + (orig.from || '') + ' wrote:\n'
    + String(orig.text || '').split('\n').map(l => '> ' + l).join('\n');
  openCompose({
    title: '全員に返信',
    to: orig.from_addr || '',
    cc: ccList,
    subject: /^re:/i.test(orig.subject || '') ? orig.subject : ('Re: ' + (orig.subject || '')),
    body: (mailSig ? '\n\n' + mailSig : '') + quoted,
    in_reply_to: orig.message_id || '',
    references: ((orig.references ? (Array.isArray(orig.references) ? orig.references.join(' ') : orig.references) + ' ' : '') + (orig.message_id || '')).trim(),
  });
}
// ↪ 転送: 件名Fwd: + 元本文を引用、元メールの添付も自動で付く(forward_uid)
function openForward() {
  if (!curMsg) return;
  const orig = curMsg;
  const head = '\n\n---------- 転送メッセージ ----------\n'
    + 'From: ' + (orig.from || '') + '\n'
    + (orig.date ? 'Date: ' + new Date(orig.date).toLocaleString('ja-JP') + '\n' : '')
    + 'Subject: ' + (orig.subject || '') + '\n\n'
    + String(orig.text || '');
  openCompose({
    title: '転送',
    to: '',
    subject: /^fwd:/i.test(orig.subject || '') ? orig.subject : ('Fwd: ' + (orig.subject || '')),
    body: (mailSig ? '\n\n' + mailSig : '') + head,
    forward_uid: orig.uid,
  });
}
// 🔗 このメールを開くリンクをコピー
function copyLink() {
  if (!curMsg) return;
  const url = location.origin + '/mail.html?uid=' + curMsg.uid;
  const done = () => { const b = event && event.target; if (b) { const t = b.textContent; b.textContent = '✓ コピー'; setTimeout(() => b.textContent = t, 1500); } };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done).catch(() => prompt('コピーしてください', url));
  else prompt('コピーしてください', url);
}
// 🌐 翻訳: 本文を日本語へ(既に日本語なら英語へ)。本文の下に表示
async function translateBody() {
  if (!curMsg) return;
  const src = String(curMsg.text || '').trim();
  if (!src) { alert('翻訳できる本文がありません'); return; }
  let box = document.getElementById('mtrans');
  if (!box) { box = document.createElement('div'); box.id = 'mtrans'; box.className = 'mtrans'; $('msgArea').appendChild(box); }
  box.innerHTML = '<div class="mtrans-hd">🌐 翻訳</div>翻訳中…';
  const target = /[ぁ-んァ-ヶ一-龠]/.test(src) ? 'en' : 'ja'; // 日本語が含まれれば英訳、なければ和訳
  const r = await api('/api/translate/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ target, text: src.slice(0, 8000) }) });
  if (r && (r.translation || r.translation === '')) {
    box.innerHTML = '<div class="mtrans-hd">🌐 翻訳（' + (target === 'ja' ? '日本語' : 'English') + '）</div>' + esc(r.translation || '(訳出なし)');
  } else {
    box.innerHTML = '<div class="mtrans-hd">🌐 翻訳</div>翻訳に失敗しました' + (r && r.detail ? '（' + esc(r.detail) + '）' : '');
  }
}
function closeCompose() { $('composeOverlay').classList.remove('show'); }
async function sendMail() {
  const to = $('c-to').value.trim();
  if (!to) { $('c-msg').className = 'err'; $('c-msg').textContent = '宛先を入力してください'; return; }
  $('c-send').disabled = true; $('c-msg').className = 'ok'; $('c-msg').textContent = '送信中…';
  const fd = new FormData();
  fd.append('to', to);
  fd.append('cc', $('c-cc').value.trim());
  fd.append('subject', $('c-subj').value);
  fd.append('body', $('c-body').value);
  fd.append('in_reply_to', composeCtx.in_reply_to || '');
  fd.append('references', composeCtx.references || '');
  if (composeCtx.forward_uid) fd.append('forward_uid', composeCtx.forward_uid);
  const files = $('c-files').files;
  for (let i = 0; i < files.length; i++) fd.append('files', files[i]);
  const r = await api('/api/mail/send', { method: 'POST', body: fd });
  $('c-send').disabled = false;
  if (r && r.success) {
    $('c-msg').className = 'ok'; $('c-msg').textContent = '送信しました';
    setTimeout(() => closeCompose(), 800);
  } else {
    $('c-msg').className = 'err';
    $('c-msg').textContent = ((r && r.msg) || '送信に失敗しました') + (r && r.detail ? '  ［' + r.detail + '］' : '');
  }
}
// 🔗 リンクから来た場合: ?uid= のメールを直接開く
(async () => {
  await init();
  try {
    const u = parseInt(new URLSearchParams(location.search).get('uid'));
    if (u) openMsg(u);
  } catch (e) {}
})();
</script>
