<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CoWell — 会社メール</title>
<link rel="manifest" href="/manifest.json">
<script src="/version-check.js" defer></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; background: #f1f5f9; color: #0f172a; }
  header { background: linear-gradient(135deg,#0f766e,#0d9488); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; }
  header .back { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  header .title { font-weight: 800; font-size: 16px; }
  header .addr { margin-left: auto; font-size: 11px; opacity: 0.9; }
  header .gear { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 15px; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 12px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(15,23,42,0.05); }
  .setup h2 { margin: 0 0 6px; font-size: 16px; }
  .setup p { color: #475569; font-size: 13px; margin: 4px 0 14px; }
  .setup label { display: block; font-size: 12px; font-weight: 700; color: #334155; margin: 10px 0 4px; }
  .setup input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
  .setup .hint { font-size: 11px; color: #94a3b8; margin-top: 4px; }
  .btn { background: #0d9488; color: #fff; border: none; border-radius: 8px; padding: 11px 16px; font-size: 14px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 16px; }
  .btn:disabled { opacity: 0.6; }
  .btn-sec { background: #eef2f7; color: #475569; }
  .err { color: #dc2626; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .ok { color: #047857; font-size: 12px; margin-top: 8px; }
  .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .toolbar button { background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .toolbar .cnt { margin-left: auto; font-size: 12px; color: #64748b; }
  .mlist { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
  .mrow { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer; align-items: baseline; }
  .mrow:last-child { border-bottom: none; }
  .mrow:hover { background: #f8fafc; }
  .mrow.unseen { background: #f0fdfa; }
  .mrow .who { width: 32%; min-width: 90px; font-size: 13px; color: #334155; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow.unseen .who, .mrow.unseen .subj { font-weight: 800; color: #0f172a; }
  .mrow .subj { flex: 1; font-size: 13px; color: #475569; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .subj .clip { color: #94a3b8; }
  .mrow .dt { font-size: 11px; color: #94a3b8; white-space: nowrap; }
  .mrow .pin { color: #0d9488; font-size: 11px; }
  .empty { padding: 40px 16px; text-align: center; color: #94a3b8; font-size: 14px; }
  /* detail overlay */
  .overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.5); display: none; z-index: 50; }
  .overlay.show { display: block; }
  .sheet { position: absolute; inset: 0; background: #fff; max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; }
  .sheet .shead { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
  .sheet .shead button { background: #eef2f7; border: 1px solid #cbd5e1; border-radius: 18px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .sheet .meta { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; }
  .sheet .meta .s { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
  .sheet .meta .row { font-size: 12px; color: #475569; margin: 2px 0; }
  .sheet .body { flex: 1; overflow: auto; }
  .sheet .body pre { white-space: pre-wrap; word-break: break-word; padding: 14px 16px; font-family: inherit; font-size: 14px; line-height: 1.6; margin: 0; }
  .sheet iframe { width: 100%; border: none; }
  .att { padding: 8px 16px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #475569; }
  .att .a { display: inline-block; background: #eef2f7; border-radius: 6px; padding: 3px 8px; margin: 2px 4px 2px 0; }
  .loading { padding: 30px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>
<header>
  <button class="back" onclick="location.href='/home'">← 戻る</button>
  <span class="title">📧 会社メール</span>
  <span class="addr" id="addr"></span>
  <button class="gear" id="gear" title="メール設定" onclick="showSetup()" style="display:none;">⚙️</button>
</header>

<div class="wrap">
  <!-- 設定 -->
  <div class="card setup" id="setup" style="display:none;">
    <h2>会社メールの設定</h2>
    <p>あなたの会社メール（@stdun.co.jp）のアドレスとパスワードを入力してください。パスワードはサーバーで<b>暗号化して保存</b>されます。</p>
    <label>メールアドレス</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@stdun.co.jp">
    <label>パスワード</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="メールのパスワード">
    <div class="hint">サーバー: z114.secure.ne.jp（IMAP 993 / SMTP 465・SSL）</div>
    <div class="err" id="setupMsg"></div>
    <button class="btn" id="saveBtn" onclick="saveCred()">接続して保存</button>
    <button class="btn btn-sec" id="cancelBtn" onclick="hideSetup()" style="display:none;">キャンセル</button>
  </div>

  <!-- 受信箱 -->
  <div id="mailUi" style="display:none;">
    <div class="toolbar">
      <button onclick="loadInbox()">🔄 更新</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <div class="mlist" id="mlist"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<!-- 本文オーバーレイ -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeMsg()">
  <div class="sheet">
    <div class="shead"><button onclick="closeMsg()">← 一覧</button><b style="font-size:13px;color:#64748b;">メール本文</b></div>
    <div id="msgArea"><div class="loading">読み込み中…</div></div>
  </div>
</div>

<script>
const token = localStorage.getItem('cohub_token') || '';
if (!token) location.href = '/';
async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {});
  const r = await fetch(path, opts);
  if (r.status === 401) { localStorage.removeItem('cohub_token'); location.href = '/'; return null; }
  return r.json();
}
const $ = (id) => document.getElementById(id);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function fmtDate(s) {
  if (!s) return '';
  try {
    const d = new Date(s);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    if (sameDay) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    return (d.getMonth()+1) + '/' + d.getDate();
  } catch (e) { return ''; }
}

async function init() {
  const s = await api('/api/mail/status');
  if (!s) return;
  if (s.configured) {
    $('addr').textContent = s.email;
    $('gear').style.display = '';
    $('mailUi').style.display = '';
    $('setup').style.display = 'none';
    loadInbox();
  } else {
    showSetup(true);
  }
}
function showSetup(first) {
  $('setup').style.display = '';
  $('mailUi').style.display = 'none';
  $('cancelBtn').style.display = first ? 'none' : '';
  $('setupMsg').textContent = '';
}
function hideSetup() { $('setup').style.display = 'none'; $('mailUi').style.display = ''; }

async function saveCred() {
  const email = $('email').value.trim();
  const password = $('pass').value;
  if (!email || !password) { $('setupMsg').className = 'err'; $('setupMsg').textContent = 'アドレスとパスワードを入力してください'; return; }
  $('saveBtn').disabled = true; $('setupMsg').className = 'ok'; $('setupMsg').textContent = '接続を確認しています…';
  const r = await api('/api/mail/credentials', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
  $('saveBtn').disabled = false;
  if (r && r.success) {
    $('pass').value = '';
    $('addr').textContent = email; $('gear').style.display = '';
    hideSetup(); loadInbox();
  } else {
    $('setupMsg').className = 'err';
    $('setupMsg').textContent = ((r && r.msg) || '保存に失敗しました') + (r && r.detail ? '  ［' + r.detail + '］' : '');
  }
}

async function loadInbox() {
  $('mlist').innerHTML = '<div class="loading">読み込み中…</div>';
  const r = await api('/api/mail/inbox?limit=30');
  if (!r) return;
  if (!r.success) {
    if (r.need_setup) { showSetup(true); return; }
    $('mlist').innerHTML = '<div class="empty">取得に失敗しました<br><span style="font-size:11px;">' + esc(r.detail || r.msg || '') + '</span></div>';
    return;
  }
  $('cnt').textContent = '全 ' + r.total + ' 件';
  if (!r.items.length) { $('mlist').innerHTML = '<div class="empty">受信メールはありません</div>'; return; }
  $('mlist').innerHTML = r.items.map(m => {
    const who = esc(m.from_name || m.from_addr || '');
    return '<div class="mrow' + (m.seen ? '' : ' unseen') + '" onclick="openMsg(' + m.uid + ')">'
      + '<div class="who">' + (m.seen ? '' : '● ') + who + '</div>'
      + '<div class="subj">' + esc(m.subject) + (m.attach ? ' <span class="pin">📎</span>' : '') + '</div>'
      + '<div class="dt">' + fmtDate(m.date) + '</div>'
      + '</div>';
  }).join('');
}

async function openMsg(uid) {
  $('overlay').classList.add('show');
  $('msgArea').innerHTML = '<div class="loading">読み込み中…</div>';
  const r = await api('/api/mail/message/' + uid);
  if (!r) return;
  if (!r.success) { $('msgArea').innerHTML = '<div class="empty">' + esc(r.msg || '取得失敗') + '</div>'; return; }
  let bodyHtml;
  if (r.html) {
    // HTMLメールはサンドボックスiframeで安全に表示 (スクリプト無効)
    bodyHtml = '<iframe sandbox="allow-same-origin" id="mbody"></iframe>';
  } else {
    bodyHtml = '<div class="body"><pre>' + esc(r.text || '(本文なし)') + '</pre></div>';
  }
  const att = (r.attachments && r.attachments.length)
    ? '<div class="att">📎 添付: ' + r.attachments.map(a => '<span class="a">' + esc(a.filename) + '</span>').join('') + '</div>' : '';
  $('msgArea').innerHTML =
    '<div class="meta"><div class="s">' + esc(r.subject) + '</div>'
    + '<div class="row">From: ' + esc(r.from) + '</div>'
    + (r.to ? '<div class="row">To: ' + esc(r.to) + '</div>' : '')
    + '<div class="row">' + (r.date ? new Date(r.date).toLocaleString('ja-JP') : '') + '</div></div>'
    + bodyHtml + att;
  if (r.html) {
    const ifr = $('mbody');
    ifr.srcdoc = '<base target="_blank"><div style="font-family:sans-serif;font-size:14px;padding:8px;">' + r.html + '</div>';
    ifr.onload = () => { try { ifr.style.height = Math.min(ifr.contentWindow.document.body.scrollHeight + 24, 4000) + 'px'; } catch (e) { ifr.style.height = '70vh'; } };
  }
}
function closeMsg() { $('overlay').classList.remove('show'); loadInboxQuiet(); }
async function loadInboxQuiet() {
  // 既読化を反映するため静かに再取得
  const r = await api('/api/mail/inbox?limit=30');
  if (r && r.success) {
    $('cnt').textContent = '全 ' + r.total + ' 件';
    if (r.items.length) $('mlist').innerHTML = r.items.map(m => {
      const who = esc(m.from_name || m.from_addr || '');
      return '<div class="mrow' + (m.seen ? '' : ' unseen') + '" onclick="openMsg(' + m.uid + ')">'
        + '<div class="who">' + (m.seen ? '' : '● ') + who + '</div>'
        + '<div class="subj">' + esc(m.subject) + (m.attach ? ' <span class="pin">📎</span>' : '') + '</div>'
        + '<div class="dt">' + fmtDate(m.date) + '</div></div>';
    }).join('');
  }
}

init();
</script>
</body>
</html>
