<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>簡単モード | CoWell</title>
<!-- タブレット専用manifest: ログイン後もタブレットアプリとして一貫させる -->
<link rel="manifest" href="/tablet-manifest.json?v=2">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoWellタブレット">
<link rel="apple-touch-icon" href="/img/cowell-icon-192-v6.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#bceae3;color:#123;font-size:20px;overflow:hidden}
  /* 2026-08-01: 掲示板をもう少し広く(社長)。1100pxだと横長タブレット/PCで左右が余っていた。
     左列(タブ+葵)は226pxのままなので、増えた分はすべて掲示板の横幅になる。 */
  .wrap{max-width:1400px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:5px 14px 3px;overflow:hidden}
  /* 最下段 著作権(ビズテラス ロゴ入り) */
  .tb-copyright{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:1px 0 0;margin-top:0;font-size:11px;font-weight:700;color:#3f5750;opacity:.75}
  .tb-copyright img{height:15px;width:auto}
  /* ヘッダー */
  .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:1px}   /* ⭐横ボタンと掲示板を接近させる(2026-08-05 社長) */
  /* 📱 個人スマホ誘導 (2026-08-01 社長指示): 共有タブレットの右上でヘルスがQRを案内する。
     人物は「向かって左を手のひらで指し示す」姿勢なので、QRは人物の左隣に置く。共用端末のみ表示。 */
  /* 枠・背景なし。ヘッダー下端(=掲示板の上端)にヘルスのバストを合わせるため align-self:flex-end +
     .top の margin-bottom を打ち消す負のマージン。 */
  /* ⚠️2026-08-05 (社長「ヘルスが掲示板にめり込んでいる」): 下に-6px はみ出させていたため、
     人物の足元が掲示板の上端に食い込んでいた。はみ出しをやめて 2px 浮かせる。 */
  .qr-guide{flex:0 0 auto;display:none;align-items:flex-end;gap:0;margin-left:auto;margin-right:2px;
    align-self:flex-end;margin-bottom:2px;background:none;border:0;padding:0;box-shadow:none;overflow:visible}
  .qr-guide.on{display:flex}
  /* QRブロックは上端合わせ (2026-08-01): 見出し「スマホでも 見られます」を
     名前の行(ログアウトボタン)と同じ高さに揃える。人物は下端(掲示板の上端)合わせのまま。 */
  .qr-guide .qg-box{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:0;box-shadow:none;
    align-self:flex-start;margin-top:2px}
  .qr-guide .qg-ttl{font-size:11px;font-weight:900;color:#0c4a6e;line-height:1.2;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.85)}
  .qr-guide .qg-qr{width:62px;height:62px;display:block;border-radius:4px}
  .qr-guide .qg-sub{font-size:10px;font-weight:700;color:#0c4a6e;white-space:nowrap;text-shadow:0 1px 2px rgba(255,255,255,.85)}
  .qr-guide .qg-person{height:104px;width:auto;display:block;margin-left:-12px;position:relative;z-index:1;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.18))}
  /* 画面が狭い端末では場所を取りすぎるので出さない (共用タブレットは横長前提) */
  @media (max-width:760px){ .qr-guide{display:none !important} }
  /* 左ガター(掲示板の左列と同幅)=名前/横メニューを掲示板の左端に揃える(直線性)。アバターはタブの真上。 */
  /* min-height=アバターの高さ。顔写真は後から読み込まれるので、先に場所を空けておかないと
     読み込み完了の瞬間にヘッダーが伸びて下のタブ行が下がる(2026-07-26) */
  /* ⭐2026-08-01 (社長): 左上の空きへ『アバター＋その下に名前』を配置。アバターは大きめに。 */
  /* ⭐2026-08-05 (社長): アバターを大きく／名前・マイページの行は**横ボタンの下端に揃える**。
     ⚠️揃え方は justify-content:flex-end (下寄せ)。右の #stripHost も .topleft で下寄せなので、
       両方の下端＝掲示板の上端が1本の線で揃う。 */
  .top-gutter{flex:0 0 226px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-right:8px}
  .top-gutter .who-av{width:76px;height:76px}
  .who-name-g{flex:0 1 auto;min-width:0;max-width:100%;font-size:16px;font-weight:900;color:#0f5c46;line-height:1.2;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ⭐2026-08-01 (社長): 左上に余裕ができたので 名前を大きく / マイページとログアウトは各1行 */
  .top-gutter{gap:6px}
  .who-line{display:flex;align-items:center;justify-content:center;gap:7px;max-width:100%;flex-wrap:nowrap}
  .gut-mypage{flex:0 0 auto;font-family:inherit;font-size:12.5px;font-weight:800;color:#334155;white-space:nowrap;
    background:#eef1f5;border:1.5px solid #cbd5e1;border-radius:11px;padding:5px 10px;cursor:pointer}
  .gut-mypage:active{transform:translateY(1px)}

  #whoTx{display:none}   /* 名前はガター側に出す(スマホでは下のmedia queryで復活) */
  .who .phone-only{display:none}   /* マイページはガター側に置く */
  /* ヘッダー左=名前＋簡単モードの下に横メニューを縦積み(葵はログアウトの左隣) */
  /* ⭐2026-08-01 (社長): 掲示板の上端を『マイページ行の下』に合わせる。
     = ヘッダーの高さは左のまとまり(アバター+名前+マイページ)で決め、操作メニューはその下端に揃える。 */
  .topleft{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;gap:5px;justify-content:flex-end}
  .top{align-items:stretch}
  .topleft .who{flex:0 0 auto}
  .who{flex:1;font-size:26px;font-weight:900;color:#0f5c46;line-height:1.2;display:flex;align-items:center;width:100%}
  .who small{display:block;font-size:15px;color:#5b6b78;font-weight:700}
  .who-av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.15);background:#eef}
  .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:9px;padding:4px 11px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 #a41a1a;vertical-align:middle;margin-left:0}
  .btn-logout:active{transform:translateY(2px);box-shadow:0 1px 0 #a41a1a}
  .menu-link{display:inline-block;margin-left:6px;font-size:14px;color:#2563eb;text-decoration:underline;background:none;border:none;cursor:pointer}
  /* 表示切替(かんたん⇔詳しい)ボタン: 名前の横 2026-07-09 */
  .who-actions{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
  .view-switch{display:inline-block;vertical-align:middle;margin-left:8px;font-size:13px;font-weight:800;color:#1f6fd0;background:#eef4fb;border:2px solid #cfe0ee;border-radius:11px;padding:5px 11px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  /* マイページ: 横メニューから名前の右へ移設 (2026-08-01 社長指示)。PC版と同じ形・色だけグレー系 */
  .view-switch.mypage-btn{margin-left:14px;color:#334155;background:#eef1f5;border-color:#cbd5e1}
  /* 切替(PC版)はアイコンのみ (2026-08-02 社長指示) */
  .view-switch.icon-only{padding:5px 9px;font-size:16px;line-height:1.15}
  .top-switch{align-self:flex-end;flex:0 0 auto;margin:0 2px 6px 6px}   /* ログアウトとQRの間 */
  .view-switch:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  /* 2カラム: 左=葵(常時表示) / 右=操作パネル */
  .main{display:flex;flex-direction:row;gap:8px;flex:1;min-height:0}
  /* 左列: 上=切替タブ / 下=葵(掲示板の左下) */
  .boardside{flex:0 0 auto;width:226px;display:flex;flex-direction:column;gap:8px;min-height:0}
  /* ⭐2026-08-05 (社長「縦ボタン群を上に・葵も上に移動して全身が見えるように」):
     葵を下端に貼り付ける margin-top:auto をやめ、タブのすぐ下から残りの高さいっぱいに立たせる。 */
  .boardside .aoi-col{margin-top:4px;flex:1 1 auto;min-height:0;justify-content:flex-start}
  /* 横メニュー(ヘッダー左・簡単モードの下)。左寄せ・はみ出しは横スクロール */
  #stripHost{flex:0 1 auto;min-width:0;align-self:flex-start;max-width:100%;margin-top:0}   /* 位置は .topleft の下揃えで決める (2026-08-01) */
  /* 葵に合わせ夏の飾りも縮小(大きすぎて散らかるのを防ぐ) */

  /* ☀️夏バージョン: 画面全体を薄いターコイズ(body)に。葵の周りの枠は無し(aoi-col/aoiWrapとも背景なし)。
     発話動画は白背景を同じターコイズにベイク済・待機stillは透過ゆえ、画面と葵がシームレスに繋がる(青被り無し・白箱無し・枠無し)。 */
  .aoi-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;position:relative}
  /* ⚠️2026-08-06 (社長「葵と『もう一度聴く』が重なる」): 『もう一度聴く』は葵の列の下端に絶対配置なので、
     バストアップにして葵が大きくなった結果ボタンに重なった。葵の枠に下余白を取り、その分だけ葵を小さくする。 */
  #aoiWrap{flex:1 1 auto;min-height:150px;width:214px;height:auto;display:flex;align-items:flex-start;justify-content:center;position:relative;overflow:hidden;border-radius:14px;padding-bottom:30px}
  /* 動画クリップ下部(約85〜92%)にAI生成の文字化けテロップが焼き込まれているため、下16%を隠して非表示に。
     静止画・動画の両方へ同率で適用し、切替時に高さがズレないようにする。round=角丸維持。 */
  /* テロップ隠しは直線クリップのみ(角丸クリップは動画でカクつき/黒影の原因→枠側で角丸)。 */
  /* 葵は左配置なので左右反転(掲示板側=右を向く)。枠/飾りは反転しない。 */
  #aoiStill,#aoiVid{max-height:100%;max-width:100%;width:auto;height:auto;display:block;position:relative;z-index:2;transform:scaleX(-1)}
  /* clip-path廃止(再生中の黒影/カクつき対策)。動画下部の文字化けテロップは背景色(夏ターコイズ)バーで覆って隠す。 */
  #aoiWrap::after{display:none}  /* 全身版はテロップ焼込み無し・足元を隠さない */
  /* 夏の飾り(葵の四隅・音や操作を妨げない装飾レイヤー) */


  @keyframes seSway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes seSun{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.1);opacity:1}}



  /* ☀️刷新: パネルも透明化し画面全体をターコイズに。カード/入力は各自の背景で可読性維持。 */
  .panel{flex:1 1 auto;background:transparent;border-radius:22px;padding:1px 4px 0;overflow:auto;min-height:0}
  /* 掲示板モード=パネルを縦フルに使い、ページャーを常に画面内に収める(モーダルには影響させない) */
  #panelBody.boardmode{display:flex;flex-direction:column;height:100%;min-height:0}
  #panelBody.boardmode #guidanceBanner{flex:0 0 auto}
  #panelBody.boardmode #noticeBanner{flex:0 0 auto}
  #panelBody.boardmode #boardHost{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
  .bubble{display:none}   /* 吹き出し廃止(可変高さでレイアウトが崩れるため)。案内は音声主体。 */
  .bubble:before{content:"";position:absolute;bottom:-16px;left:40px;border:8px solid transparent;border-top-color:#7fd4b6}
  .bubble:after{content:"";position:absolute;bottom:-11px;left:42px;border:6px solid transparent;border-top-color:#fff}
  /* カード(右パネル・2x2) */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{position:relative;border:none;border-radius:20px;padding:18px 12px;font-size:23px;font-weight:900;color:#fff;cursor:pointer;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .card .ico{font-size:44px;line-height:1}
  .c-health{background:linear-gradient(135deg,#f0662f,#e0431f)}
  .c-report{background:linear-gradient(135deg,#2f9ad8,#1f6fd0)}
  .c-news{background:linear-gradient(135deg,#d9932a,#c06f10)}
  .c-msg{background:linear-gradient(135deg,#6d55c8,#4f39a8)}
  .c-wellness{background:linear-gradient(135deg,#34d399,#059669)}
  .c-mypage{background:linear-gradient(135deg,#64748b,#334155)}
  .c-kiko{background:linear-gradient(135deg,#0891b2,#0e5a8a)}
  .c-arch{background:linear-gradient(135deg,#a1836a,#7d6248)}
  .c-grp{background:linear-gradient(135deg,#0ea5e9,#0369a1)}   /* 🏢グループ宛 (2026-08-05) */
  /* 📝申請(仮払金の振込申請・立替の精算)。詳細版 home.html の「申請・承認」カテゴリと同じスレート色 (2026-08-06) */
  .c-apply{background:linear-gradient(135deg,#64748b,#334155)}
  .c-apply-pay{background:linear-gradient(135deg,#0e9f6e,#046c4e)}
  .c-apply-list{background:linear-gradient(135deg,#a1a1aa,#71717a)}
  /* 🚪ログアウト=横ボタン群の右端(QRの隣)。⚠️幅を詰めないと1行に収まらず下へ折り返す(1280pxで実測)。 */
  .c-logout{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  /* 帰庫点呼(乗務後) 2026-07-09。⚠️2026-08-06に1問1画面へ移行し、選択肢は体調チェックと共通の
     .opts/.opt(大ボタン)を使う。旧 .kiko-sec/.kiko-q/.kiko-opts/.kiko-note は撤去した。 */
  .fat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .fat-btn{padding:14px 0;font-size:21px;font-weight:800;border:2px solid #cfd8e0;border-radius:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .fat-btn.sel{outline:3px solid #0ea5e9;outline-offset:-2px;transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .fat-ends{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#94a3b8;margin:4px 2px 0}
  /* マイページ(かんたんモード) 2026-07-09 */
  .mp-head{display:flex;align-items:center;gap:14px;padding:2px 2px 14px;border-bottom:1px solid #e5e9ef;margin-bottom:16px}
  .mp-av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.15);flex:0 0 auto;background:#eef}
  .mp-name{font-size:22px;font-weight:800;color:#1f2b36;line-height:1.2}
  .mp-name small{display:block;font-size:14px;color:#6b7a86;font-weight:600;margin-top:3px}
  .mp-title{font-size:17px;font-weight:800;color:#475569;margin:0 0 12px}
  .mp-lang{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border:2px solid #cfd8e0;border-radius:16px;background:#fff;font-size:22px;font-weight:800;color:#334155;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .mp-lang.on{border-color:#0f766e;background:#f0fdfa;color:#0f766e}
  .mp-lang:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .mp-sec{border:1px solid #e5e9ef;border-radius:16px;padding:14px 16px;margin-bottom:14px;background:#fbfcfe}
  .mp-h{font-size:18px;font-weight:800;color:#334155;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .mp-desc{font-size:13px;color:#6b7a86;margin:0 0 10px;line-height:1.5}
  .mp-in{width:100%;box-sizing:border-box;font-size:20px;padding:13px 14px;border:2px solid #cfd8e0;border-radius:14px;margin-bottom:10px;background:#fff}
  .mp-save{display:inline-block;padding:13px 24px;border:none;border-radius:14px;background:#0f766e;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .mp-save:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .mp-msg{font-size:14px;margin-top:8px;min-height:18px;font-weight:700}
  .mp-msg.ok{color:#15803d}.mp-msg.err{color:#dc2626}
  .mp-link{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #cfd8e0;border-radius:14px;background:#fff;font-size:18px;font-weight:700;color:#1f6fd0;cursor:pointer}
  /* 発話後のみ表示。葵の下端に重ねて上帯の高さを消費しない(掲示板を広く保つ) */
  .replay-btn{position:absolute;bottom:0;left:0;right:0;margin:0 auto;width:max-content;background:#eef4fb;color:#1f6fd0;border:1.5px solid #cfe0ee;border-radius:9px;padding:2px 8px;font-size:10px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.12);z-index:4}
  .replay-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  /* 健康サブメニュー: 3列・小さめ */
  .hgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .hgrid .card{min-height:92px;font-size:17px;padding:10px 6px;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .hgrid .card .ico{font-size:32px}
  .hgrid .card .hm-face{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  @media (max-width:640px){ .hgrid{grid-template-columns:1fr 1fr} }
  .pill{position:absolute;top:12px;right:12px;background:#dc2626;color:#fff;font-size:18px;font-weight:900;border-radius:999px;padding:4px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}   /* 新着=赤ベタ(2026-08-05 社長) */
  .pill.ok{background:#fff;color:#0a7d3f}   /* 済は赤くしない */
  /* パネル内フローの見出し */
  .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .mtitle{font-size:23px;font-weight:900;color:#0f5c46}
  .btn-close{background:#64748b;color:#fff;border:none;border-radius:14px;padding:10px 16px;font-size:19px;font-weight:900;cursor:pointer;white-space:nowrap}
  .q{font-size:30px;font-weight:900;line-height:1.4;margin:10px 0 18px;text-align:center}
  .opts{display:flex;flex-direction:column;gap:14px}
  .opt{border:3px solid #cfe0ee;background:#f4f9ff;border-radius:20px;padding:20px;font-size:26px;font-weight:900;color:#123;cursor:pointer;text-align:center}
  .opt:active{background:#dcecff;transform:translateY(2px)}
  .opt.yes{border-color:#8fd4b6;background:#eefaf3}
  .opt.no{border-color:#f2c0c0;background:#fdeeee}
  .big-in{width:100%;font-size:30px;padding:16px;border:3px solid #cfe0ee;border-radius:18px;text-align:center;font-weight:900;background:#fff}
  textarea.big-in{min-height:150px;text-align:left;line-height:1.5}

     幅の狭いタブレットでは末尾のボタン(📧会社メール)が画面外に切れて「入口が無い」のと同じ状態になる。
     折り返せば必ず全部見える(1行に収まる端末では従来どおり1行のまま)。 */

     見出し＋薄い枠。かたまりが目で分かれば、点呼ボタンの金リング(tenko-btn)のような個別の強調は不要になる。 */
  .mgroup{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;border:2px solid rgba(15,23,42,.14);border-radius:15px;padding:3px 8px 5px;background:rgba(255,255,255,.5);overflow:visible}

  /* 2026-08-01 (社長): 体調チェック〜読んだ通達・連絡までボタン幅を揃える。
     文字数でバラバラだった横幅を固定し、アイコンと文字を中央に置いて並びを整える。 */
  /* ⚠️2026-08-05: 幅を固定(118px)にしていたため、ログアウトをヘッダーに出した分だけ横が足りなくなり
     ボタン群が2行に折り返していた。**足りないときだけ縮む**(最小92px・文字は2行に折り返す)ようにして
     1行に収める。高さは min-height で揃えるので、1行/2行が混在しても段差にならない。 */
  /* ⭐2026-08-05 (社長「横ボタンがズレズレ、恰好よく一行にそろえて」):
     可変幅(flex:0 1)＋文字の2行折り返しにしたら、幅も高さもバラバラになった。
     **全ボタンを同じ寸法・ラベルは必ず1行**に戻す。1行に収める調整は『幅を可変にする』のではなく
     『チップを一回り小さくする(118→104px・12→11px)』で行う。 */
  .mchip{position:relative;flex:0 0 104px;width:104px;height:62px;box-sizing:border-box;justify-content:center;border:none;border-radius:13px;padding:6px 4px;min-width:0;color:#fff;font-size:11px;font-weight:900;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18);font-family:inherit;white-space:nowrap;line-height:1.1;text-align:center;overflow:visible}

  .mchip .ico{font-size:22px;line-height:1}
  /* ⭐2026-08-05 (社長「新着バッジをもう少し大きく目立つように。動きがあるといいね。すぐログアウトする社員が多い」)。
     気づかせたいのは【まだ見ていない物がある】ことだけなので、動かすのは未読バッジのみ。
     ⚠️済(.ok)は動かさない=終わったものが跳ねると『まだ何かある』と誤読させる。 */
  .mchip{z-index:1}                 /* 重なり順の土台(バッジを隣のボタンより前に出すため) */
  .mchip.has-new{z-index:3}         /* 未読があるボタンは隣より前 */
  .mchip .pill{top:-6px;right:-6px;font-size:16px;padding:3px 10px;min-width:14px;text-align:center;z-index:9;
    box-shadow:0 0 0 3px #fff, 0 3px 8px rgba(0,0,0,.28);animation:badgePop 1.5s ease-in-out infinite}
  .mchip .pill.ok{animation:none;box-shadow:0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.2);border:1.5px solid #cfe6d6}
  @keyframes badgePop{0%,55%,100%{transform:scale(1)}25%{transform:scale(1.22)}40%{transform:scale(.96)}}
  /* 未読があるボタン自体もゆっくり息をする(バッジだけだと視野の端で気づかれない) */
  .mchip.has-new{animation:chipGlow 2.6s ease-in-out infinite}
  @keyframes chipGlow{0%,100%{box-shadow:0 3px 0 rgba(0,0,0,.18)}50%{box-shadow:0 3px 0 rgba(0,0,0,.18),0 0 0 6px rgba(251,191,36,.42)}}

  .mcol .tile{position:relative;margin:0;overflow:visible;box-shadow:0 8px 18px rgba(45,30,10,.34),0 2px 5px rgba(0,0,0,.22)}

  /* カード内は上限まで(小さい投稿=小カード/長文=大カードでメリハリ)。続きはタップで全文。約90%サイズ(タブレット収まり優先・PCは余裕) */
  .mcol .tile .ttitle{max-height:3.4em;overflow:hidden;font-size:16px}
  .mcol .tile .ttitle.sm{max-height:7em;overflow:hidden;font-size:14px}
  .mcol .tile .tmeta{padding:6px 9px}
  .mcol .tile .foodband,.mcol .tile .circleband{padding:5px 11px;font-size:12px}
  .mcol .tile .foodband,.mcol .tile .circleband{padding-left:16px}   /* pin clearance (2026-08-01) */
  /* ピンで留めた感じ: 上端中央の画鋲＋わずかな傾き */
  /* ⭐2026-08-01 (社長): ピンが帯(ランク表示)の文字に重なるため、上端中央 → 左上の角へ。
     実際の掲示物も角を留めるので自然。帯側は文字をピンのぶん右へ寄せる。 */
  /* ⭐2026-08-01 (社長): 斜めから刺した押しピン。
     ::before = 頭(斜めに傾いた楕円=見下ろした角度) / ::after = 金属の軸(紙へ刺さる方向に伸びる)。
     光源は左上。頭のハイライト・軸の反射・紙に落ちる影の向きを揃えて『刺さっている』ように見せる。 */
  .mcol .tile::before{content:"";position:absolute;top:-15px;left:-9px;width:22px;height:17px;border-radius:50%;z-index:9;
    transform:rotate(-17deg);
    background:
      radial-gradient(ellipse at 30% 24%, rgba(255,255,255,.95) 0 10%, rgba(255,255,255,.34) 24%, transparent 46%),
      radial-gradient(ellipse at 72% 82%, rgba(0,0,0,.42) 0 16%, transparent 54%),
      radial-gradient(ellipse at 46% 42%, var(--pin-a,#e6604d) 0 34%, var(--pin-b,#c0392b) 64%, var(--pin-c,#83201a) 100%);
    box-shadow:0 4px 6px rgba(0,0,0,.40), 0 1px 0 rgba(255,255,255,.30) inset, 0 -3px 5px rgba(0,0,0,.30) inset}
  .mcol .tile::after{content:"";position:absolute;top:-5px;left:2px;width:10px;height:15px;z-index:8;
    transform:rotate(9deg);
    background:linear-gradient(112deg,#fbfcfe 0%,#d5dbe3 30%,#8b95a1 66%,#4d5661 100%);
    clip-path:polygon(4% 0, 66% 6%, 100% 96%, 26% 58%);
    filter:drop-shadow(1px 2px 2px rgba(0,0,0,.46))}
  /* ピンの角度・位置に個体差を付ける(全部同じ角度だと機械的に見える)。色は赤で統一=ランクの色分けと混同させない */
  /* 画鋲の色は4色のローテーション。ランクの色分けは帯と下地で示すので、ピンの色に意味は持たせない。 */
  .mcol .tile:nth-child(4n+1){--pin-a:#e6604d;--pin-b:#c0392b;--pin-c:#83201a}   /* 赤 */
  .mcol .tile:nth-child(4n+2){--pin-a:#5aa9e6;--pin-b:#2372b9;--pin-c:#14497c}   /* 青 */
  .mcol .tile:nth-child(4n+3){--pin-a:#ffd24d;--pin-b:#e3a80f;--pin-c:#9c7207}   /* 黄 */
  .mcol .tile:nth-child(4n){--pin-a:#6cc78a;--pin-b:#2f9e5b;--pin-c:#1b6b3c}     /* 緑 */
  .mcol .tile:nth-child(3n+1)::before{transform:rotate(-24deg)}
  .mcol .tile:nth-child(3n+1)::after{transform:rotate(4deg);left:1px}
  .mcol .tile:nth-child(3n+2)::before{transform:rotate(-9deg);left:-7px}
  .mcol .tile:nth-child(3n+2)::after{transform:rotate(13deg);left:4px}
  .mcol .tile:nth-child(3n)::before{transform:rotate(-31deg);top:-16px;left:-11px}
  .mcol .tile:nth-child(3n)::after{transform:rotate(2deg);left:0px}
  .mcol .tile:nth-child(3n+1){transform:rotate(-.6deg)}
  .mcol .tile:nth-child(3n+2){transform:rotate(.5deg)}
  .mcol .tile:nth-child(3n){transform:rotate(-.3deg)}

    /* 2026-08-01: 「🔊 もう一度聴く」が葵の幅より大きくなり右上ブロックが広がっていた。

    .replay-btn{position:static;width:auto;max-width:100%;box-sizing:border-box;margin:3px auto 0;

    /* 3列×2行 (社長指示 2026-08-01)。中身は5つ = 通達/みんなの投稿/事故・破損 ＋ 労働安全/何を食べようか。

    .pgtabs{display:grid;grid-template-columns:repeat(2,1fr);width:auto;flex:1 1 auto;gap:5px;overflow:visible;align-items:stretch;min-height:0;touch-action:auto}
    .pgtab,.pgbtn-menu{width:100%;min-width:0;height:56px;min-height:0;padding:4px 3px;font-size:9.5px;border-radius:11px;gap:2px;line-height:1.12;overflow:hidden}

    .pgtab .pgti,.pgbtn-menu .pgti{font-size:17px}
    /* 掲示板を1ページ縦積みにして本文スクロール(横ページャは非表示) */
    .panel{flex:0 0 auto;overflow:visible}

    .pgtrack{height:auto;transition:none}
    .pg{height:auto;overflow:visible;padding:6px 0 2px;gap:0}
    .mcol .tile{transform:none!important}
    .pager{display:none}
    .pghint{color:#0f5c46;text-shadow:none}
  }
  /* ⭐2026-08-05 (社長・実機タブレットで確認): 横ボタンが2行に折り返していた。
     画面幅に応じて【ボタンを一回り小さく＋左ガター/QRを詰める】ことで、必ず1行に収める。
     ⚠️折り返しを許すのではなく縮める=かたまりの並び(体調/連絡/おわり)を崩さないため。
     ⚠️⚠️このブロックは**必ず<style>の末尾**に置く。先頭付近に置くと、後から出てくる .mchip /
     .top-gutter の基本ルールに上書きされて無効になる(2026-08-05 実測で発覚)。 */
  /* ⭐2026-08-06 (社長「簡易表示のスマホ画面が見にくい。葵は立たせなくてよい」):
     スマホ(≤640px)は **葵の枠を出さない**。従来は葵のために左に136pxの余白を確保していたため、
     ボタンが右半分に押し込まれ、文字が9.5pxまで小さくなって読めなかった。
     枠をやめて**画面の全幅を使い、文字とボタンを一回り大きく**する。
     ⚠️葵の音声(読み上げ)はAudio要素なので、動画を隠しても喋る。戻したいときは #aoiWrap の display を戻すだけ。 */

    .boardside{ padding-left:0 !important; padding-right:0 !important; }
    .top-gutter{ display:none !important; }
    /* 横ボタン: 3列・文字を大きく */
    /* ⚠️3列にすると『連絡』の4つ目(過去の読んだ通達)だけ2行目に落ちて不格好＋文字が3行に折れる。
       2列にすると 体調=2つで1行ぴったり / 連絡=2×2 で揃い、文字も1〜2行に収まる。 */
    .mgchips{ grid-template-columns:repeat(2,1fr) !important; gap:7px !important; }
    .mgroup{ padding:4px 7px 7px !important; border-radius:14px !important; }
    .mglabel{ font-size:13.5px !important; }

    .pgtab, .pgbtn-menu{ height:62px !important; font-size:12.5px !important; border-radius:13px !important; }
    .pgtab .pgti, .pgbtn-menu .pgti{ font-size:21px !important; }

    /* 読み込み後の余白を詰めて、掲示板を早く出す */
    .wrap{ padding:6px 8px 10px !important; }
    .who-name-g, #whoTx{ font-size:16px !important; }

  @media (min-width:641px) and (max-width:1365px){

var TOKEN = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
// 共用タブレット(キオスク)か、個人スマホ(BYOD)かで挙動を変える。
//  キオスク=無操作オートログアウト有・戻る無効・完了画面でログアウト必須。
//  個人スマホ=自分の端末なのでオートログアウトしない・戻る有効・詳しい表示に切替可。
var IS_KIOSK = (localStorage.getItem('cohub_kiosk') === '1');
/* ⚠️📧会社メールは【簡単版には実装しない】(2026-08-05 社長)。
   「メッセージ＝DM」で、一般社員はDMだけで足りる。会社メールを持つのは役員・事務の8名だけで、
   その人たちはPC(詳しい表示)で見る。一度 かんたんモードに📧を足したが、方針に合わせて撤去した。
   ⚠️共用キオスクでは home.html 側でも mail.html カードを隠している(6/30 機微カード非表示)。 */
// 📱 個人スマホ誘導QR: 読み取ると /tablet?personal=1 (PINだけでログイン)へ。
//   自分のスマホで見ている人には不要なので共用タブレット(キオスク)のときだけ出す。
function setupQrGuide(){
  // 共用タブレットは必ず表示。個人端末でも画面が広ければ出す(PCでの確認・iPad等)。
  // スマホ幅では意味がないので出さない(CSSの @media でも二重に抑止)。
  if(!IS_KIOSK && window.innerWidth < 900) return;
  var g=document.getElementById('qrGuide'), q=document.getElementById('qgQr');
  if(!g||!q) return;
  // QRは誤り訂正H の静的PNG(/assets/byod_qr.png)。手と重ねても読めるようにするため。
  // 本番以外のドメインで開いた場合だけ、その場でQRを生成し直す。
  if(location.origin.indexOf('cohub.biz-terrace.org') < 0){
    q.src='/api/branch-wifi/qr?t='+encodeURIComponent(location.origin+'/tablet?personal=1');
  }
  g.classList.add('on');
}
// 個人スマホ(キオスク印なし)は、ホーム画面に追加した時に個人モードで起動するmanifestへ差し替える。
// ⚠️共用タブレット用のままだと、アプリを開くたびに名簿(アバター選択)が出て、選んで入ると
//   共用扱いになり、ログアウトでまた名簿へ戻る (2026-08-04 スズエで発生)。
try {
  if (!IS_KIOSK) {
    var _mf = document.querySelector('link[rel="manifest"]');
    if (_mf) _mf.setAttribute('href', '/personal-manifest.json?v=1');
  }
} catch (e) {}
// Androidで「アプリ」としてインストールできるようにする(Service Workerが無いとショートカットになる)
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(function(){}); } catch (e) {}
if(!TOKEN){ location.replace(IS_KIOSK ? '/tablet' : '/'); }
var ME=null, AOI_VOICE='ja-JP-Neural2-B', ROSTER_YOMI={};
// 在席(オンライン)登録＋DMリアルタイム受信のため socket.io に接続。
var socket=null, curPeer=null;
function connectSocket(){
  if(socket || typeof io==='undefined') return;
  try{
    socket=io({auth:{token:TOKEN, isMobile:true}});
    socket.on('dm:msg', function(m){
      try{ refreshBadges(); }catch(e){}
      if(curPeer && m && (String(m.from)===curPeer || String(m.to)===curPeer)){ try{ loadThread(curPeer, true); }catch(e){} }
    });
    // 🏢 グループの連絡(拠点・業務)。開いているグループなら引き直す=自分の送信echoもここで整う。
    socket.on('group:msg', function(m){
      try{ refreshBadges(); }catch(e){}
      if(curGroup && m && String(m.group_id)===curGroup){ try{ loadGroupThread(true); }catch(e){} }
    });
    socket.on('dm:blocked', function(b){ try{ speak('申し訳ありません。この相手には 送れません。'+((b&&b.reason==='hierarchy')?' 上司を 通じて ご連絡ください。':'')); }catch(e){} });
  }catch(e){}
}

var _tapEl=null, _goEl=null, _tapCtx=null;
function tapSoundOn(){ try{ return localStorage.getItem('cohub_tap_sound')!=='0'; }catch(e){ return true; } }
// ⚠️2026-08-02: WebAudioだけでは端末によって鳴らなかった。読み上げと同じ<audio>方式を主にする。
//   ⚠️最初のタップの中で1回鳴らして「枠」を押さえること([[autoplay_audio_prime]]と同じ理屈)。
function _tapPrime(){
  try{
    if(!_tapEl){ _tapEl=new Audio(_TAP_WAV); _tapEl.preload='auto'; _tapEl.volume=0.85; }
    if(!_goEl){  _goEl =new Audio(_GO_WAV);  _goEl.preload='auto';  _goEl.volume=0.85; }
    [_tapEl,_goEl].forEach(function(el){ el.muted=true; var p=el.play(); if(p&&p.then)p.then(function(){ try{el.pause();el.currentTime=0;el.muted=false;}catch(e){} }).catch(function(){ el.muted=false; }); });
    if(!_tapCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ _tapCtx=new AC(); } }
    if(_tapCtx && _tapCtx.state!=='running' && _tapCtx.resume){ _tapCtx.resume().catch(function(){}); }
  }catch(e){}
}
function tapSound(kind){
  if(!tapSoundOn()) return;
  var el=(kind==='go')?_goEl:_tapEl;
  try{
    if(!el){ _tapPrime(); el=(kind==='go')?_goEl:_tapEl; }
    if(el){ el.muted=false; el.currentTime=0; var p=el.play(); if(p&&p.catch)p.catch(function(){ _tapBeep(kind); }); }
    else { _tapBeep(kind); }
  }catch(e){ _tapBeep(kind); }
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}   // 音を切っていても手応えは残す
}
// 予備: <audio>が鳴らせない時だけWebAudioで作る
function _tapBeep(kind){
  try{
    if(!_tapCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; _tapCtx=new AC(); }
    var ctx=_tapCtx, go=function(){
      var t=ctx.currentTime+0.005, o=ctx.createOscillator(), g=ctx.createGain();
      var f=(kind==='go')?900:660;
      o.type='triangle'; o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.75, t+0.08);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3, t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.13);
    };
    if(ctx.state==='running') go(); else if(ctx.resume) ctx.resume().then(go).catch(function(){});
  }catch(e){}
}

function speakText(ja){
  var lang=curLang();
  if(lang==='ja'||!ja) return Promise.resolve(ja);
  var ck='cohub_tr_'+lang, cache={};
  try{ cache=JSON.parse(localStorage.getItem(ck)||'{}'); }catch(e){}
  if(cache[ja]!=null) return Promise.resolve(cache[ja]);
  return fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lang:lang,texts:[ja]})})
   .then(function(r){ return r.ok?r.json():null; })
   .then(function(d){ var tr=d&&d.translations&&d.translations[ja];
     if(tr){ cache[ja]=tr; try{ localStorage.setItem(ck,JSON.stringify(cache)); }catch(e){} return tr; }
     return ja; })
   .catch(function(){ return ja; });
}

function speak(text, cb, sayOverride){

  })
   .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
   .then(function(b){
     if(myGen!==_aoiSpeakGen){ _aoiBusy=false; return; }   // ヘルス等の割込みが入ったので葵は鳴らさない(被り防止)

   .catch(function(){ _aoiBusy=false; aoiTalk(false); setTimeout(function(){ if(cb)cb(); }, Math.min(6500, 1300+String(src).length*95)); });
}

function _isPhoneView(){ try{ return !!(window.matchMedia && window.matchMedia('(max-width:640px)').matches); }catch(e){ return false; } }
/* ⚠️2026-08-06 (社長「スマホで掲示板を開くと上部に空白ができる」):

   → スマホのときだけ display:none で畳む。 */
function showStrip(v){ var s=$('stripHost'); if(!s) return;

// 掲示板の切替タブ(左列)。モーダル中は掲示板が出ないので隠す。葵はそのまま(発話するため)。

async function consentGuidance(id, btn){

    try{ speak('ありがとうございます。承諾を 記録しました。'); }catch(e){}

  var reports=d.my_reports||[], months=d.my_months||[], minM=d.min_meals||10;

  // 未作成: 十分な食事記録があれば「作る」、無ければやさしく案内

  if(top && top.n>=minM){
    $('mbody').innerHTML='<div class="q" style="font-size:22px">'+ymLabelJa(top.ym)+'の 食事記録が '+top.n+'件 たまりました。<br>レポートを 作れます。</div>'+

/* ===== 血圧の入力: 大きなテンキー (2026-08-06) =====
   ⚠️旧実装は ＋/− のステッパーで、120→155 を入れるのに 35回タップだった。共用タブレットは

   ⚠️ペン運用では「入力欄をタップ→OSのキーボード」も嫌われる(画面が半分隠れてスクロールが出る)ため、
     画面内のテンキーで完結させる。 */
var bpIn={sys:'',dia:'',pulse:''}, bpField='sys';
function bpBoxHtml(f,label){
  var v=bpIn[f]||'';
  return '<div class="bp-box'+(bpField===f?' on':'')+'" onclick="bpSel(\''+f+'\')"><label>'+label+'</label>'
    +'<div class="v">'+(v||'―')+'</div></div>';

function bpForm(){

function bpRender(){
  var keys='';
  for(var n=1;n<=9;n++) keys+='<button onclick="bpKey('+n+')">'+n+'</button>';
  keys+='<button class="act" onclick="bpDel()">⌫ 消す</button>'
     +'<button onclick="bpKey(0)">0</button>'
     +'<button class="act" onclick="bpNextField()">つぎへ →</button>';
  $('mbody').innerHTML='<div class="q q-bp">血圧を 入れてください</div>'
    +'<div class="bp-row">'+bpBoxHtml('sys','上（最高）')+bpBoxHtml('dia','下（最低）')+bpBoxHtml('pulse','脈拍（任意）')+'</div>'
    +'<div class="kp">'+keys+'</div>'
    +'<button class="btn-go btn-bp" onclick="takeBP()">この血圧で 記録する</button>'
    +'<button class="btn-go btn-sub btn-bp-sub" onclick="submitHealth()">血圧なしで 記録する</button>';

function bpSel(f){ bumpIdle(); bpField=f; bpRender(); }
function bpKey(n){
  bumpIdle();
  var cur=bpIn[bpField]||'';
  if(cur.length>=3) return;                       // 3桁まで(血圧・脈拍とも3桁で足りる)
  bpIn[bpField]=cur+String(n);
  // 3桁そろったら次の欄へ自動で移る(2桁で終わる人は「つぎへ」か欄を直接タップ)
  if(bpIn[bpField].length>=3) bpNextFieldSilent();

}
function bpDel(){ bumpIdle(); var c=bpIn[bpField]||''; bpIn[bpField]=c.slice(0,-1); bpRender(); }
function bpNextFieldSilent(){ bpField = bpField==='sys' ? 'dia' : (bpField==='dia' ? 'pulse' : 'pulse'); }
function bpNextField(){ bumpIdle(); bpNextFieldSilent(); bpRender(); }
function takeBP(){

/* ===== ①-2 出発前の確認（通達・連絡・未読メッセージ）=====
   体調チェックの直後に必ず挟む。葵が1件ずつ読み上げ、タップで次へ。
   確認するものが何も無い日は素通りする(毎日の余計なタップを増やさない)。 */
var _brf=null, _brfPages=[], _brfIdx=0, _brfDone=null, _brfLabel='📋 出発前の 確認', _brfSay='出発の 前に', _brfNoBrief=false, _brfHasAck=false;
async function briefingStep(onDone, label, say, noBrief){
  _brfDone = onDone || function(){};
  _brfLabel = label || '📋 出発前の 確認';
  _brfSay = say || '出発の 前に';
  _brfNoBrief = !!noBrief;
  var j = await api('/api/tenko/briefing');
  if(!j || !j.success){ _brfDone(); return; }
  _brf = j; _brfIdx = 0; _brfPages = brfBuildPages(j);
  if(!_brfPages.length){ _brfDone(); return; }
  // 要確認(requires_ack)の通達が含まれる時は、確認し切るまで「戻る」を消してゲート化する。
  _brfHasAck = _brfPages.some(function(p){ return p.ack; });
  try{ logUsage('briefing:shown:'+((_brf.notices||[]).length)+(_brfHasAck?':ack':'')); }catch(e){}
  aoiSetClip('talk');
  brfShow();
}
function brfBuildPages(j){
  var p = [];
  // 「今日の連絡・安全一言」は朝の伝達事項。帰庫時(_brfNoBrief)は繰り返さない。
  if(j.brief && !_brfNoBrief){
    p.push({ h:'<div class="q" style="font-size:26px;color:#b45309">📢 きょうの 連絡</div>'+
                '<div class="q" style="font-size:28px;white-space:pre-wrap;text-align:left">'+esc(j.brief)+'</div>',
             say:'きょうの 連絡です。'+j.brief });
  }
  (j.notices||[]).forEach(function(n){
    var lv = n.level==='urgent' ? '🚨 緊急の 通達' : (n.level==='important' ? '⚠️ 大事な 通達' : '📣 通達');
    var sayLv = n.level==='urgent' ? '緊急の 通達です。' : (n.level==='important' ? '大事な 通達です。' : '通達です。');
    p.push({ h:'<div class="q" style="font-size:24px;color:'+(n.level==='urgent'?'#b91c1c':'#b45309')+'">'+lv+(n.requires_ack?'（要確認）':'')+'</div>'+
                '<div class="q" style="font-size:30px">'+esc(n.title)+'</div>'+
                '<div class="q" style="font-size:26px;white-space:pre-wrap;text-align:left">'+esc(n.body)+'</div>'+
                (n.attachments ? '<div class="small">※ 添付ファイルが '+n.attachments+'件 あります。あとで スマホや パソコンの 「通達」から ご確認ください。</div>' : ''),
             ack: !!n.requires_ack,
             say: sayLv + n.title + '。' + String(n.body||'').slice(0,400) });
  });
  var msgs = (j.dm_unread||0) + (j.group_unread||0);
  if(msgs){
    p.push({ h:'<div class="q" style="font-size:28px;color:#1d4ed8">💬 未読の メッセージが '+msgs+'件 あります</div>'+
                '<div class="small">メニューの「メッセージ」から ご確認ください。</div>',
             say:'未読の メッセージが '+msgs+'件 あります。'+_brfSay+' ご確認ください。' });
  }
  return p;
}
function brfShow(){
  bumpIdle();
  brfLock(_brfHasAck);   // 要確認がある間は「戻る」を消して、確認を必須化(点呼完了ゲート)
  var pg = _brfPages[_brfIdx];
  var last = (_brfIdx >= _brfPages.length-1);
  var pos = _brfPages.length>1 ? '<div class="small">'+(_brfIdx+1)+'／'+_brfPages.length+'</div>' : '';
  var gate = _brfHasAck ? '<div class="small" style="color:#b91c1c">※ かならず 最後まで 確認してください</div>' : '';
  $('mbody').innerHTML =
    '<div class="q" style="font-size:22px;color:#0f766e">'+_brfLabel+'</div>'+pos+pg.h+gate+
    '<button class="btn-go" onclick="'+(last?'brfFinish()':'brfNext()')+'">'+(last?'確認しました':'次へ ›')+'</button>'+
    '<button class="btn-go btn-sub" onclick="brfSpeak()">🔊 もう一度 聴く</button>';
  speak(pg.say);
}
// 出発前確認のゲート制御: on=trueで上部の「← 戻る」を消す(逃げ道を塞ぐ)、falseで戻す。
function brfLock(on){ try{ var b=document.querySelector('.btn-close'); if(b) b.style.display = on ? 'none' : ''; }catch(e){} }
function brfNext(){ _brfIdx++; brfShow(); }
function brfSpeak(){ bumpIdle(); var pg=_brfPages[_brfIdx]; if(pg) speak(pg.say); }
async function brfFinish(){
  bumpIdle();
  brfLock(false);   // ゲート解除(「← 戻る」を戻す)
  var ids = ((_brf && _brf.notices) || []).map(function(n){ return n.id; });
  if(ids.length){ await api('/api/tenko/briefing/confirm',{method:'POST',json:{ ids:ids }}); try{ logUsage('briefing:confirmed:'+ids.length); }catch(e){} }

}

// AIのまとめ(全社員向けの ai_brief=5W1H+原因の本質+対策+歯止め)を優先。無ければ管理職向け ai_review。
// ⭐2026-08-01 (社長): 5W1H の箇条書きは読みにくいので、ひとつづきの文章に直して見せる。
//   新しい報告はプロンプト側で最初から文章になるが、過去分は箇条書きのまま保存されているためここで整形する。
// 読み上げ用の整形: あいさつ・名乗り・見出し記号・箇条書き記号を落とす (2026-08-01)
function speechClean(t){
  return String(t||'')

function briefToProse(t){
  if(!t || t.indexOf('【5W1H】')<0) return t;
  var KEYS={'いつ':'when','どこで':'where','だれが':'who','誰が':'who','なにが起きた':'what','何が起きた':'what','なぜ':'why','どうなった':'result'};
  var lines=String(t).split(/\r?\n/), out=[], v={}, inBlock=false, got=false;
  function flush(){
    if(!got) return;
    var s1=[];
    if(v.when)  s1.push(v.when);
    if(v.where) s1.push(v.where + (/[でにへ]$/.test(v.where)?'':'で'));
    if(v.who)   s1.push(v.who + (/[がはも]$/.test(v.who)?'':'が'));
    var head=s1.join('、');
    var body=[];
    if(head||v.what) body.push((head?head+(v.who?'':'、'):'') + (v.what||'') + '。');
    if(v.why)    body.push('原因は、' + v.why + '。');
    if(v.result) body.push('その結果、' + v.result + '。');
    out.push(body.join('').replace(/。。/g,'。'));
    v={}; got=false;
  }
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.indexOf('【5W1H】')>=0){ inBlock=true; out.push('【できごと】'); continue; }
    if(inBlock){
      var m=l.match(/^\s*[・\-]?\s*([^：:]{2,8})\s*[：:]\s*(.*)$/);
      if(m && KEYS[m[1].trim()]){ var val=String(m[2]||'').trim().replace(/[。\.]+$/,''); if(val){ v[KEYS[m[1].trim()]]=val; got=true; } continue; }
      if(l.trim()===''){ continue; }
      inBlock=false; flush();
    }
    out.push(l);
  }
  flush();
  return out.join('\n');
}

function archiveYear(r){

/* ===== AIヘルスアドバイザー(ショートカット女性)の解説モーダル: 詳細ページ plaza.html から移植 =====

var ADV_MEAL={breakfast:'朝食',lunch:'昼食',dinner:'夕食',snack:'おやつ',morning:'朝食',noon:'昼食',night:'夕食'};
function _advCleanSpeech(s){ return String(s||'').replace(/【([^】]*)】/g,'$1').replace(/[←-⇿⌀-➿■-◿⬀-⯿️\u{1F000}-\u{1FAFF}]/gu,'').replace(/\s+/g,' ').trim(); }
function _advSentences(s,n){ s=_advCleanSpeech(s); if(!s)return ''; var arr=s.match(/[\s\S]*?[。！？!?]/g); if(!arr)return s; return arr.slice(0,n).join('').trim(); }
function foodVoiceScript(text){
  var src=String(text||''), map={}, re=/【([^】]+)】([\s\S]*?)(?=【[^】]+】|$)/g, m;
  while((m=re.exec(src))!==null){ map[m[1].trim().replace(/[!！]+$/,'!')]=m[2].trim(); }
  var good=map['良い点']?_advSentences(map['良い点'],2):'';
  var concern=(map['改善点']||map['悪い点'])?_advSentences(map['改善点']||map['悪い点'],2):'';
  var action=map['やってみよう!']?_advSentences(map['やってみよう!'],2):'';
  var body;
  if(good||concern||action){ var chunks=[]; if(good)chunks.push(good); if(concern)chunks.push('いっぽうで、'+concern); if(action)chunks.push('そこで、'+action); body=chunks.join(' '); }
  else { body=_advSentences(src,3); }
  if(!body) return '';
  return body.length>400 ? body.slice(0,398)+'…' : body;
}

  //   バックグラウンド復帰などで再生が止まったまま戻らないことがある。解説中(vid-on)なら必ず再開させる。
  var kick=function(){ var w=$('adv-av-wrap'); if(!w||!w.classList.contains('vid-on'))return;
    try{ if(vid.ended){ vid.currentTime=0; } var q=vid.play(); if(q&&q.catch)q.catch(function(){}); }catch(e){} };

// ⚠️2026-08-01 真因: 前置き→本文の切替時に _advVidStart が再度呼ばれ、再生中の動画に currentTime=0 と
//   play() を重ねていた。この play() は 'interrupted' で reject することがあり、その catch で vid-on を
//   外していたため、解説の途中で静止画に戻っていた(=「動画が止まる」)。
//   → 再生中は巻き戻さない / reject では隠さず少し待って再試行する。

   経緯: 事務所は拠点グループ(例「スタンダード運輸 海老名」)に連絡を流していたが、かんたんモードは
   DM(1対1)しか見られず、**グループの連絡は現場に1件も届いていなかった**。💬メッセージの中と、
   ランディングの「通達・連絡」タブの両方から入れるようにする。
   ⚠️未読件数は多い人で200件超(スズエの工場グループ等)。バッジ(横メニューの💬の数字)には足さない
     =ほぼ全員が点灯して数字が意味を失うため([[帰る前シートと同じ判断]])。掲示は「タイル1枚＋件数」まで。 */
function groupUnreadMap(u){ var m={}; ((u&&u.groups)||[]).forEach(function(x){ m[String(x.group_id)]=x.unread||0; }); return m; }
async function loadGroups(){
  var gl=await api('/api/chat/groups');
  var gu=await api('/api/chat/unread');
  var um=groupUnreadMap(gu);
  _boardGroups=((gl&&gl.groups)||[])
    .filter(function(g){ return !g.is_hidden; })    // 本人が自分の一覧で隠したグループは出さない
    .map(function(g){ g._unread=um[String(g.id)]||0; return g; })
    .sort(function(a,b){ return (b._unread-a._unread) || String(b.last_at||'').localeCompare(String(a.last_at||'')); });
  return _boardGroups;
}

/* ✉️ 新しく送る = 宛先の候補は【自分が入っているグループのメンバーだけ】(2026-08-05 社長)。
   ⚠️以前は全社名簿(/api/auth/tablet-roster 約150名)から誰にでも送れた。面識のない他拠点の社員まで
     選べてしまい、共用タブレットでは誤送信・いたずらの余地が大きい。グループ＝実際に一緒に働く範囲。
   ⚠️これはタブレット(かんたんモード)の絞り込み。サーバー側のDM可否(上下関係のブロック等)は従来どおり。 */
var ND_GROUPS=[], ND_USERS=[];
async function openNewDm(){
  aoiSetClip('talk'); curPeer=null;
  openModal('✉️ 新しく 送る','<div class="empty">読み込み中…</div>');
  var myUid=ME&&ME.uid;
  var gs=await loadGroups();
  var lists=await Promise.all(gs.map(function(g){ return api('/api/chat/groups/'+encodeURIComponent(g.id)+'/members'); }));
  var seen={};
  ND_GROUPS=[]; ND_USERS=[];
  gs.forEach(function(g,idx){
    var ms=((lists[idx]&&lists[idx].members)||[]).filter(function(u){ return u.id!==myUid; });
    if(!ms.length) return;
    ND_GROUPS.push({id:String(g.id), name:g.name||'グループ'});
    ms.forEach(function(u){
      if(seen[u.id]){ seen[u.id].gids.push(String(g.id)); return; }          // 複数グループに居る人は1回だけ出す
      seen[u.id]={id:u.id, display_name:u.display_name, avatar_url:u.avatar_url, gids:[String(g.id)], gname:g.name||''};
      ND_USERS.push(seen[u.id]);
    });
  });
  if(!ND_USERS.length){
    $('mbody').innerHTML='<div class="empty">送れる相手が いません。<br>グループに 入ってから お使いください。</div>';
    speak('送れる相手が いません。'); return;
  }
  var sel='<select id="ndco" onchange="renderNewDm()" style="width:100%;font-size:20px;padding:12px;border:2px solid #cfe0ee;border-radius:14px;margin-bottom:10px;font-weight:700"><option value="">すべてのグループ</option>';
  ND_GROUPS.forEach(function(g){ sel+='<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>'; });
  sel+='</select>';
  $('mbody').innerHTML=(ND_GROUPS.length>1?sel:'')+'<div id="ndlist"></div>';
  renderNewDm();
  speak('送りたい 相手を 選んで タッチしてください。');
}
function renderNewDm(){
  var gid=($('ndco')&&$('ndco').value)||'';
  var us=ND_USERS.filter(function(u){ return !gid || u.gids.indexOf(gid)>=0; });
  us.sort(function(a,b){ return String(a.display_name||'').localeCompare(String(b.display_name||''),'ja'); });
  var gname={}; ND_GROUPS.forEach(function(g){ gname[g.id]=g.name; });
  var html=us.map(function(u){
    var av=u.avatar_url?('<img src="'+esc(u.avatar_url)+'" style="width:40px;height:40px;border-radius:50%;object-fit:cover;flex:0 0 auto">'):'<span style="font-size:30px">👤</span>';
    var sub=u.gids.map(function(x){ return gname[x]||''; }).filter(Boolean).join('・');

// スレッド表示＋既読処理＋返信
async function loadThread(peerId, quiet){

    '<button class="btn-close" style="margin-top:10px" onclick="openMsg()">← 一覧に 戻る</button>';
  _lastThreadText = msgs.slice(-3).filter(function(m){ return String(m.sender_id)!==String(mine); })
                        .map(function(m){ return String(m.content||''); }).join('。 ');
  if(readIds.length){ api('/api/chat/read',{method:'POST',json:{message_ids:readIds}}); refreshBadges(); }

/* ⚠️メッセージの読み上げは【本人がボタンを押したときだけ】。共用タブレットで自動再生すると

function sendDm(){

/* ===== 🚚 帰庫点呼 / 🏠 帰る前のチェック (乗務後・退勤前の自己申告) 2026-07-09, 職種展開 2026-07-27 =====
   ⚠️「点呼」は貨物事業法の法定用語。ドライバー以外には使わず「帰る前の チェック」と呼ぶ。
   共通= つかれ / からだ (ふだん=5) ＋ ひとこと。職種ごとに固有の2〜3問を足す。

   固有回答は extra_json で保存(サーバー側)。つかれ/からだは全職種同じ列＝KPI・平常値・エスカレを共通化。 */
var kikoAns={alcohol_detected:null, operation_issue:null, hiyari:null, wait:null, fatigue:null, body:null,
             pain:null, symptom:null, overtime:null, eye:null, mind:null};
function kikoKind(){

function kikoTitle(kind){ return kind==='driver' ? '🚚 帰庫（帰社）点呼' : '🏠 帰る前の チェック'; }
/* ===== 帰庫点呼 / 帰る前のチェック: 1問1画面 (2026-08-06 社長指示) =====
   ⭐共用タブレットは衛生のためタッチペンを使っている。従来の「全項目を1枚に積んだ縦長フォーム」は
     ペンでのスクロールが非常につらいという声があり、**朝の体調チェックと同じ1問1画面**に統一した。
   ⚠️送信内容(APIのbody)は従来と1対1で同じ。項目も順番も変えていない。
   ⚠️メモ欄は画面を描き替えると消えるので、DOMではなく kikoNotes に持つ(submitKikoもここから読む)。

var kikoSteps=[], kikoIdx=0, kikoDir=1, kikoNotes={};

function kikoEquipLabel(kind){
  return kind==='driver' ? '🚗 運行の状況（車両・道路）'

// 職種ごとの質問の並び。t=choice(選ぶ)/scale(0〜10)/note(自由記入)/news(お知らせ)/confirm(確認して送信)
function kikoBuildSteps(kind){
  var equip=[
    {t:'choice',key:'operation_issue',q:kikoEquipLabel(kind),opts:[['✅ 異常なし',0,'yes'],['⚠️ 異常あり',1,'no']]},
    {t:'note',nk:'op',q:'⚠️ 異常の 内容',ph:'異常の内容',showIf:function(){return kikoAns.operation_issue===1;}}];
  var hiyari=[
    {t:'choice',key:'hiyari',q:'😨 ヒヤリハット（今日 ヒヤッと したこと）',opts:[['なかった',0,'yes'],['あった',1,'']]},
    {t:'note',nk:'hiya',q:'😨 どんな 場面でしたか',ph:'どんな場面でしたか',showIf:function(){return kikoAns.hiyari===1;}}];
  var S=[];
  if(kind==='driver'){
    S.push({t:'choice',key:'alcohol_detected',q:'🍺 アルコールチェック（検知器で測定）',opts:[['🟢 検知なし',0,'yes'],['🔴 検知あり',1,'no']]});
    S=S.concat(equip, hiyari);
    S.push({t:'choice',key:'wait',q:'⏱ 今日の 荷待ち・荷役の 時間',opts:[['なし・30分未満','none','yes'],['30分〜1時間','lt60',''],['1時間以上','gt60','no']]});
    S.push({t:'note',nk:'wait',q:'⏱ 荷主・現場の 名前',ph:'荷主・現場の名前',showIf:function(){return kikoAns.wait&&kikoAns.wait!=='none';}});
  } else if(kind==='warehouse'){
    S.push({t:'choice',key:'pain',q:'💪 腰・肩・ひざの 痛み',opts:[['なし','none','yes'],['少しある','mild',''],['つらい','hard','no']]});
    S.push({t:'note',nk:'pain',q:'💪 どこが 痛みますか',ph:'どこが痛みますか',showIf:function(){return kikoAns.pain&&kikoAns.pain!=='none';}});
    S=S.concat(hiyari, equip);
  } else if(kind==='manufacturing'){
    S.push({t:'choice',key:'symptom',q:'😵 作業中の 体調の 異変',opts:[['なかった','none','yes'],['めまい・頭痛','dizzy','no'],['目や のどの 刺激','irritation','no']]});
    S.push({t:'note',nk:'sym',q:'😵 どんな 作業のときでしたか',ph:'どんな作業のときでしたか',showIf:function(){return kikoAns.symptom&&kikoAns.symptom!=='none';}});
    S=S.concat(hiyari, equip);
  } else {
    S.push({t:'choice',key:'overtime',q:'⏰ 今日の 時間外',opts:[['なし','none','yes'],['1時間ほど','lt1',''],['2時間以上','gt2','no']]});
    S.push({t:'choice',key:'eye',q:'👀 目・肩・腰の 疲れ',opts:[['なし','none','yes'],['少し','mild',''],['つらい','hard','no']]});
    S.push({t:'scale',key:'mind',q:'🫧 こころの 調子（任意）',lead:'普段の気持ちを5として、今はいくつですか？',optional:true});
  }
  S.push({t:'scale',key:'fatigue',q:'😫 現在の疲労度',lead:'普段の疲れを5として、現在はいくつですか？'});
  S.push({t:'scale',key:'body',q:'🩹 現在の体調',lead:'普段の体調を5として、現在はいくつですか？'});
  S.push({t:'note',nk:'note',q:'💬 ひとこと（任意）',ph:'伝えたいこと・気になった点',optional:true});
  S.push({t:'news',q:'📢 管理者からの お知らせ'});
  S.push({t:'confirm'});
  return S;
}
// 条件付きの質問(異常の内容など)を除いた「実際に出る質問」
function kikoVisibleSteps(){ return kikoSteps.filter(function(s){ return !s.showIf || s.showIf(); }); }
function kikoAnsText(s){
  if(s.t==='scale') return (kikoAns[s.key]==null?'—':String(kikoAns[s.key]));
  if(s.t==='note') return (kikoNotes[s.nk]||'').slice(0,18) || '—';
  if(s.t==='choice'){
    for(var i=0;i<s.opts.length;i++) if(kikoAns[s.key]===s.opts[i][1]) return s.opts[i][0];
    return '—';
  }

}
function kikoNav(s){

  var right = (s.t==='scale'&&s.optional) ? '<button class="btn-nav" onclick="kikoSkip()">とばす →</button>' : '<span></span>';
  return '<div class="step-nav">'+left+right+'</div>';
}
function kikoRender(){
  bumpIdle();
  var s=kikoSteps[kikoIdx];
  if(!s) return;
  if(s.showIf && !s.showIf()){                       // 条件に合わない質問は飛ばす(進む/戻る どちらの向きでも)
    kikoIdx += kikoDir;
    if(kikoIdx<0){ kikoIdx=0; kikoDir=1; }
    if(kikoIdx>=kikoSteps.length){ kikoIdx=kikoSteps.length-1; kikoDir=-1; }
    return kikoRender();
  }
  var vis=kikoVisibleSteps(), pos=vis.indexOf(s)+1, tot=vis.length;
  var h='<div class="step-prog">'+pos+'／'+tot+'</div>';
  if(s.t==='choice'){
    h+='<div class="q">'+s.q+'</div><div class="opts">'
      + s.opts.map(function(o,i){
          return '<button class="opt '+(o[2]||'')+(kikoAns[s.key]===o[1]?' sel':'')+'" onclick="kikoAnswer('+i+')">'+esc(o[0])+'</button>';
        }).join('') + '</div>';
  } else if(s.t==='scale'){
    var b='';
    for(var n=0;n<=10;n++){ b+='<button class="fat-btn'+(kikoAns[s.key]===n?' sel':'')+'" style="'+fatColor(n)+'" onclick="fatPick(\''+s.key+'\','+n+')">'+n+'</button>'; }
    h+='<div class="q">'+s.q+'</div><div class="fat-lead-s">'+s.lead+'</div><div class="fat-grid">'+b+'</div>'
      +'<div class="fat-ends"><span>0 = 大丈夫</span><span>5 = 普段通り</span><span>10 = 限界</span></div>';
  } else if(s.t==='note'){
    h+='<div class="q">'+s.q+'</div>'
      +'<textarea id="kiko-note-in" class="big-in" placeholder="'+esc(s.ph||'')+'">'+esc(kikoNotes[s.nk]||'')+'</textarea>'
      +'<button class="btn-go" onclick="kikoNoteNext()">'+(s.optional?'次へ（入力しなくても だいじょうぶ）':'次へ')+'</button>';
  } else if(s.t==='news'){
    h+='<div class="q">'+s.q+'</div><div id="kiko-news" style="text-align:left">読み込み中…</div>'
      +'<button class="btn-go" onclick="kikoNext()">読みました。次へ</button>';
  } else if(s.t==='confirm'){
    var rows=vis.filter(function(x){ return x.t==='choice'||x.t==='scale'||x.t==='note'; }).map(function(x){
      return '<div class="sum-row"><span class="sl">'+x.q+'</span><span class="sv">'+esc(kikoAnsText(x))+'</span>'
        +'<button class="sf" onclick="kikoGoto('+kikoSteps.indexOf(x)+')">直す</button></div>';
    }).join('');
    h+='<div class="q q-sm">この内容で よろしいですか？</div><div class="sum-list">'+rows+'</div>'
      +'<button class="btn-go btn-send" onclick="submitKiko()">'+(kikoKind()==='driver'?'帰庫（帰社）点呼を 送信する':'送信する')+'</button>';
  }
  $('mbody').innerHTML = h + kikoNav(s);
  if(s.t==='news') loadKikoNews().then(function(txt){ if(txt) speakKikoNotice(); });
}
// 現在の質問を葵が読む。⚠️選択への反応セリフと重ならないよう、反応があるときはその後に読む。
function kikoSpeakStep(){
  var s=kikoSteps[kikoIdx]; if(!s) return;
  if(s.t==='choice'||s.t==='note'){ speak(s.q.replace(/^[^ぁ-んァ-ヶ一-龠0-9A-Za-z]+/,'')); }
  else if(s.t==='scale'){
    var line=s.q.replace(/^[^ぁ-んァ-ヶ一-龠0-9A-Za-z]+/,'')+'。'+s.lead;
    // 「5=いつも通り」の長い説明は週1回だけ(毎回だと くどい)
    if(s.key==='fatigue'&&shouldSpeakScale()) line+='　いつも通りなら5、楽なら5より下、つらい時は5より上の数字を選んでください。';
    speak(line);
  } else if(s.t==='confirm'){ speak('最後に 内容を 確認してください。よろしければ 送信を 押してください。'); }
}
function kikoNext(){ kikoDir=1; kikoIdx++; if(kikoIdx>=kikoSteps.length) kikoIdx=kikoSteps.length-1; kikoRender(); kikoSpeakStep(); }
function kikoBack(){ kikoSaveNote(); kikoDir=-1; kikoIdx--; if(kikoIdx<0) kikoIdx=0; kikoRender(); kikoSpeakStep(); }
function kikoGoto(i){ kikoSaveNote(); kikoDir=1; kikoIdx=i; kikoRender(); kikoSpeakStep(); }
function kikoSkip(){ kikoNext(); }
function kikoSaveNote(){
  var s=kikoSteps[kikoIdx], el=$('kiko-note-in');
  if(s && s.t==='note' && el) kikoNotes[s.nk]=el.value||'';
}
function kikoNoteNext(){ kikoSaveNote(); kikoNext(); }
// 選択肢を選んだ: 記録 → 葵が反応 → 次の質問(反応が終わってから読む)
function kikoAnswer(i){
  var s=kikoSteps[kikoIdx]; if(!s||s.t!=='choice') return;
  bumpIdle();
  var val=s.opts[i][1];
  kikoAns[s.key]=val;
  var r=kikoReactLine(s.key,val);
  kikoDir=1; kikoIdx++; kikoRender();
  if(r){ aoiSetClip(r.clip); speak(r.line, kikoSpeakStep); }
  else kikoSpeakStep();
}
async function openKiko(){
  var kind=kikoKind();
  logUsage(kind==='driver'?'open:帰庫点呼':'open:帰る前のチェック'); aoiSetClip('greet');
  kikoAns={alcohol_detected:null, operation_issue:null, hiyari:null, wait:null, fatigue:null, body:null,
           pain:null, symptom:null, overtime:null, eye:null, mind:null};
  kikoNotes={op:'',hiya:'',wait:'',pain:'',sym:'',note:''};
  kikoSteps=kikoBuildSteps(kind); kikoIdx=0; kikoDir=1;
  openModal(kikoTitle(kind), '<div class="empty">読み込み中…</div>');
  kikoRender();
  if(kind==='driver') await loadMyAlerts();   // 当日の運転アラート(本人分)を先読み。ドライバーのみ
  else _myAlerts=[];
  var greet = kind==='driver'
    ? 'お疲れさまでした。帰庫点呼を行います。ひとつずつ お聞きしますので、大きなボタンを 押してください。'
    : 'お疲れさまでした。帰る前の チェックです。ひとつずつ お聞きしますので、大きなボタンを 押してください。';
  // 声が重ならないよう順番に: 挨拶 → (当日 運転アラート) → 最初の質問
  speak(greet, function(){ speakMyAlert(kikoSpeakStep); });
}
// スケール説明の頻度: 今週(〜2026-07-19)は毎回、来週からは各ドライバー週1回(その週の初回)だけ。
function scaleWeekStart(d){ var day=(d.getDay()+6)%7; var m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);
  return m.getFullYear()+'-'+('0'+(m.getMonth()+1)).slice(-2)+'-'+('0'+m.getDate()).slice(-2); }
function shouldSpeakScale(){
  var now=new Date();
  var today=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2);
  if(today<='2026-07-19') return true;   // 今週は毎日
  try{ var uid=(ME&&ME.id)||'x'; var key='kikoScaleWk_'+uid; var wk=scaleWeekStart(now);
       if(localStorage.getItem(key)===wk) return false;   // 今週分は既読
       localStorage.setItem(key,wk); return true;
  }catch(e){ return true; }
}
var _myAlerts=[];
// 当日の運転アラート(本人分)を取得。managerでなくても本人分のみ返る専用API。
async function loadMyAlerts(){
  _myAlerts=[];
  try{ var d=await api('/api/alert/mine'); if(d&&d.alerts) _myAlerts=d.alerts; }catch(e){}
  return _myAlerts;
}
// 帰庫当日に運転アラートがあった対象ドライバーへ、葵が やさしく一言 触れる(叱責でなく安全への気づかい)。
function speakMyAlert(done){
  done=done||function(){};
  if(!_myAlerts||!_myAlerts.length){ done(); return; }
  var n=_myAlerts.length;
  var line='ところで、今日は 運転の 注意アラートが '+n+'件 ありました。'
    +'長時間の 運転で お疲れの ことと 思います。次の 乗務も、車間と スピードに 気をつけて、安全運転で お願いしますね。';
  aoiSetClip('caution'); speak(line, done);
}
// 0〜10スケール(つかれ/からだ)。5=いつも通り、10=げんかい。5以下=平常(緑)→上振れで黄→橙→赤。
function fatColor(n){
  if(n<=5) return 'background:#dcfce7;border-color:#86efac;color:#065f46';
  if(n<=7) return 'background:#fef9c3;border-color:#fde047;color:#854d0e';
  if(n<=8) return 'background:#ffedd5;border-color:#fdba74;color:#9a3412';
  return 'background:#fee2e2;border-color:#fca5a5;color:#991b1b';
}
// 数字タップは音声反応なし(0〜11回喋ると うるさいため)。押したら次の質問へ自動で進む。
function fatPick(key,n){
  bumpIdle(); kikoAns[key]=n;
  kikoNext();
}
// 帰庫点呼の各選択への葵の反応。{clip,line} を返し、呼び出し側が喋る(喋り終わってから次の質問を読むため)。
function kikoReactLine(key,val){
  var clip='talk', line='';
  if(key==='alcohol_detected'){
    if(val){ clip='caution'; line='アルコールが検出されました。運転はできません。直ちに管理者へお知らせします。'; }
    else { clip='praise'; line='アルコールは検知なし。安心しました。'; }
  } else if(key==='operation_issue'){
    // ラベルは職種で違う(運行の状況 / 設備・荷 / 設備・製品)ので、セリフも合わせる
    var ek=kikoKind();
    if(val){ clip='concern'; line=(ek==='driver'?'運行で異常があったのですね。':'異常が あったのですね。')+'つぎの 画面で 内容を 入力して ください。'; }
    else { clip='thanks'; line=(ek==='driver'?'運行も問題なし。':'異常なし、ですね。')+'本日もお疲れさまでした。'; }
  } else if(key==='pain'){
    if(val==='hard'){ clip='concern'; line='つらい痛みですね。無理を なさらないでください。管理者にも お伝えします。'; }
    else if(val==='mild'){ clip='listen'; line='痛みが 出ているのですね。今夜は 温めて、ゆっくり 休んでください。'; }
    else { return null; }
  } else if(key==='symptom'){
    if(val==='none'){ return null; }
    clip='concern'; line='体調に 変わりが あったのですね。管理者に お伝えします。無理を なさらないでください。';
  } else if(key==='overtime'){
    if(val==='gt2'){ clip='listen'; line='今日は 長い時間でしたね。おつかれさまでした。'; }
    else { return null; }
  } else if(key==='eye'){
    if(val==='hard'){ clip='listen'; line='目や 肩が つらいときは、少し 目を 休めて、肩を 回してみてください。'; }
    else { return null; }
  } else if(key==='hiyari'){
    // ⚠️ヒヤリハットは「言ってくれてありがとう」で受ける。責める言い方は絶対にしない(報告が止まる)。
    if(val){ clip='listen'; line='教えてくださって ありがとうございます。つぎの 画面で、どんな場面だったか お願いします。'; }
    else { return null; }   // 「なかった」は淡々と(反応なし=喋りすぎ防止)
  } else if(key==='wait'){
    if(val==='gt60'){ clip='concern'; line='1時間以上の 荷待ちでしたか。おつかれさまでした。記録しておきます。'; }
    else if(val==='lt60'){ clip='listen'; line='荷待ちの時間、記録しておきます。'; }
    else { return null; }
  } else { return null; }
  return { clip: clip, line: line };
}
var _kikoNotice='';
// 管理者が入力した帰庫点呼のお知らせ(専用テキスト)を取得して表示。読み上げ文を返す。
async function loadKikoNews(){
  var box=$('kiko-news'); if(!box) return '';
  var txt='';
  try{ var d=await api('/api/tenko/kiko/notice'); txt=(d&&d.notice)?String(d.notice).trim():''; }catch(e){}
  _kikoNotice=txt;
  if(!txt){ box.innerHTML='<div style="color:#94a3b8;font-size:16px">本日のお知らせはありません。</div>'; return ''; }
  box.innerHTML='<div style="white-space:pre-wrap;font-size:18px;line-height:1.6;background:#fffdf3;border:1px solid #fde68a;border-radius:12px;padding:12px">'+esc(txt)+'</div>'
    +'<button class="btn-go btn-sub" style="margin-top:10px" onclick="speakKikoNotice()">🔊 もう一度聴く</button>';
  return txt;
}
// 葵が管理者からのお知らせを読み上げる(文章を読まない社員向け)
function speakKikoNotice(){ if(_kikoNotice){ bumpIdle(); aoiSetClip('talk'); speak('管理者からのお知らせです。'+_kikoNotice); } }
async function submitKiko(){
  bumpIdle();
  kikoSaveNote();                      // 確認画面の直前がメモ欄でも取りこぼさない
  var kind=kikoKind(), v=kikoNotes.note||'';
  // 職種ごとの必須チェック(こころの調子だけ任意=とばせる)
  if(kind==='driver'){
    if(kikoAns.alcohol_detected===null){ speak('アルコールの結果を選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('運行状況を選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.wait===null){ speak('荷待ち・荷役の 時間を 選択してください。'); return; }
  } else if(kind==='warehouse'){
    if(kikoAns.pain===null){ speak('腰や 肩の 痛みを 選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('設備や 荷の 異常を 選択してください。'); return; }
  } else if(kind==='manufacturing'){
    if(kikoAns.symptom===null){ speak('作業中の 体調の 異変を 選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('設備や 製品の 異常を 選択してください。'); return; }
  } else {
    if(kikoAns.overtime===null){ speak('今日の 時間外を 選択してください。'); return; }
    if(kikoAns.eye===null){ speak('目や 肩の 疲れを 選択してください。'); return; }
  }
  if(kikoAns.fatigue===null){ speak('疲労度を数字で選択してください。'); return; }
  if(kikoAns.body===null){ speak('体調を数字で選択してください。'); return; }
  // ⚠️アルコールチェックはドライバーのみ。他職種は alcohol_used=0 で送り、一覧では「—」と出す
  //   (0を送ると「検知なし＝測った」と誤読されるため)。
  var body={ alcohol_used:(kind==='driver'?1:0), alcohol_detected:kikoAns.alcohol_detected?1:0, operation_issue:kikoAns.operation_issue?1:0,
    job_kind:kind, fatigue_score:kikoAns.fatigue, body_score:kikoAns.body,
    hiyari:kikoAns.hiyari?1:0, hiyari_note:(kikoAns.hiyari?(kikoNotes.hiya||''):''),
    wait_level:(kind==='driver'?kikoAns.wait:null), wait_note:((kind==='driver'&&kikoAns.wait!=='none')?(kikoNotes.wait||''):''),
    // 職種固有の回答(サーバーは extra_json にそのまま保存)
    pain:kikoAns.pain, pain_note:((kikoAns.pain&&kikoAns.pain!=='none')?(kikoNotes.pain||''):''),
    symptom:kikoAns.symptom, symptom_note:((kikoAns.symptom&&kikoAns.symptom!=='none')?(kikoNotes.sym||''):''),
    overtime:kikoAns.overtime, eye:kikoAns.eye, mind_score:kikoAns.mind,
    operation_note:(kikoNotes.op||''), note:v };
  var r=await api('/api/tenko/kiko',{method:'POST',json:body});
  if(r&&r.success){
    logUsage(kind==='driver'?'done:帰庫点呼':'done:帰る前のチェック');
    if(kikoAns.alcohol_detected||kikoAns.operation_issue){
      // 異常あり=管理者の指示が最優先。通達の確認は挟まない。
      doneScreen('送信しました','管理者に直ちに連絡しました。指示をお待ちください。','concern');
    } else {
      // 帰庫点呼も健康・運行の申告だけで終わらせず、未読の通達/連絡を確認してから終わる。
      briefingStep(function(){
        doneScreen('本日もお疲れさまでした',
          (r.aoi_comment||((kind==='driver'?'帰庫点呼':'帰る前の チェック')+'を記録しました。本日もお疲れさまでした。')),'thanks');
      }, '📋 帰る前の確認', '帰る前に', true);
    }
  } else { speak('送信に失敗しました。もう一度お試しください。'); }
}
// 帰庫時の ねぎらい＋健康ワンポイント(体調に合わせて葵が読み上げる)
function kikoHealthTip(fatigue){
  if(fatigue==='very_tired') return 'かなりお疲れのようです。今夜は早めに休んで、しっかり睡眠を取ってください。運行管理者にもお伝えしました。';
  if(fatigue==='tired') return '少しお疲れのようですね。ぬるめのお風呂で体をほぐし、水分も取りましょう。';
  var tips=['水分をコップ1杯取って、ひと息つきましょう。','首と肩をゆっくり回して、体をほぐしましょう。','今夜は少し早めに休んで、しっかり睡眠を取りましょう。','ゆっくり深呼吸を3回。疲れをリセットしましょう。','夕食は野菜からよく噛んで食べると体に優しいです。'];
  return tips[Math.floor(Math.random()*tips.length)];
}
function doneScreen(title, sub, emotion){
  aoiSetClip(emotion||'praise');
  var tail;
  if(IS_KIOSK){
    // 共用タブレット: 次の人のため、使い終わったら必ずログアウト。
    tail='<div class="q" style="font-size:24px;color:#b91c1c">使い終わったら 必ず<br>「ログアウト」を 押してください。</div>'+
      '<button class="btn-go" style="background:#dc2626;box-shadow:0 5px 0 #a41a1a" onclick="preLogout()">ログアウトする</button>'+
      '<button class="btn-go btn-sub" onclick="closeModal()">続ける（他もやる）</button>';
  } else {
    // 個人スマホ: 自分の端末なのでログアウト強制はしない。メニューに戻るだけ。
    tail='<button class="btn-go" onclick="closeModal()">メニューに 戻る</button>';
  }
  $('mbody').innerHTML='<div class="done-wrap"><div class="big">✅ '+esc(title)+'</div>'+
    '<div class="q" style="font-size:24px">'+esc(sub)+'</div>'+tail+'</div>';
  speak(title+' '+sub+(IS_KIOSK?' 使い終わったら、必ず ログアウトを 押してください。':''));
}

/* ===== 🚪 帰る前のワンクッション (2026-08-03 社長) =====
   体調チェックと帰る前の処理だけして、そのままログアウトする人がほとんど。通達・掲示板・メッセージに
   気づく機会が無い(⚠️プッシュ通知は160名中7名しか登録が無く鳴らない/現場の個人スマホ利用は4.5%)。
   → 共有タブレットは「最後の1タップ」が唯一の接点なので、ログアウトを押した時に未読があるときだけ1枚挟む。

   設計の約束ごと:
   - ⭐未読ゼロなら出さない(そのまま見送り)。毎回出すと「閉じる作業」になって形骸化する。
   - ⭐「あとで(このままログアウト)」は最初から押せる。強制しない=タブレットごと嫌われる。
   - ⚠️共有画面は周囲全員に見えるので、出すのは【種類と件数】まで。差出人・本文・件名は出さない。
   - ⚠️会社メールは対象外。**簡単版に会社メールは実装しない**(2026-08-05 社長)。メールを持つのは
     役員・事務だけで、その人たちはPC(詳しい表示)で見る。栄養レポート・健康管理室も同じく対象外。
   - ⚠️無操作オートログアウト(doLogout() = farewell なし)では絶対に出さない。無人の画面に件数が残るため。
     この1枚は【手動のログアウトボタン経由だけ】。開いたまま放置されても3分で通常どおり自動ログアウトする。 */
var _loBusy=false;
async function preLogout(){
  if(_loBusy) return;
  _loBusy=true;
  var r=null;
  try{ r=await loCollect(); }catch(e){ r=null; }
  _loBusy=false;
  // 取得できない/未読ゼロ = じゃまをせずそのままログアウト(ここで失敗してログアウトできない事故を作らない)
  if(!r || !r.total){ doLogout(true); return; }
  logUsage('open:帰る前のおしらせ');
  loShow(r);
}
// 未読の集計。⚠️notice_*(🔔おしらせ)は /api/chat/unread-count の dm にも含まれるので、メッセージ側から引いて二重に数えない。
//   グループチャットの未読は含めない=ほぼ全員点灯してバッジが無意味になるため(共有タブレットのバッジと同じ判断)。
async function loCollect(){
  var res=await Promise.all([
    api('/api/tenko/my-today'),
    api('/api/announcements/unread-count'),
    api('/api/chat/notices?limit=50'),
    api('/api/board/unread-count'),
    api('/api/chat/unread-count')
  ]);
  var t=res[0], an=res[1], nt=res[2], bd=res[3], uc=res[4];
  var o={health:false,news:0,notice:0,board:0,msg:0,total:0};
  o.health = !!(t && t.success && !t.done);
  o.news   = (an && (an.count!=null?an.count:an.unread)) || 0;
  if(nt && nt.success){ NOTICES = nt.items || []; }   // 🔔おしらせ本体も温めておく(「見る」で即開ける)
  o.notice = NOTICES.filter(function(x){ return x.unread; }).length;
  o.board  = (bd && bd.count) || 0;
  var dm   = (uc && (uc.dm!=null?uc.dm:uc.count)) || 0;
  o.msg    = Math.max(0, dm - o.notice);
  o.total  = (o.health?1:0) + o.news + o.notice + o.board + o.msg;
  return o;
}
function loRow(kind,ico,label,cnt,warn){
  return '<button type="button" class="lo-row'+(warn?' warn':'')+'" onclick="loGo(\''+kind+'\')">'
    +'<span class="ico">'+ico+'</span><span class="tx">'+label+'</span>'
    +(cnt?'<span class="cnt">'+cnt+'</span>':'')+'<span class="go">見る ›</span></button>';
}
function loShow(r){
  var rows='';
  if(r.health) rows+=loRow('health','🩸','今日の 体調チェックが まだです',0,true);
  if(r.news)   rows+=loRow('news',  '📢','未読の 通達',            r.news);
  if(r.notice) rows+=loRow('notice','🔔','あなたへの おしらせ',    r.notice);
  if(r.board)  rows+=loRow('board', '📋','掲示板の 新着',          r.board);
  if(r.msg)    rows+=loRow('msg',   '✉️','あなたへの メッセージ',  r.msg);
  var el=document.getElementById('loSheet');
  if(!el){
    el=document.createElement('div'); el.id='loSheet'; el.className='lo-sheet';
    document.body.appendChild(el);
    // ⚠️背景タップでは閉じない(誤爆でログアウトも中断も起きないように)。閉じるのは明示ボタンだけ。
  }
  el.innerHTML='<div class="lo-card">'
    +'<div class="lo-hd"><div class="h1">お疲れさまでした。<br>帰る前に これだけ。</div>'
    +'<div class="h2">見ないまま 帰ると、次に 出社するまで 気づけません。</div></div>'
    +'<div class="lo-body">'+rows
    +'<div class="lo-note">※ 会社メールは この タブレットでは 開けません。パソコンで ご確認ください。</div></div>'
    +'<div class="lo-foot"><button type="button" class="lo-skip" onclick="loSkip()">あとで（このまま ログアウト）</button></div>'
    +'</div>';
  el.classList.add('open');
  bumpIdle();
}
function loHide(){ var el=document.getElementById('loSheet'); if(el) el.classList.remove('open'); }
// 「見る」= 1枚を閉じてその場所へ。読み終わってもう一度ログアウトを押すと、件数が減った状態で
// 同じ1枚が出る(全部無くなればそのまま見送り)。
function loGo(kind){
  logUsage('tap:帰る前→'+kind);
  loHide();
  if(kind==='health'){ openHealth(); return; }
  if(kind==='notice'){ openNotices(); return; }
  if(kind==='msg'){ openMsg(); return; }
  if(kind==='board'){
    // 掲示板は投稿1件ずつの既読を持たない(users.last_board_seen_at 方式)ので、ここで既読にしないと
    // 毎回同じ件数が出続けて この1枚が形骸化する。⚠️「あとで」では既読にしない。
    api('/api/board/mark-seen',{method:'POST'});
    _pgTab='social'; _pgIdx=0; renderMenu(); return;
  }
  openNoticeList();   // 📢会社から通達(通達の板は廃止したのでボタンと同じ一覧を開く)
}
function loSkip(){ logUsage('done:帰る前→そのままログアウト'); loHide(); doLogout(true); }

/* ===== ログアウト ＋ 無操作オートログアウト ===== */
async function doLogout(farewell){
  try{ loHide(); }catch(e){}   // 帰る前の1枚が開いていたら必ず閉じる(件数を残したまま画面を離れない)
  _firstDone=true;   // 挨拶の後追い発火を止める
  if(curAudio){ try{ curAudio.pause(); }catch(e){} }
  if(farewell){ // 退出時は葵が会釈して見送る
    try{ aoiSetClip('bow'); await new Promise(function(res){ var d=false,fin=function(){ if(d)return; d=true; res(); }; speak('お疲れ様でした。ご安全に。', fin); setTimeout(fin, 3500); }); }catch(e){}
  }
  try{ if(socket) socket.disconnect(); }catch(e){}
  try{ await fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN}}); }catch(e){}
  ['cohub_token','cohub_user','cohub_kiosk','cohub_kiosk_token'].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} });
  // 共用タブレットは表示モードの好み・言語を端末に残さない(次の利用者へ波及させない)。個人スマホは好みを維持。
  if(IS_KIOSK){ try{ localStorage.removeItem('cohub_view_pref'); localStorage.removeItem('cohub_lang'); }catch(e){} }
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('cohub_draft_')===0) localStorage.removeItem(k); }); }catch(e){}
  // キオスクは共用ログイン画面(/tablet)へ、個人スマホは通常ログイン(/)へ。
  location.replace(IS_KIOSK ? '/tablet' : '/');
}
var idleTimer=null;
// 無操作オートログアウトは共用タブレット(キオスク)のみ。個人スマホは自分の端末なので勝手にログアウトしない。
function bumpIdle(){ if(!IS_KIOSK) return; if(idleTimer)clearTimeout(idleTimer); idleTimer=setTimeout(function(){ doLogout(); }, 3*60*1000); }
['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, bumpIdle, {passive:true}); });

init();
