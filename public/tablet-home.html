<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>簡単モード | CoWell</title>
<!-- タブレット専用manifest: ログイン後もタブレットアプリとして一貫させる -->
<link rel="manifest" href="/tablet-manifest.json?v=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoWellタブレット">
<link rel="apple-touch-icon" href="/img/icon-192.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;background:#bceae3;color:#123;font-size:20px;overflow:hidden}
  .wrap{max-width:1100px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 14px 8px;overflow:hidden}
  /* 最下段 著作権(ビズテラス ロゴ入り) */
  .tb-copyright{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:5px 0 1px;margin-top:3px;font-size:12px;font-weight:700;color:#3f5750;opacity:.8}
  .tb-copyright img{height:15px;width:auto}
  /* ヘッダー */
  .top{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  /* 左ガター(掲示板の左列と同幅)=名前/横メニューを掲示板の左端に揃える(直線性)。アバターはタブの真上。 */
  /* min-height=アバターの高さ。顔写真は後から読み込まれるので、先に場所を空けておかないと
     読み込み完了の瞬間にヘッダーが伸びて下のタブ行が下がる(2026-07-26) */
  .top-gutter{flex:0 0 226px;min-height:46px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
  /* ヘッダー左=名前＋簡単モードの下に横メニューを縦積み(葵はログアウトの左隣) */
  .topleft{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;gap:5px}
  .topleft .who{flex:0 0 auto}
  .who{flex:1;font-size:26px;font-weight:900;color:#0f5c46;line-height:1.2;display:flex;align-items:center;width:100%}
  .who small{display:block;font-size:15px;color:#5b6b78;font-weight:700}
  .who-av{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.15);background:#eef}
  .btn-logout{background:#dc2626;color:#fff;border:none;border-radius:9px;padding:4px 11px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 2px 0 #a41a1a;vertical-align:middle;margin-left:0}
  .btn-logout:active{transform:translateY(2px);box-shadow:0 1px 0 #a41a1a}
  .menu-link{display:inline-block;margin-left:6px;font-size:14px;color:#2563eb;text-decoration:underline;background:none;border:none;cursor:pointer}
  /* 表示切替(かんたん⇔詳しい)ボタン: 名前の横 2026-07-09 */
  .who-actions{margin-left:auto;display:inline-flex;align-items:center;gap:8px}
  .view-switch{display:inline-block;vertical-align:middle;margin-left:0;font-size:14px;font-weight:800;color:#1f6fd0;background:#eef4fb;border:2px solid #cfe0ee;border-radius:12px;padding:6px 12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .view-switch:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  /* 2カラム: 左=葵(常時表示) / 右=操作パネル */
  .main{display:flex;flex-direction:row;gap:8px;flex:1;min-height:0}
  /* 左列: 上=切替タブ / 下=葵(掲示板の左下) */
  .boardside{flex:0 0 auto;width:226px;display:flex;flex-direction:column;gap:8px;min-height:0}
  .boardside .aoi-col{margin-top:auto;flex:0 0 auto}
  /* 横メニュー(ヘッダー左・簡単モードの下)。左寄せ・はみ出しは横スクロール */
  #stripHost{flex:0 1 auto;min-width:0;align-self:flex-start;max-width:100%}
  /* 葵に合わせ夏の飾りも縮小(大きすぎて散らかるのを防ぐ) */

  /* ☀️夏バージョン: 画面全体を薄いターコイズ(body)に。葵の周りの枠は無し(aoi-col/aoiWrapとも背景なし)。
     発話動画は白背景を同じターコイズにベイク済・待機stillは透過ゆえ、画面と葵がシームレスに繋がる(青被り無し・白箱無し・枠無し)。 */
  .aoi-col{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:0;position:relative}
  #aoiWrap{flex:0 0 auto;min-height:0;width:214px;height:380px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;border-radius:14px}
  /* 動画クリップ下部(約85〜92%)にAI生成の文字化けテロップが焼き込まれているため、下16%を隠して非表示に。
     静止画・動画の両方へ同率で適用し、切替時に高さがズレないようにする。round=角丸維持。 */
  /* テロップ隠しは直線クリップのみ(角丸クリップは動画でカクつき/黒影の原因→枠側で角丸)。 */
  /* 葵は左配置なので左右反転(掲示板側=右を向く)。枠/飾りは反転しない。 */
  #aoiStill,#aoiVid{max-height:100%;max-width:100%;width:auto;height:auto;display:block;position:relative;z-index:2;transform:scaleX(-1)}
  /* clip-path廃止(再生中の黒影/カクつき対策)。動画下部の文字化けテロップは背景色(夏ターコイズ)バーで覆って隠す。 */
  #aoiWrap::after{display:none}  /* 全身版はテロップ焼込み無し・足元を隠さない */
  /* 夏の飾り(葵の四隅・音や操作を妨げない装飾レイヤー) */


  @keyframes seSway{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  @keyframes seSun{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.1);opacity:1}}



  /* ☀️刷新: パネルも透明化し画面全体をターコイズに。カード/入力は各自の背景で可読性維持。 */
  .panel{flex:1 1 auto;background:transparent;border-radius:22px;padding:6px 4px;overflow:auto;min-height:0}
  /* 掲示板モード=パネルを縦フルに使い、ページャーを常に画面内に収める(モーダルには影響させない) */
  #panelBody.boardmode{display:flex;flex-direction:column;height:100%;min-height:0}
  #panelBody.boardmode #guidanceBanner{flex:0 0 auto}
  #panelBody.boardmode #boardHost{flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column}
  .bubble{display:none}   /* 吹き出し廃止(可変高さでレイアウトが崩れるため)。案内は音声主体。 */
  .bubble:before{content:"";position:absolute;bottom:-16px;left:40px;border:8px solid transparent;border-top-color:#7fd4b6}
  .bubble:after{content:"";position:absolute;bottom:-11px;left:42px;border:6px solid transparent;border-top-color:#fff}
  /* カード(右パネル・2x2) */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .card{position:relative;border:none;border-radius:20px;padding:18px 12px;font-size:23px;font-weight:900;color:#fff;cursor:pointer;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
  .card:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .card .ico{font-size:44px;line-height:1}
  .c-health{background:linear-gradient(135deg,#f0662f,#e0431f)}
  .c-report{background:linear-gradient(135deg,#2f9ad8,#1f6fd0)}
  .c-news{background:linear-gradient(135deg,#d9932a,#c06f10)}
  .c-msg{background:linear-gradient(135deg,#6d55c8,#4f39a8)}
  .c-wellness{background:linear-gradient(135deg,#34d399,#059669)}
  .c-mypage{background:linear-gradient(135deg,#64748b,#334155)}
  .c-kiko{background:linear-gradient(135deg,#0891b2,#0e5a8a)}
  .c-arch{background:linear-gradient(135deg,#a1836a,#7d6248)}
  /* 帰庫点呼(乗務後) 2026-07-09 */
  .kiko-sec{margin-bottom:16px}
  .kiko-q{font-size:19px;font-weight:800;color:#1f2b36;margin:0 0 10px}
  .kiko-opts{display:flex;gap:10px;flex-wrap:wrap}
  .kiko-opt{flex:1;min-width:130px;padding:18px 12px;font-size:21px;font-weight:800;border:2px solid #cfd8e0;border-radius:16px;background:#fff;color:#334155;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1)}
  .kiko-opt.sel{border-color:#0ea5e9;background:#e0f2fe;color:#075985}
  .kiko-opt.ok.sel{border-color:#059669;background:#dcfce7;color:#065f46}
  .kiko-opt.ng.sel{border-color:#dc2626;background:#fee2e2;color:#991b1b}
  .kiko-opt:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .fat-lead{font-size:15px;font-weight:600;color:#64748b;margin:-2px 0 8px}
  .fat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .fat-btn{padding:14px 0;font-size:21px;font-weight:800;border:2px solid #cfd8e0;border-radius:12px;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.08)}
  .fat-btn.sel{outline:3px solid #0ea5e9;outline-offset:-2px;transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.1)}
  .fat-ends{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#94a3b8;margin:4px 2px 0}
  .kiko-note{width:100%;box-sizing:border-box;margin-top:10px;font-size:18px;padding:12px;border:2px solid #cfd8e0;border-radius:12px;min-height:60px;background:#fff}
  /* マイページ(かんたんモード) 2026-07-09 */
  .mp-head{display:flex;align-items:center;gap:14px;padding:2px 2px 14px;border-bottom:1px solid #e5e9ef;margin-bottom:16px}
  .mp-av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.15);flex:0 0 auto;background:#eef}
  .mp-name{font-size:22px;font-weight:800;color:#1f2b36;line-height:1.2}
  .mp-name small{display:block;font-size:14px;color:#6b7a86;font-weight:600;margin-top:3px}
  .mp-title{font-size:17px;font-weight:800;color:#475569;margin:0 0 12px}
  .mp-lang{display:block;width:100%;text-align:left;padding:16px 18px;margin-bottom:10px;border:2px solid #cfd8e0;border-radius:16px;background:#fff;font-size:22px;font-weight:800;color:#334155;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .mp-lang.on{border-color:#0f766e;background:#f0fdfa;color:#0f766e}
  .mp-lang:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.08)}
  .mp-sec{border:1px solid #e5e9ef;border-radius:16px;padding:14px 16px;margin-bottom:14px;background:#fbfcfe}
  .mp-h{font-size:18px;font-weight:800;color:#334155;margin:0 0 8px;display:flex;align-items:center;gap:8px}
  .mp-desc{font-size:13px;color:#6b7a86;margin:0 0 10px;line-height:1.5}
  .mp-in{width:100%;box-sizing:border-box;font-size:20px;padding:13px 14px;border:2px solid #cfd8e0;border-radius:14px;margin-bottom:10px;background:#fff}
  .mp-save{display:inline-block;padding:13px 24px;border:none;border-radius:14px;background:#0f766e;color:#fff;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  .mp-save:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .mp-msg{font-size:14px;margin-top:8px;min-height:18px;font-weight:700}
  .mp-msg.ok{color:#15803d}.mp-msg.err{color:#dc2626}
  .mp-link{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid #cfd8e0;border-radius:14px;background:#fff;font-size:18px;font-weight:700;color:#1f6fd0;cursor:pointer}
  /* 発話後のみ表示。葵の下端に重ねて上帯の高さを消費しない(掲示板を広く保つ) */
  .replay-btn{position:absolute;bottom:0;left:0;right:0;margin:0 auto;width:max-content;background:#eef4fb;color:#1f6fd0;border:1.5px solid #cfe0ee;border-radius:9px;padding:2px 8px;font-size:10px;font-weight:800;cursor:pointer;box-shadow:0 1px 0 rgba(0,0,0,.12);z-index:4}
  .replay-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  /* 健康サブメニュー: 3列・小さめ */
  .hgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .hgrid .card{min-height:92px;font-size:17px;padding:10px 6px;gap:4px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
  .hgrid .card .ico{font-size:32px}
  .hgrid .card .hm-face{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  @media (max-width:640px){ .hgrid{grid-template-columns:1fr 1fr} }
  .pill{position:absolute;top:12px;right:12px;background:#fff;color:#c0392b;font-size:18px;font-weight:900;border-radius:999px;padding:4px 14px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .pill.ok{color:#0a7d3f}
  /* パネル内フローの見出し */
  .ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
  .mtitle{font-size:23px;font-weight:900;color:#0f5c46}
  .btn-close{background:#64748b;color:#fff;border:none;border-radius:14px;padding:10px 16px;font-size:19px;font-weight:900;cursor:pointer;white-space:nowrap}
  .q{font-size:30px;font-weight:900;line-height:1.4;margin:10px 0 18px;text-align:center}
  .opts{display:flex;flex-direction:column;gap:14px}
  .opt{border:3px solid #cfe0ee;background:#f4f9ff;border-radius:20px;padding:20px;font-size:26px;font-weight:900;color:#123;cursor:pointer;text-align:center}
  .opt:active{background:#dcecff;transform:translateY(2px)}
  .opt.yes{border-color:#8fd4b6;background:#eefaf3}
  .opt.no{border-color:#f2c0c0;background:#fdeeee}
  .big-in{width:100%;font-size:30px;padding:16px;border:3px solid #cfe0ee;border-radius:18px;text-align:center;font-weight:900;background:#fff}
  textarea.big-in{min-height:150px;text-align:left;line-height:1.5}
  .btn-go{width:100%;background:#0f9d63;color:#fff;border:none;border-radius:20px;padding:20px;font-size:26px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #0a7a4c;margin-top:8px}
  .btn-go:active{transform:translateY(3px);box-shadow:0 2px 0 #0a7a4c}
  .btn-sub{background:#e2e8f0;color:#333;box-shadow:0 5px 0 #b7c0cc}
  .num-row{display:flex;gap:12px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:8px 0 16px}
  .num-box{text-align:center}
  .num-box label{display:block;font-size:18px;font-weight:800;color:#556;margin-bottom:6px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:56px;height:56px;border:none;border-radius:14px;background:#2f7ed8;color:#fff;font-size:30px;font-weight:900;cursor:pointer}
  .stepper input{width:96px}
  .listitem{border:2px solid #e3ebf3;border-radius:16px;padding:16px;margin-bottom:12px;background:#fbfdff}
  .listitem .ti{font-size:22px;font-weight:900;color:#12304a;margin-bottom:6px}
  .listitem .bd{font-size:20px;line-height:1.55;white-space:pre-wrap;color:#25384a}
  .listitem .mt{font-size:15px;color:#7488}
  .empty{font-size:22px;color:#6b7a88;text-align:center;padding:26px}
  /* 運動記録: 種目の大ボタン */
  .ex-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:6px 0}
  .ex-t{border:3px solid #cfe0ee;background:#f4f9ff;border-radius:18px;padding:12px 4px;font-size:19px;font-weight:900;color:#123;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
  .ex-t .exi{font-size:34px;line-height:1}
  .ex-t.on{border-color:#0f9d63;background:#e9f9f1;box-shadow:0 3px 0 #0a7a4c}
  .ex-t:active{transform:translateY(2px)}
  @media (max-width:640px){ .ex-grid{grid-template-columns:1fr 1fr} }
  /* 健康ボード */
  .bd-tabs{display:flex;gap:8px;margin-bottom:12px}
  .bd-tab{flex:1;padding:12px;border-radius:14px;border:3px solid #d1fae5;background:#fff;font-size:19px;font-weight:900;cursor:pointer;color:#64748b}
  .bd-tab.on{border-color:#059669;background:#ecfdf5;color:#065f46}
  .bd-total{text-align:center;background:#f0fdf9;border:2px solid #a7f3d0;border-radius:18px;padding:16px;margin-bottom:12px}
  .bd-total .bn{font-size:48px;font-weight:900;color:#059669;line-height:1}
  .bd-total .bu{font-size:20px;margin-left:4px}
  .bd-total .bs{font-size:18px;color:#475569;font-weight:800;margin-top:6px}
  .bd-row{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid #eef2f7;font-size:22px}
  .bd-row .bp{width:36px;text-align:center;font-weight:900}
  .bd-row .bnk{flex:1;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bd-row .bct{font-weight:900;color:#059669}
  .bd-me{background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid #6ee7b7;border-radius:18px;padding:14px;margin-top:12px}
  .bd-mrow{display:flex;justify-content:space-around;text-align:center}
  .bd-mrow .bmn{font-size:34px;font-weight:900;color:#047857}
  .bd-mrow .bml{font-size:15px;color:#065f46;font-weight:800}
  /* 栄養レポート */
  .fr-sec{margin:12px 0}
  .fr-sec h3{font-size:20px;margin:0 0 6px;color:#0f766e;font-weight:900;border-left:5px solid #0d9488;padding-left:10px}
  .fr-sec p{margin:0;font-size:20px;line-height:1.7;white-space:pre-wrap}
  .fr-next{margin:0;padding-left:0;list-style:none}
  .fr-next li{background:#eef2ff;border:1px solid #c7d2fe;border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:19px;line-height:1.6;color:#3730a3}
  .fr-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:16px;padding:12px 14px}
  .fr-warn h3{color:#b45309;border-left-color:#f59e0b}
  .fr-cheer{background:#f0fdfa;border:1px solid #99f6e4;border-radius:16px;padding:14px;font-size:20px;font-weight:800;color:#0f766e;margin-top:10px}
  .done-wrap{text-align:center;padding:10px}
  .done-wrap .big{font-size:32px;font-weight:900;color:#0a7d3f;margin:6px 0 18px}
  /* スタート被せ */
  #startCover{position:fixed;inset:0;background:linear-gradient(160deg,#0f766e,#0e7490);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;z-index:100;text-align:center;padding:24px}
  #startCover img{width:190px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
  #startCover .msg{font-size:34px;font-weight:900;line-height:1.4}
  #startCover .sub{font-size:20px;opacity:.9}
  #startCover .tap{margin-top:10px;font-size:24px;font-weight:900;background:#ffffff;color:#0f766e;border-radius:999px;padding:18px 40px;box-shadow:0 6px 0 rgba(0,0,0,.25);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @media (max-width:640px){
    /* スマホ縦: 葵が大きすぎてボタンが全部見えない → 葵を小さく・カードを低くして6枚とも収める */
    body{font-size:17px}   /* スマホは文字を少し小さめに(タブレットの特大文字はスマホでは大きすぎるため) */
    .main{gap:6px}
    .aoi-col{flex:0 0 auto}
    #aoiWrap{width:72px;height:128px}   /* スマホは葵をさらに小型化(全身9:16) */
    .bubble{font-size:17px;padding:12px 14px;min-height:58px}.bubble:before,.bubble:after{display:none}
    /* 「もう一度聴く」は葵の下でなく右上へ(縦スペースを空けて設問エリアを広く) */

  /* 資料(PDF)のサムネ: A4縦をセル(横長)に contain すると左右が余って小さく見える。
     上端そろえの cover で全面に敷き、見出し部分が読めるようにする(全体は開けば見られる) */
  .tthumb.tdoc img{object-fit:cover;object-position:top center;background:#fff}

  /* コルクボードから浮く立体感: 柔らかいドロップシャドウ(暖色寄り) */
  .mcol .tile{position:relative;margin:0;box-shadow:0 8px 18px rgba(45,30,10,.34),0 2px 5px rgba(0,0,0,.22)}

  /* カード内は上限まで(小さい投稿=小カード/長文=大カードでメリハリ)。続きはタップで全文。約90%サイズ(タブレット収まり優先・PCは余裕) */
  .mcol .tile .ttitle{max-height:3.4em;overflow:hidden;font-size:16px}

  .mcol .tile .tmeta{padding:6px 9px}
  .mcol .tile .foodband,.mcol .tile .circleband{padding:5px 11px;font-size:12px}
  /* ピンで留めた感じ: 上端中央の画鋲＋わずかな傾き */
  .mcol .tile::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;z-index:6;
    background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),transparent 46%),#c0392b;box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 -2px 3px rgba(0,0,0,.3)}
  .mcol .tile:nth-child(3n+1){transform:rotate(-.6deg)}
  .mcol .tile:nth-child(3n+2){transform:rotate(.5deg)}
  .mcol .tile:nth-child(3n){transform:rotate(-.3deg)}
  @media (prefers-reduced-motion:reduce){.pgtrack{transition:none}}
  .pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
  .pnav{background:linear-gradient(180deg,#fffdf6,#e9e0cd);border:1px solid rgba(120,90,50,.4);border-radius:11px;font-family:inherit;font-weight:900;font-size:14px;color:#5a4326;padding:7px 16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.22)}

  .archrow b{font-weight:800;color:#1e293b}

  @media(max-width:640px){.board{grid-template-columns:1fr}.tthumb{height:100px}.mchip{min-width:58px;font-size:10px;padding:7px 9px}.mchip .ico{font-size:19px}}
  /* ===== スマホ縦画面: 評判の良いタブレット簡単版を1カラム縦スクロールに最適化 ===== */

    /* ⚠️iOS Safari: dvh はアドレスバーの出入りで値が変わり、スクロールのたびに画面全体が伸縮して

       ⭐touch-action:pan-x = 横スライド中に指が少し縦へブレてもページが縦スクロールしない(軸を固定)。

    .mstrip{display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;grid-auto-columns:5.1rem;gap:6px;padding:2px 2px 8px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;touch-action:pan-x}
    .mchip,.mchip.tenko-btn{width:100%;min-width:0;height:100%;font-size:9.5px;padding:5px 4px;border-radius:11px;gap:2px;white-space:normal;line-height:1.15;text-align:center;justify-content:center}

    /* 縦積み: 上=アバター＋タブ / 下=掲示板・操作パネル */

    .pgtabs{display:flex;flex-direction:row;flex-wrap:nowrap;width:auto;flex:1 1 auto;gap:6px;overflow-x:auto;align-items:stretch;min-height:52px;overscroll-behavior:contain;touch-action:pan-x}

  }

<script src="/socket.io/socket.io.js"></script>
<script>
var TOKEN = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';
// 共用タブレット(キオスク)か、個人スマホ(BYOD)かで挙動を変える。
//  キオスク=無操作オートログアウト有・戻る無効・完了画面でログアウト必須。
//  個人スマホ=自分の端末なのでオートログアウトしない・戻る有効・詳しい表示に切替可。
var IS_KIOSK = (localStorage.getItem('cohub_kiosk') === '1');
if(!TOKEN){ location.replace(IS_KIOSK ? '/tablet' : '/'); }
var ME=null, AOI_VOICE='ja-JP-Neural2-B', ROSTER_YOMI={};
// 在席(オンライン)登録＋DMリアルタイム受信のため socket.io に接続。
var socket=null, curPeer=null;
function connectSocket(){
  if(socket || typeof io==='undefined') return;
  try{
    socket=io({auth:{token:TOKEN, isMobile:true}});
    socket.on('dm:msg', function(m){
      try{ refreshBadges(); }catch(e){}
      if(curPeer && m && (String(m.from)===curPeer || String(m.to)===curPeer)){ try{ loadThread(curPeer, true); }catch(e){} }
    });
    socket.on('dm:blocked', function(b){ try{ speak('申し訳ありません。この相手には 送れません。'+((b&&b.reason==='hierarchy')?' 上司を 通じて ご連絡ください。':'')); }catch(e){} });
  }catch(e){}
}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
async function api(path, opt){
  opt=opt||{}; opt.headers=Object.assign({'Authorization':'Bearer '+TOKEN}, opt.headers||{});
  if(opt.json!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.json);delete opt.json;}
  try{ var r=await fetch(path,opt); return await r.json(); }catch(e){ return null; }
}
// 機能別 利用ログ (fire-and-forget)。展開の検証用=どの機能が使われたか。
function logUsage(feature){ try{ api('/api/usage/tap',{method:'POST',json:{feature:feature,surface:'tablet'}}); }catch(e){} }

/* ===== 葵の声＋実写トーキング動画(Veo) ===== */
var curAudio=null;
function setBubble(t){ $('bubble').textContent=t; }
// 喋る間は実写動画を再生、待機中は静止画。TTS音声と動きが同期する。
function aoiTalk(on){
  var v=$('aoiVid'), s=$('aoiStill'); if(!v||!s) return;
  if(on){ s.style.display='none'; v.style.display='block'; try{ v.currentTime=0; var p=v.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
  else { try{ v.pause(); }catch(e){} v.style.display='none'; s.style.display='block'; }
}
function aoiWave(){ /* 動画に動作が含まれるため個別のwaveは不要 */ }
// 感情クリップ(喜怒哀楽+表情)の出し分け。喋る直前に aoiSetClip() で切り替える。
var CLIP={point:'point.mp4?v=summer8',greet:'greet.mp4?v=summer8',talk:'talk.mp4?v=summer8',concern:'concern.mp4?v=summer8',praise:'praise.mp4?v=summer8',bow:'bow.mp4?v=summer8',listen:'listen.mp4?v=summer8',thanks:'thanks.mp4?v=summer8',surprise:'surprise.mp4?v=summer8',caution:'caution.mp4?v=summer8'};
var curClip='point';   // 動画の初期srcはpoint.mp4(挨拶で葵が手でボタンを促す・src切替のロード待ちなく即再生)
function aoiSetClip(name){ if(!CLIP[name])name='talk'; if(name===curClip)return; curClip=name; var v=$('aoiVid'); if(v){ v.src='/assets/aoi/'+CLIP[name]; try{v.load();}catch(e){} } }
try{ Object.keys(CLIP).forEach(function(k){ fetch('/assets/aoi/'+CLIP[k]).catch(function(){}); }); }catch(e){}   // 先読みでキャッシュを温める
var _lastSpoken=null;
// 葵ボイスの多言語化(2026-07-09): cohub_lang別の声・速度。表示テキストと同じ /api/translate で読み上げ文も翻訳。
// speed=葵の話速。動画(実写8秒クリップ)の口の開閉テンポは自然会話速なので、1.3では発話が口パクより先行してズレる。
// 1.1に落として口の動きと発話を合わせる(高齢ドライバーの聞き取りやすさも向上)。
var VOICE_BY_LANG={ ja:{v:'ja-JP-Neural2-B',pitch:1.0,speed:1.1},
                    pt:{v:'pt-BR-Neural2-C',pitch:0.0,speed:1.05},
                    en:{v:'en-US-Neural2-F',pitch:0.0,speed:1.05} };
// ヘルスアドバイザーの声(葵とは別の女性)。ja=Despina。pt/en は葵(pt-C/en-F)と別の女性Neural2。言語切替に追従。
var ADV_VOICE={ ja:{v:'ja-JP-Chirp3-HD-Despina',speed:1.1,pitch:0},
                pt:{v:'pt-BR-Neural2-A',speed:1.05,pitch:0},
                en:{v:'en-US-Neural2-C',speed:1.05,pitch:0} };
function curLang(){ try{ return localStorage.getItem('cohub_lang')||'ja'; }catch(e){ return 'ja'; } }
// 読み上げ文を現在の言語へ翻訳。cohub_tr_<lang>キャッシュを translate.js と共有し2回目以降は即時。失敗時は原文のまま。
function speakText(ja){
  var lang=curLang();
  if(lang==='ja'||!ja) return Promise.resolve(ja);
  var ck='cohub_tr_'+lang, cache={};
  try{ cache=JSON.parse(localStorage.getItem(ck)||'{}'); }catch(e){}
  if(cache[ja]!=null) return Promise.resolve(cache[ja]);
  return fetch('/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({lang:lang,texts:[ja]})})
   .then(function(r){ return r.ok?r.json():null; })
   .then(function(d){ var tr=d&&d.translations&&d.translations[ja];
     if(tr){ cache[ja]=tr; try{ localStorage.setItem(ck,JSON.stringify(cache)); }catch(e){} return tr; }
     return ja; })
   .catch(function(){ return ja; });
}
var _aoiBusy=false, _aoiSpeakGen=0;   // _aoiBusy=葵が発話中(greetNow二重防止)。_aoiSpeakGen=世代(ヘルス割込みで進行中/準備中の葵をキャンセル=被り防止)
function speak(text, cb, sayOverride){
  var myGen=++_aoiSpeakGen;
  _aoiBusy=true;
  _lastSpoken={ text:text, say:sayOverride };   // 「もう一度聴く」用に最後の発話を保持
  var rb=$('replayBtn'); if(rb) rb.style.display='';
  setBubble(text);
  var lang=curLang();
  // 日本語=読み(sayOverride)優先(氏名の誤読対策)。多言語=表示文(漢字名含む)を翻訳して読ませる(氏名はローマ字化され外国語音声で自然)。
  var src=(lang==='ja') ? String(sayOverride!=null?sayOverride:text) : String(text);
  var vc=VOICE_BY_LANG[lang]||VOICE_BY_LANG.ja;
  // 口パクは発話開始の直前に始める(翻訳/TTS取得の間は静止画=無言中に口が動かない)。
  speakText(src).then(function(sayTr){
    var say=String(sayTr).replace(/[ 　]+/g,'');   // 余分な空白はTTSに送らない
    return fetch('/api/voice/tts',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+TOKEN},
      body:JSON.stringify({text:say, voice:vc.v, pitch:vc.pitch, speed:vc.speed})});
  })
   .then(function(r){ if(!r.ok) throw 0; return r.blob(); })
   .then(function(b){
     if(myGen!==_aoiSpeakGen){ _aoiBusy=false; return; }   // ヘルス等の割込みが入ったので葵は鳴らさない(被り防止)
     var url=URL.createObjectURL(b);
     if(curAudio){try{curAudio.pause();}catch(e){}}
     curAudio=new Audio(url);
     curAudio.onended=function(){ _aoiBusy=false; aoiTalk(false); URL.revokeObjectURL(url); if(cb)cb(); };
     curAudio.onerror=function(){ _aoiBusy=false; aoiTalk(false); if(cb)cb(); };
     // 口パクと発話の開始を同期: 動画を再生し、実際に動き出したら(最大250msで)音声を鳴らす
     aoiTalk(true);
     var v=$('aoiVid'), started=false;
     // ⚠️自動再生がブロックされた時(play() reject)も _aoiBusy を必ず解除(詰まり防止)
     var go=function(){ if(started)return; started=true; var pp=curAudio.play(); if(pp&&pp.catch)pp.catch(function(){ _aoiBusy=false; aoiTalk(false); }); };
     if(v){ v.addEventListener('playing', go, {once:true}); setTimeout(go, 250); } else { go(); }
   })
   .catch(function(){ _aoiBusy=false; aoiTalk(false); setTimeout(function(){ if(cb)cb(); }, Math.min(6500, 1300+String(src).length*95)); });
}
// 「もう一度聴く」= 直前に葵が言ったことを聞き直す(聞き逃し対策)。無ければ今の吹き出しを読む。
function replayLast(){
  bumpIdle();
  if(_lastSpoken){ speak(_lastSpoken.text, null, _lastSpoken.say); }
  else { var b=$('bubble'); if(b&&b.textContent) speak(b.textContent); }
}
// (言語切替ボタンは簡易ページでは非表示。言語設定はマイページに集約したため付け替えJSは撤去 2026-07-09)

/* ===== 打鍵の「ピ」音 (画面キーボードで入力するたびに鳴らす) ===== */
var actx=null;
function beep(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    var o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='square'; o.frequency.value=1500;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.08, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.06);
    o.start(t); o.stop(t+0.07);
  }catch(e){}
}
document.addEventListener('input', function(e){ if(e.target && e.target.classList && e.target.classList.contains('big-in')) beep(); }, true);

/* ===== 起動 ===== */
// 音声/動画の自動再生規制を解除(初回のユーザー操作内で呼ぶ)
function unlockMedia(){

  openModal('運行管理者からの指導', PENDING_GUIDANCE.map(guidanceItemHtml).join(''));
  try{ var f=PENDING_GUIDANCE[0]; speak('運行管理者から お知らせです。'+(f.reason?f.reason+'に ついて。':'')+f.content+' よろしければ、承諾します、を 押してください。'); }catch(e){}

async function consentGuidance(id, btn){
  if(btn){ btn.disabled=true; btn.textContent='送信中…'; }
  var j=await api('/api/guidance/'+id+'/consent',{method:'POST',json:{agree:true}});
  if(j&&j.success){
    PENDING_GUIDANCE=PENDING_GUIDANCE.filter(function(x){return x.id!==id;});
    try{ speak('ありがとうございます。承諾を 記録しました。'); }catch(e){}
    if(PENDING_GUIDANCE.length){ openGuidance(); } else { setTimeout(renderMenu, 900); }
  } else { if(btn){ btn.disabled=false; btn.textContent='内容を 確認し、承諾します'; } alert('送信に失敗しました。もう一度お試しください。'); }
}

async function mpApi(path, body){

/* ===== 🏃 運動記録（簡易入力版：種目＋時間を大ボタンで） =====

var _exType='walk';
var EX_TYPES=[['walk','👣','歩く'],['jog','🏃','ジョギング'],['run','💨','ランニング'],['bike','🚴','自転車'],['gym','💪','筋トレ'],['stretch','🧘','ストレッチ']];
function openExercise(){

function exerciseFormHtml(){
  var grid='<div class="ex-grid">'+EX_TYPES.map(function(t){
    return '<button class="ex-t" data-t="'+t[0]+'" onclick="pickExType(\''+t[0]+'\')"><span class="exi">'+t[1]+'</span>'+t[2]+'</button>';
  }).join('')+'</div>';
  var dur='<div class="q" style="font-size:24px;margin:14px 0 8px">運動した 時間（分）</div>'+
    '<div class="stepper" style="justify-content:center">'+
      '<button onclick="exMin(-10)">−10</button>'+
      '<input class="big-in" id="ex_min" inputmode="numeric" value="30" style="width:120px">'+
      '<button onclick="exMin(10)">＋10</button>'+
    '</div>';
  return grid+dur+'<button class="btn-go" onclick="sendExercise()">この内容で 記録する</button>';
}
function pickExType(t){ _exType=t; paintExType(); bumpIdle(); }
function paintExType(){ var bs=document.querySelectorAll('.ex-t'); for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-t')===_exType); } }
function exMin(d){ var e=$('ex_min'); if(!e)return; var v=parseInt(e.value||'0',10)||0; e.value=Math.max(0,v+d); beep(); bumpIdle(); }
async function sendExercise(){
  bumpIdle();
  var min=parseInt(($('ex_min')&&$('ex_min').value)||'0',10)||0;
  if(min<=0){ speak('運動した 時間を 入れてください。'); return; }
  var label=(EX_TYPES.filter(function(t){return t[0]===_exType;})[0]||['','','運動'])[2];
  $('mbody').innerHTML='<div class="empty">記録しています…</div>';

/* ===== ①-2 出発前の確認（通達・連絡・未読メッセージ）=====
   体調チェックの直後に必ず挟む。葵が1件ずつ読み上げ、タップで次へ。
   確認するものが何も無い日は素通りする(毎日の余計なタップを増やさない)。 */
var _brf=null, _brfPages=[], _brfIdx=0, _brfDone=null, _brfLabel='📋 出発前の 確認', _brfSay='出発の 前に', _brfNoBrief=false, _brfHasAck=false;
async function briefingStep(onDone, label, say, noBrief){
  _brfDone = onDone || function(){};
  _brfLabel = label || '📋 出発前の 確認';
  _brfSay = say || '出発の 前に';
  _brfNoBrief = !!noBrief;
  var j = await api('/api/tenko/briefing');
  if(!j || !j.success){ _brfDone(); return; }
  _brf = j; _brfIdx = 0; _brfPages = brfBuildPages(j);
  if(!_brfPages.length){ _brfDone(); return; }
  // 要確認(requires_ack)の通達が含まれる時は、確認し切るまで「戻る」を消してゲート化する。
  _brfHasAck = _brfPages.some(function(p){ return p.ack; });
  try{ logUsage('briefing:shown:'+((_brf.notices||[]).length)+(_brfHasAck?':ack':'')); }catch(e){}
  aoiSetClip('talk');
  brfShow();
}
function brfBuildPages(j){
  var p = [];
  // 「今日の連絡・安全一言」は朝の伝達事項。帰庫時(_brfNoBrief)は繰り返さない。
  if(j.brief && !_brfNoBrief){
    p.push({ h:'<div class="q" style="font-size:26px;color:#b45309">📢 きょうの 連絡</div>'+
                '<div class="q" style="font-size:28px;white-space:pre-wrap;text-align:left">'+esc(j.brief)+'</div>',
             say:'きょうの 連絡です。'+j.brief });
  }
  (j.notices||[]).forEach(function(n){
    var lv = n.level==='urgent' ? '🚨 緊急の 通達' : (n.level==='important' ? '⚠️ 大事な 通達' : '📣 通達');
    var sayLv = n.level==='urgent' ? '緊急の 通達です。' : (n.level==='important' ? '大事な 通達です。' : '通達です。');
    p.push({ h:'<div class="q" style="font-size:24px;color:'+(n.level==='urgent'?'#b91c1c':'#b45309')+'">'+lv+(n.requires_ack?'（要確認）':'')+'</div>'+
                '<div class="q" style="font-size:30px">'+esc(n.title)+'</div>'+
                '<div class="q" style="font-size:26px;white-space:pre-wrap;text-align:left">'+esc(n.body)+'</div>'+
                (n.attachments ? '<div class="small">※ 添付ファイルが '+n.attachments+'件 あります。あとで スマホや パソコンの 「通達」から ご確認ください。</div>' : ''),
             ack: !!n.requires_ack,
             say: sayLv + n.title + '。' + String(n.body||'').slice(0,400) });
  });
  var msgs = (j.dm_unread||0) + (j.group_unread||0);
  if(msgs){
    p.push({ h:'<div class="q" style="font-size:28px;color:#1d4ed8">💬 未読の メッセージが '+msgs+'件 あります</div>'+
                '<div class="small">メニューの「メッセージ」から ご確認ください。</div>',
             say:'未読の メッセージが '+msgs+'件 あります。'+_brfSay+' ご確認ください。' });
  }
  return p;
}
function brfShow(){
  bumpIdle();
  brfLock(_brfHasAck);   // 要確認がある間は「戻る」を消して、確認を必須化(点呼完了ゲート)
  var pg = _brfPages[_brfIdx];
  var last = (_brfIdx >= _brfPages.length-1);
  var pos = _brfPages.length>1 ? '<div class="small">'+(_brfIdx+1)+'／'+_brfPages.length+'</div>' : '';
  var gate = _brfHasAck ? '<div class="small" style="color:#b91c1c">※ かならず 最後まで 確認してください</div>' : '';
  $('mbody').innerHTML =
    '<div class="q" style="font-size:22px;color:#0f766e">'+_brfLabel+'</div>'+pos+pg.h+gate+
    '<button class="btn-go" onclick="'+(last?'brfFinish()':'brfNext()')+'">'+(last?'確認しました':'次へ ›')+'</button>'+
    '<button class="btn-go btn-sub" onclick="brfSpeak()">🔊 もう一度 聴く</button>';
  speak(pg.say);
}
// 出発前確認のゲート制御: on=trueで上部の「← 戻る」を消す(逃げ道を塞ぐ)、falseで戻す。
function brfLock(on){ try{ var b=document.querySelector('.btn-close'); if(b) b.style.display = on ? 'none' : ''; }catch(e){} }
function brfNext(){ _brfIdx++; brfShow(); }
function brfSpeak(){ bumpIdle(); var pg=_brfPages[_brfIdx]; if(pg) speak(pg.say); }
async function brfFinish(){
  bumpIdle();
  brfLock(false);   // ゲート解除(「← 戻る」を戻す)
  var ids = ((_brf && _brf.notices) || []).map(function(n){ return n.id; });
  if(ids.length){ await api('/api/tenko/briefing/confirm',{method:'POST',json:{ ids:ids }}); try{ logUsage('briefing:confirmed:'+ids.length); }catch(e){} }
  refreshBadges();
  _brfDone();
}

function isFreshNotice(a){ return (!a.read_at) || (a.requires_ack && !a.acked_at); }
// マソンリー: カードを中身で可変高さにし、1画面(pgviewport高)に入る分だけ列詰め→残りは次ページ。横スライドは維持。
// カード高さは実測(写真は上部132px固定なので画像ロード待ち不要=同期で確定)。ゾーン(通達・連絡→みんなの投稿)は混ぜない。
function measureCards(vp,colW,htmls){

function paginateZone(htmls,zone,dot,hint,vp,pageH,NCOL,GAP,out){

    var si=0; for(var c=1;c<NCOL;c++) if(page.cols[c].h<page.cols[si].h) si=c;
    var add=(page.cols[si].items.length?GAP:0)+ch;
    if(page.cols[si].items.length && page.cols[si].h+add>pageH){ np(); si=0; add=ch; }

// 固定グリッド分割 (2026-07-26)
// マソンリー(paginateZone)は高さ可変で詰めるので枚数が揃わない。労働安全の資料は
// 「同じ大きさで整列」しているほうが探しやすいので、cols×rows 枚ずつの固定ページにする。
// 並びは行優先(左→右→次の行)＝読み順。カード高さはCSS(.pg.gridNxM)で均等に伸ばす。
function paginateGrid(htmls,zone,dot,hint,cols,rows,out){
  if(!htmls.length) return;
  var per=cols*rows;
  for(var s=0;s<htmls.length;s+=per){
    var slice=htmls.slice(s,s+per);
    var page={zone:zone,dot:dot,hint:hint,cls:'grid'+cols+'x'+rows,cols:[]};
    for(var c=0;c<cols;c++) page.cols.push({h:0,items:[]});
    for(var i=0;i<slice.length;i++) page.cols[i%cols].items.push(slice[i]);
    out.push(page);

// 掲示板=2タブ切替。①通達・連絡(既定・NEWバッジ) ②みんなの投稿。ページ送りはタブ内だけ。

// 栄養分析: 詳細ページ(plaza.html)の buildNutritionBar を流用(塗り絵風アイコン＋基準比較＋信憑性)。
// nutrition_scores はオブジェクト or JSON文字列の両対応。escapeHtml→esc に置換。
function buildNutritionBar(sc){
  if(!sc) return '';
  if(typeof sc==='string'){ try{ sc=JSON.parse(sc); }catch(e){ return ''; } }
  if(!sc || typeof sc!=='object') return '';
  var isLegacy=(typeof sc.protein==='number' && sc.protein<=5 && !sc.calories);
  if(isLegacy){
    sc={ calories:{value:300+(sc.protein||3)*70,unit:'kcal'},protein:{value:(sc.protein||3)*5,unit:'g'},fat:{value:5+(sc.fat||3)*2.5,unit:'g'},carbs:{value:40+(sc.carbs||sc.carb||3)*10,unit:'g'},vitamin:{value:(sc.vitamin||3)*30,unit:'g'},mineral:{value:(sc.mineral||3)*55,unit:'mg'},fiber:{value:(sc.vitamin||3)*1.5,unit:'g'},salt:{value:4.0-(sc.salt||3)*0.5,unit:'g'},alcohol:{value:0,unit:'g'} };
  }
  var items=[
    {key:'calories',icon:'🔥',label:'カロリー',unit:'kcal',target:550,min:450,max:650,range:true},
    {key:'protein',icon:'🍖',label:'たんぱく質',unit:'g',target:20,positive:true},
    {key:'fat',icon:'🧈',label:'脂質',unit:'g',target:15,min:12,max:18,range:true},
    {key:'carbs',icon:'🍚',label:'炭水化物',unit:'g',target:79,min:69,max:89,range:true},
    {key:'vitamin',icon:'🥬',label:'野菜量',unit:'g',target:120,positive:true},
    {key:'mineral',icon:'🦴',label:'カルシウム',unit:'mg',target:227,positive:true},
    {key:'fiber',icon:'🌾',label:'食物繊維',unit:'g',target:7,positive:true},
    {key:'salt',icon:'🧂',label:'塩分',unit:'g',target:2.5,reverse:true},
    {key:'alcohol',icon:'🍺',label:'アルコール',unit:'g',target:20,reverse:true,optional:true}
  ];
  // 全項目を共通軸で判定。B0〜B1 が「適量帯」で、この位置は全項目で固定。
  var B0=36, B1=64;
  var calRaw=sc.calories, calV=(calRaw&&typeof calRaw==='object')?Number(calRaw.value):(typeof calRaw==='number'?calRaw:550);
  var nrows=[];
  for(var ii=0;ii<items.length;ii++){
    var item=items[ii], raw=sc[item.key], val=0;
    if(raw&&typeof raw==='object'&&raw.value!==undefined) val=Number(raw.value); else if(typeof raw==='number') val=raw;
    if(item.optional&&val===0) continue;
    // 旧データ互換: %エネルギー比で保存されている場合のみ g に変換 (値の大小での推測はしない)
    var rawUnit=(raw&&typeof raw==='object'&&raw.unit)?String(raw.unit):'';
    var isPct=rawUnit.indexOf('%')>=0;
    if(isPct&&item.key==='fat'&&val>0) val=Math.round(val*calV/100/9*10)/10;
    if(isPct&&item.key==='carbs'&&val>0) val=Math.round(val*calV/100/4*10)/10;
    var t=item.range?'range':(item.reverse?'max':'min');
    var lo=item.range?item.min:(t==='min'?item.target:0);
    var hi=item.range?item.max:(t==='max'?item.target:item.target*1.5);
    var x, dir='in', dev=0;
    if(t==='max'){
      if(val<=hi){ x=B1*(hi?val/hi:0); }
      else { dev=(val-hi)/hi; x=B1+(100-B1)*Math.min(1,dev); dir='high'; }
    } else if(val<lo){ dev=(lo-val)/lo; x=B0*(lo?val/lo:0); dir='low'; }
    else if(val<=hi){ x=B0+(B1-B0)*((val-lo)/((hi-lo)||1)); }
    else if(t==='min'){ x=B1+(100-B1)*Math.min(1,val/(hi||1)-1); dir='plenty'; }
    else { dev=(val-hi)/hi; x=B1+(100-B1)*Math.min(1,dev); dir='high'; }

  var NG_TAG={in:'適量',plenty:'しっかり',low:'足りない',high:'多い'};
  var NG_GLY={in:'✓',plenty:'✓',low:'◀',high:'▶'};
  var NG_COL=['#0ca30c','#d98411','#cf3b3b'];
  var NG_HINT={
    calories:['おにぎり1個ぶん足りません','ごはんを少し残す'],
    protein:['卵1個か納豆1パック足す',''],
    fat:['ナッツや魚、オリーブ油を少し足す','揚げ物かドレッシングを半分に'],
    carbs:['ごはんをもう半分','ごはんを一口残す'],
    vitamin:['サラダか具の多いみそ汁を1品',''],
    mineral:['牛乳かヨーグルトを1つ',''],
    fiber:['海藻かきのこを1品',''],

  function ngNum(v){ return (v%1===0)?String(v):v.toFixed(1); }
  function ngHint(r){ return r.sev===0?'':((NG_HINT[r.item.key]||['',''])[r.dir==='low'?0:1]||''); }

  var ngBad=nrows.filter(function(r){return r.sev===2;}), ngWarn=nrows.filter(function(r){return r.sev===1;});

  var vCls,vSig,vHl;

  else if(ngWarn.length){ vCls='#d98411'; vSig='△'; vHl='おしい。気になるのは '+ngWarn.length+'つ'; }
  else { vCls='#0ca30c'; vSig='◎'; vHl='よい一皿です'; }
  var vAct=worst?('<b>'+esc(worst.item.label)+'が'+NG_TAG[worst.dir]+'</b>'+(ngHint(worst)?' — '+ngHint(worst):''))
    :(nrows.length+'項目すべて目安の範囲。同じ組み合わせを覚えておくと楽です。');
  html+='<div class="nv"><div class="nv-sig" style="background:'+vCls+';">'+vSig+'</div>'
    +'<div class="nv-tx"><div class="nv-hl">'+vHl+'</div><div class="nv-act">'+vAct+'</div></div></div>';
  // 共通軸ゲージ (気になる項目を上に、適量は畳む)
  // 3領域のラベルと色。どちら側が問題かは物差しで変わるので、問題にならない側は無彩色にする。
  var NG_ZLBL={range:['少ない','適量','多い'],min:['少ない','適量','しっかり'],max:['控えめ','適量','多い']};
  var NG_ZCLS={range:['low','ok','hi'],min:['low','ok','mute'],max:['mute','ok','hi']};
  var NG_ZW=[B0,B1-B0,100-B1];
  function ngRowHtml(r){
    var c=NG_COL[r.sev], it=r.item, z=NG_ZCLS[r.t], zl=NG_ZLBL[r.t];
    var pt=r.sev===0?('✓ '+NG_TAG[r.dir]):((r.dir==='high'?'▲ +':'▼ −')+r.dev+'%');
    // 針が端に寄ったときはバッジを内側に寄せてはみ出しを防ぐ
    var tf=r.x<17?'translateX(0)':(r.x>83?'translateX(-100%)':'translateX(-50%)');

    for(var zi=0;zi<3;zi++){

      labels+='<span class="l-'+z[zi]+'" style="width:'+NG_ZW[zi]+'%">'+zl[zi]+'</span>';
    }
    return '<div class="ng-row">'
      +'<div class="ng-name"><span class="ng-ico">'+it.icon+'</span>'+esc(it.label)+'</div>'
      +'<div class="ng-val">'+ngNum(r.val)+'<i>'+it.unit+' ／ 目安 '+ngTgt(r)+'</i></div>'
      +'<div class="ng-gauge">'
        +'<div class="ng-pt" style="left:'+r.x+'%;transform:'+tf+';color:'+c+';">'+pt+'</div>'
        +'<div class="ng-track">'+zones+'</div>'
        +'<div class="ng-needle" style="left:'+r.x+'%;background:'+c+';"></div>'
        +'<div class="ng-zlbl">'+labels+'</div></div>'
      +(cmt?'<div class="ng-cmt" style="color:'+c+';background:'+c+'14;">💡 '+esc(cmt)+'</div>':'')
      +'</div>';
  }
  var ngNg=nrows.filter(function(r){return r.sev>0;}).sort(function(a,b){return (b.sev-a.sev)||(b.dev-a.dev);});
  var ngOk=nrows.filter(function(r){return r.sev===0;});
  var NG_LEGEND='<span>針の位置＝いまの量</span>';
  if(ngNg.length){
    html+='<div class="ng-head"><b>気になる項目</b>'+NG_LEGEND+'</div>';
    html+='<div class="ng-rows">'+ngNg.map(ngRowHtml).join('')+'</div>';
    if(ngOk.length){
      html+='<div class="ng-oks"><span class="ng-chip"><b>◎</b> 適量 '+ngOk.length+'項目</span>'
        +ngOk.map(function(r){return '<span class="ng-chip">'+r.item.icon+' '+esc(r.item.label)+'</span>';}).join('')+'</div>';
    }
  } else {
    html+='<div class="ng-head"><b>すべて適量</b>'+NG_LEGEND+'</div>';
    html+='<div class="ng-rows">'+ngOk.map(ngRowHtml).join('')+'</div>';
  }
  var conf=sc.confidence;
  if(conf&&conf.level){
    var stars=conf.level===3?'★★★':conf.level===2?'★★☆':'★☆☆';
    var cc=conf.level===3?'#20c997':conf.level===2?'#f59e0b':'#ef4444';
    var refObj=conf.reference_object, lbl=conf.reason||(conf.level===3?'成分表示':conf.level===2?'定番料理':'目視推定');
    var refIco=refObj?'📐':'🔍';
    var refTag=refObj?'<span style="background:#fff;color:'+cc+';padding:1px 6px;border-radius:8px;margin-left:4px;font-size:10px;font-weight:900;">📐 '+esc(refObj)+'</span>':'';
    html+='<div class="nutri-conf"><span class="badge" style="background:'+cc+'18;color:'+cc+';">'+refIco+' 信憑性 '+stars+'（'+esc(lbl)+'）'+refTag+'</span></div>';
  }
  html+='<div class="nutri-foot">▮ 基準値｜食事摂取基準2025・スマートミール基準</div></div>';
  return html;
}

function _advSentences(s,n){ s=_advCleanSpeech(s); if(!s)return ''; var arr=s.match(/[\s\S]*?[。！？!?]/g); if(!arr)return s; return arr.slice(0,n).join('').trim(); }
function foodVoiceScript(text){
  var src=String(text||''), map={}, re=/【([^】]+)】([\s\S]*?)(?=【[^】]+】|$)/g, m;
  while((m=re.exec(src))!==null){ map[m[1].trim().replace(/[!！]+$/,'!')]=m[2].trim(); }
  var good=map['良い点']?_advSentences(map['良い点'],2):'';
  var concern=(map['改善点']||map['悪い点'])?_advSentences(map['改善点']||map['悪い点'],2):'';
  var action=map['やってみよう!']?_advSentences(map['やってみよう!'],2):'';
  var body;
  if(good||concern||action){ var chunks=[]; if(good)chunks.push(good); if(concern)chunks.push('いっぽうで、'+concern); if(action)chunks.push('そこで、'+action); body=chunks.join(' '); }

function sayMsg(i){ var m=_boardMsgs[i]; if(!m) return; bumpIdle(); aoiSetClip('talk'); speak((m.sender_name||'')+'さんからの 連絡です。'+String(m.content||'').slice(0,600)); }
// 弔事(訃報・逝去・通夜/告別式)の判定。合成音声での読み上げ対象から外すために使う。
function isSolemn(a){
  if(!a) return false;
  return /訃報|逝去|ご逝去|お悔やみ|通夜|告別式/.test(String((a.title||'')+' '+(a.body||a.content||'')));
}

// スレッド表示＋既読処理＋返信
async function loadThread(peerId, quiet){
  curPeer=String(peerId); bumpIdle();
  if(!quiet) $('mbody').innerHTML='<div class="empty">読み込み中…</div>';
  var d=await api('/api/chat/dm/'+encodeURIComponent(peerId));
  var msgs=(d&&(d.messages||d.items))||[];
  var name=(d&&d.peer&&d.peer.display_name)||'';
  var mine=ME&&ME.uid, readIds=[];
  var body=msgs.map(function(m){
    var isMine=String(m.sender_id)===String(mine);
    if(!isMine && m.id) readIds.push(m.id);
    return '<div style="margin:8px 0;text-align:'+(isMine?'right':'left')+'"><div style="display:inline-block;max-width:82%;padding:12px 16px;border-radius:16px;font-size:20px;line-height:1.5;text-align:left;background:'+(isMine?'#d1f0dd':'#eef2f7')+'">'+esc(m.content||'')+'</div></div>';
  }).join('') || '<div class="empty">まだ メッセージは ありません。</div>';
  $('mbody').innerHTML='<div style="font-weight:900;font-size:20px;margin-bottom:8px">'+esc(name)+' さん</div>'+
    '<div id="thread" style="max-height:44vh;overflow:auto;padding:4px;background:#fafcff;border-radius:12px">'+body+'</div>'+
    '<div style="display:flex;gap:8px;margin-top:10px"><textarea class="big-in" id="rply" style="min-height:64px;font-size:22px" placeholder="返事を 書く"></textarea>'+
    '<button class="btn-go" style="width:auto;padding:14px 20px;margin:0;flex:0 0 auto" onclick="sendDm()">送信</button></div>'+
    '<button class="btn-close" style="margin-top:10px" onclick="openMsg()">← 一覧に 戻る</button>';
  if(readIds.length){ api('/api/chat/read',{method:'POST',json:{message_ids:readIds}}); refreshBadges(); }
  var th=$('thread'); if(th) th.scrollTop=th.scrollHeight;
  if(!quiet){ var py=ROSTER_YOMI[String(peerId)]||name; speak(name+'さんとの メッセージです。返事も 書けます。', null, py+'さんとの メッセージです。返事も 書けます。'); }
}
function sendDm(){
  bumpIdle();
  var el=$('rply'); var t=(el&&el.value||'').trim();
  if(!t||!curPeer) return;
  if(socket){ try{ socket.emit('chat:dm',{to:curPeer, content:t}); }catch(e){} }
  var th=$('thread'); if(th){ th.insertAdjacentHTML('beforeend','<div style="margin:8px 0;text-align:right"><div style="display:inline-block;max-width:82%;padding:12px 16px;border-radius:16px;font-size:20px;line-height:1.5;text-align:left;background:#d1f0dd">'+esc(t)+'</div></div>'); th.scrollTop=th.scrollHeight; }
  if(el) el.value='';
}

  });
}
// スケール説明の頻度: 今週(〜2026-07-19)は毎回、来週からは各ドライバー週1回(その週の初回)だけ。
function scaleWeekStart(d){ var day=(d.getDay()+6)%7; var m=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day);
  return m.getFullYear()+'-'+('0'+(m.getMonth()+1)).slice(-2)+'-'+('0'+m.getDate()).slice(-2); }
function shouldSpeakScale(){
  var now=new Date();
  var today=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2);
  if(today<='2026-07-19') return true;   // 今週は毎日
  try{ var uid=(ME&&ME.id)||'x'; var key='kikoScaleWk_'+uid; var wk=scaleWeekStart(now);
       if(localStorage.getItem(key)===wk) return false;   // 今週分は既読
       localStorage.setItem(key,wk); return true;
  }catch(e){ return true; }
}
// つかれ/からだの 0〜10 の読み方を葵が説明(新基準「ふだん=5」の周知)。
function speakFatScale(done){
  bumpIdle(); aoiSetClip('talk');
  speak('疲労と体調は、普段を5として選んでください。いつも通りなら5、楽なら5より下、つらい時は5より上の数字を選んでください。', done);
}
var _myAlerts=[];
// 当日の運転アラート(本人分)を取得。managerでなくても本人分のみ返る専用API。
async function loadMyAlerts(){
  _myAlerts=[];
  try{ var d=await api('/api/alert/mine'); if(d&&d.alerts) _myAlerts=d.alerts; }catch(e){}
  return _myAlerts;
}
// 帰庫当日に運転アラートがあった対象ドライバーへ、葵が やさしく一言 触れる(叱責でなく安全への気づかい)。
function speakMyAlert(done){
  done=done||function(){};
  if(!_myAlerts||!_myAlerts.length){ done(); return; }
  var n=_myAlerts.length;
  var line='ところで、今日は 運転の 注意アラートが '+n+'件 ありました。'
    +'長時間の 運転で お疲れの ことと 思います。次の 乗務も、車間と スピードに 気をつけて、安全運転で お願いしますね。';
  aoiSetClip('caution'); speak(line, done);
}
// 0〜10スケール(つかれ/からだ)。5=いつも通り、10=げんかい。5以下=平常(緑)→上振れで黄→橙→赤。
function fatColor(n){
  if(n<=5) return 'background:#dcfce7;border-color:#86efac;color:#065f46';
  if(n<=7) return 'background:#fef9c3;border-color:#fde047;color:#854d0e';
  if(n<=8) return 'background:#ffedd5;border-color:#fdba74;color:#9a3412';
  return 'background:#fee2e2;border-color:#fca5a5;color:#991b1b';
}
function kikoScale(key,title,lead){
  var b='';
  for(var n=0;n<=10;n++){ b+='<button class="fat-btn" id="fat-'+key+'-'+n+'" style="'+fatColor(n)+'" onclick="fatPick(\''+key+'\','+n+')">'+n+'</button>'; }
  return '<div class="kiko-sec"><div class="kiko-q">'+title+'</div>'
    +'<div class="fat-lead">'+lead+'</div>'
    +'<div class="fat-grid">'+b+'</div>'
    +'<div class="fat-ends"><span>0 = 大丈夫</span><span>5 = 普段通り</span><span>10 = 限界</span></div></div>';
}
// 数字タップは音声反応なし(0〜11回喋ると うるさいため)。送信後の葵コメントでまとめてねぎらう。
function fatPick(key,n){
  bumpIdle(); kikoAns[key]=n;
  for(var i=0;i<=10;i++){ var el=$('fat-'+key+'-'+i); if(el) el.classList.toggle('sel', i===n); }
}
function kikoPick(el,key,val){
  bumpIdle(); kikoAns[key]=val;
  var grp=el.parentNode.querySelectorAll('.kiko-opt'); for(var i=0;i<grp.length;i++) grp[i].classList.remove('sel');
  el.classList.add('sel');
  if(key==='operation_issue'){ var n=$('kiko-opnote'); if(n) n.style.display=val?'block':'none'; }
  if(key==='hiyari'){ var hn=$('kiko-hiyanote'); if(hn) hn.style.display=val?'block':'none'; }
  // 荷待ちの現場名は「30分以上かかったとき」だけ聞く(短い日は入力させない)
  if(key==='wait'){ var wn=$('kiko-waitnote'); if(wn) wn.style.display=(val==='none')?'none':'block'; }
  if(key==='pain'){ var pn=$('kiko-painnote'); if(pn) pn.style.display=(val==='none')?'none':'block'; }
  if(key==='symptom'){ var sn=$('kiko-symnote'); if(sn) sn.style.display=(val==='none')?'none':'block'; }
  kikoReact(key,val);   // 選択に合わせて葵が表情(喜怒哀楽クリップ)＋ひとことで反応=感情豊かに
}
// 帰庫点呼の各選択への葵の反応。表情クリップを切り替えてから短いセリフを喋る(口パク=クリップの口の動きと一緒に出る)。
function kikoReact(key,val){
  var clip='talk', line='';
  if(key==='alcohol_detected'){
    if(val){ clip='caution'; line='アルコールが検出されました。運転はできません。直ちに管理者へお知らせします。'; }
    else { clip='praise'; line='アルコールは検知なし。安心しました。'; }
  } else if(key==='operation_issue'){
    // ラベルは職種で違う(運行の状況 / 設備・荷 / 設備・製品)ので、セリフも合わせる
    var ek=kikoKind();
    if(val){ clip='concern'; line=(ek==='driver'?'運行で異常があったのですね。':'異常が あったのですね。')+'下の欄に内容を入力してください。'; }
    else { clip='thanks'; line=(ek==='driver'?'運行も問題なし。':'異常なし、ですね。')+'本日もお疲れさまでした。'; }
  } else if(key==='pain'){
    if(val==='hard'){ clip='concern'; line='つらい痛みですね。無理を なさらないでください。管理者にも お伝えします。'; }
    else if(val==='mild'){ clip='listen'; line='痛みが 出ているのですね。今夜は 温めて、ゆっくり 休んでください。'; }
    else { return; }
  } else if(key==='symptom'){
    if(val==='none'){ return; }
    clip='concern'; line='体調に 変わりが あったのですね。管理者に お伝えします。無理を なさらないでください。';
  } else if(key==='overtime'){
    if(val==='gt2'){ clip='listen'; line='今日は 長い時間でしたね。おつかれさまでした。'; }
    else { return; }
  } else if(key==='eye'){
    if(val==='hard'){ clip='listen'; line='目や 肩が つらいときは、少し 目を 休めて、肩を 回してみてください。'; }
    else { return; }
  } else if(key==='hiyari'){
    // ⚠️ヒヤリハットは「言ってくれてありがとう」で受ける。責める言い方は絶対にしない(報告が止まる)。
    if(val){ clip='listen'; line='教えてくださって ありがとうございます。下の欄に、どんな場面だったか お願いします。'; }
    else { return; }   // 「なかった」は淡々と(反応なし=喋りすぎ防止)
  } else if(key==='wait'){
    if(val==='gt60'){ clip='concern'; line='1時間以上の 荷待ちでしたか。おつかれさまでした。記録しておきます。'; }
    else if(val==='lt60'){ clip='listen'; line='荷待ちの時間、記録しておきます。'; }
    else { return; }
  } else if(key==='fatigue'){
    if(val==='very_tired'){ clip='concern'; line='かなりお疲れですね。今日はご無理をなさらないでください。'; }
    else if(val==='tired'){ clip='listen'; line='少しお疲れですね。ゆっくり休んでください。'; }
    else { clip='greet'; line='お元気そうで何よりです。'; }
  } else { return; }
  aoiSetClip(clip); speak(line);
}
var _kikoNotice='';
// 管理者が入力した帰庫点呼のお知らせ(専用テキスト)を取得して表示。読み上げ文を返す。
async function loadKikoNews(){
  var box=$('kiko-news'); if(!box) return '';
  var txt='';
  try{ var d=await api('/api/tenko/kiko/notice'); txt=(d&&d.notice)?String(d.notice).trim():''; }catch(e){}
  _kikoNotice=txt;
  if(!txt){ box.innerHTML='<div style="color:#94a3b8;font-size:16px">本日のお知らせはありません。</div>'; return ''; }
  box.innerHTML='<div style="white-space:pre-wrap;font-size:18px;line-height:1.6;background:#fffdf3;border:1px solid #fde68a;border-radius:12px;padding:12px">'+esc(txt)+'</div>'
    +'<button class="btn-go btn-sub" style="margin-top:10px" onclick="speakKikoNotice()">🔊 もう一度聴く</button>';
  return txt;
}
// 葵が管理者からのお知らせを読み上げる(文章を読まない社員向け)
function speakKikoNotice(){ if(_kikoNotice){ bumpIdle(); aoiSetClip('talk'); speak('管理者からのお知らせです。'+_kikoNotice); } }
async function submitKiko(){
  bumpIdle();
  var kind=kikoKind(), v=($('kiko-note')||{}).value||'';
  // 職種ごとの必須チェック(こころの調子だけ任意=とばせる)
  if(kind==='driver'){
    if(kikoAns.alcohol_detected===null){ speak('アルコールの結果を選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('運行状況を選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.wait===null){ speak('荷待ち・荷役の 時間を 選択してください。'); return; }
  } else if(kind==='warehouse'){
    if(kikoAns.pain===null){ speak('腰や 肩の 痛みを 選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('設備や 荷の 異常を 選択してください。'); return; }
  } else if(kind==='manufacturing'){
    if(kikoAns.symptom===null){ speak('作業中の 体調の 異変を 選択してください。'); return; }
    if(kikoAns.hiyari===null){ speak('ヒヤリハットが あったか どうかを 選択してください。'); return; }
    if(kikoAns.operation_issue===null){ speak('設備や 製品の 異常を 選択してください。'); return; }
  } else {
    if(kikoAns.overtime===null){ speak('今日の 時間外を 選択してください。'); return; }
    if(kikoAns.eye===null){ speak('目や 肩の 疲れを 選択してください。'); return; }
  }
  if(kikoAns.fatigue===null){ speak('疲労度を数字で選択してください。'); return; }
  if(kikoAns.body===null){ speak('体調を数字で選択してください。'); return; }
  // ⚠️アルコールチェックはドライバーのみ。他職種は alcohol_used=0 で送り、一覧では「—」と出す
  //   (0を送ると「検知なし＝測った」と誤読されるため)。
  var body={ alcohol_used:(kind==='driver'?1:0), alcohol_detected:kikoAns.alcohol_detected?1:0, operation_issue:kikoAns.operation_issue?1:0,
    job_kind:kind, fatigue_score:kikoAns.fatigue, body_score:kikoAns.body,
    hiyari:kikoAns.hiyari?1:0, hiyari_note:(kikoAns.hiyari?(($('kiko-hiyanote')||{}).value||''):''),
    wait_level:(kind==='driver'?kikoAns.wait:null), wait_note:((kind==='driver'&&kikoAns.wait!=='none')?(($('kiko-waitnote')||{}).value||''):''),
    // 職種固有の回答(サーバーは extra_json にそのまま保存)
    pain:kikoAns.pain, pain_note:((kikoAns.pain&&kikoAns.pain!=='none')?(($('kiko-painnote')||{}).value||''):''),
    symptom:kikoAns.symptom, symptom_note:((kikoAns.symptom&&kikoAns.symptom!=='none')?(($('kiko-symnote')||{}).value||''):''),
    overtime:kikoAns.overtime, eye:kikoAns.eye, mind_score:kikoAns.mind,
    operation_note:(($('kiko-opnote')||{}).value||''), note:v };
  var r=await api('/api/tenko/kiko',{method:'POST',json:body});
  if(r&&r.success){
    logUsage(kind==='driver'?'done:帰庫点呼':'done:帰る前のチェック');
    if(kikoAns.alcohol_detected||kikoAns.operation_issue){
      // 異常あり=管理者の指示が最優先。通達の確認は挟まない。
      doneScreen('送信しました','管理者に直ちに連絡しました。指示をお待ちください。','concern');
    } else {
      // 帰庫点呼も健康・運行の申告だけで終わらせず、未読の通達/連絡を確認してから終わる。
      briefingStep(function(){
        doneScreen('本日もお疲れさまでした',
          (r.aoi_comment||((kind==='driver'?'帰庫点呼':'帰る前の チェック')+'を記録しました。本日もお疲れさまでした。')),'thanks');
      }, '📋 帰る前の確認', '帰る前に', true);
    }
  } else { speak('送信に失敗しました。もう一度お試しください。'); }
}
// 帰庫時の ねぎらい＋健康ワンポイント(体調に合わせて葵が読み上げる)
function kikoHealthTip(fatigue){
  if(fatigue==='very_tired') return 'かなりお疲れのようです。今夜は早めに休んで、しっかり睡眠を取ってください。運行管理者にもお伝えしました。';
  if(fatigue==='tired') return '少しお疲れのようですね。ぬるめのお風呂で体をほぐし、水分も取りましょう。';
  var tips=['水分をコップ1杯取って、ひと息つきましょう。','首と肩をゆっくり回して、体をほぐしましょう。','今夜は少し早めに休んで、しっかり睡眠を取りましょう。','ゆっくり深呼吸を3回。疲れをリセットしましょう。','夕食は野菜からよく噛んで食べると体に優しいです。'];
  return tips[Math.floor(Math.random()*tips.length)];
}
function doneScreen(title, sub, emotion){
  aoiSetClip(emotion||'praise');
  var tail;
  if(IS_KIOSK){
    // 共用タブレット: 次の人のため、使い終わったら必ずログアウト。
    tail='<div class="q" style="font-size:24px;color:#b91c1c">使い終わったら 必ず<br>「ログアウト」を 押してください。</div>'+
      '<button class="btn-go" style="background:#dc2626;box-shadow:0 5px 0 #a41a1a" onclick="doLogout(true)">ログアウトする</button>'+
      '<button class="btn-go btn-sub" onclick="closeModal()">続ける（他もやる）</button>';
  } else {
    // 個人スマホ: 自分の端末なのでログアウト強制はしない。メニューに戻るだけ。
    tail='<button class="btn-go" onclick="closeModal()">メニューに 戻る</button>';
  }
  $('mbody').innerHTML='<div class="done-wrap"><div class="big">✅ '+esc(title)+'</div>'+
    '<div class="q" style="font-size:24px">'+esc(sub)+'</div>'+tail+'</div>';
  speak(title+' '+sub+(IS_KIOSK?' 使い終わったら、必ず ログアウトを 押してください。':''));
}

/* ===== ログアウト ＋ 無操作オートログアウト ===== */
async function doLogout(farewell){
  _firstDone=true;   // 挨拶の後追い発火を止める
  if(curAudio){ try{ curAudio.pause(); }catch(e){} }
  if(farewell){ // 退出時は葵が会釈して見送る
    try{ aoiSetClip('bow'); await new Promise(function(res){ var d=false,fin=function(){ if(d)return; d=true; res(); }; speak('お疲れ様でした。ご安全に。', fin); setTimeout(fin, 3500); }); }catch(e){}
  }
  try{ if(socket) socket.disconnect(); }catch(e){}
  try{ await fetch('/api/auth/logout',{method:'POST',headers:{'Authorization':'Bearer '+TOKEN}}); }catch(e){}
  ['cohub_token','cohub_user','cohub_kiosk','cohub_kiosk_token'].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} });
  // 共用タブレットは表示モードの好み・言語を端末に残さない(次の利用者へ波及させない)。個人スマホは好みを維持。
  if(IS_KIOSK){ try{ localStorage.removeItem('cohub_view_pref'); localStorage.removeItem('cohub_lang'); }catch(e){} }
  try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('cohub_draft_')===0) localStorage.removeItem(k); }); }catch(e){}
  // キオスクは共用ログイン画面(/tablet)へ、個人スマホは通常ログイン(/)へ。
  location.replace(IS_KIOSK ? '/tablet' : '/');
}
var idleTimer=null;
// 無操作オートログアウトは共用タブレット(キオスク)のみ。個人スマホは自分の端末なので勝手にログアウトしない。
function bumpIdle(){ if(!IS_KIOSK) return; if(idleTimer)clearTimeout(idleTimer); idleTimer=setTimeout(function(){ doLogout(); }, 3*60*1000); }
['click','touchstart','keydown'].forEach(function(ev){ document.addEventListener(ev, bumpIdle, {passive:true}); });

init();
