<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoWell 全フロアビュー</title>
<link rel="manifest" href="/manifest.json">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; color: #e2e8f0; font-family: 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 8px 16px; background: #1e293b; border-bottom: 1px solid #334155;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.04em; }
  header .sub { font-size: 11px; color: #94a3b8; }
  header .spacer { flex: 1; }
  header .stat { font-size: 12px; color: #cbd5e1; margin-right: 14px; }
  header .stat b { color: #fbbf24; }
  header a, header button {
    color: #93c5fd; background: transparent; border: 1px solid #475569; border-radius: 6px;
    padding: 4px 10px; font-size: 12px; text-decoration: none; cursor: pointer;
  }
  header a:hover, header button:hover { background: #334155; }
  #grid {
    flex: 1; display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px; padding: 8px; overflow: hidden; min-height: 0;
  }
  .floor-card.building-office { border-left: 4px solid #3b82f6; }
  .floor-card.building-field { border-left: 4px solid #ea580c; }
  .floor-card {
    background: #1e293b; border: 1px solid #334155; border-radius: 6px;
    overflow: hidden; position: relative; display: flex; flex-direction: column;
    flex: 1 1 0; min-height: 0;
  }
  .floor-head {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 8px; background: #0f172a; font-size: 11px;
    flex-shrink: 0;
  }
  .floor-head .fname { font-weight: 700; }
  .floor-head .count { margin-left: auto; color: #fbbf24; font-weight: 700; }
  .floor-head .lock { color: #f87171; }
  .floor-canvas-wrap {
    flex: 1; min-height: 0; position: relative;
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; overflow: hidden;
  }
  .floor-canvas-wrap canvas {
    max-width: 100%; max-height: 100%;
    aspect-ratio: 1344/768;
    display: block;
  }
  .floor-canvas-wrap .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #64748b; pointer-events: none;
  }
  #login-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.96); z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }
  #login-overlay .box {
    background: #1e293b; padding: 30px 40px; border-radius: 12px; min-width: 300px;
    border: 1px solid #334155;
  }
  #login-overlay h2 { margin: 0 0 18px; font-size: 16px; }
  #login-overlay input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px; border-radius: 6px;
    border: 1px solid #475569; background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  #login-overlay button {
    width: 100%; padding: 10px; border-radius: 6px; border: 0;
    background: #3b82f6; color: #fff; font-weight: 700; cursor: pointer; font-size: 14px;
  }
  #login-overlay button:hover { background: #2563eb; }
  #login-overlay .err { color: #f87171; font-size: 12px; min-height: 16px; margin-top: 8px; }
  @media (max-width: 1400px) {
    #grid { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(4, 1fr); }
  }
  @media (max-width: 700px) {
    #grid { grid-template-columns: 1fr; grid-template-rows: repeat(8, minmax(120px, 1fr)); overflow: auto; }
  }
</style>
<script src="/font-zoom.js?v=20260728d" defer></script>
</head>
<body>
<header>
  <h1>🗺 CoWell 全フロアビュー</h1>
  <span class="sub">自動更新 3秒</span>
  <span class="spacer"></span>
  <span class="stat">合計 <b id="total-online">-</b> 名在席</span>
  <span class="stat">更新: <span id="last-update">-</span></span>
  <button onclick="goBackHome()" style="background:rgba(255,255,255,0.22);border:1px solid rgba(255,255,255,0.5);color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;">✕ 閉じる</button>
  <script>function goBackHome(){var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||'');if(history.length>1){history.back();}else{location.href=m?'/m':'/';}}</script>
  <button id="btn-fullscreen" title="全画面表示">⛶ 全画面</button>
</header>
<div id="grid"></div>

<div id="login-overlay" style="display:none;">
  <div class="box">
    <h2>ログインが必要です</h2>
    <input id="login-id" type="text" placeholder="ログインID" autocomplete="username">
    <input id="login-pw" type="password" placeholder="パスワード" autocomplete="current-password">
    <button onclick="doLogin()">ログイン</button>
    <div class="err" id="login-err"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('cohub_token') || '';
let floors = [];
let users = [];
const avatarCache = {};  // url -> Image
let timerId = null;

function showLogin() {
  document.getElementById('login-overlay').style.display = 'flex';
  const saved = localStorage.getItem('cohub_login_id');
  if (saved) document.getElementById('login-id').value = saved;
}
function hideLogin() { document.getElementById('login-overlay').style.display = 'none'; }

async function doLogin() {
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  if (!id || !pw) { err.textContent = 'ID/PW必須'; return; }
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ login_id: id, password: pw }),
    });
    const d = await r.json();
    if (!d.success) { err.textContent = d.msg || 'ログイン失敗'; return; }
    token = d.token;
    localStorage.setItem('cohub_token', token);
    localStorage.setItem('cohub_user', JSON.stringify(d.user));
    localStorage.setItem('cohub_login_id', id);
    hideLogin();
    start();
  } catch (e) { err.textContent = '通信エラー'; }
}

function buildLayout() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  // 事務所棟 → 現場棟の順で並べる (建物でソート)
  const sorted = [...floors].sort((a, b) => {
    const ba = a.building === 'field' ? 1 : 0;
    const bb = b.building === 'field' ? 1 : 0;
    if (ba !== bb) return ba - bb;
    return (a.sort_order || 0) - (b.sort_order || 0);
  });
  for (const f of sorted) {
    const card = document.createElement('div');
    card.className = 'floor-card building-' + (f.building === 'field' ? 'field' : 'office');
    card.dataset.code = f.code;
    card.innerHTML = `
      <div class="floor-head">
        <span>${f.icon || ''}</span>
        <span class="fname">${escapeHtml(f.name)}</span>
        ${f.locked ? '<span class="lock">🔒</span>' : ''}
        ${f.approval_mode ? '<span class="lock">🔔</span>' : ''}
        <span class="count" data-count>0</span>
      </div>
      <div class="floor-canvas-wrap">
        <canvas data-canvas width="1344" height="768"></canvas>
        <div class="empty" data-empty>誰もいません</div>
      </div>
    `;
    grid.appendChild(card);
  }
}

function escapeHtml(s) {
  return String(s || '').replace(/[<>"&]/g, c => ({'<':'&lt;','>':'&gt;','"':'&quot;','&':'&amp;'})[c]);
}

// ===== 模式図 (フロアプラン) =====
const SCHEMATIC_THEME = {
  office: { bg: '#eef2f7', wall: '#94a3b8', room: '#ffffff', accent: '#3b82f6', label: '#334155' },
  field:  { bg: '#fff7ed', wall: '#a8a29e', room: '#ffffff', accent: '#ea580c', label: '#7c2d12' },
};

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function roomBox(ctx, x, y, w, h, fill, stroke) {
  roundRect(ctx, x, y, w, h, 14);
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = stroke; ctx.lineWidth = 3; ctx.stroke();
}
function drawLabel(ctx, text, x, y, size, color) {
  ctx.font = `700 ${size}px "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, x, y);
}
function drawDesk(ctx, cx, cy) {
  const w = 70, h = 48;
  roundRect(ctx, cx - w / 2, cy - h / 2, w, h, 6);
  ctx.fillStyle = '#dbeafe'; ctx.fill();
  ctx.strokeStyle = '#64748b'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy + h / 2 + 10, 8, 0, Math.PI * 2);
  ctx.fillStyle = '#cbd5e1'; ctx.fill();
}
function drawChair(ctx, cx, cy, dir) {
  ctx.beginPath(); ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#94a3b8'; ctx.fill();
}
function drawShelf(ctx, x, y, w, h) {
  roundRect(ctx, x, y, w, h, 4);
  ctx.fillStyle = '#fcd34d'; ctx.fill();
  ctx.strokeStyle = '#a16207'; ctx.lineWidth = 2; ctx.stroke();
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    const yy = y + (h / 4) * i;
    ctx.beginPath(); ctx.moveTo(x + 4, yy); ctx.lineTo(x + w - 4, yy); ctx.stroke();
  }
}

const SCHEMATICS = {
  lobby(ctx, W, H) {
    const t = SCHEMATIC_THEME.office;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    // 外壁
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // エレベーター (左壁)
    roomBox(ctx, 80, 180, 130, 220, '#e5e7eb', '#64748b');
    drawLabel(ctx, '🛗 EV', 145, 290, 28, '#475569');
    // 受付カウンター (中央)
    roomBox(ctx, 480, 320, 380, 120, '#fef3c7', '#d97706');
    drawLabel(ctx, '🛎 受付カウンター', 670, 380, 32, '#92400e');
    // ソファセット (右)
    roomBox(ctx, 1000, 200, 260, 120, '#dbeafe', '#3b82f6');
    drawLabel(ctx, 'ソファ', 1130, 260, 26, '#1e40af');
    roomBox(ctx, 1000, 360, 260, 120, '#dbeafe', '#3b82f6');
    drawLabel(ctx, 'ソファ', 1130, 420, 26, '#1e40af');
    // 入口 (下中央)
    roomBox(ctx, 540, 660, 260, 70, '#fee2e2', '#dc2626');
    drawLabel(ctx, '🚪 玄関', 670, 695, 30, '#991b1b');
    // フロア名
    drawLabel(ctx, '1F 玄関ロビー', 670, 100, 36, t.label);
  },
  office(ctx, W, H) {
    const t = SCHEMATIC_THEME.office;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // ハドル席 (右上 1050-1300, 70-260)
    roomBox(ctx, 1000, 70, 280, 200, '#ecfeff', '#0891b2');
    drawLabel(ctx, '🎙 ハドル席', 1140, 170, 26, '#0e7490');
    // デスク3×5 (中央〜左)
    const startX = 200, startY = 180, dx = 170, dy = 160;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 5; c++) {
        drawDesk(ctx, startX + c * dx, startY + r * dy);
      }
    }
    drawLabel(ctx, '💼 執務エリア (デスク15席)', 500, 700, 24, t.label);
    // 複合機・棚 (右下)
    roomBox(ctx, 1030, 520, 220, 80, '#fef3c7', '#d97706');
    drawLabel(ctx, '📠 複合機', 1140, 560, 22, '#92400e');
    roomBox(ctx, 1030, 610, 220, 80, '#e0e7ff', '#6366f1');
    drawLabel(ctx, '📚 キャビネット', 1140, 650, 22, '#3730a3');
    drawLabel(ctx, '2F 事務フロア', 650, 100, 36, t.label);
  },
  meeting_a(ctx, W, H) {
    const t = SCHEMATIC_THEME.office;
    ctx.fillStyle = '#fef3c7'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#854d0e'; ctx.lineWidth = 10;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 大型ディスプレイ (上)
    roomBox(ctx, 400, 110, 544, 80, '#111827', '#000');
    drawLabel(ctx, '🖥 ディスプレイ', 672, 150, 26, '#f1f5f9');
    // U字テーブル (マホガニー)
    ctx.fillStyle = '#78350f';
    roundRect(ctx, 300, 260, 744, 60, 10); ctx.fill();  // 上辺
    roundRect(ctx, 300, 320, 60, 280, 10); ctx.fill();  // 左辺
    roundRect(ctx, 984, 320, 60, 280, 10); ctx.fill();  // 右辺
    // 椅子 12席
    const chairColor = '#1f2937';
    for (let i = 0; i < 5; i++) { drawChair(ctx, 380 + i * 150, 250, 'up'); }
    for (let i = 0; i < 3; i++) { drawChair(ctx, 280, 360 + i * 80, 'left'); }
    for (let i = 0; i < 3; i++) { drawChair(ctx, 1064, 360 + i * 80, 'right'); }
    drawLabel(ctx, '3F 役員室', 672, 680, 36, '#78350f');
  },
  meeting_b(ctx, W, H) {
    const t = SCHEMATIC_THEME.office;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 楕円テーブル
    ctx.beginPath();
    ctx.ellipse(W / 2, H / 2, 280, 130, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#7c2d12'; ctx.fill();
    ctx.strokeStyle = '#431407'; ctx.lineWidth = 3; ctx.stroke();
    // 椅子 6席
    const cx = W / 2, cy = H / 2;
    const chairs = [
      [cx, cy - 180], [cx, cy + 180],
      [cx - 310, cy - 70], [cx - 310, cy + 70],
      [cx + 310, cy - 70], [cx + 310, cy + 70],
    ];
    for (const [x, y] of chairs) drawChair(ctx, x, y);
    drawLabel(ctx, '3F 会議室B', 672, 100, 36, t.label);
    drawLabel(ctx, '6席', cx, cy, 34, '#fef3c7');
  },
  wellness_room(ctx, W, H) {
    ctx.fillStyle = '#ecfdf5'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 受付デスク (上)
    roomBox(ctx, 400, 110, 544, 80, '#d1fae5', '#059669');
    drawLabel(ctx, '🩺 保健師 / 産業医', 672, 150, 26, '#064e3b');
    // 診察スペース (中央左)
    roomBox(ctx, 120, 240, 400, 280, '#ffffff', '#10b981');
    drawLabel(ctx, '🩻 健康測定', 320, 340, 30, '#047857');
    drawLabel(ctx, '(血圧・体組成)', 320, 390, 22, '#059669');
    // 面談ブース (中央右)
    roomBox(ctx, 560, 240, 380, 280, '#ffffff', '#10b981');
    drawLabel(ctx, '💬 面談ブース', 750, 340, 30, '#047857');
    drawLabel(ctx, '(メンタル相談)', 750, 390, 22, '#059669');
    // CoWell端末 (右)
    roomBox(ctx, 980, 240, 280, 280, '#fef3c7', '#d97706');
    drawLabel(ctx, '💻 CoWell', 1120, 340, 30, '#92400e');
    drawLabel(ctx, '端末', 1120, 390, 22, '#b45309');
    drawLabel(ctx, '🏥 健康管理室', 672, 680, 32, '#064e3b');
  },
  meeting_c(ctx, W, H) {
    const t = SCHEMATIC_THEME.office;
    ctx.fillStyle = '#f1f5f9'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#334155'; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // スクリーン (上)
    roomBox(ctx, 420, 110, 504, 70, '#e2e8f0', '#64748b');
    drawLabel(ctx, '🎦 スクリーン', 672, 145, 26, '#334155');
    // 大U字
    ctx.fillStyle = '#475569';
    roundRect(ctx, 230, 230, 884, 50, 8); ctx.fill();
    roundRect(ctx, 230, 280, 50, 340, 8); ctx.fill();
    roundRect(ctx, 1064, 280, 50, 340, 8); ctx.fill();
    // 椅子を多数 (30席相当)
    for (let i = 0; i < 11; i++) drawChair(ctx, 280 + i * 80, 210);
    for (let i = 0; i < 8; i++) drawChair(ctx, 210, 310 + i * 40);
    for (let i = 0; i < 8; i++) drawChair(ctx, 1134, 310 + i * 40);
    drawLabel(ctx, '3F 大会議室 (30席)', 672, 680, 32, '#334155');
  },
  field_rest(ctx, W, H) {
    const t = SCHEMATIC_THEME.field;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 丸テーブル3つ
    const tables = [[320, 340], [672, 340], [1024, 340]];
    for (const [cx, cy] of tables) {
      ctx.beginPath(); ctx.arc(cx, cy, 90, 0, Math.PI * 2);
      ctx.fillStyle = '#fde68a'; ctx.fill();
      ctx.strokeStyle = '#a16207'; ctx.lineWidth = 3; ctx.stroke();
      // 椅子4つ
      drawChair(ctx, cx, cy - 120);
      drawChair(ctx, cx, cy + 120);
      drawChair(ctx, cx - 120, cy);
      drawChair(ctx, cx + 120, cy);
    }
    // ロッカー (上部)
    roomBox(ctx, 200, 80, 944, 80, '#fef3c7', '#92400e');
    drawLabel(ctx, '🚪 ロッカー', 672, 120, 26, '#7c2d12');
    // 自販機 (右下)
    roomBox(ctx, 1100, 560, 140, 140, '#dbeafe', '#2563eb');
    drawLabel(ctx, '🥤', 1170, 620, 48, '#1e3a8a');
    drawLabel(ctx, '自販機', 1170, 670, 18, '#1e3a8a');
    drawLabel(ctx, '☕ 乗務員詰所', 500, 700, 28, t.label);
  },
  field_work(ctx, W, H) {
    const t = SCHEMATIC_THEME.field;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 棚群 (左半分)
    for (let i = 0; i < 4; i++) {
      drawShelf(ctx, 100 + i * 140, 120, 100, 420);
    }
    // ピッキングゾーン (中央)
    roomBox(ctx, 700, 140, 240, 340, '#dcfce7', '#16a34a');
    drawLabel(ctx, '📦 ピッキング', 820, 310, 24, '#14532d');
    // 荷捌き (右)
    roomBox(ctx, 970, 140, 290, 260, '#dbeafe', '#2563eb');
    drawLabel(ctx, '🚚 荷捌き', 1115, 270, 28, '#1e3a8a');
    // 搬入出口 (下)
    roomBox(ctx, 700, 600, 560, 100, '#fee2e2', '#dc2626');
    drawLabel(ctx, '🚛 搬入出口', 980, 650, 30, '#991b1b');
    drawLabel(ctx, '📦 倉庫作業室', 350, 680, 28, t.label);
  },
  field_meet(ctx, W, H) {
    const t = SCHEMATIC_THEME.field;
    ctx.fillStyle = t.bg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = t.wall; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 朝礼台 (上)
    roomBox(ctx, 530, 100, 284, 70, '#fed7aa', '#c2410c');
    drawLabel(ctx, '📋 朝礼台', 672, 135, 26, '#7c2d12');
    // 円形整列マーク
    ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]);
    ctx.beginPath(); ctx.ellipse(W / 2, 460, 430, 210, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    drawLabel(ctx, '整列エリア', W / 2, 460, 30, '#9a3412');
    drawLabel(ctx, '📢 現場ミーティング', 672, 700, 28, t.label);
  },
  field_accident(ctx, W, H) {
    // 事故対策室: 緊急対応の赤系テーマ
    ctx.fillStyle = '#fef2f2'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#b91c1c'; ctx.lineWidth = 8;
    ctx.strokeRect(40, 40, W - 80, H - 80);
    // 上部: 事故掲示ボード (大型ホワイトボード)
    roomBox(ctx, 360, 100, 624, 90, '#ffffff', '#dc2626');
    drawLabel(ctx, '🚨 事故レビュー掲示', 672, 150, 26, '#991b1b');
    // 中央: 対策会議テーブル (長方形)
    ctx.fillStyle = '#7c2d12';
    roundRect(ctx, 360, 280, 624, 220, 10); ctx.fill();
    ctx.strokeStyle = '#431407'; ctx.lineWidth = 3; ctx.stroke();
    drawLabel(ctx, '🛠 再発防止検討テーブル', 672, 390, 24, '#fef3c7');
    // 椅子 8席 (上下4×2)
    for (let i = 0; i < 4; i++) drawChair(ctx, 420 + i * 180, 270);
    for (let i = 0; i < 4; i++) drawChair(ctx, 420 + i * 180, 510);
    // 左: 事故記録キャビネット
    roomBox(ctx, 100, 240, 220, 280, '#fee2e2', '#dc2626');
    drawLabel(ctx, '🗂 事故記録', 210, 360, 24, '#991b1b');
    drawLabel(ctx, '保管庫', 210, 400, 20, '#b91c1c');
    // 右: 緊急連絡コーナー
    roomBox(ctx, 1024, 240, 220, 280, '#fef3c7', '#d97706');
    drawLabel(ctx, '📞 緊急', 1134, 350, 26, '#92400e');
    drawLabel(ctx, '連絡', 1134, 390, 26, '#92400e');
    // 下部ラベル
    drawLabel(ctx, '🚨 事故対策室', 672, 700, 30, '#991b1b');
  },
};

function drawFloorSchematic(ctx, code, W, H) {
  const fn = SCHEMATICS[code];
  if (fn) { fn(ctx, W, H); return; }
  // フォールバック: 枠だけ
  ctx.fillStyle = '#eef2f7'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 6;
  ctx.strokeRect(30, 30, W - 60, H - 60);
  drawLabel(ctx, code, W / 2, H / 2, 42, '#64748b');
}

function drawFloor(code) {
  const card = document.querySelector(`.floor-card[data-code="${code}"]`);
  if (!card) return;
  const canvas = card.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  // 模式図背景
  drawFloorSchematic(ctx, code, W, H);
  // 在席者
  const here = users.filter(u => u.floor === code);
  card.querySelector('[data-count]').textContent = here.length;
  card.querySelector('[data-empty]').style.display = here.length ? 'none' : 'flex';
  for (const u of here) {
    if (u.x == null || u.y == null) continue;
    const r = 56; // 大きめのアバター (縮小表示向け)
    // リングカラー
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 6, 0, Math.PI * 2);
    ctx.fillStyle = u.ring || '#64748b';
    ctx.fill();
    // 白リム
    ctx.beginPath();
    ctx.arc(u.x, u.y, r + 2, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    // アバターか頭文字
    const img = u.avatar ? loadAvatar(u.avatar) : null;
    if (img && img.complete && img.naturalWidth) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, u.x - r, u.y - r, r * 2, r * 2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(u.x, u.y, r, 0, Math.PI * 2);
      ctx.fillStyle = '#cbd5e1';
      ctx.fill();
      ctx.fillStyle = '#1e293b';
      ctx.font = 'bold 52px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText((u.name || '?').charAt(0), u.x, u.y + 4);
    }
    // 発話中の脈動
    if (u.speaking) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, r + 14, 0, Math.PI * 2);
      ctx.strokeStyle = '#22c55e';
      ctx.lineWidth = 4;
      ctx.stroke();
    } else if (u.voiceOn) {
      ctx.beginPath();
      ctx.arc(u.x, u.y, r + 10, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(34,197,94,0.4)';
      ctx.lineWidth = 3;
      ctx.stroke();
    }
    // モバイル接続バッジ (右下 📱)
    if (u.isMobile) {
      const bx = u.x + r - 6, by = u.y + r - 6;
      ctx.beginPath();
      ctx.arc(bx, by, 20, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = '700 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📱', bx, by + 1);
    }
    // 名前ラベル
    const label = u.name || '?';
    ctx.font = 'bold 24px "Hiragino Kaku Gothic ProN", sans-serif';
    const metrics = ctx.measureText(label);
    const pad = 10;
    const bw = metrics.width + pad * 2;
    const by = u.y + r + 14;
    ctx.fillStyle = 'rgba(15,23,42,0.85)';
    ctx.fillRect(u.x - bw / 2, by, bw, 32);
    ctx.fillStyle = '#f1f5f9';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, u.x, by + 16);
  }
}

function loadAvatar(url) {
  if (!url) return null;
  if (avatarCache[url]) return avatarCache[url];
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = url;
  img.onload = () => { try { drawAll(); } catch (e) {} };
  avatarCache[url] = img;
  return img;
}

function drawAll() {
  for (const f of floors) drawFloor(f.code);
  document.getElementById('total-online').textContent = users.length;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('last-update').textContent = `${hh}:${mm}:${ss}`;
}

async function fetchSnapshot() {
  try {
    const r = await fetch('/api/overview/snapshot', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    if (r.status === 401) {
      clearInterval(timerId);
      localStorage.removeItem('cohub_token');
      token = '';
      showLogin();
      return;
    }
    const d = await r.json();
    if (!d.success) return;
    const firstLoad = floors.length === 0;
    floors = d.floors || [];
    users = d.users || [];
    if (firstLoad) buildLayout();
    // ロック/approvalバッジが変わった可能性があるので毎回headを更新
    for (const f of floors) {
      const card = document.querySelector(`.floor-card[data-code="${f.code}"]`);
      if (card) {
        const head = card.querySelector('.floor-head');
        head.innerHTML = `
          <span>${f.icon || ''}</span>
          <span class="fname">${escapeHtml(f.name)}</span>
          ${f.locked ? '<span class="lock">🔒</span>' : ''}
          ${f.approval_mode ? '<span class="lock">🔔</span>' : ''}
          <span class="count" data-count>${users.filter(u => u.floor === f.code).length}</span>
        `;
      }
    }
    drawAll();
  } catch (e) { /* network blip ignored */ }
}

function start() {
  fetchSnapshot();
  clearInterval(timerId);
  timerId = setInterval(fetchSnapshot, 3000);
}

document.getElementById('btn-fullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
});

if (!token) showLogin();
else start();
</script>
