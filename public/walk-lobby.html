<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏁 Connect 222 ライブ — CoWell ロビー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; min-height: 100vh; overflow: hidden; }
body {
  font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', 'Noto Serif JP', serif;
  background: radial-gradient(ellipse at center, #f5e8c8 0%, #e6d3a3 70%, #c9ad6f 100%);
  color: #2b1d10;
}

.layout { display: grid; grid-template-rows: 84px 1fr 240px; height: 100vh; padding: 12px; gap: 12px; }

/* === Header === */
header { position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
  background: linear-gradient(135deg, #3a2a1a, #1a1108);
  color: #f4e8d0;
  border-radius: 6px;
  border: 2px solid #c9a14a;
  box-shadow: 0 4px 18px rgba(0,0,0,0.35), inset 0 0 30px rgba(201,161,74,0.1);
  font-family: 'Yu Mincho', '游明朝', 'Hiragino Mincho ProN', serif;
}
header .title-block { display: flex; align-items: center; gap: 14px; }
header .logo {
  height: 60px; width: 60px;
  background: #f4e8d0; padding: 4px; border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
header .title {
  font-size: 32px; font-weight: 900; letter-spacing: 4px;
  color: #f4e8d0; text-shadow: 0 0 12px rgba(201,161,74,0.5);
}
header .sub { font-size: 13px; opacity: 0.8; letter-spacing: 1px; color: #d4b87a; }
header .countdown {
  background: linear-gradient(135deg, #c44530, #8a2820);
  padding: 10px 20px; border-radius: 4px;
  font-size: 17px; font-weight: 800; letter-spacing: 2px;
  border: 1px solid #c9a14a;
  box-shadow: 0 2px 10px rgba(196,69,48,0.4);
  font-family: 'Yu Mincho', '游明朝', serif;
}

/* === Main area === */
.main-area { display: grid; grid-template-columns: 2.2fr 1fr; gap: 12px; min-height: 0; }

/* === Map card (Tokaido) === */
.map-card {
  position: relative;
  background:
    linear-gradient(rgba(244,232,208,0.05), rgba(244,232,208,0.05)),
    url('/assets/walk/tokaido_map_bg.png') center/cover no-repeat;
  background-color: #f4e8d0;
  border-radius: 6px;
  border: 3px double #8a6a3a;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 0 60px rgba(139,106,58,0.15);
  overflow: hidden;
}
.map-card .phase-label {
  position: absolute; top: 14px; left: 18px;
  background: rgba(43,29,16,0.85); color: #f4e8d0;
  padding: 6px 14px; border-radius: 3px;
  font-size: 13px; font-weight: 700; letter-spacing: 1px;
  border: 1px solid #c9a14a;
  z-index: 5;
}
.map-card .summary {
  position: absolute; bottom: 12px; left: 18px; right: 18px;
  display: flex; justify-content: space-between; pointer-events: none;
  font-size: 13px; font-weight: 800; z-index: 5;
}
.map-card .summary .std { color: #1e3a5f; text-shadow: 0 0 6px #f4e8d0, 0 0 6px #f4e8d0; }
.map-card .summary .sze { color: #047857; text-shadow: 0 0 6px #f4e8d0, 0 0 6px #f4e8d0; }
#route-map-big { position: absolute; inset: 0; width: 100%; height: 100%; }

/* === Ranking card (parchment) === */
.ranking-card {
  background:
    linear-gradient(rgba(244,232,208,0.92), rgba(244,232,208,0.92)),
    url('/assets/walk/tokaido_map_bg.png') center/cover no-repeat;
  border-radius: 6px;
  border: 3px double #8a6a3a;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25), inset 0 0 30px rgba(139,106,58,0.1);
  padding: 16px; overflow: hidden;
  display: flex; flex-direction: column;
}
.ranking-card h3 {
  font-size: 17px; font-weight: 800; letter-spacing: 3px;
  color: #2b1d10; margin-bottom: 12px;
  padding-bottom: 8px; border-bottom: 2px solid #8a6a3a;
  text-align: center;
  font-family: 'Yu Mincho', '游明朝', serif;
}
.rank-list { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow: hidden; }
.rank-row {
  display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center;
  padding: 7px 12px;
  background: rgba(255, 251, 240, 0.7);
  border-radius: 4px;
  border-left: 4px solid;
  border-top: 1px solid rgba(139,106,58,0.2);
  border-right: 1px solid rgba(139,106,58,0.2);
  border-bottom: 1px solid rgba(139,106,58,0.2);
}
.rank-row.std { border-left-color: #1e3a5f; }
.rank-row.sze { border-left-color: #047857; }
.rank-row .rank-no {
  font-size: 19px; font-weight: 900; text-align: center;
  font-family: 'Yu Mincho', '游明朝', serif;
  color: #2b1d10;
}
.rank-row .name { font-size: 13px; font-weight: 700; color: #2b1d10; }
.rank-row .name .team { font-size: 10px; opacity: 0.6; display: block; color: #5a4a30; }
.rank-row .steps {
  font-size: 14px; font-weight: 800; color: #c44530;
  font-family: 'Yu Mincho', '游明朝', serif;
}

/* === Comments === */
.comments-area {
  background:
    linear-gradient(rgba(43,29,16,0.92), rgba(43,29,16,0.92)),
    url('/assets/walk/tokaido_map_bg.png') center/cover no-repeat;
  color: #f4e8d0;
  border-radius: 6px;
  border: 3px double #c9a14a;
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  padding: 16px; overflow: hidden; position: relative;
}
.comments-area h3 {
  font-size: 16px; font-weight: 800; letter-spacing: 3px;
  margin-bottom: 8px;
  color: #f4e8d0;
  font-family: 'Yu Mincho', '游明朝', serif;
}
.comment-scroll {
  display: flex; gap: 14px;
  animation: scrollLeft 60s linear infinite;
  white-space: nowrap;
  will-change: transform;
}
.comment-card {
  display: inline-flex; flex-direction: column;
  min-width: 300px; max-width: 400px;
  background: rgba(244,232,208,0.95);
  color: #2b1d10;
  border-radius: 4px;
  border: 1px solid #c9a14a;
  padding: 10px 14px;
  flex-shrink: 0;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}
.comment-card .who {
  font-size: 11px; opacity: 0.7; margin-bottom: 4px;
  font-weight: 700; color: #5a4a30;
}
.comment-card .what {
  font-size: 13px; font-weight: 600;
  white-space: normal;
  font-family: 'Yu Mincho', '游明朝', serif;
}
.comment-card .photo { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; border: 1px solid #8a6a3a; margin-right: 10px; flex-shrink: 0; cursor: pointer; }
.comment-card.has-photo { display: flex; flex-direction: row; align-items: center; gap: 0; min-width: 320px; padding: 8px 12px; }
.comment-card.has-photo .body { flex: 1; min-width: 0; max-height: 70px; overflow: hidden; }
.comment-card.has-photo .what { font-size: 12px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.comment-card .kind-badge { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; margin-left: 4px; font-weight: 800; }
.comment-card .kind-badge.field { background: #047857; color: #f4e8d0; }
/* 2倍複製 + -50% 動きの古典シームレスループ */
@keyframes scrollLeft { from { transform: translateX(0); } to { transform: translateX(-50%); } }

/* 図鑑モーダル展開中: 背景スクロール無効化 (iOS Safari含む) */
body.atlas-open { overflow: hidden; position: fixed; width: 100%; }

/* === スマホ対応 (≤768px) === */
@media (max-width: 768px) {
  /* 道中の便り: スマホは18sで流す (PC60s → スマホ18s ≒ 3.3倍速) */
  .comment-scroll { animation-duration: 18s; }
  .comments-area { padding: 8px 0; min-height: 100px; }
  .layout { grid-template-rows: auto auto auto; height: auto; min-height: 100vh; padding: 6px; gap: 8px; }
  header { flex-wrap: wrap; padding: 8px 10px; gap: 6px; row-gap: 4px; }
  header .title-block { gap: 8px; flex: 1 1 auto; min-width: 0; }
  header .logo { height: 36px; width: 36px; padding: 2px; }
  header .title { font-size: 18px; letter-spacing: 1px; }
  header .sub { font-size: 9px; letter-spacing: 0.5px; }
  header .countdown { padding: 5px 8px; font-size: 11px; letter-spacing: 0.5px; }
  header button { padding: 4px 8px !important; font-size: 11px !important; margin-left: 4px !important; }
  .main-area { grid-template-columns: 1fr; gap: 8px; }
  .map-card { min-height: 280px; }
  .ranking-card { padding: 10px; }
  .ranking-card h3 { font-size: 13px !important; }
  .comments-area h3 { font-size: 12px !important; }
  /* 図鑑モーダル モバイル対応 (flex column レイアウト) */
  .atlas-head { padding: 8px 12px; gap: 6px; flex-wrap: wrap; }
  .atlas-head h2 { font-size: 14px; letter-spacing: 0.5px; flex: 1 1 100%; order: 0; }
  .atlas-head .progress { font-size: 10px; padding: 3px 8px; order: 1; }
  .atlas-close { padding: 4px 8px; font-size: 10px; order: 2; }
  .atlas-banner { padding: 2px 12px 4px; }
  .atlas-banner-name { font-size: 20px; letter-spacing: 1px; }
  .atlas-banner-km { font-size: 10px; }
  .atlas-bottom { padding: 6px 12px 0; }
  .atlas-banner-desc { font-size: 10.5px; padding: 5px 7px; max-width: none; line-height: 1.45; }
  .atlas-status-badge { font-size: 10px; padding: 2px 7px; margin-top: 4px; }
  .atlas-progress-text { font-size: 11px; }
  .atlas-stayers-label { font-size: 10px; letter-spacing: 0.5px; padding: 4px 0 0; }
  .atlas-stayers-area { padding: 6px 0 4px; gap: 5px; max-height: 22vh; }
  .atlas-avatar-group { gap: 5px; max-width: 100%; }
  .atlas-avatar { width: 36px; height: 36px; border-width: 2px; }
  .atlas-avatar.me { width: 46px; height: 46px; }
  .atlas-avatar-fallback { width: 36px; height: 36px; font-size: 14px; border-width: 2px; }
  .atlas-avatar-name { font-size: 8px; max-width: 44px; }
  .atlas-avatar-more { font-size: 12px; padding: 5px 10px; }
  .atlas-stayers-empty { font-size: 11px; padding: 12px; }
  .atlas-nav { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 6px; }
  .atlas-nav button { padding: 8px 10px; font-size: 11px; }
  .atlas-nav .nav-center { font-size: 10px; padding: 4px 8px; }
  .atlas-bg { background-position: center 30%; }
}

/* 全画面時の右上「戻る」FAB (常に最前面、スマホ・PC両方で確実に押せる位置) */
.fs-exit-fab { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 12px; z-index: 99999; background: rgba(196,69,48,0.95); color: #f4e8d0; border: 2px solid #c9a14a; padding: 10px 16px; border-radius: 24px; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.4); font-family: 'Yu Mincho', serif; align-items: center; gap: 6px; }
body.is-fs .fs-exit-fab { display: inline-flex; }

/* 全画面モード: ヘッダー圧縮+地図エリア最大化 (Fullscreen API無効環境=iOS Safari等でも擬似全画面) */
body.is-fs { overflow: hidden; }
body.is-fs .layout { position: fixed; inset: 0; padding: 0; gap: 0; grid-template-rows: 56px 1fr; height: 100vh; height: 100dvh; z-index: 100; background: #1a1108; }
body.is-fs header { padding: 6px 12px; border-radius: 0; border-left: 0; border-right: 0; border-top: 0; }
body.is-fs header .title { font-size: 18px; letter-spacing: 1px; }
body.is-fs header .sub { font-size: 10px; }
body.is-fs header .countdown { padding: 4px 10px; font-size: 11px; }
body.is-fs header .logo { height: 36px; width: 36px; padding: 2px; }
body.is-fs header button { padding: 4px 8px !important; font-size: 11px !important; }
body.is-fs .ranking-card, body.is-fs .comments-area { display: none !important; }
body.is-fs .main-area { grid-template-columns: 1fr; gap: 0; }
body.is-fs .map-card { min-height: 0; height: 100%; border-radius: 0; border: 0; }
/* === 宿場図鑑モーダル (1宿場フル画面ビュー) === */
.atlas-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; display: none; flex-direction: column; overflow: hidden; background: #000; }
.atlas-overlay.show { display: flex; }
.atlas-modal { width: 100%; height: 100%; position: relative; font-family: 'Yu Mincho', '游明朝', serif; overflow: hidden; display: flex; flex-direction: column; }
.atlas-bg { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-size: contain; background-repeat: no-repeat; background-position: center 38%; background-color: #1a1408; transition: filter 0.4s, opacity 0.4s; z-index: 1; }
.atlas-bg.unvisited { filter: grayscale(0.85) brightness(0.7); }
.atlas-bg-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(43,29,16,0.75) 0%, rgba(43,29,16,0.10) 25%, rgba(43,29,16,0.10) 60%, rgba(43,29,16,0.92) 100%); pointer-events: none; z-index: 2; }
.atlas-head { position: relative; padding: 14px 22px; display: flex; align-items: center; gap: 12px; z-index: 10; flex-shrink: 0; flex-wrap: wrap; }
.atlas-head h2 { margin: 0; font-size: 22px; color: #f4e8d0; flex: 1; letter-spacing: 2px; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
.atlas-head .progress { font-size: 13px; color: #fbbf24; font-weight: 700; padding: 6px 12px; background: rgba(43,29,16,0.75); border: 1.5px solid #c9a14a; border-radius: 8px; }
.atlas-close { background: rgba(196,69,48,0.9); color: #f4e8d0; border: 1.5px solid #c9a14a; padding: 7px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
/* 上部バナー: 宿場名+kmだけ (画像を遮らない) */
.atlas-banner { position: relative; padding: 4px 22px 8px; z-index: 10; flex-shrink: 0; }
/* 中央スペーサー: 画像が綺麗に見える領域 */
.atlas-spacer { position: relative; flex: 1; min-height: 0; z-index: 5; }
/* 下部: 説明文+進捗+滞在中アバター */
.atlas-bottom { position: relative; padding: 8px 22px 0; z-index: 10; flex-shrink: 0; background: linear-gradient(180deg, transparent, rgba(43,29,16,0.65) 30%, rgba(43,29,16,0.85) 100%); }
.atlas-banner-name { font-size: 38px; font-weight: 900; color: #f4e8d0; text-shadow: 0 3px 14px rgba(0,0,0,0.85), 0 0 6px rgba(0,0,0,0.6); letter-spacing: 4px; }
.atlas-banner-km { font-size: 14px; color: #fbbf24; font-weight: 700; margin-top: 4px; text-shadow: 0 2px 6px rgba(0,0,0,0.7); }
.atlas-banner-desc { font-size: 14px; color: #f4e8d0; margin-top: 8px; line-height: 1.7; max-width: 720px; text-shadow: 0 2px 6px rgba(0,0,0,0.85); padding: 10px 14px; background: rgba(43,29,16,0.45); border-left: 3px solid #c9a14a; border-radius: 4px; backdrop-filter: blur(2px); }
.atlas-status-badge { display: inline-block; font-size: 12px; padding: 4px 10px; border-radius: 6px; font-weight: 900; margin-top: 10px; letter-spacing: 1px; }
.atlas-status-badge.visited { background: #047857; color: #f4e8d0; }
.atlas-status-badge.current { background: #dc2626; color: #f4e8d0; box-shadow: 0 0 12px rgba(220,38,38,0.6); }
.atlas-status-badge.unvisited { background: rgba(138,106,58,0.85); color: #f4e8d0; }
.atlas-progress-text { font-size: 13px; color: #fbbf24; margin-top: 8px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,0.85); }
/* 滞在中アバター集合 (下部内、必要ならスクロール) */
.atlas-stayers-area { position: relative; padding: 8px 0 6px; z-index: 5; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; max-height: 30vh; overflow-y: auto; }
.atlas-avatar-group { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; max-width: 90vw; }
.atlas-avatar { width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 2px solid #c9a14a; object-fit: cover; object-position: center top; box-shadow: 0 4px 10px rgba(0,0,0,0.45); animation: floatUp 3.5s ease-in-out infinite; }
.atlas-avatar.me { border-color: #dc2626; box-shadow: 0 0 0 3px #fbbf24, 0 4px 14px rgba(220,38,38,0.55); width: 56px; height: 56px; }
.atlas-avatar-fallback { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg,#8a6a3a,#5a4a30); color: #f4e8d0; border: 2px solid #c9a14a; display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; font-family: 'Yu Mincho', serif; box-shadow: 0 4px 10px rgba(0,0,0,0.45); }
.atlas-avatar-name { display: block; text-align: center; font-size: 9px; color: #f4e8d0; margin-top: 3px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,0.85); max-width: 56px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.atlas-avatar-wrap { display: flex; flex-direction: column; align-items: center; }
.atlas-avatar-more { font-size: 16px; color: #f4e8d0; font-weight: 800; padding: 8px 14px; background: rgba(201,161,74,0.85); border-radius: 24px; backdrop-filter: blur(4px); }
.atlas-stayers-empty { font-size: 14px; color: #f4e8d0; opacity: 0.6; font-style: italic; padding: 30px; text-align: center; }
@keyframes floatUp { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
/* 下部ナビゲーション (前/次の宿場切替) */
.atlas-nav { position: relative; padding: 14px 22px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 12px; z-index: 10; align-items: center; justify-content: space-between; background: rgba(43,29,16,0.92); flex-shrink: 0; border-top: 1.5px solid rgba(201,161,74,0.4); }
.atlas-nav button { background: rgba(43,29,16,0.85); color: #f4e8d0; border: 1.5px solid #c9a14a; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer; font-family: 'Yu Mincho', serif; }
.atlas-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
.atlas-nav .nav-center { font-size: 12px; color: #fbbf24; font-weight: 700; padding: 7px 12px; background: rgba(43,29,16,0.75); border: 1px solid #c9a14a; border-radius: 6px; white-space: nowrap; }
/* 滞在中ラベル (フロー、stayers-area の上に置く) */
.atlas-stayers-label { position: relative; padding: 4px 0 0; text-align: center; font-size: 11px; color: #fbbf24; font-weight: 800; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,0.8); z-index: 6; flex-shrink: 0; }
</style>
</head>
<body>

<!-- 全画面時の確実な戻るボタン (スマホで小さなヘッダーボタンより目立つ) -->
<button class="fs-exit-fab" onclick="toggleFullscreen()" title="全画面を解除">✕ 全画面解除</button>

<div class="layout">

  <header>
    <div class="title-block">
      <img src="/assets/walk/logo.png?v=2" alt="logo" class="logo">
      <div>
        <div class="title">Connect 222</div>
        <div class="sub">スズエ電機 磐田 ⇔ スタンダード運輸 海老名 ／ 東名高速 222粁</div>
      </div>
    </div>
    <div class="countdown" id="hdr-countdown">読み込み中...</div>
    <button id="atlas-btn" onclick="openAtlas()" title="宿場図鑑" style="margin-left:12px;background:rgba(244,232,208,0.85);color:#2b1d10;border:1.5px solid #c9a14a;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Yu Mincho',serif;">📖 宿場図鑑</button>
    <button id="fullscreen-btn" onclick="toggleFullscreen()" title="全画面表示" style="margin-left:6px;background:rgba(244,232,208,0.85);color:#2b1d10;border:1.5px solid #c9a14a;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer;font-family:'Yu Mincho',serif;">⛶ 全画面</button>
    <button onclick="goBackHome()" style="margin-left:6px;background:rgba(244,232,208,0.65);color:#2b1d10;border:1.5px solid #8a6a3a;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Yu Mincho',serif;">✕ 閉じる</button>
    <script>function goBackHome(){var m=/Android|iPhone|iPod|Mobile/i.test(navigator.userAgent||'');if(history.length>1){history.back();}else{location.href=m?'/m':'/';}}
function toggleFullscreen(){
  const el=document.documentElement;
  const isFs=document.body.classList.contains('is-fs');
  // Fullscreen API があれば使う (PC Chrome/Firefox)、無ければ CSS 擬似全画面 (iOS Safari等)
  const reqFs=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  const exitFs=document.exitFullscreen||document.webkitExitFullscreen;
  if(!isFs){
    document.body.classList.add('is-fs');
    if(reqFs){try{reqFs.call(el);}catch(e){}}
  }else{
    document.body.classList.remove('is-fs');
    if(document.fullscreenElement&&exitFs){try{exitFs.call(document);}catch(e){}}
  }
  // FAB ラベル更新
  const btn=document.getElementById('fullscreen-btn');
  if(btn) btn.textContent=document.body.classList.contains('is-fs')?'⛶ 戻る':'⛶ 全画面';
}
document.addEventListener('fullscreenchange',()=>{
  // PC: F11 や ESC で fullscreen が変わったとき is-fs クラスも同期
  const inFs=!!document.fullscreenElement;
  if(!inFs) document.body.classList.remove('is-fs');
  const btn=document.getElementById('fullscreen-btn');
  if(btn) btn.textContent=document.body.classList.contains('is-fs')?'⛶ 戻る':'⛶ 全画面';
});</script>

<script>
const token = localStorage.getItem('cohub_token') || localStorage.getItem('cohub_admin_token') || '';

async function api(path) {
  const r = await fetch('/api/walk' + path, { headers: { 'Authorization': 'Bearer ' + token } });
  return r.json();
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// 街道ライン (背景画像の道に近似する緩やかな曲線)
// viewBox 1200x440 内で y=180〜260 を蛇行する
// 注: 地図は標準向き (北上、東=右)。u: 0..1 (0=磐田/西/左, 1=日本橋/東/右)
function roadY(u) {
  const baseY = 450;  // 新 viewBox H=900 の中央
  const amp = 60;     // 縦が広がったので振幅を増やしてダイナミックに
  return baseY - amp * Math.sin(u * Math.PI * 2.7);
}

async function refresh() {
  const ev = await api('/event/active');
  if (!ev.success || !ev.event) {
    document.getElementById('hdr-countdown').textContent = 'イベント未開催';
    return;
  }
  const event = ev.event;
  const milestones = ev.milestones || [];
  const today = new Date(); today.setHours(0,0,0,0);
  const end = new Date(event.end_date);
  const daysLeft = Math.max(0, Math.ceil((end - today) / 86400000));
  document.getElementById('hdr-countdown').textContent = '残り ' + daysLeft + '日';
  document.getElementById('phase-label').textContent = event.status === 'phase2_solo'
    ? '🎉 第二幕 ／ 合流済 ／ それぞれ相手本社へ'
    : '📍 第一幕 ／ 両陣営合流をめざして';

  const teams = await api('/teams');
  // 個別ピン用に全員 (上限100) を取得 → マップに配置 + 上位12人をリスト表示
  const ranking = await api('/ranking?limit=100');
  const allParticipants = ranking.ranking || [];
  drawBigMap(event, milestones, teams.teams || [], allParticipants);
  drawRanking(allParticipants.slice(0, 12));

  const comments = await api('/recent-comments?limit=20');
  drawComments(comments.comments || []);
}

// チーム視点で milestone 名にサフィックス付与: km=0 → STD出発/SZEゴール、km=最大 → 逆
function _milestoneNameFor(m, teamCode, totalKm) {
  if (!m) return '';
  let suf = '';
  if ((m.km_from_tokyo || 0) === 0) suf = (teamCode === 'STD' ? ' (出発)' : ' (ゴール)');
  else if (Math.abs((m.km_from_tokyo || 0) - (totalKm || 230)) < 0.01) suf = (teamCode === 'STD' ? ' (ゴール)' : ' (出発)');
  return (m.name || '') + suf;
}

function drawBigMap(event, milestones, teams, participants) {
  const svg = document.getElementById('route-map-big');
  const totalKm = event.total_route_km || 230;
  const W = 1600, H = 900, padX = 90;
  const stdTeam = teams.find(t => t.team_code === 'STD') || { total_km: 0, total_steps: 0, member_count: 0 };
  const szeTeam = teams.find(t => t.team_code === 'SZE') || { total_km: 0, total_steps: 0, member_count: 0 };

  // u: 0..1 (0=磐田/西/左, 1=日本橋/東/右)。km は日本橋=0 起点なので反転する。
  const kmToU = km => 1 - (km / totalKm);
  const uToX = u => padX + (W - 2 * padX) * u;

  const stdKm = Math.min(stdTeam.total_km || 0, totalKm);
  const szeKm = Math.min(szeTeam.total_km || 0, totalKm);
  // STD: 日本橋(右,u=1) からスタート、西進で u 減少
  const stdU = 1 - (stdKm / totalKm);
  // SZE: 磐田(左,u=0) からスタート、東進で u 増加
  const szeU = (szeKm / totalKm);
  const stdX = uToX(stdU);
  const szeX = uToX(szeU);
  const stdYpos = roadY(stdU);
  const szeYpos = roadY(szeU);

  const isPhase2 = event.status === 'phase2_solo';
  const meetU = isPhase2 && event.meet_position_km != null ? kmToU(event.meet_position_km) : null;
  const meetX = meetU != null ? uToX(meetU) : null;

  // 街道路 (曲線パス、宿場の繋がり) — 背景の道と二重表示でアクセント
  let roadPath = '';
  for (let i = 0; i <= 100; i++) {
    const u = i / 100;
    const x = uToX(u);
    const y = roadY(u);
    roadPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }

  let s = '';

  // 街道全体 (淡い影)
  s += '<path d="' + roadPath + '" fill="none" stroke="rgba(43,29,16,0.18)" stroke-width="10" stroke-linecap="round"/>';
  // 街道ベース (砂金色の点線)
  s += '<path d="' + roadPath + '" fill="none" stroke="#c9a14a" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6" opacity="0.85"/>';

  // STD 達成区間 (藍): u=1(右) から u=stdU まで西進
  let stdPath = '';
  for (let i = 0; i <= 100; i++) {
    const u = 1 - (i / 100);
    if (u < stdU) break;
    const x = uToX(u);
    const y = roadY(u);
    stdPath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }
  if (stdPath) s += '<path d="' + stdPath + '" fill="none" stroke="#1e3a5f" stroke-width="6" stroke-linecap="round" opacity="0.85"/>';

  // SZE 達成区間 (緑): u=0(左) から u=szeU まで東進
  let szePath = '';
  for (let i = 0; i <= 100; i++) {
    const u = i / 100;
    if (u > szeU) break;
    const x = uToX(u);
    const y = roadY(u);
    szePath += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ',' + y.toFixed(1) + ' ';
  }
  if (szePath) s += '<path d="' + szePath + '" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" opacity="0.85"/>';

  // 合流地点
  if (meetX != null) {
    const meetY = roadY(meetU);
    s += '<defs><clipPath id="meetc"><circle cx="' + meetX + '" cy="' + meetY + '" r="32"/></clipPath></defs>';
    s += '<image href="/assets/walk/meet_celebration.png" x="' + (meetX - 32) + '" y="' + (meetY - 32) + '" width="64" height="64" clip-path="url(#meetc)"/>';
    s += '<circle cx="' + meetX + '" cy="' + meetY + '" r="32" fill="none" stroke="#c44530" stroke-width="4"/>';
    s += '<text x="' + meetX + '" y="' + (meetY - 44) + '" text-anchor="middle" fill="#c44530" font-size="18" font-weight="800" font-family="Yu Mincho, serif">🤝 合流</text>';
  }

  // === 宿場 (道の駅+SA/PA) ===
  // 22ポイント密集対応: 横長16:9サムネ+矩形枠 (旧丸枠廃止)
  for (let i = 0; i < milestones.length; i++) {
    const m = milestones[i];
    const u = kmToU(m.km_from_tokyo);
    const mx = uToX(u);
    const ry = roadY(u);
    const above = i % 2 === 0;
    // 宿場札位置: 街道から上下に伸びる
    const cardOffset = above ? -150 : 150;
    const cardCY = ry + cardOffset;
    const imgW = 110, imgH = 62; // 16:9 比率の小型サムネ
    const imgX = mx - imgW / 2;
    const imgY = cardCY - imgH / 2;

    if (m.image_url) {
      const cid = 'mc' + i;
      // 影 (矩形)
      s += '<rect x="' + (imgX + 3) + '" y="' + (imgY + imgH + 1) + '" width="' + (imgW - 6) + '" height="4" rx="2" fill="rgba(0,0,0,0.28)"/>';
      // 矩形クリップ + 画像 (横長フル風景の中央切り抜き)
      s += '<defs><clipPath id="' + cid + '"><rect x="' + imgX + '" y="' + imgY + '" width="' + imgW + '" height="' + imgH + '" rx="3"/></clipPath></defs>';
      s += '<image href="' + escapeHtml(m.image_url) + '?v=5" x="' + imgX + '" y="' + imgY + '" width="' + imgW + '" height="' + imgH + '" preserveAspectRatio="xMidYMid slice" clip-path="url(#' + cid + ')"/>';
      // 二重枠 (内側ダーク+外側金、矩形)
      s += '<rect x="' + imgX + '" y="' + imgY + '" width="' + imgW + '" height="' + imgH + '" rx="3" fill="none" stroke="#2b1d10" stroke-width="2"/>';
      s += '<rect x="' + (imgX - 2) + '" y="' + (imgY - 2) + '" width="' + (imgW + 4) + '" height="' + (imgH + 4) + '" rx="4" fill="none" stroke="#c9a14a" stroke-width="1.5"/>';

      // 引き出し線 (街道へ)
      s += '<line x1="' + mx + '" y1="' + (cardCY + (above ? imgH / 2 : -imgH / 2)) + '" x2="' + mx + '" y2="' + ry + '" stroke="#8a6a3a" stroke-width="1.5" stroke-dasharray="3 3"/>';
      // 街道上の小ピン
      s += '<circle cx="' + mx + '" cy="' + ry + '" r="5" fill="#c44530" stroke="#f4e8d0" stroke-width="2"/>';
    } else {
      s += '<circle cx="' + mx + '" cy="' + ry + '" r="6" fill="#c44530" stroke="#f4e8d0" stroke-width="2"/>';
    }

    // 宿場札 (朱色木札風) — 矩形サムネに合わせて少し小さく
    const plateY = above ? imgY - 24 : imgY + imgH + 8;
    // 自分視点で名前にサフィックス付与 (出発/ゴール)
    const name = (_milestoneNameFor(m, _atlasMyTeam || 'STD', totalKm) || '').slice(0, 12);
    const plateW = Math.max(70, name.length * 11 + 14);
    s += '<rect x="' + (mx - plateW / 2) + '" y="' + plateY + '" width="' + plateW + '" height="20" rx="2" fill="#3a2a1a" stroke="#c9a14a" stroke-width="1.5"/>';
    s += '<text x="' + mx + '" y="' + (plateY + 14) + '" text-anchor="middle" fill="#f4e8d0" font-size="11" font-weight="700" font-family="Yu Mincho, serif" letter-spacing="0.5">' + escapeHtml(name) + '</text>';
    // km 表示 (札の外側、控えめ)
    const kmY = above ? plateY - 3 : plateY + 30;
    s += '<text x="' + mx + '" y="' + kmY + '" text-anchor="middle" fill="#5a4a30" font-size="9" font-weight="600">' + Math.round(m.km_from_tokyo) + 'km</text>';
  }

  // === 旅人マーカー ===
  // STD 旅人 (日本橋=右からスタート、西進=左へ移動)。画像は右向きで生成されたため SVG 側で水平反転して左向きにする。
  const travelerR = 50;  // viewBox 拡張に合わせて拡大
  s += '<defs><clipPath id="trvstd"><circle cx="' + stdX + '" cy="' + stdYpos + '" r="' + travelerR + '"/></clipPath></defs>';
  s += '<ellipse cx="' + stdX + '" cy="' + (stdYpos + travelerR + 4) + '" rx="' + (travelerR - 4) + '" ry="3" fill="rgba(0,0,0,0.3)"/>';
  s += '<image href="/assets/walk/traveler_std.png" x="' + (stdX - travelerR) + '" y="' + (stdYpos - travelerR) + '" width="' + (travelerR * 2) + '" height="' + (travelerR * 2) + '" clip-path="url(#trvstd)" transform="matrix(-1 0 0 1 ' + (2 * stdX) + ' 0)"/>';
  s += '<circle cx="' + stdX + '" cy="' + stdYpos + '" r="' + travelerR + '" fill="none" stroke="#1e3a5f" stroke-width="3"/>';
  s += '<circle cx="' + stdX + '" cy="' + stdYpos + '" r="' + (travelerR + 2) + '" fill="none" stroke="#c9a14a" stroke-width="1.5"/>';
  // STD ラベル
  const stdLabelY = stdYpos - travelerR - 10;
  s += '<rect x="' + (stdX - 38) + '" y="' + (stdLabelY - 18) + '" width="76" height="22" rx="2" fill="#1e3a5f" stroke="#c9a14a" stroke-width="1"/>';
  s += '<text x="' + stdX + '" y="' + (stdLabelY - 2) + '" text-anchor="middle" fill="#f4e8d0" font-size="13" font-weight="800" font-family="Yu Mincho, serif">🚚 ' + (stdTeam.total_km || 0).toFixed(0) + 'km</text>';

  // SZE 旅人 (磐田=左からスタート、東進=右へ移動)。画像は左向きで生成されたため SVG 側で水平反転して右向きにする。
  s += '<defs><clipPath id="trvsze"><circle cx="' + szeX + '" cy="' + szeYpos + '" r="' + travelerR + '"/></clipPath></defs>';
  s += '<ellipse cx="' + szeX + '" cy="' + (szeYpos + travelerR + 4) + '" rx="' + (travelerR - 4) + '" ry="3" fill="rgba(0,0,0,0.3)"/>';
  s += '<image href="/assets/walk/traveler_sze.png" x="' + (szeX - travelerR) + '" y="' + (szeYpos - travelerR) + '" width="' + (travelerR * 2) + '" height="' + (travelerR * 2) + '" clip-path="url(#trvsze)" transform="matrix(-1 0 0 1 ' + (2 * szeX) + ' 0)"/>';
  s += '<circle cx="' + szeX + '" cy="' + szeYpos + '" r="' + travelerR + '" fill="none" stroke="#047857" stroke-width="3"/>';
  s += '<circle cx="' + szeX + '" cy="' + szeYpos + '" r="' + (travelerR + 2) + '" fill="none" stroke="#c9a14a" stroke-width="1.5"/>';
  // SZE ラベル
  const szeLabelY = szeYpos + travelerR + 32;
  s += '<rect x="' + (szeX - 38) + '" y="' + (szeLabelY - 18) + '" width="76" height="22" rx="2" fill="#047857" stroke="#c9a14a" stroke-width="1"/>';
  s += '<text x="' + szeX + '" y="' + (szeLabelY - 2) + '" text-anchor="middle" fill="#f4e8d0" font-size="13" font-weight="800" font-family="Yu Mincho, serif">⚡ ' + (szeTeam.total_km || 0).toFixed(0) + 'km</text>';

  // === 個別参加者ピン (Phase1: チーム別ライン上に各人配置) ===
  // 自分の uid は localStorage から取得
  let myUid = null;
  try { myUid = JSON.parse(localStorage.getItem('cohub_user') || '{}').uid || JSON.parse(localStorage.getItem('cohub_user') || '{}').id; } catch (e) {}
  // milestones を km順 でソート (Phase 番号判定用)
  const sortedMs = (milestones || []).slice().sort((a, b) => (a.km_from_tokyo || 0) - (b.km_from_tokyo || 0));
  // 各人の現在phase算出 (visited_milestones 配列から最新到達した宿場名を取得)
  function currentPhaseOf(p) {
    const visited = p.visited_milestones || [];
    if (!visited.length) return { current: null, currentName: '出発前', nextName: sortedMs[0] && sortedMs[0].name, nextKm: sortedMs[0] && sortedMs[0].km_from_tokyo };
    // visited に含まれるmilestoneの中で km_from_tokyo が最大のもの = チームの進行方向で最先頭
    let lastM = null;
    for (const m of sortedMs) {
      if (visited.includes(m.id)) {
        if (p.team_code === 'STD') {
          // STD: km_from_tokyo が大きいほど西進している (起点からの距離)
          if (!lastM || m.km_from_tokyo > lastM.km_from_tokyo) lastM = m;
        } else {
          // SZE: km_from_tokyo が小さいほど東進している (磐田起点からの距離は totalKm - km_from_tokyo)
          if (!lastM || m.km_from_tokyo < lastM.km_from_tokyo) lastM = m;
        }
      }
    }
    // 次の未到達milestone
    let nextM = null;
    for (const m of sortedMs) {
      if (visited.includes(m.id)) continue;
      if (p.team_code === 'STD') {
        if (!nextM || m.km_from_tokyo < nextM.km_from_tokyo) {
          if (!lastM || m.km_from_tokyo > lastM.km_from_tokyo) nextM = m;
        }
      } else {
        if (!nextM || m.km_from_tokyo > nextM.km_from_tokyo) {
          if (!lastM || m.km_from_tokyo < lastM.km_from_tokyo) nextM = m;
        }
      }
    }
    return {
      current: lastM,
      currentName: lastM ? lastM.name : '出発前',
      nextName: nextM ? nextM.name : 'ゴール!',
      nextKm: nextM ? nextM.km_from_tokyo : null,
    };
  }
  const PIN_R = 22;
  // 各列ごとの y オフセット (重ならないよう縦方向にずらす)
  const stdLane = []; const szeLane = [];
  for (const p of (participants || [])) {
    const km = Math.min(p.distance_walked_km || 0, totalKm);
    if (p.team_code === 'STD') {
      const u = 1 - (km / totalKm); // 右=1からスタート、西進
      const baseX = uToX(u); const baseY = roadY(u);
      // 同じ位置の重なりを避けるため横方向に少しずつずらす
      const offset = stdLane.filter(x => Math.abs(x - baseX) < PIN_R * 1.8).length;
      stdLane.push(baseX);
      const px = baseX + (offset % 2 === 0 ? -1 : 1) * Math.floor(offset / 2) * (PIN_R * 1.5);
      const py = baseY - 60 - (offset * 4); // チーム旅人より上に表示、重なる場合は更に上へ
      drawParticipantPin(p, px, py, '#1e3a5f', myUid);
    } else if (p.team_code === 'SZE') {
      const u = (km / totalKm); // 左=0からスタート、東進
      const baseX = uToX(u); const baseY = roadY(u);
      const offset = szeLane.filter(x => Math.abs(x - baseX) < PIN_R * 1.8).length;
      szeLane.push(baseX);
      const px = baseX + (offset % 2 === 0 ? -1 : 1) * Math.floor(offset / 2) * (PIN_R * 1.5);
      const py = baseY + 60 + (offset * 4); // チーム旅人より下に表示
      drawParticipantPin(p, px, py, '#047857', myUid);
    }
  }
  function drawParticipantPin(p, x, y, color, myUid) {
    const isMe = p.user_id === myUid;
    const r = isMe ? PIN_R + 8 : PIN_R;
    const name = (p.nickname || p.display_name || '?').slice(0, 5);
    const ph = currentPhaseOf(p);
    const cid = 'pp' + (p.user_id || '').replace(/-/g, '').slice(0, 8);
    // 影
    s += '<ellipse cx="' + x + '" cy="' + (y + r + 3) + '" rx="' + (r - 2) + '" ry="2" fill="rgba(0,0,0,0.25)"/>';
    // アバター画像 (あれば) または塗り円
    if (p.avatar_url) {
      s += '<defs><clipPath id="' + cid + '"><circle cx="' + x + '" cy="' + y + '" r="' + r + '"/></clipPath></defs>';
      s += '<image href="' + escapeHtml(p.avatar_url) + '" x="' + (x - r) + '" y="' + (y - r) + '" width="' + (r * 2) + '" height="' + (r * 2) + '" clip-path="url(#' + cid + ')" preserveAspectRatio="xMidYMin slice"/>';
    } else {
      s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + color + '"/>';
      s += '<text x="' + x + '" y="' + (y + 4) + '" text-anchor="middle" fill="#f4e8d0" font-size="' + (r - 3) + '" font-weight="800">' + escapeHtml(name.charAt(0)) + '</text>';
    }
    // 縁取り (自分は赤金、他は色)
    s += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="none" stroke="' + (isMe ? '#dc2626' : color) + '" stroke-width="' + (isMe ? 3 : 2) + '"/>';
    if (isMe) s += '<circle cx="' + x + '" cy="' + y + '" r="' + (r + 3) + '" fill="none" stroke="#fbbf24" stroke-width="2"/>';
    // 名前+現在phase ラベル (小さめ)
    const labelY = y + r + 14;
    const labelText = escapeHtml(name) + ' · ' + escapeHtml((ph.currentName || '').slice(0, 4)) + (isMe ? ' ◀あなた' : '');
    const labelW = Math.max(80, labelText.length * 7 + 12);
    s += '<rect x="' + (x - labelW / 2) + '" y="' + (labelY - 9) + '" width="' + labelW + '" height="15" rx="2" fill="rgba(43,29,16,0.88)"/>';
    s += '<text x="' + x + '" y="' + (labelY + 2) + '" text-anchor="middle" fill="#f4e8d0" font-size="10" font-weight="700" font-family="Yu Mincho, serif">' + labelText + '</text>';
  }

  // === 自分の Phase オーバーレイ (右上、大きく表示) ===
  const me = (participants || []).find(p => p.user_id === myUid);
  if (me) {
    const ph = currentPhaseOf(me);
    const myKm = me.distance_walked_km || 0;
    const mySteps = me.total_steps || 0;
    const totalMs = sortedMs.length || 1;
    const visitedCount = (me.visited_milestones || []).length;
    const phaseN = visitedCount;
    let nextDistKm = 0; let nextSteps = 0;
    if (ph.nextKm != null) {
      if (me.team_code === 'STD') nextDistKm = Math.max(0, ph.nextKm - myKm);
      else nextDistKm = Math.max(0, (totalKm - ph.nextKm) - myKm);
      nextSteps = Math.ceil(nextDistKm * 1000 / 0.7);
    }
    const ox = W - 380; const oy = 20; const ow = 360; const oh = 110;
    s += '<rect x="' + ox + '" y="' + oy + '" width="' + ow + '" height="' + oh + '" rx="10" fill="rgba(43,29,16,0.94)" stroke="#c9a14a" stroke-width="2.5"/>';
    s += '<rect x="' + (ox + 4) + '" y="' + (oy + 4) + '" width="' + (ow - 8) + '" height="' + (oh - 8) + '" rx="8" fill="none" stroke="rgba(201,161,74,0.4)" stroke-width="1"/>';
    s += '<text x="' + (ox + 18) + '" y="' + (oy + 28) + '" fill="#c9a14a" font-size="14" font-weight="800" font-family="Yu Mincho, serif">🗾 あなたの旅路 (Phase ' + phaseN + ' / ' + totalMs + ')</text>';
    s += '<text x="' + (ox + 18) + '" y="' + (oy + 56) + '" fill="#f4e8d0" font-size="22" font-weight="900" font-family="Yu Mincho, serif">📍 ' + escapeHtml(ph.currentName || '出発前') + '</text>';
    if (ph.nextKm != null) {
      s += '<text x="' + (ox + 18) + '" y="' + (oy + 80) + '" fill="#fbbf24" font-size="13" font-weight="700" font-family="Yu Mincho, serif">→ 次: ' + escapeHtml(ph.nextName) + ' まで ' + nextDistKm.toFixed(1) + 'km (' + nextSteps.toLocaleString() + '歩)</text>';
    } else {
      s += '<text x="' + (ox + 18) + '" y="' + (oy + 80) + '" fill="#22c55e" font-size="14" font-weight="800" font-family="Yu Mincho, serif">🎉 全宿場制覇! ゴールまで完走</text>';
    }
    s += '<text x="' + (ox + 18) + '" y="' + (oy + 100) + '" fill="rgba(244,232,208,0.7)" font-size="11" font-weight="600">累計 ' + mySteps.toLocaleString() + '歩 / ' + myKm.toFixed(1) + 'km 進行中</text>';
  }

  svg.innerHTML = s;

  // 宿場図鑑にデータを引き渡し (全参加者+自分)
  setAtlasData(milestones, totalKm, me, participants, myUid);

  // チームサマリ更新
  document.getElementById('std-summary').textContent =
    '🚚 ' + (stdTeam.member_count || 0) + '名 ／ ' + (stdTeam.total_steps || 0).toLocaleString() + '歩';
  document.getElementById('sze-summary').textContent =
    '⚡ ' + (szeTeam.member_count || 0) + '名 ／ ' + (szeTeam.total_steps || 0).toLocaleString() + '歩';
}

function drawRanking(rows) {
  const list = document.getElementById('rank-list');
  if (!rows.length) {
    list.innerHTML = '<div style="text-align:center;opacity:0.5;padding:20px;font-size:12px;">記録はまだありません</div>';
    return;
  }
  list.innerHTML = rows.map((r, i) => {
    const teamCls = r.team_code === 'STD' ? 'std' : 'sze';
    const teamIcon = r.team_code === 'STD' ? '🚚' : '⚡';
    const teamLabel = r.team_code === 'STD' ? 'スタンダード' : 'スズエ';
    const rankBadge = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1);
    const name = r.nickname || r.display_name || '匿名';
    return '<div class="rank-row ' + teamCls + '">' +
      '<span class="rank-no">' + rankBadge + '</span>' +
      '<span class="name">' + teamIcon + ' ' + escapeHtml(name) + '<span class="team">' + teamLabel + '</span></span>' +
      '<span class="steps">' + (r.total_steps || 0).toLocaleString() + '歩</span>' +
      '</div>';
  }).join('');
}

// === 宿場図鑑モーダル ===
let _atlasMilestones = []; // refresh で更新
let _atlasMyVisited = []; // 自分の visited_milestones
let _atlasTotalKm = 230;
let _atlasMyKm = 0;
let _atlasMyTeam = 'STD';
let _atlasParticipants = [];
let _atlasMyUid = null;

function setAtlasData(milestones, totalKm, me, participants, myUid) {
  _atlasMilestones = (milestones || []).slice().sort((a, b) => (a.km_from_tokyo || 0) - (b.km_from_tokyo || 0));
  _atlasTotalKm = totalKm || 230;
  _atlasMyVisited = (me && me.visited_milestones) || [];
  _atlasMyKm = (me && me.distance_walked_km) || 0;
  _atlasMyTeam = (me && me.team_code) || 'STD';
  _atlasParticipants = participants || [];
  _atlasMyUid = myUid;
}

// 各人の current phase milestone ID を計算
function _phaseMilestoneIdOf(p) {
  const visited = p.visited_milestones || [];
  if (!visited.length) return null;
  // visited のうち、進行方向で最先頭 (= 最新到達) の milestone
  let lastM = null;
  for (const m of _atlasMilestones) {
    if (visited.includes(m.id)) {
      if (p.team_code === 'STD') {
        if (!lastM || m.km_from_tokyo > lastM.km_from_tokyo) lastM = m;
      } else {
        if (!lastM || m.km_from_tokyo < lastM.km_from_tokyo) lastM = m;
      }
    }
  }
  return lastM ? lastM.id : null;
}

function _renderStayersFor(msId) {
  // この宿場が current phase になっている参加者を集める
  const stayers = (_atlasParticipants || []).filter(p => _phaseMilestoneIdOf(p) === msId);
  if (!stayers.length) return '<div class="atlas-stayers-empty">— まだ誰もいません —</div>';
  // 自分を先頭に
  stayers.sort((a, b) => (b.user_id === _atlasMyUid ? 1 : 0) - (a.user_id === _atlasMyUid ? 1 : 0));
  const MAX_VISIBLE = 12;
  const visible = stayers.slice(0, MAX_VISIBLE);
  const more = Math.max(0, stayers.length - MAX_VISIBLE);
  let html = '';
  for (const p of visible) {
    const isMe = p.user_id === _atlasMyUid;
    const cls = 'atlas-avatar' + (isMe ? ' me' : '');
    const name = (p.nickname || p.display_name || '?').slice(0, 6);
    if (p.avatar_url) {
      html += `<img class="${cls}" src="${escapeHtml(p.avatar_url)}" title="${escapeHtml(name)}${isMe ? ' (あなた)' : ''}" alt="">`;
    } else {
      html += `<span class="atlas-avatar-fallback${isMe ? ' me' : ''}" title="${escapeHtml(name)}">${escapeHtml((p.display_name || '?').slice(0, 1))}</span>`;
    }
  }
  if (more > 0) html += `<span class="atlas-avatar-more">+${more}名</span>`;
  return html;
}

// 1宿場フル画面ビュー: チームの進行方向順
let _atlasIdx = 0;        // ordered 配列の現在インデックス
let _atlasOrdered = [];   // チーム進行方向順の milestone 配列

function openAtlas() {
  if (!_atlasMilestones.length) { return; }
  _atlasOrdered = _atlasMyTeam === 'SZE' ? _atlasMilestones.slice().reverse() : _atlasMilestones.slice();
  // デフォルトは自分の current phase milestone を表示
  const myCurrent = _phaseMilestoneIdOf({ team_code: _atlasMyTeam, visited_milestones: _atlasMyVisited });
  _atlasIdx = Math.max(0, _atlasOrdered.findIndex(m => m.id === myCurrent));
  if (_atlasIdx < 0) _atlasIdx = 0;
  _atlasRender();
  document.getElementById('atlas-overlay').classList.add('show');
  document.body.classList.add('atlas-open');
}

function closeAtlas() {
  document.getElementById('atlas-overlay').classList.remove('show');
  document.body.classList.remove('atlas-open');
}

function atlasNav(delta) {
  const next = _atlasIdx + delta;
  if (next < 0 || next >= _atlasOrdered.length) return;
  _atlasIdx = next;
  _atlasRender();
}

function _atlasRender() {
  const m = _atlasOrdered[_atlasIdx];
  if (!m) return;
  const visited = _atlasMyVisited.includes(m.id);
  const myCurrentId = _phaseMilestoneIdOf({ team_code: _atlasMyTeam, visited_milestones: _atlasMyVisited });
  const isCurrent = m.id === myCurrentId;
  // 背景画像
  const bg = document.getElementById('atlas-bg');
  if (m.image_url) {
    bg.style.backgroundImage = `url("${m.image_url}?v=5")`;
    bg.classList.toggle('unvisited', !visited && !isCurrent);
  } else {
    bg.style.backgroundImage = 'linear-gradient(135deg,#8a6a3a,#5a4a30)';
    bg.classList.remove('unvisited');
  }
  // バナー
  document.getElementById('atlas-name').textContent = _milestoneNameFor(m, _atlasMyTeam || 'STD', _atlasTotalKm);
  document.getElementById('atlas-km').textContent = '📏 ' + m.km_from_tokyo + 'km地点 (起点から)';
  document.getElementById('atlas-desc').textContent = m.description || '';
  const statusRow = document.getElementById('atlas-status-row');
  statusRow.innerHTML = isCurrent
    ? '<span class="atlas-status-badge current">📍 あなたの現在地</span>'
    : visited
    ? '<span class="atlas-status-badge visited">✅ 通過済</span>'
    : '<span class="atlas-status-badge unvisited">⬜ 未到達</span>';
  // 残距離
  const progText = document.getElementById('atlas-progress-text');
  if (!visited) {
    let remainKm;
    if (_atlasMyTeam === 'STD') remainKm = Math.max(0, m.km_from_tokyo - _atlasMyKm);
    else remainKm = Math.max(0, (_atlasTotalKm - m.km_from_tokyo) - _atlasMyKm);
    const remainSteps = Math.ceil(remainKm * 1000 / 0.7);
    progText.textContent = remainKm > 0 ? `あなたから あと ${remainKm.toFixed(1)}km / ${remainSteps.toLocaleString()}歩` : '';
  } else {
    progText.textContent = '';
  }
  // ヘッダー進捗
  document.getElementById('atlas-progress').textContent =
    _atlasMyVisited.length + ' / ' + _atlasMilestones.length + ' 宿場 制覇';
  // 滞在中アバター
  const stayers = (_atlasParticipants || []).filter(p => _phaseMilestoneIdOf(p) === m.id);
  // 自分を先頭に
  stayers.sort((a, b) => (b.user_id === _atlasMyUid ? 1 : 0) - (a.user_id === _atlasMyUid ? 1 : 0));
  const area = document.getElementById('atlas-stayers-area');
  document.getElementById('atlas-stayers-label').textContent = `👥 この宿場に滞在中 (${stayers.length}名)`;
  if (!stayers.length) {
    area.innerHTML = '<div class="atlas-stayers-empty">— まだ誰もこの宿場に到達していません —</div>';
  } else {
    const MAX = 16;
    const visible = stayers.slice(0, MAX);
    const more = Math.max(0, stayers.length - MAX);
    let html = '<div class="atlas-avatar-group">';
    for (const p of visible) {
      const isMe = p.user_id === _atlasMyUid;
      const cls = 'atlas-avatar' + (isMe ? ' me' : '');
      const name = (p.nickname || p.display_name || '?').slice(0, 8);
      if (p.avatar_url) {
        html += `<div class="atlas-avatar-wrap"><img class="${cls}" src="${escapeHtml(p.avatar_url)}" alt="${escapeHtml(name)}"><span class="atlas-avatar-name">${escapeHtml(name)}${isMe ? ' ◀' : ''}</span></div>`;
      } else {
        html += `<div class="atlas-avatar-wrap"><span class="atlas-avatar-fallback${isMe ? ' me' : ''}">${escapeHtml((p.display_name || '?').slice(0, 1))}</span><span class="atlas-avatar-name">${escapeHtml(name)}${isMe ? ' ◀' : ''}</span></div>`;
      }
    }
    if (more > 0) html += `<div class="atlas-avatar-more">+${more}名</div>`;
    html += '</div>';
    area.innerHTML = html;
  }
  // ナビ状態
  document.getElementById('atlas-prev').disabled = _atlasIdx === 0;
  document.getElementById('atlas-next').disabled = _atlasIdx === _atlasOrdered.length - 1;
  document.getElementById('atlas-nav-center').textContent =
    `第 ${_atlasIdx + 1} 番 / 全 ${_atlasOrdered.length} 宿場`;
}

function drawComments(comments) {
  const wrap = document.getElementById('comment-scroll');
  if (!comments.length) {
    wrap.innerHTML = '<div style="opacity:0.5;padding:20px;color:#f4e8d0;">まだ便りはありません</div>';
    return;
  }
  // 2倍複製 (CSS keyframes -50% と整合)
  const items = comments.concat(comments);
  wrap.innerHTML = items.map(c => {
    const name = c.nickname || c.display_name || '匿名';
    const isField = c.kind === 'field_photo';
    const hasPhoto = !!c.photo_url;
    const subInfo = isField
      ? '<span class="kind-badge field">📷 道中フォト</span>'
      : ' ／ ' + (c.steps || 0).toLocaleString() + '歩';
    const commentText = c.comment ? escapeHtml(c.comment) : (isField ? '(写真のみ)' : '');
    const photoImg = hasPhoto ? `<img class="photo" src="${escapeHtml(c.photo_url)}" alt="" loading="lazy" onclick="event.stopPropagation();window.open('${escapeHtml(c.photo_url)}','_blank')">` : '';
    return `<div class="comment-card${hasPhoto ? ' has-photo' : ''}">${photoImg}<div class="body">` +
      `<div class="who">${escapeHtml(name)}${subInfo}</div>` +
      `<div class="what">${isField ? '📷' : '💬'} ${commentText}</div>` +
      `</div></div>`;
  }).join('');
}

refresh();
setInterval(refresh, 8000);
</script>
