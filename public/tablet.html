<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>📱 CoWell タブレットログイン</title>
<!-- タブレット専用manifest: ホーム画面に追加すると start_url=/tablet で起動(ID/PWログインを回避) -->
<link rel="manifest" href="/tablet-manifest.json?v=2">
<meta name="theme-color" content="#0369a1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoWellタブレット">
<link rel="apple-touch-icon" href="/img/cowell-icon-192-v6.png">
<style>
:root {
  --bg: #dbf1ec; --fg: #0f172a; --mute: #64748b;
  --card: #fff; --border: #e2e8f0;
  --accent: #0891b2; --accent-d: #0e7490;
  --danger: #ef4444;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: linear-gradient(180deg, #bceae3 0%, #dbf1ec 320px) no-repeat, #dbf1ec; color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 18px; }
.hd { position: sticky; top: 0; z-index: 10; background: linear-gradient(135deg, #0e7490 0%, #0891b2 60%, #22c3d6 100%); border-bottom: none; padding: 18px 20px; display: flex; align-items: center; gap: 14px; box-shadow: 0 3px 14px rgba(13,148,136,.28); }
.hd .ttl { flex: 1; font-weight: 800; font-size: 23px; color: #fff; letter-spacing: .3px; }
.hd .sub { color: rgba(255,255,255,.92); font-size: 13.5px; margin-top: 3px; }
.bar { padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bar input, .bar select { padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 14px; font-size: 16px; background: #fff; }
.bar select { font-weight: 700; color: var(--accent-d); }
.bar input { flex: 1; min-width: 180px; }
.list { padding: 14px 20px 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; max-width: min(1560px, 97vw); margin: 0 auto; }
@media (max-width: 720px) { .list { grid-template-columns: repeat(3, 1fr); } }
.cell { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 8px 12px; cursor: pointer; text-align: center; transition: transform .12s, box-shadow .12s, border-color .12s; min-height: 134px; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
.cell.disabled { opacity: .5; }
.cell:not(.disabled):hover { box-shadow: 0 8px 20px rgba(13,148,136,.14); border-color: #5ecfc8; transform: translateY(-2px); }
.cell:not(.disabled):active { transform: scale(.96); border-color: var(--accent); }
.cell .av { width: 70px; height: 70px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 30px; overflow: hidden; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(15,23,42,.12), 0 0 0 2px #cffafe; }
.cell .av img { width: 100%; height: 100%; object-fit: cover; }
/* 出勤(体調チェック)済みバッジ */
.avwrap { position: relative; display: inline-flex; }
.avwrap .checkin { position: absolute; bottom: -2px; right: -2px; min-width: 24px; height: 24px; padding: 0 3px; box-sizing: border-box; border-radius: 999px; background: #16a34a; color: #fff; font-size: 15px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
/* 未読バッジ (2026-07-30): 共有画面なので件数は出さず種類だけ。左上=通達 / 左下=メッセージ */
.avwrap .unb { position: absolute; left: -4px; min-width: 26px; height: 26px; padding: 0 3px; box-sizing: border-box; border-radius: 999px; color: #fff; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2.5px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); animation: unbPulse 1.6s ease-in-out infinite; }
.avwrap .unb-a { top: -4px; background: #dc2626; }
.avwrap .unb-d { bottom: -2px; background: #2563eb; }
@keyframes unbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@media (prefers-reduced-motion: reduce) { .avwrap .unb { animation: none; } }
.cell .nm { font-weight: 800; font-size: 15px; line-height: 1.25; }
.cell .co { color: var(--mute); font-size: 10.5px; line-height: 1.2; }
.cell .nopin { position: absolute; top: 8px; right: 8px; background: #fef3c7; color: #92400e; font-size: 10px; padding: 2px 6px; border-radius: 8px; font-weight: 700; }
.empty { padding: 60px 20px; text-align: center; color: var(--mute); }
/* 上部の日付・時計 (ヘッダー内・白文字) 2026-07-11 */
/* 2026-08-01 (社長): 日付の左にCoWellのロゴ(PC版ヘッダーと同じ icon-192) */
.hd-brand { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }
.hd-brand img { height: 46px; width: auto; display: block; }   /* 公式ロゴ(マーク＋COWELL)の白版 2026-08-01 */

.tclock { flex: 0 0 auto; color: #fff; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.tclock .tc-date { font-size: 40px; font-weight: 900; opacity: .95; font-variant-numeric: tabular-nums; letter-spacing: .5px; }   /* 時刻と同じ大きさに (2026-08-01) */
.tclock .tc-time { font-size: 40px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: .5px; }
/* 天気予報(設置拠点・時計の横に横並び) */
.twx { flex: 0 0 auto; color: #fff; display: flex; align-items: center; gap: 9px; }
.twx:empty { display: none; }
.twx .wx-ic { font-size: 42px; line-height: 1; }
.twx .wx-main { text-align: left; line-height: 1.1; }
.twx .wx-t { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
.twx .wx-sub { font-size: 15px; font-weight: 700; opacity: .92; white-space: nowrap; }
/* CoWell紹介ムービー ボタン + 全画面オーバーレイ */
.intro-btn { flex-shrink: 0; background: #fff; color: var(--accent-d); border: none; border-radius: 14px; padding: 12px 16px; font-size: 16px; font-weight: 800; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.14); }
.intro-btn:active { transform: scale(.96); }
/* ログイン画面の言語切替(未認証・その場で翻訳。ログイン前に自分を探しやすく) */
.lang-sw { flex: 0 0 auto; display: flex; gap: 5px; }
.lang-b { border: 2px solid rgba(255,255,255,.55); background: rgba(255,255,255,.15); color: #fff; border-radius: 10px; padding: 7px 11px; font-size: 14px; font-weight: 800; line-height: 1; cursor: pointer; font-family: inherit; white-space: nowrap; }
.lang-b.on { background: #fff; border-color: #fff; color: #0e7490; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
.lang-b:active { transform: scale(.94); }
/* ヘッダーに移動したスマホQR(濃色背景に合わせ白文字) */
.hd .qr-mini { flex: 0 0 auto; text-align: center; }
.hd .qr-mini .qr-img { width: 64px; height: 64px; background: #fff; border-radius: 8px; padding: 3px; box-sizing: border-box; }
.hd .qr-mini .qr-img img, .hd .qr-mini .qr-img svg { width: 100%; height: 100%; display: block; }
.hd .qr-mini .qr-cap { font-size: 11px; color: #fff; font-weight: 800; margin-top: 2px; }
.intro-ov { display: none; position: fixed; inset: 0; z-index: 1000; background: #000; flex-direction: column; }
.intro-ov.show { display: flex; }
.intro-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #0f172a; color: #fff; font-weight: 800; font-size: 16px; flex-shrink: 0; }
.intro-close { background: var(--danger); color: #fff; border: none; border-radius: 12px; padding: 10px 20px; font-size: 16px; font-weight: 800; cursor: pointer; }
.intro-close:active { transform: scale(.96); }
.intro-ov iframe { flex: 1; width: 100%; border: none; background: #000; }
/* PINモーダル */
/* タブレット横向き固定運用では、モーダルを「背景ごとスクロール」にしないと下部の登録ボタンが画面外に消える。
   align-items:flex-start + overflow-y:auto(bg) + margin:auto(modal) で「収まる時は中央・はみ出す時は上寄せでスクロール」。 */
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.55); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 100; padding: 16px; }
.modal-bg.show { display: flex; }
.modal { background: #fff; width: 100%; max-width: 380px; border-radius: 18px; padding: 24px 20px; text-align: center; margin: auto; max-height: none; }
.modal .who { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; }
.modal .who .av { width: 80px; height: 80px; border-radius: 50%; background: #f1f5f9; display: flex; align-items: center; justify-content: center; font-size: 36px; overflow: hidden; }
.modal .who .av img { width: 100%; height: 100%; object-fit: cover; }
.modal .who .nm { font-weight: 800; font-size: 18px; }
.modal h3 { margin: 4px 0 14px 0; font-size: 16px; color: var(--mute); font-weight: 500; }
.pin-dots { display: flex; justify-content: center; gap: 14px; margin: 10px 0 18px 0; }
.pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--accent); background: #fff; transition: all .15s; }
.pin-dot.on { background: var(--accent); }
.pin-dot.err { border-color: var(--danger); background: var(--danger); animation: shake .25s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.key { padding: 18px 0; font-size: 22px; font-weight: 700; background: #f1f5f9; border: none; border-radius: 16px; cursor: pointer; transition: all .08s; }
.key:active { background: #cffafe; transform: scale(.96); }
.key.fn { background: #fee2e2; color: #991b1b; font-size: 16px; font-weight: 600; }
.key.fn.ok { background: var(--accent); color: #fff; }
.msg { color: var(--danger); font-size: 13px; min-height: 18px; margin: 6px 0 10px 0; }
.msg.info { color: var(--mute); }
.foot { text-align: center; padding: 14px; color: var(--mute); font-size: 12px; }
.foot a { color: var(--accent-d); text-decoration: none; font-weight: 600; }
/* 所属選択＋ロック(五十音行の右) */
.kana-row #f-co { flex: 0 0 auto; min-width: 150px; max-width: 230px; padding: 9px 10px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 15px; font-weight: 700; color: var(--accent-d); background: #fff; }
.kana-row .lockbtn { flex: 0 0 auto; padding: 9px 11px; border: 1.5px solid #cbd5e1; border-radius: 12px; background: #fff; font-size: 16px; cursor: pointer; }
/* 五十音タブ */
/* 五十音タブ＋所属選択＋ロックを1行に(「他」の右に控えめに) */
.kana-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; background: #fff; border-bottom: 1px solid var(--border); }
.kana-tabs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.kana-tab { min-width: 46px; padding: 10px 6px; border: 2px solid #cbd5e1; border-radius: 12px; background: #fff; font-size: 20px; font-weight: 800; color: #334; cursor: pointer; }
.kana-tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
/* ===== 個人スマホ(?personal=1)の名前選択UI: 五十音を主役に・拠点は使わず全員から・片手で押しやすい1列の大きな行 ===== */
body.personal #f-co,
body.personal .lockbtn { display: none !important; }   /* 拠点セレクト/固定は個人スマホでは使わない(ロックで選べなくなるのを防ぐ) */
body.personal .kana-tabs { position: sticky; top: 0; z-index: 6; gap: 8px; padding: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
body.personal .kana-tab { min-width: 52px; padding: 12px 8px; font-size: 22px; border-radius: 14px; }
body.personal .kana-hint { text-align: center; font-size: 15px; font-weight: 800; color: #0f766e; padding: 10px 12px 2px; }
body.personal .list { display: block; max-width: 620px; padding: 8px 12px 12px; }
body.personal .cell { flex-direction: row; text-align: left; align-items: center; min-height: 0; gap: 14px; padding: 14px 16px; margin-bottom: 10px; border-radius: 18px; }
body.personal .cell .av { width: 62px; height: 62px; font-size: 28px; flex: 0 0 auto; }
body.personal .cell .pinfo { flex: 1; min-width: 0; }
body.personal .cell .nm { font-size: 22px; }
body.personal .cell .co { font-size: 13px; margin-top: 2px; }
body.personal .cell .go { flex: 0 0 auto; color: var(--accent); font-size: 26px; font-weight: 900; }
body.personal .cell .nopin { position: static; margin-left: auto; }
/* ⭐2026-08-02: この端末が覚えている本人と違う人が使う時の逃げ道。
   QRから来ると覚えている本人のPINをいきなり聞くため、名簿へ戻る道を必ず出す。 */
.other-btn { display:block; margin: 8px auto 0; background:#f1f5f9; border:1px solid #cbd5e1; border-radius:10px;
  font-family:inherit; font-weight:800; font-size:13px; color:#475569; padding:8px 16px; cursor:pointer; }
/* 2026-08-01 (社長): QRから来た人は『自分のアバターを見つけるだけ』にする。
   時計・天気・言語切替・紹介動画など、ログインに要らないものは個人スマホでは隠し、
   名前検索とアバターを大きくして探しやすくする。 */
body.personal .tclock,
body.personal .twx,
body.personal .lang-sw,
body.personal .intro-btn { display: none !important; }
body.personal .hd { padding: 12px 14px; }
body.personal .hd .ttl { font-size: 20px; }
body.personal .hd .sub { font-size: 15px; font-weight: 700; }
body.personal .cell { padding: 16px 16px; margin-bottom: 12px; background: #fff; border: 2px solid #e2e8f0; box-shadow: 0 2px 8px rgba(15,23,42,.06); }
body.personal .cell:active { background: #f0f9ff; border-color: #38bdf8; }
body.personal .cell .av { width: 78px; height: 78px; font-size: 34px; }
body.personal .cell .nm { font-size: 25px; font-weight: 900; }
body.personal .cell .co { font-size: 13px; color: #64748b; }
body.personal .cell .checkin, body.personal .cell .unb { display: none !important; }   /* 出勤済✓・未読バッジはログイン前には不要 */
body.personal .psearch { position: sticky; top: 0; z-index: 7; background: #f8fafc; padding: 10px 12px 8px; }
body.personal .psearch input { width: 100%; box-sizing: border-box; font-size: 20px; font-weight: 700; padding: 14px 16px; border: 2px solid #94a3b8; border-radius: 14px; outline: none; }
body.personal .psearch input:focus { border-color: #0284c7; }
body.personal .psearch .pshint { font-size: 13px; font-weight: 700; color: #475569; padding: 6px 2px 0; }
/* ページャ */
.pager { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 6px 10px 16px; }
.pager button { min-width: 72px; padding: 12px 18px; font-size: 20px; font-weight: 800; border: none; border-radius: 12px; background: var(--accent); color: #fff; cursor: pointer; }
.pager button:disabled { background: #cbd5e1; cursor: default; }
.pager .pg { font-size: 18px; font-weight: 800; color: #334; }

/* 個人スマホ誘導パネル (QR + Wi-Fi) */
.invite-panel {
  background: linear-gradient(135deg, #ecfeff, #d5f2ee);
  border-bottom: 2px solid #9ee5df;
  padding: 14px 18px;
  display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap;
}
.invite-box {
  background: #fff; border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; display: flex; gap: 14px; align-items: center;
  flex: 1; min-width: 280px;
  box-shadow: 0 2px 6px rgba(15,23,42,0.05);
}
.invite-box .qr-img { width: 130px; height: 130px; background: #fff; border-radius: 12px; flex-shrink: 0; }
.invite-box .qr-img img, .invite-box .qr-img svg { width: 100%; height: 100%; display: block; }
.invite-box .qr-meta { flex: 1; min-width: 0; }
.invite-box .qr-meta .title { font-size: 16px; font-weight: 800; color: var(--accent-d); margin-bottom: 4px; }
.invite-box .qr-meta .desc { font-size: 12px; color: var(--mute); line-height: 1.55; margin-bottom: 6px; }
.invite-box .qr-meta .url { font-size: 13px; color: #0f172a; font-weight: 700; word-break: break-all; }
.invite-box.wifi .title { color: #0b4f52; }
.invite-box.wifi .ssid { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 2px; }
.invite-box.wifi .pw { font-size: 14px; color: #475569; font-family: ui-monospace, "Menlo", monospace; background: #f1f5f9; padding: 2px 8px; border-radius: 10px; display: inline-block; }
.invite-box.wifi .empty-msg { font-size: 12px; color: #94a3b8; line-height: 1.6; }
.invite-box .pw-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
.invite-box .pw-toggle { background: #e2e8f0; border: none; padding: 3px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; color: #475569; }
.invite-box .meta-foot { font-size: 10px; color: #94a3b8; margin-top: 4px; }
@media (max-width: 720px) {
  .invite-box .qr-img { width: 100px; height: 100px; }
}
</style>
<script src="/version-check.js" defer></script>

<style id="biz-udp-global">
html,body,button,input,select,textarea{font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}
body :not(code):not(pre):not(kbd):not(samp):not(tt):not([style*="monospace"]):not([style*="Consolas"]):not([style*="SF Mono"]):not([style*="Mincho"]):not([style*="游明朝"]):not([style*="Yu Mincho"]){font-family:"BIZ UDPGothic","BIZ UDPゴシック",-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif!important}

<body>
<div class="hd">
  <!-- 2026-08-01 (社長): 見出しと説明文は削除。名簿と時計に集中させる。
       ⚠️個人スマホ(?personal=1)では .hd .sub を書き換えていた処理があるため、
       参照が無くても落ちないよう JS 側は null チェック済み。 -->
  <div class="hd-brand"><img src="/assets/brand/cowell-logo-white-v3.png" alt="CoWell"></div>
  <div style="flex:1;min-width:0;"></div>
  <div id="tabletClock" class="tclock"></div>
  <div id="tabletWx" class="twx"></div>
  <div class="lang-sw" id="langSw" data-no-translate>
    <button type="button" class="lang-b on" data-lang="ja" onclick="setLoginLang('ja')">日本語</button>
    <button type="button" class="lang-b" data-lang="pt" onclick="setLoginLang('pt')">Português</button>
    <button type="button" class="lang-b" data-lang="en" onclick="setLoginLang('en')">English</button>
  </div>
  <button type="button" class="intro-btn" onclick="openIntro()">▶ CoWellってなに？</button>
  <div class="qr-mini">
    <div class="qr-img" id="qr-url"></div>
    <div class="qr-cap">📱スマホ</div>
    <span id="qr-url-text" style="display:none"></span>
  </div>
</div>
<div class="kana-row">
  <div class="kana-tabs" id="kanaTabs"></div>
  <select id="f-co"><option value="">全拠点</option></select>
  <button type="button" id="co-lock" title="この端末を選択中の拠点に固定（他拠点の氏名を隠す）" onclick="toggleCoLock()" class="lockbtn">🔓</button>
</div>
<div id="list" class="list"><div class="empty">読み込み中…</div></div>
<div id="pager" class="pager"></div>

<div id="modal" class="modal-bg" onclick="if(event.target.id==='modal') closeModal()">
  <div class="modal">
    <div class="who">
      <div class="av" id="m-av">👤</div>
      <div class="nm" id="m-nm">…</div>
      <button type="button" class="other-btn" onclick="pickOtherPerson()">別の人が つかう</button>
    </div>
    <h3>4桁PINを入力</h3>
    <div class="pin-dots" id="m-dots">
      <div class="pin-dot"></div><div class="pin-dot"></div>
      <div class="pin-dot"></div><div class="pin-dot"></div>
    </div>
    <div class="msg" id="m-msg"></div>
    <div class="keypad">
      <button class="key" onclick="kp(1)">1</button>
      <button class="key" onclick="kp(2)">2</button>
      <button class="key" onclick="kp(3)">3</button>
      <button class="key" onclick="kp(4)">4</button>
      <button class="key" onclick="kp(5)">5</button>
      <button class="key" onclick="kp(6)">6</button>
      <button class="key" onclick="kp(7)">7</button>
      <button class="key" onclick="kp(8)">8</button>
      <button class="key" onclick="kp(9)">9</button>

<!-- 初回設定モーダル: アバタータップ→顔写真撮影+ニックネーム+PIN→そのままログイン (本人確認なし/生年月日はマイページ) -->
<div id="setup-modal" class="modal-bg" onclick="if(event.target.id==='setup-modal') closeSetup()">
  <div class="modal">
    <div class="who">
      <div class="av" id="s-av">👤</div>
      <div class="nm" id="s-nm">…</div>
    </div>
    <h3 id="s-title" style="margin:4px 0 6px 0;">はじめての方の初回設定</h3>
    <div id="s-desc" style="font-size:12px;color:#64748b;margin-bottom:12px;line-height:1.5;">顔写真を撮影し、ニックネームと4桁PINを決めてください。次回からはアバターをタップ→PINでログインできます。</div>
    <!-- 顔写真撮影 (任意) -->
    <div id="s-cam-wrap" style="margin-bottom:12px;">
      <div style="position:relative;width:160px;height:160px;margin:0 auto;border-radius:16px;overflow:hidden;background:#0f172a;">
        <video id="s-video" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;display:block;"></video>
        <img id="s-photo" alt="" style="width:100%;height:100%;object-fit:cover;display:none;">
      </div>
      <canvas id="s-canvas" style="display:none;"></canvas>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap;">

        <button type="button" id="s-gen" style="padding:8px 16px;border-radius:10px;display:none;background:#7c3aed;color:#fff;border:none;font-weight:800;cursor:pointer;" onclick="genAvatar()">✨ AIアバターを作成</button>
        <button type="button" id="s-retake" class="key fn" style="padding:8px 16px;border-radius:10px;display:none;" onclick="retakePhoto()">↺ 撮り直す</button>

    </div>
    <div style="text-align:left;display:flex;flex-direction:column;gap:11px;">
      <label id="s-nick-wrap" style="font-size:12px;font-weight:700;color:#0f172a;">ニックネーム

      </label>
      <label style="font-size:12px;font-weight:700;color:#0f172a;">新しいPIN（4桁）

      </label>
      <label style="font-size:12px;font-weight:700;color:#0f172a;">PIN（確認）
        <input id="s-pin2" type="tel" inputmode="numeric" maxlength="4" placeholder="もう一度入力" style="width:100%;box-sizing:border-box;margin-top:4px;padding:12px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;letter-spacing:6px;">
      </label>
      <label id="s-birth-wrap" style="font-size:12px;font-weight:700;color:#0f172a;">生年月日（和暦）
        <div style="display:flex;gap:6px;margin-top:4px;align-items:stretch;">
          <select id="s-era"   style="flex:1.3;min-width:0;box-sizing:border-box;padding:12px 4px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:700;color:#0f172a;background:#fff;text-align:center;"></select>
          <select id="s-eyear" style="flex:1;min-width:0;box-sizing:border-box;padding:12px 4px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:700;color:#0f172a;background:#fff;text-align:center;"></select>
          <select id="s-month" style="flex:1;min-width:0;box-sizing:border-box;padding:12px 4px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:700;color:#0f172a;background:#fff;text-align:center;"></select>
          <select id="s-day"   style="flex:1;min-width:0;box-sizing:border-box;padding:12px 4px;border:1.5px solid #cbd5e1;border-radius:12px;font-size:18px;font-weight:700;color:#0f172a;background:#fff;text-align:center;"></select>
        </div>
        <span style="display:block;font-weight:400;color:#94a3b8;font-size:11px;margin-top:2px;">健康チェックに使います（本人が入力）</span>
      </label>
    </div>
    <div class="msg" id="s-msg" style="margin-top:10px;"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button type="button" class="key fn" style="flex:1;padding:14px;border-radius:12px;" onclick="closeSetup()">戻る</button>
      <button type="button" id="s-go" style="flex:2;padding:14px;border-radius:12px;background:#0e7490;color:#fff;border:none;font-weight:800;font-size:16px;cursor:pointer;" onclick="submitSetup()">設定して入る</button>
    </div>
  </div>
</div>

var _tapEl=null, _goEl=null, _tapCtx=null;
function tapSoundOn(){ try{ return localStorage.getItem('cohub_tap_sound')!=='0'; }catch(e){ return true; } }
// ⚠️2026-08-02: WebAudioだけでは端末によって鳴らなかった。読み上げと同じ<audio>方式を主にする。
//   ⚠️最初のタップの中で1回鳴らして「枠」を押さえること([[autoplay_audio_prime]]と同じ理屈)。
function _tapPrime(){
  try{
    if(!_tapEl){ _tapEl=new Audio(_TAP_WAV); _tapEl.preload='auto'; _tapEl.volume=0.85; }
    if(!_goEl){  _goEl =new Audio(_GO_WAV);  _goEl.preload='auto';  _goEl.volume=0.85; }
    [_tapEl,_goEl].forEach(function(el){ el.muted=true; var p=el.play(); if(p&&p.then)p.then(function(){ try{el.pause();el.currentTime=0;el.muted=false;}catch(e){} }).catch(function(){ el.muted=false; }); });
    if(!_tapCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(AC){ _tapCtx=new AC(); } }
    if(_tapCtx && _tapCtx.state!=='running' && _tapCtx.resume){ _tapCtx.resume().catch(function(){}); }
  }catch(e){}
}
function tapSound(kind){
  if(!tapSoundOn()) return;
  var el=(kind==='go')?_goEl:_tapEl;
  try{
    if(!el){ _tapPrime(); el=(kind==='go')?_goEl:_tapEl; }
    if(el){ el.muted=false; el.currentTime=0; var p=el.play(); if(p&&p.catch)p.catch(function(){ _tapBeep(kind); }); }
    else { _tapBeep(kind); }
  }catch(e){ _tapBeep(kind); }
  try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){}   // 音を切っていても手応えは残す
}
// 予備: <audio>が鳴らせない時だけWebAudioで作る
function _tapBeep(kind){
  try{
    if(!_tapCtx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; _tapCtx=new AC(); }
    var ctx=_tapCtx, go=function(){
      var t=ctx.currentTime+0.005, o=ctx.createOscillator(), g=ctx.createGain();
      var f=(kind==='go')?900:660;
      o.type='triangle'; o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.75, t+0.08);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3, t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.12);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+0.13);
    };
    if(ctx.state==='running') go(); else if(ctx.resume) ctx.resume().then(go).catch(function(){});
  }catch(e){}
}
['pointerdown','touchstart','mousedown'].forEach(function(ev){

});
// 個々のonclickには手を入れず、押された要素をまとめて拾う(取りこぼし・二重付けが起きない)
document.addEventListener('pointerdown', function(ev){

  var el=t.closest('button, a, .tile, .pgtab, .key, .listitem, [onclick]');

}, {passive:true, capture:true});

};

// DBの会社一覧を取得し、名称(CO_NAMES)を最新化。1回だけ。
async function loadCompanies() {

// 拠点別Wi-Fi (タブレットキオスク用)
let branchWifi = {};
let wifiPwRevealed = false;

function setQrUrl() {
  // 個人スマホ向けログイン誘導 → PINだけで入れる個人ログイン(?personal=1)。ID/パスワード不要。
  const url = location.origin + '/tablet?personal=1';
  document.getElementById('qr-url-text').textContent = url;
  const img = document.createElement('img');
  img.src = '/api/branch-wifi/qr?t=' + encodeURIComponent(url);
  img.alt = 'CoWell QR';
  const box = document.getElementById('qr-url');
  box.innerHTML = '';
  box.appendChild(img);
}

async function loadBranchWifi() {
  try {
    const r = await fetch('/api/branch-wifi/list').then(x => x.json());
    if (r && r.success) {
      branchWifi = {};
      for (const b of r.branches || []) branchWifi[b.code] = b;
    }
  } catch (e) {}
  updateWifiPanel();
}

function updateWifiPanel() {
  return; // Wi-Fiパネル廃止 (2026-06-30) — 以下は未到達
  const code = document.getElementById('f-co').value;
  // 全拠点(空) or 該当拠点なし
  const w = code ? branchWifi[code] : null;
  const empty = document.getElementById('wifi-empty');
  const content = document.getElementById('wifi-content');
  const qrBox = document.getElementById('qr-wifi');
  if (!w || !w.wifi_ssid) {
    empty.style.display = '';
    content.style.display = 'none';
    qrBox.innerHTML = '';
    const hint = !code
      ? '拠点を選択するとWi-Fi情報が表示されます。'
      : 'この拠点のWi-Fi未登録。<br>推進メンバーへ登録依頼してください。';
    empty.innerHTML = hint;
    return;
  }
  empty.style.display = 'none';
  content.style.display = '';
  document.getElementById('wifi-ssid').textContent = 'SSID: ' + w.wifi_ssid;
  wifiPwRevealed = false;
  const pwEl = document.getElementById('wifi-pw');
  pwEl.textContent = '●●●●●●●●';
  pwEl.dataset.pw = w.wifi_password || '';
  document.querySelector('.pw-toggle').textContent = '表示';
  const upd = document.getElementById('wifi-updated');
  upd.textContent = w.wifi_updated_at ? '最終更新: ' + w.wifi_updated_at.slice(0, 16).replace('T', ' ') : '';
  // WiFi QR (WIFI:S:<SSID>;T:<TYPE>;P:<PASS>;;)
  const escWifi = s => String(s || '').replace(/[\\;,":]/g, c => '\\' + c);
  const sec = (w.wifi_security || 'WPA').toUpperCase();
  const wifiUri = `WIFI:S:${escWifi(w.wifi_ssid)};T:${sec};P:${escWifi(w.wifi_password || '')};;`;
  const img = document.createElement('img');
  img.src = '/api/branch-wifi/qr?t=' + encodeURIComponent(wifiUri);
  img.alt = 'WiFi QR';
  qrBox.innerHTML = '';
  qrBox.appendChild(img);
}

function toggleWifiPw() {
  const pwEl = document.getElementById('wifi-pw');
  const btn = document.querySelector('.pw-toggle');
  wifiPwRevealed = !wifiPwRevealed;
  if (wifiPwRevealed) {
    pwEl.textContent = pwEl.dataset.pw || '(空)';
    btn.textContent = '隠す';
  } else {
    pwEl.textContent = '●●●●●●●●';
    btn.textContent = '表示';
  }
}

async function init() {
  if (PERSONAL) {
    document.body.classList.add('personal');   // 個人スマホ用の名前選択UI(五十音主役・拠点なし)を有効化
    // ★個人スマホ(自分の端末)で既に有効なログインが残っていれば、名前選択もPINも省いてそのままホームへ。
    //   共用タブレット(PERSONALでない)は従来どおり常に名簿を表示(前の人が残っていても次の人が選べるように)。
    var _tk = '';
    try { _tk = localStorage.getItem('cohub_token') || ''; } catch (e) {}
    if (_tk) {
      try {
        var _me = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + _tk } }).then(function (x) { return x.json(); }).catch(function () { return null; });
        if (_me && _me.success) { goAfterLogin(); return; }   // 有効ログイン→直行(名前選択もPINも省く)
      } catch (e) {}
    }
  }
  // ?demo=1 ならログイン済みでもキオスク画面を表示 (PC版からのプレビュー用)
  const params = new URLSearchParams(location.search);
  const urlCo = (params.get('co') || '').trim();   // 営業所専用URL: ?co=拠点コード でその拠点に固定
  const demoMode = params.get('demo') === '1';
  // /tablet は常に名簿を表示する (ログイン済みでも自分のホームへ自動遷移しない・余計なリンクも出さない)。
  // ＝設置者がログイン中でも拠点選択に到達でき、前の人のセッションが残っていても名簿に戻れる。
  // 個人端末で自分のホームを見たい人は /home を直接開けばよい。
  if (demoMode) {
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#fef3c7;color:#92400e;padding:8px 14px;font-size:12px;text-align:center;border-bottom:1px solid #fde68a;';
    banner.innerHTML = '👀 プレビューモード (PC版からの表示確認)　<a href="/home" style="color:#0e7490;font-weight:700;">← ホームに戻る</a>';
    document.body.insertBefore(banner, document.body.firstChild);
  }
  setQrUrl();
  await loadRoster(urlCo);
  loadCheckedIn();
  loadUnread();      // 通達/メッセージの未読バッジ   // 出勤(ログイン)済みのアバターにバッジ
  setInterval(loadCheckedIn, 90 * 1000);
  setInterval(loadUnread, 90 * 1000);   // 90秒ごと更新(誰かが後からログインしても反映)
  startTabletClock();   // 上部に日付・時計
  loadWeather();   // 設置拠点の天気
  setInterval(loadWeather, 30 * 60 * 1000);   // 30分ごと更新
  // URL ?co= が指定されていれば、その拠点に固定（営業所専用URL）。指定が最優先。
  if (urlCo) {
    // ?co= は初期選択のみ。端末を拠点に固定しない (2026-08-01)
    try { var _s=document.getElementById('f-co'); if(_s) _s.value=urlCo; } catch (e) {}
  } else {
    // 前回選択した拠点を復元
    try {
      const saved = localStorage.getItem('cohub_tablet_co');
      if (saved && document.querySelector('#f-co option[value="' + saved + '"]')) {
        document.getElementById('f-co').value = saved;
        render();
        updateWifiPanel();
      }
    } catch (e) {}
  }
  applyCoLock();  // 拠点固定が設定されていれば適用 (他拠点の氏名露出を防ぐ)
  document.getElementById('f-co').addEventListener('change', () => {
    curPage = 0;
    render();
    updateWifiPanel();
    try { localStorage.setItem('cohub_tablet_co', document.getElementById('f-co').value); } catch (e) {}
    loadWeather();   // 拠点変更で天気も更新
  });
  // 数字キー対応 (BTキーボード/外付け用)
  document.addEventListener('keydown', e => {
    if (!document.getElementById('modal').classList.contains('show')) return;
    if (submitting || greeting) { e.preventDefault(); return; }   // 認証中/あいさつ中は入力無効(自動入室のみ・早期入室防止)
    if (/^[0-9]$/.test(e.key)) { kp(parseInt(e.key)); }
    else if (e.key === 'Backspace') kpBack();
    else if (e.key === 'Escape') closeModal();
    else if (e.key === 'Enter') e.preventDefault();   // PINは4桁で自動確定・Enter不要。Enterでの早期入室を無効化
  });

  // ===== 個人スマホ(?personal=1): 自分の端末なので使い勝手を最適化 =====
  if (PERSONAL) {
    // 「📱スマホ」QRは自分のスマホ上では無意味なので隠す。
    var _qm = document.querySelector('.qr-mini'); if (_qm) _qm.style.display = 'none';
    var _sub = document.querySelector('.hd .sub'); if (_sub) _sub.textContent = '自分の写真をタップしてください';
    // 名前でしぼり込む欄を名簿の上に置く (166名から自分を探すのが一番の手間だったため)
    try {
      var _lst = document.getElementById('list');
      if (_lst && !document.getElementById('pSearch')) {
        var _w = document.createElement('div'); _w.className = 'psearch';
        _w.innerHTML = '<input id="pSearch" type="search" inputmode="text" autocomplete="off" placeholder="名前を 入れて さがす">'
          + '<div class="pshint">ひらがな・漢字のどちらでも さがせます</div>';
        _lst.parentNode.insertBefore(_w, _lst);
        document.getElementById('pSearch').addEventListener('input', function(){ PQ = this.value.trim(); render(); });
      }
    } catch (e) {}
    // 前回この端末でログインした本人を記憶していれば、名簿を出さずいきなりPIN入力へ(=PINだけで入れる)。
    // 別の人が使う時はPINモーダルを閉じれば名簿に戻れる。
    try {
      var _puid = localStorage.getItem('cohub_personal_uid') || '';
      if (_puid && users.some(function (u) { return u.id === _puid; })) { openPin(_puid); }
    } catch (e) {}
  }
}

// 設置拠点(選択/ロック中のco)の天気を取得して時計の横に表示。サーバー(Open-Meteo)経由・30分キャッシュ。

function startTabletClock() {
  const el = document.getElementById('tabletClock'); if (!el) return;
  function tick() {
    const d = new Date();
    const w = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
    const hh = ('0' + d.getHours()).slice(-2), mm = ('0' + d.getMinutes()).slice(-2);
    el.innerHTML = '<div class="tc-date">' + (d.getMonth() + 1) + '月' + d.getDate() + '日（' + w + '）</div><div class="tc-time">' + hh + ':' + mm + '</div>';
  }
  tick();
  if (window._tabletClockTimer) clearInterval(window._tabletClockTimer);
  window._tabletClockTimer = setInterval(tick, 1000);
}

// ===== 設置端末の登録 (2026-08-04) =====
//  ログイン前の名前選択は全社員の氏名を出すため、「正規の設置端末か」を見分ける必要がある。
//  事業所ネットワークから1回だけ登録して端末トークンを保存し、以後はそれで名乗る。
//  ⚠️IPで見分ける方式は続かない(実測で拠点のグローバルIPは1か月半に2回入れ替わっていた)。
//  ⚠️個人スマホでこの画面を開いても、事業所ネットワーク外なら登録できない=名簿は出せない。
var DEVICE_KEY = 'cohub_device_token';
function devHeaders() {
  var t = '';
  try { t = localStorage.getItem(DEVICE_KEY) || ''; } catch (e) {}
  return t ? { 'X-Device-Token': t } : {};
}
async function ensureDeviceToken(co, loginToken) {
  try {
    if (localStorage.getItem(DEVICE_KEY)) return;
    // ⚠️登録するのは「共用タブレットとして使われている端末」だけ。
    //   事業所ネットワークにある個人PCが /tablet を開いただけで登録されると、
    //   その後どこへ持ち出しても名簿が開ける端末が増えてしまう(2026-08-04 実際に2台登録された)。
    //   キオスク印(cohub_kiosk)は共用タブレットでPINログインしたときに付く。
    if (PERSONAL || localStorage.getItem('cohub_kiosk') !== '1') return;
    // ログイン直後は そのトークンを添える=事業所ネットワークの許可リストに載っていない拠点でも登録できる
    var hdr = { 'Content-Type': 'application/json' };
    if (loginToken) hdr['Authorization'] = 'Bearer ' + loginToken;
    var r = await fetch('/api/auth/device-register', {
      method: 'POST', headers: hdr,
      body: JSON.stringify({ co: co || '', label: (navigator.userAgent || '').slice(0, 60) }),
    }).then(function (x) { return x.json(); }).catch(function () { return null; });
    if (r && r.success && r.device_token) localStorage.setItem(DEVICE_KEY, r.device_token);
  } catch (e) { /* 登録できなくても従来どおり動く(事業所ネットワーク判定にフォールバック) */ }
}

async function loadRoster(co) {
  await ensureDeviceToken(co);
  const qs = co ? ('?co=' + encodeURIComponent(co)) : '';
  const r = await fetch('/api/auth/tablet-roster' + qs, { headers: devHeaders() }).then(x => x.json()).catch(()=>null);
  if (!r || !r.success) { document.getElementById('list').innerHTML = '<div class="empty">読み込みに失敗しました</div>'; return; }
  users = r.users || [];
  companyCodes = new Set(users.map(u => u.company_code || ''));
  await loadCompanies(); // DB会社名・空拠点(天竜工場など)をセレクタへ
  const sel = document.getElementById('f-co');
  // 名簿に居る会社 ∪ DB登録の全拠点(空でも選べる) を統合
  const codes = new Set([...companyCodes].filter(Boolean));
  ALL_COMPANIES.forEach(c => { if (c && c.code) codes.add(c.code); });
  sel.innerHTML = '<option value="">全拠点</option>';
  for (const c of [...codes].sort((a, b) => coName(a).localeCompare(coName(b), 'ja'))) {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = coName(c);
    sel.appendChild(opt);
  }
  if (!Object.keys(ROSTER_YOMI).length) {
    try { ROSTER_YOMI = (await fetch('/assets/roster_yomi.json', { headers: devHeaders() }).then(x => x.json()).catch(function(){ return {}; })) || {}; } catch (e) {}
  }
  buildKanaTabs();
  render();
}

// ===== 五十音ソート/ページング (名前検索の代わり) =====
var ROSTER_YOMI = {}, curKana = 'すべて', curPage = 0, PER = 18;   // 6列×3行(新着ティッカー撤去で1行増)
var KANA_ORDER = ['すべて','あ','か','さ','た','な','は','ま','や','ら','わ','他'];
function kanaRow(y){
  var c = (y || '').charAt(0);
  var G = { 'あ':'アイウエオヴ','か':'カキクケコガギグゲゴ','さ':'サシスセソザジズゼゾ','た':'タチツテトダヂヅデドッ','な':'ナニヌネノ','は':'ハヒフヘホバビブベボパピプペポ','ま':'マミムメモ','や':'ヤユヨャュョ','ら':'ラリルレロ','わ':'ワヲンヰヱ' };
  for (var k in G) { if (G[k].indexOf(c) >= 0) return k; }
  return '他';
}
function buildKanaTabs(){
  var el = document.getElementById('kanaTabs'); if (!el) return;
  el.innerHTML = KANA_ORDER.map(function(k){ return '<button class="kana-tab'+(k===curKana?' on':'')+'" onclick="setKana(\''+k+'\')">'+k+'</button>'; }).join('');
}
function setKana(k){ curKana = k; curPage = 0; buildKanaTabs(); render(); }
function pageStep(d){ curPage += d; render(); }
function render() {
  var co = document.getElementById('f-co').value;
  var arr = users.slice().filter(function(u){ return !co || (u.company_code || '') === co; });
  arr.sort(function(a, b){ var ya = ROSTER_YOMI[a.id] || ('んん'+(a.display_name||'')), yb = ROSTER_YOMI[b.id] || ('んん'+(b.display_name||'')); return String(ya).localeCompare(String(yb), 'ja'); });
  if (curKana !== 'すべて') arr = arr.filter(function(u){ return kanaRow(ROSTER_YOMI[u.id]) === curKana; });
  // 個人スマホの名前検索 (氏名 or よみ の部分一致)
  if (PERSONAL && PQ) {
    var _q = PQ.replace(/[\s　]/g, '');
    arr = arr.filter(function(u){
      var nm = String(u.display_name || '').replace(/[\s　]/g, '');
      var ym = String(ROSTER_YOMI[u.id] || '').replace(/[\s　]/g, '');
      return nm.indexOf(_q) >= 0 || ym.indexOf(_q) >= 0;
    });
  }
  var el = document.getElementById('list'), pgEl = document.getElementById('pager');
  // ===== 個人スマホ: 拠点を使わず全員から五十音で。1列の大きな行・ページャなし(スクロール)・行に「もどる」矢印 =====
  if (PERSONAL) {
    if (pgEl) pgEl.innerHTML = '';
    var hint = (curKana === 'すべて')
      ? '<div class="kana-hint">上の 頭文字（あ・か・さ…）を押すと 探しやすくなります</div>'
      : '<div class="kana-hint">「'+escapeHtml(curKana)+'」で 始まる お名前</div>';
    if (!arr.length) { el.innerHTML = hint + '<div class="empty">該当者が見つかりません</div>'; return; }
    el.innerHTML = hint + arr.map(function(u){
      var av = u.avatar_url ? ('<img src="'+escapeHtml(u.avatar_url)+'" alt="">') : '👤';
      var badge = u.has_pin ? '<span class="go">›</span>' : ('<span class="nopin">' + ((u.avatar_url && u.nickname) ? 'PIN設定' : '初回設定') + '</span>');
      var click = u.has_pin ? ('onclick="openPin(\''+escapeHtml(u.id)+'\')"') : ('onclick="openSetup(\''+escapeHtml(u.id)+'\')"');
      return '<div class="cell" style="'+coStyle(u.company_code)+'" '+click+'><div class="avwrap"><div class="av">'+av+'</div>'+(CHECKED_IN[u.id]?'<span class="checkin" title="出勤済">✓</span>':'')+unbHtml(u.id)+'</div><div class="pinfo"><div class="nm">'+escapeHtml(u.display_name)+'</div><div class="co">'+escapeHtml(coName(u.company_code))+'</div></div>'+badge+'</div>';
    }).join('');
    return;
  }
  if (!arr.length) { el.innerHTML = '<div class="empty">該当者が見つかりません</div>'; if (pgEl) pgEl.innerHTML = ''; return; }
  var pages = Math.max(1, Math.ceil(arr.length / PER));
  if (curPage >= pages) curPage = pages - 1; if (curPage < 0) curPage = 0;
  var slice = arr.slice(curPage * PER, (curPage + 1) * PER);
  el.innerHTML = slice.map(function(u){
    var av = u.avatar_url ? ('<img src="'+escapeHtml(u.avatar_url)+'" alt="">') : '👤';

async function startSetupCam() {

function capturePhoto() {
  const v = document.getElementById('s-video');
  if (!v.videoWidth) return;
  const side = Math.min(v.videoWidth, v.videoHeight);
  const c = document.getElementById('s-canvas');
  c.width = 480; c.height = 480;
  const ctx = c.getContext('2d');
  const sx = (v.videoWidth - side) / 2, sy = (v.videoHeight - side) / 2;
  ctx.drawImage(v, sx, sy, side, side, 0, 0, 480, 480);
  setupPhoto = c.toDataURL('image/jpeg', 0.85);
  setupAvatarGenerated = null;
  const img = document.getElementById('s-photo');
  img.src = setupPhoto;
  img.style.display = '';
  v.style.display = 'none';

// ===== 和暦 生年月日ダイヤル (元号・年・月・日) =====
var WAREKI_ERAS = [
  { key: '昭和', base: 1925, max: 64 }, // 昭和1=1926
  { key: '平成', base: 1988, max: 31 }, // 平成1=1989
  { key: '令和', base: 2018, max: 8  }, // 令和1=2019 (2026=令和8)
  { key: '大正', base: 1911, max: 15 }, // 大正1=1912
];
function eraByKey(k) { return WAREKI_ERAS.find(function (e) { return e.key === k; }) || WAREKI_ERAS[0]; }
function fillSelect(sel, items) {
  sel.innerHTML = '';
  items.forEach(function (it) { var o = document.createElement('option'); o.value = it.v; o.textContent = it.t; sel.appendChild(o); });
}
function initWarekiBirth() {
  var eraSel = document.getElementById('s-era');
  if (eraSel.dataset.init) return;
  fillSelect(eraSel, WAREKI_ERAS.map(function (e) { return { v: e.key, t: e.key }; }));
  fillSelect(document.getElementById('s-month'), Array.from({ length: 12 }, function (_, i) { return { v: i + 1, t: (i + 1) + '月' }; }));
  eraSel.addEventListener('change', function () { syncWarekiYear(); syncWarekiDay(); });
  document.getElementById('s-eyear').addEventListener('change', syncWarekiDay);
  document.getElementById('s-month').addEventListener('change', syncWarekiDay);
  eraSel.dataset.init = '1';
}
function syncWarekiYear() {
  var era = eraByKey(document.getElementById('s-era').value);
  var cur = parseInt(document.getElementById('s-eyear').value) || 1;
  var ys = []; for (var y = 1; y <= era.max; y++) ys.push({ v: y, t: y + '年' });
  fillSelect(document.getElementById('s-eyear'), ys);
  document.getElementById('s-eyear').value = Math.min(Math.max(cur, 1), era.max);
}
function syncWarekiDay() {
  var era = eraByKey(document.getElementById('s-era').value);
  var ey = parseInt(document.getElementById('s-eyear').value) || 1;
  var mo = parseInt(document.getElementById('s-month').value) || 1;
  var dim = new Date(era.base + ey, mo, 0).getDate(); // その月の日数
  var cur = parseInt(document.getElementById('s-day').value) || 1;
  var ds = []; for (var d = 1; d <= dim; d++) ds.push({ v: d, t: d + '日' });
  fillSelect(document.getElementById('s-day'), ds);
  document.getElementById('s-day').value = Math.min(cur, dim);
}
// デフォルト 昭和60年1月1日
function setWarekiDefault() {
  initWarekiBirth();
  document.getElementById('s-era').value = '昭和';
  syncWarekiYear();
  document.getElementById('s-eyear').value = 60;
  document.getElementById('s-month').value = 1;
  syncWarekiDay();
  document.getElementById('s-day').value = 1;
}
// 和暦→西暦 YYYY-MM-DD
function wafuBirthValue() {
  var era = eraByKey(document.getElementById('s-era').value);
  var ey = parseInt(document.getElementById('s-eyear').value) || 1;
  var mo = parseInt(document.getElementById('s-month').value) || 1;
  var da = parseInt(document.getElementById('s-day').value) || 1;
  var y = era.base + ey;
  return y + '-' + String(mo).padStart(2, '0') + '-' + String(da).padStart(2, '0');
}

async function submitSetup() {
  if (setupSubmitting) return;
  const pin = document.getElementById('s-pin').value || '';
  const pin2 = document.getElementById('s-pin2').value || '';
  const msg = document.getElementById('s-msg');
  const fail = (t) => { msg.textContent = t; msg.className = 'msg'; };
  if (!/^\d{4}$/.test(pin)) return fail('PINは4桁の数字です');
  if (pin !== pin2) return fail('PIN（確認）が一致しません');
  // プロフィール登録済み(管理者など)はPINだけ。未登録者は写真+生年月日+PIN(+ニックネームは既存が無ければ入力)
  let nickname = '', birth = '';
  if (!setupProfileMode) {
    birth = wafuBirthValue();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(birth)) return fail('生年月日を選択してください');
    if (!setupHasNick) {
      nickname = (document.getElementById('s-nick').value || '').trim();
      if (nickname.length < 2 || nickname.length > 20) return fail('ニックネームは2〜20文字で入力してください');
    }
  }
  setupSubmitting = true;
  msg.textContent = '設定中…'; msg.className = 'msg info';
  try {
    // AIアバター生成済みならサーバー側で保存済み→photoを送らず既存(生成)avatarを保持
    const photoToSend = setupAvatarGenerated ? null : setupPhoto;
    // PINだけモード/ニックネーム既存はnicknameを送らない→サーバー側は既存の値を保持
    const payload = setupProfileMode
      ? { user_id: setupUid, pin }
      : (setupHasNick
          ? { user_id: setupUid, pin, photo: photoToSend }
          : { user_id: setupUid, nickname, pin, photo: photoToSend });
    const r = await fetch('/api/auth/tablet-setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({}, payload, { personal: PERSONAL })),
    }).then(x => x.json());
    if (r && r.success && r.token) {
      stopSetupCam();
      localStorage.setItem('cohub_token', r.token);
      if (!setupProfileMode && birth) {
        try { await fetch('/api/auth/birth-date', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + r.token }, body: JSON.stringify({ birth_date: birth }) }); } catch (e) {}
      }
      if (r.user) localStorage.setItem('cohub_user', JSON.stringify(r.user));
      applyLoginMode(r.token, setupUid);
      msg.textContent = '✅ 設定しました。ログインします';
      msg.className = 'msg info';
      setTimeout(goAfterLogin, 400);
      return;
    }
    fail((r && r.msg) || '設定に失敗しました');
  } catch (e) {
    fail('通信エラーが発生しました');
  } finally {
    setupSubmitting = false;
  }
}

// ===== ログイン後の音声あいさつ (女性の声=葵 ja-JP-Neural2-B) =====
// 個人情報(未読件数)はPIN認証成功後にのみ読み上げる。失敗/無音/タイムアウトでも必ずホームへ遷移。

function unlockGreetAudio() {

    greetAudio.play().then(function () { try { greetAudio.pause(); greetAudio.currentTime = 0; } catch (e) {} }).catch(function () {});
  } catch (e) { greetAudio = null; }
}
async function greetThenHome(user, token) {

  const auth = { Authorization: 'Bearer ' + token };
  const _to = (ms) => new Promise((r) => setTimeout(() => r(null), ms));   // 未読取得が遅くても声を待たせない(テンポ優先)
  let parts = [];
  try {
    const [aR, cR] = await Promise.all([
      Promise.race([fetch('/api/announcements/unread-count', { headers: auth }).then(x => x.json()).catch(() => null), _to(600)]),
      Promise.race([fetch('/api/chat/unread-count', { headers: auth }).then(x => x.json()).catch(() => null), _to(600)]),
    ]);
    const aN = aR ? (aR.count != null ? aR.count : (aR.unread || 0)) : 0;
    const cN = cR ? (cR.count != null ? cR.count : (cR.unread || 0)) : 0;
    if (aN > 0) parts.push('新しい通達が' + aN + '件あります');
    if (cN > 0) parts.push('未読のメッセージが' + cN + '件あります');
  } catch (e) {}
  let speech = parts.length ? (parts.join('。') + '。ご確認ください。') : '新しいお知らせはありません。';

  let moved = false;
  const go = function () { if (moved) return; moved = true; goAfterLogin(); };
  const safety = setTimeout(go, 8000); // 最大8秒で必ず遷移
  try {
    const res = await fetch('/api/voice/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ text: speech, voice: 'ja-JP-Neural2-B', speed: 1.2, pitch: 1.0 }),
    });
    if (!res.ok) { clearTimeout(safety); go(); return; }
    const url = URL.createObjectURL(await res.blob());
    const audio = greetAudio || new Audio();
    audio.src = url;
    audio.onended = function () { clearTimeout(safety); setTimeout(go, 150); };
    audio.onerror = function () { clearTimeout(safety); go(); };
    audio.play().catch(function () { clearTimeout(safety); go(); });
  } catch (e) { clearTimeout(safety); go(); }
}
